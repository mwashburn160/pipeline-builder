<!-- Typography: the same pairing as the app (frontend/src/lib/fonts.ts) —
     IBM Plex Sans for text, Fraunces for the wordmark and headings.

     The APP self-hosts these via `next/font/google` specifically to avoid a
     render-blocking third-party request. A Jekyll site cannot reach those build
     artifacts, so the docs take the CDN instead and mitigate what they can:
     preconnect to both hosts, and `display=swap` so text paints immediately in
     the fallback rather than blocking on the webfont. Weights are limited to
     the ones assets/css/style.scss actually uses. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<!-- Open Graph, Twitter Card, og:url, and canonical are generated PER PAGE by the
     jekyll-seo-tag plugin (the seo tag in _layouts/default.html) from each page's
     title + description, with site.* fallbacks from _config.yml. They are
     intentionally NOT hardcoded here: a static canonical / og:url would point every
     doc page at the homepage, and static og:title/description would drift. -->

<meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

<!-- Mermaid.js (ESM build — the only one reliably published for v10/11; the UMD
     dist/mermaid.min.js no longer exists, which silently breaks diagram rendering).
     kramdown/rouge wraps ```mermaid as <div class="language-mermaid">…<code>…</code>…</div>
     — the class is on the WRAPPER, not the <code> — so target the wrapper, convert each
     to <div class="mermaid">, then render. -->
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  function renderMermaid() {
    var blocks = document.querySelectorAll('div.language-mermaid, pre > code.language-mermaid');
    blocks.forEach(function (el) {
      var container = el.tagName === 'CODE' ? (el.closest('pre') || el) : el;
      var div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = el.textContent.trim();
      container.replaceWith(div);
    });
    if (blocks.length) {
      // Follow the page's colour scheme. `default` is mermaid's LIGHT theme:
      // on the dark canvas it drew pale lavender boxes with dark-on-light text,
      // legible only by accident. The stylesheet switches on
      // prefers-color-scheme, so this reads the same signal (and honours the
      // [data-theme] override the stylesheet already supports).
      var forced = document.documentElement.getAttribute('data-theme');
      var dark = forced
        ? forced === 'dark'
        : !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'default' });
      mermaid.run();
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', renderMermaid);
  else renderMermaid();
</script>

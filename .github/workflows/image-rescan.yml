# Nightly rescan of every image digest the deploy tree pins — platform services
# AND third-party images — for vulnerabilities that have a FIX available
# (deploy/bin/scan-pinned-images.sh over deploy/local/docker/docker-compose.yml).
#
# The release scans an image once, when it builds it, and only rebuilds what
# nx-affected says changed. Advisories published afterwards against a frozen
# base image or OS package were never seen again; this is the check that sees
# them. On a finding the run FAILS and opens (or updates) one tracking issue
# labelled `image-rescan`; a clean run closes it.
#
# Remediation (also written into the issue):
#   platform images    → dispatch the `release` workflow with rebuild_all=true
#                        (every image rebuilt on fresh bases, re-gated, re-pinned)
#   third-party images → bump the pinned digest (Renovate proposes these)
#
# NOTE: hand-authored (not projen-managed). grype is the SAME pinned version and
# SHA-256 as the release gate (projenrc/workflow.ts GRYPE_ENV); the deploy
# contracts hold them equal.
name: image-rescan

on:
  schedule:
    # Nightly, 05:15 UTC.
    - cron: '15 5 * * *'
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'deploy/bin/scan-pinned-images.sh'
      - '.github/workflows/image-rescan.yml'

permissions:
  contents: read

concurrency:
  group: image-rescan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rescan:
    name: rescan pinned images (fixable, at/above GRYPE_FAIL_ON)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    env:
      GRYPE_VERSION: 0.121.1
      GRYPE_SHA256: bc3ea3f9e6fd56ac781c08c6c5e614271b79f438200757f6932085c19b0a4657
      # Severity that fails the rescan — the same repo variable and default as
      # the release gate (projenrc/workflow.ts GRYPE_FAIL_ON_ENV).
      GRYPE_FAIL_ON: ${{ vars.GRYPE_FAIL_ON || 'critical' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install grype
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o /tmp/grype.tar.gz \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "${GRYPE_SHA256}  /tmp/grype.tar.gz" | sha256sum -c -
          tar -xzf /tmp/grype.tar.gz -C /tmp grype
          sudo install -m 0755 /tmp/grype /usr/local/bin/grype
          grype version

      - name: Rescan every pinned digest
        id: scan
        env:
          REPORT: ${{ runner.temp }}/image-rescan.md
        run: |
          set -uo pipefail
          bash deploy/bin/scan-pinned-images.sh; rc=$?
          [ -f "$REPORT" ] && cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      # One tracking issue, not one per night: the title is fixed and the body is
      # replaced with the latest report. Only on the schedule / dispatch runs that
      # gate main — a PR that edits the script must not open issues.
      - name: Open or update the tracking issue
        if: ${{ failure() && github.event_name != 'pull_request' && steps.scan.outputs.rc != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ runner.temp }}/image-rescan.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Pinned images have fixable vulnerabilities"
          body="$RUNNER_TEMP/issue.md"
          { [ -f "$REPORT" ] && cat "$REPORT" || echo "The rescan failed before writing a report (rc=${{ steps.scan.outputs.rc }})."; echo; echo "Run: $RUN_URL"; } > "$body"
          gh label create image-rescan --color B60205 --description "Nightly pinned-image rescan findings" 2>/dev/null || true
          num=$(gh issue list --state open --label image-rescan --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue edit "$num" --body-file "$body"
            gh issue comment "$num" --body "Still failing: $RUN_URL"
          else
            gh issue create --title "$TITLE" --label image-rescan --body-file "$body"
          fi

      - name: Close the tracking issue when clean
        if: ${{ success() && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          for num in $(gh issue list --state open --label image-rescan --json number --jq '.[].number'); do
            gh issue close "$num" --comment "Rescan clean: $RUN_URL"
          done

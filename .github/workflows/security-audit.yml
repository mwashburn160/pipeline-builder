# Dependency security audit. Runs `pnpm audit` on a schedule (and on demand) to
# surface known-vulnerable dependencies. Kept as a SEPARATE, scheduled workflow
# rather than Dependabot because this repo is projen-managed — `package.json` is
# generated from `.projenrc.ts`, so a Dependabot bump to `package.json` would be
# reverted by the next `projen synth`. Remediation is therefore done in
# `.projenrc.ts` (pnpm-workspace `minimumReleaseAge` + pinned deps) and verified here.
#
# NOTE: hand-authored (not projen-managed); a report-only gate — it audits, it
# does not build or deploy.
name: security-audit

on:
  schedule:
    # Weekly, Monday 07:00 UTC.
    - cron: '0 7 * * 1'
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'pnpm-lock.yaml'
      - '.github/workflows/security-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      # `--prod` scopes to runtime dependencies; `--audit-level high` fails the job
      # on High/Critical advisories so they're actioned, while tolerating Low/Moderate
      # dev-only noise. Adjust the level here if the maintainer wants stricter/looser.
      #
      # The same command is the projen `audit` task (declared in `.projenrc.ts`, run
      # locally with `pnpm dlx projen audit` from `packages/pipeline-manager`). Keep
      # the two in step: a different flag set here means a clean local run can still
      # fail the schedule.
      - name: pnpm audit (production deps, high+)
        run: pnpm audit --prod --audit-level high

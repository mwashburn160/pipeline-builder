name: nightly-smoke
on:
  schedule:
    - cron: 17 5 * * *
  workflow_dispatch:
    inputs:
      skip_synth:
        description: "Skip init-platform (the toolchain build) and the synth: boot + device-flow login + status only"
        type: boolean
        required: false
        default: false
jobs:
  nightly_smoke:
    name: compose smoke (boot + CLI login/status/synth)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      SMOKE_SKIP_SYNTH: ${{ inputs.skip_synth && 'true' || 'false' }}
    steps:
      - name: Disable Nx telemetry and daemon
        id: disable_nx_telemetry_and_daemon
        run: echo NX_TELEMETRY_DISABLED=1 >> $GITHUB_ENV && echo NX_DAEMON=false >> $GITHUB_ENV
      - name: Checkout repository
        id: checkout_repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Setup pnpm
        id: setup_pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 12.14.0
      - name: Setup node
        id: setup_node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          cache: pnpm
          node-version: 26.13.1
          package-manager-cache: pnpm
      - name: Configure npm registry
        id: configure_npm_registry
        env:
          NPM_TOKEN_ENCODED: ${{ secrets.NPM_TOKEN_ENCODED }}
        run: |-
          set -euo pipefail
          NPM_TOKEN="$(printf "%s" "$NPM_TOKEN_ENCODED" | base64 -d)"
          if [ -n "$NPM_TOKEN" ]; then
            echo "::add-mask::$NPM_TOKEN"
            NPMRC="$(npm config get userconfig)"
            touch "$NPMRC" && chmod 600 "$NPMRC"
            printf "//registry.npmjs.org/:_authToken=%s\n" "$NPM_TOKEN" >> "$NPMRC"
          else
            echo "NPM_TOKEN_ENCODED is not available; continuing without npm auth"
          fi
          npm config set @pipeline-builder:registry=https://registry.npmjs.org/
      - name: Install dependencies
        id: install_dependencies
        run: pnpm install --frozen-lockfile
      - name: Smoke work dir
        id: smoke_work_dir
        run: echo "SMOKE_DIR=$RUNNER_TEMP/compose-smoke" >> "$GITHUB_ENV"
      - name: Build the CLI
        id: build_the_cli
        run: pnpm nx run @pipeline-builder/pipeline-manager:post-compile
      - name: Boot deploy/local/docker
        id: boot_deploy_local_docker
        run: bash packages/pipeline-manager/test/e2e/compose-smoke.sh up
      - name: Initialize the platform (admin + managed toolchain release)
        id: initialize_the_platform_admin_managed_toolchain_release
        if: env.SMOKE_SKIP_SYNTH != 'true'
        run: bash packages/pipeline-manager/test/e2e/compose-smoke.sh init
      - name: CLI smoke (device-flow login, status, pipeline create + synth)
        id: cli_smoke_device-flow_login_status_pipeline_create_synth
        run: bash packages/pipeline-manager/test/e2e/compose-smoke.sh run
      - name: Collect logs
        id: collect_logs
        if: failure()
        run: bash packages/pipeline-manager/test/e2e/compose-smoke.sh logs
      - name: Upload logs
        id: upload_logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: compose-smoke-logs
          path: ${{ env.SMOKE_DIR }}/logs
          retention-days: 7
      - name: Tear down
        id: tear_down
        if: always()
        run: bash packages/pipeline-manager/test/e2e/compose-smoke.sh down
    timeout-minutes: 150
concurrency:
  group: nightly-smoke
  cancel-in-progress: false

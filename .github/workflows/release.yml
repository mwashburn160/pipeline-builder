      contents: write
      packages: read
    if: ${{ always() && needs.init.result == 'success' && needs.build.result != 'failure' && needs.build.result != 'cancelled' && needs.publish.result != 'failure' && needs.publish.result != 'cancelled' }}
    steps:
      - name: Checkout repository
        id: checkout_repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Docker Buildx
        id: set_up_docker_buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Set git user and fast-forward main
        id: set_git_user_and_fast-forward_main
        run: git config user.name "ci" && git config user.email "mwashburn160@gmail.com" && git pull --ff-only origin main
      - name: Verify published npm package deps resolve
        id: verify_published_npm_package_deps_resolve
        run: bash deploy/bin/verify-npm-deps.sh
      - name: Sync deploy image tags and version labels to the released versions
        id: sync_deploy_image_tags_and_version_labels_to_the_released_versions
        run: bash deploy/bin/sync-image-tags.sh
      - name: Verify deploy image tags are publicly pullable from ghcr.io
        id: verify_deploy_image_tags_are_publicly_pullable_from_ghcr_io
        env:
          GHCR_TOKEN: ${{ secrets.GHRC_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: bash deploy/bin/verify-image-tags.sh
      - name: Commit the synced deploy manifests
        id: commit_the_synced_deploy_manifests
        run: |-
          set -euo pipefail
          if git diff --quiet -- deploy; then
            echo "deploy/ already matches the released versions — nothing to commit"
            exit 0
          fi
          git add -- deploy
          git commit -m "chore: synced deploy image tags and version labels to the released versions"
          git push
  record_build:
    name: record build
    needs:
      - init
      - build
      - publish
      - verify_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ always() && needs.build.result == 'success' && needs.publish.result != 'failure' && needs.publish.result != 'cancelled' && needs.verify_release.result == 'success' }}
    steps:
      - name: Checkout repository
        id: checkout_repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 0
      - name: Set git user
        id: set_git_user
        run: git config user.name "ci" && git config user.email "mwashburn160@gmail.com"
      - name: Advance .nx_base to the released commit
        id: advance_nx_base_to_the_released_commit
        env:
          RELEASED_SHA: ${{ needs.build.outputs.RELEASED_SHA }}
        run: 'git pull --ff-only origin main && test -n "$RELEASED_SHA" && git merge-base --is-ancestor "$RELEASED_SHA" HEAD && echo "$RELEASED_SHA" > .nx_base && git add .nx_base && git commit -m "chore: updated last successfully built commit" && git push'

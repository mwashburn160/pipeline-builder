name: release
on:
  workflow_dispatch: {}
jobs:
  init:
    name: init
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      packages: read
    outputs:
      NX_BASE: ${{ steps.nx_base.outputs.NX_BASE }}
      NX_HEAD: ${{ steps.nx_head.outputs.NX_HEAD }}
      AFFECTED_IMAGES: ${{ steps.affected.outputs.AFFECTED_IMAGES }}
      AFFECTED_PROJECTS: ${{ steps.affected.outputs.AFFECTED_PROJECTS }}
    steps:
      - name: Disable Nx telemetry and daemon
        id: disable_nx_telemetry_and_daemon
        run: echo NX_TELEMETRY_DISABLED=1 >> $GITHUB_ENV && echo NX_DAEMON=false >> $GITHUB_ENV
      - name: Checkout repository
        id: checkout_repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 0
      - name: Setup pnpm
        id: setup_pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.33.0
      - name: Setup node
        id: setup_node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          cache: pnpm
          node-version: 24.14.0
          package-manager-cache: pnpm
      - name: Configure npm registry
        id: configure_npm_registry
        run: export NPM_TOKEN=$(echo ${{ secrets.NPM_TOKEN_ENCODED }} | base64 -d) && npm config set //registry.npmjs.org/:_authToken=$NPM_TOKEN && npm config set @pipeline-builder:registry=https://registry.npmjs.org/
      - name: Install dependencies
        id: install_dependencies
        run: pnpm install --frozen-lockfile
      - name: Set git user
        id: set_git_user
        run: git config user.name "ci" && git config user.email "mwashburn160@gmail.com"
      - name: Prune tags older than 15 days
        id: prune_tags_older_than_15_days
        run: CUTOFF_DATE=$(date -d "15 days ago" +%s) && git for-each-ref --format="%(refname:short) %(creatordate:unix)" refs/tags | while read TAG DATE; do if [ $DATE -lt $CUTOFF_DATE ]; then echo "Deleting tag $TAG created on $(date -d @$DATE)"; git tag -d $TAG; fi; done && git push origin --tags --prune
      - name: Set NX_BASE
        id: nx_base
        run: if [ -f .nx_base ] && [ -s .nx_base ]; then echo NX_BASE=$(cat .nx_base) >> $GITHUB_OUTPUT; else echo NX_BASE=$(git rev-parse HEAD~1) >> $GITHUB_OUTPUT; fi
      - name: Set NX_HEAD
        id: nx_head
        run: echo NX_HEAD=$(git rev-parse HEAD) >> $GITHUB_OUTPUT
      - name: Affected projects and images
        id: affected
        env:
          IMAGE_PROJECTS: '["platform","frontend","quota","billing","plugin","pipeline","message","reporting","ask","compliance","image-registry"]'
        run: AFFECTED=$(pnpm nx show projects --affected --json --base ${{ steps.nx_base.outputs.NX_BASE }} --head ${{ steps.nx_head.outputs.NX_HEAD }}) && echo AFFECTED_PROJECTS=$AFFECTED >> $GITHUB_OUTPUT && echo AFFECTED_IMAGES=$(jq -nc --argjson a "$AFFECTED" --argjson l "$IMAGE_PROJECTS" '[$a[] | select(IN($l[]))]') >> $GITHUB_OUTPUT
      - name: Affected details
        id: affected_details
        run: echo AFFECTED_PROJECTS=${{ steps.affected.outputs.AFFECTED_PROJECTS }} && echo AFFECTED_IMAGES=${{ steps.affected.outputs.AFFECTED_IMAGES }}
  build:
    name: build
    needs: init
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      packages: read
      id-token: write
    outputs:
      RELEASED_SHA: ${{ steps.released_sha.outputs.RELEASED_SHA }}
    if: ${{ needs.init.outputs.AFFECTED_PROJECTS != '[]' || needs.init.outputs.AFFECTED_IMAGES != '[]' }}
    steps:
      - name: Disable Nx telemetry and daemon
        id: disable_nx_telemetry_and_daemon
        run: echo NX_TELEMETRY_DISABLED=1 >> $GITHUB_ENV && echo NX_DAEMON=false >> $GITHUB_ENV
      - name: Checkout repository
        id: checkout_repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 0
      - name: Setup pnpm
        id: setup_pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.33.0
      - name: Setup node
        id: setup_node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          cache: pnpm
          node-version: 24.14.0
          package-manager-cache: pnpm
      - name: Configure npm registry
        id: configure_npm_registry
        run: export NPM_TOKEN=$(echo ${{ secrets.NPM_TOKEN_ENCODED }} | base64 -d) && npm config set //registry.npmjs.org/:_authToken=$NPM_TOKEN && npm config set @pipeline-builder:registry=https://registry.npmjs.org/
      - name: Install dependencies
        id: install_dependencies
        run: pnpm install --frozen-lockfile
      - name: Set git user
        id: set_git_user
        run: git config user.name "ci" && git config user.email "mwashburn160@gmail.com"
      - name: Prune tags older than 15 days
        id: prune_tags_older_than_15_days
        run: CUTOFF_DATE=$(date -d "15 days ago" +%s) && git for-each-ref --format="%(refname:short) %(creatordate:unix)" refs/tags | while read TAG DATE; do if [ $DATE -lt $CUTOFF_DATE ]; then echo "Deleting tag $TAG created on $(date -d @$DATE)"; git tag -d $TAG; fi; done && git push origin --tags --prune
      - name: Set NX:BASE, NX:HEAD
        id: set_nx_base_nx_head
        run: echo NX_BASE=${{ needs.init.outputs.NX_BASE }} >> $GITHUB_ENV && echo NX_HEAD=${{ needs.init.outputs.NX_HEAD }}  >> $GITHUB_ENV
      - name: Details NX_BASE, NX_HEAD
        id: details_nx_base_nx_head
        run: 'echo "NX_BASE: ${{ env.NX_BASE }}, NX_HEAD: ${{ env.NX_HEAD }}"'
      - name: Run build target
        id: run_build_target
        env:
          GITHUB_TOKEN: ${{ secrets.GHRC_TOKEN }}
          RUN_MONGO_INTEGRATION: "true"
        run: pnpm nx affected --target build --base ${{ env.NX_BASE }} --head ${{ env.NX_HEAD }} --verbose
      - name: Run test target
        id: run_test_target
        env:
          GITHUB_TOKEN: ${{ secrets.GHRC_TOKEN }}
          RUN_MONGO_INTEGRATION: "true"
        run: pnpm nx affected --target test --base ${{ env.NX_BASE }} --head ${{ env.NX_HEAD }} --verbose
      - name: Semantic version
        id: semantic_version
        env:
          GITHUB_TOKEN: ${{ secrets.GHRC_TOKEN }}
        run: pnpm nx release --first-release --skip-publish --verbose
      - name: Compute affected library packages
        id: check
        env:
          LIBRARY_PROJECTS: '["api-core","pipeline-data","pipeline-core","api-server","ai-core","pipeline-events","pipeline-manager"]'
        run: AFFECTED=$(pnpm nx show projects --affected --json --base ${{ env.NX_BASE }} --head ${{ env.NX_HEAD }}) && echo AFFECTED_LIBS=$(jq -nc --argjson a "$AFFECTED" --argjson l "$LIBRARY_PROJECTS" '[$a[] | sub("^@pipeline-builder/"; "") | select(IN($l[]))]') >> $GITHUB_OUTPUT
      - name: Publish npm packages
        id: publish_npm_packages
        if: ${{ steps.check.outputs.AFFECTED_LIBS != '[]' && steps.check.outputs.AFFECTED_LIBS != '' }}
        run: npm config set @pipeline-builder:registry=https://registry.npmjs.org/ && FILTERS=$(echo '${{ steps.check.outputs.AFFECTED_LIBS }}' | jq -r '[.[] | "--filter @pipeline-builder/" + .] | join(" ")') && if [ -z "$FILTERS" ]; then echo "No affected @pipeline-builder libraries to publish."; else pnpm publish --access public $FILTERS --no-git-checks --verbose; fi
      - name: Check for frontend standalone bundle
        id: fe_bundle
        run: if [ -d ./frontend/.next/standalone ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: Package frontend bundle (preserves symlinks)
        id: package_frontend_bundle_preserves_symlinks
        if: steps.fe_bundle.outputs.exists == 'true'
        run: tar -czf frontend-bundle.tar.gz -C ./frontend .next/standalone .next/static
      - name: Upload artifact
        id: upload_artifact
        if: steps.fe_bundle.outputs.exists == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: artifacts
          path: ./frontend-bundle.tar.gz
          if-no-files-found: error
      - name: Push new tag to the repository
        id: push_new_tag_to_the_repository
        run: git push --follow-tags
      - name: Record released commit
        id: released_sha
        run: echo RELEASED_SHA=$(git rev-parse HEAD) >> $GITHUB_OUTPUT
  publish:
    name: publish image
    needs:
      - init
      - build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
    if: ${{ needs.init.outputs.AFFECTED_IMAGES != '[]' }}
    steps:
      - name: Disable Nx telemetry and daemon
        id: disable_nx_telemetry_and_daemon
        run: echo NX_TELEMETRY_DISABLED=1 >> $GITHUB_ENV && echo NX_DAEMON=false >> $GITHUB_ENV
      - name: Checkout repository
        id: checkout_repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 0
      - name: Setup pnpm
        id: setup_pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.33.0
      - name: Setup node
        id: setup_node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          cache: pnpm
          node-version: 24.14.0
          package-manager-cache: pnpm
      - name: Configure npm registry
        id: configure_npm_registry
        run: export NPM_TOKEN=$(echo ${{ secrets.NPM_TOKEN_ENCODED }} | base64 -d) && npm config set //registry.npmjs.org/:_authToken=$NPM_TOKEN && npm config set @pipeline-builder:registry=https://registry.npmjs.org/
      - name: Install dependencies
        id: install_dependencies
        run: pnpm install --frozen-lockfile
      - name: Set git user
        id: set_git_user
        run: git config user.name "ci" && git config user.email "mwashburn160@gmail.com"
      - name: Prune tags older than 15 days
        id: prune_tags_older_than_15_days
        run: CUTOFF_DATE=$(date -d "15 days ago" +%s) && git for-each-ref --format="%(refname:short) %(creatordate:unix)" refs/tags | while read TAG DATE; do if [ $DATE -lt $CUTOFF_DATE ]; then echo "Deleting tag $TAG created on $(date -d @$DATE)"; git tag -d $TAG; fi; done && git push origin --tags --prune
      - name: Download artifact
        id: dnload_artifact
        if: ${{ matrix.project_name == 'frontend' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: artifacts
          path: dnload
      - name: Copy artifacts to destination
        id: copy_artifacts_to_destination
        if: ${{ matrix.project_name == 'frontend' }}
        run: cp -rv dnload/* ./
      - name: Extract frontend bundle
        id: extract_frontend_bundle
        if: ${{ matrix.project_name == 'frontend' }}
        run: tar --overwrite -xzf frontend-bundle.tar.gz -C ./frontend && rm frontend-bundle.tar.gz
      - name: Login into container registry
        id: login_into_container_registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHRC_TOKEN }}
      - name: Setup QEMU
        id: setup_qemu
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - name: Setup buildx
        id: setup_buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          cleanup: true
          cache-binary: false
      - name: Build + push multi-arch image
        id: build_push_multi-arch_image
        env:
          REGISTRY: ghcr.io/mwashburn160
          PROJECT_NAME: ${{ matrix.project_name }}
          DOCKER_CACHE: "1"
        run: pnpm nx run ${PROJECT_NAME}:docker:publish --verbose
      - name: Verify multi-arch manifest
        id: verify_multi-arch_manifest
        env:
          REGISTRY: ghcr.io/mwashburn160
          PROJECT_NAME: ${{ matrix.project_name }}
        run: pnpm nx run ${PROJECT_NAME}:docker:verify --verbose
      - name: Install cosign
        id: install_cosign
        env:
          COSIGN_VERSION: v3.1.3
          COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
        run: set -euo pipefail && curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o /tmp/cosign https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64 && echo "${COSIGN_SHA256}  /tmp/cosign" | sha256sum -c - && sudo install -m 0755 /tmp/cosign /usr/local/bin/cosign && cosign version
      - name: Install syft (SBOM generator)
        id: install_syft_sbom_generator
        env:
          SYFT_VERSION: 1.52.0
          SYFT_SHA256: caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d
        run: set -euo pipefail && curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o /tmp/syft.tar.gz https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz && echo "${SYFT_SHA256}  /tmp/syft.tar.gz" | sha256sum -c - && tar -xzf /tmp/syft.tar.gz -C /tmp syft && sudo install -m 0755 /tmp/syft /usr/local/bin/syft && syft version
      - name: Sign image + attach SBOM (keyless)
        id: sign_image_attach_sbom_keyless
        env:
          PROJECT_NAME: ${{ matrix.project_name }}
          COSIGN_YES: "true"
        run: set -euo pipefail && PROJ_DIR=$(pnpm nx show project ${PROJECT_NAME} --json | jq -r .root) && VERSION=$(jq -r .version "$PROJ_DIR/package.json") && REF="ghcr.io/mwashburn160/${PROJECT_NAME}:${VERSION}" && DIGEST=$(docker buildx imagetools inspect "$REF" --format '{{ .Manifest.Digest }}') && IMG="ghcr.io/mwashburn160/${PROJECT_NAME}@${DIGEST}" && echo "Signing $IMG" && cosign sign --yes "$IMG" && syft "$IMG" -o spdx-json=sbom.spdx.json && cosign attest --yes --predicate sbom.spdx.json --type spdxjson "$IMG"
      - name: Scan image for vulnerabilities (grype)
        id: scan_image_for_vulnerabilities_grype
        env:
          GRYPE_VERSION: 0.119.0
          GRYPE_SHA256: 3fa2dc4b924621ab65404cf08d0b8438d896d80ab949c9d5a4ca283c36004c9b
        run: set -euo pipefail && curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o /tmp/grype.tar.gz https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz && echo "${GRYPE_SHA256}  /tmp/grype.tar.gz" | sha256sum -c - && tar -xzf /tmp/grype.tar.gz -C /tmp grype && sudo install -m 0755 /tmp/grype /usr/local/bin/grype && grype sbom:sbom.spdx.json --only-fixed --fail-on critical
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        project_name: ${{ fromJson(needs.init.outputs.AFFECTED_IMAGES) }}
  verify_release:
    name: verify release
    needs:
      - init
      - build
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    if: ${{ always() && needs.init.result == 'success' && needs.build.result != 'failure' && needs.build.result != 'cancelled' && needs.publish.result != 'failure' && needs.publish.result != 'cancelled' }}
    steps:
      - name: Checkout repository
        id: checkout_repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 0
      - name: Verify published npm package deps resolve
        id: verify_published_npm_package_deps_resolve
        run: bash deploy/bin/verify-npm-deps.sh
      - name: Verify deploy image tags are publicly pullable from ghcr.io
        id: verify_deploy_image_tags_are_publicly_pullable_from_ghcr_io
        env:
          GHCR_TOKEN: ${{ secrets.GHRC_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: bash deploy/bin/verify-image-tags.sh
  record_build:
    name: record build
    needs:
      - init
      - build
      - publish
      - verify_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ always() && needs.build.result == 'success' && needs.publish.result != 'failure' && needs.publish.result != 'cancelled' && needs.verify_release.result == 'success' }}
    steps:
      - name: Checkout repository
        id: checkout_repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 0
      - name: Set git user
        id: set_git_user
        run: git config user.name "ci" && git config user.email "mwashburn160@gmail.com"
      - name: Advance .nx_base to the released commit
        id: advance_nx_base_to_the_released_commit
        env:
          RELEASED_SHA: ${{ needs.build.outputs.RELEASED_SHA }}
        run: 'git pull --ff-only origin main && test -n "$RELEASED_SHA" && git merge-base --is-ancestor "$RELEASED_SHA" HEAD && echo "$RELEASED_SHA" > .nx_base && git add .nx_base && git commit -m "chore: updated last successfully built commit" && git push'

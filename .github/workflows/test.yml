name: test
on:
  pull_request: {}
  push:
    branches:
      - main
    paths-ignore:
      - CNAME
      - _config.yml
      - docs/**
      - "**/*.md"
      - _includes/**
      - _layouts/**
  workflow_dispatch: {}
jobs:
  test:
    name: build (compile + test + lint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      RUN_MONGO_INTEGRATION: "true"
      API_CORE_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Disable Nx telemetry and daemon
        id: disable_nx_telemetry_and_daemon
        run: echo NX_TELEMETRY_DISABLED=1 >> $GITHUB_ENV && echo NX_DAEMON=false >> $GITHUB_ENV
      - name: Checkout repository
        id: checkout_repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Setup pnpm
        id: setup_pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 12.14.0
      - name: Setup node
        id: setup_node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          cache: pnpm
          node-version: 26.13.1
          package-manager-cache: pnpm
      - name: Configure npm registry
        id: configure_npm_registry
        env:
          NPM_TOKEN_ENCODED: ${{ secrets.NPM_TOKEN_ENCODED }}
        run: |-
          set -euo pipefail
          NPM_TOKEN="$(printf "%s" "$NPM_TOKEN_ENCODED" | base64 -d)"
          if [ -n "$NPM_TOKEN" ]; then
            echo "::add-mask::$NPM_TOKEN"
            NPMRC="$(npm config get userconfig)"
            touch "$NPMRC" && chmod 600 "$NPMRC"
            printf "//registry.npmjs.org/:_authToken=%s\n" "$NPM_TOKEN" >> "$NPMRC"
          else
            echo "NPM_TOKEN_ENCODED is not available; continuing without npm auth"
          fi
          npm config set @pipeline-builder:registry=https://registry.npmjs.org/
      - name: Install dependencies
        id: install_dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore Nx cache
        id: restore_nx_cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |-
            .nx/cache
            .nx/workspace-data
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |-
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-
      - name: Build affected projects
        id: build_affected_projects
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: 'case "$GITHUB_EVENT_NAME" in pull_request) BASE="origin/$GITHUB_BASE_REF" ;; push) BASE="$PUSH_BEFORE" ;; *) BASE="" ;; esac; case "$BASE" in 0000000000000000000000000000000000000000) BASE="" ;; esac; if [ -n "$BASE" ] && ! git rev-parse --verify --quiet "${BASE}^{commit}" >/dev/null; then BASE=""; fi; echo "diff base: ${BASE:-<none: checking everything>}"; if [ -n "$BASE" ]; then pnpm nx affected -t build --base "$BASE" --head HEAD --verbose; else pnpm nx run-many -t build --all --verbose; fi'
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
  deploy_contracts:
    name: deploy contracts
    runs-on: ubuntu-latest

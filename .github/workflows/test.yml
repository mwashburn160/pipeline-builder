name: test
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}
jobs:
  test:
    name: build (compile + test + lint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Disable Nx telemetry and daemon
        id: disable_nx_telemetry_and_daemon
        run: echo NX_TELEMETRY_DISABLED=1 >> $GITHUB_ENV && echo NX_DAEMON=false >> $GITHUB_ENV
      - name: Checkout repository
        id: checkout_repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Setup pnpm
        id: setup_pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.33.0
      - name: Setup node
        id: setup_node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          cache: pnpm
          node-version: 24.14.0
          package-manager-cache: pnpm
      - name: Configure npm registry
        id: configure_npm_registry
        run: export NPM_TOKEN=$(echo ${{ secrets.NPM_TOKEN_ENCODED }} | base64 -d) && npm config set //registry.npmjs.org/:_authToken=$NPM_TOKEN && npm config set @pipeline-builder:registry=https://registry.npmjs.org/
      - name: Install dependencies
        id: install_dependencies
        run: pnpm install --frozen-lockfile
      - name: Build affected projects
        id: build_affected_projects
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          RUN_MONGO_INTEGRATION: "true"
        run: 'case "$GITHUB_EVENT_NAME" in pull_request) BASE="origin/$GITHUB_BASE_REF" ;; push) BASE="$PUSH_BEFORE" ;; *) BASE="" ;; esac; case "$BASE" in 0000000000000000000000000000000000000000) BASE="" ;; esac; if [ -n "$BASE" ] && ! git rev-parse --verify --quiet "${BASE}^{commit}" >/dev/null; then BASE=""; fi; echo "diff base: ${BASE:-<none: checking everything>}"; if [ -n "$BASE" ]; then pnpm nx affected -t build --base "$BASE" --head HEAD --verbose; else pnpm nx run-many -t build --all --verbose; fi'
  deploy_contracts:
    name: deploy contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Disable Nx telemetry and daemon
        id: disable_nx_telemetry_and_daemon
        run: echo NX_TELEMETRY_DISABLED=1 >> $GITHUB_ENV && echo NX_DAEMON=false >> $GITHUB_ENV
      - name: Checkout repository
        id: checkout_repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Setup pnpm
        id: setup_pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.33.0
      - name: Setup node
        id: setup_node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          cache: pnpm
          node-version: 24.14.0
          package-manager-cache: pnpm
      - name: Configure npm registry
        id: configure_npm_registry
        run: export NPM_TOKEN=$(echo ${{ secrets.NPM_TOKEN_ENCODED }} | base64 -d) && npm config set //registry.npmjs.org/:_authToken=$NPM_TOKEN && npm config set @pipeline-builder:registry=https://registry.npmjs.org/
      - name: Install dependencies
        id: install_dependencies
        run: pnpm install --frozen-lockfile
      - name: Detect deploy changes
        id: changes
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: 'case "$GITHUB_EVENT_NAME" in pull_request) BASE="origin/$GITHUB_BASE_REF" ;; push) BASE="$PUSH_BEFORE" ;; *) BASE="" ;; esac; case "$BASE" in 0000000000000000000000000000000000000000) BASE="" ;; esac; if [ -n "$BASE" ] && ! git rev-parse --verify --quiet "${BASE}^{commit}" >/dev/null; then BASE=""; fi; echo "diff base: ${BASE:-<none: checking everything>}"; if [ -z "$BASE" ] || ! git diff --quiet "$BASE" HEAD -- deploy/ test/deploy-contracts/ scripts/ .github/workflows/ README.md index.md packages/api-core/src/utils/sensitive-patterns.ts; then echo deploy=true >> $GITHUB_OUTPUT; else echo deploy=false >> $GITHUB_OUTPUT; fi'
      - name: Deploy contract tests
        id: deploy_contract_tests
        if: steps.changes.outputs.deploy == 'true'
        run: cd test/deploy-contracts && NODE_OPTIONS=--experimental-vm-modules npx jest --coverage=false --ci
      - name: Render every k8s target
        id: render_every_k8s_target
        if: steps.changes.outputs.deploy == 'true'
        run: for t in deploy/local/minikube deploy/aws/ec2 deploy/aws/eks; do echo "kustomize $t"; kubectl kustomize "$t/k8s" > /dev/null; done
      - name: Validate docker-compose
        id: validate_docker-compose
        if: steps.changes.outputs.deploy == 'true'
        run: cp deploy/local/docker/.env.example "$RUNNER_TEMP/pb.env" && docker compose --env-file "$RUNNER_TEMP/pb.env" -f deploy/local/docker/docker-compose.yml config -q
      - name: Generated files are current
        id: generated_files_are_current
        if: steps.changes.outputs.deploy == 'true'
        run: node scripts/gen-env-examples.mjs --check && node scripts/gen-readme-index.mjs --check && npx nx run @pipeline-builder/api-core:post-compile && node scripts/gen-promtail-masking.mjs --check
      - name: Validate observability configs
        id: validate_observability_configs
        if: steps.changes.outputs.deploy == 'true'
        run: deploy/bin/validate-configs.sh
      - name: Shellcheck deploy scripts
        id: shellcheck_deploy_scripts
        if: steps.changes.outputs.deploy == 'true'
        run: find deploy -name '*.sh' -type f -print0 | xargs -0 shellcheck -x -S error
  docker_smoke:
    name: dockerfile smoke build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        id: checkout_repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Smoke-build changed Dockerfiles
        id: smoke-build_changed_dockerfiles
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: "set -euo pipefail; case \"$GITHUB_EVENT_NAME\" in pull_request) BASE=\"origin/$GITHUB_BASE_REF\" ;; push) BASE=\"$PUSH_BEFORE\" ;; *) BASE=\"\" ;; esac; case \"$BASE\" in 0000000000000000000000000000000000000000) BASE=\"\" ;; esac; if [ -n \"$BASE\" ] && ! git rev-parse --verify --quiet \"${BASE}^{commit}\" >/dev/null; then BASE=\"\"; fi; echo \"diff base: ${BASE:-<none: checking everything>}\"; if [ -n \"$BASE\" ]; then FILES=$(git diff --name-only \"$BASE\" HEAD | grep -E '(^|/)Dockerfile$' | grep -v '^deploy/plugins/' || true); else FILES=$(git ls-files | grep -E '(^|/)Dockerfile$' | grep -v '^deploy/plugins/'); fi; if [ -z \"$FILES\" ]; then echo \"No service Dockerfile changed.\"; exit 0; fi; for f in $FILES; do [ -f \"$f\" ] || continue; d=$(dirname \"$f\"); echo \"::group::docker build $f\"; mkdir -p \"$d/.docker-build/node_modules\" \"$d/.docker-build/lib\" \"$d/.next/standalone\" \"$d/.next/static\" \"$d/public\"; [ -f \"$d/.docker-build/package.json\" ] || echo '{}' > \"$d/.docker-build/package.json\"; docker buildx build --platform linux/amd64 -f \"$f\" \"$d\"; echo \"::endgroup::\"; done"

        run: |-
          set -euo pipefail
          NPM_TOKEN="$(printf "%s" "$NPM_TOKEN_ENCODED" | base64 -d)"
          if [ -n "$NPM_TOKEN" ]; then
            echo "::add-mask::$NPM_TOKEN"
            NPMRC="$(npm config get userconfig)"
            touch "$NPMRC" && chmod 600 "$NPMRC"

          fi
          npm config set @pipeline-builder:registry=https://registry.npmjs.org/
      - name: Install dependencies
        id: install_dependencies
        run: pnpm install --frozen-lockfile
      - name: Detect deploy changes
        id: changes
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: "case \"$GITHUB_EVENT_NAME\" in pull_request) BASE=\"origin/$GITHUB_BASE_REF\" ;; push) BASE=\"$PUSH_BEFORE\" ;; *) BASE=\"\" ;; esac; case \"$BASE\" in 0000000000000000000000000000000000000000) BASE=\"\" ;; esac; if [ -n \"$BASE\" ] && ! git rev-parse --verify --quiet \"${BASE}^{commit}\" >/dev/null; then BASE=\"\"; fi; echo \"diff base: ${BASE:-<none: checking everything>}\"; if [ -z \"$BASE\" ] || ! git diff --quiet \"$BASE\" HEAD -- deploy/ test/deploy-contracts/ scripts/ .github/workflows/ README.md index.md packages/api-core/src/utils/sensitive-patterns.ts projenrc/ .projenrc.ts package.json renovate.json SECURITY.md platform/Dockerfile frontend/Dockerfile ':(glob)api/*/Dockerfile'; then echo deploy=true >> $GITHUB_OUTPUT; else echo deploy=false >> $GITHUB_OUTPUT; fi"
      - name: Deploy contract tests
        id: deploy_contract_tests
        if: steps.changes.outputs.deploy == 'true'
        run: cd test/deploy-contracts && NODE_OPTIONS=--experimental-vm-modules npx jest --coverage=false --ci
      - name: Render and schema-check every k8s target
        id: render_and_schema-check_every_k8s_target
        if: steps.changes.outputs.deploy == 'true'
        run: |-
          for t in deploy/local/minikube deploy/aws/ec2 deploy/aws/eks; do
            echo "render $t"
            bash deploy/bin/render-for-schema-check.sh "$t" > "/tmp/$(basename "$t").yaml"
          done
          docker run --rm -v /tmp:/t:ro ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e -strict -summary -schema-location default -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' /t/minikube.yaml /t/ec2.yaml /t/eks.yaml
      - name: Validate docker-compose
        id: validate_docker-compose
        if: steps.changes.outputs.deploy == 'true'
        run: cp deploy/local/docker/.env.example "$RUNNER_TEMP/pb.env" && docker compose --env-file "$RUNNER_TEMP/pb.env" -f deploy/local/docker/docker-compose.yml config -q
      - name: Generated files are current
        id: generated_files_are_current
        if: steps.changes.outputs.deploy == 'true'
        run: node scripts/gen-readme-index.mjs --check && npx nx run @pipeline-builder/api-core:post-compile && node scripts/gen-alloy-masking.mjs --check
      - name: Validate observability configs
        id: validate_observability_configs
        if: steps.changes.outputs.deploy == 'true'
        run: deploy/bin/validate-configs.sh
      - name: Validate the CloudFormation template
        id: validate_the_cloudformation_template
        if: steps.changes.outputs.deploy == 'true'
        run: pipx run cfn-lint deploy/aws/ec2/template.yaml
      - name: Shellcheck deploy scripts
        id: shellcheck_deploy_scripts
        if: steps.changes.outputs.deploy == 'true'
        run: git ls-files -z 'deploy/**/*.sh' | xargs -0 shellcheck -x -S warning

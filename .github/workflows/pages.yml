# Builds and deploys the Jekyll docs site (root `_config.yml` + `index.md`,
# `docs/`, `assets/`) to GitHub Pages via GitHub Actions.
#
# This REPLACES the legacy GitHub-managed `pages-build-deployment` workflow.
# It only runs once the repo's Pages build source is set to "GitHub Actions":
#   Settings → Pages → Build and deployment → Source: GitHub Actions
#   (or:  gh api -X PUT repos/mwashburn160/pipeline-builder/pages -f build_type=workflow )
# Switching the source is what stops the legacy `pages-build-deployment` from running.
#
# `actions/jekyll-build-pages` uses the same github-pages gem the legacy builder
# used, so the built site is byte-for-byte the same — this is a transport change,
# not a content change. NOTE: this is a hand-authored workflow (not projen-managed);
# projen regen will leave it untouched.
name: pages

on:
  push:
    branches: [main]
    # Only rebuild when something the site is built from changes.
    paths:
      - '_config.yml'
      - 'index.md'
      - 'docs/**'
      - 'assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

# Least-privilege: read the repo, write the Pages deployment, and mint the OIDC
# token `deploy-pages` needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight Pages deployment at a time; don't cancel a running publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

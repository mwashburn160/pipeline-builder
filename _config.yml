title: Software Factories on AWS
description: Self-hosted platform for standing up and running software factories on AWS: complete DevSecOps environments with secure delivery pipelines, supply-chain controls, compliance evidence and multi-tenant governance — in minutes, not months.
tagline: Deploy and run secure software factories

# Custom domain (see CNAME): the site is served at the domain ROOT, so baseurl
# must be empty. A non-empty baseurl (e.g. the old project-pages "/pipeline-builder")
# makes every `relative_url`/`{{ site.baseurl }}` link resolve to a non-existent
# "/pipeline-builder/..." path → "must provide index.html" 404 on every page.
# `url` must match the CNAME host: it's the absolute-URL base for jekyll-seo-tag
# (canonical + OG image), jekyll-sitemap (sitemap.xml), and jekyll-feed (feed.xml).
url: "https://docs.pipeline-builder.com"
baseurl: ""

author:
  name: Mark Washburn
  email: mwashburn160@gmail.com

# SEO & Social
twitter:
  username: mwashburn160   # Add your actual Twitter if you have one
  card: summary_large_image

social:
  name: Pipeline Builder
  links:
    - https://github.com/mwashburn160/pipeline-builder
    # Add more if available (LinkedIn, Twitter, etc.)

# SEO Enhancements
keywords: aws codepipeline, aws cicd, self-service cicd, internal developer platform, platform engineering, ai pipeline generator, codepipeline builder, aws codebuild plugins, policy as code, compliance as code, golden paths, multi-tenant cicd, cdk pipelines, devops automation

theme: jekyll-theme-minimal

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-relative-links

github: [metadata]

relative_links:
  enabled: true
  collections: true

# Make sure Jekyll SEO tag can generate proper Open Graph tags
defaults:
  -
    scope:
      path: ""
    values:
      # Site-wide default social card (1200x630). Matches the homepage
      # "Software Factories on AWS" message. Pages override it via their own
      # `image:` front matter: governance pages use og-image-solution.png,
      # compliance and audit-events their own cards, and the plugin pages
      # og-image-plugins.png. Alternate headlines: og-image-solution-b.png
      # ("Guardrails for Platform Teams"), og-image-solution-c.png ("Secure by
      # Default"). Regenerate every card with `node scripts/gen-og-images.mjs`.
      image: /assets/og-image.png
      author: Mark Washburn

exclude:
  - README.md
  - node_modules/
  - packages/
  - api/
  - platform/
  - frontend/
  - deploy/
  - .projen/
  - projenrc/
  - scripts/
  - "*.ts"
  - "*.json"
  - "*.yml"
  - "!_config.yml"
  - pnpm-lock.yaml
  - Gemfile
  - Gemfile.lock

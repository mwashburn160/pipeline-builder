---
# =============================================================================
# Pipeline Image Registry Service
#
# Hosts:
#   - GET /token        Docker Distribution token-auth issuer
#   - /api/images/*     JWT-authenticated catalog/delete/tag-copy API
#
# The underlying registry (registry.yaml) delegates auth to /token via its
# REGISTRY_AUTH_TOKEN_REALM. The same JWT signing keypair (registry-token-secret)
# is mounted here for issuing and on the registry for verifying.
#
# It is also the plugin-IMAGE signer: POST /internal/plugin-signatures (service
# token, caller must be `plugin`) runs cosign sign + attest (SPDX SBOM) with the
# plugin-signing key. This pod is that key's ONLY holder — the plugin pod gets
# just the public half, because it shares a network namespace with the
# buildkitd sidecar that runs untrusted tenant Dockerfile RUN steps.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: image-registry
  labels:
    app: image-registry
    # This Service exposes an INTERNAL route (POST /internal/plugin-signatures),
    # so its traffic goes through the `pb-waypoint` proxy, which is the only
    # thing in an ambient mesh that can enforce a per-ROUTE (L7)
    # AuthorizationPolicy. See k8s/istio-internal-routes.yaml — removing this
    # label is the rollback: the policies then match nothing and the app-side
    # `requireInternalService` gate carries the route alone. /token and
    # /api/images/* pass through unchanged (the waypoint's identity is in
    # image-registry-allow in k8s/istio.yaml).
    istio.io/use-waypoint: pb-waypoint
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: image-registry

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-registry
  labels:
    app: image-registry
    app.kubernetes.io/component: backend
spec:
  # Start at 1: 2 replicas at boot saturate gp3 EBS baseline throughput and
  # stall every other pod's image pull for 10+ min (see the HPA note below).
  # The HPA (minReplicas: 1) scales up on real load.
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: image-registry
  template:
    metadata:
      labels:
        app: image-registry
        app.kubernetes.io/component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: image-registry
      # Stateless API server — no need for the default ServiceAccount token
      # mounted at /var/run/secrets/kubernetes.io/serviceaccount/. Reduces blast
      # radius if the container is compromised (no kubelet API access).
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: image-registry
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-for-registry
          image: busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616  # busybox:1.38
          resources:
            limits:
              cpu: "100m"
              memory: 64Mi
            requests:
              cpu: "50m"
              memory: 32Mi
          command:
            - sh
            - -c
            - |
              echo "Waiting for registry..."
              until nc -z registry 5000; do sleep 3; done
              echo "Registry ready"
      containers:
        - name: image-registry
          image: ghcr.io/mwashburn160/image-registry:4.1.21@sha256:a794474757f0ea54c7cf0444365d97c0a79370834608854ff86c4afb67fba2bb
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: app-env
            # Credentials (DB_PASSWORD, MONGODB_URI, API keys, …) split out of app-env.
            - secretRef:
                name: app-secrets
            - secretRef:
                # IMAGE_REGISTRY_USERNAME / IMAGE_REGISTRY_PASSWORD —
                # Basic auth used when image-registry talks to the
                # underlying registry's management API.
                name: image-registry-build-svc-secret
          env:
            - name: SERVICE_NAME
              value: "image-registry"
            - name: PORT
              value: "3000"
            # Underlying registry the proxy + management API talks to.
            - name: IMAGE_REGISTRY_HOST
              value: "registry"
            - name: IMAGE_REGISTRY_PORT
              value: "5000"
            # Registry serves plain HTTP on its in-cluster ClusterIP svc;
            # nginx fronts it on HTTPS externally. See registry.yaml.
            - name: IMAGE_REGISTRY_HTTP
              value: "true"
            - name: IMAGE_REGISTRY_INSECURE
              value: "true"
            # Token signing — keypair shared with registry. Files mounted
            # below; xxx_FILE convention loads them via fs.readFile in config.
            - name: REGISTRY_TOKEN_PRIVATE_KEY_FILE
              value: "/etc/registry/jwt-private.pem"
            - name: REGISTRY_TOKEN_CERTIFICATE_FILE
              value: "/etc/registry/jwt-public.pem"
            - name: REGISTRY_TOKEN_ISSUER
              value: "platform"
            - name: REGISTRY_TOKEN_SERVICE
              value: "pipeline-image-registry"
            - name: REGISTRY_TOKEN_EXPIRES_IN
              value: "300"
            # Plugin-image signing. PLUGIN_SIGNING_MODE (local | kms) and, for
            # kms, PLUGIN_SIGNING_KMS_KEY_ID (alias/<name>) come from app-env
            # (.env). The key path is pinned HERE because it is where the
            # plugin-signing-key Secret is mounted below; in kms mode that
            # Secret does not exist and the file is never read.
            - name: PLUGIN_SIGNING_KEY_FILE
              value: "/etc/pipeline-builder/plugin-signing/plugin-signing.key"
            # cosign writes its TUF cache, the imported (password-encrypted)
            # key and each SBOM predicate under os.tmpdir() — the scratch-tmp
            # emptyDir below, since the root filesystem is read-only.
            - name: TMPDIR
              value: "/tmp"
            # IMAGE_REGISTRY_USERNAME / IMAGE_REGISTRY_PASSWORD come from
            # the image-registry-build-svc-secret envFrom above. Same creds
            # as the registry container's htpasswd; startup.sh keeps them
            # in sync.
          volumeMounts:
            # This pod's OWN internal-token signing key and the PUBLIC
            # bundle it verifies its peers with. One private key per pod — that
            # is what stops a compromised service signing as another — while the
            # bundle is public and identical everywhere. Both from
            # deploy/bin/service-signing-keys.sh; the service refuses to start
            # without them.
            - name: service-signing-key
              mountPath: /etc/pipeline-builder/service-keys
              readOnly: true
            - name: service-key-bundle
              mountPath: /etc/pipeline-builder/service-key-bundle
              readOnly: true
            - name: registry-token
              mountPath: /etc/registry/jwt-private.pem
              subPath: jwt-private.pem
              readOnly: true
            - name: registry-token
              mountPath: /etc/registry/jwt-public.pem
              subPath: jwt-public.pem
              readOnly: true
            # The plugin-image signing key. Mounted into IMAGE-REGISTRY ONLY —
            # plugin mounts the public half (plugin-signing-public-key).
            - name: plugin-signing-key
              mountPath: /etc/pipeline-builder/plugin-signing
              readOnly: true
            # readOnlyRootFilesystem: true means Node (and the cosign it
            # spawns) can't write anywhere under `/` — signing needs a tempdir.
            - name: scratch-tmp
              mountPath: /tmp
          resources:
            limits:
              cpu: "500m"
              memory: 384Mi
            requests:
              cpu: "250m"
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
      volumes:
        - name: service-signing-key
          secret:
            secretName: service-key-image-registry
            defaultMode: 0444
        - name: service-key-bundle
          secret:
            secretName: service-key-bundle
            defaultMode: 0444
        - name: registry-token
          secret:
            # Same secret mounted into the registry; here we mount BOTH
            # the public cert (for cross-checking the registry's bundle)
            # and the private key (for signing).
            secretName: registry-token-secret
            items:
              - key: jwt-public.pem
                path: jwt-public.pem
              - key: jwt-private.pem
                path: jwt-private.pem
        # `optional: true` so a KMS-signing install (where bin/k8s-resources.sh
        # creates no plugin-signing-key Secret) still schedules.
        - name: plugin-signing-key
          secret:
            secretName: plugin-signing-key
            optional: true
            defaultMode: 0444
        - name: scratch-tmp
          emptyDir:
            sizeLimit: 256Mi
---
# =============================================================================
# Image Registry HorizontalPodAutoscaler
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: image-registry
  labels:
    app: image-registry
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: image-registry
  # 1 on this target, deliberately: ec2 runs a SINGLE-NODE minikube on one
  # instance, so a second idle replica buys no availability (both die with the
  # node) and there is no node drain for the PodDisruptionBudget to block. It
  # also costs: two replicas pulling the same ~250MB image in parallel saturate
  # the instance's gp3 baseline throughput and stall every other pod's image
  # pull for 10+ minutes at boot. The HPA still scales to 5 under real load, by
  # which point the image is cached in the kubelet. The multi-node eks target
  # starts at 2 — see deploy/aws/eks/k8s/image-registry.yaml.
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
    # CPU-only autoscaling. A memory-utilization metric was removed: these
    # services carry a large BASELINE heap, so idle memory sits near the target
    # and adding replicas does not lower per-pod memory — the HPA would pin to
    # maxReplicas forever and oversubscribe the single node. Scale on CPU (load-
    # proportional) only.
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300

---
# =============================================================================
# Image Registry PodDisruptionBudget
# =============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: image-registry
  labels:
    app: image-registry
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: image-registry

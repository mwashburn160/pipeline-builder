---
# =============================================================================
# Ask model — the self-hosted, OpenAI-compatible model (Ollama) that backs the
# Ask assistant on this target.
#
# APPLIED BY DEFAULT here (listed in kustomization.yaml), and the `ask`
# Deployment points at it via OPENAI_COMPATIBLE_BASE_URL / _MODELS. The two go
# together: with no cloud provider key configured, removing either leaves the
# ask service with NO provider and every turn fails with "AI is not configured".
#
# (The minikube target keeps this opt-in — a 6Gi request will not schedule
# beside the rest of the namespace on a typical laptop-sized cluster.)
#
# Sizing: a 7B tool-capable model needs ~6-8Gi RAM (CPU) or a GPU. For GPU,
# uncomment the nodeSelector/tolerations + resources.limits `nvidia.com/gpu` below.
# Self-contained: bundles its ServiceAccount + istio authz + NetworkPolicy so
# `kubectl apply -f ask-model.yaml` brings everything ask needs to reach it.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata: { name: ask-model, namespace: pipeline-builder, labels: { app.kubernetes.io/part-of: pipeline-builder } }
---
# Model weights. This target binds a MANUAL hostPath PV — `storageClassName: ""`
# opts out of dynamic provisioning, so a claim with no matching PV never binds
# ("no persistent volumes available for this claim and no storage class is set")
# and the Deployment sits at 0/1 forever. Every other PVC on this target pairs
# with its own PV the same way (see alertmanager.yaml / mongodb.yaml); ask-model
# was missing one. (The eks copy needs no PV — it uses the dynamic pb-ebs class.)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ask-model-pv
  labels:
    app: ask-model
spec:
  storageClassName: ""
  capacity:
    storage: 20Gi
  accessModes: ["ReadWriteOnce"]
  # Retain, so tearing the file down does not discard a ~4.7GB download.
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /opt/pipeline/pipeline-data/db-data/ask-model
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ask-model-models
  labels:
    app: ask-model
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ""
  resources:
    requests:
      storage: 20Gi
  # Bind to THIS file's PV, not whichever unbound 20Gi volume sorts first.
  selector:
    matchLabels:
      app: ask-model
---
apiVersion: v1
kind: Service
metadata:
  name: ask-model
  labels:
    app: ask-model
spec:
  type: ClusterIP
  ports:
    - port: 11434
      targetPort: 11434
      protocol: TCP
      name: http
  selector:
    app: ask-model
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ask-model
  labels:
    app: ask-model
    app.kubernetes.io/component: model
spec:
  replicas: 1
  # Single writer on an RWO volume — recreate (don't run two pods on one PVC).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ask-model
  template:
    metadata:
      labels:
        app: ask-model
        app.kubernetes.io/component: model
    spec:
      serviceAccountName: ask-model
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: false   # ollama writes model blobs under /root/.ollama
        fsGroup: 0
      # GPU (uncomment to schedule on a GPU node):
      # nodeSelector: { nvidia.com/gpu.present: "true" }
      # tolerations: [{ key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }]
      containers:
        - name: ollama
          image: ollama/ollama@sha256:96b7667cb536ab69bfd5cc0c2bd1e29602218e076fe6d34f402b786f17b4fde0  # ollama/ollama:0.6.5
          ports:
            - containerPort: 11434
              name: http
          env:
            - name: OLLAMA_MODEL
              value: "qwen2.5-coder:7b"
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            # Keep the model resident. The default is 5m, after which ollama
            # evicts it and the NEXT question pays a full reload from disk before
            # a single token — which reads to the user as "Ask just hangs".
            - name: OLLAMA_KEEP_ALIVE
              value: "24h"
            # One request at a time. The default (4) splits the context budget
            # into parallel slots, costing memory and slowing the single
            # interactive request this deployment actually serves.
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
          # Run the server AND the pull as the container's main process.
          #
          # This was a lifecycle.postStart hook, which was a mistake: a blocking
          # postStart keeps the container out of Running for its whole duration,
          # so during the (minutes-long) first pull the pod sat in
          # ContainerCreating with NO readable logs and no `kubectl exec` — the
          # download looked indistinguishable from a hang. Running it as PID 1's
          # script instead means the pod is Running immediately, `kubectl logs`
          # streams the pull's progress, and the startupProbe below is what
          # actually gates traffic. Mirrors the docker target's compose command.
          command: ["/bin/sh", "-c"]
          args:
            # Retry rather than `|| true` once: a transient registry blip would
            # otherwise leave the server up with no model until the startupProbe
            # finally restarts the container.
            - |
              ollama serve &
              sleep 4
              for i in 1 2 3 4 5; do
                ollama pull "$OLLAMA_MODEL" && break
                echo "ollama pull failed (attempt $i); retrying in 30s" >&2
                sleep 30
              done
              wait
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          resources:
            # CPU REQUEST is deliberately small: ollama idles near zero and
            # bursts only while generating, which the limit below covers. The
            # request is what the scheduler and the namespace ResourceQuota
            # count, and `k8s/resource-limits.yaml` reserves its 7-core budget
            # so `init-platform.sh`'s transient crane-push pods stay admissible
            # — a full core parked here re-creates the "exceeded quota" failure
            # that bump was added to fix. Memory is the real constraint for a 7B
            # model and is requested honestly.
            requests:
              cpu: "250m"
              memory: 6Gi
            limits:
              # Same ceiling as the eks copy — a 7B model should not be given a
              # smaller burst budget just because this target has a fixed node.
              # Both values are admitted by the namespace LimitRange's
              # per-CONTAINER max (cpu "4" / memory 10Gi in resource-limits.yaml,
              # raised to cover this container), and the ResourceQuota's
              # limits.cpu / limits.memory were raised by this pod's share rather
              # than trimming it. Exceeding the LimitRange is not a scheduling
              # delay — the pod cannot be created AT ALL.
              cpu: "4"
              memory: 10Gi
              # GPU: nvidia.com/gpu: "1"
          # GATE READINESS ON THE MODEL, NOT THE SERVER.
          #
          # `/api/version` answers as soon as ollama's HTTP server binds — which
          # is almost immediately, while the `ollama pull` in the command above is
          # still downloading (~1GB here, ~4.7GB for the 7B on the AWS targets).
          # With only that probe the pod went Ready, the Service routed chat
          # completions to a model that did not exist yet, and ollama closed the
          # connection: the caller saw
          #   "AI_APICallError: Cannot connect to API: other side closed".
          #
          # A startupProbe suspends the readiness/liveness probes until it
          # passes, so the pod stays out of the Service until `ollama list`
          # actually shows the model. failureThreshold x periodSeconds is the
          # first-pull budget (~20 min); a pull that never lands restarts the
          # container, which retries it — better than serving nothing forever.
          startupProbe:
            exec:
              command: ["/bin/sh", "-c", "ollama list | grep -qF \"$OLLAMA_MODEL\""]
            periodSeconds: 10
            failureThreshold: 120
          readinessProbe:
            httpGet: { path: /api/version, port: 11434 }
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet: { path: /api/version, port: 11434 }
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ask-model-models
---
# ask -> ask-model (OpenAI-compatible inference). Additive istio authz.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: ask-model-allow
  namespace: pipeline-builder
spec:
  selector:
    matchLabels:
      app: ask-model
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/pipeline-builder/sa/ask
      to:
        - operation:
            ports: ["11434"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ask-model-from-ask
spec:
  podSelector:
    matchLabels:
      app: ask-model
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ask
      ports:
        - port: 11434
---
# ask-model -> the model registry (registry.ollama.ai).
#
# REQUIRED, not optional. `allow-dns-egress` and `allow-internal-egress` in
# networkpolicy.yaml both use an EMPTY podSelector, so every pod in this
# namespace is egress-restricted the moment they exist: DNS and in-namespace
# traffic only, unless some other policy widens it. Without this rule
# `ollama pull` resolves the registry, opens a TCP connection that never
# completes, and hangs forever — the pod stays in ContainerCreating (a blocking
# postStart keeps it there), the Service keeps ZERO endpoints, and every Ask
# turn fails with "AI_APICallError: Cannot connect to API: other side closed".
# Nothing in the pod's own logs explains it, because a container stuck in
# postStart has no readable logs.
#
# SHAPE: the shared public-egress ipBlock (see EGRESS SHAPE in networkpolicy.yaml).
# This rule used to be ports-only because excepting the WHOLE 169.254.0.0/16
# range here severed ollama's TLS under Istio ambient (the handshake completed,
# then no bytes flowed: "net/http: TLS handshake timeout") — ambient's node-side
# plumbing uses link-local addresses. The shared shape excepts only the
# credential addresses (169.254.169.254/32, 169.254.170.0/24), which ambient
# never uses, so it keeps the model pull working AND keeps IMDS / the VPC /
# the LAN out of reach of the model server.
#
# FQDN-scoping this to registry.ollama.ai needs Cilium (see
# cilium-network-policies.yaml); plain NetworkPolicy cannot express it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ask-model-external-egress
spec:
  podSelector:
    matchLabels:
      app: ask-model
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8 # RFC1918 — the VPC / node network itself
              - 172.16.0.0/12 # RFC1918
              - 192.168.0.0/16 # RFC1918 — private LAN
              - 100.64.0.0/10 # CGNAT (some cloud / VPN deployments)
              - 169.254.169.254/32 # IMDS (instance-role credentials)
              - 169.254.170.0/24 # container-credential endpoints (ECS .2, EKS Pod Identity .23)
      ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP

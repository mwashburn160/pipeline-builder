apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# EC2 — standalone manifests for AWS EC2 deployment.

# NetworkPolicy: networkpolicy.yaml (standard k8s NetworkPolicy) is the active set.
# cilium-network-policies.yaml is intentionally NOT included: its FQDN/per-org egress
# allow-listing needs Cilium as the CNI, and it is inert YAML under any other CNI.
# See that file's header to opt in. The standard policies stay either way — the
# Cilium set adds an FQDN layer on top of them, it does not replace them.

namespace: pipeline-builder

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - istio.yaml
  # Per-internal-route mesh policies + the waypoint that enforces them.
  - istio-internal-routes.yaml
  - resource-limits.yaml
  - mongodb.yaml
  - postgres.yaml
  - pgbouncer.yaml
  - redis-sentinel.yaml
  - nginx.yaml
  - platform.yaml
  - pipeline.yaml
  - plugin.yaml
  # Isolated buildkitd for anonymous plugin submissions.
  - plugin-quarantine-builder.yaml
  - message.yaml
  - reporting.yaml
  - ask.yaml
  - ask-model.yaml  # self-hosted model (Ollama) backing the Ask assistant
  # Scales ask-model to 0 outside the ASK_SCHEDULE_* window. On ec2 this frees
  # the node's RAM, not money — one always-on instance, no GPU. See the file.
  - ask-model-schedule.yaml
  - quota.yaml
  - billing.yaml
  - compliance.yaml
  - frontend.yaml
  - mongo-express.yaml
  - pgadmin.yaml
  - grafana.yaml   # dashboards over prometheus/thanos/loki/jaeger (LEAN drops it)
  - kiali.yaml     # istio mesh console — L4-only under ambient (LEAN drops it)
  - rustfs.yaml
  - rustfs-console.yaml   # the console Service only (the UI half of rustfs.yaml)
  - registry.yaml
  - image-registry.yaml
  - prometheus.yaml
  # Cluster OBJECT state as metrics — the only way to alert on a CronJob
  # that failed or stopped being scheduled. Namespace-scoped (a Role, not a
  # ClusterRole); see the file header.
  - kube-state-metrics.yaml
  - pushgateway.yaml
  - thanos-query.yaml
  - thanos-compact.yaml
  - alertmanager.yaml
  - loki.yaml
  - promtail.yaml
  - jaeger.yaml

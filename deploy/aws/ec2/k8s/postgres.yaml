---
# =============================================================================
# postgres-exporter custom queries (replication observability)
# =============================================================================
# Byte-identical with deploy/local/docker/config/postgres-exporter/queries.yml;
# postgres-exporter-queries-drift.test.ts asserts that. Mounted on the PRIMARY's
# exporter only — replication slots live on the primary, so the standby's
# exporter would report an empty set.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-exporter-queries
  labels:
    app: postgres
data:
  queries.yml: |
    # postgres-exporter custom queries — replication observability
    #
    # WHY A CUSTOM QUERY FILE AND NOT THE EXPORTER'S BUILT-IN COLLECTORS.
    # The alerts these feed must exist before a read replica can carry traffic, and
    # the plan's own hard-won rule is: verify the series exists before writing the
    # alert, because a rule referencing a metric nobody collects matches nothing —
    # and a rule that matches nothing is indistinguishable from a healthy system.
    # postgres-exporter's built-in replication collectors have changed metric names
    # across versions, so defining the SQL and the metric names HERE makes the
    # contract verifiable by construction rather than by hoping a docs page matches
    # the pinned binary.
    #
    # WHY THE EXPORTER AND NOT THE APPLICATION. These read `pg_replication_slots`
    # and `pg_stat_replication`, which need broader privileges than the application
    # role has. The exporter sidecar already connects as the bootstrap superuser
    # over loopback; the alternative — granting `pg_read_all_stats` to the role the
    # services log in as — would let every service read every org's query text out
    # of `pg_stat_activity`. A metrics concern is not worth widening a tenancy
    # boundary for.
    #
    # MOUNTED ON THE PRIMARY ONLY. Replication slots live on the primary; the
    # standby's exporter would report an empty set.
    #
    # Metric names produced: <top-level key>_<column>, e.g.
    #   pb_replication_slot_retained_bytes{slot_name="..."}
    #   pb_replication_slot_active{slot_name="..."}
    #   pb_replication_connected_standbys
    #   pb_replication_client_replay_lag_bytes{application_name="...",state="..."}

    # ---------------------------------------------------------------------------
    # Replication slots: THE hazard that can take the write path down.
    # ---------------------------------------------------------------------------
    # A slot retains WAL on the primary until its standby consumes it. A standby
    # that is stopped, slow or stuck therefore does not degrade reads — it fills the
    # primary's volume, and a full volume stops Postgres accepting writes. By the
    # time PersistentVolumeAlmostFull fires, the write path is minutes from
    # stopping; this metric is the early signal, and it is per-slot so the alert
    # over it is count-agnostic (which alert-rules.yml requires, being
    # byte-identical across targets that allow different replica counts).
    #
    # `max_slot_wal_keep_size` on the primary is the backstop that drops a runaway
    # slot. This metric is how you find out BEFORE that happens, while the fix is
    # still "re-seed one standby" rather than "the database is read-only".
    pb_replication_slot:
      query: |
        SELECT
          slot_name,
          CASE WHEN active THEN 1 ELSE 0 END AS active,
          GREATEST(0, COALESCE(pg_wal_lsn_diff(pg_current_wal_lsn(), restart_lsn), 0))::float8 AS retained_bytes
        FROM pg_replication_slots
      metrics:
        - slot_name:
            usage: LABEL
            description: "Replication slot name (one per standby; replica_<pod>)"
        - active:
            usage: GAUGE
            description: "1 when a consumer is attached to this slot, 0 when it is orphaned and still retaining WAL"
        - retained_bytes:
            usage: GAUGE
            description: "WAL bytes the primary is holding for this slot. Unbounded growth here fills the primary's volume and stops writes."

    # ---------------------------------------------------------------------------
    # Connected standbys, and how far behind each one is.
    # ---------------------------------------------------------------------------
    # `connected_standbys` is deliberately a COUNT rather than a per-replica up/down
    # series, so the alert over it can say "zero" instead of "fewer than N" —
    # "expected 3, found 2" cannot exist in a rules file shared by a target that
    # allows 3 and one fixed at 1.
    pb_replication:
      query: |
        SELECT count(*)::float8 AS connected_standbys
        FROM pg_stat_replication
      metrics:
        - connected_standbys:
            usage: GAUGE
            description: "Standbys currently streaming from this primary. Zero with a replica deployed means replication is down, not that reads are slow."

    # Per-standby replay distance IN BYTES, from the primary's point of view.
    #
    # Bytes, not seconds, and that is the point: this is the measure that keeps
    # working when the primary is IDLE. A seconds-based lag derived from
    # `pg_last_xact_replay_timestamp()` grows without bound on a quiet system even
    # when the standby is perfectly caught up — the classic false positive. A byte
    # difference between the primary's current LSN and the standby's replay LSN is
    # zero when caught up, whatever the clock says.
    #
    # The application's own circuit (postgres_replica_lag_seconds, emitted from
    # pipeline-data) guards against that false positive differently, by comparing
    # received to replayed LSN first. Two independent measurements of the same thing
    # from the two ends is deliberate: they fail in different ways.
    pb_replication_client:
      query: |
        SELECT
          COALESCE(NULLIF(application_name, ''), 'unknown') AS application_name,
          state,
          GREATEST(0, COALESCE(pg_wal_lsn_diff(pg_current_wal_lsn(), replay_lsn), 0))::float8 AS replay_lag_bytes
        FROM pg_stat_replication
      metrics:
        - application_name:
            usage: LABEL
            description: "The standby's application_name (bounded by the replica ceiling of 2)"
        - state:
            usage: LABEL
            description: "walsender state: streaming, catchup, backup, startup"
        - replay_lag_bytes:
            usage: GAUGE
            description: "WAL bytes this standby has received but not yet replayed, measured from the primary."

---
# =============================================================================
# pg_hba.conf for the PRIMARY
# =============================================================================
# Served from a ConfigMap and selected with `-c hba_file=` rather than written
# by an initdb script, so it applies to EVERY start — including a data
# directory that was initialised before this file existed. An initdb-time edit
# would only ever reach fresh volumes. Byte-identical with
# deploy/local/docker/config/postgres-hba.conf.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-hba
  labels:
    app: postgres
data:
  pg_hba.conf: |
    # TYPE  DATABASE        USER            ADDRESS                 METHOD
    # The postgres image's own defaults, kept as-is: trust for in-pod connections
    # (the entrypoint and pg_isready use these), scram for everything else.
    local   all             all                                     trust
    host    all             all             127.0.0.1/32            trust
    host    all             all             ::1/128                 trust
    local   replication     all                                     trust
    host    replication     all             127.0.0.1/32            trust
    host    replication     all             ::1/128                 trust
    # Streaming replication from the read replica (pg_basebackup + walreceiver).
    # The image default has no remote `replication` line, and `all` in the
    # DATABASE column does NOT match replication connections, so without this the
    # standby can never seed. Only roles with REPLICATION can use it: that is
    # DB_REPLICATION_USER (and the superuser); DB_USER is NOREPLICATION on purpose.
    host    replication     all             all                     scram-sha-256
    host    all             all             all                     scram-sha-256
---
# =============================================================================
# PostgreSQL Service
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: postgres

---
# =============================================================================
# PostgreSQL PersistentVolume (hostPath)
# =============================================================================
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv
  labels:
    app: postgres
spec:
  # Empty storageClassName opts out of dynamic provisioning and uses manual PV binding.
  storageClassName: ""
  capacity:
    # Matches the eks claim for the same database, and the same reasoning: on
    # eks this was 1Gi until it was found 8%/23% full and raised (4b3c43c40),
    # and this target runs the identical postgres-init.sql schema against the
    # same services. hostPath capacity is NOMINAL — Kubernetes does not enforce
    # it, the real bound is the instance's DataVolume — so this buys a coherent
    # number rather than space. It also stops 1Gi reading as a deliberate
    # sizing decision next to a 20Gi prometheus.
    storage: 20Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /opt/pipeline/pipeline-data/db-data/postgres
    type: DirectoryOrCreate

---
# =============================================================================
# PostgreSQL PersistentVolumeClaim
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  labels:
    app: postgres
spec:
  storageClassName: ""
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
  selector:
    matchLabels:
      app: postgres

---
# =============================================================================
# PostgreSQL Deployment
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
    app.kubernetes.io/component: database
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # Single writer on a hostPath PV: on single-node minikube, RWO does NOT stop two pods on
  # the same node mounting the same data dir, so the default RollingUpdate's surge pod would
  # race the live data. Recreate terminates the old pod before starting the new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
        prometheus.io/path: /metrics
      labels:
        app: postgres
        app.kubernetes.io/component: database
        version: "18.6"
        track: stable
    spec:
      serviceAccountName: postgres
      securityContext:
        runAsNonRoot: false  # PostgreSQL image requires root for initdb
      containers:
        - name: postgres
          image: postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336  # postgres:18.6
          # Server config, paired with the resource rung below. These are NOT
          # independent dials: `shared_buffers` is 25% of the memory limit and
          # `effective_cache_size` ~60%, so a rung change must move both the pod
          # limits and these flags together. Raising the pod and leaving these
          # alone buys page cache and almost nothing else — the image default is
          # 128MB of shared buffers no matter how much memory the pod is given.
          #
          # FLOOR RUNG: 1000m / 2Gi -> shared_buffers 512MB, effective_cache_size 1200MB.
          # See docs/runbooks/postgres-scaling.md for the other two rungs.
          #
          # max_connections is sized for the pgbouncer budget (see pgbouncer.yaml
          # POOL SIZING). The entrypoint passes `-c` flags through to postgres.
          #
          # work_mem is per sort/hash PER CONNECTION, so the worst case is
          # work_mem x concurrent operations. At 4MB against the 110-connection
          # pooler budget that is ~440MB, which with 512MB of shared buffers
          # leaves comfortable headroom under the 2Gi limit. This is the term
          # that turns a generous work_mem into an OOM kill rather than a
          # speed-up, and an OOM on a single primary is write downtime.
          args:
            - "-c"
            - "max_connections=200"
            - "-c"
            - "shared_buffers=512MB"
            - "-c"
            - "effective_cache_size=1200MB"
            - "-c"
            - "work_mem=4MB"
            # ---- Replication (Phase 1) ----
            # Headroom above the ceiling of 2 standbys, plus spare senders for
            # the pg_basebackup that SEEDS a new one (a clone opens its own
            # sender for -X stream). A standby also refuses to start if this is
            # lower on it than here, so the two lists must agree.
            - "-c"
            - "max_wal_senders=10"
            # THE GUARD THAT PROTECTS THE WRITE PATH. Each standby holds a
            # replication slot, and a slot retains WAL here until the standby
            # consumes it — so a stopped, slow or stuck standby does not degrade
            # reads, it fills THIS volume, and a full volume stops Postgres
            # accepting writes. With the default of -1 that retention is
            # unbounded. Capped, a broken replica fails (its slot is dropped and
            # it must be re-seeded) instead of taking the primary down with it:
            # the right failure, since every read can be served from here.
            #
            # Derived at the CEILING rung, not the floor: a primary at 4 CPU
            # generates considerably more WAL than one at 1, while the volume is
            # 20Gi either way, so a figure sized against the floor stops
            # protecting the volume exactly when the system is busiest.
            - "-c"
            - "max_slot_wal_keep_size=4GB"
            # Read the client-auth rules from the postgres-hba ConfigMap (see
            # that object for why it is not left to initdb).
            - "-c"
            - "hba_file=/etc/postgresql/hba/pg_hba.conf"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            # Read by postgres-init.sql (psql \getenv) on first init to create the
            # NOSUPERUSER NOBYPASSRLS application role the services log in as.
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_PASSWORD
            # Read by postgres-init.sql to create the view-only ecosystem_public_reader
            # login behind the anonymous plugin directory. Optional: an absent key
            # skips the role (and the directory stays off).
            - name: ECOSYSTEM_PUBLIC_READER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: ECOSYSTEM_PUBLIC_READER_PASSWORD
                  optional: true
            # Read by postgres-init.sql to create the REPLICATION role that
            # pg_basebackup and the standbys' walreceiver log in as. Optional:
            # absent keys skip the role, and the standby's seeding step then
            # fails loudly rather than starting a second, independent cluster.
            # Deliberately NOT the application role — that one is created
            # NOREPLICATION, because streaming WAL reads every tenant's rows
            # below row-level security.
            - name: DB_REPLICATION_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_REPLICATION_USER
                  optional: true
            - name: DB_REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_REPLICATION_PASSWORD
                  optional: true
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: app-env
                  key: POSTGRES_DB
          # ---- RESOURCE RUNG (floor). Change this WITH the args above. ----
          # requests == limits is deliberate: it makes the pod GUARANTEED QoS.
          # This previously ran `limits 1000m/1536Mi` against `requests
          # 150m/768Mi` — Burstable — which for the single-primary data tier
          # carrying every write in the product is the wrong class: the
          # scheduler reserved 0.15 CPU for it, throttled it toward that
          # request under node pressure, and would evict it before any
          # Guaranteed pod.
          #
          # This is a ~7x increase in RESERVED CPU. Requests are what the
          # scheduler subtracts from allocatable, so verify every pod still
          # schedules after changing it — minikube is where this bites, because
          # its VM is operator-sized at CREATE time and does not grow.
          resources:
            limits:
              cpu: "1000m"
              memory: 2Gi
            requests:
              cpu: "1000m"
              memory: 2Gi
          # A rung change CANNOT be fully applied in place, and this policy says
          # so rather than pretending otherwise: `shared_buffers` is read at
          # startup, so new memory without a restart leaves the server config on
          # the old rung — a half-applied rung that looks successful. CPU is
          # genuinely resizable in place; memory is tied to the restart that the
          # server config needs anyway.
          resizePolicy:
            - resourceName: cpu
              restartPolicy: NotRequired
            - resourceName: memory
              restartPolicy: RestartContainer
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
            - name: hba
              mountPath: /etc/postgresql/hba
              readOnly: true
              readOnly: true
        # Prometheus exporter. Sidecar rather than a separate Deployment so it
        # shares the database's lifecycle and network namespace: it reaches
        # Postgres on localhost (no Service, no extra NetworkPolicy), and when
        # the database dies the exporter dies with it, which is exactly the
        # signal ServiceDown keys off. Postgres speaks no Prometheus itself, so
        # the pod's scrape annotation points here.
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter@sha256:38606faa38c54787525fb0ff2fd6b41b4cfb75d455c1df294927c5f611699b17  # quay.io/prometheuscommunity/postgres-exporter:v0.17.1
          ports:
            - containerPort: 9187
              name: metrics
          env:
            # Reuses the same credentials the server is initialised with —
            # no separate monitoring role to provision or rotate.
            - name: DATA_SOURCE_URI
              value: "localhost:5432/postgres?sslmode=disable"
            - name: DATA_SOURCE_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            # Replication observability with metric names we DEFINE rather than
            # ones we hope match the pinned binary. These feed the
            # slot-retention alert, which has to exist before a replica can
            # carry traffic: a slot retains WAL on the primary until its standby
            # consumes it, so a stuck standby fills THIS volume and stops
            # writes rather than merely slowing reads.
            - name: PG_EXPORTER_EXTEND_QUERY_PATH
              value: /etc/postgres-exporter/queries.yml
          resources:
            requests: { cpu: "25m", memory: 48Mi }
            limits:   { cpu: "100m", memory: 128Mi }
          volumeMounts:
            - name: exporter-queries
              mountPath: /etc/postgres-exporter
              readOnly: true
      volumes:
        - name: exporter-queries
          configMap:
            name: postgres-exporter-queries
        - name: hba
          configMap:
            name: postgres-hba
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init-script
          configMap:
            name: postgres-init

---
# =============================================================================
# PostgreSQL PodDisruptionBudget
# =============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  # 1-replica stateful pod: maxUnavailable:1 lets node drains/Karpenter consolidation evict it
  # (a minAvailable:1 PDB on a single-replica pod would block every drain forever).
  maxUnavailable: 1
  selector:
    matchLabels:
      app: postgres

---
# =============================================================================
# Promtail Service Account & RBAC
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "watch", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: pipeline-builder
roleRef:
  kind: ClusterRole
  name: promtail
  apiGroup: rbac.authorization.k8s.io

---
# =============================================================================
# Promtail DaemonSet
# =============================================================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  labels:
    app: promtail
    app.kubernetes.io/component: observability
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      annotations:
        # Scraped by the `kubernetes-pods` job. The observability stack has to
        # monitor ITSELF — without this, a Loki/Thanos/Alertmanager failure is
        # invisible, and LokiRateCapBreach could never fire because the metric
        # it alerts on (loki_discarded_samples_total) is emitted by Loki.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9080"
        prometheus.io/path: /metrics
      labels:
        app: promtail
        app.kubernetes.io/component: observability
    spec:
      serviceAccountName: promtail
      securityContext:
        runAsUser: 0
        fsGroup: 0
      containers:
        - name: promtail
          image: grafana/promtail@sha256:a761cb834cfaeee29745440d4884d6748f0a08d8f68928db1d707018c1dcfbe9  # grafana/promtail:3.6.11
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          args:
            - "-config.file=/etc/promtail/promtail-config.yml"
          # NO KUBELET PROBES, deliberately. The kubelet -> podIP path does not
          # work under Istio ambient (see k8s/pgbouncer.yaml), and EVERY probe type
          # kubelet offers — httpGet, tcpSocket, grpc — uses it. `exec` is the only
          # escape and this image is DISTROLESS: running it with `sh` fails with
          # `exec: "sh": executable file not found in $PATH` (verified in-cluster),
          # and there is no wget/curl/nc either. A probe pointing at the pod IP just
          # CrashLoops the pod forever, which is strictly worse than none.
          # The cost is no health gating: a hung process is not restarted and the
          # Service admits it immediately. If that matters, the fix is a small
          # sidecar that owns an exec probe against 127.0.0.1 — not a probe here.
          resources:
            limits:
              cpu: "200m"
              memory: 256Mi
            requests:
              cpu: "50m"
              memory: 128Mi
          volumeMounts:
            - name: promtail-config
              mountPath: /etc/promtail
              readOnly: true
            - name: pods-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: docker-logs
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: positions
              mountPath: /tmp
      volumes:
        - name: promtail-config
          configMap:
            name: promtail-config
        - name: pods-logs
          hostPath:
            path: /var/log/pods
        - name: docker-logs
          hostPath:
            path: /var/lib/docker/containers
        - name: positions
          emptyDir: {}

---
# =============================================================================
# Namespace Resource Quota
# =============================================================================
apiVersion: v1
kind: ResourceQuota
metadata:
  name: pipeline-builder-quota
spec:
  hard:
    # Sized for an AWS m5.4xlarge instance (16 vCPU / 64 GiB RAM) running
    # single-node minikube, hosting the full stack:
    #   - registry + 3 per-tier buildkitd Deployments
    #   - image-registry (HPA → 5 replicas)
    #   - plugin (HPA → 4 replicas, each with a buildkitd sidecar)
    #   - quota, platform, pipeline, message, compliance, billing,
    #     reporting, frontend, nginx, postgres, mongo, redis, pgbouncer,
    #     pgadmin, mongo-express, prometheus, loki, alertmanager, promtail
    #   - ask-model (self-hosted Ollama) — 6Gi, the single largest request here
    #
    # MEASURED against this manifest set (kubectl kustomize | sum of requests):
    #   steady state (declared replicas): ~15.1Gi / ~5.6 cores  → fits
    #   every HPA at maxReplicas:         ~22.5Gi / ~14.3 cores → does NOT fit
    # The second line is intentional: this quota is the backstop that stops the
    # HPAs from exhausting an 8-vCPU node, so "all HPAs maxed" is not reachable
    # here by design. A deployment that genuinely needs it wants m5.4xlarge
    # (16 vCPU / 64 GiB) AND these numbers raised to ~26Gi / ~15.
    #
    # requests = what's *actually* scheduled — capped well below physical
    # capacity so kubelet + OS keep headroom.
    # limits = sum of declared maxima — intentionally overcommitted on
    # CPU (3x) because low steady-state usage across most services makes
    # this safe in practice (on the t3 options, burstable credits too).
    # memory limits stay BELOW the minikube VM's memory; further
    # overcommit risks OOM-kill cascades.
    #
    # SIZED FOR m5.4xlarge (16 vCPU / 64Gi → minikube VM gets 15 vCPU / 60Gi;
    # see the sizing table in bin/startup.sh). That is template.yaml's default
    # InstanceType. On a smaller allowed instance these caps still ADMIT the
    # steady stack, but full HPA scale-out will be quota-bound — see below.
    #
    # Measured against the rendered kustomize stream (BUILDKIT_MEMORY_LIMIT=3072Mi):
    #                         requests              limits
    #   steady                 4.52 cpu / 13.62Gi   18.55 cpu / 27.00Gi
    #   fully scaled (HPA max) 11.48 cpu / 20.31Gi  33.00 cpu / 40.50Gi
    #
    # The jump from the previous 7 / 22Gi / 24 / 28Gi came from giving ask-model
    # (the self-hosted 7B, limits cpu 4 / memory 10Gi) its full share rather than
    # shrinking it: on the old t3.2xlarge default the 28Gi limits cap left ~1Gi of
    # headroom at STEADY state, and raising it there would have pushed declared
    # ceilings past the 28Gi minikube VM — exactly the OOM-cascade overcommit the
    # note above warns about. The instance grew instead.
    #
    # requests.* are real reservations (keep them below VM capacity, with room for
    # kubelet/system and the transient crane-push + init pods init-platform.sh
    # spawns). limits.* are ceilings, not reservations, and stay under the 60Gi VM.
    requests.cpu: "14"
    requests.memory: 44Gi
    limits.cpu: "45"
    limits.memory: 52Gi
    # Headroom for TRANSIENT bootstrap pods, mirroring the requests.cpu 6→7 bump
    # above. The steady stack fully scaled (image-registry HPA→5, plugin HPA→4 +
    # ~24 base services + 3 buildkitd) sits near 40; at exactly 40 the crane-push /
    # init pods that init-platform.sh spawns during the base-image push were
    # rejected with "exceeded quota: pods=40". The extra 8 are small, short-lived
    # pods (crane push/check, minio-init) — memory/cpu quota still bound real load.
    # Was: 40 — left zero room for the push step once the HPAs had scaled up.
    pods: "48"
    persistentvolumeclaims: "10"

---
# =============================================================================
# Default Resource Limits (for containers that don't specify them)
# =============================================================================
apiVersion: v1
kind: LimitRange
metadata:
  name: pipeline-builder-limits
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: 512Mi
      defaultRequest:
        cpu: "100m"
        memory: 128Mi
      # This cap is a HARD admission gate, not a scheduling hint: a container
      # whose limit (or request) exceeds it cannot be created at all — the
      # ReplicaSet emits `pods "..." is forbidden: maximum memory usage per
      # Container is X, but limit is Y` and the Deployment sits at 0/1 with no
      # pod to inspect. ask-model's 6Gi REQUEST alone exceeded the old
      # ${BUILDKIT_MEMORY_LIMIT} value (3072Mi here), so adding it to
      # kustomization.yaml silently produced a Deployment that never ran.
      #
      # Sized to ask-model (the 7B model — now the largest container here, at
      # cpu 4 / memory 10Gi), matching the eks copy. The ResourceQuota below was
      # raised by that pod's share rather than shrinking it. These no longer
      # track BUILDKIT_MEMORY_LIMIT, so keep that <= 10Gi (buildkitd's cgroup
      # limit; default 3072Mi) or the plugin pod hits this same cap.
      max:
        cpu: "4"
        memory: 10Gi
    - type: Pod
      max:
        cpu: "6"
        memory: 10Gi

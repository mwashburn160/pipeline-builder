---
# =============================================================================
# Namespace Resource Quota
# =============================================================================
apiVersion: v1
kind: ResourceQuota
metadata:
  name: pipeline-builder-quota
spec:
  hard:
    # Sized for the default InstanceType: m5.4xlarge (16 vCPU / 64 GiB), which
    # gives the single-node minikube VM 15 vCPU / 60Gi (see the sizing table in
    # bin/startup.sh). The namespace holds the whole stack: registry + 3 per-tier
    # buildkitd Deployments, plugin (+ buildkitd sidecar), image-registry, the
    # ~12 API services, postgres/mongo/redis/pgbouncer, the observability and
    # admin add-ons, and ask-model (the self-hosted 7B — the single largest pod).
    #
    # MEASURED from the rendered manifests, not estimated
    # (`kubectl kustomize` with BUILDKIT_MEMORY_LIMIT=3072Mi, summing every
    # container and counting every autoscaler maximum):
    #
    #                    pods   requests                limits
    #   steady            34    4.52 cpu / 13.62Gi      18.55 cpu / 27.00Gi
    #   fully scaled      63   11.78 cpu / 21.31Gi      34.50 cpu / 42.50Gi
    #
    # "fully scaled" = every HPA at maxReplicas AND the plugin KEDA ScaledObject
    # at its max. Unlike earlier revisions of this file, full scale-out now FITS:
    # the quota is headroom for the autoscalers, not a backstop against them.
    # (limits totals include the LimitRange defaults below for the handful of
    # containers that declare none.)
    #
    # requests.* are real reservations — they must stay under the VM's 15 vCPU /
    # 60Gi with room for kubelet, the istio-system/kube-system/keda pods that do
    # NOT count against this namespace quota, and the transient crane-push +
    # rustfs-init Jobs init-platform.sh spawns. requests.cpu 14 of 15 is
    # deliberately snug: CPU, not memory, is what binds first at full scale.
    # limits.* are ceilings, not reservations, and stay under the 60Gi VM so a
    # simultaneous spike cannot cascade into OOM kills.
    #
    # On a smaller allowed InstanceType these caps still admit the steady stack,
    # but lower them to 7 / 22Gi / 24 / 28Gi on t3.2xlarge — its VM is only 28Gi,
    # and a 52Gi limits ceiling there would overcommit physical memory.
    requests.cpu: "14"
    requests.memory: 44Gi
    limits.cpu: "45"
    limits.memory: 52Gi
    # Counted from the rendered manifests rather than estimated. At every
    # autoscaler maximum the namespace holds 63 workload pods:
    #   quota 2→6, image-registry 1→5, platform 1→5, frontend 1→4, pipeline 1→4,
    #   ask/compliance/message/nginx/reporting 1→3 each (HPAs), plugin 1→2
    #   (a KEDA ScaledObject, NOT an HPA — easy to miss when tallying), plus the
    #   ~22 single-replica services, DBs and buildkitd tiers.
    # On top of that init-platform.sh spawns short-lived crane push/check and
    # rustfs-init Jobs, and a rolling update briefly runs surge pods.
    #   63 fully scaled + ~8 transient + surge/slack = 80
    # Was: 48 — which looked generous against the old hand-estimate of "near 40"
    # but is 15 SHORT of the real fully-scaled count, so the first scale-out under
    # load would have hit "exceeded quota: pods=48" exactly as the 40→48 bump was
    # meant to prevent. (110 is the kubelet's default per-node ceiling, so 80 is
    # still schedulable on the single node.)
    pods: "80"
    persistentvolumeclaims: "10"

---
# =============================================================================
# Default Resource Limits (for containers that don't specify them)
# =============================================================================
apiVersion: v1
kind: LimitRange
metadata:
  name: pipeline-builder-limits
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: 512Mi
      defaultRequest:
        cpu: "100m"
        memory: 128Mi
      # This cap is a HARD admission gate, not a scheduling hint: a container
      # whose limit (or request) exceeds it cannot be created at all — the
      # ReplicaSet emits `pods "..." is forbidden: maximum memory usage per
      # Container is X, but limit is Y` and the Deployment sits at 0/1 with no
      # pod to inspect. ask-model's 6Gi REQUEST alone exceeded the old
      # ${BUILDKIT_MEMORY_LIMIT} value (3072Mi here), so adding it to
      # kustomization.yaml silently produced a Deployment that never ran.
      #
      # Sized to ask-model (the 7B model — the largest container here, at
      # cpu 4 / memory 10Gi), matching the eks copy. The ResourceQuota below
      # includes that pod's share. These do not track BUILDKIT_MEMORY_LIMIT,
      # so keep that <= 10Gi (buildkitd's cgroup
      # limit; default 3072Mi) or the plugin pod hits this same cap.
      max:
        cpu: "4"
        memory: 10Gi
    - type: Pod
      max:
        cpu: "6"
        memory: 10Gi

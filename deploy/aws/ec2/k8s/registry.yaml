---
# =============================================================================
# Docker Registry Service
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: registry
  labels:
    app: registry
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
      name: registry
  selector:
    app: registry

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  labels:
    app: registry
    app.kubernetes.io/component: registry
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # Stateless — blobs live in MinIO (S3 driver), not a local volume. Recreate is
  # retained conservatively (single replica); RollingUpdate is now safe too.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
        app.kubernetes.io/component: registry
    spec:
      serviceAccountName: registry
      # Stateless API server — no need for the default ServiceAccount token
      # mounted at /var/run/secrets/kubernetes.io/serviceaccount/. Reduces blast
      # radius if the container is compromised (no kubelet API access).
      automountServiceAccountToken: false
      containers:
        - name: registry
          image: registry:3
          ports:
            - containerPort: 5000
              name: registry
          # Stateless: blobs live in MinIO (S3 driver, see registry-config).
          # The only writable path is a small /tmp emptyDir scratch; TLS/JWT
          # come from mounted Secrets — all compatible with a read-only root FS.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          env:
            # Token-based auth — registry delegates to pipeline-image-registry's
            # /token endpoint. Every pull/push requires a bearer JWT signed
            # with the keypair in registry-token-secret. Anonymous reads are
            # disabled; htpasswd has been removed.
            - name: REGISTRY_AUTH
              value: "token"
            # Token realm advertised to clients in WWW-Authenticate. Kept as
            # the in-cluster URL so in-cluster clients (buildkit) reach the
            # token service directly. For OUT-OF-CLUSTER pulls (AWS CodeBuild),
            # nginx's /v2/ location rewrites this realm in the response to the
            # public gateway URL (see registry-auth.js / js_header_filter) —
            # so the registry config stays internal and in-cluster auth is
            # unaffected.
            - name: REGISTRY_AUTH_TOKEN_REALM
              value: "http://image-registry:3000/token"
            - name: REGISTRY_AUTH_TOKEN_SERVICE
              value: "pipeline-image-registry"
            - name: REGISTRY_AUTH_TOKEN_ISSUER
              value: "platform"
            - name: REGISTRY_AUTH_TOKEN_ROOTCERTBUNDLE
              value: "/etc/registry/jwt-public.pem"
            - name: REGISTRY_HTTP_ADDR
              value: "0.0.0.0:5000"
            # TLS deliberately disabled — registry serves plain HTTP on
            # its in-cluster ClusterIP service; nginx fronts it on HTTPS
            # for external clients.
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
            # S3 (MinIO) credentials — per-service, bucket-scoped key. Driver +
            # endpoint + bucket come from the mounted config.yml.
            - name: REGISTRY_STORAGE_S3_ACCESSKEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: registry-access-key
            - name: REGISTRY_STORAGE_S3_SECRETKEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: registry-secret-key
          resources:
            limits:
              cpu: "400m"
              memory: 512Mi
            requests:
              cpu: "75m"
              memory: 256Mi
          # tcpSocket probes — /v2/ returns 401 (auth required) on a
          # token-auth registry, and kubelet treats 4xx as unhealthy, so
          # httpGet won't work here.
          readinessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: registry-token-cert
              mountPath: /etc/registry/jwt-public.pem
              subPath: jwt-public.pem
              readOnly: true
            # Custom config.yml selects the S3 (MinIO) storage driver.
            - name: registry-config
              mountPath: /etc/distribution/config.yml
              subPath: config.yml
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: registry-config
          configMap:
            name: registry-config
        - name: registry-token-cert
          secret:
            # Same keypair pipeline-image-registry uses for signing.
            # Operator creates this secret from openssl-generated cert via:
            #   kubectl create secret generic registry-token-secret \
            #     --from-file=jwt-public.pem=image-registry-jwt.crt \
            #     --from-file=jwt-private.pem=image-registry-jwt.key \
            #     -n pipeline-builder
            secretName: registry-token-secret
            items:
              - key: jwt-public.pem
                path: jwt-public.pem
---
# =============================================================================
# Registry storage config — S3 driver pointed at MinIO (replaces the image's
# filesystem default). Auth (token) + delete flag stay ENV-driven; only the S3
# credentials come from the minio-secret.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-config
  labels:
    app: registry
data:
  config.yml: |
    version: 0.1
    log:
      level: info
      fields:
        service: registry
    storage:
      cache:
        blobdescriptor: inmemory
      s3:
        region: us-east-1
        regionendpoint: http://minio:9000
        bucket: registry
        forcepathstyle: true
        secure: false
        rootdirectory: /
    http:
      addr: 0.0.0.0:5000
      debug:
        addr: 0.0.0.0:5001

---
# =============================================================================
# Alloy Service Account & RBAC
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "watch", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: pipeline-builder
roleRef:
  kind: ClusterRole
  name: alloy
  apiGroup: rbac.authorization.k8s.io

---
# =============================================================================
# Alloy DaemonSet
# =============================================================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  labels:
    app: alloy
    app.kubernetes.io/component: observability
spec:
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      annotations:
        # Scraped by the `kubernetes-pods` job. The observability stack has to
        # monitor ITSELF — without this, a Loki/Thanos/Alertmanager failure is
        # invisible, and LokiRateCapBreach could never fire because the metric
        # it alerts on (loki_discarded_samples_total) is emitted by Loki.
        prometheus.io/scrape: "true"
        prometheus.io/port: "12345"
        prometheus.io/path: /metrics
      labels:
        app: alloy
        app.kubernetes.io/component: observability
        version: "v1.21.0"
        track: stable
    spec:
      serviceAccountName: alloy
      securityContext:
        runAsUser: 0
        fsGroup: 0
      containers:
        - name: alloy
          image: grafana/alloy@sha256:9726bfba078de9bc2212c60c6e643238c700b4fe0868ea78cbe03163d03d95bf  # grafana/alloy:v1.21.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          args:
            - "run"
            - "--server.http.listen-addr=0.0.0.0:12345"
            # readOnlyRootFilesystem is on, so Alloy's WAL/state must live on the
            # one writable mount. Same emptyDir alloy used for positions.
            - "--storage.path=/tmp/alloy"
            - "/etc/alloy/config.alloy"
          # NO KUBELET PROBES, deliberately. The kubelet -> podIP path does not
          # work under Istio ambient (see k8s/pgbouncer.yaml), and EVERY probe type
          # kubelet offers — httpGet, tcpSocket, grpc — uses it. `exec` is the only
          # escape. Unlike alloy's distroless image this one DOES have a shell,
          # but it ships no wget/curl/nc, so an exec probe still has nothing to
          # call Alloy's /-/ready with. A probe pointing at the pod IP just
          # CrashLoops the pod forever, which is strictly worse than none.
          # The cost is no health gating: a hung process is not restarted and the
          # Service admits it immediately. If that matters, the fix is a small
          # sidecar that owns an exec probe against 127.0.0.1 — not a probe here.
          resources:
            limits:
              cpu: "200m"
              memory: 256Mi
            requests:
              cpu: "50m"
              memory: 128Mi
          volumeMounts:
            - name: alloy-config
              mountPath: /etc/alloy
              readOnly: true
            - name: pods-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: docker-logs
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: positions
              mountPath: /tmp
      volumes:
        - name: alloy-config
          configMap:
            name: alloy-config
        - name: pods-logs
          hostPath:
            path: /var/log/pods
        - name: docker-logs
          hostPath:
            path: /var/lib/docker/containers
        - name: positions
          emptyDir: {}

---
# =============================================================================
# Mesh identity for INTERNAL routes
# =============================================================================
# The internal routes — every internal contract (all under `/internal/*` or
# `/<service>/internal/*`, a segment the nginx gateway refuses from outside), the
# quota usage counters and the audit ingest — are enforced IN THE APPLICATION by
# api-core's `requireInternalService`,
# which refuses every user token and admits only the named calling services,
# whose names are cryptographically bound to their signing keys. That check is
# the enforcement, and it has to be: docker compose runs no mesh at all, and the
# gate must hold identically there (packages/api-core/test/internal-route-mesh-less.test.ts
# proves it does).
#
# What this file adds is DEFENCE IN DEPTH for the targets that DO run Istio: a
# second, independent refusal at the network layer, so reaching an internal route
# needs both a valid service token AND the right workload identity.
#
# -- Why a waypoint ----------------------------------------------------------
# These are per-ROUTE rules, so they are Layer 7 (path + method). In ambient
# mode ztunnel is L4-only and cannot evaluate an HTTP path, so an L7
# AuthorizationPolicy is enforced by a waypoint proxy or not at all. The
# `pb-waypoint` Gateway below is that proxy, attached (via
# `istio.io/use-waypoint`) to exactly the seven Services that expose an internal
# route (platform, message, compliance, quota, reporting, ops-center,
# image-registry) — not
# namespace-wide, which would put an Envoy hop in front of the
# datastores too.
#
# -- Why DENY rather than ALLOW ----------------------------------------------
# ALLOW policies UNION, so adding an ALLOW for the internal paths would not
# narrow anything: the broad per-service ALLOW in istio.yaml (which must keep
# admitting nginx for ordinary user traffic on the same port) would still admit
# everyone. DENY takes precedence over ALLOW, so `notPrincipals` + a path match
# expresses "only these callers, on this route" without re-stating every
# service's full caller list here.
#
# -- Path matching -----------------------------------------------------------
# Istio supports exact, prefix (`/x/*`) and suffix (`*/x`) paths only — no
# wildcard in the middle. Routes with an `:orgId` segment are therefore matched
# by suffix or by prefix, which is why e.g. `*/increment` appears rather than
# `/quotas/*/increment`. The app-side gate matches the exact route regardless.
#
# -- Keeping this in step with the code --------------------------------------
# Each service's route-coverage test declares its internal routes and their
# callers (`findInternalRouteViolations`), and the declaration is checked against
# the routes in BOTH directions — so adding or re-scoping an internal route is a
# visible change there, and this file is reviewed against that one list.
#
# -- Rollback ----------------------------------------------------------------
# Remove the `istio.io/use-waypoint` label from a Service and its traffic stops
# going through the waypoint; the policies below then match nothing and the
# app-side gate carries the route on its own, exactly as it does under compose.
# =============================================================================

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: pb-waypoint
  namespace: pipeline-builder
  labels:
    # Attach per-SERVICE (the default), so only the Services that opt in with
    # `istio.io/use-waypoint: pb-waypoint` are routed through it.
    istio.io/waypoint-for: service
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
---
# -- platform ----------------------------------------------------------------
# POST /internal/notify-email — compliance relays notification emails, the plugin
# service relays plugin-ecosystem notices, reporting relays a published
# stakeholder report to the addresses IT verified, quota mails its 80%/100%
# threshold notices to an account's admins and billing contacts, billing
# mails an expansion OFFER to the same people, and ops-center mails org
# alert destinations of the email kind and the destination-failing notice to an
# org's admins — through platform, which holds the SMTP credentials and the user
# directory.
#
# Each caller is confined to its OWN leg by the controller, told apart by the
# body: a billing token without `offerNotice` is refused rather than falling
# through to the tenant leg, whose `targetUsers` would let it name arbitrary
# members.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: platform-internal-notify-email
  namespace: pipeline-builder
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: platform
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/pipeline-builder/sa/billing
              - cluster.local/ns/pipeline-builder/sa/compliance
              - cluster.local/ns/pipeline-builder/sa/ops-center
              - cluster.local/ns/pipeline-builder/sa/plugin
              - cluster.local/ns/pipeline-builder/sa/quota
              - cluster.local/ns/pipeline-builder/sa/reporting
      to:
        - operation:
            methods: ["POST"]
            paths: ["/internal/notify-email"]
    # GET /internal/notify-email/status — `{ enabled }`, the precondition the
    # plugin service checks before serving anonymous submissions, and the whole
    # of the ask agent's notification diagnosis (a disabled send reports
    # success, so nothing else surfaces it), and ops-center's alert-delivery
    # posture for the email channel. Reading the instance-wide switch is
    # strictly weaker than sending: `ask-agent` is admitted here, never above.
    # reporting reads it before a stakeholder-report email delivery
    # (api/reporting report-delivery.ts, PLATFORM_INTERNAL.notifyEmailStatus).
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/pipeline-builder/sa/ask-agent
              - cluster.local/ns/pipeline-builder/sa/ops-center
              - cluster.local/ns/pipeline-builder/sa/plugin
              - cluster.local/ns/pipeline-builder/sa/reporting
      to:
        - operation:
            methods: ["GET"]
            paths: ["/internal/notify-email/status"]
---
# GET /internal/ecosystem/* — the plugin service's plugin-ecosystem governance
# reads (eligible-approver count for two-person approval; Verified eligibility:
# verified domains and owner MFA). Counts and domain names only.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: platform-internal-ecosystem
  namespace: pipeline-builder
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: platform
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/pipeline-builder/sa/plugin
      to:
        - operation:
            paths: ["/internal/ecosystem/*"]
---
# GET /internal/reporting/* — the facts a SCHEDULED stakeholder
# report needs, which the reporting service cannot know on its own: whether a
# definition's OWNER is still an active member holding the reporting permissions
# (a run is authorized as the owner, not as a caller), and whether one named
# address is a member of the org, plus the COUNTS behind a report's access-posture
# panel. And GET /internal/reporting/report-readers/:orgId — the user ids (capped
# at 500, never a name or address) of the members holding reports:read, who a
# published report's in-app notice goes to; that one also needs a service token
# scoped to the path org. This one policy covers the whole prefix, so the new
# route has exactly the same single caller as the rest of it.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: platform-internal-reporting
  namespace: pipeline-builder
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: platform
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/pipeline-builder/sa/reporting
      to:
        - operation:
            paths: ["/internal/reporting/*"]
---
# GET /internal/ai/* — the org half of every AI call: the org's AI switch and
# which providers it holds its own key for, and the DECRYPTED org provider key
# (audited on platform as org.ai-key.read). Only the four services that make AI
# calls: ask-agent (Ask + the agent), pipeline and plugin (generation), reporting
# (report summaries).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: platform-internal-ai
  namespace: pipeline-builder
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: platform
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/pipeline-builder/sa/ask-agent
              - cluster.local/ns/pipeline-builder/sa/pipeline
              - cluster.local/ns/pipeline-builder/sa/plugin
              - cluster.local/ns/pipeline-builder/sa/reporting
      to:
        - operation:
            paths: ["/internal/ai/*"]
---
# GET /internal/kms-config/:orgId — an org's per-org KMS secret-encryption
# config (key id + the wrapped master as ciphertext; never a plaintext key).
# Only pipeline: with SECRET_ENCRYPTION_PER_ORG_KMS=true it resolves each org's
# master to decrypt that org's runner signing key, caching the answer per org
# for 60 s.
#
# The reverse leg, POST /pipelines/internal/runner-signing-keys/reencrypt
# (platform's rotation flow -> pipeline, re-wrapping the runner signing keys
# after a SECRET_ENCRYPTION_KEY or per-org KMS rotation), has no rule here
# because the pipeline Service is not waypoint-attached: an L7 path rule on it
# would be enforced by nobody (ztunnel is L4-only). It is carried, like
# pipeline's other internal route (/pipelines/internal/orgs/:orgId/purge), by
# the app-side gate (`requireInternalService({ callers: ['platform'] })`) and
# the workload layer (`pipeline-allow` in istio.yaml admits sa/platform).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: platform-internal-kms-config
  namespace: pipeline-builder
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: platform
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/pipeline-builder/sa/pipeline
      to:
        - operation:
            paths: ["/internal/kms-config/*"]
---
# GET /internal/support/entitlement/:orgId — may this org open a support case,
# and at what level? The message service owns the support thread, so it owns the
# moment a case is opened, but it cannot decide entitlement on its own:
# `supportContacts` is not a quota-service type (it is a live cap, not a period
# counter) and the EFFECTIVE limit is tier base plus bundles, which only billing
# computes — and already syncs onto the root org here. Returns one org's
# allowance and level, never a contact list and never a name.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: platform-internal-support
  namespace: pipeline-builder
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: platform
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/pipeline-builder/sa/message
      to:
        - operation:
            paths: ["/internal/support/*"]
---
# GET /internal/offers/seat-activity/:orgId — seats held against members who
# actually used them, for the expansion-offers profile's VALUE signal. BILLING
# only: the offers agent has no surface of its own and runs inside billing
# until it is extracted. It is a DISQUALIFIER rather than a sales signal — an
# account at its seat cap whose members have not signed in is a churn save, and
# offering it more seats is the worst available outcome — so the read returns
# three counts and never a member, a name or an address.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: platform-internal-offers
  namespace: pipeline-builder
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: platform
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/pipeline-builder/sa/billing
      to:
        - operation:
            paths: ["/internal/offers/*"]
---
# /internal/ops/* — the identity facts the operations control plane needs from
# the identity hub, now that it runs as its own service (ops-center):
#   GET  /internal/ops/org-account-root/:orgId — the org's account root, which
#        the dashboard / alert-rule / destination quotas are pooled against;
#   POST /internal/ops/audit-activity          — the audit rows behind the
#        Observability → Audit Activity view (the audit chain stays platform's).
# ops-center only: nothing else serves those views.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: platform-internal-ops
  namespace: pipeline-builder
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: platform
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/pipeline-builder/sa/ops-center
      to:
        - operation:
            paths: ["/internal/ops/*"]
---
# POST /audit/events — every non-platform service forwards its audit trail here.
# The audit log is evidence, so the callers are enumerated rather than "anything
# in the mesh".
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: platform-internal-audit-ingest
  namespace: pipeline-builder
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: platform
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/pipeline-builder/sa/ask-agent
              - cluster.local/ns/pipeline-builder/sa/billing
              - cluster.local/ns/pipeline-builder/sa/compliance
              - cluster.local/ns/pipeline-builder/sa/image-registry
              - cluster.local/ns/pipeline-builder/sa/message
              - cluster.local/ns/pipeline-builder/sa/ops-center
              - cluster.local/ns/pipeline-builder/sa/pipeline
              - cluster.local/ns/pipeline-builder/sa/plugin
              - cluster.local/ns/pipeline-builder/sa/quota
              - cluster.local/ns/pipeline-builder/sa/reporting
      to:
        - operation:
            methods: ["POST"]
            paths: ["/audit/events"]
---
# -- message -----------------------------------------------------------------
# POST /messages/internal/notify — system notifications, from platform, billing
# (renewal reminders), compliance (the in-app channel), quota (the 80%/100%
# threshold notices, dropped in the account root's inbox) and reporting (a
# published stakeholder report's in-app notice) and pipeline (a cross-account
# pipeline runner went unreachable, to the org's admins).
# GET /messages/internal/offers/frustration/* — billing only: the derived
# expansion-offers signal. The route exists
# so support-case TEXT never leaves this service, which is exactly why its
# caller list must stay at one.
# Everything else under /messages/internal/ (the org-delete attachment cascade)
# is platform-only. The prefix rule covers the whole internal surface, so a
# future internal route under it is denied to everyone else by default rather
# than being open until someone remembers.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: message-internal-routes
  namespace: pipeline-builder
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: message
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/pipeline-builder/sa/platform
              - cluster.local/ns/pipeline-builder/sa/billing
              - cluster.local/ns/pipeline-builder/sa/compliance
              - cluster.local/ns/pipeline-builder/sa/pipeline
              - cluster.local/ns/pipeline-builder/sa/quota
              - cluster.local/ns/pipeline-builder/sa/reporting
      to:
        - operation:
            paths: ["/messages/internal/notify"]
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/pipeline-builder/sa/billing
      to:
        - operation:
            paths: ["/messages/internal/offers/frustration/*"]
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/pipeline-builder/sa/platform
      to:
        - operation:
            paths: ["/messages/internal/*"]
            notPaths:
              - "/messages/internal/notify"
              - "/messages/internal/offers/frustration/*"
---
# -- compliance --------------------------------------------------------------
# POST /compliance/internal/events/entity — entity lifecycle events from pipeline/plugin.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: compliance-internal-entity-events
  namespace: pipeline-builder
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: compliance
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/pipeline-builder/sa/pipeline
              - cluster.local/ns/pipeline-builder/sa/plugin
      to:
        - operation:
            methods: ["POST"]
            paths: ["/compliance/internal/events/entity"]
---
# POST /compliance/internal/subscriptions/auto-subscribe — org onboarding, platform only.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: compliance-internal-auto-subscribe
  namespace: pipeline-builder
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: compliance
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/pipeline-builder/sa/platform
      to:
        - operation:
            methods: ["POST"]
            paths: ["/compliance/internal/subscriptions/auto-subscribe"]
---
# PUT + GET /compliance/internal/entitlements/:orgId — the billing→compliance entitlement
# sync and its drift read. Billing owns entitlement; nothing else may write what
# an org's enforced compliance content is.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: compliance-internal-entitlements
  namespace: pipeline-builder
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: compliance
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/pipeline-builder/sa/billing
      to:
        - operation:
            paths: ["/compliance/internal/entitlements/*"]
---
# GET /compliance/internal/posture — the read-only counts behind a stakeholder report's
# compliance panel. Reporting only, and reporting cannot reach anything else here:
# nothing on this path creates a scan, evaluates a rule, or discloses a rule's
# conditions, which are the org's own policy text.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: compliance-internal-posture
  namespace: pipeline-builder
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: compliance
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/pipeline-builder/sa/reporting
      to:
        - operation:
            paths: ["/compliance/internal/posture"]
---
# POST /compliance/internal/orgs/:orgId/purge — platform's durable cascade
# outbox tears a purged org's policies, rules, scans and their history out of
# compliance's own tables. Platform only: it alone decides an org is purged.
# Scoped to `/compliance/internal/orgs/*`, not the whole `/compliance/internal/*`
# prefix, which also carries the legs above (other callers).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: compliance-internal-org-purge
  namespace: pipeline-builder
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: compliance
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/pipeline-builder/sa/platform
      to:
        - operation:
            paths: ["/compliance/internal/orgs/*"]
---
# -- quota -------------------------------------------------------------------
# POST /quotas/:orgId/increment and /decrement — the usage counters. Every
# service meters its own inbound traffic, so the caller set is the whole internal
# fleet; what the rule excludes is nginx (i.e. anything arriving from outside the
# mesh) and any workload with no service identity of its own.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: quota-internal-counters
  namespace: pipeline-builder
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: quota
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/pipeline-builder/sa/ask-agent
              - cluster.local/ns/pipeline-builder/sa/billing
              - cluster.local/ns/pipeline-builder/sa/compliance
              - cluster.local/ns/pipeline-builder/sa/image-registry
              - cluster.local/ns/pipeline-builder/sa/message
              - cluster.local/ns/pipeline-builder/sa/ops-center
              - cluster.local/ns/pipeline-builder/sa/pipeline
              - cluster.local/ns/pipeline-builder/sa/platform
              - cluster.local/ns/pipeline-builder/sa/plugin
              - cluster.local/ns/pipeline-builder/sa/quota
              - cluster.local/ns/pipeline-builder/sa/reporting
      to:
        - operation:
            methods: ["POST"]
            paths: ["*/increment", "*/decrement"]
    # GET /quotas/:orgId/own-usage — the org's OWN (unpooled) numbers, behind
    # billing's per-team usage breakdown. Billing only: every other reader gets
    # the pooled view the dashboard shows.
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/pipeline-builder/sa/billing
      to:
        - operation:
            methods: ["GET"]
            paths: ["*/own-usage"]
    # PUT /quotas/entitlement-sync/:orgId — the billing→quota entitlement sync
    # (tier + effective limits). Billing owns entitlement, so only billing may
    # set what an org's enforced quota is.
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/pipeline-builder/sa/billing
      to:
        - operation:
            paths: ["/quotas/entitlement-sync/*"]
    # GET /quotas/internal/:orgId/profile — the POOLED per-dimension usage
    # picture the expansion-offers profile is built from. Billing only: the
    # offers scheduler runs there, and an account's whole usage shape is a
    # commercial read rather than one any service should take.
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/pipeline-builder/sa/billing
      to:
        - operation:
            methods: ["GET"]
            paths: ["*/profile"]
    # POST /quotas/internal/orgs/:orgId/purge — platform's durable cascade outbox
    # drops a purged org's quota document (its enforcement record). Platform
    # only: it alone decides an org is purged. POST-only so the GET profile read
    # above (`/quotas/internal/:orgId/profile`) is never matched by this rule.
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/pipeline-builder/sa/platform
      to:
        - operation:
            methods: ["POST"]
            paths: ["/quotas/internal/orgs/*"]
---
# -- reporting ---------------------------------------------------------------
# PUT + GET /reports/internal/retention-sync/:orgId — the billing→reporting retention
# sync and its drift read. A retention reduction destroys data on the next
# sweep, so only billing may drive it.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: reporting-internal-retention-sync
  namespace: pipeline-builder
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: reporting
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/pipeline-builder/sa/billing
      to:
        - operation:
            methods: ["PUT", "GET"]
            paths: ["/reports/internal/retention-sync/*"]
---
# PUT /reports/internal/stakeholder-sync/:orgId — the account gained or lost the Stakeholder
# Reports add-on, so every report in it pauses or resumes. Billing owns entitlement;
# nothing else may stop (or restart) a customer's scheduled reports.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: reporting-internal-stakeholder-sync
  namespace: pipeline-builder
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: reporting
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/pipeline-builder/sa/billing
      to:
        - operation:
            paths: ["/reports/internal/stakeholder-sync/*"]
---
# POST /reports/internal/stakeholder/owner-left/:orgId/:userId — platform tells
# reporting that a member was deactivated or removed, so the stakeholder reports
# they OWNED stop (a scheduled run is authorized as its owner). Only platform
# knows when a membership changed, and only platform may assert that it did.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: reporting-internal-stakeholder
  namespace: pipeline-builder
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: reporting
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/pipeline-builder/sa/platform
      to:
        - operation:
            paths: ["/reports/internal/stakeholder/*"]
---
# POST /reports/internal/orgs/:orgId/purge — platform's durable cascade outbox
# tears a purged org's reports, share links, DORA data and ingested events out
# of reporting's own tables. Platform only, like the owner-left leg above.
# Scoped to `/reports/internal/orgs/*`, not the whole `/reports/internal/*`
# prefix, which also carries billing's sync legs above.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: reporting-internal-org-purge
  namespace: pipeline-builder
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: reporting
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/pipeline-builder/sa/platform
      to:
        - operation:
            paths: ["/reports/internal/orgs/*"]
---
# -- ops-center ----------------------------------------------------------
# POST /ops/internal/orgs/:orgId/purge — platform's durable cascade outbox tears
# a purged org's dashboards, alert rules, alert destinations and their delivery
# state out of ops-center's own tables. Platform only: it alone decides an
# org is purged. The prefix rule covers the whole internal surface, so a future
# internal route under /ops/internal/ is denied to everyone else by default.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: ops-center-internal-org-purge
  namespace: pipeline-builder
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: ops-center
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/pipeline-builder/sa/platform
      to:
        - operation:
            paths: ["/ops/internal/*"]
---
# -- image-registry ----------------------------------------------------------
# POST /internal/plugin-signatures — image-registry cosign-signs a freshly pushed
# plugin image (and attaches its SBOM) with the plugin-signing key it alone
# holds. Only the plugin worker may ask: a signature is what synth trusts to pin
# CodeBuild to a digest, so a signing oracle open to any other caller would let
# it launder an arbitrary image. /token and /api/images/* are untouched.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: image-registry-internal-plugin-signatures
  namespace: pipeline-builder
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: image-registry
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/pipeline-builder/sa/plugin
      to:
        - operation:
            methods: ["POST"]
            paths: ["/internal/plugin-signatures"]
---
# /internal/plugin-publications* — the public/* namespace operations (publish =
# copy + fresh sign with tier/publisher annotations, resign, retag, yank, gc,
# verify, verify-cache invalidate). The plugin service drives them when the
# system org decides a publish request. Any other caller could mint or strip
# a trust tier on a published image, so only the plugin identity may reach them.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: image-registry-internal-plugin-publications
  namespace: pipeline-builder
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: image-registry
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/pipeline-builder/sa/plugin
      to:
        - operation:
            methods: ["GET", "POST"]
            paths: ["/internal/plugin-publications", "/internal/plugin-publications/*"]
---
# GET /internal/storage-usage/:orgId — one org's registry namespace size in
# bytes, which the quota service reads to fill `storageBytes.used` on the
# dashboard (nothing increments that counter; the registry measures it live).
# Quota only: the number is an org's footprint, not something any other workload
# needs.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: image-registry-internal-storage-usage
  namespace: pipeline-builder
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: image-registry
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/pipeline-builder/sa/quota
      to:
        - operation:
            methods: ["GET"]
            paths: ["/internal/storage-usage/*"]
---
# GET /internal/storage-breakdown/:orgId and DELETE /internal/storage-prune/:orgId
# — per-version storage attribution, and the tenant reclaim it informs.
#
# PLUGIN only, and that is the whole authorization story: the plugin service
# owns plugin versions, so it is the only workload that can decide whether a
# version may be retired (nothing references it, it is not a published copy)
# before showing a tenant a figure or deleting anything. The breakdown is also
# expensive — a catalog walk with a HEAD per blob — so nothing latency-sensitive
# should be able to reach it either.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: image-registry-internal-storage-reclaim
  namespace: pipeline-builder
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: image-registry
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/pipeline-builder/sa/plugin
      to:
        - operation:
            methods: ["GET", "DELETE"]
            paths: ["/internal/storage-breakdown/*", "/internal/storage-prune/*"]
---
# DELETE /internal/org-namespace/:orgId — a DELETED organization's private
# `org-<id>/*` images, reclaimed by the platform's org-delete cascade.
#
# PLATFORM only: it owns org lifecycle and holds no registry client of its own.
# The org is already gone by the time this runs, so there is no org token to
# check the caller against — this policy and the route's own caller list are the
# authorization. Published `public/*` copies are never touched by it: other
# organizations install those listings and pin their digests.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: image-registry-internal-org-namespace
  namespace: pipeline-builder
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: image-registry
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/pipeline-builder/sa/platform
      to:
        - operation:
            methods: ["DELETE"]
            paths: ["/internal/org-namespace/*"]
---
# DELETE /internal/quarantine/:submissionId — the plugin service drops an
# anonymous submission's quarantined build once it is decided or expired.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: image-registry-internal-quarantine
  namespace: pipeline-builder
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: image-registry
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/pipeline-builder/sa/plugin
      to:
        - operation:
            paths: ["/internal/quarantine/*"]
---
# -- plugin-quarantine-builder (anonymous plugin submissions) -----
# The quarantine builder's only legitimate waypoint hop is image-registry's
# registry-token realm (GET /token) during a push/pull. Deny it every other
# path on image-registry, and every other waypoint-fronted Service outright —
# NetworkPolicy lets it reach the waypoint pod, and the waypoint's own identity
# is admitted by those Services' ALLOW policies, so without these a RUN step in
# an anonymous build could call platform/quota/… through the waypoint.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: image-registry-quarantine-builder-token-only
  namespace: pipeline-builder
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: image-registry
  action: DENY
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/pipeline-builder/sa/plugin-quarantine-builder
      to:
        - operation:
            notPaths: ["/token"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: quarantine-builder-deny-waypoint-services
  namespace: pipeline-builder
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: platform
    - group: ""
      kind: Service
      name: message
    - group: ""
      kind: Service
      name: compliance
    - group: ""
      kind: Service
      name: quota
    - group: ""
      kind: Service
      name: reporting
    - group: ""
      kind: Service
      name: ops-center
  action: DENY
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/pipeline-builder/sa/plugin-quarantine-builder

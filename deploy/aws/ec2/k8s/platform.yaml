---
# =============================================================================
# Platform Service
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: platform
  labels:
    app: platform
    # This Service exposes INTERNAL routes, so its traffic goes through the
    # `pb-waypoint` proxy, which is the only thing in an ambient mesh that can
    # enforce a per-ROUTE (L7) AuthorizationPolicy. See k8s/istio-internal-routes.yaml
    # — removing this label is the rollback: the policies then match nothing and
    # the app-side `requireInternalService` gate carries the routes alone.
    istio.io/use-waypoint: pb-waypoint
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: platform

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform
  labels:
    app: platform
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: platform
  template:
    metadata:
      labels:
        app: platform
        app.kubernetes.io/component: backend
        version: "7.3.3"
        track: stable
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: platform
      # Stateless API server — no need for the default ServiceAccount token
      # mounted at /var/run/secrets/kubernetes.io/serviceaccount/. Reduces blast
      # radius if the container is compromised (no kubelet API access).
      # Platform holds NO Kubernetes RBAC at all: the PVC auto-expand and
      # Postgres rung controllers (and their Roles) moved to ops-center, so
      # the identity that holds the user-token signing key cannot patch a
      # cluster object. test/deploy-contracts ops-center-rbac-contract
      # asserts it stays that way.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: platform
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-for-dependencies
          image: busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616  # busybox:1.38
          resources:
            limits:
              cpu: "100m"
              memory: 64Mi
            requests:
              cpu: "50m"
              memory: 32Mi
          command:
            - sh
            - -c
            - |
              echo "Waiting for mongodb..."
              until nc -z mongodb 27017; do sleep 3; done
              echo "Dependencies ready"
      containers:
        - name: platform
          image: ghcr.io/mwashburn160/platform:7.3.3@sha256:f245e33abc594ff1670d60775f12dd32f4c092adf63c7cb54c1daa23a9949356
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: app-env
            # Credentials (DB_PASSWORD, MONGODB_URI, API keys, …) split out of app-env.
            - secretRef:
                name: app-secrets
          env:
            - name: SERVICE_NAME
              value: "platform"
            - name: PORT
              value: "3000"
          resources:
            limits:
              cpu: "750m"
              memory: 768Mi
            requests:
              cpu: "400m"
              memory: 384Mi
          # EXEC ON LOOPBACK — see k8s/pgbouncer.yaml for the full rationale.
          # Under Istio ambient the kubelet -> podIP probe path does not work on
          # EKS Auto Mode (verified: in-mesh pod -> this podIP:PORT succeeds, the
          # kubelet probe to the same address times out). 127.0.0.1 never leaves
          # the pod netns so it bypasses ztunnel.
          # busybox `wget`, not `node -e fetch(...)`: ~5ms CPU per probe vs ~195ms
          # (measured 2026-11-18; the node probe throttled frontend at its 500m limit).
          # wget exits 1 on refused/4xx/5xx, so /ready's 503 still gates. Image audited:
          # /usr/bin/wget -> /bin/busybox. (plugin's image has no wget — it stays on node.)
          readinessProbe:
            exec:
              command: ["wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/ready"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          startupProbe:
            exec:
              command: ["wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          volumeMounts:
            # This pod's OWN internal-token signing key and the PUBLIC
            # bundle it verifies its peers with. One private key per pod — that
            # is what stops a compromised service signing as another — while the
            # bundle is public and identical everywhere. Both from
            # deploy/bin/service-signing-keys.sh; the service refuses to start
            # without them.
            - name: service-signing-key
              mountPath: /etc/pipeline-builder/service-keys
              readOnly: true
            - name: service-key-bundle
              mountPath: /etc/pipeline-builder/service-key-bundle
              readOnly: true
            # The ES256 user-token signing key. Mounted into PLATFORM ONLY — it
            # is the one credential in the fleet that can mint a token for a
            # person; every other service verifies against the public keys
            # platform publishes at /.well-known/jwks.json. TOKEN_SIGNING_MODE
            # =kms installs no such Secret, and platform then never reads a file.
            - name: token-signing-key
              mountPath: /etc/pipeline-builder/keys
              readOnly: true
      volumes:
        - name: service-signing-key
          secret:
            secretName: service-key-platform
            defaultMode: 0444
        - name: service-key-bundle
          secret:
            secretName: service-key-bundle
            defaultMode: 0444
        # `optional: true` so a KMS-signing install (where bin/k8s-resources.sh
        # creates no token-signing-key Secret) still schedules.
        - name: token-signing-key
          secret:
            secretName: token-signing-key
            optional: true
            defaultMode: 0444
---
# =============================================================================
# Platform HorizontalPodAutoscaler
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: platform
  labels:
    app: platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: platform
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    # CPU-only autoscaling. A memory-utilization metric was removed: these
    # services carry a large BASELINE heap, so idle memory sits near the target
    # and adding replicas does not lower per-pod memory — the HPA would pin to
    # maxReplicas forever and oversubscribe the single node. Scale on CPU (load-
    # proportional) only.
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
    scaleDown:
      stabilizationWindowSeconds: 300

---
# =============================================================================
# Platform PodDisruptionBudget
# =============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: platform
  labels:
    app: platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: platform

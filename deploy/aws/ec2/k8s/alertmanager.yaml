---
# =============================================================================
# Alertmanager Service
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  labels:
    app: alertmanager
spec:
  type: ClusterIP
  ports:
    - port: 9093
      targetPort: 9093
      protocol: TCP
      name: http
  selector:
    app: alertmanager

---
# =============================================================================
# Alertmanager PersistentVolume (hostPath)
# =============================================================================
# Backs `/alertmanager` so silences and the notification log (nflog) survive
# pod restarts. Sized small — silences are tiny JSON records and the nflog
# is bounded by Alertmanager's retention (default 120h). 256Mi is generous.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: alertmanager-pv
  labels:
    app: alertmanager
spec:
  storageClassName: ""
  capacity:
    storage: 256Mi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /opt/pipeline/pipeline-data/db-data/alertmanager
    type: DirectoryOrCreate

---
# =============================================================================
# Alertmanager PersistentVolumeClaim
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alertmanager-data
  labels:
    app: alertmanager
spec:
  storageClassName: ""
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 256Mi
  selector:
    matchLabels:
      app: alertmanager

---
# =============================================================================
# Alertmanager Deployment
# =============================================================================
# Receives alerts from Prometheus (prometheus.yml `alerting.alertmanagers`
# points here), routes them by `severity` label, and forwards to Slack.
# The Slack webhook URLs are MOUNTED FILES from the `alertmanager-slack` Secret
# (deploy/shared/config/alertmanager/alertmanager.yml reads them with `api_url_file`), not env
# vars — Alertmanager does not expand env vars in its config, so env wiring
# would deliver nothing. The Secret is created
# unconditionally by setup, which REFUSES to deploy while the URLs are still
# placeholders, so a missing Secret here is a loud FailedMount rather than a
# silent no-op.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  labels:
    app: alertmanager
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # RWO PVC can't be mounted by two pods at once — Recreate avoids the
  # rolling-update overlap that would otherwise stall on the second attach.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      annotations:
        # Scraped by the `kubernetes-pods` job. The observability stack has to
        # monitor ITSELF — without this, a Loki/Thanos/Alertmanager failure is
        # invisible, and LokiRateCapBreach could never fire because the metric
        # it alerts on (loki_discarded_samples_total) is emitted by Loki.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9093"
        prometheus.io/path: /metrics
      labels:
        app: alertmanager
        app.kubernetes.io/component: observability
    spec:
      serviceAccountName: alertmanager
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65534
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
      initContainers:
        - name: fix-permissions
          image: busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616  # busybox:1.38
          resources:
            limits:
              cpu: "100m"
              memory: 64Mi
            requests:
              cpu: "25m"
              memory: 32Mi
          command: ["sh", "-c", "chown -R 65534:65534 /alertmanager"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: alertmanager-storage
              mountPath: /alertmanager
      containers:
        - name: alertmanager
          image: prom/alertmanager@sha256:9e082985f56f4c8c9f724e18f2288c6708f472e56a5286b8863d080434ea065d  # prom/alertmanager:v0.33.1
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"
          ports:
            - containerPort: 9093
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              cpu: "200m"
              memory: 128Mi
            requests:
              cpu: "25m"
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9093
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: alertmanager-config
              mountPath: /etc/alertmanager
              readOnly: true
            # Per-org relay bearer token, read per request by the platform-relay
            # receiver (credentials_file: /etc/alertmanager-secrets/relay-token).
            # A separate path — not nested under the read-only config mount.
            - name: alertmanager-relay
              mountPath: /etc/alertmanager-secrets
              readOnly: true
            # Ops-team Slack webhook URLs, one file each, read per
            # notification by the critical-slack / warning-slack receivers.
            - name: alertmanager-slack
              mountPath: /etc/alertmanager-slack
              readOnly: true
            - name: alertmanager-storage
              mountPath: /alertmanager
      volumes:
        - name: alertmanager-config
          configMap:
            name: alertmanager-config
        - name: alertmanager-relay
          secret:
            secretName: alertmanager-relay
            defaultMode: 0444
            items:
              - key: ALERT_WEBHOOK_INSTANCE_TOKEN
                path: relay-token
        - name: alertmanager-slack
          secret:
            secretName: alertmanager-slack
            defaultMode: 0444
            items:
              - key: SLACK_CRITICAL_WEBHOOK_URL
                path: critical-url
              - key: SLACK_WARNING_WEBHOOK_URL
                path: warning-url
        - name: alertmanager-storage
          persistentVolumeClaim:
            claimName: alertmanager-data

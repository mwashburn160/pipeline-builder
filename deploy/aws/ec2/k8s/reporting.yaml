---
# =============================================================================
# Reporting Service
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: reporting
  labels:
    app: reporting
    # This Service exposes INTERNAL routes, so its traffic goes through the
    # `pb-waypoint` proxy, which is the only thing in an ambient mesh that can
    # enforce a per-ROUTE (L7) AuthorizationPolicy. See k8s/istio-internal-routes.yaml
    # — removing this label is the rollback: the policies then match nothing and
    # the app-side `requireInternalService` gate carries the routes alone.
    istio.io/use-waypoint: pb-waypoint
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: reporting

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting
  labels:
    app: reporting
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: reporting
  template:
    metadata:
      labels:
        app: reporting
        app.kubernetes.io/component: backend
        version: "4.5.1"
        track: stable
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: reporting
      # Stateless API server — no need for the default ServiceAccount token
      # mounted at /var/run/secrets/kubernetes.io/serviceaccount/. Reduces blast
      # radius if the container is compromised (no kubelet API access).
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: reporting
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-for-dependencies
          image: busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616  # busybox:1.38
          resources:
            limits:
              cpu: "100m"
              memory: 64Mi
            requests:
              cpu: "50m"
              memory: 32Mi
          command:
            - sh
            - -c
            - |
              echo "Waiting for postgres..."
              until nc -z postgres 5432; do sleep 3; done
              echo "Dependencies ready"
      containers:
        - name: reporting
          image: ghcr.io/mwashburn160/reporting:4.5.1@sha256:fc53310a6598cd1a1c84949e6d3463a3e982deff8c093917580f9fa04d6f7fc0
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: app-env
            # Credentials (DB_PASSWORD, MONGODB_URI, API keys, …) split out of app-env.
            - secretRef:
                name: app-secrets
          env:
            - name: SERVICE_NAME
              value: "reporting"
            # THE ONLY SERVICE THAT PINS THE V8 HEAP, and only because it is the
            # only one with a SECOND tenant in its cgroup.
            #
            # Node 24 is cgroup-aware: measured against this exact image, V8 sizes
            # its default heap at ~55% of the container limit (496MB of this 896Mi).
            # For a single-tenant Node container that split is fine and it tracks a
            # limit change automatically, which is why no other service sets this —
            # a pinned number would NOT follow a later limit change, leaving the
            # service unable to use memory you are paying for.
            #
            # Here V8's 496MB budget is computed as though V8 were alone, and it is
            # not: a PDF render launches Chromium in this container (~150-300MB RSS)
            # on top of ~100MB of Node runtime and off-heap. 496+300+100 is about the
            # whole limit, and V8 does not GC hard until it approaches ITS ceiling —
            # so the kill arrives during a render that lands on a heap-heavy request.
            # 320MB leaves roughly 570MB for the runtime and Chromium at
            # REPORT_PDF_CONCURRENCY=1.
            - name: NODE_OPTIONS
              value: "--max-old-space-size=320"
          # SIZED FOR CHROMIUM, not for Node. A report PDF launches a headless Chromium in
          # this container (services/report-pdf.ts), and its PEAK is what has to fit: one
          # render is roughly 300-400MB of browser plus renderer on top of the service's
          # own ~200MB baseline. At 384Mi the first download would OOM-kill the pod —
          # taking every in-flight request with it, rather than failing that one render.
          #
          # REQUESTS stay at the idle baseline on purpose: renders are occasional and
          # human-initiated, so reserving the peak on every replica would waste it all the
          # time. The limit is the safety ceiling, not the expected usage.
          #
          # REPORT_PDF_CONCURRENCY and this limit are ONE knob: raising renders-at-once
          # without raising the memory here is how a busy Monday becomes an outage.
          resources:
            limits:
              cpu: "1000m"
              memory: 896Mi
            requests:
              # 384Mi, not 192Mi. The request is what the kubelet evicts BY: under
              # node memory pressure it takes Burstable pods in order of how far
              # usage exceeds request, so a pod designed to use ~800MB while
              # requesting 192Mi was first in line ahead of anything misbehaving.
              # Not raised to the full limit — that would reserve 896Mi on the node
              # permanently for a service that idles near 200MB, which on the
              # single-node ec2 target is most of the box.
              cpu: "150m"
              memory: 384Mi
          # EXEC ON LOOPBACK — see k8s/pgbouncer.yaml for the full rationale.
          # Under Istio ambient the kubelet -> podIP probe path does not work on
          # EKS Auto Mode (verified: in-mesh pod -> this podIP:PORT succeeds, the
          # kubelet probe to the same address times out). 127.0.0.1 never leaves
          # the pod netns so it bypasses ztunnel. `node` ships in every service
          # image; this mirrors frontend/Dockerfile's own HEALTHCHECK.
          readinessProbe:
            exec:
              command: ["node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          startupProbe:
            exec:
              command: ["node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          volumeMounts:
            # Chromium's user-data directory. The root filesystem above is read-only, and
            # Chromium EXITS AT STARTUP if it cannot write one — so without this mount PDFs
            # never render and nothing else looks wrong. An emptyDir rather than a real
            # volume because the contents are scratch for the life of one render; it is also
            # why `--disable-dev-shm-usage` is set, which keeps Chromium off the 64MB
            # /dev/shm a container gets by default and out of needing a second volume.
            - name: report-pdf-scratch
              mountPath: /tmp/report-pdf
            # This pod's OWN internal-token signing key and the PUBLIC
            # bundle it verifies its peers with. One private key per pod — that
            # is what stops a compromised service signing as another — while the
            # bundle is public and identical everywhere. Both from
            # deploy/bin/service-signing-keys.sh; the service refuses to start
            # without them.
            - name: service-signing-key
              mountPath: /etc/pipeline-builder/service-keys
              readOnly: true
            - name: service-key-bundle
              mountPath: /etc/pipeline-builder/service-key-bundle
              readOnly: true
      volumes:
        - name: report-pdf-scratch
          emptyDir:
            # Bounded, so a wedged render cannot fill the node's ephemeral storage and get
            # the pod evicted — which would look like an unrelated crash.
            sizeLimit: 64Mi
        - name: service-signing-key
          secret:
            secretName: service-key-reporting
            defaultMode: 0444
        - name: service-key-bundle
          secret:
            secretName: service-key-bundle
            defaultMode: 0444
---
# =============================================================================
# Reporting HorizontalPodAutoscaler
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: reporting
  labels:
    app: reporting
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: reporting
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # CPU-only autoscaling. A memory-utilization metric was removed: these
    # services carry a large BASELINE heap, so idle memory sits near the target
    # and adding replicas does not lower per-pod memory — the HPA would pin to
    # maxReplicas forever and oversubscribe the single node. Scale on CPU (load-
    # proportional) only.
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
    scaleDown:
      stabilizationWindowSeconds: 300

---
# =============================================================================
# Reporting PodDisruptionBudget
# =============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: reporting
  labels:
    app: reporting
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: reporting

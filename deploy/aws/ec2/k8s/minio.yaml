---
# =============================================================================
# MinIO — S3-compatible object storage for message attachments.
#
# Single-writer stateful service: RWO volume on pb-ebs with a Recreate strategy
# (no two MinIO pods on the same volume). The message service talks to it over
# the in-cluster ClusterIP using the S3 SDK (path-style). Credentials live in
# `minio-secret`; the message deployment reads the SAME secret for its S3 keys.
# =============================================================================
# NOTE: the `minio-secret` Secret is NOT defined here. It is created from .env by
# pb_create_app_secrets (deploy/bin/k8s-resources.sh) before this manifest is
# applied, so the MINIO_*/`*_S3_*` values in .env are the single source of truth
# and pb_gen_env_secrets can randomise them per deploy. It previously lived here
# as a literal with `minioadmin`/`minioadmin` defaults, which silently overrode
# whatever the operator put in .env.
---
# One-shot bootstrap: create per-service buckets + per-service, bucket-scoped
# users (so no workload uses the root credentials). Idempotent; safe to re-apply.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  labels:
    app: minio
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: minio-init
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: mc
          image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727  # quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
          resources:
            limits:
              cpu: "100m"
              memory: 256Mi
            requests:
              cpu: "25m"
              memory: 64Mi
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: minio-secret, key: root-user } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: minio-secret, key: root-password } }
            - name: MESSAGE_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: minio-secret, key: message-access-key } }
            - name: MESSAGE_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: minio-secret, key: message-secret-key } }
            - name: REGISTRY_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: minio-secret, key: registry-access-key } }
            - name: REGISTRY_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: minio-secret, key: registry-secret-key } }
            - name: LOKI_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: minio-secret, key: loki-access-key } }
            - name: LOKI_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: minio-secret, key: loki-secret-key } }
            - name: THANOS_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: minio-secret, key: thanos-access-key } }
            - name: THANOS_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: minio-secret, key: thanos-secret-key } }
            - name: PLUGIN_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: minio-secret, key: plugin-access-key } }
            - name: PLUGIN_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: minio-secret, key: plugin-secret-key } }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              die() { echo "minio-init: $1" >&2; exit 1; }
              run_ok() {  # $1=what, rest=command; tolerate an "exists" outcome only
                # POSIX sh: `shift` rather than a "${@:2}" slice — this container
                # runs /bin/sh from the minio/mc image, not bash.
                what="$1"; shift
                out=$("$@" 2>&1) && return 0
                case "$out" in
                  *already*exists*|*already*attached*|*already*enabled*|*XMinioAdminUserAlreadyExists*) return 0 ;;
                  *) echo "$out" >&2; die "$what failed" ;;
                esac
              }
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do echo 'waiting for minio...'; sleep 2; done
              for b in message-attachments registry loki thanos plugins; do mc mb --ignore-existing "local/$b"; done
              # These were `|| true`. They are re-run every provision and fail
              # benignly when already configured, but the blanket mask also hid
              # real failures — and a silently-absent lifecycle rule is not
              # cosmetic: the plugins bucket then grows without bound, because the
              # expiry below is the backstop for a build whose cleanup never ran.
              run_ok "version enable message-attachments" mc version enable local/message-attachments
              run_ok "ilm noncurrent-expire message-attachments" mc ilm rule add --noncurrent-expire-days 30 local/message-attachments
              # plugins holds transient build-context ZIPs (deleted post-build);
              # expire after 7 days as a backstop against a missed delete.
              run_ok "ilm expire plugins" mc ilm rule add --expire-days 7 local/plugins
              # $1=bucket $2=policy $3=access $4=secret
              #
              # Every step is VERIFIED rather than `|| true`-ed. The three commands
              # are re-run on each provision and two of them fail benignly when the
              # object already exists ("already exists" / "already attached"), so a
              # blanket `|| true` looked harmless — but it also swallowed real
              # failures. That matters now that these credentials are RANDOM per
              # deploy (bin/gen-env-secrets.sh): re-provisioning against an existing
              # MinIO volume has to actually rotate the stored secret, and if that
              # silently failed, every service would authenticate with a new key
              # against a user still holding the old one. Tolerate "exists", fail on
              # anything else, and assert the end state.
              make_user() {
                echo "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:*\"],\"Resource\":[\"arn:aws:s3:::$1\",\"arn:aws:s3:::$1/*\"]}]}" > /tmp/p.json
                run_ok "policy create $2" mc admin policy create local "$2" /tmp/p.json
                # `user add` is an upsert in MinIO — this is what rotates the secret
                # of an existing user, so it must NOT be masked.
                mc admin user add local "$3" "$4" || die "user add $3 failed"
                run_ok "policy attach $2 -> $3" mc admin policy attach local "$2" --user "$3"
                # End-state assertion: the user must exist and be enabled. Catches a
                # rotation that reported success but left the account disabled.
                mc admin user info local "$3" >/dev/null || die "user $3 missing after add"
              }
              make_user message-attachments message-attachments-rw "$MESSAGE_S3_ACCESS_KEY" "$MESSAGE_S3_SECRET_KEY"
              make_user registry            registry-rw            "$REGISTRY_S3_ACCESS_KEY" "$REGISTRY_S3_SECRET_KEY"
              make_user loki                loki-rw                "$LOKI_S3_ACCESS_KEY"     "$LOKI_S3_SECRET_KEY"
              make_user thanos              thanos-rw              "$THANOS_S3_ACCESS_KEY"   "$THANOS_S3_SECRET_KEY"
              make_user plugins             plugins-rw             "$PLUGIN_S3_ACCESS_KEY"   "$PLUGIN_S3_SECRET_KEY"
              echo 'minio-init done'
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    app: minio
spec:
  type: ClusterIP
  ports:
    - port: 9000
      targetPort: 9000
      name: s3
    - port: 9001
      targetPort: 9001
      name: console
  selector:
    app: minio
---
# Single-node MULTI-DRIVE (SNMD) MinIO — 4 hostPath drives on this one node ⇒
# erasure set EC:2 (drive-fault tolerance). True node-HA needs multiple nodes
# (see the EKS distributed StatefulSet). Single-node ⇒ Recreate + one replica.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  labels:
    app: minio
    app.kubernetes.io/component: minio
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
        prometheus.io/path: /minio/v2/metrics/cluster
      labels:
        app: minio
        app.kubernetes.io/component: minio
    spec:
      serviceAccountName: minio
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: minio
          image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e  # quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
          args: ["server", "/data-1", "/data-2", "/data-3", "/data-4", "--console-address", ":9001"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 9000
              name: s3
            - containerPort: 9001
              name: console
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: minio-secret, key: root-user } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: minio-secret, key: root-password } }
            - name: HOME
              value: "/data-1"
          resources:
            limits:
              cpu: "400m"
              memory: 768Mi
            requests:
              cpu: "100m"
              memory: 128Mi
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /minio/health/live, port: 9000 }
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - { name: d1, mountPath: /data-1 }
            - { name: d2, mountPath: /data-2 }
            - { name: d3, mountPath: /data-3 }
            - { name: d4, mountPath: /data-4 }
      volumes:
        - name: d1
          hostPath: { path: /opt/pipeline/pipeline-data/minio-data/1, type: DirectoryOrCreate }
        - name: d2
          hostPath: { path: /opt/pipeline/pipeline-data/minio-data/2, type: DirectoryOrCreate }
        - name: d3
          hostPath: { path: /opt/pipeline/pipeline-data/minio-data/3, type: DirectoryOrCreate }
        - name: d4
          hostPath: { path: /opt/pipeline/pipeline-data/minio-data/4, type: DirectoryOrCreate }

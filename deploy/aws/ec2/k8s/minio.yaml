---
# =============================================================================
# MinIO — S3-compatible object storage for message attachments.
#
# Single-writer stateful service: RWO volume on pb-ebs with a Recreate strategy
# (no two MinIO pods on the same volume). The message service talks to it over
# the in-cluster ClusterIP using the S3 SDK (path-style). Credentials live in
# `minio-secret`; the message deployment reads the SAME secret for its S3 keys.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: minio-secret
  labels:
    app: minio
type: Opaque
stringData:
  # CHANGE THESE for any real deployment (kubectl create secret / sealed-secrets).
  # root-* are MinIO's admin credentials (server + bootstrap only). Each service
  # uses its OWN bucket-scoped key below — never the root creds.
  root-user: "minioadmin"
  root-password: "minioadmin"
  message-access-key: "message-svc"
  message-secret-key: "message-svc-secret"
  registry-access-key: "registry-svc"
  registry-secret-key: "registry-svc-secret"
  loki-access-key: "loki-svc"
  loki-secret-key: "loki-svc-secret"
  thanos-access-key: "thanos-svc"
  thanos-secret-key: "thanos-svc-secret"
  plugin-access-key: "plugin-svc"
  plugin-secret-key: "plugin-svc-secret"
---
# One-shot bootstrap: create per-service buckets + per-service, bucket-scoped
# users (so no workload uses the root credentials). Idempotent; safe to re-apply.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  labels:
    app: minio
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: minio-init
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: mc
          image: minio/mc:latest
          resources:
            limits:
              cpu: "100m"
              memory: 256Mi
            requests:
              cpu: "25m"
              memory: 64Mi
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: minio-secret, key: root-user } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: minio-secret, key: root-password } }
            - name: MESSAGE_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: minio-secret, key: message-access-key } }
            - name: MESSAGE_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: minio-secret, key: message-secret-key } }
            - name: REGISTRY_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: minio-secret, key: registry-access-key } }
            - name: REGISTRY_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: minio-secret, key: registry-secret-key } }
            - name: LOKI_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: minio-secret, key: loki-access-key } }
            - name: LOKI_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: minio-secret, key: loki-secret-key } }
            - name: THANOS_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: minio-secret, key: thanos-access-key } }
            - name: THANOS_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: minio-secret, key: thanos-secret-key } }
            - name: PLUGIN_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: minio-secret, key: plugin-access-key } }
            - name: PLUGIN_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: minio-secret, key: plugin-secret-key } }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do echo 'waiting for minio...'; sleep 2; done
              for b in message-attachments registry loki thanos plugins; do mc mb --ignore-existing "local/$b"; done
              mc version enable local/message-attachments || true
              mc ilm rule add --noncurrent-expire-days 30 local/message-attachments || true
              # plugins holds transient build-context ZIPs (deleted post-build);
              # expire after 7 days as a backstop against a missed delete.
              mc ilm rule add --expire-days 7 local/plugins || true
              make_user() {  # $1=bucket $2=policy $3=access $4=secret
                echo "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:*\"],\"Resource\":[\"arn:aws:s3:::$1\",\"arn:aws:s3:::$1/*\"]}]}" > /tmp/p.json
                mc admin policy create local "$2" /tmp/p.json || true
                mc admin user add local "$3" "$4" || true
                mc admin policy attach local "$2" --user "$3" || true
              }
              make_user message-attachments message-attachments-rw "$MESSAGE_S3_ACCESS_KEY" "$MESSAGE_S3_SECRET_KEY"
              make_user registry            registry-rw            "$REGISTRY_S3_ACCESS_KEY" "$REGISTRY_S3_SECRET_KEY"
              make_user loki                loki-rw                "$LOKI_S3_ACCESS_KEY"     "$LOKI_S3_SECRET_KEY"
              make_user thanos              thanos-rw              "$THANOS_S3_ACCESS_KEY"   "$THANOS_S3_SECRET_KEY"
              make_user plugins             plugins-rw             "$PLUGIN_S3_ACCESS_KEY"   "$PLUGIN_S3_SECRET_KEY"
              echo 'minio-init done'
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    app: minio
spec:
  type: ClusterIP
  ports:
    - port: 9000
      targetPort: 9000
      name: s3
    - port: 9001
      targetPort: 9001
      name: console
  selector:
    app: minio
---
# Single-node MULTI-DRIVE (SNMD) MinIO — 4 hostPath drives on this one node ⇒
# erasure set EC:2 (drive-fault tolerance). True node-HA needs multiple nodes
# (see the EKS distributed StatefulSet). Single-node ⇒ Recreate + one replica.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  labels:
    app: minio
    app.kubernetes.io/component: minio
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
        prometheus.io/path: /minio/v2/metrics/cluster
      labels:
        app: minio
        app.kubernetes.io/component: minio
    spec:
      serviceAccountName: minio
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data-1", "/data-2", "/data-3", "/data-4", "--console-address", ":9001"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 9000
              name: s3
            - containerPort: 9001
              name: console
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: minio-secret, key: root-user } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: minio-secret, key: root-password } }
            - name: HOME
              value: "/data-1"
          resources:
            limits:
              cpu: "400m"
              memory: 768Mi
            requests:
              cpu: "100m"
              memory: 128Mi
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /minio/health/live, port: 9000 }
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - { name: d1, mountPath: /data-1 }
            - { name: d2, mountPath: /data-2 }
            - { name: d3, mountPath: /data-3 }
            - { name: d4, mountPath: /data-4 }
      volumes:
        - name: d1
          hostPath: { path: /opt/pipeline/pipeline-data/minio-data/1, type: DirectoryOrCreate }
        - name: d2
          hostPath: { path: /opt/pipeline/pipeline-data/minio-data/2, type: DirectoryOrCreate }
        - name: d3
          hostPath: { path: /opt/pipeline/pipeline-data/minio-data/3, type: DirectoryOrCreate }
        - name: d4
          hostPath: { path: /opt/pipeline/pipeline-data/minio-data/4, type: DirectoryOrCreate }

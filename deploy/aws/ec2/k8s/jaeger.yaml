---
# =============================================================================
# Jaeger (all-in-one) — OpenTelemetry trace collector + UI
# =============================================================================
# Single-container OTLP collector with an in-memory store and the query UI.
# Server services export OTLP/HTTP to :4318 (set via OTEL_EXPORTER_OTLP_ENDPOINT
# in the app-env ConfigMap, sourced from .env). Browse traces by port-forwarding
# the UI:  kubectl -n pipeline-builder port-forward svc/jaeger 16686:16686
# In-memory storage = traces are lost on pod restart (fine for dev).
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  labels:
    app: jaeger
    app.kubernetes.io/component: observability
spec:
  type: ClusterIP
  ports:
    - port: 4318
      targetPort: 4318
      protocol: TCP
      name: otlp-http
    - port: 4317
      targetPort: 4317
      protocol: TCP
      name: otlp-grpc
    - port: 16686
      targetPort: 16686
      protocol: TCP
      name: ui
  selector:
    app: jaeger

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels:
    app: jaeger
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      annotations:
        # Scraped by the `kubernetes-pods` job. The observability stack has to
        # monitor ITSELF — without this, a Loki/Thanos/Alertmanager failure is
        # invisible, and LokiRateCapBreach could never fire because the metric
        # it alerts on (loki_discarded_samples_total) is emitted by Loki.
        prometheus.io/scrape: "true"
        prometheus.io/port: "14269"
        prometheus.io/path: /metrics
      labels:
        app: jaeger
        app.kubernetes.io/component: observability
    spec:
      serviceAccountName: jaeger
      securityContext:
        runAsUser: 10001
        runAsNonRoot: true
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one@sha256:ab6f1a1f0fb49ea08bcd19f6b84f6081d0d44b364b6de148e1798eb5816bacac  # jaegertracing/all-in-one:1.76.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            # OTLP receivers are opt-in on 1.x — enable gRPC (4317) + HTTP (4318).
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            # Cap the in-memory trace ring so a busy cluster can't OOM the pod.
            #
            # 10000, not 50000: at 50000 this cap did not do its job. Jaeger
            # all-in-one holds whole traces in the process heap, and with every
            # service exporting, 50000 of them need well past the 512Mi limit
            # below — the pod was OOM-killed every few hours and lost ALL its
            # traces each time, which is strictly worse than holding fewer.
            #
            # Lowered rather than raising the limit: this is memory storage, so
            # the traces are already lost on any restart, and what an operator
            # reads is the RECENT ones. Spending another 512Mi of node memory to
            # retain traces nobody queries — and only deferring the same OOM as
            # traffic grows — buys nothing.
            - name: MEMORY_MAX_TRACES
              value: "10000"
          ports:
            - containerPort: 4318
              name: otlp-http
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 16686
              name: ui
            - containerPort: 14269
              name: admin
          resources:
            limits:
              cpu: "500m"
              memory: 512Mi
            requests:
              cpu: "50m"
              memory: 128Mi
          # Probe the UI port — it serves a 200 at / without needing any
          # in-container tooling (the image ships no shell). The admin port
          # (14269) has no guaranteed 2xx path for an httpGet probe.
          # EXEC ON LOOPBACK — see k8s/pgbouncer.yaml for the full rationale.
          # The kubelet -> podIP probe path does not work under Istio ambient on
          # EKS Auto Mode; 127.0.0.1 bypasses ztunnel. `wget`/`nc` are present in
          # this image (audited on a live pod before converting — an exec probe
          # with a missing binary fails forever, which is worse than the bug).
          readinessProbe:
            exec:
              command: ["wget", "-q", "-O", "/dev/null", "-T", "3", "http://127.0.0.1:16686/"]
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["wget", "-q", "-O", "/dev/null", "-T", "3", "http://127.0.0.1:16686/"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5

---
# =============================================================================
# Jaeger — ingress on the OTLP ports from every trace-emitting service.
# default-deny-ingress would otherwise drop the exporters silently.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-jaeger-from-services
spec:
  podSelector:
    matchLabels:
      app: jaeger
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [platform, pipeline, plugin, quota, billing, message, reporting, compliance, image-registry, ask]
      ports:
        - port: 4318
        - port: 4317
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [grafana, kiali]
      ports:
        - port: 16686

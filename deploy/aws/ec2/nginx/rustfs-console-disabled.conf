# The RustFS console is OFF (ADMIN_UIS_ENABLED is not true) — see
# rustfs-console.conf for what it is and why it needs its own port.
#
# The port stays BOUND rather than unbound: nginx.conf includes this file
# unconditionally (a missing include is a fatal nginx error, not a warning) and
# the container/Service publish 9001 either way, so the honest signal for
# "deliberately off" is a 404 on every path, matching admin-uis-disabled.conf.
server {
    listen 9001;
    server_name _;

    location / {
        set $service "admin-console-off";
        return 404;
    }
}

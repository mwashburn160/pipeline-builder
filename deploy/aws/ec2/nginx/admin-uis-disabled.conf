        # Admin consoles are OFF (ADMIN_UIS_ENABLED is not true) — see admin-uis.conf.
        # The routes answer 404 rather than falling through to the frontend.
# The RustFS console has its own port and its own stub — see
# rustfs-console-disabled.conf; the same ADMIN_UIS_ENABLED flag swaps both.
        location ~ ^/(pgadmin|mongo-express|grafana|kiali)(/|$) {
            set $service "admin-console-off";
            return 404;
        }

        # ========================================
        # Admin consoles — OFF by default (ADMIN_UIS_ENABLED)
        # ========================================
        # pgAdmin, mongo-express, Grafana and Kiali are a direct line to a
        # datastore or to every tenant's telemetry. This file is swapped at deploy
        # time (deploy/bin/k8s-resources.sh pb_create_config_maps): with
        # ADMIN_UIS_ENABLED=true the routes below are served, each behind an
        # auth_request to platform's GET /admin/console-check (a live session of a
        # PLATFORM administrator at AAL2); otherwise admin-uis-disabled.conf 404s
        # them. The token rides in the `pb_admin_console` cookie the dashboard sets
        # when a superadmin opens a console, and is stripped before proxying so no
        # console ever sees a platform credential.
        #
        # The RustFS object-store console is NOT in this file, and cannot be: these
        # are `location` blocks included INSIDE the :8080 `server`, and the console
        # needs a `server` of its own (nginx cannot nest one here). RustFS's :9000 is
        # the S3 data plane with no UI, and the console's UI resolves its API from
        # window.location and then calls ROOT paths, so it only works on an origin
        # whose whole path space is RustFS's. It therefore lives in the sibling file
        # nginx/rustfs-console.conf — a `server { listen 9001; }` included at http
        # level — and is swapped by this SAME ADMIN_UIS_ENABLED flag, behind this
        # same superadmin auth_request.
        location = /_pb_admin_console_check {
            internal;
            set $service "admin-console-check";
            access_log off;
            proxy_pass http://platform.pipeline-builder.svc.cluster.local:3000/admin/console-check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization "Bearer $cookie_pb_admin_console";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location /pgadmin/ {
            set $service "pgadmin";
            auth_request /_pb_admin_console_check;
            # `auth_request` throws the subrequest's BODY away, so the gate's
            # ErrorCode never reached anyone — a refused operator saw a bare 401
            # and had to replay the token by hand from inside this pod. A
            # response HEADER does survive, so the reason is lifted here and
            # handed to @pb_console_denied below.
            auth_request_set $pb_deny_reason $upstream_http_x_pb_deny_reason;
            error_page 401 403 = @pb_console_denied;
            proxy_set_header Cookie $pb_cookie_without_console;
            # LEAN=1 drops the pgadmin Service (see startup.sh's lean_filter) — a
            # literal hostname here would make nginx resolve it at BOOT time and
            # refuse to start at all when it's absent, taking down every route,
            # not just this one. A $variable host defers resolution to the
            # `resolver` directive (above) per-request, so a missing backend just
            # 502s this one location instead of crashing the whole gateway.
            set $pgadmin_upstream "pgadmin.pipeline-builder.svc.cluster.local";
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;  # ALB-provided (TLS terminated at the ALB)
            proxy_set_header X-Script-Name /pgadmin;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_pass http://$pgadmin_upstream:80;
            proxy_redirect off;
            proxy_buffering off;
            proxy_hide_header X-Frame-Options;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Request-ID $request_id always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }

        location /grafana/ {
            set $service "grafana";
            auth_request /_pb_admin_console_check;
            # `auth_request` throws the subrequest's BODY away, so the gate's
            # ErrorCode never reached anyone — a refused operator saw a bare 401
            # and had to replay the token by hand from inside this pod. A
            # response HEADER does survive, so the reason is lifted here and
            # handed to @pb_console_denied below.
            auth_request_set $pb_deny_reason $upstream_http_x_pb_deny_reason;
            error_page 401 403 = @pb_console_denied;
            proxy_set_header Cookie $pb_cookie_without_console;
            set $upstream_grafana "http://grafana:3000";
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            # Grafana is configured with GF_SERVER_SERVE_FROM_SUB_PATH=true and a
            # root_url of /grafana/, so it rewrites its own asset/API URLs — the
            # trailing slash here must be ABSENT from proxy_pass or the subpath
            # is stripped twice and every asset 404s.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_pass $upstream_grafana;
            proxy_redirect off;
            proxy_buffering off;

            # Grafana embeds panels in iframes; same treatment as pgAdmin, whose
            # SAMEORIGIN would otherwise collide with the server-level DENY.
            proxy_hide_header X-Frame-Options;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Request-ID $request_id always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }

        location /kiali/ {
            set $service "kiali";
            auth_request /_pb_admin_console_check;
            # `auth_request` throws the subrequest's BODY away, so the gate's
            # ErrorCode never reached anyone — a refused operator saw a bare 401
            # and had to replay the token by hand from inside this pod. A
            # response HEADER does survive, so the reason is lifted here and
            # handed to @pb_console_denied below.
            auth_request_set $pb_deny_reason $upstream_http_x_pb_deny_reason;
            error_page 401 403 = @pb_console_denied;
            proxy_set_header Cookie $pb_cookie_without_console;
            set $upstream_kiali "http://kiali:20001";
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            # Kiali's `server.web_root: /kiali` makes it serve its own assets
            # under the same prefix, so this proxies the path through unchanged.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_pass $upstream_kiali;
            proxy_redirect off;
            proxy_buffering off;

            proxy_hide_header X-Frame-Options;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Request-ID $request_id always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }

        location /mongo-express/ {
            set $service "mongo-express";
            auth_request /_pb_admin_console_check;
            # `auth_request` throws the subrequest's BODY away, so the gate's
            # ErrorCode never reached anyone — a refused operator saw a bare 401
            # and had to replay the token by hand from inside this pod. A
            # response HEADER does survive, so the reason is lifted here and
            # handed to @pb_console_denied below.
            auth_request_set $pb_deny_reason $upstream_http_x_pb_deny_reason;
            error_page 401 403 = @pb_console_denied;
            proxy_set_header Cookie $pb_cookie_without_console;
            # Same LEAN=1 rationale as /pgadmin/ above — lazy-resolve via $variable
            # so a dropped mongo-express Service can't crash nginx at boot.
            set $mongo_express_upstream "mongo-express.pipeline-builder.svc.cluster.local";
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;  # ALB-provided (TLS terminated at the ALB)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_pass http://$mongo_express_upstream:8081;
            proxy_redirect off;
            proxy_buffering off;
            proxy_hide_header X-Frame-Options;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Request-ID $request_id always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }

        # What a refused operator actually sees. nginx's own 401 page says
        # nothing at all, so this names the reason AND the one thing to do
        # about it.
        #
        # One remedy, not a legend: `$pb_deny_reason` already identifies the
        # cause, so printing all five and making the reader find their line is
        # work the gateway can do for them.
        #
        # `if` inside a location is famously unsafe — EXCEPT with `return`,
        # which is the documented, non-evil use (no rewrite, no proxy_pass, no
        # nested directives), and is what every branch here does.
        location @pb_console_denied {
            # No `internal;` — a NAMED location is already unreachable by an
            # outside request (only error_page/try_files can enter it), and a
            # directive nginx refuses here would stop the gateway booting at
            # all, taking every route down rather than this one.
            default_type text/plain;

            # The likeliest cause, and the least obvious fix: a step-up cannot
            # raise an existing token's assurance, so re-authenticating is the
            # ONLY way — "enable MFA" or "verify again" would both be wrong.
            if ($pb_deny_reason = MFA_REQUIRED) {
                return 403 "Admin console refused: MFA_REQUIRED\n\nThis session was opened with a password only. Sign out and sign in again with a passkey or authenticator — the consoles need a second factor, and a step-up cannot raise a session that already exists.\n";
            }
            if ($pb_deny_reason = TOKEN_MISSING) {
                return 403 "Admin console refused: TOKEN_MISSING\n\nNo console cookie was sent. Open the console from Settings in the dashboard — that is what sets it.\n";
            }
            if ($pb_deny_reason = TOKEN_INVALID) {
                return 403 "Admin console refused: TOKEN_INVALID\n\nThe session ended, or the platform was rebuilt since you signed in (a rebuild wipes the database, so old sessions and passkeys stop working). Sign in again, then reopen the console from Settings.\n";
            }
            if ($pb_deny_reason = TOKEN_REVOKED) {
                return 403 "Admin console refused: TOKEN_REVOKED\n\nThis session was revoked — from Settings, or by a platform rebuild. Sign in again, then reopen the console from Settings.\n";
            }
            if ($pb_deny_reason = HTTP_403) {
                return 403 "Admin console refused: HTTP_403\n\nYou are signed in, but this account is not a PLATFORM administrator. Being an owner or admin of an organization is not enough.\n";
            }
            # Anything else: the platform answered with a code this file does
            # not know (or none at all). Say so plainly rather than guess at a
            # remedy — a wrong instruction costs more than an unhelpful one.
            return 403 "Admin console refused: $pb_deny_reason\n\nNo specific guidance for this reason. Check the platform logs for 'Admin console check refused'.\n";
        }

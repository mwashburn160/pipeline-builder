# =============================================================================
# RustFS object-store console — ON ITS OWN PORT (:9001)
# =============================================================================
# WHY A WHOLE SERVER BLOCK AND NOT A /rustfs/ LOCATION BESIDE THE OTHER CONSOLES:
# the console cannot be served under a sub-path. Verified live against
# rustfs/rustfs:1.0.0 by running that exact image as a one-shot pod in-cluster,
# not inferred from docs:
#   * RUSTFS_CONSOLE_ENABLE=true makes :9001 serve a Next.js UI at the DEFAULT
#     prefix /rustfs/console/ (200, text/html, 34 KB). Without it :9001 still
#     accepts connections but every path 403s.
#   * RUSTFS_CONSOLE_PREFIX=/rustfs is refused at startup — "RUSTFS_CONSOLE_PREFIX
#     overlaps a reserved server route", FATAL, the pod never becomes ready —
#     because /rustfs/* is RustFS's own internode RPC namespace.
#   * The UI resolves its S3/admin API as `${location.protocol}//${location.host}`
#     and then calls ROOT paths: GET / (ListBuckets), /<bucket>/..., /rustfs/admin/v3/*
#     So whichever origin serves the console must have RustFS at its ROOT.
#     Mounted at /rustfs/console/ on the main gateway the assets would load and
#     every API call would land on the platform instead.
# Grafana (GF_SERVER_SERVE_FROM_SUB_PATH) and Kiali (server.web_root) rewrite
# their own API URLs; RustFS has no equivalent knob. Hence a dedicated port whose
# entire path space belongs to RustFS.
#
# OFF by default: deploy/bin/k8s-resources.sh pb_nginx_config swaps this file for
# rustfs-console-disabled.conf unless ADMIN_UIS_ENABLED=true, exactly like
# admin-uis.conf. This console can LIST and DELETE objects in the buckets backing
# the registry, Loki, Thanos, plugin build contexts and the audit chain heads, so
# it is gated at least as tightly as /pgadmin/ — every request carries an
# auth_request to platform's GET /admin/console-check (a live PLATFORM
# administrator session at AAL2). The pb_admin_console cookie reaches this port
# because cookies are not port-scoped, and is stripped before proxying so RustFS
# never sees a platform credential.
server {
    listen 9001;
    server_name _;

    location = /_pb_admin_console_check {
        internal;
        set $service "admin-console-check";
        access_log off;
        proxy_pass http://platform.pipeline-builder.svc.cluster.local:3000/admin/console-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization "Bearer $cookie_pb_admin_console";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # A bare / from a BROWSER gets pointed at the UI, which lives at
    # /rustfs/console/ — otherwise it hits RustFS's S3 handler and answers an
    # unexplained 403.
    #
    # Scoped to HTML navigations, and that scoping is load-bearing: `GET /` is ALSO
    # S3 ListBuckets, which this console's own SigV4 client issues (the bundle
    # calls ListBuckets through an AwsClient with service "s3" against its own
    # origin). An unconditional redirect here answered that API call with a 302 and
    # silently broke bucket listing. S3 SDKs send `Accept: */*`; only a browser
    # navigating sends text/html.
    #
    # absolute_redirect off is load-bearing too: by default nginx builds an
    # ABSOLUTE Location from $host plus the port it is listening on and the scheme
    # it was spoken to, which here produced `http://host:9001/rustfs/console/` —
    # the internal port over plain http, a downgrade on an https page behind a
    # TLS-terminating ALB. A relative Location leaves the browser's own scheme,
    # host and port alone.
    location = / {
        absolute_redirect off;
        if ($http_accept ~* text/html) {
            return 302 /rustfs/console/;
        }
        set $service "rustfs-console";
        auth_request /_pb_admin_console_check;
        proxy_set_header Cookie $pb_cookie_without_console;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        set $rustfs_console_upstream "rustfs-console.pipeline-builder.svc.cluster.local";
        proxy_pass http://$rustfs_console_upstream:9001;
        proxy_redirect off;
        proxy_buffering off;
    }

    location / {
        set $service "rustfs-console";
        auth_request /_pb_admin_console_check;
        proxy_set_header Cookie $pb_cookie_without_console;
        # A $variable host defers DNS to the per-request `resolver`, so a target
        # without rustfs 502s this port instead of stopping nginx from booting.
        set $rustfs_console_upstream "rustfs-console.pipeline-builder.svc.cluster.local";
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # NO trailing slash: the path is passed through unchanged because the UI
        # emits its asset URLs with the /rustfs/console prefix already baked in.
        proxy_pass http://$rustfs_console_upstream:9001;
        proxy_redirect off;
        proxy_buffering off;
        # Object up/downloads run through this port, so neither direction may be
        # buffered to disk or capped at the gateway's default body size.
        client_max_body_size 0;
        proxy_request_buffering off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Request-ID $request_id always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}

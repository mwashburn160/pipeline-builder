---
# =============================================================================
# pgBouncer ConfigMap (per-tier pool partitioning)
# =============================================================================
# Same per-tier pool layout as `deploy/local/docker/config/pgbouncer/pgbouncer.ini`.
# Each tier gets a logical database pointing at the same physical DB but
# with its own pool budget — Developer-tier load can't saturate the pool
# Pro/Team/Enterprise workers share.
#
# Registered in kustomization.yaml and the default DB path: .env.example sets
# DB_HOST=pgbouncer / DB_PORT=6432, so services connect through it out of the box.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: pipeline-builder
data:
  pgbouncer.ini: |
    # POOL SIZING vs Postgres max_connections. pgbouncer runs 2 replicas, and
    # EACH opens its own server connections, so the budget is per replica x 2.
    # Every database carries a hard max_db_connections (pool + reserve included):
    #   15 + 10 + 20 + 35 + 5 (public) = 85 per replica  ->  170 for both,
    # under postgres max_connections=200 (postgres.yaml), which leaves 30 for
    # superuser_reserved_connections, the exporter, pgAdmin and db-backup. The
    # old layout (25/20/40/80 + reserves, no caps) could ask for ~195 from ONE
    # replica against Postgres' default of 100 — "sorry, too many clients".
    # Raising a tier's pool means raising max_connections to match.
    [databases]
    pipeline_builder = host=postgres port=5432 dbname=pipeline_builder pool_size=15 max_db_connections=15
    pipeline_builder_developer = host=postgres port=5432 dbname=pipeline_builder pool_size=10 max_db_connections=10
    pipeline_builder_pro       = host=postgres port=5432 dbname=pipeline_builder pool_size=20 max_db_connections=20
    pipeline_builder_unlimited = host=postgres port=5432 dbname=pipeline_builder pool_size=35 max_db_connections=35
    # The anonymous public plugin directory (plugin-ecosystem §6a): only the
    # view-only ecosystem_public_reader logs in here, on a small separate pool.
    pipeline_builder_public = host=postgres port=5432 dbname=pipeline_builder pool_size=5 max_db_connections=5

    [users]
    # Cap the directory's login across EVERY pool: a client could name a tenant
    # database alias, so the per-database pool_size alone wouldn't keep
    # unauthenticated traffic off the tenant pools.
    ecosystem_public_reader = max_user_connections=5

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432
    pool_mode = transaction
    auth_type = scram-sha-256
    auth_file = /etc/pgbouncer/userlist.txt
    max_client_conn = 1000
    default_pool_size = 25
    reserve_pool_size = 5
    reserve_pool_timeout = 5
    server_idle_timeout = 600
    # No admin_users: the only login in the userlist is the application role
    # (DB_USER), which must not be able to PAUSE/KILL/SHUTDOWN the pooler. It is
    # a stats user so the exporter sidecar can SHOW pools. Keep the name in sync
    # with DB_USER in .env.
    stats_users = pipeline_app
    # Clients that send `extra_float_digits` in their startup packet (Go's lib/pq,
    # which the pgbouncer-exporter sidecar uses) are otherwise REJECTED at login —
    # pgbouncer refuses unknown startup parameters. That crashlooped the exporter,
    # which made the whole pgbouncer POD NotReady, which dropped it from the
    # Service endpoints, which broke every new app DB connection cluster-wide.
    # node-postgres doesn't send it, so only the exporter trips this.
    ignore_startup_parameters = extra_float_digits
    logfile = /var/log/pgbouncer/pgbouncer.log
    pidfile = /var/run/pgbouncer/pgbouncer.pid

---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: pipeline-builder
  labels:
    app: pgbouncer
spec:
  type: ClusterIP
  ports:
    - port: 6432
      targetPort: 6432
      protocol: TCP
      name: pgbouncer
  selector:
    app: pgbouncer

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: pipeline-builder
  labels:
    app: pgbouncer
spec:
  # Two replicas: pgbouncer is the path EVERY service's DB connection takes, so
  # one pod was a single point of failure (a node drain, an OOM or a bad
  # sidecar dropped the Service to zero endpoints). Stateless — the pools are
  # sized per replica (see the ConfigMap above) — so it rolls with no downtime.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9127"
        prometheus.io/path: /metrics
      labels:
        app: pgbouncer
    spec:
      serviceAccountName: pgbouncer
      # Replicas on DIFFERENT nodes, and different AZs where possible: two pods on
      # one node survive nothing a node failure or drain does. ScheduleAnyway so a
      # small cluster still schedules both rather than leaving one Pending.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: pgbouncer
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: pgbouncer
      # Prometheus exporter, run as a NATIVE sidecar (an initContainer with
      # `restartPolicy: Always`) rather than a second entry under `containers`.
      # That distinction is load-bearing: a native sidecar reports under
      # `initContainerStatuses`, so it does NOT contribute to the Pod's Ready
      # condition. As an ordinary container it did — and when it crashlooped
      # (2026-09-14, rejected `extra_float_digits` startup param) the whole
      # pgbouncer Pod went NotReady, was dropped from the Service endpoints,
      # and every service in the cluster lost the ability to open a NEW DB
      # connection. A metrics sidecar must never be able to sever the data path.
      #
      # It reads pgbouncer's virtual `pgbouncer` admin database over localhost —
      # pgbouncer.ini grants the DB_USER app role SHOW access via
      # `stats_users`, so no extra grant is needed. Surfaces pool saturation
      # (cl_waiting / sv_active), which is the failure this pooler exists to
      # prevent and the one that is otherwise invisible until queries time out.
      #
      # The retry loop is the other half of the isolation, and is NOT optional.
      # A native sidecar starts BEFORE the main container, and the kubelet only
      # moves on once the sidecar is Started — so a sidecar that exits and enters
      # CrashLoopBackOff holds the Pod in `Init:Error` and pgbouncer never starts
      # AT ALL (verified 2026-09-16). The exporter does exit on a failed
      # connection, and it always fails its first attempts because pgbouncer is
      # not listening yet. Wrapping it in `until ...; do sleep; done` keeps the
      # container alive across those failures, so it is Started immediately and
      # the data path comes up regardless of whether metrics ever work.
      initContainers:
        - name: pgbouncer-exporter
          restartPolicy: Always
          image: quay.io/prometheuscommunity/pgbouncer-exporter@sha256:5d62f2dc3ed33d091fe8dcf170c8533618c4d00cab61b6a743e0425d57b28924  # quay.io/prometheuscommunity/pgbouncer-exporter:v0.10.2
          command: ["/bin/sh", "-c"]
          args:
            - |
              until /bin/pgbouncer_exporter --web.listen-address=:9127; do
                echo "pgbouncer_exporter exited ($?); retrying in 10s" >&2
                sleep 10
              done
          env:
            - name: PGBOUNCER_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_USER
            - name: PGBOUNCER_PASS
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_PASSWORD
            - name: PGBOUNCER_EXPORTER_CONNECTION_STRING
              value: "postgres://$(PGBOUNCER_USER):$(PGBOUNCER_PASS)@localhost:6432/pgbouncer?sslmode=disable"
          ports:
            - containerPort: 9127
              name: metrics
          resources:
            requests: { cpu: "20m", memory: 32Mi }
            limits:   { cpu: "100m", memory: 96Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer@sha256:7d7a27d9e90985cab5cf42256f5c13a3120baa4b055b69df37beb272b89b2340  # edoburu/pgbouncer:v1.25.2-p0
          # Seed the reader into userlist.txt, then run the image's own entrypoint,
          # which appends the DB_USER app role (it only adds users that are
          # missing). userlist form: double quotes in the password are doubled.
          # No password → no reader line → the directory's logins are refused.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              if [ -n "${ECOSYSTEM_PUBLIC_READER_PASSWORD:-}" ] && ! grep -q '^"ecosystem_public_reader"' /etc/pgbouncer/userlist.txt 2>/dev/null; then
                printf '"ecosystem_public_reader" "%s"\n' "$(printf '%s' "$ECOSYSTEM_PUBLIC_READER_PASSWORD" | sed 's/"/""/g')" >> /etc/pgbouncer/userlist.txt
              fi
              exec /entrypoint.sh /usr/bin/pgbouncer /etc/pgbouncer/pgbouncer.ini
          ports:
            - containerPort: 6432
              name: pgbouncer
          env:
            # edoburu uses DB_*; userlist.txt is generated from these at startup.
            # The APPLICATION role (not the superuser): pgbouncer passes the
            # client's login through to Postgres, so only DB_USER can connect
            # via the pooler — the RLS-bypassing superuser is not reachable here.
            # The mounted pgbouncer.ini overrides the auto-generated config.
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_PASSWORD
            # DB name is not a secret — hardcoded to match POSTGRES_DB in
            # the postgres deployment. Keep in sync with the platform
            # init.sql / postgres ConfigMap if either changes.
            - name: DB_NAME
              value: "pipeline_builder"
            - name: LISTEN_PORT
              value: "6432"
            - name: AUTH_TYPE
              value: "scram-sha-256"
            - name: POOL_MODE
              value: "transaction"
            # Second pooled login: the view-only ecosystem_public_reader (the
            # `pipeline_builder_public` pool). Every Postgres client goes through
            # this pooler; none connects to Postgres directly.
            - name: ECOSYSTEM_PUBLIC_READER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: ECOSYSTEM_PUBLIC_READER_PASSWORD
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /etc/pgbouncer/pgbouncer.ini
              subPath: pgbouncer.ini
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            # readOnlyRootFilesystem deliberately not set — edoburu's
            # entrypoint generates /etc/pgbouncer/userlist.txt at startup
            # from DB_USER/DB_PASSWORD env vars, which needs the rootfs
            # writable. Non-root + caps-dropped + seccomp default still
            # apply; pgbouncer is a stateless proxy with no on-disk state.
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: pgbouncer-config

---
# Keep at least one pgbouncer serving through voluntary disruptions (node
# drains, Karpenter consolidation) — the whole fleet's DB path runs through it.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pgbouncer
  namespace: pipeline-builder
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: pgbouncer

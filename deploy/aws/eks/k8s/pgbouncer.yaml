---
# =============================================================================
# pgBouncer ConfigMap (per-tier pool partitioning)
# =============================================================================
# Same per-tier pool layout as `deploy/local/docker/config/pgbouncer/pgbouncer.ini`.
# Each tier gets a logical database pointing at the same physical DB but
# with its own pool budget — Developer-tier load can't saturate the pool
# Pro/Team/Enterprise workers share.
#
# Registered in kustomization.yaml and the default DB path: .env.example sets
# DB_HOST=pgbouncer / DB_PORT=6432, so services connect through it out of the box.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: pipeline-builder
data:
  pgbouncer.ini: |
    [databases]
    pipeline_builder = host=postgres port=5432 dbname=pipeline_builder
    pipeline_builder_developer = host=postgres port=5432 dbname=pipeline_builder pool_size=20
    pipeline_builder_pro       = host=postgres port=5432 dbname=pipeline_builder pool_size=40
    pipeline_builder_unlimited = host=postgres port=5432 dbname=pipeline_builder pool_size=80

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432
    pool_mode = transaction
    auth_type = scram-sha-256
    auth_file = /etc/pgbouncer/userlist.txt
    max_client_conn = 1000
    default_pool_size = 25
    reserve_pool_size = 5
    reserve_pool_timeout = 5
    server_idle_timeout = 600
    # No admin_users: the only login in the userlist is the application role
    # (DB_USER), which must not be able to PAUSE/KILL/SHUTDOWN the pooler. It is
    # a stats user so the exporter sidecar can SHOW pools. Keep the name in sync
    # with DB_USER in .env.
    stats_users = pipeline_app
    # Clients that send `extra_float_digits` in their startup packet (Go's lib/pq,
    # which the pgbouncer-exporter sidecar uses) are otherwise REJECTED at login —
    # pgbouncer refuses unknown startup parameters. That crashlooped the exporter,
    # which made the whole pgbouncer POD NotReady, which dropped it from the
    # Service endpoints, which broke every new app DB connection cluster-wide.
    # node-postgres doesn't send it, so only the exporter trips this.
    ignore_startup_parameters = extra_float_digits
    logfile = /var/log/pgbouncer/pgbouncer.log
    pidfile = /var/run/pgbouncer/pgbouncer.pid

---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: pipeline-builder
  labels:
    app: pgbouncer
spec:
  type: ClusterIP
  ports:
    - port: 6432
      targetPort: 6432
      protocol: TCP
      name: pgbouncer
  selector:
    app: pgbouncer

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: pipeline-builder
  labels:
    app: pgbouncer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9127"
        prometheus.io/path: /metrics
      labels:
        app: pgbouncer
    spec:
      serviceAccountName: pgbouncer
      # Prometheus exporter, run as a NATIVE sidecar (an initContainer with
      # `restartPolicy: Always`) rather than a second entry under `containers`.
      # That distinction is load-bearing: a native sidecar reports under
      # `initContainerStatuses`, so it does NOT contribute to the Pod's Ready
      # condition. As an ordinary container it did — and when it crashlooped
      # (2026-09-14, rejected `extra_float_digits` startup param) the whole
      # pgbouncer Pod went NotReady, was dropped from the Service endpoints,
      # and every service in the cluster lost the ability to open a NEW DB
      # connection. A metrics sidecar must never be able to sever the data path.
      #
      # It reads pgbouncer's virtual `pgbouncer` admin database over localhost —
      # pgbouncer.ini grants the DB_USER app role SHOW access via
      # `stats_users`, so no extra grant is needed. Surfaces pool saturation
      # (cl_waiting / sv_active), which is the failure this pooler exists to
      # prevent and the one that is otherwise invisible until queries time out.
      #
      # The retry loop is the other half of the isolation, and is NOT optional.
      # A native sidecar starts BEFORE the main container, and the kubelet only
      # moves on once the sidecar is Started — so a sidecar that exits and enters
      # CrashLoopBackOff holds the Pod in `Init:Error` and pgbouncer never starts
      # AT ALL (verified 2026-09-16). The exporter does exit on a failed
      # connection, and it always fails its first attempts because pgbouncer is
      # not listening yet. Wrapping it in `until ...; do sleep; done` keeps the
      # container alive across those failures, so it is Started immediately and
      # the data path comes up regardless of whether metrics ever work.
      initContainers:
        - name: pgbouncer-exporter
          restartPolicy: Always
          image: quay.io/prometheuscommunity/pgbouncer-exporter:v0.10.2
          command: ["/bin/sh", "-c"]
          args:
            - |
              until /bin/pgbouncer_exporter --web.listen-address=:9127; do
                echo "pgbouncer_exporter exited ($?); retrying in 10s" >&2
                sleep 10
              done
          env:
            - name: PGBOUNCER_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_USER
            - name: PGBOUNCER_PASS
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_PASSWORD
            - name: PGBOUNCER_EXPORTER_CONNECTION_STRING
              value: "postgres://$(PGBOUNCER_USER):$(PGBOUNCER_PASS)@localhost:6432/pgbouncer?sslmode=disable"
          ports:
            - containerPort: 9127
              name: metrics
          resources:
            requests: { cpu: "20m", memory: 32Mi }
            limits:   { cpu: "100m", memory: 96Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:v1.25.2-p0
          ports:
            - containerPort: 6432
              name: pgbouncer
          env:
            # edoburu uses DB_*; userlist.txt is generated from these at startup.
            # The APPLICATION role (not the superuser): pgbouncer passes the
            # client's login through to Postgres, so only DB_USER can connect
            # via the pooler — the RLS-bypassing superuser is not reachable here.
            # The mounted pgbouncer.ini overrides the auto-generated config.
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_PASSWORD
            # DB name is not a secret — hardcoded to match POSTGRES_DB in
            # the postgres deployment. Keep in sync with the platform
            # init.sql / postgres ConfigMap if either changes.
            - name: DB_NAME
              value: "pipeline_builder"
            - name: LISTEN_PORT
              value: "6432"
            - name: AUTH_TYPE
              value: "scram-sha-256"
            - name: POOL_MODE
              value: "transaction"
          volumeMounts:
            - name: config
              mountPath: /etc/pgbouncer/pgbouncer.ini
              subPath: pgbouncer.ini
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            # readOnlyRootFilesystem deliberately not set — edoburu's
            # entrypoint generates /etc/pgbouncer/userlist.txt at startup
            # from DB_USER/DB_PASSWORD env vars, which needs the rootfs
            # writable. Non-root + caps-dropped + seccomp default still
            # apply; pgbouncer is a stateless proxy with no on-disk state.
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: pgbouncer-config

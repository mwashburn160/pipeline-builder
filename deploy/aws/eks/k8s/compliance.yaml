---
# =============================================================================
# Compliance Service
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: compliance
  labels:
    app: compliance
    # This Service exposes INTERNAL routes, so its traffic goes through the
    # `pb-waypoint` proxy, which is the only thing in an ambient mesh that can
    # enforce a per-ROUTE (L7) AuthorizationPolicy. See k8s/istio-internal-routes.yaml
    # — removing this label is the rollback: the policies then match nothing and
    # the app-side `requireInternalService` gate carries the routes alone.
    istio.io/use-waypoint: pb-waypoint
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: compliance

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliance
  labels:
    app: compliance
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: compliance
  template:
    metadata:
      labels:
        app: compliance
        app.kubernetes.io/component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: compliance
      # Stateless API server — no need for the default ServiceAccount token
      # mounted at /var/run/secrets/kubernetes.io/serviceaccount/. Reduces blast
      # radius if the container is compromised (no kubelet API access).
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: compliance
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.38
          resources:
            limits:
              cpu: "100m"
              memory: 64Mi
            requests:
              cpu: "50m"
              memory: 32Mi
          command:
            - sh
            - -c
            - |
              echo "Waiting for postgres..."
              until nc -z postgres 5432; do sleep 3; done
              echo "Dependencies ready"
      containers:
        - name: compliance
          image: ghcr.io/mwashburn160/compliance:4.1.4
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: app-env
            # Credentials (DB_PASSWORD, MONGODB_URI, API keys, …) split out of app-env.
            - secretRef:
                name: app-secrets
          env:
            - name: SERVICE_NAME
              value: "compliance"
            - name: MESSAGE_SERVICE_HOST
              value: "message"
            - name: MESSAGE_SERVICE_PORT
              value: "3000"
            - name: PLUGIN_SERVICE_HOST
              value: "plugin"
            - name: PLUGIN_SERVICE_PORT
              value: "3000"
            - name: PIPELINE_SERVICE_HOST
              value: "pipeline"
            - name: PIPELINE_SERVICE_PORT
              value: "3000"
          resources:
            limits:
              cpu: "500m"
              memory: 512Mi
            requests:
              cpu: "250m"
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          volumeMounts:
            # This pod's OWN internal-token signing key (#14) and the PUBLIC
            # bundle it verifies its peers with. One private key per pod — that
            # is what stops a compromised service signing as another — while the
            # bundle is public and identical everywhere. Both from
            # deploy/bin/service-signing-keys.sh; the service refuses to start
            # without them.
            - name: service-signing-key
              mountPath: /etc/pipeline-builder/service-keys
              readOnly: true
            - name: service-key-bundle
              mountPath: /etc/pipeline-builder/service-key-bundle
              readOnly: true
      volumes:
        - name: service-signing-key
          secret:
            secretName: service-key-compliance
            defaultMode: 0444
        - name: service-key-bundle
          secret:
            secretName: service-key-bundle
            defaultMode: 0444
---
# =============================================================================
# Compliance HorizontalPodAutoscaler
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: compliance
  labels:
    app: compliance
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: compliance
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    # Memory metric — added alongside CPU so the HPA scales on whichever
    # signal demands more replicas. 85% chosen to leave headroom for spikes
    # (memory usually climbs slower than CPU; premature scale-up wastes
    # resources). Matches the plugin ScaledObject's memory trigger.
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 85
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
    scaleDown:
      stabilizationWindowSeconds: 300

---
# =============================================================================
# Compliance PodDisruptionBudget
# =============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: compliance
  labels:
    app: compliance
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: compliance

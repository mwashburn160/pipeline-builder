---
# =============================================================================
# Quota Service
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: quota
  labels:
    app: quota
    # This Service exposes INTERNAL routes, so its traffic goes through the
    # `pb-waypoint` proxy, which is the only thing in an ambient mesh that can
    # enforce a per-ROUTE (L7) AuthorizationPolicy. See k8s/istio-internal-routes.yaml
    # — removing this label is the rollback: the policies then match nothing and
    # the app-side `requireInternalService` gate carries the routes alone.
    istio.io/use-waypoint: pb-waypoint
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: quota

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quota
  labels:
    app: quota
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: quota
  template:
    metadata:
      labels:
        app: quota
        app.kubernetes.io/component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: quota
      # Stateless API server — no need for the default ServiceAccount token
      # mounted at /var/run/secrets/kubernetes.io/serviceaccount/. Reduces blast
      # radius if the container is compromised (no kubelet API access).
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: quota
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-for-mongodb
          image: busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616  # busybox:1.38
          resources:
            limits:
              cpu: "100m"
              memory: 64Mi
            requests:
              cpu: "50m"
              memory: 32Mi
          command:
            - sh
            - -c
            - |
              echo "Waiting for mongodb..."
              until nc -z mongodb 27017; do sleep 3; done
              echo "MongoDB ready"
      containers:
        - name: quota
          image: ghcr.io/mwashburn160/quota:4.1.24@sha256:f544a804b3c3217897339c7f69268239229e7250b61986538a26ccbc806631fa
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: app-env
            # Credentials (DB_PASSWORD, MONGODB_URI, API keys, …) split out of app-env.
            - secretRef:
                name: app-secrets
          env:
            - name: SERVICE_NAME
              value: "quota"
            - name: PORT
              value: "3000"
          resources:
            limits:
              cpu: "500m"
              memory: 384Mi
            requests:
              cpu: "250m"
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          volumeMounts:
            # This pod's OWN internal-token signing key and the PUBLIC
            # bundle it verifies its peers with. One private key per pod — that
            # is what stops a compromised service signing as another — while the
            # bundle is public and identical everywhere. Both from
            # deploy/bin/service-signing-keys.sh; the service refuses to start
            # without them.
            - name: service-signing-key
              mountPath: /etc/pipeline-builder/service-keys
              readOnly: true
            - name: service-key-bundle
              mountPath: /etc/pipeline-builder/service-key-bundle
              readOnly: true
      volumes:
        - name: service-signing-key
          secret:
            secretName: service-key-quota
            defaultMode: 0444
        - name: service-key-bundle
          secret:
            secretName: service-key-bundle
            defaultMode: 0444
---
# =============================================================================
# Quota HorizontalPodAutoscaler
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: quota
  labels:
    app: quota
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: quota
  # 2 on this target: EKS is MULTI-NODE, so a second replica is a real
  # availability gain (different node, different AZ) and — with the
  # `minAvailable: 1` PodDisruptionBudget below — it is what lets a node drain
  # finish at all. At one replica that PDB is a deadlock: Auto Mode recycles
  # nodes routinely, and evicting the only pod would break the budget, so the
  # drain blocks until it is force-terminated. The HPA still scales further on
  # load. (ec2/minikube stay at 1 — single-node clusters, nothing to drain.)
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 40
    # CPU-only autoscaling, as on ec2/minikube. These services carry a large
    # BASELINE heap, so idle memory sits near any memory-utilization target and
    # adding replicas does not lower per-pod memory — a memory metric pins the
    # HPA to maxReplicas forever. CPU is load-proportional.
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300

---
# =============================================================================
# Quota PodDisruptionBudget
# =============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: quota
  labels:
    app: quota
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: quota

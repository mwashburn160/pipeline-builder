---
# =============================================================================
# Plugin Service
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: plugin
  labels:
    app: plugin
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: plugin

---
# =============================================================================
# Plugin build scratch — PER-POD emptyDir (no shared EFS)
# =============================================================================
# Plugin builds are queue-based (BullMQ) and the Deployment autoscales (KEDA),
# so the pod that RECEIVES an upload is frequently NOT the pod that later runs
# the build job. No shared (RWX) volume carries that handoff: the upload
# handler stages the build-context ZIP in object storage (S3/RustFS, `plugins`
# bucket) and the build worker rehydrates it into its OWN local scratch dir
# (see plugin-artifact-storage + ensureLocalBuildContext). So `plugins-data` is
# a per-pod emptyDir — faster + cheaper than EFS, and no RWX PVC to manage.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plugin
  labels:
    app: plugin
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: plugin
  template:
    metadata:
      labels:
        app: plugin
        app.kubernetes.io/component: backend
        version: "4.7.4"
        track: stable
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: plugin
      # The plugin pod orchestrates user-supplied Dockerfile builds via the
      # rootless buildkitd sidecar. The plugin doesn't talk to the k8s API, so
      # don't mount a service-account token — keeps the build sandbox from
      # being able to enumerate cluster state if a malicious build escapes.
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: plugin
                topologyKey: kubernetes.io/hostname
      initContainers:
        # EKS Auto Mode runs Bottlerocket nodes with user.max_user_namespaces=0 (a hardening
        # default), which blocks the rootless buildkitd sidecar below — rootlesskit can't
        # clone(CLONE_NEWUSER) and dies with "no space left on device". Flip the node sysctl
        # non-zero BEFORE buildkitd starts. Privileged + host user namespace, so the write
        # lands on the node (verified Bottlerocket's SELinux permits it). Auto Mode's managed
        # NodeClass exposes no Bottlerocket sysctl/user-data knob, so we do it here per-pod.
        - name: enable-userns
          image: busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616  # busybox:1.38
          command: ["sh", "-c", "sysctl -w user.max_user_namespaces=15000 || echo 15000 > /proc/sys/user/max_user_namespaces"]
          securityContext:
            privileged: true
            runAsUser: 0
          resources:
            limits:
              cpu: "50m"
              memory: 32Mi
            requests:
              cpu: "25m"
              memory: 16Mi
        - name: wait-for-dependencies
          image: busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616  # busybox:1.38
          resources:
            limits:
              cpu: "100m"
              memory: 64Mi
            requests:
              cpu: "50m"
              memory: 32Mi
          command:
            - sh
            - -c
            - |
              echo "Waiting for postgres..."
              until nc -z postgres 5432; do sleep 3; done
              echo "Waiting for redis..."
              until nc -z redis 6379; do sleep 3; done
              echo "Dependencies ready"
        # Rootless buildkitd as a native sidecar (k8s 1.28+: restartPolicy: Always
        # in initContainers). Replaces the previous privileged dind container —
        # no SYS_ADMIN, no privileged mode, no CA-trust shell wrapper. buildkitd
        # uses the system CA bundle baked into moby/buildkit:rootless directly.
        - name: buildkitd
          # >= v0.32: older runc reapers wedge in a hot "container not running"
          # retry loop when a build container is killed mid-flight, zombifying
          # the pod (Init:ContainerStatusUnknown).
          image: moby/buildkit@sha256:c8252268760e1baba80780d63d738ef9f260fb7c7c0973c78494cb9ddd99eda1  # moby/buildkit:v0.34.2-rootless
          restartPolicy: Always
          args:
            - --addr
            - unix:///run/user/1000/buildkit/buildkitd.sock
            # rootless workers spawn their own subprocess sandbox; in unprivileged
            # k8s this is disabled in favor of the outer pod-level isolation.
            - --oci-worker-no-process-sandbox
            # Mirror docker.io → in-cluster registry so plugin Dockerfiles
            # using bare `FROM plugin-base:26.10` resolve there.
            - --config
            - /home/user/.config/buildkit/buildkitd.toml
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            # Rootless buildkit needs several things to start. Don't trim
            # any of these without testing the full plugin-build flow:
            #  - seccompProfile=Unconfined: rootlesskit's `unshare` and
            #    related syscalls aren't all in the RuntimeDefault profile.
            #  - capabilities.add=[SETUID,SETGID]: newuidmap/newgidmap
            #    (the SETUID-helper binaries that write /proc/<pid>/uid_map
            #    and gid_map) need these in the *bounding set*, otherwise
            #    their file-caps can't be granted at exec time. Dropping
            #    them with no add was the root cause of the prior
            #    `newuidmap … operation not permitted` startup failure.
            seccompProfile:
              type: Unconfined
            capabilities:
              drop: ["ALL"]
              add: ["SETUID", "SETGID"]
          volumeMounts:
            - name: buildkit-socket
              mountPath: /run/user/1000/buildkit
            - name: buildkit-cache
              mountPath: /home/user/.local/share/buildkit
            - name: buildkitd-config
              mountPath: /home/user/.config/buildkit
              readOnly: true
          resources:
            limits:
              cpu: "1500m"
              # Rootless buildkit runs the plugin's RUN steps inside this sidecar's
              # cgroup; too low OOM-kills heavy builds (gradle/npm/dotnet) →
              # "buildkit-runc … container not running". Tunable via
              # BUILDKIT_MEMORY_LIMIT (setup.sh default 6144Mi); bound by node memory.
              memory: ${BUILDKIT_MEMORY_LIMIT}
            requests:
              # RAISED TO MATCH THE LIMIT, because `cpuCredits` sells throughput
              # against this number. Kubernetes schedules on REQUESTS, so a 300m
              # request against a 1500m limit promised 1.5 vCPU of build
              # throughput while reserving 0.3 — the ladder's whole supply
              # arithmetic (`credits = builds x wall-minutes x vCPU`) is derived
              # from the limit, and selling against an unreserved burst is
              # selling capacity the scheduler never set aside. See
              # docs/plans/cpu-credits.md D9.
              cpu: "1500m"
              # RAISED TO MATCH THE LIMIT, for the same reason the CPU request
              # above was: Kubernetes schedules on REQUESTS. A 1024Mi request
              # against a 6144Mi (setup.sh default) limit let the scheduler — and Auto Mode's
              # consolidation, which packs by requests — put replicas on a node
              # that cannot host what they actually use, and then the node hits
              # memory pressure and evicts. Rootless buildkit runs every RUN step
              # of every concurrent build in THIS cgroup, so the limit is the real
              # working set, not a burst ceiling.
              #
              # The limit itself is NOT lowered: the comment above records that
              # too little OOM-kills gradle/npm/dotnet builds, so halving it to
              # make parity cheaper would trade one documented failure for
              # another. At max scale this reserves 8 x the limit; if that is too
              # much for the cluster, the levers are BUILDKIT_MEMORY_LIMIT or the
              # KEDA maxReplicaCount, both visible, rather than an unreserved
              # burst nobody accounted for.
              memory: ${BUILDKIT_MEMORY_LIMIT}
          # EXEC ON LOOPBACK — see k8s/pgbouncer.yaml for the full rationale.
          # Under Istio ambient the kubelet -> podIP probe path does not work on
          # EKS Auto Mode (verified: in-mesh pod -> this podIP:PORT succeeds, the
          # kubelet probe to the same address times out). 127.0.0.1 never leaves
          # the pod netns so it bypasses ztunnel. `node` ships in every service
          # image; this mirrors frontend/Dockerfile's own HEALTHCHECK.
          startupProbe:
            exec:
              command: ["buildctl", "--addr", "unix:///run/user/1000/buildkit/buildkitd.sock", "debug", "workers"]
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 20
          livenessProbe:
            exec:
              command: ["buildctl", "--addr", "unix:///run/user/1000/buildkit/buildkitd.sock", "debug", "workers"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      containers:
        - name: plugin
          image: ghcr.io/mwashburn160/plugin:4.7.4@sha256:127b2021cf5bdddf28774833cf079fb34bab15c9dbd96a2d03847070d8472a23
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: app-env
            # Credentials (DB_PASSWORD, MONGODB_URI, API keys, …) split out of app-env.
            - secretRef:
                name: app-secrets
          env:
            - name: SERVICE_NAME
              value: "plugin"
            - name: IMAGE_REGISTRY_HOST
              value: "registry"
            - name: IMAGE_REGISTRY_PORT
              value: "5000"
            - name: IMAGE_REGISTRY_HTTP
              value: "true"
            # Must match the registry's REGISTRY_AUTH_TOKEN_REALM (registry.yaml) so the
            # plugin keys Basic auth under the realm host the registry redirects to when
            # minting a push bearer token. Without it docker-build.ts falls back to the
            # PLATFORM_BASE_URL host (wrong) and plugin image pushes 401 / insufficient_scope.
            - name: IMAGE_REGISTRY_TOKEN_REALM
              value: "http://image-registry:3000/token"
            # Builds run on the in-pod buildkitd sidecar via the shared
            # unix socket. Tier partitioning lives at the BullMQ queue
            # level inside the plugin service (developer / pro /
            # team / enterprise queues); every tier's worker dispatches to the
            # same sidecar — no standalone per-tier buildkitd Deployments.
            - name: BUILDKIT_HOST
              value: "unix:///run/buildkit/buildkitd.sock"
            # Platform buildkit publishes plugin images for (default linux/amd64,
            # the CodeBuild runtime). Set linux/arm64 for an all-Graviton stack.
            - name: PUBLISH_PLATFORM
              value: "linux/amd64"
            - name: BILLING_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-env
                  key: BILLING_ENABLED
                  optional: true
            - name: COMPLIANCE_SERVICE_HOST
              value: "compliance"
            - name: COMPLIANCE_SERVICE_PORT
              value: "3000"
            - name: COMPLIANCE_BYPASS
              value: "false"
            - name: PLUGIN_MAX_UPLOAD_MB
              value: "4096"
            - name: DOCKER_BUILD_TIMEOUT_MS
              value: "900000"
            # Canonical build-scratch path (single dir now — the durable
            # cross-pod build context lives in object storage, S3_* below).
            # Must be a writable absolute path because the container has
            # readOnlyRootFilesystem=true — a relative `uploads/` resolves
            # to /app/uploads on the read-only root and EROFS-fails.
            - name: DOCKER_BUILD_TEMP_ROOT
              value: "/opt/pipeline/pipeline-data/plugins-data"
            - name: PLUGIN_UPLOAD_DIR
              value: "/opt/pipeline/pipeline-data/plugins-data"
            # Object storage for the uploaded build context — a worker on any pod
            # rehydrates a build from here, so build scratch can be per-pod.
            - name: S3_ENDPOINT
              value: "http://rustfs:9000"
            - name: S3_BUCKET
              value: "plugins"
            - name: S3_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: rustfs-secret, key: plugin-access-key } }
            - name: S3_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: rustfs-secret, key: plugin-secret-key } }
            - name: S3_FORCE_PATH_STYLE
              value: "true"
            - name: TMPDIR
              value: "/tmp"
            # Public key plugin images are verified against (`cosign verify`)
            # before an image plugin is handed out (synth pins CodeBuild to the
            # verified digest). The PRIVATE half lives only in
            # image-registry, which signs at POST /internal/plugin-signatures;
            # this pod must never hold it (it shares a network namespace with
            # the buildkitd sidecar that runs tenant Dockerfile RUN steps).
            - name: PLUGIN_SIGNING_PUBLIC_KEY_FILE
              value: "/etc/pipeline-builder/plugin-signing/plugin-signing.pub"
            # grype's vulnerability DB (build-time scan + nightly rescan): the
            # SHARED, read-only copy on the grype-db EFS claim (grype-db.yaml).
            # Pods never update it themselves — the grype-db-refresh CronJob is
            # its one writer — so PLUGIN_GRYPE_DB_AUTO_UPDATE=false: the
            # operator-managed mode in api/plugin/src/helpers/vuln-scan.ts.
            - name: GRYPE_DB_CACHE_DIR
              value: "/var/cache/grype"
            - name: PLUGIN_GRYPE_DB_AUTO_UPDATE
              value: "false"
          volumeMounts:
            # This pod's OWN internal-token signing key and the PUBLIC
            # bundle it verifies its peers with. One private key per pod — that
            # is what stops a compromised service signing as another — while the
            # bundle is public and identical everywhere. Both from
            # deploy/bin/service-signing-keys.sh; the service refuses to start
            # without them.
            - name: service-signing-key
              mountPath: /etc/pipeline-builder/service-keys
              readOnly: true
            - name: service-key-bundle
              mountPath: /etc/pipeline-builder/service-key-bundle
              readOnly: true
            # Plugin-image signing PUBLIC key only (verification). Secret from
            # deploy/bin/plugin-signing-keys.sh via bin/k8s-resources.sh.
            - name: plugin-signing-public-key
              mountPath: /etc/pipeline-builder/plugin-signing
              readOnly: true
            # Mount at the SAME absolute path as the host (which buildkit
            # also sees) so DOCKER_BUILD_TEMP_ROOT resolves identically on
            # both sides — buildkit bind mounts won't work otherwise.
            - name: plugins-data
              mountPath: /opt/pipeline/pipeline-data/plugins-data
            - name: buildkit-socket
              mountPath: /run/buildkit
            # readOnlyRootFilesystem: true means the Node.js process can't
            # write anywhere under `/` — but it needs a tempdir (TMPDIR=/tmp
            # above) for plugin tarball staging.
            - name: scratch-tmp
              mountPath: /tmp
            - name: grype-db
              mountPath: /var/cache/grype
              readOnly: true
          resources:
            limits:
              cpu: "1500m"
              memory: 2048Mi
            requests:
              # Modest CPU request — the HTTP API is light at idle and bursts to
              # its 1500m limit, so a low reservation avoids over-reserving CPU.
              cpu: "300m"
              memory: 1024Mi
          readinessProbe:
            exec:
              command: ["node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          startupProbe:
            exec:
              command: ["node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
      volumes:
        - name: service-signing-key
          secret:
            secretName: service-key-plugin
            defaultMode: 0444
        - name: service-key-bundle
          secret:
            secretName: service-key-bundle
            defaultMode: 0444
        # NOT optional: it exists in both signing modes (kms exports it), and a
        # plugin that cannot verify must fail loudly at mount, not at push.
        - name: plugin-signing-public-key
          secret:
            secretName: plugin-signing-public-key
            defaultMode: 0444
        # Per-pod build scratch (transient incoming ZIP + extracted context).
        # The build queue (BullMQ) + autoscaler (KEDA) decouple "pod that
        # received the upload" from "pod that runs the build"; the durable
        # context lives in object storage (S3/RustFS) and the worker rehydrates
        # it locally, so this can be a per-pod emptyDir.
        # buildkitd doesn't mount this — buildctl in the plugin container reads
        # the context and streams it over the socket.
        - name: plugins-data
          emptyDir:
            sizeLimit: 20Gi
        # Shared socket between buildkitd sidecar and plugin container.
        - name: buildkit-socket
          emptyDir:
            medium: Memory
        # buildkitd's layer cache. emptyDir loses cache on pod restart —
        # acceptable for the EC2 single-node deploy. For multi-node, switch
        # to a PVC or the `--export-cache=type=registry` flag.
        - name: buildkit-cache
          emptyDir:
            sizeLimit: 20Gi
        - name: scratch-tmp
          emptyDir:
            sizeLimit: 1Gi
        # grype vulnerability DB: ONE shared copy on EFS, written only by the
        # grype-db-refresh CronJob and mounted read-only above (see grype-db.yaml).
        #
        # It was a per-pod emptyDir, and that history is why it no longer is.
        # 5Gi, not 2Gi. The DB is no longer "hundreds of MB" — it measured 2.1G
        # on a pod minutes old — and grype needs roughly DOUBLE it transiently,
        # since it downloads an archive and extracts alongside it. At 2Gi the
        # kubelet EVICTED the pod ("Usage of EmptyDir volume grype-db exceeds
        # the limit"), which killed the build worker mid-job; BullMQ then
        # reported the abandoned builds as "job stalled more than allowable
        # limit", so the visible symptom named the queue rather than the disk.
        # Each new pod re-downloaded and was evicted again — twelve pods in
        # under two hours. Then the DB reached ~3.3 GiB installed, a refresh
        # over it peaked near 7.3 GiB, and 5Gi evicted pods the same way —
        # helped by ~3 GiB download dirs that interrupted updates left behind.
        # One shared, read-only copy ends both, and the 8 KEDA replicas' copies.
        - name: grype-db
          persistentVolumeClaim:
            claimName: grype-db
            readOnly: true
        - name: buildkitd-config
          configMap:
            name: buildkitd-config

---
# =============================================================================
# Plugin KEDA ScaledObject — scales on BullMQ queue depth across all tiers
# (KEDA creates its own HPA — no standalone HPA needed)
# =============================================================================
# Prometheus trigger (not Redis) for two reasons:
#   1. AGGREGATE across all tiers, and do it in REPLICAS rather than jobs.
#      There is one BullMQ queue per tier and one Worker per tier PER REPLICA,
#      so a replica serves every tier at once: satisfying several tiers does
#      not add replicas, the binding tier decides. The query therefore divides
#      each tier's depth by that tier's worker concurrency
#      (`plugin_build_tier_concurrency`) and takes the MAX, which is literally
#      "replicas needed" — hence threshold 1.
#
#      A flat `sum(plugin_queue_jobs{...})` was wrong twice over. Summing
#      per-tier replica needs DOUBLE-COUNTS: 36 builds spread across six tiers
#      asked for 21.7 replicas to run work already fitting on 8. And summing
#      raw JOBS treats them as equally absorbable, so 600 queued jobs asked for
#      300 replicas while per-org caps admitted 40 — pods whose worker slots
#      then went on denying work they could not start.
#
#      A multi-trigger ScaledObject would also take MAX across triggers, but of
#      unweighted per-queue counts, which is the wrong max for the same reason.
#   2. INCLUDE in-flight work via state="active". A Redis listLength
#      drops to zero the instant a job dispatches, so KEDA would decide
#      "queue empty, scale down" while the buildkitd sidecar is mid-build.
#      The pod terminates, the build dies, BullMQ retries it on the
#      surviving pod. Counting `active` keeps the pod alive until the
#      job moves to `completed`/`failed`.
#   3. EXCLUDE `delayed`, which is where a job blocked by its org's slot cap
#      lives (`moveToDelayed`). That is what keeps a backlog nobody can start
#      from inflating the signal — the autoscaler asks for capacity to run work
#      that is admissible, and a job denied a slot leaves `waiting` until its
#      backoff elapses. `avg_over_time` then damps the bursts those retries
#      make as they briefly re-enter `waiting`.
#
# `threshold` is target jobs-per-replica. Activation threshold is
# unset (defaults to 0) because minReplicaCount=1 — we never scale to
# zero, so activation is a no-op.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: plugin
  labels:
    app: plugin
spec:
  scaleTargetRef:
    name: plugin
  minReplicaCount: 1
  # EKS Auto Mode is multi-node: Karpenter provisions nodes to fit pending
  # plugin pods, so the build fleet (the primary horizontally-scaling workload)
  # is NOT bounded by a single instance's vCPUs the way the ec2 target is. Each
  # replica carries its own in-pod buildkitd sidecar (~1250m = plugin 750m +
  # buildkitd 500m). Cap at 8 to bound cost / node-churn on a queue spike; raise
  # if build throughput demands more (Karpenter will add nodes to schedule them).
  maxReplicaCount: 8
  # pollingInterval / cooldownPeriod are deliberately NOT set. KEDA applies both
  # only when it owns the 0<->1 transition (minReplicaCount: 0, idleReplicaCount,
  # or useCachedMetrics) — with minReplicaCount: 1 it hands scaling to a plain
  # HPA and warns that they are "configured but not relevant". They were set to
  # 15s/120s and silently ignored.
  #
  # Scale-DOWN damping, the thing cooldownPeriod was reaching for (replica churn
  # aborts in-flight builds — BullMQ reports "stalled more than allowable
  # limit"), comes from the HPA's own scale-down stabilization window, which
  # defaults to 300s. That is stricter than the 120s that was never applied, so
  # removing these lines does not make scale-down more eager. To tune it, set
  # spec.advanced.horizontalPodAutoscalerConfig.behavior.scaleDown here — that
  # is the knob KEDA actually forwards in this mode.
  # Hold a safe replica count if Prometheus (the primary trigger's source) is
  # unavailable, instead of collapsing to minReplicaCount and draining builds.
  fallback:
    failureThreshold: 3
    replicas: 2
  triggers:
    # Queue-driven primary signal.
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.pipeline-builder.svc:9090
        # BOUNDED. `waiting` is an unbounded signal driving a CAPPED system: per-org
        # slot caps admit ~40 builds fleet-wide, so 600 queued jobs used to compute
        # desired = 600/2 = 300 replicas and pin the fleet at its ceiling. The extra
        # pods then spend their worker slots DENYING work they cannot admit — 168 of
        # 208 slots at 16 replicas — and on Auto Mode that is node churn for no
        # throughput (5 replicas and 16 drain 600 jobs in the same 60 minutes).
        #
        # So: all in-flight work, plus a CLAMPED speculative term, against a
        # threshold of one replica's ladder sum (13). A cold queue of 100 asks for
        # 52/13 = 4 replicas immediately; as builds actually start, `active` grows
        # the ask toward the knee instead of past it. Raising a tier row raises the
        # threshold's meaning with it, which is why 13 is written as the sum and not
        # as a magic number.
        # WEIGHTED by what a replica can actually absorb. One replica clears
        # `plugin_build_tier_concurrency` jobs of a tier, so a tier's own ask is
        # `jobs / concurrency` — and the threshold is then 1, because the query is
        # already denominated in replicas.
        #
        # MAX over tiers, NOT the sum, and the difference is a whole fleet. One
        # replica runs a worker for EVERY tier at once, so it serves all of them
        # simultaneously rather than one at a time: 8 waiting developer jobs (1
        # per replica) and 10 waiting pro jobs (2 per replica) need max(8, 5) = 8
        # replicas, and at 8 replicas pro's capacity is 16, so both are served.
        # Summing would ask for 13 and over-provision by roughly the tier count —
        # which is the same mistake as the flat `/2` below, arrived at from the
        # other direction.
        #
        # BORROW-AWARE, because the gauge is the EFFECTIVE ceiling (floor +
        # PLUGIN_BUILD_BORROW_MAX), not the ladder row — see `fetchConcurrency` in
        # plugin-build-queue.ts. So enabling borrowing LOWERS this ask: it buys
        # density instead of replicas, and 20 `unlimited` jobs want 2 dense pods
        # rather than 8 sparse ones. Publishing the floor here instead would be
        # the inverse bug — scaling to 8 while each pod already absorbs 13.
        #
        # Two wrong answers this replaces. A flat `(waiting+active)/2` treated 600
        # queued jobs as 300 replicas' worth, pinning the fleet at its ceiling
        # while per-org caps admitted 40 — the surplus pods spend their worker
        # slots DENYING work. A flat threshold of 13 (one replica's ladder SUM)
        # then under-provisioned the opposite case: a fresh install's catalogue is
        # entirely system-org, concurrency 1, so a replica absorbs ONE job of it
        # and the fleet stopped growing at 5 while the system org's cap of 12 still
        # had headroom — 71 minutes instead of 45 for 119 plugins.
        #
        # Clamped so a huge backlog asks for a number that still means something
        # in the HPA's logs; `maxReplicaCount` is the real ceiling either way.
        # The `or` is a guard, not a nicety: if `plugin_build_tier_concurrency` is
        # ever absent (a worker that has not started, a renamed metric) the join
        # produces NO series, which KEDA reads as 0 and holds the fleet at
        # minReplicaCount — silently, and worst during the catalogue load that
        # needs the replicas most. The fallback is the unweighted count over the
        # ladder's sum: coarse, but it scales up rather than stalling.
        query: clamp_max(max(avg_over_time(sum by (tier) (plugin_queue_jobs{state=~"waiting|active"})[2m:15s]) / on(tier) group_left() plugin_build_tier_concurrency) or sum(plugin_queue_jobs{state=~"waiting|active"}) / 13, 24)
        threshold: "1"
    # CPU pressure — pod-level avg utilization across plugin + buildkitd
    # sidecar. buildkitd saturates one core during a build pull/push, so
    # avg crossing 80% means the pod is genuinely loaded and another
    # replica would help. Computed against sum of container requests
    # (plugin 750m + buildkitd 500m = 1250m): 80% = ~1000m sustained.
    - type: cpu
      metricType: Utilization
      metadata:
        value: "80"
    # Memory pressure — backstop. buildkitd's local layer cache grows
    # over time so a high threshold (85%) avoids scaling just on cache
    # accumulation; this fires only when an active build's working set
    # actually exceeds the pod's request envelope.
    - type: memory
      metricType: Utilization
      metadata:
        value: "85"

---
# =============================================================================
# buildkitd sidecar ConfigMap
# =============================================================================
# Mirrors docker.io → registry:5000 so plugin Dockerfiles using bare
# `FROM plugin-base:26.10` resolve at the in-cluster registry
# instead of Docker Hub. Mounted by the buildkitd sidecar in the plugin
# pod (see initContainers above).
#
# The in-pod sidecar is the only tenant buildkitd in the cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: buildkitd-config
  namespace: pipeline-builder
data:
  buildkitd.toml: |
    # Bound the local layer cache so it can't grow unbounded and fill the node
    # disk over time — the single biggest disk consumer during build storms.
    # buildkit GCs the OLDEST cache first to keep usage under maxUsedSpace while
    # keeping minFreeSpace free on the volume; reservedSpace is never pruned.
    [worker.oci]
      gc = true
      reservedSpace = "2GB"
      maxUsedSpace = "8GB"
      minFreeSpace = "4GB"

    [registry."docker.io"]
      mirrors = ["registry:5000"]

    [registry."registry:5000"]
      # Registry serves plain HTTP on the in-cluster ClusterIP service —
      # nginx fronts it on HTTPS for external clients. Plain HTTP here
      # avoids the buildkit-vs-crane scheme-mismatch deadlock on the
      # token realm (see registry.yaml for the full rationale).
      http = true

---
# =============================================================================
# Plugin PodDisruptionBudget
# =============================================================================
# maxUnavailable (not minAvailable) because this is the one workload deliberately
# left at minReplicaCount: 1 — each replica carries its own buildkitd sidecar, so
# a permanently-idle second one is expensive. `minAvailable: 1` against a single
# replica is a deadlock: no eviction can ever satisfy it, so every node drain
# hangs until the node is force-terminated. `maxUnavailable: 1` still limits a
# voluntary disruption to one pod at a time once KEDA has scaled out, and lets
# the drain proceed when there is only one. Evicting a mid-build pod is safe and
# already designed for: the KEDA trigger counts `active` jobs and BullMQ retries
# the build on a surviving pod (see the ScaledObject notes above).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: plugin
  labels:
    app: plugin
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: plugin

---
# =============================================================================
# PostgreSQL Service
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: postgres

---
# =============================================================================
# PostgreSQL PersistentVolumeClaim
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  labels:
    app: postgres
spec:
  storageClassName: pb-ebs
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
# =============================================================================
# PostgreSQL Deployment
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
    app.kubernetes.io/component: database
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # RWO pb-ebs PVC can't be mounted by two pods at once — Recreate avoids the
  # rolling-update overlap that would otherwise stall on a cross-AZ multi-attach.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
        prometheus.io/path: /metrics
      labels:
        app: postgres
        app.kubernetes.io/component: database
    spec:
      serviceAccountName: postgres
      securityContext:
        runAsNonRoot: false  # PostgreSQL image requires root for initdb
      containers:
        - name: postgres
          image: postgres@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae  # postgres:18
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            # Read by postgres-init.sql (psql \getenv) on first init to create the
            # NOSUPERUSER NOBYPASSRLS application role the services log in as.
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: app-env
                  key: POSTGRES_DB
          resources:
            limits:
              cpu: "1000m"
              memory: 1536Mi
            requests:
              cpu: "150m"
              memory: 768Mi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
        # Prometheus exporter. Sidecar rather than a separate Deployment so it
        # shares the database's lifecycle and network namespace: it reaches
        # Postgres on localhost (no Service, no extra NetworkPolicy), and when
        # the database dies the exporter dies with it, which is exactly the
        # signal ServiceDown keys off. Postgres speaks no Prometheus itself, so
        # the pod's scrape annotation points here.
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter@sha256:38606faa38c54787525fb0ff2fd6b41b4cfb75d455c1df294927c5f611699b17  # quay.io/prometheuscommunity/postgres-exporter:v0.17.1
          ports:
            - containerPort: 9187
              name: metrics
          env:
            # Reuses the same credentials the server is initialised with —
            # no separate monitoring role to provision or rotate.
            - name: DATA_SOURCE_URI
              value: "localhost:5432/postgres?sslmode=disable"
            - name: DATA_SOURCE_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests: { cpu: "25m", memory: 48Mi }
            limits:   { cpu: "100m", memory: 128Mi }
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init-script
          configMap:
            name: postgres-init

---
# =============================================================================
# PostgreSQL PodDisruptionBudget
# =============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  # 1-replica stateful pod: maxUnavailable:1 lets node drains/Karpenter consolidation evict it
  # (a minAvailable:1 PDB on a single-replica pod would block every drain forever).
  maxUnavailable: 1
  selector:
    matchLabels:
      app: postgres

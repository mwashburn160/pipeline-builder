# =============================================================================
# HA Redis via Sentinel — the DEFAULT Redis for this target (listed in
# k8s/kustomization.yaml; there is no single-instance redis.yaml here).
#
# A 3-node Redis (1 primary + 2 replicas) monitored by 3 Sentinels (quorum 2),
# so a single Redis pod loss fails over automatically instead of taking down
# the shared Redis.
#
# App wiring (.env → `app-env` ConfigMap), Sentinel mode:
#     REDIS_SENTINELS=redis-sentinel-0.redis-sentinel-headless:26379,redis-sentinel-1.redis-sentinel-headless:26379,redis-sentinel-2.redis-sentinel-headless:26379
#     REDIS_SENTINEL_MASTER=mymaster
#   (+ REDIS_PASSWORD / REDIS_SENTINEL_PASSWORD if auth is enabled). The client
#   tracks the current primary via Sentinel and reconnects after a failover.
#   REDIS_URL must NOT also be set — setting both is a startup error — and
#   REDIS_HOST / REDIS_PORT are not supported at all. (Kubernetes injects a
#   `REDIS_PORT=tcp://…` service-link var for the `redis` Service; the app
#   ignores it.) Do not point the app at the `redis` Service for writes: it
#   fronts every data node, including read-only replicas.
#
# VALIDATE FAILOVER in a scratch cluster: `kubectl delete pod redis-0`, then
# confirm a replica is promoted (`redis-cli -p 26379 sentinel
# get-master-addr-by-name mymaster`) and the app keeps serving.
#
# PRODUCTION RECOMMENDATION: prefer a managed **ElastiCache for Redis/Valkey,
# cluster-mode DISABLED, Multi-AZ + automatic failover**. ElastiCache does not
# speak the Sentinel protocol — it fails over behind its primary endpoint's DNS
# name — so switch to standalone mode: set REDIS_URL=rediss://<primary-endpoint>:6379,
# REMOVE REDIS_SENTINELS / REDIS_SENTINEL_MASTER, and delete this manifest from
# the kustomization.
# =============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-sentinel-config
data:
  redis-bootstrap.sh: |
    #!/bin/sh
    set -eu
    # Determine the CURRENT primary from any Sentinel. On first boot no Sentinel
    # knows it yet, so redis-0 bootstraps as primary and the others replicate it.
    MASTER=""
    for s in redis-sentinel-0 redis-sentinel-1 redis-sentinel-2; do
      MASTER="$(redis-cli -h "$s.redis-sentinel-headless" -p 26379 sentinel get-master-addr-by-name mymaster 2>/dev/null | head -1 || true)"
      [ -n "$MASTER" ] && break
    done
    if [ -z "$MASTER" ]; then
      [ "$HOSTNAME" = "redis-0" ] && MASTER="" || MASTER="redis-0.redis-headless"
    fi
    # Announce the stable pod FQDN so Sentinel/replicas reach us after a restart.
    {
      echo "appendonly yes"
      echo "replica-announce-ip ${HOSTNAME}.redis-headless"
      echo "replica-announce-port 6379"
    } > /etc/redis/runtime.conf
    if [ -n "$MASTER" ] && [ "$MASTER" != "${HOSTNAME}.redis-headless" ]; then
      echo "replicaof $MASTER 6379" >> /etc/redis/runtime.conf
    fi
    exec redis-server /etc/redis/runtime.conf --maxmemory 256mb --maxmemory-policy noeviction
  sentinel-bootstrap.sh: |
    #!/bin/sh
    set -eu
    # Monitor whatever redis-0 currently resolves to on first boot; Sentinel then
    # tracks failovers itself and rewrites its own config.
    until getent hosts redis-0.redis-headless >/dev/null 2>&1; do echo "waiting for redis-0..."; sleep 2; done
    MASTER_IP="$(getent hosts redis-0.redis-headless | awk '{print $1}' | head -1)"
    cat > /etc/redis/sentinel.conf <<EOF
    port 26379
    sentinel monitor mymaster ${MASTER_IP} 6379 2
    sentinel down-after-milliseconds mymaster 5000
    sentinel failover-timeout mymaster 60000
    sentinel parallel-syncs mymaster 1
    sentinel announce-ip ${HOSTNAME}.redis-sentinel-headless
    sentinel announce-port 26379
    EOF
    exec redis-sentinel /etc/redis/sentinel.conf
---
# Headless service — stable per-pod DNS (redis-0.redis-headless, …).
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  labels: { app: redis }
spec:
  clusterIP: None
  selector: { app: redis }
  ports:
    - { port: 6379, targetPort: 6379, name: redis }
---
# Client-facing service (data plane). Clients normally reach Redis via Sentinel,
# but this keeps a stable name for direct/debug access to whichever pod answers.
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: { app: redis }
spec:
  type: ClusterIP
  selector: { app: redis }
  ports:
    - { port: 6379, targetPort: 6379, name: redis }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels: { app: redis, app.kubernetes.io/component: cache }
spec:
  serviceName: redis-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9121"
        prometheus.io/path: /metrics
      labels: { app: redis, app.kubernetes.io/component: cache }
    spec:
      serviceAccountName: redis
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector: { matchLabels: { app: redis } }
                topologyKey: kubernetes.io/hostname
      securityContext: { runAsUser: 999, runAsNonRoot: true, fsGroup: 999 }
      containers:
        - name: redis
          image: redis@sha256:bd999b5cfee25fb24b8320a31fddbd69f462df44c8138c66e369582937beebc0  # redis:8-alpine
          command: ["sh", "/scripts/redis-bootstrap.sh"]
          ports:
            - { containerPort: 6379, name: redis }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { cpu: "50m", memory: 128Mi }
            limits: { cpu: "300m", memory: 320Mi }
          volumeMounts:
            - { name: scripts, mountPath: /scripts, readOnly: true }
            - { name: conf, mountPath: /etc/redis }
            - { name: data, mountPath: /data }
        # Prometheus exporter sidecar. Per-POD on purpose: with Sentinel the
        # interesting metrics (role, replication offset/lag, connected replicas)
        # differ per member, so one exporter per pod is what makes a failover
        # visible. Redis here requires no auth, so no credentials are wired.
        - name: redis-exporter
          image: oliver006/redis_exporter@sha256:dbd410eb9255016c9440b40b8fa18872fdf0e7972d06fc1df8d5b120d35efe05  # oliver006/redis_exporter:v1.69.0
          args:
            - "--redis.addr=redis://localhost:6379"
          ports:
            - containerPort: 9121
              name: metrics
          resources:
            requests: { cpu: "20m", memory: 32Mi }
            limits:   { cpu: "100m", memory: 96Mi }
      volumes:
        - name: scripts
          configMap: { name: redis-sentinel-config, defaultMode: 0555 }
        - name: conf
          emptyDir: {}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        storageClassName: pb-ebs
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel-headless
  labels: { app: redis-sentinel }
spec:
  clusterIP: None
  selector: { app: redis-sentinel }
  ports:
    - { port: 26379, targetPort: 26379, name: sentinel }
---
# Client-facing Sentinel service (REDIS_SENTINELS may also target the per-pod
# headless names for direct discovery).
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel
  labels: { app: redis-sentinel }
spec:
  type: ClusterIP
  selector: { app: redis-sentinel }
  ports:
    - { port: 26379, targetPort: 26379, name: sentinel }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-sentinel
  labels: { app: redis-sentinel, app.kubernetes.io/component: cache }
spec:
  serviceName: redis-sentinel-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels: { app: redis-sentinel }
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9121"
        prometheus.io/path: /metrics
      labels: { app: redis-sentinel, app.kubernetes.io/component: cache }
    spec:
      serviceAccountName: redis-sentinel
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector: { matchLabels: { app: redis-sentinel } }
                topologyKey: kubernetes.io/hostname
      securityContext: { runAsUser: 999, runAsNonRoot: true, fsGroup: 999 }
      containers:
        - name: sentinel
          image: redis@sha256:bd999b5cfee25fb24b8320a31fddbd69f462df44c8138c66e369582937beebc0  # redis:8-alpine
          command: ["sh", "/scripts/sentinel-bootstrap.sh"]
          ports:
            - { containerPort: 26379, name: sentinel }
          readinessProbe:
            exec: { command: ["redis-cli", "-p", "26379", "ping"] }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: "25m", memory: 32Mi }
            limits: { cpu: "100m", memory: 64Mi }
          volumeMounts:
            - { name: scripts, mountPath: /scripts, readOnly: true }
            - { name: conf, mountPath: /etc/redis }
        # Prometheus exporter sidecar, pointed at Sentinel's own port. Sentinel
        # health is the HA story: quorum size, known replicas, and failover
        # events. Without this the PodDisruptionBudget protects a quorum nothing
        # is watching — a Sentinel that has lost sight of the primary looks
        # identical to a healthy one from outside.
        - name: redis-exporter
          image: oliver006/redis_exporter@sha256:dbd410eb9255016c9440b40b8fa18872fdf0e7972d06fc1df8d5b120d35efe05  # oliver006/redis_exporter:v1.69.0
          args:
            - "--redis.addr=redis://localhost:26379"
          ports:
            - containerPort: 9121
              name: metrics
          resources:
            requests: { cpu: "20m", memory: 32Mi }
            limits:   { cpu: "100m", memory: 96Mi }
      volumes:
        - name: scripts
          configMap: { name: redis-sentinel-config, defaultMode: 0555 }
        - name: conf
          emptyDir: {}
---
# NetworkPolicies — make the template drop-in under the default-deny-ingress.
# App services reach the Redis data nodes (6379) and Sentinels (26379); Redis
# pods + Sentinels talk among themselves for replication + monitoring.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-ingress
spec:
  podSelector:
    matchLabels: { app: redis }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [platform, pipeline, plugin, message, quota, billing, compliance, reporting, image-registry, ask, redis, redis-sentinel]
      ports:
        - { port: 6379 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-sentinel-ingress
spec:
  podSelector:
    matchLabels: { app: redis-sentinel }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [platform, pipeline, plugin, message, quota, billing, compliance, reporting, image-registry, ask, redis, redis-sentinel]
      ports:
        - { port: 26379 }
---
# Quorum protection for VOLUNTARY disruption (node drains, and on eks Karpenter's
# consolidation, which is aggressive about repacking nodes). Without these, a
# single drain can evict two of the three Sentinels at once: quorum is 2, so the
# survivors cannot agree to promote a replica and the "no longer a data-tier
# SPOF" property this manifest exists to provide silently stops holding — exactly
# when it is needed. Involuntary loss (node crash) is unaffected by a PDB; this
# only stops the cluster from doing it to itself.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis
  labels:
    app: redis
spec:
  # 1 primary + 2 replicas: keep 2 up so a failover always has a promotable
  # replica with recent state.
  minAvailable: 2
  selector:
    matchLabels:
      app: redis
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-sentinel
  labels:
    app: redis-sentinel
spec:
  # Sentinel quorum is 2 (see the header of this file) — never let a drain take
  # the fleet below it.
  minAvailable: 2
  selector:
    matchLabels:
      app: redis-sentinel

        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                # Refreshed to match real DB-cred mounts + istio.yaml AuthZ:
                # compliance/reporting/pgbouncer also connect; db-backup dumps it.
                values: [platform, pipeline, plugin, message, compliance, reporting, pgbouncer, pgadmin, db-backup]

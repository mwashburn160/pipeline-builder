---
# =============================================================================
# Ask model — the self-hosted, OpenAI-compatible model (Ollama) that backs the
# Ask assistant on this target.
#
# APPLIED BY DEFAULT here (listed in kustomization.yaml), and the `ask`
# Deployment points at it via OPENAI_COMPATIBLE_BASE_URL / _MODELS. The two go
# together: with no cloud provider key configured, removing either leaves the
# ask service with NO provider and every turn fails with "AI is not configured".
#
# (The minikube target keeps this opt-in — a 6Gi request will not schedule
# beside the rest of the namespace on a typical laptop-sized cluster.)
#
# Sizing: a 7.6B Q4_K_M model needs ~6-8Gi RAM on the CPU, or one GPU. This
# target runs it ON A GPU (`ask-model-gpu` NodePool, ~$1/hr): on the CPU the
# same model measured 3.0 tokens/s prompt eval and 3.3 tokens/s generation
# here — about 90s for a 300-token answer — which is not usable interactively.
# The ec2 and minikube copies stay on the CPU deliberately.
# Self-contained: bundles its ServiceAccount + istio authz + NetworkPolicy so
# `kubectl apply -f ask-model.yaml` brings everything ask needs to reach it.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata: { name: ask-model, namespace: pipeline-builder, labels: { app.kubernetes.io/part-of: pipeline-builder } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ask-model-models
  labels:
    app: ask-model
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: pb-ebs
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ask-model
  labels:
    app: ask-model
spec:
  type: ClusterIP
  ports:
    - port: 11434
      targetPort: 11434
      protocol: TCP
      name: http
  selector:
    app: ask-model
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ask-model
  labels:
    app: ask-model
    app.kubernetes.io/component: model
spec:
  replicas: 1
  # Single writer on an RWO volume — recreate (don't run two pods on one PVC).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ask-model
  template:
    metadata:
      labels:
        app: ask-model
        app.kubernetes.io/component: model
    spec:
      serviceAccountName: ask-model
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: false   # ollama writes model blobs under /root/.ollama
        fsGroup: 0
      # Pin to the accelerated pool (cluster/nodepool.yaml `ask-model-gpu`).
      #
      # nodeSelector AND toleration, both required and for opposite reasons:
      # the taint keeps everything ELSE off a node that costs ~$1/hr, and the
      # selector keeps THIS pod from quietly landing back on a general CPU node
      # — where it still works, at 3 tokens/s, with nothing to show that it
      # regressed. Pending is the better failure: it is visible.
      # Pinned to the accelerated pool (cluster/nodepool.yaml `ask-model-gpu`).
      # Requires the account's "Running On-Demand G and VT instances" quota
      # (service-quotas ec2 / L-DB2E81BA) to be non-zero — it was 0 until
      # raised to 8 vCPU, and with 0 every launch dies `VcpuLimitExceeded` and
      # this pod is Pending for ever, i.e. Ask OFFLINE rather than slow. If
      # this is ever ported to another account, check that quota first.
      #
      # nodeSelector AND toleration, for opposite reasons: the taint keeps
      # everything else off a node that costs ~$1/hr, the selector keeps THIS
      # pod from landing back on a CPU node and silently returning to 3
      # tokens/s. Pending is the better failure — it is visible.
      #
      # EBS cannot cross an AZ: an already-bound `ask-model-models` PV holds
      # the zone of whatever node first used it, so if the GPU node lands
      # elsewhere this pod waits on a volume-node-affinity conflict. Delete the
      # PVC once and it rebinds beside the GPU node (the model is re-pulled;
      # `pb-ebs` is Retain, so release the orphaned volume too).
      nodeSelector:
        pipeline-builder/pool: ask-model-gpu
      tolerations:
        - key: pipeline-builder/accelerator
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: ollama
          image: ollama/ollama@sha256:96b7667cb536ab69bfd5cc0c2bd1e29602218e076fe6d34f402b786f17b4fde0  # ollama/ollama:0.6.5
          ports:
            - containerPort: 11434
              name: http
          env:
            - name: OLLAMA_MODEL
              value: "qwen2.5-coder:7b"
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            # Keep the model resident. The default is 5m, after which ollama
            # evicts it and the NEXT question pays a full reload from disk before
            # a single token — which reads to the user as "Ask just hangs".
            - name: OLLAMA_KEEP_ALIVE
              value: "24h"
            # One request at a time. The default (4) splits the context budget
            # into parallel slots, costing memory and slowing the single
            # interactive request this deployment actually serves.
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
            # THE CONTEXT WINDOW, and the name ask actually calls (ask.yaml's
            # OPENAI_COMPATIBLE_MODELS must match OLLAMA_SERVED_MODEL).
            #
            # ollama's default window is 2048 tokens, smaller than the Ask
            # agent's own prompt (~3.4k: system prompt + tool schemas), so every
            # turn logged "truncating input prompt limit=2048 prompt=3395" —
            # and ollama keeps the prompt's TAIL, so what it dropped was most of
            # the system prompt and the tool definitions. The OpenAI-compatible
            # endpoint takes no per-request num_ctx, and this image (0.6.5)
            # predates OLLAMA_CONTEXT_LENGTH, so the window is baked into a
            # derived model instead. `ollama create` FROM a local model reuses
            # its weight blobs: instant, no extra disk. 8192 leaves room for
            # conversation history; its KV cache (~450MiB) fits easily beside
            # the 7B weights on the 16GB card.
            - name: OLLAMA_NUM_CTX
              value: "8192"
            - name: OLLAMA_SERVED_MODEL
              value: "qwen2.5-coder:7b-ctx8k"
          # Run the server AND the pull as the container's main process.
          #
          # This was a lifecycle.postStart hook, which was a mistake: a blocking
          # postStart keeps the container out of Running for its whole duration,
          # so during the (minutes-long) first pull the pod sat in
          # ContainerCreating with NO readable logs and no `kubectl exec` — the
          # download looked indistinguishable from a hang. Running it as PID 1's
          # script instead means the pod is Running immediately, `kubectl logs`
          # streams the pull's progress, and the startupProbe below is what
          # actually gates traffic. Mirrors the docker target's compose command.
          command: ["/bin/sh", "-c"]
          args:
            # Retry rather than `|| true` once: a transient registry blip would
            # otherwise leave the server up with no model until the startupProbe
            # finally restarts the container.
            - |
              ollama serve &
              sleep 4
              for i in 1 2 3 4 5; do
                ollama pull "$OLLAMA_MODEL" && break
                echo "ollama pull failed (attempt $i); retrying in 30s" >&2
                sleep 30
              done
              printf 'FROM %s\nPARAMETER num_ctx %s\n' "$OLLAMA_MODEL" "$OLLAMA_NUM_CTX" > /tmp/Modelfile
              ollama create "$OLLAMA_SERVED_MODEL" -f /tmp/Modelfile
              # LOAD it, don't just fetch it. `ollama pull` puts the weights on
              # disk; the startupProbe below checks exactly that and then lets
              # traffic in — so the FIRST question of a pod's life still paid
              # the cold load before a single token. Measured on EKS: 35.9s of
              # a 48.1s request, for a two-token reply.
              #
              # `--keepalive` matches OLLAMA_KEEP_ALIVE, so the model stays
              # resident afterwards and only this startup pays it. Failure is
              # tolerated: an unwarmed model still answers, just slowly, and
              # killing the container over a warm-up would be worse than the
              # delay it avoids.
              #
              # Warm the SERVED model: a different num_ctx is a separate load, so
              # warming the base model would leave the first real request to pay
              # the cold load all over again.
              ollama run "$OLLAMA_SERVED_MODEL" ok --keepalive 24h >/dev/null 2>&1 \
                || echo "warm-up failed; first request will pay the model load" >&2
              wait
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          resources:
            # DELIBERATELY DIFFERENT from the ec2 copy, which requests 250m.
            # There, a fixed node plus the namespace ResourceQuota makes the
            # request a claim against a fixed budget, so parking a full core
            # starves the transient bootstrap pods. Here there is no quota
            # (see resource-limits.yaml) and Karpenter sizes NODES from pod
            # requests — so the request is what BUYS capacity. Asking for 250m
            # would let Auto Mode bin-pack this onto a node too small to serve
            # its own 4-core limit, and generation would throttle.
            requests:
              cpu: "1"
              memory: 6Gi
            limits:
              cpu: "4"
              memory: 10Gi
              # Claims the card. Without this the pod schedules onto the GPU
              # node and still runs on the CPU — ollama only offloads to a GPU
              # the device plugin has actually allocated to it, so the node
              # would be bought and not used.
              nvidia.com/gpu: "1"
          # GATE READINESS ON THE MODEL, NOT THE SERVER.
          #
          # `/api/version` answers as soon as ollama's HTTP server binds — which
          # is almost immediately, while the `ollama pull` in the command above is
          # still downloading (~1GB here, ~4.7GB for the 7B on the AWS targets).
          # With only that probe the pod went Ready, the Service routed chat
          # completions to a model that did not exist yet, and ollama closed the
          # connection: the caller saw
          #   "AI_APICallError: Cannot connect to API: other side closed".
          #
          # A startupProbe suspends the readiness/liveness probes until it
          # passes, so the pod stays out of the Service until `ollama list`
          # actually shows the model. failureThreshold x periodSeconds is the
          # first-pull budget (~20 min); a pull that never lands restarts the
          # container, which retries it — better than serving nothing forever.
          startupProbe:
            exec:
              # The SERVED model: it exists only once pull AND create are done.
              command: ["/bin/sh", "-c", "ollama list | grep -qF \"$OLLAMA_SERVED_MODEL\""]
            periodSeconds: 10
            failureThreshold: 120
          readinessProbe:
            exec:
              command: ["ollama", "list"]
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["ollama", "list"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ask-model-models
---
# ask -> ask-model (OpenAI-compatible inference). Additive istio authz.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: ask-model-allow
  namespace: pipeline-builder
spec:
  selector:
    matchLabels:
      app: ask-model
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/pipeline-builder/sa/ask
      to:
        - operation:
            ports: ["11434"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ask-model-from-ask
spec:
  podSelector:
    matchLabels:
      app: ask-model
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ask
      ports:
        - port: 11434
---
# ask-model -> the model registry (registry.ollama.ai).
#
# REQUIRED, not optional. `allow-dns-egress` and `allow-internal-egress` in
# networkpolicy.yaml both use an EMPTY podSelector, so every pod in this
# namespace is egress-restricted the moment they exist: DNS and in-namespace
# traffic only, unless some other policy widens it. Without this rule
# `ollama pull` resolves the registry, opens a TCP connection that never
# completes, and hangs forever — the pod stays in ContainerCreating (a blocking
# postStart keeps it there), the Service keeps ZERO endpoints, and every Ask
# turn fails with "AI_APICallError: Cannot connect to API: other side closed".
# Nothing in the pod's own logs explains it, because a container stuck in
# postStart has no readable logs.
#
# SHAPE: the shared public-egress ipBlock (see EGRESS SHAPE in networkpolicy.yaml).
# Excepting the WHOLE 169.254.0.0/16 range here would sever ollama's TLS under
# Istio ambient (the handshake completed,
# then no bytes flowed: "net/http: TLS handshake timeout") — ambient's node-side
# plumbing uses link-local addresses. The shared shape excepts only the
# credential addresses (169.254.169.254/32, 169.254.170.0/24), which ambient
# never uses, so it keeps the model pull working AND keeps IMDS / the VPC /
# the LAN out of reach of the model server.
#
# FQDN-scoping this to registry.ollama.ai needs Cilium (see
# cilium-network-policies.yaml); plain NetworkPolicy cannot express it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ask-model-external-egress
spec:
  podSelector:
    matchLabels:
      app: ask-model
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - ${VPC_CIDR} # THIS cluster's VPC — discovered by bin/setup.sh
              - 10.0.0.0/8 # RFC1918
              - 172.16.0.0/12 # RFC1918
              - 192.168.0.0/16 # RFC1918 (eksctl's default VPC range)
              - 100.64.0.0/10 # CGNAT (some cloud / VPN deployments)
              - 169.254.169.254/32 # IMDS (instance-role credentials)
              - 169.254.170.0/24 # container-credential endpoints (ECS .2, EKS Pod Identity .23)
      ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP

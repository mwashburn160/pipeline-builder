# Nightly DB backup CronJob (Postgres + Mongo → RustFS).
#
# There is a sibling copy at ec2/k8s/backup-cronjob.yaml. Both targets get
# one because the destination is RustFS, which every target runs — the old
# reason this lived only beside eks (S3, SSE-KMS and IRSA being AWS concerns,
# with nowhere for minikube to write) stopped applying the moment the
# destination moved in-cluster.
#
# minikube and docker deliberately have NO scheduled job: their databases are
# seeded from postgres-init.sql and are disposable, and `deploy/bin/backup.sh`
# covers the rare time someone wants one by hand.
#
# It is deliberately kept OUT of k8s/kustomization.yaml — the eks deploy applies `kubectl kustomize k8s/`,
# which only includes manifests listed in `resources:`, so this template can't
# break a deploy. Enable it explicitly: `kubectl apply -f backup-cronjob.yaml`.
#
# TARGET: RUSTFS, the IN-CLUSTER object store — a deliberate operator choice,
# and the one thing to understand before relying on this.
#
# These dumps land in the same cluster, account and region as the databases
# they protect. They cover the common disasters — a dropped table, a bad
# migration, a corrupted row — and they do NOT cover losing the cluster, the
# AZ, or the account, because the backup dies with the thing it was backing up.
# Pointing BACKUP_BUCKET/S3_ENDPOINT at a real off-cluster bucket is the only
# change needed if that trade is ever revisited; everything else here works
# unmodified, because the scripts take an endpoint.
#
# ONE STEP LEFT — build the image:
#   `image:` needs `pg_dump` (postgres client), `mongodump` (mongo database
#   tools), the `aws` CLI, `rclone`, `openssl` and `curl`, running as a NON-ROOT uid (the pod
#   rejects root; see securityContext). Then apply:
#     kubectl apply -f backup-cronjob.yaml
#
# THEN TEST A RESTORE — an untested backup is not a backup:
#     deploy/aws/eks/bin/restore.sh --confirm-destructive
#   into a scratch namespace. The restore path reads S3_ENDPOINT the same way
#   this job writes it, so it will look in RustFS, not AWS.
#
# No IAM role, no IRSA, no Pod Identity: nothing here talks to AWS. The aws CLI
# is used purely as an S3-compatible client against RustFS, with credentials
# from `rustfs-secret`.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-backup
  namespace: pipeline-builder
  # EKS: annotate with the Pod Identity / IRSA role that carries s3:PutObject.
  # annotations:
  #   eks.amazonaws.com/role-arn: <backup-role-arn>
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
  namespace: pipeline-builder
spec:
  # From .env (BACKUP_SCHEDULE / BACKUP_ENABLED / BACKUP_IMAGE), resolved and
  # validated by pb_backup_schedule_env before the apply. `schedule` and
  # `suspend` are CronJob SPEC fields, so no ConfigMap or Secret can reach
  # them — these are deploy tokens expanded by pb_apply_manifests' sed.
  schedule: "${BACKUP_SCHEDULE}"
  # Suspended unless BACKUP_ENABLED=true. The job cannot run until its image
  # exists, and a suspended CronJob never pulls, so the object is applied and
  # visible without a scheduled ImagePullBackOff every night.
  suspend: ${BACKUP_SUSPEND}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            # Matched by allow-postgres-ingress in k8s/networkpolicy.yaml.
            app: db-backup
        spec:
          serviceAccountName: db-backup
          restartPolicy: Never
          securityContext:
            # The image must run as a non-root UID. A root-by-default image (e.g.
            # the official `postgres`) is REJECTED by the kubelet here — pick an
            # image that runs unprivileged, or match its UID below.
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          containers:
            - name: backup
              # BACKUP_IMAGE in .env. Must contain pg_dump, mongodump, the aws
              # CLI, rclone, openssl and curl, and run as non-root (see the
              # securityContext below).
              image: ${BACKUP_IMAGE}
              # bash (NOT /bin/sh): `set -o pipefail` is bash-only — under dash it
              # errors out and, with `set -e`, the job exits non-zero every night
              # (a backup that "runs" but never writes). pipefail is what makes a
              # failed pg_dump/mongodump fail the pipe instead of hiding behind
              # aws's success, so the image MUST ship bash.
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  # TELL SOMEONE WHEN THIS FAILS.
                  #
                  # A CronJob that dies leaves a Failed pod and nothing else —
                  # `failedJobsHistoryLimit` keeps it in `kubectl get pods` for
                  # whoever happens to look, which in practice is nobody until
                  # the restore that needed it. This posts straight to
                  # Alertmanager instead, so the failure goes wherever every
                  # other alert already goes.
                  #
                  # KNOWN LIMIT, on purpose: this fires only when the job RUNS
                  # and fails. A job that is suspended, deleted, or never
                  # scheduled stays silent, because nothing is left to do the
                  # posting. Catching THAT needs a pushed metric and a staleness
                  # rule (Pushgateway or kube-state-metrics — neither is
                  # deployed here), which is a bigger change than this one.
                  #
                  # `|| true` on the curl: an unreachable Alertmanager must not
                  # turn a failed backup into a crash-looping job, and the exit
                  # code of the backup is what the trap re-raises.
                  alert_on_failure() {
                    rc=$?
                    [ "$rc" -eq 0 ] && exit 0
                    curl -sS -m 10 -XPOST "http://alertmanager:9093/api/v2/alerts" \
                      -H "Content-Type: application/json" \
                      -d "[{\"labels\":{\"alertname\":\"DatabaseBackupFailed\",\"severity\":\"critical\",\"job\":\"db-backup\",\"env\":\"$ENV_NAME\"},\"annotations\":{\"summary\":\"Nightly database backup failed (exit $rc)\",\"description\":\"The db-backup CronJob exited $rc. Postgres and/or Mongo were NOT backed up tonight. Check: kubectl -n pipeline-builder logs job/<name>\"}}]" \
                      >/dev/null 2>&1 || true
                    exit "$rc"
                  }
                  trap alert_on_failure EXIT
                  # Mirror deploy/aws/eks/bin/backup.sh's S3 layout EXACTLY so restore.sh
                  # (`--date`/`--list`, which grep '^postgres-'/'^mongo-' under
                  # <env>/<YYYY/MM/DD>/) can actually find these objects.
                  ts="$(date -u +%Y%m%dT%H%M%SZ)"
                  date_dir="$(date -u +%Y/%m/%d)"
                  prefix="s3://$BACKUP_BUCKET/$ENV_NAME/$date_dir"
                  echo "backup start $ts -> $prefix"
                  # Straight to postgres as the superuser (needs every row: RLS would
                  # hide tenant data from the app role). Not via pgbouncer, whose
                  # userlist only holds the application role.
                  # RustFS, not AWS S3 — so `--endpoint-url`, and NO `--sse
                  # aws:kms` (there is no KMS behind an in-cluster store; the
                  # bytes are encrypted at rest by the EBS volumes under it).
                  # `deploy/bin/{backup,restore}.sh` read S3_ENDPOINT the same
                  # way, so a restore looks where this writes.
                  aws --endpoint-url "$S3_ENDPOINT" s3 mb "s3://$BACKUP_BUCKET" 2>/dev/null || true
                  # ENCRYPTION. The AWS design had `--sse aws:kms`; RustFS has
                  # no KMS, so without this the dumps sit in object storage
                  # protected only by the EBS encryption underneath — and a
                  # dump is every tenant's data in one file.
                  #
                  # Set BACKUP_ENCRYPTION_KEY (Secret `backup-encryption`, key
                  # `passphrase`) to turn it on. UNSET = plaintext, which is the
                  # current default so that enabling it is a deliberate act with
                  # a key someone has actually stored somewhere recoverable —
                  # an encrypted backup whose passphrase is lost is not a backup.
                  # `deploy/bin/restore.sh` reads the same variable and decrypts.
                  enc() {
                    if [ -n "${BACKUP_ENCRYPTION_KEY:-}" ]; then
                      openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BACKUP_ENCRYPTION_KEY
                    else
                      cat
                    fi
                  }
                  sfx=""; [ -n "${BACKUP_ENCRYPTION_KEY:-}" ] && sfx=".enc"
                  PGPASSWORD="$POSTGRES_PASSWORD" pg_dump -h postgres -p 5432 -U "$POSTGRES_USER" "$POSTGRES_DB" \
                    | gzip | enc | aws --endpoint-url "$S3_ENDPOINT" s3 cp - "$prefix/postgres-$ts.sql.gz$sfx"
                  mongodump --uri "$MONGODB_URI" --archive --gzip \
                    | enc | aws --endpoint-url "$S3_ENDPOINT" s3 cp - "$prefix/mongo-$ts.archive.gz$sfx"
                  # Object storage (attachments/registry/loki/thanos blobs).
                  # `rclone copy` (NOT `sync`) is additive — copies new/changed
                  # objects, never deletes from the backup, verified live before
                  # using it here (`sync` deletes from the DESTINATION whatever a
                  # source deletion removed, defeating the point of a backup) — so
                  # it goes to a STABLE prefix (not the dated one); pair the backup
                  # bucket with versioning for point-in-time recovery. A failure
                  # fails the job (set -e). Requires the image to ship `rclone`;
                  # source creds come from rustfs-secret (the same Secret every
                  # k8s target's object-store consumers read).
                  #
                  # Written to a real config FILE, not rclone's inline "on the fly"
                  # remote syntax: that syntax splits on `:`, which an http://
                  # endpoint's own colons collide with (verified live — see
                  # deploy/bin/common.sh's rclone_setup_config for the full story).
                  if [ -n "${S3_BACKUP_TARGET_URL:-}" ]; then
                    RCLONE_CONF="$(mktemp)"
                    cat > "$RCLONE_CONF" <<RCLONECONF
                  [pbsrc]
                  type = s3
                  provider = Other
                  env_auth = false
                  access_key_id = $RUSTFS_ROOT_ACCESS_KEY
                  secret_access_key = $RUSTFS_ROOT_SECRET_KEY
                  endpoint = $S3_ENDPOINT

                  [pbdst]
                  type = s3
                  provider = Other
                  env_auth = false
                  access_key_id = $S3_BACKUP_TARGET_ACCESS_KEY
                  secret_access_key = $S3_BACKUP_TARGET_SECRET_KEY
                  endpoint = $S3_BACKUP_TARGET_URL
                  RCLONECONF
                    for b in ${OBJECTSTORE_BUCKETS:-message-attachments registry loki thanos plugins plugin-quarantine audit-heads}; do
                      echo "mirror $b"
                      rclone --config "$RCLONE_CONF" copy --quiet "pbsrc:$b" "pbdst:${S3_BACKUP_TARGET_BUCKET:-$BACKUP_BUCKET}/minio/$ENV_NAME/$b"
                    done
                    rm -f "$RCLONE_CONF"
                  fi
                  # RETENTION IS THE BUCKET'S, NOT THIS JOB'S. rustfs-init gives
                  # db-backups a lifecycle rule (--expiry-days BACKUP_RETENTION_DAYS)
                  # plus versioning and a noncurrent expiry. The claim this code used
                  # to carry — "RustFS has no lifecycle engine" — was simply wrong:
                  # rustfs-init already uses `rc bucket lifecycle rule add` for the
                  # plugins and plugin-quarantine buckets.
                  #
                  # Deleting it here is the point. The prune ran `aws s3 rm` with the
                  # object store's ROOT credential, so the nightly job held exactly the
                  # capability an attacker wants: erase the backups, then the data. This
                  # job's credential is now scoped to db-backups and has NO delete verb
                  # at all, which is only possible because the bucket expires its own
                  # objects.
                  # VERIFY WHAT WAS ACTUALLY WRITTEN, before claiming success.
                  #
                  # This job used to report success — and push the staleness metric —
                  # whenever the pipe did not error. A pg_dump of an EMPTY or WRONG
                  # database produces a small, perfectly valid gzip, uploads cleanly,
                  # and looked identical to a good night. DatabaseBackupStale then stays
                  # quiet because the timestamp keeps advancing, so the one alert meant
                  # to catch a broken backup was defeated by a backup that ran.
                  #
                  # A size floor is the cheap, honest check: this schema's dump is
                  # hundreds of KiB from the first migration onward, so anything under
                  # BACKUP_MIN_BYTES means the dump is not what it should be. Read back
                  # from the store rather than from the pipe, so it also proves the
                  # object is really there and the right size.
                  min="${BACKUP_MIN_BYTES:-65536}"
                  for obj in "postgres-$ts.sql.gz$sfx" "mongo-$ts.archive.gz$sfx"; do
                    sz=$(aws --endpoint-url "$S3_ENDPOINT" s3api head-object \
                          --bucket "$BACKUP_BUCKET" --key "$ENV_NAME/$date_dir/$obj" \
                          --query ContentLength --output text 2>/dev/null || echo 0)
                    # Non-numeric (head-object failed) counts as zero, not as a pass.
                  [ "$sz" -ge 0 ] 2>/dev/null || sz=0
                    if [ "$sz" -lt "$min" ]; then
                      echo "ERROR: $obj is ${sz}B, under the ${min}B floor — treating this backup as FAILED" >&2
                      exit 2
                    fi
                    echo "verified $obj ${sz}B"
                  done
                  # Record the success as a TIMESTAMP, for the staleness rule.
                  #
                  # This is the half the Alertmanager POST above cannot cover:
                  # that fires when the job runs and fails, this is what reveals
                  # a job that stopped running at all. The metric's VALUE is the
                  # unix time of this success, so `time() - <metric>` grows on
                  # its own and `DatabaseBackupStale` fires with nothing left
                  # alive to report anything.
                  #
                  # Best-effort: a dead Pushgateway must not fail a backup that
                  # already wrote both dumps. The cost of the push failing is a
                  # false staleness alert, which is the safe direction.
                  cat <<EOM | curl -sS -m 10 --data-binary @- "http://pushgateway:9091/metrics/job/db-backup/env/$ENV_NAME" >/dev/null 2>&1 || echo "warn: could not push success metric" >&2
                  # TYPE backup_last_success_timestamp_seconds gauge
                  # HELP backup_last_success_timestamp_seconds Unix time of the last successful database backup.
                  backup_last_success_timestamp_seconds $(date -u +%s)
                  EOM
                  echo "backup ok $ts"
              envFrom:
                - configMapRef: { name: app-env }        # POSTGRES_DB, …
                - secretRef: { name: postgres-secret }   # POSTGRES_USER/PASSWORD (superuser)
                - secretRef: { name: mongodb-secret }    # MONGODB_URI
              env:
                - name: BACKUP_BUCKET
                  value: "db-backups"
                # The aws CLI reads these for the RustFS endpoint above. Same
                # Secret every object-store consumer uses; no IAM role, no IRSA
                # and no Pod Identity are involved, because nothing here talks
                # to AWS.
                # SCOPED, not root: db-backups only, and no delete verb.
                - { name: AWS_ACCESS_KEY_ID,     valueFrom: { secretKeyRef: { name: rustfs-secret, key: backup-access-key } } }
                - { name: AWS_SECRET_ACCESS_KEY, valueFrom: { secretKeyRef: { name: rustfs-secret, key: backup-secret-key } } }
                - name: AWS_REGION
                  value: "us-east-1"        # ignored by RustFS; the CLI demands one
                # BACKUP_RETENTION_DAYS in .env. By AGE, not archive count: the
                # prune deletes objects older than this, so a daily schedule
                # leaves roughly this many dumps per database. 0 disables it —
                # and RustFS has no lifecycle engine, so nothing then expires.
                - name: RETENTION_DAYS
                  value: "${BACKUP_RETENTION_DAYS}"
                - { name: BACKUP_ENCRYPTION_KEY, valueFrom: { secretKeyRef: { name: backup-encryption, key: passphrase, optional: true } } }
                - name: ENV_NAME              # environment label in the S3 path; must
                  value: "prod"              # match ENV_NAME used by backup.sh/restore.sh
                # --- Object-storage mirror (optional) ---
                # Unset S3_BACKUP_TARGET_URL to skip the object-storage step
                # entirely. Source creds from rustfs-secret (the same Secret every
                # k8s target's object-store consumers read, see k8s/rustfs.yaml);
                # the backup target is a durable S3-compatible endpoint the
                # rclone image can reach.
                - name: S3_ENDPOINT
                  value: "http://rustfs:9000"
                - { name: RUSTFS_ROOT_ACCESS_KEY,  valueFrom: { secretKeyRef: { name: rustfs-secret, key: root-user } } }
                - { name: RUSTFS_ROOT_SECRET_KEY,  valueFrom: { secretKeyRef: { name: rustfs-secret, key: root-password } } }
                # EMPTY ON PURPOSE: this mirrors RustFS's blobs to a SECOND
                # store, and with the dumps already in RustFS it would copy
                # that store onto itself. Set it to a durable off-cluster
                # endpoint if you ever want the blobs held somewhere else.
                - name: S3_BACKUP_TARGET_URL
                  value: ""
                - name: S3_BACKUP_TARGET_BUCKET
                  value: ""                  # defaults to BACKUP_BUCKET when empty
                - { name: S3_BACKUP_TARGET_ACCESS_KEY, valueFrom: { secretKeyRef: { name: objectstore-backup-target, key: access-key, optional: true } } }
                - { name: S3_BACKUP_TARGET_SECRET_KEY, valueFrom: { secretKeyRef: { name: objectstore-backup-target, key: secret-key, optional: true } } }
              # Hardened as far as this job can be. allowPrivilegeEscalation
              # and dropping every capability cost nothing here — it dumps
              # databases and talks to an object store, so it needs neither.
              # Worth doing specifically because of what this pod holds: the
              # database superuser password and every tenant's data in flight.
              #
              # readOnlyRootFilesystem is NOT set, deliberately: the rclone
              # object-store mirror writes its config with `mktemp`, so the
              # root filesystem has to be writable. Setting it would need a
              # writable emptyDir at /tmp and the config pointed there.
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: "100m", memory: "128Mi" }
                limits: { cpu: "500m", memory: "512Mi" }

---
# =============================================================================
# Resource management on EKS Auto Mode
# =============================================================================
# Unlike the ec2/minikube copies, this EKS variant intentionally omits the
# namespace-wide ResourceQuota. On EKS Auto Mode capacity is elastic: Karpenter
# provisions and consolidates nodes on demand, and the HPAs scale
# image-registry → 5 and plugin → 4 (each with a buildkitd sidecar). A static
# per-namespace ResourceQuota sized for a single t3.2xlarge node would reject
# that scale-out (hitting requests.cpu / pods / persistentvolumeclaims caps)
# and defeat the autoscaler. Capacity is therefore governed by Karpenter
# NodePools + per-pod requests/limits, not a namespace quota.
#
# The LimitRange below is still applied so containers that omit
# requests/limits get sane per-pod defaults (which Karpenter uses for bin-
# packing / scale decisions).
# =============================================================================
# Default Resource Limits (for containers that don't specify them)
# =============================================================================
apiVersion: v1
kind: LimitRange
metadata:
  name: pipeline-builder-limits
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: 512Mi
      defaultRequest:
        cpu: "100m"
        memory: 128Mi
      # These are the LARGEST per-container limits in the namespace, and the cap
      # is a HARD admission gate, not a scheduling hint: a container whose limit
      # (or request) exceeds it cannot be created at all — the ReplicaSet just
      # emits `pods "..." is forbidden: maximum memory usage per Container is X,
      # but limit is Y` and the Deployment sits at 0/1 with no pod to inspect.
      #
      # ask-model (the Ollama 7B, limits cpu 4 / memory 10Gi) is now that largest
      # container, so both values are literals sized to it. They previously read
      # cpu "2" / ${BUILDKIT_MEMORY_LIMIT} (6144Mi here), which silently forbade
      # every ask-model pod the moment it was added to kustomization.yaml.
      #
      # The memory value therefore no longer tracks BUILDKIT_MEMORY_LIMIT: keep
      # that <= 10Gi (it is the buildkitd sidecar's cgroup limit; default 6144Mi)
      # or the plugin pod hits this same cap. The Pod-level max below must stay
      # >= these, since ask-model is a single-container pod.
      max:
        cpu: "4"
        memory: 10Gi
    - type: Pod
      max:
        cpu: "6"
        memory: 10Gi

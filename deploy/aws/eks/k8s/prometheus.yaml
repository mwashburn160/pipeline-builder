---
# =============================================================================
# Prometheus RBAC
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "nodes/proxy", "services", "endpoints"]
    verbs: ["get", "watch", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: pipeline-builder
roleRef:
  kind: ClusterRole
  name: prometheus
  apiGroup: rbac.authorization.k8s.io

---
# =============================================================================
# Prometheus Service
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app: prometheus
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: http
    # Thanos sidecar StoreAPI (gRPC) — the querier reaches the sidecar's
    # still-local recent blocks through this port on the prometheus pod.
    - port: 10901
      targetPort: 10901
      protocol: TCP
      name: grpc-sidecar
  selector:
    app: prometheus

---
# =============================================================================
# Prometheus PersistentVolumeClaim
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  labels:
    app: prometheus
spec:
  storageClassName: pb-ebs
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
# =============================================================================
# Prometheus Deployment
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app: prometheus
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # RWO pb-ebs PVC can't be mounted by two pods at once — Recreate avoids the
  # rolling-update overlap that would otherwise stall on a cross-AZ multi-attach.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      annotations:
        # Scraped by the `kubernetes-pods` job. The observability stack has to
        # monitor ITSELF — without this, a Loki/Thanos/Alertmanager failure is
        # invisible, and LokiRateCapBreach could never fire because the metric
        # it alerts on (loki_discarded_samples_total) is emitted by Loki.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
      labels:
        app: prometheus
        app.kubernetes.io/component: observability
    spec:
      serviceAccountName: prometheus
      securityContext:
        fsGroup: 65534
        runAsUser: 65534
        runAsNonRoot: true
      initContainers:
        - name: fix-permissions
          image: busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616  # busybox:1.38
          resources:
            limits:
              cpu: "100m"
              memory: 64Mi
            requests:
              cpu: "25m"
              memory: 32Mi
          command: ["sh", "-c", "chown -R 65534:65534 /prometheus"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: prometheus-data
              mountPath: /prometheus
      containers:
        - name: prometheus
          image: prom/prometheus@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69  # prom/prometheus:v3.13.2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.retention.time=7d"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.max-block-duration=2h"
            - "--storage.tsdb.min-block-duration=2h"
            - "--web.enable-lifecycle"
            - "--web.enable-admin-api"
          ports:
            - containerPort: 9090
              name: http
          resources:
            limits:
              cpu: "300m"
              memory: 512Mi
            requests:
              cpu: "50m"
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
              readOnly: true
            - name: prometheus-data
              mountPath: /prometheus
        # Thanos sidecar — ships Prometheus 2h TSDB blocks to MinIO (S3) for durable
        # long-term storage. Reads the shared TSDB volume; talks to Prometheus on
        # localhost. (Querying archived blocks needs a store-gateway + querier.)
        - name: thanos-sidecar
          image: quay.io/thanos/thanos@sha256:1d022ef4b8eff056a0e3b7822f953d931c5704d068413f2d7ce5266aa96c9e80  # quay.io/thanos/thanos:v0.39.2
          args:
            - "sidecar"
            - "--tsdb.path=/prometheus"
            - "--prometheus.url=http://localhost:9090"
            - "--objstore.config-file=/etc/thanos/objstore.yml"
            - "--http-address=0.0.0.0:10902"
            - "--grpc-address=0.0.0.0:10901"
          # objstore.yml reads its S3 creds as $(THANOS_S3_*) — Thanos expands env
          # refs in --objstore.config-file and fails fast on an unset one. The key
          # is random per provision (minio-secret), so it can't live in the file.
          env:
            - name: THANOS_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: minio-secret, key: thanos-access-key } }
            - name: THANOS_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: minio-secret, key: thanos-secret-key } }
          ports:
            - containerPort: 10902
              name: http-sidecar
            - containerPort: 10901
              name: grpc
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            limits:
              cpu: "200m"
              memory: 256Mi
            requests:
              cpu: "50m"
              memory: 64Mi
          volumeMounts:
            - name: prometheus-data
              mountPath: /prometheus
              readOnly: true
            - name: thanos-objstore
              mountPath: /etc/thanos
              readOnly: true
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
        - name: thanos-objstore
          configMap:
            name: thanos-objstore
        - name: prometheus-data
          persistentVolumeClaim:
            claimName: prometheus-data

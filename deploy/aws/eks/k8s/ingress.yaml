# =============================================================================
# ALB Ingress → nginx gateway (EKS Auto Mode's built-in load-balancer controller)
# =============================================================================
# TLS terminates at the ALB with an ACM cert (same posture as the ec2 target's
# ALB); the ALB forwards plain HTTP to the nginx Service on 8080. Set scheme to
# `internal` for a private (inside-VPC-only) deployment.
# `${...}` tokens are substituted by bin/setup.sh.
# =============================================================================
# EKS Auto Mode runs its OWN ALB controller (controller: eks.amazonaws.com/alb) — NOT
# the standalone AWS Load Balancer Controller — so it does NOT auto-create an `alb`
# IngressClass. We must define one ourselves, else the Ingress is never reconciled
# ("ingressClass 'alb' not found" and the ALB never provisions).
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: alb
  labels:
    app.kubernetes.io/name: LoadBalancerController
spec:
  controller: eks.amazonaws.com/alb
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pb-ingress
  namespace: pipeline-builder
  annotations:
    alb.ingress.kubernetes.io/scheme: ${ALB_SCHEME}            # internet-facing | internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: ${ACM_CERT_ARN}
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-port: "8080"
# -----------------------------------------------------------------------------
# NO second listener for the RustFS object-store console on this target, and that
# is deliberate — unlike the ec2 target, which does get one.
#
# The console cannot be a path on 443: its UI resolves the S3/admin API from
# window.location and then calls ROOT paths, so it needs an origin whose whole
# path space is RustFS's (see nginx/rustfs-console.conf). nginx here DOES serve it
# on :9001 and the nginx Service publishes that port — what is missing is only the
# public ALB listener in front of it.
#
# An ALB listener cannot be scoped to a rule: listener rules match on host, path,
# method, query, header and source IP, never on the listener's own port. So one
# ALB + one hostname + one cert cannot serve two origins, and the only ways to add
# 9001 would be an IngressGroup (`group.name`) or a second LoadBalancer Service.
# Both are unverified on EKS AUTO MODE, which runs its own ALB controller
# (eks.amazonaws.com/alb, see above) rather than the standalone AWS Load Balancer
# Controller whose annotation set those come from, and the failure modes are bad:
# a silently-ignored group.name provisions a SECOND ALB on a different DNS name
# that the ${DOMAIN} cert does not cover, and rules landing on both listeners
# would let the console rule shadow `/` on 443.
#
# Until that is verified against a live Auto Mode cluster, reach it the way
# init-platform.sh already reaches nginx:
#     kubectl port-forward -n pipeline-builder svc/nginx 9001:9001
#     open http://localhost:9001/rustfs/console/
# It still answers 404 on every path unless ADMIN_UIS_ENABLED=true.
# -----------------------------------------------------------------------------
spec:
  ingressClassName: alb
  rules:
    - host: ${DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 8080

---
# =============================================================================
# MongoDB Service
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  labels:
    app: mongodb
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  ports:
    - port: 27017
      targetPort: 27017
      protocol: TCP
      name: mongodb
  selector:
    app: mongodb

---
# =============================================================================
# MongoDB PersistentVolumeClaim
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-data
  labels:
    app: mongodb
spec:
  storageClassName: pb-ebs
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
# =============================================================================
# MongoDB Deployment
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  labels:
    app: mongodb
    app.kubernetes.io/component: database
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # RWO pb-ebs PVC can't be mounted by two pods at once — Recreate avoids the
  # rolling-update overlap that would otherwise stall on a cross-AZ multi-attach.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9216"
        prometheus.io/path: /metrics
      labels:
        app: mongodb
        app.kubernetes.io/component: database
    spec:
      serviceAccountName: mongodb
      # mongod's replica-set membership check ("isSelf") resolves the member
      # host `mongodb:27017` — the Service name — and, since that isn't a local
      # address, dials it through the Service. Under the Istio ambient mesh that
      # dial fails while ztunnel is still enrolling a freshly started pod (e.g.
      # after a node/cluster restart); mongod then marks itself REMOVED ("not a
      # member of the config") and, as a single-node set with no peer
      # heartbeats, never recovers until restarted. Pinning `mongodb` to loopback
      # inside this pod makes isSelf a local-address match with no network
      # dependency. Every other pod still resolves `mongodb` to the Service.
      hostAliases:
        - ip: "127.0.0.1"
          hostnames: ["mongodb"]
      initContainers:
        # Fix keyfile permissions (MongoDB requires 400)
        - name: fix-keyfile-permissions
          image: busybox:1.38
          resources:
            limits:
              cpu: "100m"
              memory: 64Mi
            requests:
              cpu: "50m"
              memory: 32Mi
          command:
            - sh
            - -c
            - |
              cp /keyfile-readonly/mongodb-keyfile /keyfile/mongodb-keyfile
              chmod 400 /keyfile/mongodb-keyfile
              chown 999:999 /keyfile/mongodb-keyfile
          volumeMounts:
            - name: keyfile-readonly
              mountPath: /keyfile-readonly
            - name: keyfile
              mountPath: /keyfile
      containers:
        - name: mongodb
          image: mongo:8.3.7
          args:
            - "--bind_ip_all"
            - "--replSet"
            - rs0
            - "--keyFile"
            - /keyfile/mongodb-keyfile
          ports:
            - containerPort: 27017
              name: mongodb
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_INITDB_ROOT_PASSWORD
            - name: MONGO_INITDB_DATABASE
              value: "platform"
          resources:
            limits:
              cpu: "1000m"
              memory: 1536Mi
            requests:
              cpu: "150m"
              memory: 768Mi
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - |
                  mongosh --quiet --host localhost:27017 \
                    --username "$MONGO_INITDB_ROOT_USERNAME" \
                    --password "$MONGO_INITDB_ROOT_PASSWORD" \
                    --authenticationDatabase admin \
                    --eval 'try { rs.status() } catch (e) { if (e.codeName === "NotYetInitialized") { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongodb:27017" }] }) } else { throw e } } quit(db.hello().isWritablePrimary ? 0 : 1)'
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 25
            failureThreshold: 5
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - |
                  mongosh --quiet --host localhost:27017 \
                    --username "$MONGO_INITDB_ROOT_USERNAME" \
                    --password "$MONGO_INITDB_ROOT_PASSWORD" \
                    --authenticationDatabase admin \
                    --eval "db.adminCommand('ping')"
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
            - name: keyfile
              mountPath: /keyfile
              readOnly: true
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
        # Prometheus exporter sidecar — see the postgres-exporter note for why
        # this is a sidecar. --collect-all enables the replset/oplog collectors
        # this deployment cares about; --compatible-mode keeps the legacy metric
        # names that most community dashboards and alert rules expect.
        - name: mongodb-exporter
          image: percona/mongodb_exporter:0.44.0
          args:
            - "--collect-all"
            - "--compatible-mode"
            - "--web.listen-address=:9216"
          ports:
            - containerPort: 9216
              name: metrics
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGODB_URI
          resources:
            requests: { cpu: "25m", memory: 48Mi }
            limits:   { cpu: "100m", memory: 128Mi }
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: mongodb-data
        - name: keyfile-readonly
          secret:
            secretName: mongodb-keyfile
        - name: keyfile
          emptyDir: {}
        - name: init-script
          configMap:
            name: mongodb-init

---
# =============================================================================
# MongoDB PodDisruptionBudget
# =============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mongodb
  labels:
    app: mongodb
spec:
  # 1-replica stateful pod: maxUnavailable:1 lets node drains/Karpenter consolidation evict it
  # (a minAvailable:1 PDB on a single-replica pod would block every drain forever).
  maxUnavailable: 1
  selector:
    matchLabels:
      app: mongodb

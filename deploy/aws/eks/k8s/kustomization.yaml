# =============================================================================
# EKS Auto Mode — standalone manifests (kept separate from ec2/minikube).
# =============================================================================
# Self-contained: its own copy of every manifest, tuned for multi-node EKS
# (PVC storage instead of hostPath; ALB Ingress instead of the ec2 ALB→NodePort).
# Does NOT share a base with the ec2/minikube targets.
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pipeline-builder

resources:
  # EKS-specific
  - storageclasses.yaml      # pb-ebs (RWO) + pb-efs (RWX)
  # Core
  - namespace.yaml
  - networkpolicy.yaml
  - istio.yaml
  # Per-internal-route mesh policies + the waypoint that enforces them (#14).
  - istio-internal-routes.yaml
  - resource-limits.yaml
  # Data
  - mongodb.yaml
  - postgres.yaml
  - pgbouncer.yaml
  - redis-sentinel.yaml
  # Gateway + app
  - nginx.yaml
  - platform.yaml
  - pipeline.yaml
  - plugin.yaml
  - message.yaml
  - reporting.yaml
  - ask.yaml
  - ask-model.yaml  # self-hosted model (Ollama) backing the Ask assistant
  - quota.yaml
  - billing.yaml
  - compliance.yaml
  - frontend.yaml
  # Admin tools
  - mongo-express.yaml
  - pgadmin.yaml
  - grafana.yaml   # dashboards over prometheus/thanos/loki/jaeger (LEAN drops it)
  - kiali.yaml     # istio mesh console — L4-only under ambient (LEAN drops it)
  # In-cluster registry
  - minio.yaml
  - registry.yaml
  - image-registry.yaml
  # Observability
  - prometheus.yaml
  - thanos-query.yaml
  - thanos-compact.yaml
  - alertmanager.yaml
  - loki.yaml
  - promtail.yaml
  - jaeger.yaml
  # External entrypoint (ALB)
  - ingress.yaml

# Storage: postgres/mongodb/prometheus/pgadmin/minio/redis-sentinel → pb-ebs (RWO);
# alertmanager → pb-efs (RWX); registry → stateless (blobs in MinIO/S3);
# loki → emptyDir WAL/cache (durable chunks+index in MinIO/S3); plugin builds+uploads → emptyDir.
#
# NetworkPolicy: networkpolicy.yaml (standard k8s NetworkPolicy) is the active set —
# VPC CNI (Auto Mode) enforces it. cilium-network-policies.yaml is intentionally NOT
# included: its FQDN/per-org egress allow-listing needs Cilium as the CNI (inert under
# VPC CNI). See those files' headers for the full VPC-CNI-vs-Cilium reconciliation.

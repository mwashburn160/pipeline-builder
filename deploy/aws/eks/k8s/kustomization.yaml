# =============================================================================
# EKS Auto Mode — standalone manifests (kept separate from ec2/minikube).
# =============================================================================
# Self-contained: its own copy of every manifest, tuned for multi-node EKS
# (PVC storage instead of hostPath; ALB Ingress instead of the ec2 ALB→NodePort).
# Does NOT share a base with the ec2/minikube targets.
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pipeline-builder

resources:
  # EKS-specific
  - storageclasses.yaml      # pb-ebs (RWO) + pb-efs (RWX)
  # Core
  - namespace.yaml
  - networkpolicy.yaml
  - istio.yaml
  # Per-internal-route mesh policies + the waypoint that enforces them.
  - istio-internal-routes.yaml
  - resource-limits.yaml
  # Data
  - mongodb.yaml
  - postgres.yaml
  - pgbouncer.yaml
  - redis-sentinel.yaml
  # Gateway + app
  - nginx.yaml
  - platform.yaml
  - pipeline.yaml
  - plugin.yaml
  # Isolated buildkitd for anonymous plugin submissions.
  - plugin-quarantine-builder.yaml
  - message.yaml
  - reporting.yaml
  - ask.yaml
  - ask-model.yaml  # self-hosted model (Ollama) backing the Ask assistant
  # Scales ask-model to 0 outside the ASK_SCHEDULE_* window (default Mon-Fri
  # 07:45-17:00 UTC), letting Karpenter deprovision the GPU node — the biggest
  # line in the bill.
  - ask-model-schedule.yaml
  - quota.yaml
  - billing.yaml
  - compliance.yaml
  - frontend.yaml
  # Admin tools
  - mongo-express.yaml
  - pgadmin.yaml
  - grafana.yaml   # dashboards over prometheus/thanos/loki/jaeger
  - kiali.yaml     # istio mesh console — L4-only under ambient
  # In-cluster registry
  - rustfs.yaml
  - rustfs-console.yaml   # the console Service only (the UI half of rustfs.yaml)
  - registry.yaml
  - image-registry.yaml
  # Observability
  - prometheus.yaml
  # Cluster OBJECT state as metrics — the only way to alert on a CronJob
  # that failed or stopped being scheduled. Namespace-scoped (a Role, not a
  # ClusterRole); see the file header.
  - kube-state-metrics.yaml
  # The nightly database backup. Applied through the normal path so its
  # BACKUP_* tokens get substituted, and SUSPENDED unless BACKUP_ENABLED=true
  # (the image has to be built first). ec2 used to schedule this a second
  # way, from a host systemd timer at a different time; this is now the only
  # cron on both AWS targets.
  - backup-cronjob.yaml
  - pushgateway.yaml
  - thanos-query.yaml
  - thanos-compact.yaml
  - alertmanager.yaml
  - loki.yaml
  - promtail.yaml
  - jaeger.yaml
  # External entrypoint (ALB)
  - ingress.yaml

# Storage: postgres/mongodb/prometheus/grafana/pgadmin/ask-model/rustfs/redis-sentinel → pb-ebs (RWO);
# alertmanager → pb-efs (RWX); registry → stateless (blobs in RustFS/S3);
# loki → emptyDir WAL/cache (durable chunks+index in RustFS/S3); plugin builds+uploads → emptyDir.
#
# NetworkPolicy: networkpolicy.yaml (standard k8s NetworkPolicy) is the active set —
# VPC CNI (Auto Mode) enforces it. cilium-network-policies.yaml is intentionally NOT
# included: its FQDN/per-org egress allow-listing needs Cilium as the CNI (inert under
# VPC CNI). See those files' headers for the full VPC-CNI-vs-Cilium reconciliation.

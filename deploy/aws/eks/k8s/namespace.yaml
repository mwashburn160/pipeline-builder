apiVersion: v1
kind: Namespace
metadata:
  name: pipeline-builder
  labels:
    app.kubernetes.io/part-of: pipeline-builder
    # Enroll the namespace in the Istio ambient data plane (see istio.yaml +
    # docs/service-mesh.md). On EKS Auto Mode, AWS recommends ambient; ztunnel
    # enforces STRICT mTLS + AuthorizationPolicy across the managed nodes.
    istio.io/dataplane-mode: ambient
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: pipeline-builder
  labels:
    app.kubernetes.io/part-of: pipeline-builder

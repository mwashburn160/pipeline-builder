---
# =============================================================================
# Pipeline Image Registry Service
#
# Hosts:
#   - GET /token        Docker Distribution token-auth issuer
#   - /api/images/*     JWT-authenticated catalog/delete/tag-copy API
#
# The underlying registry (registry.yaml) delegates auth to /token via its
# REGISTRY_AUTH_TOKEN_REALM. The same JWT signing keypair (registry-token-secret)
# is mounted here for issuing and on the registry for verifying.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: image-registry
  labels:
    app: image-registry
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: image-registry

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-registry
  labels:
    app: image-registry
    app.kubernetes.io/component: backend
spec:
  # Start at 2 so the first rollout already satisfies the PDB; the HPA below
  # owns the count from then on.
  #
  # The old "start at 1" note here was inherited from the single-node targets,
  # where two replicas pulling the same ~250MB image at boot saturate one gp3
  # volume's baseline throughput and stall every other pod's image pull. On EKS
  # the replicas land on different nodes, each with its own EBS volume and its
  # own image cache, so that contention does not arise. ec2/minikube keep the
  # single replica — see their copies of this file.
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: image-registry
  template:
    metadata:
      labels:
        app: image-registry
        app.kubernetes.io/component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: image-registry
      # Stateless API server — no need for the default ServiceAccount token
      # mounted at /var/run/secrets/kubernetes.io/serviceaccount/. Reduces blast
      # radius if the container is compromised (no kubelet API access).
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: image-registry
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-for-registry
          image: busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616  # busybox:1.38
          resources:
            limits:
              cpu: "100m"
              memory: 64Mi
            requests:
              cpu: "50m"
              memory: 32Mi
          command:
            - sh
            - -c
            - |
              echo "Waiting for registry..."
              until nc -z registry 5000; do sleep 3; done
              echo "Registry ready"
      containers:
        - name: image-registry
          image: ghcr.io/mwashburn160/image-registry:4.1.7
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: app-env
            # Credentials (DB_PASSWORD, MONGODB_URI, API keys, …) split out of app-env.
            - secretRef:
                name: app-secrets
            - secretRef:
                # IMAGE_REGISTRY_USERNAME / IMAGE_REGISTRY_PASSWORD —
                # Basic auth used when image-registry talks to the
                # underlying registry's management API.
                name: image-registry-build-svc-secret
          env:
            - name: SERVICE_NAME
              value: "image-registry"
            - name: PORT
              value: "3000"
            # Underlying registry the proxy + management API talks to.
            - name: IMAGE_REGISTRY_HOST
              value: "registry"
            - name: IMAGE_REGISTRY_PORT
              value: "5000"
            # Registry serves plain HTTP on its in-cluster ClusterIP svc;
            # nginx fronts it on HTTPS externally. See registry.yaml.
            - name: IMAGE_REGISTRY_HTTP
              value: "true"
            - name: IMAGE_REGISTRY_INSECURE
              value: "true"
            # Token signing — keypair shared with registry. Files mounted
            # below; xxx_FILE convention loads them via fs.readFile in config.
            - name: REGISTRY_TOKEN_PRIVATE_KEY_FILE
              value: "/etc/registry/jwt-private.pem"
            - name: REGISTRY_TOKEN_CERTIFICATE_FILE
              value: "/etc/registry/jwt-public.pem"
            - name: REGISTRY_TOKEN_ISSUER
              value: "platform"
            - name: REGISTRY_TOKEN_SERVICE
              value: "pipeline-image-registry"
            - name: REGISTRY_TOKEN_EXPIRES_IN
              value: "300"
            # IMAGE_REGISTRY_USERNAME / IMAGE_REGISTRY_PASSWORD come from
            # the image-registry-build-svc-secret envFrom above. Same creds
            # as the registry container's htpasswd; startup.sh keeps them
            # in sync.
          volumeMounts:
            # This pod's OWN internal-token signing key (#14) and the PUBLIC
            # bundle it verifies its peers with. One private key per pod — that
            # is what stops a compromised service signing as another — while the
            # bundle is public and identical everywhere. Both from
            # deploy/bin/service-signing-keys.sh; the service refuses to start
            # without them.
            - name: service-signing-key
              mountPath: /etc/pipeline-builder/service-keys
              readOnly: true
            - name: service-key-bundle
              mountPath: /etc/pipeline-builder/service-key-bundle
              readOnly: true
            - name: registry-token
              mountPath: /etc/registry/jwt-private.pem
              subPath: jwt-private.pem
              readOnly: true
            - name: registry-token
              mountPath: /etc/registry/jwt-public.pem
              subPath: jwt-public.pem
              readOnly: true
          resources:
            limits:
              cpu: "500m"
              memory: 384Mi
            requests:
              cpu: "250m"
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
      volumes:
        - name: service-signing-key
          secret:
            secretName: service-key-image-registry
            defaultMode: 0444
        - name: service-key-bundle
          secret:
            secretName: service-key-bundle
            defaultMode: 0444
        - name: registry-token
          secret:
            # Same secret mounted into the registry; here we mount BOTH
            # the public cert (for cross-checking the registry's bundle)
            # and the private key (for signing).
            secretName: registry-token-secret
            items:
              - key: jwt-public.pem
                path: jwt-public.pem
              - key: jwt-private.pem
                path: jwt-private.pem
---
# =============================================================================
# Image Registry HorizontalPodAutoscaler
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: image-registry
  labels:
    app: image-registry
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: image-registry
  # 2 on this target: EKS is MULTI-NODE, so a second replica is a real
  # availability gain (different node, different AZ) and — with the
  # `minAvailable: 1` PodDisruptionBudget below — it is what lets a node drain
  # finish at all. At one replica that PDB is a deadlock: Auto Mode recycles
  # nodes routinely, and evicting the only pod would break the budget, so the
  # drain blocks until it is force-terminated. The HPA still scales further on
  # load. (ec2/minikube stay at 1 — single-node clusters, nothing to drain.)
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
    # Memory metric — added alongside CPU so the HPA scales on whichever
    # signal demands more replicas. 85% chosen to leave headroom for spikes
    # (memory usually climbs slower than CPU; premature scale-up wastes
    # resources). Matches the plugin ScaledObject's memory trigger.
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 85
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300

---
# =============================================================================
# Image Registry PodDisruptionBudget
# =============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: image-registry
  labels:
    app: image-registry
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: image-registry

# =============================================================================
# ask-model business-hours schedule (EKS) — scale the GPU down out of hours
# =============================================================================
# WHY, on this target. `ask-model` holds a GPU node for its own exclusive use
# (nodeSelector + taint toleration in ask-model.yaml) and keeps the model
# resident (OLLAMA_KEEP_ALIVE=24h), so the node never scales to zero on its
# own: a g4dn.xlarge is ~$0.53/hr, about $384/month at 24/7 — the single
# largest line in this cluster's bill. Scaling the Deployment to 0 lets
# Karpenter deprovision the node, so the window is a REAL dollar saving here.
# The default Mon-Fri 07:45-17:00 window is 201 h/month against 730, so
# ~$106/month. Every day instead of weekdays is 281 h, ~$148.
#
# ALL TIMES ARE UTC. CronJob has no timezone and this file sets none, so the
# values below are UTC regardless of where the operator or the cluster sits.
# 08:00 UTC is 03:00 US Eastern and 09:00 London — if the intended window is
# local, convert it when setting the variables; the cluster will not.
#
# CONFIGURED FROM .env, not here:
#
#   ASK_SCHEDULE_ENABLED=true        # false applies both CronJobs SUSPENDED
#   ASK_SCHEDULE_UP="45 7 * * 1-5"     # scale to 1
#   ASK_SCHEDULE_DOWN="0 17 * * 1-5"   # scale to 0
#
# `${…}` below are deploy tokens expanded by pb_apply_manifests' sed, exactly
# like ${DOMAIN} and ${BUILDKIT_MEMORY_LIMIT} elsewhere in this tree — the
# values are resolved and VALIDATED by pb_ask_schedule_env (deploy/bin/
# k8s-resources.sh), which also inverts ENABLED into `suspend`. These three
# are not container env vars and could not be: `schedule` and `suspend` are
# CronJob spec fields, so no ConfigMap or Secret can reach them.
#
# WEEKENDS ARE OFF BY DEFAULT (the `1-5` day field). Running every day instead
# is a .env edit, not a manifest edit — set both day fields to `*` — and costs
# ~$148/month against ~$106.
#
# THE UP JOB DEFAULTS TO 07:45, NOT 08:00. Scaling to 1 does not make Ask
# usable: Karpenter must provision a GPU node (measured ~5 minutes on this
# cluster, including the EBS attach) and ollama then loads ~5GB into VRAM
# (~36s, absorbed by the container's own warm-up before the pod reports Ready).
# Starting at 08:00 would mean Ask answering from roughly 08:06. The fifteen
# minutes costs about $2/month and is what makes "runs between 8 and 5" true.
#
# WHAT HAPPENS OUTSIDE THE WINDOW. `ask-model` has zero replicas, so the `ask`
# service's model calls FAIL — they do not queue, and nothing wakes the model on
# demand. `ask` itself stays up and its non-model routes keep working. If
# out-of-hours use matters, this schedule is the wrong mechanism and a
# scale-from-zero proxy is the right one.
#
# The failure is EXPLAINED rather than raw: ask reads the three variables below
# (they reach the pod through the app-env ConfigMap) and answers 503 with "runs
# 07:45-17:00 UTC and is switched off right now" instead of leaking
# `AI_APICallError: Cannot connect to API: other side closed`. See
# api/ask/src/services/model-window.ts — it only speaks when the self-hosted
# provider failed to CONNECT and a schedule is configured, so a cloud
# provider's outage is never blamed on this window.
#
# A DEPLOY INSIDE THE OFF-WINDOW NO LONGER TURNS THE GPU BACK ON. ask-model.yaml
# deliberately declares no `replicas`, so `kubectl apply` leaves the current
# count alone (and defaults to 1 only on first create) — see the note there.
# With replicas pinned, any setup.sh/startup.sh run at 02:00 UTC re-applied
# `replicas: 1`, provisioned a GPU node, and held it until 17:00.
#
# NOT ALERTED, and worth knowing: with no kube-state-metrics in this tree
# nothing observes a FAILED up-job, so if the GPU cannot be provisioned (no
# capacity, a vCPU quota) Ask is simply unavailable for the day and the only
# signal is a user asking a question. `kubectl -n pipeline-builder get job` is
# the manual check; the CronJobs keep 3 failed jobs for exactly that.
#
# Least privilege: the Role below can scale exactly one Deployment by name. It
# cannot read a Secret, touch another workload, or see outside this namespace —
# a scheduler should not be able to do more than schedule.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ask-model-scaler
  namespace: pipeline-builder
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ask-model-scaler
  namespace: pipeline-builder
rules:
  # `resourceNames` is the whole point: scale/get on ONE deployment. Verified
  # sufficient by running the up-job against the live cluster — it scaled with
  # nothing else granted.
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    resourceNames: ["ask-model"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ask-model-scaler
  namespace: pipeline-builder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ask-model-scaler
subjects:
  - kind: ServiceAccount
    name: ask-model-scaler
    namespace: pipeline-builder
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ask-model-up
  namespace: pipeline-builder
  labels:
    app: ask-model-scaler
    app.kubernetes.io/part-of: pipeline-builder
spec:
  schedule: "${ASK_SCHEDULE_UP}"
  suspend: ${ASK_SCHEDULE_SUSPEND}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: ask-model-scaler
        spec:
          serviceAccountName: ask-model-scaler
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          containers:
            - name: scale
              image: registry.k8s.io/kubectl@sha256:0667e3f3e6ef435d7cd4c16684244703ebd67314c17511c2a9f87ea44f6cdf6b  # kubectl:v1.36.5
              args: ["scale", "deployment/ask-model", "--replicas=1", "-n", "pipeline-builder"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: "10m", memory: "32Mi" }
                limits: { cpu: "100m", memory: "64Mi" }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ask-model-down
  namespace: pipeline-builder
  labels:
    app: ask-model-scaler
    app.kubernetes.io/part-of: pipeline-builder
spec:
  schedule: "${ASK_SCHEDULE_DOWN}"
  suspend: ${ASK_SCHEDULE_SUSPEND}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: ask-model-scaler
        spec:
          serviceAccountName: ask-model-scaler
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          containers:
            - name: scale
              image: registry.k8s.io/kubectl@sha256:0667e3f3e6ef435d7cd4c16684244703ebd67314c17511c2a9f87ea44f6cdf6b  # kubectl:v1.36.5
              args: ["scale", "deployment/ask-model", "--replicas=0", "-n", "pipeline-builder"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: "10m", memory: "32Mi" }
                limits: { cpu: "100m", memory: "64Mi" }

---
# =============================================================================
# Istio ambient service mesh — mTLS + identity-based L4 authorization (eks)
# =============================================================================
# EKS Auto Mode + Istio ambient (AWS-recommended). Same policy model as
# deploy/local/minikube/k8s/istio.yaml (see it + docs/service-mesh.md). The
# Auto-Mode/multi-node install specifics (istio-cni tolerations, HA istiod, node
# SG :15008) live in bin/setup.sh, not here — these policies are node-agnostic.
# eks deltas vs local:
#   - nginx external carve-out is port 8080 only (the ALB terminates TLS and
#     forwards plain HTTP to the nginx NodePort; there is no 8443 listener).
#   - Redis runs as Sentinel HA (redis-sentinel.yaml): clients reach
#     redis-sentinel:26379 for master discovery and redis:6379 for data, so both
#     get AuthorizationPolicies and both `redis` + `redis-sentinel` identities are
#     allowed (replication + gossip).
#   - Per-org (`pb-org-*`) enterprise namespaces run build pods under
#     sa/org-workload — allowed to the registry + image-registry build path via a
#     namespace wildcard so STRICT doesn't 403 them.
# =============================================================================

# -- PeerAuthentication -------------------------------------------------------
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: pipeline-builder
spec:
  mtls:
    mode: STRICT
---
# nginx ingress: the ALB (non-mesh) forwards plain HTTP to nginx:8080 and health-
# checks :8080/health. Carve that port out of STRICT; nginx->upstream stays STRICT.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: nginx-ingress
  namespace: pipeline-builder
spec:
  selector:
    matchLabels:
      app: nginx
  mtls:
    mode: STRICT
  portLevelMtls:
    "8080":
      mode: PERMISSIVE
---
# KEDA (in the `keda` namespace, non-mesh) scrapes prometheus:9090 for the plugin
# ScaledObject. Port-level PERMISSIVE keeps that working; in-mesh reads stay mTLS.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: prometheus-keda
  namespace: pipeline-builder
spec:
  selector:
    matchLabels:
      app: prometheus
  mtls:
    mode: STRICT
  portLevelMtls:
    "9090":
      mode: PERMISSIVE
---

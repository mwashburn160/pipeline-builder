              - cluster.local/ns/pipeline-builder/sa/platform
              - cluster.local/ns/pipeline-builder/sa/billing
              - cluster.local/ns/pipeline-builder/sa/compliance
              - cluster.local/ns/pipeline-builder/sa/pipeline
              - cluster.local/ns/pipeline-builder/sa/plugin

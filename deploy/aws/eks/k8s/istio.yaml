---
# The db-backup CronJob (backup/backup-cronjob.yaml) already defines its own SA;
# it is listed in the postgres/mongodb/minio allow-lists below. (SA object lives
# in backup-cronjob.yaml, so it is not recreated here.)
# -- AuthorizationPolicy: datastores (AUTHORITATIVE) -------------------------
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: postgres-allow
  namespace: pipeline-builder
spec:
  selector:
    matchLabels:
      app: postgres
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/pipeline-builder/sa/platform
              - cluster.local/ns/pipeline-builder/sa/pipeline
              - cluster.local/ns/pipeline-builder/sa/plugin
              - cluster.local/ns/pipeline-builder/sa/message
              - cluster.local/ns/pipeline-builder/sa/compliance
              - cluster.local/ns/pipeline-builder/sa/reporting
              - cluster.local/ns/pipeline-builder/sa/pgbouncer
              - cluster.local/ns/pipeline-builder/sa/pgadmin
              - cluster.local/ns/pipeline-builder/sa/db-backup
      to:
        - operation:
            ports: ["5432"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: pgbouncer-allow
  namespace: pipeline-builder
spec:
  selector:
    matchLabels:
      app: pgbouncer
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/pipeline-builder/sa/platform
              - cluster.local/ns/pipeline-builder/sa/pipeline
              - cluster.local/ns/pipeline-builder/sa/plugin
              - cluster.local/ns/pipeline-builder/sa/message
              - cluster.local/ns/pipeline-builder/sa/compliance
              - cluster.local/ns/pipeline-builder/sa/reporting
      to:
        - operation:
            ports: ["6432"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: mongodb-allow
  namespace: pipeline-builder
spec:
  selector:
    matchLabels:
      app: mongodb
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/pipeline-builder/sa/platform
              - cluster.local/ns/pipeline-builder/sa/quota
              - cluster.local/ns/pipeline-builder/sa/billing
              - cluster.local/ns/pipeline-builder/sa/mongo-express
              - cluster.local/ns/pipeline-builder/sa/db-backup
              # mongod connects to ITSELF for replica-set (rs0) primary election;
              # without this the RS never elects a primary → ReplicaSetNoPrimary.
              - cluster.local/ns/pipeline-builder/sa/mongodb
      to:
        - operation:
            ports: ["27017"]
---
# Redis (Sentinel HA): clients reach redis:6379 for data; replication + Sentinel
# monitoring add `redis` + `redis-sentinel` as in-mesh peers.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: redis-allow
  namespace: pipeline-builder
spec:
  selector:
    matchLabels:
      app: redis
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/pipeline-builder/sa/platform
              - cluster.local/ns/pipeline-builder/sa/pipeline
              - cluster.local/ns/pipeline-builder/sa/plugin
              - cluster.local/ns/pipeline-builder/sa/message
              - cluster.local/ns/pipeline-builder/sa/quota
              - cluster.local/ns/pipeline-builder/sa/billing
              - cluster.local/ns/pipeline-builder/sa/compliance
              - cluster.local/ns/pipeline-builder/sa/reporting
              - cluster.local/ns/pipeline-builder/sa/image-registry
              - cluster.local/ns/pipeline-builder/sa/redis
              - cluster.local/ns/pipeline-builder/sa/redis-sentinel
      to:
        - operation:
            ports: ["6379"]
---
# Redis Sentinel: clients query :26379 for master discovery; Sentinels gossip
# among themselves and reach the redis data nodes.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: redis-sentinel-allow
  namespace: pipeline-builder
spec:
  selector:
    matchLabels:
      app: redis-sentinel
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/pipeline-builder/sa/platform
              - cluster.local/ns/pipeline-builder/sa/pipeline
              - cluster.local/ns/pipeline-builder/sa/plugin
              - cluster.local/ns/pipeline-builder/sa/message
              - cluster.local/ns/pipeline-builder/sa/quota
              - cluster.local/ns/pipeline-builder/sa/billing
              - cluster.local/ns/pipeline-builder/sa/compliance
              - cluster.local/ns/pipeline-builder/sa/reporting
              - cluster.local/ns/pipeline-builder/sa/image-registry
              - cluster.local/ns/pipeline-builder/sa/redis
              - cluster.local/ns/pipeline-builder/sa/redis-sentinel
      to:
        - operation:
            ports: ["26379"]
---
# Registry: `default` = crane push pods; `pb-org-*` = enterprise per-org build
# pods (sa/org-workload) pushing images.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: registry-allow
  namespace: pipeline-builder
spec:
  selector:
    matchLabels:
      app: registry
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/pipeline-builder/sa/image-registry
              - cluster.local/ns/pipeline-builder/sa/pipeline
              - cluster.local/ns/pipeline-builder/sa/plugin
              - cluster.local/ns/pipeline-builder/sa/nginx
              - cluster.local/ns/pipeline-builder/sa/default
      to:
        - operation:
            ports: ["5000"]
    - from:
        - source:
            namespaces: ["pb-org-*"]
      to:
        - operation:
            ports: ["5000"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: minio-allow
  namespace: pipeline-builder
spec:
  selector:
    matchLabels:
      app: minio
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/pipeline-builder/sa/message
              - cluster.local/ns/pipeline-builder/sa/registry
              - cluster.local/ns/pipeline-builder/sa/loki
              - cluster.local/ns/pipeline-builder/sa/prometheus
              - cluster.local/ns/pipeline-builder/sa/thanos-store-gateway
              - cluster.local/ns/pipeline-builder/sa/default
              - cluster.local/ns/pipeline-builder/sa/db-backup
      to:
        - operation:
            ports: ["9000"]
---
# -- AuthorizationPolicy: app APIs (each lists nginx + prometheus + callers) --

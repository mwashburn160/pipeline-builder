# =============================================================================
# EKS Auto Mode cluster for Pipeline Builder
# =============================================================================
#   eksctl create cluster -f cluster.yaml
#
# Auto Mode = AWS manages the data plane: it provisions/scales EC2 nodes
# (Karpenter), and bundles the AWS Load Balancer Controller, the EBS CSI driver,
# and CoreDNS. There are no managed node groups to define here.
#
# NOTE: `${...}` tokens are substituted by bin/setup.sh (envsubst) before apply.
# `${EKS_VERSION}` is set by setup.sh — default 1.36; override with `--eks-version X`, or
# pass `--eks-version latest` to resolve the newest version EKS offers. Auto Mode requires ≥ 1.29.
# =============================================================================
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: ${CLUSTER_NAME}        # default: pipeline-builder
  region: ${REGION}            # default: us-east-1
  version: "${EKS_VERSION}"    # set by setup.sh (default 1.36; --eks-version X / latest)
  tags:
    Project: pipeline-builder

# IRSA / Pod Identity for the AWS integrations (SES, S3, the EFS CSI driver).
iam:
  withOIDC: true

# AWS-managed data plane (nodes + core addons).
#
# `general-purpose` is DELIBERATELY DISABLED — only `system` stays built-in.
# Neither built-in pool can carry a `limits` block (they are not editable, only
# on/off), so an Auto Mode cluster with general-purpose enabled has no ceiling on
# the EC2 capacity Karpenter will buy. Ordinary workloads instead land on the
# custom NodePool in cluster/nodepool.yaml, which does have limits.
#
# Keeping `system` on is load-bearing, not incidental: enabling at least one
# built-in pool is what makes EKS provision the `default` NodeClass, which
# setup.sh copies into the `pipeline-builder` NodeClass (cluster/nodeclass.yaml:
# same role/subnets/SGs + NetworkPolicy enforcement) that nodepool.yaml
# references — so no node IAM role or EKS access entry of our own is needed.
# `system` also carries the CriticalAddonsOnly
# taint, so it hosts CoreDNS et al. without becoming an unbounded escape hatch
# for platform workloads.
#
# Consequence to know: with general-purpose off, NOTHING schedules until
# nodepool.yaml is applied — bin/setup.sh does that in Phase 1b, before any
# workload. Removing a built-in pool name here also DELETES that NodePool from
# the cluster and drains its nodes, so flipping this on an existing cluster is a
# rolling replacement, not a no-op.
autoModeConfig:
  enabled: true
  nodePools: ["system"]

# Addons are deliberately NOT declared here — see cluster/addons.yaml, which
# bin/setup.sh applies AFTER the custom NodePool exists. `eksctl create cluster`
# installs any addon in this file during cluster creation, which is before there
# is any pool an ordinary pod can land on (general-purpose is disabled above), so
# the EFS CSI controller would be created into a cluster with nowhere to schedule
# it. Splitting the two makes that ordering explicit instead of depending on
# whether a given addon happens to tolerate CriticalAddonsOnly.

# VPC: omit to let eksctl create a dedicated VPC, or pin an existing one here to
# match the platform's networking (private subnets + NAT for image pulls).
# vpc:
#   id: vpc-xxxx
#   subnets:
#     private: { ... }

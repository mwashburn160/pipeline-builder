# Alert rules for Pipeline Builder.
#
# Loaded by Prometheus via `rule_files` in prometheus.yml; firing alerts
# are forwarded to Alertmanager which routes by `severity` AND `tenancy`.
#
# Conventions:
# - `severity: critical` — pages on-call (Slack #ops-pager + future PD)
# - `severity: warning`  — non-paging Slack notification
# - `tenancy: org`       — alert carries an `org_id` label; relayed to that
#                          org's configured destinations (Slack webhook,
#                          in-app message, …) via the platform's webhook
#                          relay (POST /api/observability/alert-webhook).
# - `tenancy: platform`  — alert is platform-wide (no org_id, or the
#                          underlying metric isn't org-labeled); routed
#                          to the ops-team Slack channels.
# - `summary` is what shows in Slack; `description` adds detail.

groups:
  # Per-org rules — every firing alert carries an `org_id` label and is routed
  # to that org's notification destination(s) by the platform's alert-relay.
  # These rules `by (org_id)` the underlying counters; the receiver-side
  # alertmanager.yml uses `tenancy=org` to differentiate from platform alerts.
  - name: per-org
    rules:
      # operational follow-on: per-tenant Loki rate-cap breach.
      # Fires when Loki's distributor rejects log lines for a tenant
      # because they exceed the tenant's `ingestion_rate_mb` cap (set
      # via the `limits_config` block in loki-config.yml). Operators
      # should bump the limit before users notice missing logs. The
      # `tenant` label maps to the org's
      # uuid (set via promtail's `tenant` stage / fluent-bit's
      # `Tenant_ID_Key`); `org_id` is set equal to it via `label_replace`
      # so the per-org routing in alertmanager picks it up the same way
      # as the build-failure alert.
      - alert: LokiRateCapBreach
        expr: |
          label_replace(
            sum by (tenant) (rate(loki_discarded_samples_total{reason="rate_limited", tenant!="system"}[5m])) > 0,
            "org_id", "$1", "tenant", "(.+)"
          )
        for: 5m
        labels:
          severity: warning
          component: loki
          tenancy: org
        annotations:
          summary: "Loki dropping logs for org {{ $labels.org_id }} (rate cap breached)"
          description: "Loki rejected {{ $value | humanize }} lines/sec for the last 5 minutes. Bump the org's `ingestion_rate_mb` in loki-config.yml `limits_config`."

      - alert: PluginBuildFailureRateHigh
        # Per-org success-rate aggregation. `by (org_id)` produces one
        # series per org; alerts fire per org and carry that org_id label
        # which the relay routes on.
        expr: |
          (
            sum by (org_id) (rate(plugin_builds_total{status="success",org_id=~".+"}[5m]))
            /
            clamp_min(sum by (org_id) (rate(plugin_builds_total{org_id=~".+"}[5m])), 1)
          ) < 0.9
        for: 10m
        labels:
          severity: warning
          component: plugin
          tenancy: org
        annotations:
          summary: "Plugin build success rate below 90% for org {{ $labels.org_id }}"
          description: "5-min success rate is {{ $value | humanizePercentage }} over the last 10 minutes."

      # ---- Pipeline deploy / stage failures (DORA events, Phase 3b) ----
      # Fed by the reporting service's ingest metrics (scraped from the
      # reporting pod). `pipeline_deploy_result_total` is incremented per
      # deploy-stage execution the forwarder marks with an `environment`
      # (derived from the pipeline's `pb.deploys` tag); `result` is
      # succeeded|failed. `pipeline_stage_result_total` is the same, one
      # series per (pipeline, stage, environment).
      - alert: PipelineDeployFailed
        # A `production` deploy stage failed. This is the DORA headline signal
        # (deploy-time change failure), so it pages rather than warns. `increase`
        # over 5m fires on any new failure; `by (org_id)` routes to the org and
        # keeps one series per tenant.
        expr: |
          sum by (org_id) (increase(pipeline_deploy_result_total{environment="production",result="failed",org_id=~".+"}[5m])) > 0
        for: 0m
        labels:
          severity: critical
          component: pipeline
          tenancy: org
        annotations:
          summary: "Production deploy failed for org {{ $labels.org_id }}"
          description: "{{ $value | humanize }} production deploy-stage failure(s) in the last 5 minutes. Check the pipeline's deploy stage in CodePipeline."

      - alert: PipelineStageFailureRateHigh
        # Per-org stage success-rate aggregation across ALL stages (not just
        # deploys), mirroring PluginBuildFailureRateHigh. `by (org_id)` produces
        # one series per org; alerts fire per org and carry that org_id for
        # relay routing. Warns rather than pages — a broad-but-not-outage signal.
        expr: |
          (
            sum by (org_id) (rate(pipeline_stage_result_total{result="succeeded",org_id=~".+"}[5m]))
            /
            clamp_min(sum by (org_id) (rate(pipeline_stage_result_total{org_id=~".+"}[5m])), 1)
          ) < 0.9
        for: 10m
        labels:
          severity: warning
          component: pipeline
          tenancy: org
        annotations:
          summary: "Pipeline stage success rate below 90% for org {{ $labels.org_id }}"
          description: "5-min stage success rate is {{ $value | humanizePercentage }} over the last 10 minutes — inspect recent pipeline executions."

      # per-plugin variants of the org-wide alert above. The
      # `plugin_builds_total` counter carries `plugin_name` so groupings
      # `by (org_id, plugin_name)` produce one series per (org, plugin)
      # pair without a metric change. Thresholds are stricter than the
      # org-wide rules (80% vs 90% success, 25% timeout share) — a single
      # plugin going bad shouldn't have to drag the org's overall rate
      # under 90% before paging. Floor of `rate > 0.01` (≥3 builds per
      # 5min) prevents firing on plugins with only one or two builds
      # where a single failure trivially crosses the percentage gate.
      - alert: PluginBuildFailureRateHighPerPlugin
        expr: |
          (
            sum by (org_id, plugin_name) (rate(plugin_builds_total{status="success",org_id=~".+",plugin_name=~".+"}[5m]))
            /
            clamp_min(sum by (org_id, plugin_name) (rate(plugin_builds_total{org_id=~".+",plugin_name=~".+"}[5m])), 1)
          ) < 0.8
          and
          sum by (org_id, plugin_name) (rate(plugin_builds_total{org_id=~".+",plugin_name=~".+"}[5m])) > 0.01
        for: 15m
        labels:
          severity: warning
          component: plugin
          tenancy: org
        annotations:
          summary: "Plugin {{ $labels.plugin_name }} success rate below 80% for org {{ $labels.org_id }}"
          description: "Per-plugin 5-min success rate is {{ $value | humanizePercentage }} over the last 15 minutes — check plugin source or build environment."

      - alert: PluginBuildTimeoutRateHighPerPlugin
        # Most often a regression in the plugin's build script or a
        # dependency that's now resolving slowly. Same activity floor as
        # the failure-rate variant.
        expr: |
          (
            sum by (org_id, plugin_name) (rate(plugin_builds_total{status="timeout",org_id=~".+",plugin_name=~".+"}[5m]))
            /
            clamp_min(sum by (org_id, plugin_name) (rate(plugin_builds_total{org_id=~".+",plugin_name=~".+"}[5m])), 1)
          ) > 0.25
          and
          sum by (org_id, plugin_name) (rate(plugin_builds_total{org_id=~".+",plugin_name=~".+"}[5m])) > 0.01
        for: 15m
        labels:
          severity: warning
          component: plugin
          tenancy: org
        annotations:
          summary: "Plugin {{ $labels.plugin_name }} timing out for org {{ $labels.org_id }}"
          description: "{{ $value | humanizePercentage }} of recent builds timed out — check build complexity or dependency resolution times."

  # Platform-wide rules — metrics that aren't org-labeled (shared queue,
  # shared registry). Routed to the ops-team Slack channels.
  - name: platform-wide
    rules:
      # ---- Liveness ----
      # The blind spot every other rule shares: they all need the service to be
      # UP ENOUGH to emit the metric they alert on. ServiceError5xxBurst needs it
      # serving 5xx; QuotaServiceFailOpenSustained needs it reporting fail-opens.
      # A pod that is crashlooping, OOM-killed, hung, or unreachable emits
      # nothing at all — and so tripped nothing at all until this rule existed.
      #
      # SCOPE, stated honestly: `up == 0` means "discovered by Kubernetes SD but
      # the scrape failed". It does NOT catch a workload scaled to zero or whose
      # pods are all deleted, because the series then disappears rather than
      # going to 0 — detecting absence needs per-service `absent()` rules or
      # kube-state-metrics. The covered case is the one that happens by accident;
      # the uncovered one is usually deliberate.
      #
      # Prometheus cannot alert on its own death either. If that matters, pair
      # this with an always-firing watchdog alert and an external check on
      # Alertmanager, so silence itself becomes a signal.
      - alert: ServiceDown
        expr: up{job="kubernetes-pods"} == 0
        for: 5m
        labels:
          severity: critical
          component: platform
          tenancy: platform
        annotations:
          summary: "{{ $labels.service }} is not responding to scrapes"
          description: "Prometheus has failed to scrape {{ $labels.service }} (pod {{ $labels.pod }}) for 5m. The pod exists but is unreachable — crashloop, OOM, or a hung process. Check: kubectl get pods -n pipeline-builder | grep {{ $labels.service }}"

      # ---- Datastores ----
      # These complement ServiceDown rather than duplicating it. ServiceDown
      # fires when the scrape itself fails (pod gone/hung). These fire when the
      # exporter is HEALTHY AND REPORTING but cannot reach the datastore behind
      # it — a hung or wedged database in a running pod, a rejected credential,
      # or a filled disk. From the outside those look identical to healthy;
      # `up` is 1 the whole time.
      #
      # Metric names verified against the exporter binaries themselves rather
      # than assumed from docs: pg_up, mongodb_up and redis_up are what
      # postgres-exporter v0.17.1, mongodb_exporter 0.44.0 and redis_exporter
      # v1.69.0 actually emit when their target is unreachable.
      - alert: PostgresUnreachable
        expr: pg_up == 0
        for: 3m
        labels:
          severity: critical
          component: postgres
          tenancy: platform
        annotations:
          summary: "Postgres is not answering its exporter"
          description: "postgres-exporter has been unable to query Postgres for 3m while its own pod is healthy. Postgres is the single-primary data tier — every service loses writes. Check: kubectl logs -n pipeline-builder deploy/postgres"

      - alert: MongoDBUnreachable
        expr: mongodb_up == 0
        for: 3m
        labels:
          severity: critical
          component: mongodb
          tenancy: platform
        annotations:
          summary: "MongoDB is not answering its exporter"
          description: "mongodb-exporter has been unable to query MongoDB for 3m. Audit, billing and quota records are unavailable. Check: kubectl logs -n pipeline-builder deploy/mongodb"

      - alert: RedisUnreachable
        expr: redis_up == 0
        for: 3m
        labels:
          severity: critical
          component: redis
          tenancy: platform
        annotations:
          summary: "Redis instance {{ $labels.pod }} is not answering its exporter"
          description: "redis-exporter cannot reach Redis for 3m. This is per-pod: on the AWS targets a single member failing is survivable via Sentinel, but losing quorum is not. BullMQ plugin builds and the audit spool both depend on it."

      # ---- Queue ----
      - alert: PluginQueueStalled
        expr: sum(plugin_queue_jobs{state="waiting"}) > 50
        for: 15m
        labels:
          severity: warning
          component: plugin
          tenancy: platform
        annotations:
          summary: "Plugin build queue depth above 50"
          description: "{{ $value }} jobs waiting for 15+ minutes — check worker health."

      - alert: PluginVulnRescanStale
        # The nightly vulnerability rescan (W0.6) exports the epoch of its last
        # COMPLETED pass from every plugin pod. Stale for 36h ⇒ passes are failing
        # (usually the grype DB refresh) or the leader-locked scheduler stopped,
        # and scan facts compliance evaluates are going out of date. Absent when
        # PLUGIN_RESCAN_ENABLED=false, so nothing fires then.
        expr: (time() - max(plugin_vuln_rescan_last_completed_timestamp_seconds)) > 129600
        for: 30m
        labels:
          severity: warning
          component: plugin
          tenancy: platform
        annotations:
          summary: "Plugin vulnerability rescan has not completed in 36h"
          description: "Last completed pass {{ $value | humanizeDuration }} ago — check the plugin service's vuln-rescan logs and grype DB updates."

      - alert: PluginQueueProcessingSlow
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(plugin_job_wait_seconds_bucket[5m]))
          ) > 300
        for: 10m
        labels:
          severity: warning
          component: plugin
          tenancy: platform
        annotations:
          summary: "Plugin queue p95 wait > 5 minutes"
          description: "p95 job wait is {{ $value | humanizeDuration }}; consider scaling workers."

      - alert: DLQFilling
        expr: sum(plugin_queue_jobs{queue="plugin-build-dlq"}) > 10
        for: 5m
        labels:
          severity: critical
          component: plugin
          tenancy: platform
        annotations:
          summary: "Dead-letter queue has more than 10 jobs"
          description: "{{ $value }} jobs in the DLQ — these failed all retries and need triage."

      # ---- Plugin ecosystem (docs/plans/plugin-ecosystem.md §9a) ----
      # The gauges are sampled by EVERY plugin replica (a plain scheduler, no
      # leader lock), so `max()` reads the current value whichever pod was
      # scraped. N22 emails the Ecosystem Managers once per breached request;
      # these rules are the paging half. Runbook: docs/runbooks/ecosystem-moderation.md.
      - alert: EcosystemSecurityLaneSLABreach
        # Security-fix lane (a version or yank linked to an advisory): 4-hour SLA.
        expr: max(ecosystem_requests_sla_breached{lane="security"}) > 0
        for: 5m
        labels:
          severity: critical
          component: plugin-ecosystem
          tenancy: platform
        annotations:
          summary: "Security-fix publish request past its 4h moderation SLA"
          description: "{{ $value }} security-lane request(s) have waited more than 4 hours for an Ecosystem Manager. Installers stay on the vulnerable version until one is decided — open the Ecosystem console's queue (security lane first)."

      - alert: EcosystemStandardLaneSLABreach
        # Standard lane: 2 business days (48h).
        expr: max(ecosystem_requests_sla_breached{lane="standard"}) > 0
        for: 30m
        labels:
          severity: warning
          component: plugin-ecosystem
          tenancy: platform
        annotations:
          summary: "Publish requests past the 48h moderation SLA"
          description: "{{ $value }} standard-lane request(s) are older than 48 hours. Check the queue and the approver headcount (two-person requests need two different managers)."

      - alert: EcosystemResignFailures
        # A failed re-sign leaves an image with a stale trust annotation; the job
        # resumes on the next 15-minute pass, so a single blip self-heals.
        expr: sum(increase(ecosystem_resign_failures_total[1h])) > 3
        for: 15m
        labels:
          severity: warning
          component: plugin-ecosystem
          tenancy: platform
        annotations:
          summary: "Plugin image re-signs are failing"
          description: "{{ $value | humanize }} re-sign failures in the last hour. The plugin service's ecosystem-resign logs name the image; usually image-registry or its signing key is unhealthy."

      - alert: EcosystemResignStalled
        # Jobs queued but no image re-signed for 2h: the leader-locked
        # maintenance scheduler stopped, or every attempt fails.
        expr: max(ecosystem_resign_jobs_pending) > 0 and on() (sum(increase(ecosystem_resign_images_total[2h])) or on() vector(0)) == 0
        for: 30m
        labels:
          severity: warning
          component: plugin-ecosystem
          tenancy: platform
        annotations:
          summary: "Plugin re-sign job stalled"
          description: "Re-sign jobs are queued but nothing was re-signed in 2h, so tier or suspension changes are not yet reflected in image annotations. Check the ecosystem-maintenance scheduler and image-registry."

      - alert: EcosystemApproverShortage
        # Two-person approval needs two different approvers; below that a
        # superadmin must act as the second one on every such request.
        expr: max(ecosystem_approvers{permission="plugins:moderate",kind="holders"}) < 2
        for: 1h
        labels:
          severity: warning
          component: plugin-ecosystem
          tenancy: platform
        annotations:
          summary: "Fewer than 2 Ecosystem Managers"
          description: "Only {{ $value }} system-org member(s) hold plugins:moderate. Plan for at least 3 (two-person approval plus holiday cover); a superadmin assigns the Ecosystem Manager role on the console's Ecosystem Managers tab."

      - alert: EcosystemNotificationsDropped
        # A queued ecosystem notice was given up on after its retries (the
        # in-app copy may still have been delivered).
        expr: sum(increase(ecosystem_notification_dropped_total[1h])) > 0
        for: 5m
        labels:
          severity: warning
          component: plugin-ecosystem
          tenancy: platform
        annotations:
          summary: "Plugin-ecosystem notices are being dropped"
          description: "{{ $value | humanize }} queued ecosystem notice(s) dropped in the last hour after repeated relay failures. Check platform's /internal/notify-email and SMTP."

      # ---- Anonymous plugin submissions (plan §4.2 / §9a, W5) ----
      # Metrics from api/plugin: plugin_submission_backlog (gauge: submissions in
      # pending_review), plugin_submission_gate_failures_total{gate}. The 2-business-
      # day moderation SLA for the `submission` request kind is already paged by
      # EcosystemStandardLaneSLABreach; these catch VOLUME and ABUSE.
      - alert: SubmissionBacklogHigh
        expr: max(plugin_submission_backlog) > 25
        for: 1h
        labels:
          severity: warning
          component: plugin-ecosystem
          tenancy: platform
        annotations:
          summary: "Anonymous submission backlog is high"
          description: "{{ $value }} anonymous plugin submissions are awaiting gates or moderation. Check the Ecosystem console queue (submission kind) and the quarantine builder; if this is a flood, set ANONYMOUS_SUBMISSIONS_ENABLED=false (runbook: docs/runbooks/ecosystem-moderation.md, Anonymous submissions)."

      - alert: SubmissionGateFailureSpike
        # One gate failing a lot in an hour is either an attack probing a gate
        # (heuristics, secrets, license) or a broken gate (vuln scan, smoke test
        # infrastructure) failing every honest submission.
        expr: sum by (gate) (increase(plugin_submission_gate_failures_total[1h])) > 10
        for: 10m
        labels:
          severity: warning
          component: plugin-ecosystem
          tenancy: platform
        annotations:
          summary: "Anonymous submissions failing the {{ $labels.gate }} gate"
          description: "{{ $value | humanize }} submissions failed the {{ $labels.gate }} gate in the last hour. Heuristics/secrets spikes suggest abuse (consider disabling the flag); vuln-scan or smoke-test spikes suggest a broken gate (grype DB, quarantine builder)."

      - alert: PluginLookupRefusalSpike
        # §3.3 / §9a: synth lookups refused because a signature (or its tier
        # annotation) doesn't verify, or a listing's tier is outside an org's
        # policy. A burst is a tampered/re-pushed image or a stale re-sign job.
        expr: sum by (reason) (increase(plugin_lookup_refusals_total{reason=~"signature|tier"}[1h])) > 5
        for: 10m
        labels:
          severity: warning
          component: plugin-ecosystem
          tenancy: platform
        annotations:
          summary: "Plugin lookups refused ({{ $labels.reason }})"
          description: "{{ $value | humanize }} plugin lookups were refused for {{ $labels.reason }} in the last hour. signature: an image no longer matches its platform signature (tampered, re-pushed, or a failed re-sign); tier: signed tier annotations out of step with listings (runbook: docs/runbooks/ecosystem-moderation.md)."

      - alert: OfficialAutoApprovalAnomaly
        # §3.0.3 / §9a: the seeded "Official catalog" rule (label = the rule's
        # NAME — keep in step if it is renamed) hitting its 50/day cap, or
        # approving at >4x its 7-day hourly average. Either is possible rule abuse
        # (a compromised catalog-loader credential) or a runaway loader.
        expr: |
          sum(increase(ecosystem_auto_approvals_total{rule="Official catalog"}[24h])) >= 45
          or
          (
            sum(increase(ecosystem_auto_approvals_total{rule="Official catalog"}[1h])) > 10
            and
            sum(increase(ecosystem_auto_approvals_total{rule="Official catalog"}[1h]))
              > 4 * (sum(increase(ecosystem_auto_approvals_total{rule="Official catalog"}[7d])) / 168)
          )
        for: 5m
        labels:
          severity: warning
          component: plugin-ecosystem
          tenancy: platform
        annotations:
          summary: "Official catalog auto-approvals are anomalous"
          description: "{{ $value | humanize }} Official catalog auto-approvals (near the 50/day cap or far above the usual rate). Review recent plugin.request.auto-approve audit events; OFFICIAL_AUTO_APPROVAL_ENABLED=false stops the rule immediately."

      # ---- Registry ----
      # Uses the platform-wide `http_requests_total` counter (emitted by
      # api-server's metricsMiddleware), filtered to the image-registry
      # service via the `service` default label. No new metric needed.
      - alert: RegistryErrorBurst
        expr: sum(rate(http_requests_total{service="image-registry", status_code=~"5.."}[5m])) > 0
        for: 5m
        labels:
          severity: critical
          component: registry
          tenancy: platform
        annotations:
          summary: "Registry returning 5xx errors"
          description: "{{ $value | humanize }} 5xx/s over the last 5 minutes. Check image-registry logs."

      # ---- Quota ----
      # `quota_fail_open_total` is incremented by api-core's quota client
      # every time the quota service is unreachable or returns non-ok and
      # the caller proceeds with a "fail-open allowed" result. A small
      # number of these is normal (transient network blips). A SUSTAINED
      # rate means quota is effectively disabled across the fleet — every
      # org is unlimited and noisy-neighbor protection is off — until
      # the quota service is restored. Critical because the financial /
      # abuse-prevention impact compounds with time.
      - alert: QuotaServiceFailOpenSustained
        expr: sum(rate(quota_fail_open_total[5m])) > 0.1
        for: 10m
        labels:
          severity: critical
          component: quota
          tenancy: platform
        annotations:
          summary: "Quota service has been failing open for 10+ minutes"
          description: "{{ $value | humanize }} fail-open events/sec averaged over 5m. The quota service is unreachable or unhealthy — every quota check is returning 'allowed' regardless of actual usage. Investigate the quota service before noisy orgs exhaust shared resources."

      # The mirror image of the rule above, and the more urgent of the two.
      # `quota_fail_closed_total` is incremented by the SAME api-core quota
      # client when a reservation could not be confirmed and the configured
      # policy (the default — QUOTA_RESERVE_FAIL_OPEN unset) is to DENY. Where
      # fail-open silently removes a limit, fail-closed silently removes the
      # FEATURE: every affected call is rejected as over quota even though the
      # org is nowhere near its limit, and the user sees a quota error that the
      # usage page contradicts. `reason` says which failure it was —
      # `unreachable` (quota service down / NetworkPolicy), `transient-429`
      # (quota service shedding load), `non-ok` (it answered, badly).
      # Critical: this is user-visible breakage of a healthy org's work.
      - alert: QuotaFailClosedSustained
        expr: sum by (reason) (rate(quota_fail_closed_total[5m])) > 0.1
        for: 10m
        labels:
          severity: critical
          component: quota
          tenancy: platform
        annotations:
          summary: "Quota reservations failing closed ({{ $labels.reason }})"
          description: "{{ $value | humanize }} denied-by-default reservations/sec over 5m sustained for 10m, reason={{ $labels.reason }}. The quota service is not confirming reservations and the fail-mode policy is DENY, so orgs are being refused work they are entitled to. Restore the quota service; QUOTA_RESERVE_FAIL_OPEN=true is the deliberate (and riskier) alternative."

      # ---- Audit durability (security log) ----
      # The audit trail is compliance-relevant, so losing it must PAGE. Two loss
      # points, both already instrumented but previously unalerted:
      #   * audit_dropped_total — the remote-audit client exhausted all retries
      #     for an event and dropped it.
      #   * audit_spool_dropped_total — the durable Redis spool overflowed and
      #     trimmed its OLDEST entries to stay bounded (platform down long enough
      #     that buffered audit events aged out before they could flush).
      # Any sustained drop is a security-log gap.
      - alert: AuditEventsDropped
        expr: sum(rate(audit_dropped_total[5m])) > 0
        for: 5m
        labels:
          severity: critical
          component: audit
          tenancy: platform
        annotations:
          summary: "Audit events are being dropped (security log gap)"
          description: "{{ $value | humanize }} audit events/sec dropped by the remote-audit client over 5m — the tamper-evident audit trail is losing records. Investigate platform audit ingest before the gap widens."

      - alert: AuditSpoolDropped
        expr: sum(rate(audit_spool_dropped_total[5m])) > 0
        for: 5m
        labels:
          severity: critical
          component: audit
          tenancy: platform
        annotations:
          summary: "Durable audit spool is overflowing (oldest events dropped)"
          description: "{{ $value | humanize }} spooled audit events/sec trimmed over 5m — the platform has been unreachable long enough that buffered audit events are aging out. Restore audit ingest; the spool is shedding the oldest security records."

      # ---- Storage & event delivery leftovers ----
      # message_attachment_blob_orphans_total: a purge deleted message rows but
      # could not delete some attachment blobs (orphans in object storage).
      # event_bus_dead_lettered_total: a durable event exhausted its deliveries
      # and moved to the `evt:<topic>:dlq` stream (e.g. an entitlement sync that
      # kept failing). Neither loses user data; both need an operator.
      - alert: MessageAttachmentBlobOrphans
        expr: sum(increase(message_attachment_blob_orphans_total[1h])) > 0
        for: 0m
        labels:
          severity: warning
          component: message
          tenancy: platform
        annotations:
          summary: "Message attachment blobs were orphaned by a purge"
          description: "{{ $value | humanize }} attachment blobs could not be deleted in the last hour — they remain in object storage with no row pointing at them. Check the message service logs for the failed keys and object-storage errors."

      - alert: EventBusDeadLettered
        expr: sum by (topic) (increase(event_bus_dead_lettered_total[1h])) > 0
        for: 0m
        labels:
          severity: warning
          component: event-bus
          tenancy: platform
        annotations:
          summary: "Durable events moved to the dead-letter stream"
          description: "{{ $value | humanize }} events on topic {{ $labels.topic }} exhausted their deliveries in the last hour and were dead-lettered to evt:{{ $labels.topic }}:dlq. The consumer kept failing — investigate, then replay or discard them."

      # ---- Billing → entitlement/quota sync ----
      # billing_quota_sync_failed_total: a subscription/entitlement change failed
      # to propagate to the quota service (the org's effective limits now lag its
      # plan). billing_entitlement_drift_total: the periodic reconciler found the
      # stored entitlement disagreeing with the source of truth. Both are money /
      # capability-correctness signals — warn (not page): they self-heal on the
      # next sync/reconcile, but a SUSTAINED rate means the leg is stuck.
      - alert: BillingQuotaSyncFailing
        expr: sum(rate(billing_quota_sync_failed_total[5m])) > 0
        for: 15m
        labels:
          severity: warning
          component: billing
          tenancy: platform
        annotations:
          summary: "Billing → quota sync failing"
          description: "{{ $value | humanize }} sync failures/sec over 5m sustained for 15m — plan changes are not reaching the quota service, so orgs' effective limits lag their subscriptions. Check the billing→quota sync leg."

      - alert: BillingEntitlementDriftSustained
        expr: sum(rate(billing_entitlement_drift_total[15m])) > 0
        for: 30m
        labels:
          severity: warning
          component: billing
          tenancy: platform
        annotations:
          summary: "Billing entitlement drift persisting"
          description: "The entitlement reconciler keeps finding stored entitlements out of sync with the source of truth ({{ $value | humanize }}/sec over 15m, sustained 30m). Usually self-heals; a persistent signal means a sync leg is stuck — inspect the reconciler logs."

      # ---- Billing: the rest of the *_failed_total family ----
      # Each of these is a write the billing service could not complete. They are
      # separated from the sync rule above because they fail for different
      # reasons and are fixed in different places — a single "billing is sad"
      # alert would tell an operator nothing about where to look.
      - alert: BillingEventWriteFailing
        expr: sum by (type) (rate(billing_event_write_failed_total[5m])) > 0
        for: 15m
        labels:
          severity: warning
          component: billing
          tenancy: platform
        annotations:
          summary: "Billing event writes failing (type={{ $labels.type }})"
          description: "{{ $value | humanize }} failed billing-event writes/sec over 5m sustained for 15m. The billing event log is the audit trail for money movement, so a sustained gap means charges and plan changes are happening with no durable record. Usually the Mongo write path — check the billing service logs and MongoDB health."

      - alert: BillingAddonSyncFailing
        expr: sum by (source) (rate(billing_provider_addon_sync_failed_total[5m])) > 0
        for: 15m
        labels:
          severity: warning
          component: billing
          tenancy: platform
        annotations:
          summary: "Add-on entitlements not syncing from the provider (source={{ $labels.source }})"
          description: "{{ $value | humanize }} failures/sec over 5m sustained for 15m reconciling add-on subscriptions from the payment provider. Orgs that bought (or cancelled) an add-on keep their OLD entitlements — a paid pack may be inactive, or a cancelled one still active. Check the provider webhook/poll leg named by source={{ $labels.source }}."

      - alert: BillingDisputeRetrieveFailing
        expr: sum by (reason) (rate(billing_dispute_retrieve_failed_total[15m])) > 0
        for: 30m
        labels:
          severity: warning
          component: billing
          tenancy: platform
        annotations:
          summary: "Cannot retrieve disputed charges from the payment provider"
          description: "{{ $value | humanize }} failures/sec over 15m sustained for 30m looking up the charge behind a dispute (reason={{ $labels.reason }}). A dispute that cannot be resolved to a charge is not reversed automatically, so the org keeps service it has charged back. Reconcile those disputes by hand in the provider dashboard."

      # ---- Auth: SAML assertions being rejected ----
      # `platform_saml_signins_total{result}` counts every SAML sign-in outcome.
      # Rejections are NOT all equal, so this fires on the ones that mean something
      # is wrong rather than on a person mistyping: an expired or rotated-away
      # signing certificate (`invalid_assertion`), unsolicited assertions
      # (`idp_initiated` — someone using their IdP's app launcher, or a login-CSRF
      # attempt), and replays. A steady rate here is a BROKEN CONNECTION: every
      # affected user is locked out, so it warns quickly.
      - alert: SamlAssertionRejections
        expr: sum by (result) (rate(platform_saml_signins_total{result=~"invalid_assertion|replay|idp_initiated"}[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
          component: auth
          tenancy: platform
        annotations:
          summary: "SAML assertions being rejected ({{ $labels.result }})"
          description: "{{ $value | humanize }} SAML rejections/sec of type {{ $labels.result }} over 5m, sustained 10m. `invalid_assertion` usually means the identity provider rotated its signing certificate without the new one being added here (see runbooks/secret-rotation.md#idp-saml-signing-certificates-per-org); `idp_initiated` means people are starting sign-in at the identity provider, which is refused by design; `replay` means an assertion was presented twice. Filter the audit log on `sso.saml.refused` for the affected org."

      # ---- Auth: SAML Single Logout ----
      # `platform_saml_slo_total{direction,result}` counts both legs of SLO.
      # The two results that matter are `refused` (an SLO message arrived that we
      # would not act on — unsigned, unknown issuer, or a malformed request) and
      # `capped` (an IdP-initiated logout matched more sessions than the per-
      # request cap, so some sessions were LEFT ALIVE). Both mean a sign-out the
      # user believes happened did not: `refused` is a broken or hostile IdP
      # connection, `capped` is a real, silent gap in session revocation.
      - alert: SamlSingleLogoutFailing
        expr: sum by (direction, result) (rate(platform_saml_slo_total{result=~"refused|capped"}[10m])) > 0
        for: 15m
        labels:
          severity: warning
          component: auth
          tenancy: platform
        annotations:
          summary: "SAML single logout not completing ({{ $labels.direction }}/{{ $labels.result }})"
          description: "{{ $value | humanize }} SLO events/sec of result={{ $labels.result }} over 10m, sustained 15m. `refused` means the logout message was rejected — usually the IdP's signing certificate rotated (runbooks/secret-rotation.md#idp-saml-signing-certificates-per-org) or the issuer does not match the configured connection. `capped` means an IdP-initiated logout hit the per-request session cap and some sessions stayed signed in; revoke them explicitly from the org's session list."

      # ---- Auth: bootstrap-admin MFA exception used long after install (#8) ----
      # The bootstrap admin (BOOTSTRAP_SUPERADMIN_EMAILS, system org) may hold a
      # single-factor session ONLY until they enrol a passkey or an authenticator
      # app; the exception then closes permanently. A fresh install finishes in
      # minutes, so `late="true"` means either a setup that stalled without ever
      # enrolling a factor, or someone using the exception as a way in. Both need
      # a person to look: enrol a factor (which closes it) or investigate.
      - alert: MfaBootstrapSessionLate
        expr: sum(increase(platform_mfa_bootstrap_session_total{late="true"}[15m])) > 0
        for: 0m
        labels:
          severity: warning
          component: auth
          tenancy: platform
        annotations:
          summary: "Bootstrap-admin MFA exception used more than 24h after install"
          description: "The install's bootstrap administrator signed in on the pre-enrolment exception more than 24 hours after the platform was installed, so they still have NO second factor. Filter the audit log on `auth.mfa.bootstrap_session`. Enrol a passkey or an authenticator app on that account — the exception closes permanently at the first enrolment."

      # ---- Auth: MFA enforcement refusals (#8) ----
      # Every refusal by an assurance gate: a weak session on a route that needs a
      # second factor, a stale one past `maxAge`, a machine credential on a
      # human-only route, or a bootstrap enrolment session reaching outside its
      # allowlist. A steady trickle is people meeting the policy for the first
      # time; a sustained burst usually means a route was gated before its users
      # could enrol, or that automation is pointed at a human-only endpoint.
      - alert: MfaEnforcementRefusalBurst
        expr: sum by (reason) (rate(platform_mfa_enforcement_refused_total[5m]) + rate(mfa_enforcement_refused_total[5m])) > 0.2
        for: 15m
        labels:
          severity: warning
          component: auth
          tenancy: platform
        annotations:
          summary: "Sustained MFA enforcement refusals ({{ $labels.reason }})"
          description: "{{ $value | humanize }} refusals/sec of type {{ $labels.reason }} over 5m, sustained 15m. `machine_principal` means a service account or API key is calling a human-only route — point it at the machine equivalent. `weak_session` means people have not enrolled a factor yet; check the org's grace deadline before tightening further. `bootstrap_session` means the install's admin is still un-enrolled."

      # ---- Auth: administrative MFA resets ----
      # `platform_mfa_resets_total{stage}` traces the whole approval flow:
      # requested -> approved | denied | withdrawn, plus `direct` for a reset
      # applied without the two-person flow. Resets are legitimate (people lose
      # phones) but each one strips a second factor from an account, so this
      # alerts on VOLUME rather than on any single reset: a burst of `approved`
      # or any use of `direct` is what a social-engineering campaign looks like
      # from the inside. Deliberately low thresholds — a handful a day is normal.
      - alert: MfaResetsElevated
        expr: sum by (stage) (increase(platform_mfa_resets_total{stage=~"approved|direct"}[1h])) > 3
        for: 0m
        labels:
          severity: warning
          component: auth
          tenancy: platform
        annotations:
          summary: "Unusual number of MFA resets ({{ $labels.stage }})"
          description: "{{ $value | humanize }} MFA resets of stage={{ $labels.stage }} in the last hour. `direct` bypassed the two-person approval entirely. Each reset removes a second factor, so a cluster of them is the shape of a social-engineering campaign — cross-check `auth.mfa.reset.*` in the audit log against the accounts and the people who approved them."

      # ---- Auth: breached-password check unavailable ----
      # The HIBP range check is FAIL-OPEN by design (see PASSWORD_BREACH_CHECK in
      # .env.example): an unreachable range API lets the password through rather
      # than blocking every registration and password change on a third party's
      # uptime. The cost of that choice is that the control disappears SILENTLY —
      # which is precisely what this rule exists to prevent. `outcome` is
      # ok | breached | unavailable; only `unavailable` is a fault.
      #
      # Sustained `unavailable` on an air-gapped install means PASSWORD_BREACH_CHECK
      # was left at `hibp` instead of being set to `off` — fix the setting rather
      # than opening egress.
      - alert: PasswordBreachCheckUnavailable
        expr: sum(rate(platform_password_breach_checks_total{outcome="unavailable"}[10m])) > 0
        for: 15m
        labels:
          severity: warning
          component: auth
          tenancy: platform
        annotations:
          summary: "Breached-password checks are failing open"
          description: "{{ $value | humanize }} unavailable breach checks/sec over 10m, sustained 15m. Every password set or changed in that window was accepted WITHOUT being checked against known-breached credentials — the check fails open on purpose. Either restore egress to PASSWORD_BREACH_CHECK_URL, or set PASSWORD_BREACH_CHECK=off if this install is deliberately air-gapped (which stops the alert and makes the choice explicit)."

      # ---- Auth: SSO just-in-time provisioning refused ----
      # A refusal here is a person who authenticated successfully at their IdP
      # and was then NOT let in, because JIT would not create their account:
      # `not_entitled` (the org's plan does not include SSO/JIT), `platform_admin`
      # (JIT may never mint a platform administrator — by design), a seat cap, or
      # a domain that does not match the connection. From the user's side this is
      # indistinguishable from a broken login, and it is invisible in the IdP's
      # own logs, so it needs to surface here.
      - alert: SsoJitRefusalBurst
        expr: sum by (reason) (rate(platform_sso_jit_refused_total[10m])) > 0.02
        for: 15m
        labels:
          severity: warning
          component: auth
          tenancy: platform
        annotations:
          summary: "SSO just-in-time provisioning being refused ({{ $labels.reason }})"
          description: "{{ $value | humanize }} JIT refusals/sec of reason={{ $labels.reason }} over 10m, sustained 15m — people are authenticating at their identity provider and still cannot get in. `not_entitled` means the org's plan does not include this; `platform_admin` is refused by design and never auto-provisioned. Filter the audit log on `sso.jit.refused` for the affected org."

      # ---- Directory sync (SCIM) ----
      # `platform_scim_errors_total{resource,operation,reason}` counts refused or
      # failed directory operations. SCIM is how an organisation DEPROVISIONS
      # people, so a stuck sync is a security problem and not just an
      # inconvenience: a leaver removed in the IdP keeps their access here until
      # the sync succeeds. `reason=internal` is our fault; the rest are the
      # caller's (bad filter, unknown attribute, revoked scope) and still need
      # someone to fix the connection.
      - alert: ScimErrorBurst
        expr: sum by (resource, operation, reason) (rate(platform_scim_errors_total[10m])) > 0.05
        for: 15m
        labels:
          severity: warning
          component: auth
          tenancy: platform
        annotations:
          summary: "SCIM directory sync failing ({{ $labels.resource }}/{{ $labels.operation }}, {{ $labels.reason }})"
          description: "{{ $value | humanize }} SCIM errors/sec over 10m, sustained 15m, on {{ $labels.operation }} {{ $labels.resource }} (reason={{ $labels.reason }}). While this persists the directory and this platform disagree about who has access — a deprovisioned user may still be able to sign in. `internal` is a platform fault; anything else means the connection needs fixing at the IdP. Filter the audit log on `org.scim.refused`."

      # ---- Passkeys: FIDO metadata blob not loading ----
      # `platform_fido_mds_loads_total{outcome,source}` records every attempt to
      # load the FIDO Alliance metadata blob. It is only consulted by orgs that
      # set an approved-authenticator (AAGUID) allowlist — but for those orgs a
      # failed load is a HARD STOP: registration requests direct attestation and
      # is REFUSED when no metadata is loaded, so nobody in that org can enrol a
      # new passkey. `source=url` failures are egress or an expired blob;
      # `source=file` failures are a missing or stale FIDO_MDS_BLOB_PATH mount.
      - alert: FidoMdsLoadFailing
        expr: sum by (source) (increase(platform_fido_mds_loads_total{outcome="failure"}[1h])) > 0
        for: 0m
        labels:
          severity: warning
          component: auth
          tenancy: platform
        annotations:
          summary: "FIDO metadata blob failed to load (source={{ $labels.source }})"
          description: "{{ $value | humanize }} failed MDS loads in the last hour. Orgs with an approved-authenticator allowlist cannot enrol new passkeys until a blob loads — the refusal is deliberate (the policy asked for provenance we could not verify). source=url: check egress to FIDO_MDS_URL. source=file: the FIDO_MDS_BLOB_PATH file is missing, unreadable or expired — refresh it per docs/runbooks/secret-rotation.md. Orgs with no allowlist are unaffected."

      # ---- Auth: failed-login burst (credential stuffing / brute force) ----
      # platform_logins_failed_total is a platform-wide counter (no per-IP/org
      # label), so this is a coarse "someone is hammering login" signal. Warn on a
      # sustained elevated rate; investigate source IPs at the ALB/WAF.
      - alert: LoginFailureBurst
        expr: sum(rate(platform_logins_failed_total[5m])) > 1
        for: 10m
        labels:
          severity: warning
          component: auth
          tenancy: platform
        annotations:
          summary: "Elevated failed-login rate (possible brute force)"
          description: "{{ $value | humanize }} failed logins/sec over 5m sustained for 10m — possible credential stuffing/brute force. Check source IPs at the ALB/WAF and consider rate-limiting or lockout."

      # ---- Generic app 5xx burst ----
      # image-registry has its own faster RegistryErrorBurst above; this covers
      # every OTHER app service via the shared http_requests_total counter
      # (emitted by api-server's metricsMiddleware, `service` default label).
      # One series per service so the page names the culprit.
      - alert: ServiceError5xxBurst
        expr: sum by (service) (rate(http_requests_total{service!="image-registry", status_code=~"5.."}[5m])) > 0.1
        for: 10m
        labels:
          severity: critical
          component: api
          tenancy: platform
        annotations:
          summary: "Service {{ $labels.service }} returning 5xx errors"
          description: "{{ $value | humanize }} 5xx/s from {{ $labels.service }} over 5m sustained for 10m — check that service's logs and dependencies."

      # ---- S2S circuit breaker ----
      # s2s_circuit_opened_total increments when the shared InternalHttpClient trips
      # a target's breaker open (≥ threshold consecutive failures) and starts fast-
      # failing to shed load. Firing means a downstream dependency is in a sustained
      # brownout — callers are load-shedding instead of piling on retries.
      - alert: ServiceCircuitOpen
        expr: sum by (target) (increase(s2s_circuit_opened_total[5m])) > 0
        for: 0m
        labels:
          severity: warning
          component: api
          tenancy: platform
        annotations:
          summary: "S2S circuit opened for {{ $labels.target }}"
          description: "The circuit breaker to {{ $labels.target }} opened {{ $value | humanize }} time(s) in 5m — that downstream is in a sustained brownout and callers are shedding load. Check {{ $labels.target }}'s health."

      # ---- Token revocation degradation ----
      # token_revocation_fail_open_total increments when a Redis-backed revocation
      # read errors and the check fails OPEN. While sustained, forced logouts and
      # privilege revocations silently stop taking effect until natural token expiry.
      - alert: TokenRevocationFailingOpen
        expr: sum(rate(token_revocation_fail_open_total[5m])) > 0.1
        for: 10m
        labels:
          severity: critical
          component: auth
          tenancy: platform
        annotations:
          summary: "Token revocation is failing open"
          description: "{{ $value | humanize }} revocation read failures/sec over 5m sustained for 10m — forced logouts / privilege revocations are NOT taking effect until token expiry. Restore the revocation Redis."

      # ---- Secret rotation left half-finished ----
      # `secret_rotation_previous_set{secret}` is 1 while a rotation's outgoing
      # credential is still accepted by that service — an env `*_PREVIOUS` value
      # (SECRET_ENCRYPTION_KEY_PREVIOUS, ALERT_WEBHOOK_INSTANCE_TOKEN_PREVIOUS), a
      # retiring `kid` still published in the JWKS (TOKEN_SIGNING_KEY) or in the
      # per-service key bundle (SERVICE_SIGNING_KEY), or a two-cert registry
      # token bundle.
      # That is the overlap window: the OLD credential is still accepted, so a
      # rotation that is never finished has simply added a second valid
      # credential — including one that may be the compromised one the rotation
      # was meant to retire.
      # Aggregated by (service, secret) on purpose: dropping pod/instance means a
      # rolling restart mid-rotation does not reset the `for` timer.
      - alert: SecretRotationPreviousLingering
        expr: max by (service, secret) (secret_rotation_previous_set) == 1
        for: 24h
        labels:
          severity: warning
          component: auth
          tenancy: platform
        annotations:
          summary: "{{ $labels.secret }} rotation overlap still open on {{ $labels.service }}"
          description: "The previous {{ $labels.secret }} has been accepted by {{ $labels.service }} for over 24h — the rotation was never finished, so the old credential is still valid. Finish it per docs/runbooks/secret-rotation.md (clear the *_PREVIOUS value or drop the retiring key, re-create the secret, restart)."

      # ---- Internal routes refused ----
      # `internal_route_refused_total{service,route,reason,caller}` increments in
      # api-core's `requireInternalService` when a call to an INTERNAL route
      # (/internal/*, the quota usage counters, the entity-event and audit
      # ingests, the entitlement sync legs) is turned away (#14).
      #
      # Two very different meanings, split by `reason`:
      #   user_token  — something holding a PERSON's credential tried a
      #                 peer-service API. A handful is a misrouted client; a
      #                 sustained rate is someone probing the internal surface.
      #   wrong_caller — a real service token, but not one this route admits.
      #                 Almost always a mis-wired caller after a deploy, and the
      #                 feature behind it is silently failing.
      # Either way it is a security-relevant refusal, so it pages nobody at a
      # trickle but must not go unseen.
      - alert: InternalRouteRefused
        expr: sum by (service, reason) (rate(internal_route_refused_total[5m])) > 0.05
        for: 15m
        labels:
          severity: warning
          component: auth
          tenancy: platform
        annotations:
          summary: "{{ $labels.service }} is refusing internal-route calls ({{ $labels.reason }})"
          description: "{{ $value | humanize }} refusals/s on {{ $labels.service }}'s internal routes over 5m sustained for 15m, reason={{ $labels.reason }}. `wrong_caller` usually means a caller was re-pointed or renamed and its feature is now failing; `user_token` means a user credential is reaching a peer-service API. See docs/authentication.md#internal-routes."

      # ---- Service tokens failing to verify ----
      # `service_token_verify_total{result,service}` counts every internal token
      # verification (#14). `unknown_kid` means a signer's public key is not in
      # this pod's bundle — the classic half-finished key rotation, where the
      # private key was rolled out before the bundle. `subject_mismatch` is the
      # one that matters most: a VALID signature from a service claiming to be a
      # different one, i.e. an actual cross-service forgery attempt.
      - alert: ServiceTokenVerifyFailing
        expr: sum by (service, result) (rate(service_token_verify_total{result!="ok"}[5m])) > 0
        for: 10m
        labels:
          severity: critical
          component: auth
          tenancy: platform
        annotations:
          summary: "Internal service tokens are failing to verify ({{ $labels.result }})"
          description: "{{ $value | humanize }}/s of internal token verifications on {{ $labels.service }} are failing with result={{ $labels.result }} over 5m sustained for 10m. `unknown_kid` → the key bundle is behind a rotation: roll it out everywhere before the private key (docs/runbooks/secret-rotation.md). `subject_mismatch` → a service signed a token naming a DIFFERENT service; treat as a compromise until proven otherwise."

      # ---- Token signing keys unreachable ----
      # `jwks_fetch_total{source,result}` counts every fetch of platform's
      # published ES256 key set. Since #5, user tokens are verified against
      # those keys, and a verifier that cannot obtain them FAILS CLOSED (503) —
      # so sustained fetch errors are a fleet-wide auth outage in the making,
      # not a background nuisance. Keys are cached for 10 minutes, which is the
      # grace period this `for` mirrors.
      - alert: JwksFetchFailing
        expr: sum by (service) (rate(jwks_fetch_total{result!="success"}[5m])) > 0
        for: 10m
        labels:
          severity: critical
          component: auth
          tenancy: platform
        annotations:
          summary: "{{ $labels.service }} cannot fetch the token signing keys"
          description: "JWKS fetches from platform have been failing for 10m on {{ $labels.service }}. Once its cached key set goes stale every token verification there answers 503. Check platform's /.well-known/jwks.json and the gateway route to it."

      # ---- AI provider errors ----
      # ai_requests_total{outcome="error"} increments on a failed AI turn (provider
      # brownout, bad key, timeout). A burst usually means a provider-side outage.
      - alert: AIProviderErrorBurst
        expr: sum by (provider) (rate(ai_requests_total{outcome="error"}[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
          component: ai
          tenancy: platform
        annotations:
          summary: "AI provider {{ $labels.provider }} erroring"
          description: "{{ $value | humanize }} failed AI turns/sec for provider {{ $labels.provider }} over 5m sustained for 10m — likely a provider brownout or credential issue. Check the ask/generation logs."

      # ---- Service mesh (Istio ambient) ----
      # Fires when two MESHED workloads talk without mTLS. Ambient applies
      # auto-mTLS between enrolled workloads, so a plaintext edge means one side
      # has silently fallen out of the mesh — almost always a pod created while
      # istio-cni was unavailable, since ambient enrolls a pod's netns at CREATE
      # time and never retroactively. That failure is invisible from the app's
      # side (it still resolves and dials; a STRICT-mTLS peer just drops it, so
      # it surfaces as an unexplained connection timeout), which is why it is
      # worth an alert rather than a dashboard panel.
      #
      # Scoping matters here, or this is pure noise:
      #   reporter="destination"      — the destination is authoritative about
      #                                 what it actually accepted, and counting
      #                                 one reporter avoids double-counting the
      #                                 same edge (ztunnel reports both ends).
      #   *_workload_namespace        — both ends must be in the app namespace.
      #                                 Traffic entering from outside the mesh
      #                                 (the ALB/ingress hop, kubelet probes) is
      #                                 legitimately not mTLS, and so is
      #                                 Prometheus scraping istio-system, which
      #                                 is not mesh-enrolled.
      #   source_workload!="unknown"  — unmeshed/external origins report no
      #                                 workload identity.
      - alert: MeshMTLSDegraded
        expr: |
          sum by (source_workload, destination_workload) (
            rate(istio_tcp_connections_opened_total{
              reporter="destination",
              connection_security_policy!="mutual_tls",
              source_workload_namespace="pipeline-builder",
              destination_workload_namespace="pipeline-builder",
              source_workload!="unknown"
            }[5m])
          ) > 0
        for: 10m
        labels:
          severity: critical
          component: istio
          tenancy: platform
        annotations:
          summary: "Plaintext traffic inside the mesh: {{ $labels.source_workload }} -> {{ $labels.destination_workload }}"
          description: "Both workloads are mesh-enrolled but the destination accepted a non-mTLS connection ({{ $value | printf \"%.3f\" }} conn/s). Usually a pod created while istio-cni was down — ambient enrolls at pod CREATE only, so a rollout restart of the source workload re-enrolls it. Verify with: istioctl ztunnel-config workload."

      # Control-plane liveness. If istiod stops reporting, config changes
      # (AuthorizationPolicy, waypoints) silently stop propagating while the
      # data path keeps running on its last-known config — a slow, quiet drift
      # rather than an outage, so it needs its own signal.
      - alert: IstiodDown
        expr: up{job="istio-mesh", mesh_component="istiod"} == 0
        for: 5m
        labels:
          severity: critical
          component: istio
          tenancy: platform
        annotations:
          summary: "istiod is not reporting metrics"
          description: "The Istio control plane has been unscrapeable for 5m. Mesh config changes will not propagate; the ztunnel data path continues on its last-known config."

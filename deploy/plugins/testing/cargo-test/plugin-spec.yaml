name: cargo-test
description: Cargo test runner plugin for executing Rust unit and integration tests across workspace crates using AWS CDK CodeBuildStep
keywords:
  - rust
  - unit-test
  - integration-test
  - cargo
category: testing
version: 1.0.0
pluginType: CodeBuildStep
computeType: MEDIUM
timeout: 30
failureBehavior: fail
secrets: []
primaryOutputDirectory: test-reports
dockerfile: Dockerfile
installCommands:
  # Rust (cargo/rustc) is baked into pipeline-rust-base (single pinned version).
  - test -d test-reports || mkdir -p test-reports
  - cargo --version
  - if [ -f Cargo.toml ]; then cargo fetch; fi
commands:
  - |
    set -e
    echo "Running cargo test..."
    run-logged test-reports/cargo-test.log -- cargo test --all-features --workspace
  - "echo \"Cargo test complete. Reports available in test-reports/\""

# ─── Catalog metadata (plugin-ecosystem W0.2) ───
license: Apache-2.0
homepageUrl: https://doc.rust-lang.org/cargo/commands/cargo-test.html
sourceUrl: https://github.com/mwashburn160/pipeline-builder/tree/main/deploy/plugins/testing/cargo-test
icon: rust
network:
  egress:
    - "index.crates.io"
    - "static.crates.io"
changelog: |
  1.0.0: Initial Official catalog release. Runs as the non-root `plugin` user (uid 1000); every download pinned and digest-verified.

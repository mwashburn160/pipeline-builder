name: dotnet-test
description: dotnet test runner plugin for executing .NET unit and integration tests with TRX reporting and code coverage using AWS CDK CodeBuildStep
keywords:
  - dotnet
  - unit-test
  - integration-test
  - trx
category: testing
version: 1.0.0
pluginType: CodeBuildStep
computeType: MEDIUM
timeout: 30
failureBehavior: fail
secrets: []
primaryOutputDirectory: test-reports
dockerfile: Dockerfile
installCommands:
  # .NET SDK is baked into pipeline-dotnet-base (single pinned version).
  - test -d test-reports || mkdir -p test-reports
  - dotnet --version
commands:
  - |
    set -e
    echo "Restoring packages..."
    run-logged test-reports/dotnet-restore.log -- dotnet restore
  - |
    set -e
    echo "Building project..."
    run-logged test-reports/dotnet-build.log -- \
      dotnet build --no-restore --configuration ${CONFIGURATION}
  - |
    set -e
    echo "Running tests..."
    run-logged test-reports/dotnet-test.log -- \
      dotnet test --no-build --configuration ${CONFIGURATION} \
        --logger trx --results-directory test-reports \
        --collect:"XPlat Code Coverage"
  - "echo \"dotnet test complete. Reports available in test-reports/\""
env:
  CONFIGURATION: "Release"

# ─── Catalog metadata (plugin-ecosystem W0.2) ───
license: Apache-2.0
homepageUrl: https://learn.microsoft.com/dotnet/core/tools/dotnet-test
sourceUrl: https://github.com/mwashburn160/pipeline-builder/tree/main/deploy/plugins/testing/dotnet-test
icon: dotnet
network:
  egress:
    - "api.nuget.org"
changelog: |
  1.0.0: Initial Official catalog release. Runs as the non-root `plugin` user (uid 1000); every download pinned and digest-verified.

name: prettier
description: Prettier code formatting verification plugin for checking consistent formatting across JavaScript, TypeScript, CSS, HTML, JSON, YAML, and Markdown using AWS CDK CodeBuildStep
keywords:
  - javascript
  - typescript
  - formatting
  - code-style
category: quality
version: 1.0.0
pluginType: CodeBuildStep
computeType: SMALL
timeout: 10
failureBehavior: warn
secrets: []
primaryOutputDirectory: format-reports
dockerfile: Dockerfile
installCommands:
  # Node + npm are baked into plugin-node-base; Prettier is pinned + baked.
  - test -d format-reports || mkdir -p format-reports
  - node --version && prettier --version
  # Install project dependencies (a project-pinned Prettier wins via npx).
  - |
    set -e
    if [ -f pnpm-lock.yaml ]; then
      npm install -g pnpm && pnpm install --frozen-lockfile
    elif [ -f yarn.lock ]; then
      npm install -g yarn && yarn install --frozen-lockfile
    elif [ -f package-lock.json ]; then
      npm ci
    elif [ -f package.json ]; then
      npm install
    fi
commands:
  - |
    set -e
    echo "Checking code formatting with Prettier..."
    # Prettier's exit codes are 0 = all formatted, 1 = files need formatting,
    # 2 = Prettier itself failed (unresolvable parser, bad config, crash).
    # A blanket `|| true` collapsed all three. The damage was in the second
    # call: on exit 2 the list file is empty, so UNFORMATTED came out 0 and the
    # step printed "All files are properly formatted" having checked NOTHING.
    # Findings stay advisory (the point of this plugin is the report), but a
    # broken Prettier now fails the step instead of reporting success.
    # POSIX /bin/sh has no pipefail, so capture the status explicitly rather
    # than reading the exit of `tee`.
    _rc=0
    npx prettier --check "${PRETTIER_GLOB}" \
      --log-level warn \
      > format-reports/prettier-results.txt 2>&1 || _rc=$?
    cat format-reports/prettier-results.txt
    [ "${_rc}" -le 1 ] || { echo "ERROR: Prettier failed (exit ${_rc})" >&2; exit 1; }
    # Generate list of unformatted files
    _rc=0
    npx prettier --list-different "${PRETTIER_GLOB}" \
      > format-reports/unformatted-files.txt 2>format-reports/prettier-errors.txt || _rc=$?
    if [ "${_rc}" -gt 1 ]; then
      echo "ERROR: Prettier failed (exit ${_rc}); the file list is not trustworthy" >&2
      cat format-reports/prettier-errors.txt >&2
      exit 1
    fi
    UNFORMATTED=$(wc -l < format-reports/unformatted-files.txt | tr -d ' ')
    if [ "${UNFORMATTED}" -gt 0 ]; then
      echo "WARNING: ${UNFORMATTED} file(s) need formatting"
    else
      echo "All files are properly formatted"
    fi
  - "echo \"Prettier check complete. Report available in format-reports/\""
env:
  PRETTIER_GLOB: "."

# ─── Catalog metadata (plugin-ecosystem W0.2) ───
license: Apache-2.0
homepageUrl: https://prettier.io
sourceUrl: https://github.com/mwashburn160/pipeline-builder/tree/main/deploy/plugins/quality/prettier
icon: prettier
network:
  egress:
    - "registry.npmjs.org"
    - "registry.yarnpkg.com"
changelog: |
  1.0.0: Initial Official catalog release. Runs as the non-root `plugin` user (uid 1000); every download pinned and digest-verified.

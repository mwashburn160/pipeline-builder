name: rustfmt
description: rustfmt formatting check plugin for verifying consistent Rust code formatting using AWS CDK CodeBuildStep
keywords:
  - rust
  - formatting
  - code-style
  - consistency
category: quality
version: 1.0.0
pluginType: CodeBuildStep
computeType: SMALL
timeout: 10
failureBehavior: warn
secrets: []
primaryOutputDirectory: fmt-reports
dockerfile: Dockerfile
installCommands:
  # Rust + rustfmt are baked into pipeline-rust-base (single pinned version).
  - test -d fmt-reports || mkdir -p fmt-reports
  - cargo --version
commands:
  - |
    set -e
    echo "Running rustfmt check..."
    run-logged fmt-reports/rustfmt.log -- cargo fmt --all -- --check
  - "echo \"rustfmt check complete. Reports available in fmt-reports/\""

# ─── Catalog metadata (plugin-ecosystem W0.2) ───
license: Apache-2.0
homepageUrl: https://github.com/rust-lang/rustfmt
sourceUrl: https://github.com/mwashburn160/pipeline-builder/tree/main/deploy/plugins/quality/rustfmt
icon: rust
# network.egress: none declared — the step contacts no fixed external host
changelog: |
  1.0.0: Initial Official catalog release. Runs as the non-root `plugin` user (uid 1000); every download pinned and digest-verified.

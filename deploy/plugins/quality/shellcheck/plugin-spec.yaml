name: shellcheck
description: ShellCheck shell script linting plugin for detecting bugs, syntax issues, and portability problems in bash, sh, and zsh scripts using AWS CDK CodeBuildStep
keywords:
  - bash
  - shell
  - linter
  - bug-detection
category: quality
version: 1.0.0
pluginType: CodeBuildStep
computeType: SMALL
timeout: 10
failureBehavior: warn
secrets: []
primaryOutputDirectory: shellcheck-reports
dockerfile: Dockerfile
installCommands:
  # ShellCheck version selection
  - test -d shellcheck-reports || mkdir -p shellcheck-reports
  - |
    set -e
    if [ -f /opt/shellcheck/versions/shellcheck-${SHELLCHECK_VERSION} ]; then
      ln -sf /opt/shellcheck/versions/shellcheck-${SHELLCHECK_VERSION} /opt/shellcheck/bin/shellcheck
    else
      echo "ERROR: ShellCheck ${SHELLCHECK_VERSION} is not in this image (only pinned, checksum-verified builds are). Available: $(ls /opt/shellcheck/versions | sed 's/^shellcheck-//' | tr '\n' ' ')" >&2
      exit 1
    fi
  - shellcheck --version
commands:
  - |
    set -e
    echo "Scanning for shell scripts..."
    SCRIPTS=$(find . -type f \( -name "*.sh" -o -name "*.bash" -o -name "*.zsh" \) \
      -not -path "*/node_modules/*" \
      -not -path "*/.git/*" \
      -not -path "*/vendor/*" 2>/dev/null)
    if [ -z "${SCRIPTS}" ]; then
      echo "No shell scripts found to lint"
      echo "[]" > shellcheck-reports/shellcheck-results.json
    else
      echo "Found scripts to lint:"
      echo "${SCRIPTS}"
      echo "${SCRIPTS}" | xargs shellcheck \
        --format=${SHELLCHECK_FORMAT} \
        --severity=${SHELLCHECK_SEVERITY} \
        --shell=${SHELLCHECK_SHELL} \
        > shellcheck-reports/shellcheck-results.json 2>&1
    fi
  - "echo \"ShellCheck complete. Report available in shellcheck-reports/\""
env:
  SHELLCHECK_VERSION: "0.11.0"
  SHELLCHECK_SEVERITY: warning
  SHELLCHECK_FORMAT: json
  SHELLCHECK_SHELL: bash

# Smoke test — runs after `docker build` in test-plugins.sh --build.
# Asserts the tool is on PATH and produces a deterministic version output.
smokeTest: "shellcheck --version"

# ─── Catalog metadata (plugin-ecosystem W0.2) ───
license: Apache-2.0
homepageUrl: https://www.shellcheck.net
sourceUrl: https://github.com/mwashburn160/pipeline-builder/tree/main/deploy/plugins/quality/shellcheck
# icon: none — no mark in Simple Icons 16.32.0; no confirmed vendor press-kit permission (monogram; see _icons/SOURCES.md)
# network.egress: none declared — the step contacts no fixed external host
changelog: |
  1.0.0: Initial Official catalog release. Runs as the non-root `plugin` user (uid 1000); every download pinned and digest-verified.

name: golangci-lint
description: golangci-lint Go code quality plugin for running multiple Go linters in parallel with configurable rules using AWS CDK CodeBuildStep
keywords:
  - go
  - linter
  - multi-linter
  - code-quality
category: quality
version: 1.0.0
pluginType: CodeBuildStep
computeType: MEDIUM
timeout: 15
failureBehavior: warn
secrets: []
primaryOutputDirectory: lint-reports
dockerfile: Dockerfile
installCommands:
  # Go + golangci-lint are baked into pipeline-go-base / this plugin's image.
  - test -d lint-reports || mkdir -p lint-reports
  - go version && golangci-lint --version
  # Download project dependencies (not tool setup).
  - if [ -f go.mod ]; then go mod download; fi
commands:
  - |
    set -e
    # golangci-lint v2 rejects v1 config files. Migrate a v1 config in the
    # (ephemeral) build workspace so the lint still runs; the project should
    # run `golangci-lint migrate` itself to make this a no-op.
    for c in .golangci.yml .golangci.yaml; do
      if [ -f "$c" ] && ! grep -qE '^version:[[:space:]]*"?2"?' "$c"; then
        echo "WARNING: $c is a golangci-lint v1 config; migrating it for this run (run 'golangci-lint migrate' in your repo)"
        golangci-lint migrate --config "$c"
      fi
    done
    echo "Running golangci-lint..."
    # Report-only JSON (always written; never gates). v2 selects formats via
    # --output.<format>.path (v1's --out-format was removed).
    golangci-lint run \
      --timeout ${GOLANGCI_LINT_TIMEOUT} \
      --output.${GOLANGCI_LINT_FORMAT}.path=stdout \
      > lint-reports/golangci-lint-results.json 2>/dev/null || true
    run-logged lint-reports/golangci-lint-summary.log -- golangci-lint run --timeout ${GOLANGCI_LINT_TIMEOUT}
  - "echo \"golangci-lint complete. Reports available in lint-reports/\""
env:
  # GO_VERSION is baked into pipeline-go-base (single-version model).
  GOLANGCI_LINT_TIMEOUT: 5m
  GOLANGCI_LINT_FORMAT: json

# ─── Catalog metadata (plugin-ecosystem W0.2) ───
license: Apache-2.0
homepageUrl: https://golangci-lint.run
sourceUrl: https://github.com/mwashburn160/pipeline-builder/tree/main/deploy/plugins/quality/golangci-lint
# icon: none — no mark in Simple Icons 16.32.0; no confirmed vendor press-kit permission (monogram; see _icons/SOURCES.md)
network:
  egress:
    - "proxy.golang.org"
    - "sum.golang.org"
changelog: |
  1.0.0: Initial Official catalog release. Runs as the non-root `plugin` user (uid 1000); every download pinned and digest-verified.

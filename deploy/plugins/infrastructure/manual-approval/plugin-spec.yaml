name: manual-approval
description: Native CDK pipeline approval gate that pauses execution and waits for manual confirmation via the AWS CodePipeline console
keywords:
  - approval
  - gate
  - manual
  - pause
category: infrastructure
version: 1.0.0
pluginType: ManualApprovalStep
computeType: SMALL
timeout: 0
failureBehavior: fail
# A ManualApprovalStep produces no build artifact — the field is optional, so
# it is omitted rather than declared null (an explicit null fails a plain string
# schema on older plugin-API builds).
secrets: []
installCommands: []
commands: []
env:
  APPROVAL_COMMENT: "Pipeline requires manual approval before proceeding"

# ─── Catalog metadata (plugin-ecosystem W0.2) ───
license: Apache-2.0
sourceUrl: https://github.com/mwashburn160/pipeline-builder/tree/main/deploy/plugins/infrastructure/manual-approval
# icon: none — generic pipeline step with no vendor (monogram; see _icons/SOURCES.md)
# network.egress: none declared — the step contacts no fixed external host
changelog: |
  1.0.0: Initial Official catalog release. Runs as the non-root `plugin` user (uid 1000); every download pinned and digest-verified.

name: acr-push
description: Push container images to Azure Container Registry with Azure CLI service principal authentication using AWS CDK CodeBuildStep
keywords:
  - container
  - docker
  - azure
  - registry
category: artifact
version: 1.0.2
pluginType: CodeBuildStep
computeType: MEDIUM
timeout: 15
failureBehavior: fail
secrets:
  - name: AZURE_CLIENT_ID
    required: true
    description: "Azure service principal client ID"
  - name: AZURE_CLIENT_SECRET
    required: true
    description: "Azure service principal client secret"
  - name: AZURE_TENANT_ID
    required: true
    description: "Azure tenant ID"
primaryOutputDirectory: registry-output
dockerfile: Dockerfile
installCommands:
  - test -d registry-output || mkdir -p registry-output
  - docker --version
  - docker buildx version
  - az --version
  # Authenticate with Azure Container Registry
  - |
    set -e
    if [ -n "${AZURE_CLIENT_ID}" ] && [ -n "${AZURE_CLIENT_SECRET}" ] && [ -n "${AZURE_TENANT_ID}" ]; then
      echo "Logging into Azure with service principal..."
      az login --service-principal \
        --username "${AZURE_CLIENT_ID}" \
        --password "${AZURE_CLIENT_SECRET}" \
        --tenant "${AZURE_TENANT_ID}"
      if [ -n "${ACR_REGISTRY}" ]; then
        echo "Logging into Azure Container Registry: ${ACR_REGISTRY}..."
        az acr login --name "${ACR_REGISTRY}"
      else
        echo "WARNING: ACR_REGISTRY not set. Set ACR_REGISTRY to your registry name"
      fi
    else
      echo "WARNING: AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, and AZURE_TENANT_ID must all be set for service principal authentication"
    fi
commands:
  - |
    set -e
    if [ -z "${IMAGE_NAME}" ]; then
      echo "ERROR: IMAGE_NAME must be set"
      exit 1
    fi
    if [ -z "${ACR_REGISTRY}" ]; then
      echo "ERROR: ACR_REGISTRY must be set (e.g., myregistry)"
      exit 1
    fi
    FULL_IMAGE="${ACR_REGISTRY}.azurecr.io/${IMAGE_NAME}:${IMAGE_TAG}"
    echo "Building image: ${FULL_IMAGE}"
    docker build \
      -f "${DOCKERFILE_PATH}" \
      -t "${FULL_IMAGE}" \
      "${DOCKER_CONTEXT}"
    # Save image metadata
    docker inspect "${FULL_IMAGE}" > registry-output/image-metadata.json
    echo "${FULL_IMAGE}" > registry-output/image-name.txt
  # Push image to Azure Container Registry
  - |
    set -e
    FULL_IMAGE=$(cat registry-output/image-name.txt)
    echo "Pushing image: ${FULL_IMAGE}"
    docker push "${FULL_IMAGE}"
    echo "Image pushed successfully: ${FULL_IMAGE}"
  - "echo \"ACR push complete.\""
env:
  ACR_REGISTRY: ""
  IMAGE_NAME: ""
  IMAGE_TAG: latest
  DOCKERFILE_PATH: Dockerfile
  DOCKER_CONTEXT: "."

# Smoke test — runs after `docker build` in test-plugins.sh --build.
# Asserts every tool the commands invoke is on PATH and runs.
smokeTest: "docker --version && docker buildx version && az --version && jq --version"

# ─── Catalog metadata (plugin-ecosystem W0.2) ───
license: Apache-2.0
homepageUrl: https://learn.microsoft.com/azure/container-registry/
sourceUrl: https://github.com/mwashburn160/pipeline-builder/tree/main/deploy/plugins/artifact/acr-push
# icon: none — Microsoft/Azure marks were removed from Simple Icons at Microsoft's request; no confirmed press-kit permission (monogram; see _icons/SOURCES.md)
network:
  egress:
    - "*.azurecr.io"
    - "login.microsoftonline.com"
    - "management.azure.com"
changelog: |
  1.0.2: Pin refresh 2026-11-25 — azure-cli now installed from Microsoft's resolute (Ubuntu 26.04 LTS) repo instead of noble, the newest release it serves and the closest to the 26.10 base. Overrides azure-cli's bundled urllib3 2.8.0, oauthlib 4.0.1, cryptography 50.0.2 and pyopenssl 26.4.0, clearing 7 fixable High findings. Rebuilt on the refreshed base images (Ubuntu 26.10 security updates).
  1.0.1: Pin refresh 2026-11-18 — Dropped the pyjwt 2.15.1 override; azure-cli 2.93.0 bundles the patched PyJWT 2.15.0.
  1.0.0: Initial Official catalog release. Runs as the non-root `plugin` user (uid 1000); every download pinned and digest-verified.

name: ecr-push
description: Push container images to Amazon ECR with AWS CLI authentication, Docker Buildx support and a trivy scan of the built image using AWS CDK CodeBuildStep
keywords:
  - container
  - docker
  - ecr
  - registry
category: artifact
version: 1.1.0
pluginType: CodeBuildStep
computeType: MEDIUM
timeout: 15
failureBehavior: fail
secrets: []
primaryOutputDirectory: registry-output
dockerfile: Dockerfile
installCommands:
  - test -d registry-output || mkdir -p registry-output
  - docker --version
  - docker buildx version
  - aws --version
  # Authenticate with ECR
  - |
    set -e
    echo "Logging into Amazon ECR..."
    AWS_ACCOUNT_ID="${AWS_ACCOUNT_ID:-$(aws sts get-caller-identity --query Account --output text)}"
    aws ecr get-login-password --region ${AWS_REGION} \
      | docker login --username AWS --password-stdin \
      ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com
commands:
  - |
    set -e
    if [ -z "${ECR_REPOSITORY}" ]; then
      echo "ERROR: ECR_REPOSITORY must be set"
      exit 1
    fi
    AWS_ACCOUNT_ID="${AWS_ACCOUNT_ID:-$(aws sts get-caller-identity --query Account --output text)}"
    FULL_IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}"
    echo "Building image: ${FULL_IMAGE}"
    docker build \
      -f "${DOCKERFILE_PATH}" \
      -t "${FULL_IMAGE}" \
      "${DOCKER_CONTEXT}"
    docker inspect "${FULL_IMAGE}" > registry-output/image-metadata.json
    echo "${FULL_IMAGE}" > registry-output/image-name.txt
  # Scan the built image BEFORE pushing it. Report-only by default:
  # IMAGE_SCAN_FAIL_ON (e.g. CRITICAL or HIGH,CRITICAL) turns findings at
  # those severities into a failed step — it is your application image, so
  # the threshold is yours to set. A scan that cannot run (no vuln DB, no
  # daemon) fails the step: an unscanned image is not a clean one.
  - |
    set -e
    FULL_IMAGE=$(cat registry-output/image-name.txt)
    if [ "${IMAGE_SCAN}" = "false" ]; then
      echo "Image scan skipped (IMAGE_SCAN=false)"
    else
      mkdir -p registry-output/security
      echo "Scanning image: ${FULL_IMAGE}"
      trivy image --quiet --format json --output registry-output/security/trivy-image.json "${FULL_IMAGE}"
      trivy convert --format sarif --output registry-output/security/trivy-image.sarif registry-output/security/trivy-image.json
      trivy convert --format table --severity "${IMAGE_SCAN_SEVERITY}" registry-output/security/trivy-image.json
      if [ -n "${IMAGE_SCAN_FAIL_ON}" ]; then
        UNFIXED=""
        if [ "${IMAGE_SCAN_IGNORE_UNFIXED}" = "true" ]; then UNFIXED="--ignore-unfixed"; fi
        trivy image --quiet --skip-db-update --exit-code 1 --severity "${IMAGE_SCAN_FAIL_ON}" ${UNFIXED} --format table "${FULL_IMAGE}" \
          || { echo "ERROR: ${FULL_IMAGE} has ${IMAGE_SCAN_FAIL_ON} findings (IMAGE_SCAN_FAIL_ON) — not pushing"; exit 1; }
      fi
    fi
  - |
    set -e
    FULL_IMAGE=$(cat registry-output/image-name.txt)
    echo "Pushing image: ${FULL_IMAGE}"
    docker push "${FULL_IMAGE}"
    echo "Image pushed successfully: ${FULL_IMAGE}"
  # Optional: send the report(s) to the pipeline's security-report ingest.
  # PB_UPLOAD_SECURITY_REPORTS=true makes the synth inject the org's
  # reporting:ingest-scoped key as PB_SECURITY_REPORT_KEY (provision it with
  # `pipeline-manager infra store-token --scope reporting:ingest`). An upload
  # that fails is a warning, never a failed build.
  - |
    set -e
    if [ "${PB_UPLOAD_SECURITY_REPORTS:-false}" = "true" ]; then
      if [ -z "${PB_SECURITY_REPORT_KEY:-}" ] || [ -z "${PIPELINE_ID:-}" ]; then
        echo "ERROR: PB_UPLOAD_SECURITY_REPORTS=true but the upload key or PIPELINE_ID is missing (synthesize with an orgId + pipelineId)"
        exit 1
      fi
      if [ -n "${PLATFORM_CA_BUNDLE:-}" ]; then printf '%s\n' "$PLATFORM_CA_BUNDLE" > /tmp/pb-platform-ca.pem; set -- --cacert /tmp/pb-platform-ca.pem; fi
      for f in registry-output/security/trivy-image.sarif; do
        [ -s "$f" ] || continue
        case "$f" in *.sarif) FMT=sarif ;; *) FMT=trivy-json ;; esac
        jq -n --arg tool trivy --arg format "$FMT" --arg exec "${PIPELINE_EXECUTION_ID:-}" --slurpfile report "$f" \
          '{tool: $tool, format: $format, report: $report[0]} + (if $exec != "" then {executionId: $exec} else {} end)' \
          | curl -sSf "$@" -X POST -H "Authorization: Bearer ${PB_SECURITY_REPORT_KEY}" -H 'Content-Type: application/json' \
              --data-binary @- "${PLATFORM_BASE_URL}/api/pipelines/${PIPELINE_ID}/security-reports" > /dev/null \
          && echo "Uploaded $f" || echo "WARNING: could not upload $f to the platform (the build continues)"
      done
    fi
  - "echo \"ECR push complete.\""
env:
  ECR_REPOSITORY: ""
  IMAGE_TAG: latest
  DOCKERFILE_PATH: Dockerfile
  DOCKER_CONTEXT: "."
  AWS_REGION: "${AWS_REGION}"
  AWS_ACCOUNT_ID: ""
  IMAGE_SCAN: "true"
  IMAGE_SCAN_SEVERITY: HIGH,CRITICAL
  IMAGE_SCAN_FAIL_ON: ""
  IMAGE_SCAN_IGNORE_UNFIXED: "false"
  PB_UPLOAD_SECURITY_REPORTS: "false"

# ─── Catalog metadata (plugin-ecosystem W0.2) ───
license: Apache-2.0
homepageUrl: https://aws.amazon.com/ecr/
sourceUrl: https://github.com/mwashburn160/pipeline-builder/tree/main/deploy/plugins/artifact/ecr-push
# icon: none — AWS marks were removed from Simple Icons at AWS's request; no confirmed press-kit permission (monogram; see _icons/SOURCES.md)
network:
  egress:
    - "*.amazonaws.com"
    - "registry-1.docker.io"
    - "auth.docker.io"
    - "mirror.gcr.io"
    - "ghcr.io"
    - "pkg-containers.githubusercontent.com"
changelog: |
  1.1.0: Scans the built image with trivy before pushing (report-only by default; IMAGE_SCAN_FAIL_ON sets a fail threshold), writes JSON + SARIF to registry-output/security/, and can upload the SARIF to the platform (PB_UPLOAD_SECURITY_REPORTS=true).
  1.0.0: Initial Official catalog release. Runs as the non-root `plugin` user (uid 1000); every download pinned and digest-verified.

name: cargo-release
description: Cargo release binary build plugin for compiling optimized Rust binaries with cross-compilation support using AWS CDK CodeBuildStep
keywords:
  - rust
  - binary
  - cross-compilation
  - release
category: artifact
version: 1.0.0
pluginType: CodeBuildStep
computeType: MEDIUM
timeout: 30
failureBehavior: fail
secrets: []
primaryOutputDirectory: target/release
dockerfile: Dockerfile
installCommands:
  # Rust (cargo/rustc) is baked into pipeline-rust-base (single pinned version).
  - test -d target/release || mkdir -p target/release
  - cargo --version
  - |
    set -e
    if [ -n "${TARGET}" ]; then
      rustup target add ${TARGET}
    fi
  - if [ -f Cargo.toml ]; then cargo fetch; fi
commands:
  - |
    set -e
    echo "Building Rust release binary..."
    TARGET_ARG=""
    if [ -n "${TARGET}" ]; then
      TARGET_ARG="--target ${TARGET}"
    fi
    run-logged target/release/cargo-build.log -- cargo build --profile ${CARGO_PROFILE} --all-features ${TARGET_ARG}
  - "echo \"Cargo build complete. Binaries available in target/release/\""
env:
  CARGO_PROFILE: release
  TARGET: x86_64-unknown-linux-gnu

# ─── Catalog metadata (plugin-ecosystem W0.2) ───
license: Apache-2.0
homepageUrl: https://doc.rust-lang.org/cargo/
sourceUrl: https://github.com/mwashburn160/pipeline-builder/tree/main/deploy/plugins/artifact/cargo-release
icon: rust
network:
  egress:
    - "index.crates.io"
    - "static.crates.io"
changelog: |
  1.0.0: Initial Official catalog release. Runs as the non-root `plugin` user (uid 1000); every download pinned and digest-verified.

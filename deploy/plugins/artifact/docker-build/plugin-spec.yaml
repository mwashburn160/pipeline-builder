name: docker-build
description: Docker image build and push plugin supporting ECR, DockerHub, and custom registries with multi-stage builds, caching and a trivy scan of the built image using AWS CDK CodeBuildStep
keywords:
  - container
  - docker
  - build
  - multi-stage
category: artifact
version: 1.1.0
pluginType: CodeBuildStep
computeType: MEDIUM
timeout: 15
failureBehavior: fail
secrets:
  - name: DOCKER_USERNAME
    required: false
    description: "Docker registry username"
  - name: DOCKER_PASSWORD
    required: false
    description: "Docker registry password"
  - name: REGISTRY_USERNAME
    required: false
    description: "Custom registry username"
  - name: REGISTRY_PASSWORD
    required: false
    description: "Custom registry password"
primaryOutputDirectory: docker-output
dockerfile: Dockerfile
installCommands:
  - test -d docker-output || mkdir -p docker-output
  - docker --version
  - docker buildx version
  - aws --version
  # Registry login
  - |
    set -e
    case "${REGISTRY_TYPE}" in
      ecr)
        echo "Logging into Amazon ECR..."
        if [ -n "${ECR_REGISTRY}" ]; then
          aws ecr get-login-password --region ${AWS_REGION:-us-east-1} \
            | docker login --username AWS --password-stdin "${ECR_REGISTRY}"
        else
          echo "WARNING: ECR_REGISTRY not set. Set ECR_REGISTRY=123456789012.dkr.ecr.us-east-1.amazonaws.com"
        fi
        ;;
      dockerhub)
        echo "Logging into DockerHub..."
        if [ -n "${DOCKER_USERNAME}" ] && [ -n "${DOCKER_PASSWORD}" ]; then
          echo "${DOCKER_PASSWORD}" | docker login --username "${DOCKER_USERNAME}" --password-stdin
        else
          echo "WARNING: DOCKER_USERNAME/DOCKER_PASSWORD not set"
        fi
        ;;
      custom)
        echo "Logging into custom registry..."
        if [ -n "${REGISTRY_URL}" ] && [ -n "${REGISTRY_USERNAME}" ] && [ -n "${REGISTRY_PASSWORD}" ]; then
          echo "${REGISTRY_PASSWORD}" | docker login --username "${REGISTRY_USERNAME}" --password-stdin "${REGISTRY_URL}"
        else
          echo "WARNING: REGISTRY_URL/REGISTRY_USERNAME/REGISTRY_PASSWORD not set"
        fi
        ;;
      none)
        echo "Skipping registry login (build-only mode)"
        ;;
    esac
commands:
  - |
    set -e
    # Build args
    BUILD_ARGS=""
    if [ -n "${DOCKER_BUILD_ARGS}" ]; then
      for arg in ${DOCKER_BUILD_ARGS}; do
        BUILD_ARGS="${BUILD_ARGS} --build-arg ${arg}"
      done
    fi
    # Target stage
    TARGET_ARG=""
    if [ -n "${DOCKER_TARGET}" ]; then
      TARGET_ARG="--target ${DOCKER_TARGET}"
    fi
    # Cache
    CACHE_ARG=""
    if [ -n "${DOCKER_CACHE_FROM}" ]; then
      CACHE_ARG="--cache-from ${DOCKER_CACHE_FROM}"
    fi
    # Determine image name
    if [ -n "${IMAGE_NAME}" ]; then
      FULL_IMAGE="${IMAGE_NAME}:${IMAGE_TAG}"
    else
      echo "ERROR: IMAGE_NAME must be set (e.g., my-app or 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-app)"
      exit 1
    fi
    echo "Building image: ${FULL_IMAGE}"
    docker build \
      -f "${DOCKERFILE_PATH}" \
      -t "${FULL_IMAGE}" \
      ${BUILD_ARGS} \
      ${TARGET_ARG} \
      ${CACHE_ARG} \
      "${DOCKER_CONTEXT}"
    # Save image metadata
    docker inspect "${FULL_IMAGE}" > docker-output/image-metadata.json
    echo "${FULL_IMAGE}" > docker-output/image-name.txt
  # Scan the built image BEFORE pushing it. Report-only by default:
  # IMAGE_SCAN_FAIL_ON (e.g. CRITICAL or HIGH,CRITICAL) turns findings at
  # those severities into a failed step — it is your application image, so
  # the threshold is yours to set. A scan that cannot run (no vuln DB, no
  # daemon) fails the step: an unscanned image is not a clean one.
  - |
    set -e
    FULL_IMAGE=$(cat docker-output/image-name.txt)
    if [ "${IMAGE_SCAN}" = "false" ]; then
      echo "Image scan skipped (IMAGE_SCAN=false)"
    else
      mkdir -p docker-output/security
      echo "Scanning image: ${FULL_IMAGE}"
      trivy image --quiet --format json --output docker-output/security/trivy-image.json "${FULL_IMAGE}"
      trivy convert --format sarif --output docker-output/security/trivy-image.sarif docker-output/security/trivy-image.json
      trivy convert --format table --severity "${IMAGE_SCAN_SEVERITY}" docker-output/security/trivy-image.json
      if [ -n "${IMAGE_SCAN_FAIL_ON}" ]; then
        UNFIXED=""
        if [ "${IMAGE_SCAN_IGNORE_UNFIXED}" = "true" ]; then UNFIXED="--ignore-unfixed"; fi
        trivy image --quiet --skip-db-update --exit-code 1 --severity "${IMAGE_SCAN_FAIL_ON}" ${UNFIXED} --format table "${FULL_IMAGE}" \
          || { echo "ERROR: ${FULL_IMAGE} has ${IMAGE_SCAN_FAIL_ON} findings (IMAGE_SCAN_FAIL_ON) — not pushing"; exit 1; }
      fi
    fi
  # Push image (unless REGISTRY_TYPE=none)
  - |
    set -e
    FULL_IMAGE=$(cat docker-output/image-name.txt)
    if [ "${REGISTRY_TYPE}" != "none" ]; then
      echo "Pushing image: ${FULL_IMAGE}"
      docker push "${FULL_IMAGE}"
      echo "Image pushed successfully"
    else
      echo "Skipping push (REGISTRY_TYPE=none)"
    fi
  # Optional: send the report(s) to the pipeline's security-report ingest.
  # PB_UPLOAD_SECURITY_REPORTS=true makes the synth inject the org's
  # reporting:ingest-scoped key as PB_SECURITY_REPORT_KEY (provision it with
  # `pipeline-manager infra store-token --scope reporting:ingest`). An upload
  # that fails is a warning, never a failed build.
  - |
    set -e
    if [ "${PB_UPLOAD_SECURITY_REPORTS:-false}" = "true" ]; then
      if [ -z "${PB_SECURITY_REPORT_KEY:-}" ] || [ -z "${PIPELINE_ID:-}" ]; then
        echo "ERROR: PB_UPLOAD_SECURITY_REPORTS=true but the upload key or PIPELINE_ID is missing (synthesize with an orgId + pipelineId)"
        exit 1
      fi
      if [ -n "${PLATFORM_CA_BUNDLE:-}" ]; then printf '%s\n' "$PLATFORM_CA_BUNDLE" > /tmp/pb-platform-ca.pem; set -- --cacert /tmp/pb-platform-ca.pem; fi
      for f in docker-output/security/trivy-image.sarif; do
        [ -s "$f" ] || continue
        case "$f" in *.sarif) FMT=sarif ;; *) FMT=trivy-json ;; esac
        jq -n --arg tool trivy --arg format "$FMT" --arg exec "${PIPELINE_EXECUTION_ID:-}" --slurpfile report "$f" \
          '{tool: $tool, format: $format, report: $report[0]} + (if $exec != "" then {executionId: $exec} else {} end)' \
          | curl -sSf "$@" -X POST -H "Authorization: Bearer ${PB_SECURITY_REPORT_KEY}" -H 'Content-Type: application/json' \
              --data-binary @- "${PLATFORM_BASE_URL}/api/pipelines/${PIPELINE_ID}/security-reports" > /dev/null \
          && echo "Uploaded $f" || echo "WARNING: could not upload $f to the platform (the build continues)"
      done
    fi
  - "echo \"Docker build complete. Output available in docker-output/\""
env:
  DOCKERFILE_PATH: Dockerfile
  DOCKER_CONTEXT: "."
  DOCKER_BUILD_ARGS: ""
  DOCKER_TARGET: ""
  DOCKER_CACHE_FROM: ""
  REGISTRY_TYPE: ecr
  IMAGE_NAME: ""
  IMAGE_TAG: latest
  ECR_REGISTRY: ""
  REGISTRY_URL: ""
  IMAGE_SCAN: "true"
  IMAGE_SCAN_SEVERITY: HIGH,CRITICAL
  IMAGE_SCAN_FAIL_ON: ""
  IMAGE_SCAN_IGNORE_UNFIXED: "false"
  PB_UPLOAD_SECURITY_REPORTS: "false"

# ─── Catalog metadata (plugin-ecosystem W0.2) ───
license: Apache-2.0
homepageUrl: https://docs.docker.com/build/
sourceUrl: https://github.com/mwashburn160/pipeline-builder/tree/main/deploy/plugins/artifact/docker-build
icon: docker
network:
  egress:
    - "*.amazonaws.com"
    - "registry-1.docker.io"
    - "auth.docker.io"
    - "production.cloudflare.docker.com"
    - "mirror.gcr.io"
    - "ghcr.io"
    - "pkg-containers.githubusercontent.com"
changelog: |
  1.1.0: Scans the built image with trivy before pushing (report-only by default; IMAGE_SCAN_FAIL_ON sets a fail threshold), writes JSON + SARIF to docker-output/security/, and can upload the SARIF to the platform (PB_UPLOAD_SECURITY_REPORTS=true).
  1.0.0: Initial Official catalog release. Runs as the non-root `plugin` user (uid 1000); every download pinned and digest-verified.

name: terraform
description: Terraform infrastructure provisioning plugin with multi-version support, linting (TFLint), and security scanning (Trivy) using AWS CDK CodeBuildStep
keywords:
  - infrastructure-as-code
  - terraform
  - hcl
  - provision
category: deploy
version: 1.2.0
pluginType: CodeBuildStep
computeType: MEDIUM
timeout: 45
failureBehavior: fail
secrets: []
primaryOutputDirectory: tf-output
# Typed pipeline contracts — declare env-interpolated keys for upload-time
# validation. See notification/slack-notify and deploy/ecs-deploy for pattern.
metadataTypes:
  tfVersion: string
  tfWorkingDir: string
  tfAction: string  # plan | apply | destroy
  tfVarFile: string
  tfBackendConfig: string
  tfAutoApprove: boolean
dockerfile: Dockerfile
installCommands:
  # Terraform version selection
  - test -d tf-output || mkdir -p tf-output
  - |
    set -e
    tfenv use ${TF_VERSION} 2>/dev/null || tfenv install ${TF_VERSION} && tfenv use ${TF_VERSION}
  - terraform version
  - tflint --version
  - trivy --version
  - aws --version
commands:
  # Initialize Terraform
  - |
    set -e
    cd ${TF_WORKING_DIR}
    BACKEND_ARG=""
    if [ -n "${TF_BACKEND_CONFIG}" ] && [ -f "${TF_BACKEND_CONFIG}" ]; then
      BACKEND_ARG="-backend-config=${TF_BACKEND_CONFIG}"
    fi
    echo "Initializing Terraform..."
    terraform init ${BACKEND_ARG} -input=false
  # Lint and security scan
  - |
    set -e
    cd ${TF_WORKING_DIR}
    echo "Running TFLint..."
    tflint --init 2>/dev/null || true
    # tflint exits 2 when it FINDS issues and 1 when it fails to run. Blanket
    # `|| true` hid both, so a crashed linter wrote a truncated report and the
    # build went green with nothing scanned. Findings stay advisory (they are
    # collected as an artifact); a broken tool now fails the step.
    tflint --format=json > ${OLDPWD}/tf-output/tflint-results.json 2>&1 || [ $? -eq 2 ]
    echo "Running Trivy config scan..."
    # `--exit-code 0` keeps findings advisory by design, so any non-zero exit
    # here means the scan itself failed — and is allowed to fail the step.
    trivy config . --format json --exit-code 0 --output ${OLDPWD}/tf-output/trivy-config-results.json
  # Plan or Apply
  - |
    set -e
    cd ${TF_WORKING_DIR}
    VAR_FILE_ARG=""
    if [ -n "${TF_VAR_FILE}" ] && [ -f "${TF_VAR_FILE}" ]; then
      VAR_FILE_ARG="-var-file=${TF_VAR_FILE}"
    fi
    case "${TF_ACTION}" in
      plan)
        echo "Running Terraform plan..."
        terraform plan ${VAR_FILE_ARG} -input=false -out=${OLDPWD}/tf-output/tfplan
        terraform show -json ${OLDPWD}/tf-output/tfplan > ${OLDPWD}/tf-output/tfplan.json
        ;;
      apply)
        if [ "${TF_AUTO_APPROVE}" = "true" ]; then
          echo "Running Terraform apply (auto-approved)..."
          terraform apply ${VAR_FILE_ARG} -input=false -auto-approve
        else
          echo "Running Terraform plan (apply requires TF_AUTO_APPROVE=true)..."
          terraform plan ${VAR_FILE_ARG} -input=false -out=${OLDPWD}/tf-output/tfplan
        fi
        ;;
      destroy)
        if [ "${TF_AUTO_APPROVE}" = "true" ]; then
          echo "Running Terraform destroy (auto-approved)..."
          terraform destroy ${VAR_FILE_ARG} -input=false -auto-approve
        else
          echo "ERROR: Destroy requires TF_AUTO_APPROVE=true"
          exit 1
        fi
        ;;
      *)
        echo "ERROR: Unknown TF_ACTION '${TF_ACTION}'. Supported: plan, apply, destroy"
        exit 1
        ;;
    esac
  - "echo \"Terraform ${TF_ACTION} complete. Output available in tf-output/\""
env:
  TF_VERSION: "1.16.4"
  TF_WORKING_DIR: "."
  TF_ACTION: plan
  TF_VAR_FILE: ""
  TF_BACKEND_CONFIG: ""
  TF_AUTO_APPROVE: "false"

# Smoke test — runs after `docker build` in test-plugins.sh --build.
# Asserts the tool is on PATH and reports a version. Exit non-zero = test fail.
smokeTest: "terraform --version"

# ─── Catalog metadata (plugin-ecosystem W0.2) ───
license: Apache-2.0
homepageUrl: https://developer.hashicorp.com/terraform
sourceUrl: https://github.com/mwashburn160/pipeline-builder/tree/main/deploy/plugins/deploy/terraform
icon: terraform
network:
  egress:
    - "*.amazonaws.com"
    - "registry.terraform.io"
    - "releases.hashicorp.com"
changelog: |
  1.1.0: Initial Official catalog release. Runs as the non-root `plugin` user (uid 1000); every download pinned and digest-verified.

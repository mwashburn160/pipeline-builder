name: serverless-framework
description: Serverless Framework deployment plugin for deploying serverless applications to AWS, Azure, or GCP with stage and region configuration using AWS CDK CodeBuildStep
keywords:
  - serverless
  - lambda
  - multi-cloud
  - deploy
category: deploy
version: 1.3.0
pluginType: CodeBuildStep
computeType: MEDIUM
timeout: 30
failureBehavior: fail
secrets:
  # The v4 licence key is a CREDENTIAL, so it is declared here as part of the
  # plugin's contract rather than existing only as an undocumented `env:` entry.
  # It is what the catalog shows an operator they must supply, and it matches how
  # every other credential-taking plugin declares one (cargo-publish's
  # CARGO_REGISTRY_TOKEN, acr-push's AZURE_CLIENT_SECRET).
  #
  # `required: false`, and that has a CONSEQUENCE worth stating: pipeline-core
  # resolves only REQUIRED secrets from Secrets Manager, because CodeBuild treats
  # a SECRETS_MANAGER variable as mandatory and fails the build at DOWNLOAD_SOURCE
  # when the secret is absent — so `required: true` would break every pipeline
  # belonging to an operator who has not created the secret, including those
  # pinning a v3 image that needs no key at all. The practical effect is that this
  # declaration documents and surfaces the key; it does NOT by itself move the
  # value out of the plaintext env block. An operator who wants it out of the
  # synthesized template provisions it out-of-band today. Auto-injecting an
  # optional secret only when the org has actually provisioned it would need a
  # change in pipeline-core, not here.
  - name: SERVERLESS_ACCESS_KEY
    required: false
    description: "Serverless Framework v4 licence key (serverless.com dashboard)"
primaryOutputDirectory: serverless-output
dockerfile: Dockerfile
installCommands:
  - test -d serverless-output || mkdir -p serverless-output
  - |
    set -e
    export PATH="${NVM_DIR}/versions/node/v${NODE_VERSION}/bin:${PATH}"
  - serverless --version
  - aws --version
  # Install project dependencies
  - |
    set -e
    cd ${SLS_SERVICE_PATH}
    if [ -f package.json ]; then
      if [ -f package-lock.json ]; then npm ci; else npm install; fi
    fi
    if [ -f requirements.txt ]; then
      pip3 install --break-system-packages -r requirements.txt
    fi
commands:
  - |
    set -e
    export PATH="${NVM_DIR}/versions/node/v${NODE_VERSION}/bin:${PATH}"
    cd ${SLS_SERVICE_PATH}
    REGION_ARG=""
    if [ -n "${SLS_REGION}" ]; then
      REGION_ARG="--region ${SLS_REGION}"
    fi
    # v4 requires a licence key. Without it `serverless deploy` fails partway
    # through with an auth error that reads like a broken plugin, so check
    # first and say exactly what is missing. Exits NON-ZERO: a deploy step that
    # cannot run must go red, never echo-and-continue.
    if [ -z "${SERVERLESS_ACCESS_KEY}" ]; then
      echo "ERROR: SERVERLESS_ACCESS_KEY is not set." >&2
      echo "Serverless Framework v4 requires a licence key to deploy." >&2
      echo "Set it as a pipeline secret, or pin this plugin to a v3 image." >&2
      exit 1
    fi
    echo "Deploying with Serverless Framework (stage: ${SLS_STAGE})..."
    # Capture serverless's real exit (POSIX has no PIPESTATUS): redirect, then cat.
    _rc=0
    serverless deploy \
      --stage ${SLS_STAGE} \
      ${REGION_ARG} \
      --verbose \
      > ${OLDPWD}/serverless-output/deploy.txt 2>&1 || _rc=$?
    cat ${OLDPWD}/serverless-output/deploy.txt
    [ "${_rc:-0}" -eq 0 ]
    serverless info \
      --stage ${SLS_STAGE} \
      ${REGION_ARG} \
      > ${OLDPWD}/serverless-output/info.txt 2>&1 || true
  - "echo \"Serverless deploy complete. Output available in serverless-output/\""
env:
  NODE_VERSION: "26"
  # REQUIRED by Serverless Framework v4 (the v3 images needed no key). Declared
  # in `secrets:` above as the plugin's contract; empty here so the guard in
  # `commands:` can detect an unset key and refuse to run rather than failing
  # deep inside serverless.
  SERVERLESS_ACCESS_KEY: ""
  SLS_STAGE: dev
  SLS_REGION: ""
  SLS_SERVICE_PATH: "."

# ─── Catalog metadata (plugin-ecosystem W0.2) ───
license: Apache-2.0
homepageUrl: https://www.serverless.com
sourceUrl: https://github.com/mwashburn160/pipeline-builder/tree/main/deploy/plugins/deploy/serverless-framework
icon: serverless
network:
  egress:
    - "*.amazonaws.com"
    - "registry.npmjs.org"
    - "registry.yarnpkg.com"
    - "pypi.org"
    - "files.pythonhosted.org"
changelog: |
  1.3.0: SERVERLESS_ACCESS_KEY is now declared in `secrets:` (optional), so the
  v4 licence key appears in the plugin's contract instead of only in `env:`.
  Behaviour is unchanged: optional secrets are not auto-injected, so the key is
  still read from the environment.
  1.0.0: Initial Official catalog release. Runs as the non-root `plugin` user (uid 1000); every download pinned and digest-verified.

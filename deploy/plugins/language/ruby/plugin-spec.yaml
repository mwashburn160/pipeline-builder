name: ruby
description: Ruby plugin for building and testing Ruby applications using Bundler with AWS CDK CodeBuildStep
keywords:
  - ruby
  - bundler
  - build
  - test
category: language
version: 1.0.0
pluginType: CodeBuildStep
computeType: MEDIUM
timeout: 15
failureBehavior: fail
secrets: []
primaryOutputDirectory: '**/*'
dockerfile: Dockerfile
installCommands:
  # Ruby + bundler are baked into pipeline-ruby-base (single pinned version).
  - ruby --version
  # Install project dependencies (bundler is baked; deps come from the Gemfile).
  - if [ -f Gemfile.lock ]; then bundle install; elif [ -f Gemfile ]; then bundle install; fi
commands:
  - |
    set -e
    if bundle exec rspec --version > /dev/null 2>&1; then
      echo "Running RSpec..."
      bundle exec rspec --format documentation --format RspecJunitFormatter --out junit/test-results.xml 2>/dev/null || bundle exec rspec --format documentation
    elif bundle exec rake -T test > /dev/null 2>&1; then
      echo "Running Rake test..."
      bundle exec rake test
    elif [ -f Rakefile ]; then
      echo "Running default Rake task..."
      bundle exec rake
    else
      echo "No test framework detected. Skipping tests."
    fi

# ─── Catalog metadata (plugin-ecosystem W0.2) ───
license: Apache-2.0
homepageUrl: https://www.ruby-lang.org
sourceUrl: https://github.com/mwashburn160/pipeline-builder/tree/main/deploy/plugins/language/ruby
icon: ruby
network:
  egress:
    - "rubygems.org"
    - "index.rubygems.org"
changelog: |
  1.0.0: Initial Official catalog release. Runs as the non-root `plugin` user (uid 1000); every download pinned and digest-verified.

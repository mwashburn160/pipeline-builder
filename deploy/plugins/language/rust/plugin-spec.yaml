name: rust
description: Rust plugin for building and testing Rust applications using Cargo with AWS CDK CodeBuildStep
keywords:
  - rust
  - cargo
  - build
  - test
category: language
version: 1.0.3
pluginType: CodeBuildStep
computeType: MEDIUM
timeout: 15
failureBehavior: fail
secrets: []
primaryOutputDirectory: '**/*'
dockerfile: Dockerfile
installCommands:
  # Rust (cargo/rustc/clippy/rustfmt) is baked into plugin-rust-base.
  - test -d build-reports || mkdir -p build-reports
  - cargo --version
  - if [ -f Cargo.toml ]; then cargo fetch; fi
commands:
  - run-logged build-reports/build.log -- cargo build --release
  - run-logged build-reports/test.log -- cargo test --release
  - run-logged build-reports/clippy.log -- cargo clippy -- -D warnings
  - run-logged build-reports/fmt.log -- cargo fmt -- --check

# Smoke test — runs after `docker build` in test-plugins.sh --build.
# Asserts every tool the commands above invoke is on PATH and runs.
smokeTest: "cargo --version && rustc --version && cargo clippy --version && cargo fmt --version && command -v run-logged"

# ─── Catalog metadata (plugin-ecosystem W0.2) ───
license: Apache-2.0
homepageUrl: https://www.rust-lang.org
sourceUrl: https://github.com/mwashburn160/pipeline-builder/tree/main/deploy/plugins/language/rust
icon: rust
network:
  egress:
    - "index.crates.io"
    - "static.crates.io"
changelog: |
  1.0.3: Pin refresh 2026-11-25 — Rebuilt on the refreshed base images (Ubuntu 26.10 security updates).
  1.0.2: Pin refresh 2026-11-18 — Rebuilt on the refreshed base images (Ubuntu 26.10 digest refresh).
  1.0.1: Pin refresh 2026-11-13 — Rebuilt on the refreshed base images (Rust 1.100.0).
  1.0.0: Initial Official catalog release. Runs as the non-root `plugin` user (uid 1000); every download pinned and digest-verified.

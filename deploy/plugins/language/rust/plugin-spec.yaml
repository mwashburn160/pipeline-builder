name: rust
description: Rust plugin for building and testing Rust applications using Cargo with AWS CDK CodeBuildStep
keywords:
  - rust
  - cargo
  - build
  - test
category: language
version: 1.0.0
pluginType: CodeBuildStep
computeType: MEDIUM
timeout: 15
failureBehavior: fail
secrets: []
primaryOutputDirectory: '**/*'
dockerfile: Dockerfile
installCommands:
  # Rust (cargo/rustc/clippy/rustfmt) is baked into pipeline-rust-base.
  - test -d build-reports || mkdir -p build-reports
  - cargo --version
  - if [ -f Cargo.toml ]; then cargo fetch; fi
commands:
  - run-logged build-reports/build.log -- cargo build --release
  - run-logged build-reports/test.log -- cargo test --release
  - run-logged build-reports/clippy.log -- cargo clippy -- -D warnings
  - run-logged build-reports/fmt.log -- cargo fmt -- --check

# ─── Catalog metadata (plugin-ecosystem W0.2) ───
license: Apache-2.0
homepageUrl: https://www.rust-lang.org
sourceUrl: https://github.com/mwashburn160/pipeline-builder/tree/main/deploy/plugins/language/rust
icon: rust
network:
  egress:
    - "index.crates.io"
    - "static.crates.io"
changelog: |
  1.0.0: Initial Official catalog release. Runs as the non-root `plugin` user (uid 1000); every download pinned and digest-verified.

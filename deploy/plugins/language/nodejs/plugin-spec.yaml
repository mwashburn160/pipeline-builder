name: nodejs
description: Node.js plugin for building and testing JavaScript/TypeScript applications using npm, Yarn, or pnpm with AWS CDK CodeBuildStep
keywords:
  - nodejs
  - javascript
  - typescript
  - npm
category: language
version: 1.0.0
pluginType: CodeBuildStep
computeType: MEDIUM
timeout: 15
failureBehavior: fail
secrets: []
primaryOutputDirectory: '**/*'
dockerfile: Dockerfile
installCommands:
  # Node + npm are baked into pipeline-node-base (single pinned version).
  - node --version && npm --version
  # Auto-detect or use explicit package manager, then install project deps.
  - |
    set -e
    PKG="${PACKAGE_MANAGER}"
    if [ "${PKG}" = "auto" ]; then
      if [ -f pnpm-lock.yaml ]; then
        PKG="pnpm"
      elif [ -f yarn.lock ]; then
        PKG="yarn"
      else
        PKG="npm"
      fi
    fi
    echo "Package manager: ${PKG}"
    case "${PKG}" in
      npm)
        if [ -f package-lock.json ]; then npm ci; else npm install; fi
        ;;
      yarn)
        npm install -g yarn
        yarn install --frozen-lockfile
        ;;
      pnpm)
        npm install -g pnpm
        pnpm install --frozen-lockfile
        ;;
      *)
        echo "ERROR: Unknown PACKAGE_MANAGER '${PKG}'. Supported: auto, npm, yarn, pnpm"
        exit 1
        ;;
    esac
commands:
  - |
    set -e
    PKG="${PACKAGE_MANAGER}"
    if [ "${PKG}" = "auto" ]; then
      if [ -f pnpm-lock.yaml ]; then PKG="pnpm"
      elif [ -f yarn.lock ]; then PKG="yarn"
      else PKG="npm"; fi
    fi
    case "${PKG}" in
      npm)  npm run build && npm test ;;
      yarn) yarn build && yarn test ;;
      pnpm) pnpm build && pnpm test ;;
    esac
env:
  PACKAGE_MANAGER: auto

# ─── Catalog metadata (plugin-ecosystem W0.2) ───
license: Apache-2.0
homepageUrl: https://nodejs.org
sourceUrl: https://github.com/mwashburn160/pipeline-builder/tree/main/deploy/plugins/language/nodejs
icon: nodejs
network:
  egress:
    - "registry.npmjs.org"
    - "registry.yarnpkg.com"
changelog: |
  1.0.0: Initial Official catalog release. Runs as the non-root `plugin` user (uid 1000); every download pinned and digest-verified.

name: snyk-go
description: Snyk security scanning for Go projects using AWS CDK with CodeBuildStep
keywords:
  - go
  - sca
  - vulnerability
  - dependency-scan
category: security
version: 1.0.0
pluginType: CodeBuildStep
computeType: SMALL
timeout: 15
failureBehavior: warn
secrets:
  - name: SNYK_TOKEN
    required: true
    description: "Snyk authentication token"
primaryOutputDirectory: snyk-reports
dockerfile: Dockerfile
installCommands:
  # Go is baked into pipeline-go-base (single pinned version).
  - test -d snyk-reports || mkdir -p snyk-reports
  - snyk --version
  - |
    set -e
    if [ -f go.mod ]; then go mod download; fi
commands:
  - run-logged snyk-reports/snyk-test.log -- snyk test --severity-threshold=${SNYK_SEVERITY_THRESHOLD} --json-file-output=snyk-reports/snyk-test-results.json
  - run-logged snyk-reports/snyk-code.log -- snyk code test --severity-threshold=${SNYK_SEVERITY_THRESHOLD} --json-file-output=snyk-reports/snyk-code-results.json
  - "echo \"Snyk scan complete. Reports available in snyk-reports/\""
env:
  # GO_VERSION is baked into pipeline-go-base (single-version model).
  SNYK_SEVERITY_THRESHOLD: high

# ─── Catalog metadata (plugin-ecosystem W0.2) ───
license: Apache-2.0
homepageUrl: https://docs.snyk.io/snyk-cli
sourceUrl: https://github.com/mwashburn160/pipeline-builder/tree/main/deploy/plugins/security/snyk-go
icon: { key: snyk, badge: go }
network:
  egress:
    - "api.snyk.io"
    - "proxy.golang.org"
    - "sum.golang.org"
changelog: |
  1.0.0: Initial Official catalog release. Runs as the non-root `plugin` user (uid 1000); every download pinned and digest-verified.

name: sonarcloud-dotnet
description: SonarCloud code quality and security analysis for .NET projects using AWS CDK with CodeBuildStep
keywords:
  - dotnet
  - code-quality
  - security-analysis
  - coverage
category: security
version: 1.0.0
pluginType: CodeBuildStep
computeType: SMALL
timeout: 15
failureBehavior: fail
secrets:
  - name: SONAR_TOKEN
    required: true
    description: "SonarCloud authentication token"
primaryOutputDirectory: .scannerwork
dockerfile: Dockerfile
installCommands:
  # .NET runtime + sonar-scanner are baked into the image (base + COPY).
  - test -d .scannerwork || mkdir -p .scannerwork
  - dotnet --version && sonar-scanner --version
  - |
    set -e
    if ls *.sln *.csproj 1>/dev/null 2>&1; then dotnet restore; fi
commands:
  - |
    set -e
    run-logged .scannerwork/sonar-scanner.log -- sonar-scanner \
      -Dsonar.host.url=https://sonarcloud.io \
      -Dsonar.organization=${SONAR_ORGANIZATION} \
      -Dsonar.projectKey=${SONAR_PROJECT_KEY} \
      -Dsonar.sources=. \
      -Dsonar.qualitygate.wait=true \
      -Dsonar.sourceEncoding=UTF-8
  - "echo \"SonarCloud analysis complete.\""
env:
  SONAR_ORGANIZATION: ""
  SONAR_PROJECT_KEY: ""

# ─── Catalog metadata (plugin-ecosystem W0.2) ───
license: Apache-2.0
homepageUrl: https://docs.sonarsource.com/sonarqube-cloud/
sourceUrl: https://github.com/mwashburn160/pipeline-builder/tree/main/deploy/plugins/security/sonarcloud-dotnet
icon: { key: sonarcloud, badge: dotnet }
network:
  egress:
    - "sonarcloud.io"
    - "api.sonarcloud.io"
    - "scanner.sonarcloud.io"
    - "api.nuget.org"
changelog: |
  1.0.0: Initial Official catalog release. Runs as the non-root `plugin` user (uid 1000); every download pinned and digest-verified.

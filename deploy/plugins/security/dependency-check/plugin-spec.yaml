name: dependency-check
description: OWASP Dependency-Check software composition analysis (SCA) plugin for scanning project dependencies for known CVEs using AWS CDK CodeBuildStep
keywords:
  - owasp
  - sca
  - dependency-scan
  - cve
category: security
version: 1.0.0
pluginType: CodeBuildStep
computeType: MEDIUM
timeout: 30
failureBehavior: warn
secrets:
  - name: NVD_API_KEY
    required: false
    description: "NVD API key for enhanced vulnerability data"
primaryOutputDirectory: dc-reports
dockerfile: Dockerfile
installCommands:
  # Dependency-Check version selection
  - test -d dc-reports || mkdir -p dc-reports
  - |
    set -e
    if [ -d /opt/dependency-check/versions/dc-${DC_VERSION} ]; then
      ln -sfn /opt/dependency-check/versions/dc-${DC_VERSION} /opt/dependency-check/current
    else
      echo "ERROR: Dependency-Check ${DC_VERSION} is not in this image (only pinned builds are). Available: $(ls /opt/dependency-check/versions | sed 's/^dc-//' | tr '\n' ' ')" >&2
      exit 1
    fi
  - dependency-check.sh --version
  # Install project dependencies for accurate scanning
  - |
    set -e
    echo "Resolving project dependencies..."
    if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm install; fi
    if [ -f yarn.lock ]; then npm install -g yarn && yarn install --frozen-lockfile; fi
    if [ -f pnpm-lock.yaml ]; then npm install -g pnpm && pnpm install --frozen-lockfile; fi
    if [ -f requirements.txt ]; then pip3 install -r requirements.txt; fi
    if [ -f Pipfile.lock ]; then pip3 install pipenv && pipenv install --system; fi
    if [ -f go.mod ]; then go mod download; fi
    if ls *.sln >/dev/null 2>&1 || ls *.csproj >/dev/null 2>&1; then dotnet restore 2>/dev/null || true; fi
commands:
  - |
    set -e
    SUPPRESSION_ARG=""
    if [ -n "${DC_SUPPRESSION_FILE}" ] && [ -f "${DC_SUPPRESSION_FILE}" ]; then
      SUPPRESSION_ARG="--suppression ${DC_SUPPRESSION_FILE}"
    fi
    NVD_ARG=""
    if [ -n "${NVD_API_KEY}" ]; then
      NVD_ARG="--nvdApiKey ${NVD_API_KEY}"
    fi
    dependency-check.sh \
      --scan . \
      --out dc-reports \
      --format ${DC_FORMAT} \
      --failOnCVSS ${DC_FAIL_ON_CVSS} \
      ${NVD_ARG} \
      ${SUPPRESSION_ARG} \
      --enableExperimental
  - "echo \"Dependency-Check scan complete. Reports available in dc-reports/\""
env:
  DC_VERSION: "13.0.0"
  DC_FAIL_ON_CVSS: "7"
  DC_FORMAT: JSON
  DC_SUPPRESSION_FILE: ""

# Smoke test — runs after `docker build` in test-plugins.sh --build.
# Asserts the tool is on PATH and produces a deterministic version output.
smokeTest: "dependency-check.sh --version"

# ─── Catalog metadata (plugin-ecosystem W0.2) ───
license: Apache-2.0
homepageUrl: https://owasp.org/www-project-dependency-check/
sourceUrl: https://github.com/mwashburn160/pipeline-builder/tree/main/deploy/plugins/security/dependency-check
icon: dependencycheck
network:
  egress:
    - "services.nvd.nist.gov"
    - "nvd.nist.gov"
    - "www.cisa.gov"
    - "jeremylong.github.io"
    - "search.maven.org"
    - "repo1.maven.org"
    - "ossindex.sonatype.org"
    - "registry.npmjs.org"
    - "registry.yarnpkg.com"
    - "pypi.org"
    - "files.pythonhosted.org"
changelog: |
  1.0.0: Initial Official catalog release. Runs as the non-root `plugin` user (uid 1000); every download pinned and digest-verified.

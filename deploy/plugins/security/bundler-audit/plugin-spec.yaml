name: bundler-audit
description: Bundler Audit plugin for scanning Ruby gem dependencies for known security vulnerabilities using AWS CDK CodeBuildStep
keywords:
  - ruby
  - gem
  - dependency-scan
  - cve
category: security
version: 1.0.0
pluginType: CodeBuildStep
computeType: SMALL
timeout: 10
failureBehavior: warn
secrets: []
primaryOutputDirectory: audit-reports
dockerfile: Dockerfile
installCommands:
  # Ruby + bundler-audit are baked into pipeline-ruby-base (single pinned version).
  - test -d audit-reports || mkdir -p audit-reports
  - ruby --version && bundle-audit version
  - if [ -f Gemfile ]; then bundle install; fi
commands:
  - |
    set -e
    echo "Running bundler-audit..."
    # run-logged streams to console + log AND surfaces bundle-audit's real exit
    # (POSIX sh has no pipefail, so a `| tee` would mask the gate's status).
    run-logged audit-reports/bundler-audit.log -- bundle audit check --update
  - "echo \"Bundler audit complete. Reports available in audit-reports/\""

# ─── Catalog metadata (plugin-ecosystem W0.2) ───
license: Apache-2.0
homepageUrl: https://github.com/rubysec/bundler-audit
sourceUrl: https://github.com/mwashburn160/pipeline-builder/tree/main/deploy/plugins/security/bundler-audit
# icon: none — no mark in Simple Icons 16.32.0; no confirmed vendor press-kit permission (monogram; see _icons/SOURCES.md)
network:
  egress:
    - "github.com"
changelog: |
  1.0.0: Initial Official catalog release. Runs as the non-root `plugin` user (uid 1000); every download pinned and digest-verified.

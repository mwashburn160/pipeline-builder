name: docker-lint
description: Docker linting and container security plugin using Hadolint for Dockerfile best practices and Dockle for CIS benchmark compliance using AWS CDK CodeBuildStep
keywords:
  - docker
  - hadolint
  - dockle
  - best-practices
category: security
version: 1.0.0
pluginType: CodeBuildStep
computeType: SMALL
timeout: 30
failureBehavior: warn
secrets: []
primaryOutputDirectory: docker-lint-reports
dockerfile: Dockerfile
installCommands:
  # Hadolint version selection
  - test -d docker-lint-reports || mkdir -p docker-lint-reports
  - |
    set -e
    if [ -f /opt/hadolint/versions/hadolint-${HADOLINT_VERSION} ]; then
      ln -sf /opt/hadolint/versions/hadolint-${HADOLINT_VERSION} /opt/hadolint/bin/hadolint
    else
      echo "ERROR: Hadolint ${HADOLINT_VERSION} is not in this image (only pinned, checksum-verified builds are). Available: $(ls /opt/hadolint/versions | sed 's/^hadolint-//' | tr '\n' ' ')" >&2
      exit 1
    fi
  - hadolint --version
  # Dockle version selection
  - |
    set -e
    if [ -f /opt/dockle/versions/dockle-${DOCKLE_VERSION} ]; then
      ln -sf /opt/dockle/versions/dockle-${DOCKLE_VERSION} /opt/dockle/bin/dockle
    else
      echo "ERROR: Dockle ${DOCKLE_VERSION} is not in this image (only pinned, checksum-verified builds are). Available: $(ls /opt/dockle/versions | sed 's/^dockle-//' | tr '\n' ' ')" >&2
      exit 1
    fi
  - dockle --version
commands:
  # Hadolint — lint all Dockerfiles found in the project
  - |
    set -e
    echo "Running Hadolint on Dockerfiles..."
    FOUND_DOCKERFILES=false
    for df in $(find . -name "Dockerfile*" -not -path "*/node_modules/*" -not -path "*/.git/*"); do
      FOUND_DOCKERFILES=true
      echo "Linting: ${df}"
      hadolint --format ${HADOLINT_FORMAT} \
        --failure-threshold ${HADOLINT_SEVERITY} \
        "${df}" > "docker-lint-reports/hadolint-$(echo ${df} | tr '/' '-' | sed 's/^.-//').json" 2>&1
    done
    if [ "${FOUND_DOCKERFILES}" = "false" ]; then
      echo "No Dockerfiles found to lint"
    fi
  # Dockle — audit a built container image (if DOCKER_IMAGE is set)
  - |
    set -e
    if [ -n "${DOCKER_IMAGE}" ]; then
      echo "Running Dockle on image: ${DOCKER_IMAGE}..."
      dockle --format ${DOCKLE_FORMAT} \
        --output docker-lint-reports/dockle-results.json \
        "${DOCKER_IMAGE}"
    else
      echo "DOCKER_IMAGE not set — skipping Dockle container image audit"
      echo "Set DOCKER_IMAGE=your-image:tag to enable container scanning"
    fi
  - "echo \"Docker lint complete. Reports available in docker-lint-reports/\""
env:
  HADOLINT_VERSION: "2.15.1"
  DOCKLE_VERSION: "0.4.15"
  DOCKER_IMAGE: ""
  HADOLINT_FORMAT: json
  DOCKLE_FORMAT: json
  HADOLINT_SEVERITY: warning

# Smoke test — runs after `docker build` in test-plugins.sh --build.
# Asserts the tool is on PATH and produces a deterministic version output.
smokeTest: "hadolint --version && dockle --version"

# ─── Catalog metadata (plugin-ecosystem W0.2) ───
license: Apache-2.0
homepageUrl: https://github.com/hadolint/hadolint
sourceUrl: https://github.com/mwashburn160/pipeline-builder/tree/main/deploy/plugins/security/docker-lint
# icon: none — runs Hadolint/Dockle, which have no mark in Simple Icons; Docker's mark would misattribute the tool (monogram; see _icons/SOURCES.md)
# network.egress: none declared — the step contacts no fixed external host
changelog: |
  1.0.0: Initial Official catalog release. Runs as the non-root `plugin` user (uid 1000); every download pinned and digest-verified.

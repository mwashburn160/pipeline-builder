name: cargo-audit
description: Cargo audit plugin for scanning Rust crate dependencies for known security vulnerabilities using AWS CDK CodeBuildStep
keywords:
  - rust
  - crate
  - dependency-scan
  - cve
category: security
version: 1.0.0
pluginType: CodeBuildStep
computeType: SMALL
timeout: 10
failureBehavior: warn
secrets: []
primaryOutputDirectory: audit-reports
dockerfile: Dockerfile
installCommands:
  # Rust + cargo-audit are baked into the image (single pinned version).
  - test -d audit-reports || mkdir -p audit-reports
  - cargo --version
commands:
  - |
    set -e
    echo "Running cargo audit..."
    cargo audit --json > audit-reports/cargo-audit.json 2>&1 || true
    run-logged audit-reports/cargo-audit.log -- cargo audit || true
  - "echo \"Cargo audit complete. Reports available in audit-reports/\""

# ─── Catalog metadata (plugin-ecosystem W0.2) ───
license: Apache-2.0
homepageUrl: https://rustsec.org
sourceUrl: https://github.com/mwashburn160/pipeline-builder/tree/main/deploy/plugins/security/cargo-audit
# icon: none — no mark in Simple Icons 16.32.0; no confirmed vendor press-kit permission (monogram; see _icons/SOURCES.md)
network:
  egress:
    - "github.com"
    - "index.crates.io"
    - "static.crates.io"
changelog: |
  1.0.0: Initial Official catalog release. Runs as the non-root `plugin` user (uid 1000); every download pinned and digest-verified.

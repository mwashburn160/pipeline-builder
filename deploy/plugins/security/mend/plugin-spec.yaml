name: mend
description: Mend (formerly WhiteSource) SCA plugin for scanning dependencies for known CVEs and OSS license compliance using AWS CDK CodeBuildStep
keywords:
  - sca
  - dependency-scan
  - license
  - cve
category: security
version: 1.0.0
pluginType: CodeBuildStep
computeType: SMALL
timeout: 30
failureBehavior: warn
secrets:
  - name: MEND_API_KEY
    required: true
    description: "Mend API key"
  - name: MEND_ORG_TOKEN
    required: true
    description: "Mend organization token"
primaryOutputDirectory: mend-reports
dockerfile: Dockerfile
installCommands:
  - test -d mend-reports || mkdir -p mend-reports
  - mend --version 2>/dev/null || echo "Mend CLI ready"
  - |
    set -e
    if [ -z "${MEND_API_KEY}" ]; then
      echo "WARNING: MEND_API_KEY must be injected via CodeBuild secrets"
    fi
commands:
  - |
    set -e
    echo "Running Mend ${MEND_SCAN_TYPE} scan..."
    case "${MEND_SCAN_TYPE}" in
      sca)
        mend sca \
          --url "${MEND_URL}" \
          --api-key "${MEND_API_KEY}" \
          --org-token "${MEND_ORG_TOKEN}" \
          --product "${MEND_PRODUCT_NAME}" \
          --project "${MEND_PROJECT_NAME}" \
          --dir . \
          --report \
          --report-dir mend-reports
        ;;
      image)
        mend image \
          --url "${MEND_URL}" \
          --api-key "${MEND_API_KEY}" \
          --dir . \
          --report \
          --report-dir mend-reports
        ;;
    esac
  - "echo \"Mend scan complete. Reports available in mend-reports/\""
env:
  MEND_URL: https://saas.mend.io
  MEND_PRODUCT_NAME: ""
  MEND_PROJECT_NAME: ""
  MEND_SCAN_TYPE: sca

# ─── Catalog metadata (plugin-ecosystem W0.2) ───
license: Apache-2.0
homepageUrl: https://docs.mend.io
sourceUrl: https://github.com/mwashburn160/pipeline-builder/tree/main/deploy/plugins/security/mend
# icon: none — Mend mark was removed from Simple Icons at the vendor's request; no confirmed press-kit permission (monogram; see _icons/SOURCES.md)
network:
  egress:
    - "saas.mend.io"
    - "*.mend.io"
changelog: |
  1.0.0: Initial Official catalog release. Runs as the non-root `plugin` user (uid 1000); every download pinned and digest-verified.

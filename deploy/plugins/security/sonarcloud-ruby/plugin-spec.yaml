name: sonarcloud-ruby
description: SonarCloud code quality and security analysis for Ruby projects using AWS CDK with CodeBuildStep
keywords:
  - ruby
  - code-quality
  - security-analysis
  - coverage
category: security
version: 1.0.0
pluginType: CodeBuildStep
computeType: SMALL
timeout: 15
failureBehavior: fail
secrets:
  - name: SONAR_TOKEN
    required: true
    description: "SonarCloud authentication token"
primaryOutputDirectory: .scannerwork
dockerfile: Dockerfile
installCommands:
  # Ruby runtime + sonar-scanner are baked into the image (base + COPY).
  - test -d .scannerwork || mkdir -p .scannerwork
  - ruby --version && sonar-scanner --version
  - |
    set -e
    gem install bundler
    if [ -f Gemfile.lock ]; then bundle install; fi
commands:
  - |
    set -e
    run-logged .scannerwork/sonar-scanner.log -- sonar-scanner \
      -Dsonar.host.url=https://sonarcloud.io \
      -Dsonar.organization=${SONAR_ORGANIZATION} \
      -Dsonar.projectKey=${SONAR_PROJECT_KEY} \
      -Dsonar.sources=. \
      -Dsonar.qualitygate.wait=true \
      -Dsonar.sourceEncoding=UTF-8
  - "echo \"SonarCloud analysis complete.\""
env:
  SONAR_ORGANIZATION: ""
  SONAR_PROJECT_KEY: ""

# ─── Catalog metadata (plugin-ecosystem W0.2) ───
license: Apache-2.0
homepageUrl: https://docs.sonarsource.com/sonarqube-cloud/
sourceUrl: https://github.com/mwashburn160/pipeline-builder/tree/main/deploy/plugins/security/sonarcloud-ruby
icon: { key: sonarcloud, badge: ruby }
network:
  egress:
    - "sonarcloud.io"
    - "api.sonarcloud.io"
    - "scanner.sonarcloud.io"
    - "rubygems.org"
    - "index.rubygems.org"
changelog: |
  1.0.0: Initial Official catalog release. Runs as the non-root `plugin` user (uid 1000); every download pinned and digest-verified.

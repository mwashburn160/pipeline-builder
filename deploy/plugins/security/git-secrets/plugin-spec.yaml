name: git-secrets
description: Secret detection plugin using Gitleaks and TruffleHog to scan code repositories for leaked credentials, API keys, and sensitive data using AWS CDK CodeBuildStep
keywords:
  - gitleaks
  - trufflehog
  - secret-detection
  - credentials
category: security
version: 1.0.0
pluginType: CodeBuildStep
computeType: SMALL
timeout: 30
failureBehavior: warn
secrets: []
primaryOutputDirectory: secrets-reports
dockerfile: Dockerfile
installCommands:
  # Gitleaks version selection
  - test -d secrets-reports || mkdir -p secrets-reports
  - |
    set -e
    if [ -f /opt/gitleaks/versions/gitleaks-${GITLEAKS_VERSION} ]; then
      ln -sf /opt/gitleaks/versions/gitleaks-${GITLEAKS_VERSION} /opt/gitleaks/bin/gitleaks
    else
      echo "ERROR: Gitleaks ${GITLEAKS_VERSION} is not in this image (only pinned, checksum-verified builds are). Available: $(ls /opt/gitleaks/versions | sed 's/^gitleaks-//' | tr '\n' ' ')" >&2
      exit 1
    fi
  - gitleaks version
  - trufflehog --version
commands:
  # Gitleaks scan
  - |
    set -e
    CONFIG_ARG=""
    if [ -n "${GITLEAKS_CONFIG}" ] && [ -f "${GITLEAKS_CONFIG}" ]; then
      CONFIG_ARG="--config ${GITLEAKS_CONFIG}"
    fi
    echo "Running Gitleaks ${SCAN_MODE} scan..."
    # gitleaks v8.19+ deprecated `detect --source . [--no-git]` in favor of the
    # `dir` (filesystem, no git history) and `git` (git history) subcommands —
    # the old form errors on newer releases (we pin v8.30.1). Path is positional.
    case "${SCAN_MODE}" in
      directory)
        gitleaks dir . \
          --report-format ${REPORT_FORMAT} \
          --report-path secrets-reports/gitleaks-results.json \
          ${CONFIG_ARG}
        ;;
      git)
        gitleaks git . \
          --report-format ${REPORT_FORMAT} \
          --report-path secrets-reports/gitleaks-results.json \
          ${CONFIG_ARG}
        ;;
    esac
  # TruffleHog scan
  - |
    set -e
    echo "Running TruffleHog filesystem scan..."
    trufflehog filesystem . \
      --json \
      --no-update \
      > secrets-reports/trufflehog-results.json 2>&1
  - "echo \"Secret scan complete. Reports available in secrets-reports/\""
env:
  GITLEAKS_VERSION: "8.30.1"
  SCAN_MODE: directory
  GITLEAKS_CONFIG: ""
  REPORT_FORMAT: json

# Smoke test — runs after `docker build` in test-plugins.sh --build.
# Asserts the tool is on PATH and produces a deterministic version output.
smokeTest: "gitleaks version && trufflehog --version"

# ─── Catalog metadata (plugin-ecosystem W0.2) ───
license: Apache-2.0
homepageUrl: https://gitleaks.io
sourceUrl: https://github.com/mwashburn160/pipeline-builder/tree/main/deploy/plugins/security/git-secrets
# icon: none — no mark in Simple Icons 16.32.0; no confirmed vendor press-kit permission (monogram; see _icons/SOURCES.md)
# network.egress: none declared — the step contacts no fixed external host
changelog: |
  1.0.0: Initial Official catalog release. Runs as the non-root `plugin` user (uid 1000); every download pinned and digest-verified.

name: gitguardian
description: GitGuardian enterprise secret detection plugin for scanning code repositories for hardcoded credentials and API keys using AWS CDK CodeBuildStep
keywords:
  - secret-detection
  - credentials
  - enterprise
  - api-keys
category: security
version: 1.0.0
pluginType: CodeBuildStep
computeType: SMALL
timeout: 30
failureBehavior: warn
secrets:
  - name: GITGUARDIAN_API_KEY
    required: true
    description: "GitGuardian API key"
primaryOutputDirectory: gitguardian-reports
dockerfile: Dockerfile
installCommands:
  - test -d gitguardian-reports || mkdir -p gitguardian-reports
  - ggshield --version
  - |
    set -e
    if [ -z "${GITGUARDIAN_API_KEY}" ]; then
      echo "WARNING: GITGUARDIAN_API_KEY must be injected via CodeBuild secrets"
    fi
commands:
  - |
    set -e
    EXIT_ZERO_ARG=""
    if [ "${GG_EXIT_ZERO}" = "true" ]; then
      EXIT_ZERO_ARG="--exit-zero"
    fi
    case "${GG_SCAN_TYPE}" in
      path)
        echo "Running GitGuardian path scan..."
        ggshield secret scan path . \
          --json \
          --output gitguardian-reports/ggshield-results.json \
          ${EXIT_ZERO_ARG}
        ;;
      repo)
        echo "Running GitGuardian repo scan..."
        ggshield secret scan repo . \
          --json \
          --output gitguardian-reports/ggshield-results.json \
          ${EXIT_ZERO_ARG}
        ;;
      ci)
        echo "Running GitGuardian CI scan..."
        ggshield secret scan ci \
          --json \
          --output gitguardian-reports/ggshield-results.json \
          ${EXIT_ZERO_ARG}
        ;;
    esac
  - "echo \"GitGuardian scan complete. Reports available in gitguardian-reports/\""
env:
  GG_SCAN_TYPE: path
  GG_EXIT_ZERO: "false"

# ─── Catalog metadata (plugin-ecosystem W0.2) ───
license: Apache-2.0
homepageUrl: https://docs.gitguardian.com/ggshield-docs/getting-started
sourceUrl: https://github.com/mwashburn160/pipeline-builder/tree/main/deploy/plugins/security/gitguardian
# icon: none — no mark in Simple Icons 16.32.0; no confirmed vendor press-kit permission (monogram; see _icons/SOURCES.md)
network:
  egress:
    - "api.gitguardian.com"
changelog: |
  1.0.0: Initial Official catalog release. Runs as the non-root `plugin` user (uid 1000); every download pinned and digest-verified.

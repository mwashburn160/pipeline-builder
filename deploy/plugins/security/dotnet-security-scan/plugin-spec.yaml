name: dotnet-security-scan
description: dotnet security scan plugin for detecting security vulnerabilities in .NET project dependencies and code using AWS CDK CodeBuildStep
keywords:
  - dotnet
  - dependency-scan
  - vulnerability
  - cve
category: security
version: 1.0.0
pluginType: CodeBuildStep
computeType: SMALL
timeout: 15
failureBehavior: warn
secrets: []
primaryOutputDirectory: security-reports
dockerfile: Dockerfile
installCommands:
  # .NET SDK + the pinned security-scan tool are baked into the image
  # (pipeline-dotnet-base + this plugin's Dockerfile).
  - test -d security-reports || mkdir -p security-reports
  - dotnet --version
commands:
  - |
    set -e
    echo "Running .NET security scan..."
    run-logged security-reports/security-scan.log -- \
      security-scan . --excl-proj=*test*
  - "echo \"Security scan complete. Reports available in security-reports/\""

# ─── Catalog metadata (plugin-ecosystem W0.2) ───
license: Apache-2.0
homepageUrl: https://security-code-scan.github.io
sourceUrl: https://github.com/mwashburn160/pipeline-builder/tree/main/deploy/plugins/security/dotnet-security-scan
icon: dotnet
network:
  egress:
    - "api.nuget.org"
changelog: |
  1.0.0: Initial Official catalog release. Runs as the non-root `plugin` user (uid 1000); every download pinned and digest-verified.

name: snyk-ruby
description: Snyk security scanning for Ruby projects using AWS CDK with CodeBuildStep
keywords:
  - ruby
  - sca
  - vulnerability
  - dependency-scan
category: security
version: 1.0.3
pluginType: CodeBuildStep
computeType: SMALL
timeout: 15
failureBehavior: warn
secrets:
  - name: SNYK_TOKEN
    required: true
    description: "Snyk authentication token"
primaryOutputDirectory: snyk-reports
dockerfile: Dockerfile
installCommands:
  # Ruby + bundler are baked into plugin-ruby-base (single pinned version).
  - test -d snyk-reports || mkdir -p snyk-reports
  - snyk --version
  - |
    set -e
    gem install bundler
    if [ -f Gemfile.lock ]; then bundle install; fi
commands:
  - run-logged snyk-reports/snyk-test.log -- snyk test --severity-threshold=${SNYK_SEVERITY_THRESHOLD} --json-file-output=snyk-reports/snyk-test-results.json
  - run-logged snyk-reports/snyk-code.log -- snyk code test --severity-threshold=${SNYK_SEVERITY_THRESHOLD} --json-file-output=snyk-reports/snyk-code-results.json
  - "echo \"Snyk scan complete. Reports available in snyk-reports/\""
env:
  # RUBY_VERSION is baked into plugin-ruby-base (single-version model).
  SNYK_SEVERITY_THRESHOLD: high

# Smoke test — runs after `docker build` in test-plugins.sh --build.
# Asserts the tool is on PATH and reports a version. Exit non-zero = test fail.
smokeTest: "which snyk && ruby --version"

# ─── Catalog metadata (plugin-ecosystem W0.2) ───
license: Apache-2.0
homepageUrl: https://docs.snyk.io/snyk-cli
sourceUrl: https://github.com/mwashburn160/pipeline-builder/tree/main/deploy/plugins/security/snyk-ruby
icon: { key: snyk, badge: ruby }
network:
  egress:
    - "api.snyk.io"
    - "rubygems.org"
    - "index.rubygems.org"
changelog: |
  1.0.3: Security fix 2026-11-25 — Rebuilt on a refreshed plugin-ruby-base (Debian security updates: mariadb client 1:11.8.9+ds-0+deb13u1, glibc 2.41-12+deb13u5, krb5 1.21.3-5+deb13u2), clearing the 3 Critical MariaDB CVEs (CVE-2026-49261, CVE-2026-92262, CVE-2026-44172) the nightly rescan reported in 1.0.2.
  1.0.2: Pin refresh 2026-11-18 — Rebuilt on the refreshed base images (Ubuntu 26.10 digest refresh; Ruby 4.0.10, RubyGems 4.1.0).
  1.0.1: Pin refresh 2026-11-13 — Rebuilt on plugin-ruby-base with Debian's 2026-11 security updates (OpenEXR 3.2.12 clears two Criticals).
  1.0.0: Initial Official catalog release. Runs as the non-root `plugin` user (uid 1000); every download pinned and digest-verified.

name: trivy
description: Trivy filesystem + config vulnerability scanner for any project. Scans dependencies (lockfiles) and IaC/config statically; no language runtime required.
keywords:
  - container
  - vulnerability
  - dependency-scan
  - iac
  - config-scan
category: security
version: 1.0.0
pluginType: CodeBuildStep
computeType: SMALL
timeout: 15
failureBehavior: warn
secrets: []
primaryOutputDirectory: trivy-reports
dockerfile: Dockerfile
installCommands:
  - test -d trivy-reports || mkdir -p trivy-reports
  - |
    set -e
    if [ -f /opt/trivy/versions/trivy-${TRIVY_VERSION} ]; then
      ln -sf /opt/trivy/versions/trivy-${TRIVY_VERSION} /opt/trivy/bin/trivy
    else
      echo "ERROR: Trivy ${TRIVY_VERSION} is not in this image (only pinned, checksum-verified builds are). Available: $(ls /opt/trivy/versions | sed 's/^trivy-//' | tr '\n' ' ')" >&2
      exit 1
    fi
  - trivy --version
commands:
  - trivy fs --exit-code 1 --severity ${TRIVY_SEVERITY} --format ${TRIVY_FORMAT} --output trivy-reports/trivy-fs-results.json .
  - trivy config --severity ${TRIVY_SEVERITY} --format ${TRIVY_FORMAT} --output trivy-reports/trivy-config-results.json .
  - "echo \"Trivy scan complete. Reports available in trivy-reports/\""
env:
  TRIVY_VERSION: "0.69.3"
  TRIVY_SEVERITY: HIGH,CRITICAL
  TRIVY_FORMAT: json

# ─── Catalog metadata (plugin-ecosystem W0.2) ───
license: Apache-2.0
homepageUrl: https://trivy.dev
sourceUrl: https://github.com/mwashburn160/pipeline-builder/tree/main/deploy/plugins/security/trivy
icon: trivy
network:
  egress:
    - "mirror.gcr.io"
    - "ghcr.io"
    - "pkg-containers.githubusercontent.com"
changelog: |
  1.0.0: Initial Official catalog release. Runs as the non-root `plugin` user (uid 1000); every download pinned and digest-verified.

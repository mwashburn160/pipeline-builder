name: snyk-nodejs
description: Snyk security scanning for Node.js projects using AWS CDK with CodeBuildStep. For other languages use snyk-python, snyk-java, snyk-go, snyk-dotnet, snyk-ruby, or snyk-rust.
keywords:
  - nodejs
  - sca
  - vulnerability
  - dependency-scan
category: security
version: 1.0.0
pluginType: CodeBuildStep
computeType: SMALL
timeout: 15
failureBehavior: warn
secrets:
  - name: SNYK_TOKEN
    required: true
    description: "Snyk authentication token"
primaryOutputDirectory: snyk-reports
dockerfile: Dockerfile
installCommands:
  # Node.js + npm are baked into pipeline-node-base (single pinned version).
  - test -d snyk-reports || mkdir -p snyk-reports
  - snyk --version
  - |
    set -e
    if [ -f package-lock.json ]; then npm ci
    elif [ -f package.json ]; then npm install
    fi
    if [ -f yarn.lock ]; then npm install -g yarn && yarn install --frozen-lockfile; fi
    if [ -f pnpm-lock.yaml ]; then npm install -g pnpm && pnpm install --frozen-lockfile; fi
commands:
  - run-logged snyk-reports/snyk-test.log -- snyk test --severity-threshold=${SNYK_SEVERITY_THRESHOLD} --json-file-output=snyk-reports/snyk-test-results.json
  - run-logged snyk-reports/snyk-code.log -- snyk code test --severity-threshold=${SNYK_SEVERITY_THRESHOLD} --json-file-output=snyk-reports/snyk-code-results.json
  - "echo \"Snyk scan complete. Reports available in snyk-reports/\""
env:
  SNYK_SEVERITY_THRESHOLD: high

# Smoke test — runs after `docker build` in test-plugins.sh --build.
# Asserts the tool is on PATH and reports a version. Exit non-zero = test fail.
smokeTest: "which snyk && node --version"

# ─── Catalog metadata (plugin-ecosystem W0.2) ───
license: Apache-2.0
homepageUrl: https://docs.snyk.io/snyk-cli
sourceUrl: https://github.com/mwashburn160/pipeline-builder/tree/main/deploy/plugins/security/snyk-nodejs
icon: { key: snyk, badge: nodejs }
network:
  egress:
    - "api.snyk.io"
    - "registry.npmjs.org"
    - "registry.yarnpkg.com"
changelog: |
  1.0.0: Initial Official catalog release. Runs as the non-root `plugin` user (uid 1000); every download pinned and digest-verified.

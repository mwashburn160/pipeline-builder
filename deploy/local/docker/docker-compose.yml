# =============================================================================
# Services
# =============================================================================
services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  ask:
    image: 'ghcr.io/mwashburn160/ask:4.1.21@sha256:599dfdd52ce86f5b56585d38ddefa036e44015a194fba17e0ffcfae8547c6ab2'
    container_name: ask
    restart: always
    stop_grace_period: 10s
    environment:
      # Redis (x-redis-env) is how this service learns an impersonation session
      # was ended; without it impersonation tokens are rejected.
      <<: [*common-env, *server-env, *redis-env, *ai-env, *tunables-env]
      SERVICE_NAME: ask
    volumes:
      - *service-key-bundle
      - *dev-ca
      - ./certs/service-keys/ask.key:/etc/pipeline-builder/service-keys/service.key:ro
    networks:
      - backend-network
    healthcheck: *api-healthcheck
    deploy:
      resources:
        limits:
          cpus: '0.35'
          memory: 384M
        reservations:
          cpus: '0.10'
          memory: 160M

  # Opt-in self-hosted model (Ollama, OpenAI-compatible). Start with:
  #   docker compose --profile ask-model up -d
  # then set OPENAI_COMPATIBLE_BASE_URL=http://ask-model:11434/v1 and
  #   OPENAI_COMPATIBLE_MODELS=qwen2.5-coder:7b|Qwen 2.5 Coder in your .env.
  # (See the "Self-hosted Ask model" block in .env.example.) The 7B needs ~6-8Gi
  # of RAM to serve — on a smaller machine use OLLAMA_MODEL=qwen2.5-coder:1.5b
  # and match OPENAI_COMPATIBLE_MODELS to it, as the minikube target does.
  ask-model:
    image: 'ollama/ollama@sha256:96b7667cb536ab69bfd5cc0c2bd1e29602218e076fe6d34f402b786f17b4fde0'  # ollama/ollama:0.6.5
    container_name: ask-model
    profiles: [ask-model]
    restart: always
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
      OLLAMA_HOST: 0.0.0.0:11434
    entrypoint: ["/bin/sh", "-c"]
    # Retry the pull rather than `|| true`-ing it once. Nothing re-runs it:
    # `restart: always` reacts to the container EXITING, not to an unhealthy
    # healthcheck, so a single transient registry blip would otherwise leave a
    # permanently model-less container serving an empty catalogue.
    command:
      - |
        ollama serve &
        sleep 4
        for i in 1 2 3 4 5; do
          ollama pull "$$OLLAMA_MODEL" && break
          echo "ollama pull failed (attempt $$i); retrying in 30s" >&2
          sleep 30
        done
        wait
    volumes:
      - ask-model-models:/root/.ollama
    networks:
      - backend-network
    # GATE HEALTH ON THE MODEL, NOT THE SERVER. A probe that only reaches the
    # HTTP server passes the moment it binds — while the pull above is still
    # downloading — so the container reports healthy with an EMPTY catalogue,
    # `ask` sends a completion for a model that does not exist and ollama closes
    # the connection ("AI_APICallError: Cannot connect to API: other side
    # closed"). Grep for the configured model instead. Mirrors the startupProbe
    # on all three k8s targets.
    healthcheck:
      test: ["CMD", "sh", "-c", "ollama list | grep -qF \"$$OLLAMA_MODEL\""]
      interval: 30s
      timeout: 10s
      retries: 5
      # The first pull is ~4.7GB for the 7B. Failures during start_period do not
      # count toward `retries`, so this is the first-pull budget — matching the
      # k8s startupProbe's ~20 minutes. Too short a value marks the container
      # unhealthy while a perfectly normal download is still in flight.
      start_period: 1200s
    deploy:
      resources:
        limits:
          # Mirrors the k8s copies (limits: cpu 4 / memory 10Gi).
          cpus: '4.0'
          memory: 10G

  nginx:
    # Unprivileged (UID 101) nginx, matching the k8s gateways. The njs module is
    # bundled in the official 1.30 image; nginx.conf sets `pid /tmp/nginx.pid` so
    # the non-root master can write its PID file.
    image: 'nginxinc/nginx-unprivileged@sha256:e44b470e571b20d935336bfb9f8277c1468d15e1e4d105a12ab5609d0b4682cb'  # nginxinc/nginx-unprivileged:1.31
    container_name: nginx
    restart: always
    stop_grace_period: 5s
    ports:
      - '8080:8080'
      - '8443:8443'
    # No signing secret: njs/jwt.js DECODES the access token to populate the
    # x-org-id/x-user-id headers and the access log, and verifies nothing —
    # user tokens are ES256 and checking one needs an async JWKS fetch a
    # synchronous `js_set` handler cannot make. Enforcement was always the
    # services' own `requireAuth`. See docs/authentication.md.
    volumes:
      - './certs/nginx-tls.crt:/etc/nginx/certs/nginx.crt:ro'
      - './certs/nginx-tls.key:/etc/nginx/certs/nginx.key:ro'
      - './nginx/nginx.conf:/etc/nginx/nginx.conf:ro'
      - './nginx/jwt.js:/etc/nginx/njs/jwt.js:ro'
      - './nginx/metrics.js:/etc/nginx/njs/metrics.js:ro'
    networks:
      - proxy-network
      - backend-network
    depends_on:
      ask:            { condition: service_started }
      billing:        { condition: service_started }
      compliance:     { condition: service_started }
      frontend:       { condition: service_started }
      image-registry: { condition: service_started }
      message:        { condition: service_started }
      pipeline:       { condition: service_started }
      platform:       { condition: service_started }
      plugin:         { condition: service_started }
      quota:          { condition: service_started }
      reporting:      { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "curl -sfk https://localhost:8443/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.2'
          memory: 128M

  # ---------------------------------------------------------------------------
  # Databases
  # ---------------------------------------------------------------------------
  mongodb:
    image: 'mongo@sha256:2f02e2184c6d91c3208e5ab75a0707d1386a05377b20fdaf49a314815774d863'  # mongo:8.3.7
    container_name: mongodb
    restart: always
    stop_grace_period: 15s
    command: ['mongod', '--bind_ip_all', '--replSet', 'rs0', '--keyFile', '/etc/mongodb-keyfile']
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: platform
    volumes:
      - './data/db-data/mongodb/:/data/db/:rw'
      - './mongodb-keyfile:/etc/mongodb-keyfile:ro'
      - './mongodb-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro'
    networks:
      - backend-network
    healthcheck:
      # Single idempotent self-init probe — the one shared pattern across all targets:
      # initiate rs0 if not yet initialized, then report healthy only once this node is
      # the writable primary (so `healthy` ⇒ apps can connect via ?replicaSet=rs0). One
      # mongosh call, runs on localhost (no service chicken-and-egg). mongosh is a heavy
      # Node process, hence the generous 30s timeout.
      test:
        - CMD
        - mongosh
        - --quiet
        - --host
        - localhost:27017
        - --username
        - ${MONGO_INITDB_ROOT_USERNAME}
        - --password
        - ${MONGO_INITDB_ROOT_PASSWORD}
        - --authenticationDatabase
        - admin
        - --eval
        - 'try { rs.status() } catch (e) { if (e.codeName === "NotYetInitialized") { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongodb:27017" }] }) } else { throw e } } quit(db.hello().isWritablePrimary ? 0 : 1)'
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 90s
    deploy: *db-deploy

  postgres:
    image: 'postgres@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae'  # postgres:18
    container_name: postgres
    restart: always
    stop_grace_period: 15s
    command: postgres -c listen_addresses=*
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Read by postgres-init.sql (psql \getenv) on first init to create the
      # NOSUPERUSER NOBYPASSRLS application role every service logs in as.
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Read by postgres-init.sql to create the view-only ecosystem_public_reader
      # login the anonymous plugin directory uses (empty → role not created).
      ECOSYSTEM_PUBLIC_READER_PASSWORD: ${ECOSYSTEM_PUBLIC_READER_PASSWORD:-}
    volumes:
      - './data/db-data/postgres/:/var/lib/postgresql:rw'
      - './postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro'
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy: *db-deploy

  # ---------------------------------------------------------------------------
  # pgBouncer connection pooler
  # ---------------------------------------------------------------------------
  # All app services connect through pgbouncer (DB_HOST=pgbouncer / DB_PORT=6432).
  # See `deploy/local/docker/config/pgbouncer/pgbouncer.ini` for per-tier pool layout.
  pgbouncer:
    image: 'edoburu/pgbouncer@sha256:7d7a27d9e90985cab5cf42256f5c13a3120baa4b055b69df37beb272b89b2340'  # edoburu/pgbouncer:v1.25.2-p0
    container_name: pgbouncer
    restart: always
    environment:
      # edoburu uses DB_*; userlist.txt is generated from these at startup.
      # Our mounted pgbouncer.ini overrides the auto-generated config. This is
      # the APPLICATION role: pgbouncer passes the client login through, so only
      # DB_USER can connect via the pooler (the superuser is not in the userlist).
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      LISTEN_PORT: '6432'
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      # The second pooled login: the view-only ecosystem_public_reader behind the
      # anonymous plugin directory (pgbouncer.ini's `pipeline_builder_public`
      # pool). Every Postgres client goes through this pooler — none connects to
      # Postgres directly.
      ECOSYSTEM_PUBLIC_READER_PASSWORD: ${ECOSYSTEM_PUBLIC_READER_PASSWORD:-}
    # Seed the reader into userlist.txt, then hand off to the image's own
    # entrypoint, which appends the DB_USER app role (it only adds users that are
    # missing). The password is written in userlist form: double quotes doubled.
    # No password → no reader line → the directory's logins are refused here.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        if [ -n "$${ECOSYSTEM_PUBLIC_READER_PASSWORD:-}" ] && ! grep -q '^"ecosystem_public_reader"' /etc/pgbouncer/userlist.txt 2>/dev/null; then
          printf '"ecosystem_public_reader" "%s"\n' "$$(printf '%s' "$$ECOSYSTEM_PUBLIC_READER_PASSWORD" | sed 's/"/""/g')" >> /etc/pgbouncer/userlist.txt
        fi
        exec /entrypoint.sh /usr/bin/pgbouncer /etc/pgbouncer/pgbouncer.ini
    volumes:
      - './config/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: 'redis@sha256:bd999b5cfee25fb24b8320a31fddbd69f462df44c8138c66e369582937beebc0'  # redis:8-alpine
    container_name: redis
    restart: always
    stop_grace_period: 10s
    command: redis-server --maxmemory 128mb --maxmemory-policy noeviction
    volumes:
      - './data/db-data/redis/:/data:rw'
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ---------------------------------------------------------------------------
  # Datastore exporters
  # ---------------------------------------------------------------------------
  # The k8s targets run these as SIDECARS of the database pod; compose has no
  # sidecars, so they are their own containers joined to the datastore's network
  # alias. Same images, same versions, same metric names — the point is that
  # PostgresUnreachable / MongoDBUnreachable / RedisUnreachable in
  # config/prometheus/alert-rules.yml have real series to evaluate here too.
  # Drop one and the matching rule becomes dead YAML on this target: a wedged
  # database in a running container then looks healthy.
  postgres-exporter:
    image: 'quay.io/prometheuscommunity/postgres-exporter@sha256:38606faa38c54787525fb0ff2fd6b41b4cfb75d455c1df294927c5f611699b17'  # quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    container_name: postgres-exporter
    restart: always
    environment:
      # Reuses the credentials the server is initialised with — no separate
      # monitoring role to provision or rotate.
      DATA_SOURCE_URI: 'postgres:5432/postgres?sslmode=disable'
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    networks:
      - backend-network
    depends_on:
      postgres:
        condition: service_healthy
    deploy: *exporter-deploy

  # --collect-all enables the replset/oplog collectors this deployment cares
  # about; --compatible-mode keeps the legacy metric names the alert rules and
  # community dashboards expect (mongodb_up among them).
  mongodb-exporter:
    image: 'percona/mongodb_exporter@sha256:d9c577166068197bf6908296d9742cc8267e7b7e1054199436d6d922e8921679'  # percona/mongodb_exporter:0.44.0
    container_name: mongodb-exporter
    restart: always
    command:
      - '--collect-all'
      - '--compatible-mode'
      - '--web.listen-address=:9216'
    environment:
      MONGODB_URI: ${MONGODB_URI}
    networks:
      - backend-network
    depends_on:
      mongodb:
        condition: service_healthy
    deploy: *exporter-deploy

  # Redis here requires no auth, so no credentials are wired.
  redis-exporter:
    image: 'oliver006/redis_exporter@sha256:dbd410eb9255016c9440b40b8fa18872fdf0e7972d06fc1df8d5b120d35efe05'  # oliver006/redis_exporter:v1.69.0
    container_name: redis-exporter
    restart: always
    command:
      - '--redis.addr=redis://redis:6379'
    networks:
      - backend-network
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 96M
        reservations:
          cpus: '0.02'
          memory: 32M

  # ---------------------------------------------------------------------------
  # Application Services
  # ---------------------------------------------------------------------------
  frontend:
    image: 'ghcr.io/mwashburn160/frontend:4.1.26@sha256:1ac216be5f6f569f951929d356e969c7cce747ad658252dc34fc39dd9ce431f1'
    container_name: frontend
    restart: always
    stop_grace_period: 10s
    environment:
      PLATFORM_BASE_URL: ${PLATFORM_BASE_URL}
      # Public (browser-facing) origin for social-card / Open Graph absolute URLs.
      # Resolved at RUNTIME by the frontend (see frontend/src/lib/site-url.ts), so
      # one image works across environments. Local docker serves on :8443.
      APP_SITE_URL: ${APP_SITE_URL:-https://localhost:8443}
      # Server-side relay target for client error reports; empty = reporting off.
      ERROR_REPORT_URL: ${ERROR_REPORT_URL:-}
      NODE_EXTRA_CA_CERTS: /etc/pipeline-builder/dev-ca.crt
    volumes:
      - './data/cache:/app/.next/cache:rw'
      - './data/tmp:/tmp:rw'
      - *dev-ca
    networks:
      - proxy-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    deploy: *deploy-medium

  platform:
    image: 'ghcr.io/mwashburn160/platform:4.1.28@sha256:8452d7ae2d100eb06269811f9669ea6444a50e18e19f1c20295bf9bcb3b08bc6'
    container_name: platform
    restart: always
    stop_grace_period: 10s
    environment:
      # Redis (x-redis-env) is how this service PUBLISHES revocations and shares
      # login / step-up / leader state; without it revocations never propagate.
      <<: [*common-env, *postgres-env, *server-env, *redis-env, *quota-client-env, *tunables-env, *quota-tier-developer-env]
      SERVICE_NAME: platform
      # Service tunables (blank = code default; see .env.example).
      ALERTMANAGER_TIMEOUT_MS: ${ALERTMANAGER_TIMEOUT_MS:-}
      ALERT_DELIVERY_TIMEOUT_MS: ${ALERT_DELIVERY_TIMEOUT_MS:-}
      ALERT_DESTINATION_MAX_LABEL: ${ALERT_DESTINATION_MAX_LABEL:-}
      ALERT_DESTINATION_MAX_TARGET: ${ALERT_DESTINATION_MAX_TARGET:-}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-}
      AUTH_LIMITER_MAX: ${AUTH_LIMITER_MAX:-}
      AUTH_LIMITER_WINDOWMS: ${AUTH_LIMITER_WINDOWMS:-}
      AUTH_VERIFICATION_TOKEN_TTL_MS: ${AUTH_VERIFICATION_TOKEN_TTL_MS:-}
      DASHBOARD_MAX_DESCRIPTION: ${DASHBOARD_MAX_DESCRIPTION:-}
      DASHBOARD_MAX_NAME: ${DASHBOARD_MAX_NAME:-}
      DASHBOARD_MAX_PANELS: ${DASHBOARD_MAX_PANELS:-}
      DASHBOARD_MAX_PANEL_TITLE: ${DASHBOARD_MAX_PANEL_TITLE:-}
      GOOGLE_AUTHORIZE_URL: ${GOOGLE_AUTHORIZE_URL:-}
      GOOGLE_TOKEN_URL: ${GOOGLE_TOKEN_URL:-}
      GOOGLE_USERINFO_URL: ${GOOGLE_USERINFO_URL:-}
      LOGIN_ACCOUNT_LIMITER_MAX: ${LOGIN_ACCOUNT_LIMITER_MAX:-}
      LOGIN_ACCOUNT_LIMITER_WINDOWMS: ${LOGIN_ACCOUNT_LIMITER_WINDOWMS:-}
      OAUTH_CLEANUP_INTERVAL_MS: ${OAUTH_CLEANUP_INTERVAL_MS:-}
      OAUTH_MAX_PENDING_STATES: ${OAUTH_MAX_PENDING_STATES:-}
      OAUTH_STATE_TTL_MS: ${OAUTH_STATE_TTL_MS:-}
      ORG_CASCADE_HTTP_TIMEOUT_MS: ${ORG_CASCADE_HTTP_TIMEOUT_MS:-}
      PLATFORM_SCRAPER_INTERVAL_MS: ${PLATFORM_SCRAPER_INTERVAL_MS:-}
      QUOTA_SERVICE_TIMEOUT: ${QUOTA_SERVICE_TIMEOUT:-}
      WEBAUTHN_CHALLENGE_TTL_MS: ${WEBAUTHN_CHALLENGE_TTL_MS:-}
      WEBAUTHN_MAX_PENDING_CEREMONIES: ${WEBAUTHN_MAX_PENDING_CEREMONIES:-}
      WEBAUTHN_ORIGINS: ${WEBAUTHN_ORIGINS:-}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-}
      # Audit hash-chain HMAC key — outside the database by design (see .env.example).
      AUDIT_CHAIN_HMAC_KEY: ${AUDIT_CHAIN_HMAC_KEY}
      # Signed chain-head export to the Object-Lock `audit-heads` MinIO bucket.
      AUDIT_HEAD_EXPORT_S3_ENDPOINT: ${AUDIT_HEAD_EXPORT_S3_ENDPOINT:-http://minio:9000}
      AUDIT_HEAD_EXPORT_S3_BUCKET: ${AUDIT_HEAD_EXPORT_S3_BUCKET:-audit-heads}
      AUDIT_HEAD_EXPORT_S3_REGION: ${AUDIT_HEAD_EXPORT_S3_REGION:-us-east-1}
      AUDIT_HEAD_EXPORT_S3_ACCESS_KEY_ID: ${AUDIT_HEAD_EXPORT_S3_ACCESS_KEY_ID}
      AUDIT_HEAD_EXPORT_S3_SECRET_ACCESS_KEY: ${AUDIT_HEAD_EXPORT_S3_SECRET_ACCESS_KEY}
      AUDIT_HEAD_EXPORT_PREFIX: ${AUDIT_HEAD_EXPORT_PREFIX:-audit-heads}
      AUDIT_HEAD_EXPORT_LOCK_MODE: ${AUDIT_HEAD_EXPORT_LOCK_MODE:-COMPLIANCE}
      AUDIT_HEAD_EXPORT_RETENTION_DAYS: ${AUDIT_HEAD_EXPORT_RETENTION_DAYS:-400}
      AUDIT_HEAD_EXPORT_INTERVAL_MS: ${AUDIT_HEAD_EXPORT_INTERVAL_MS:-300000}
      AUDIT_SPOOL_DRAIN_INTERVAL_MS: ${AUDIT_SPOOL_DRAIN_INTERVAL_MS:-30000}
      # Deployment target surfaced via /config so the frontend can gate the AWS-only
      # onboarding CLI-setup section (this compose stack is the `docker` target).
      DEPLOY_TARGET: ${DEPLOY_TARGET:-docker}
      # Billing
      BILLING_ENABLED: ${BILLING_ENABLED:-true}
      BILLING_SERVICE_HOST: ${BILLING_SERVICE_HOST:-billing}
      BILLING_SERVICE_PORT: ${BILLING_SERVICE_PORT:-3000}
      # Security
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-12}
      # Breached-password check (HIBP k-anonymity range API) — an OUTBOUND
      # INTERNET CALL on the registration / password-change / admin-reset path.
      # Fail-open, metered as platform_password_breach_checks_total.
      # Air-gapped: PASSWORD_BREACH_CHECK=off (or point _URL at an internal
      # mirror). See the block in .env.example.
      PASSWORD_BREACH_CHECK: ${PASSWORD_BREACH_CHECK:-hibp}
      PASSWORD_BREACH_CHECK_URL: ${PASSWORD_BREACH_CHECK_URL:-https://api.pwnedpasswords.com/range/}
      PASSWORD_BREACH_CHECK_TIMEOUT_MS: ${PASSWORD_BREACH_CHECK_TIMEOUT_MS:-2000}
      # FIDO Metadata Service — the second OUTBOUND INTERNET CALL, made only when
      # an org sets an approved-authenticator (AAGUID) allowlist.
      # Air-gapped: mount a downloaded blob, set FIDO_MDS_BLOB_PATH to it and
      # FIDO_MDS_URL=off; or just FIDO_MDS_URL=off if no org uses allowlists.
      FIDO_MDS_BLOB_PATH: ${FIDO_MDS_BLOB_PATH:-}
      FIDO_MDS_URL: ${FIDO_MDS_URL:-https://mds.fidoalliance.org/}
      FIDO_MDS_FETCH_TIMEOUT_MS: ${FIDO_MDS_FETCH_TIMEOUT_MS:-10000}
      FIDO_MDS_REFRESH_MS: ${FIDO_MDS_REFRESH_MS:-86400000}
      # Platform-only multi-tenant knobs. RLS_CONTEXT_MODE is set via
      # x-postgres-env so every postgres-backed service inherits it.
      BOOTSTRAP_SUPERADMIN_EMAILS: ${BOOTSTRAP_SUPERADMIN_EMAILS:-}
      BOOTSTRAP_SETUP_WINDOW_MS: ${BOOTSTRAP_SETUP_WINDOW_MS:-}
      SECRET_ENCRYPTION_PER_ORG_KMS: ${SECRET_ENCRYPTION_PER_ORG_KMS:-false}
      # JWT
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      # ES256 user-token signing — platform is the only minter in the fleet.
      # The key file is bind-mounted read-only below.
      TOKEN_SIGNING_MODE: ${TOKEN_SIGNING_MODE:-local}
      TOKEN_SIGNING_KEY_FILE: ${TOKEN_SIGNING_KEY_FILE:-/etc/pipeline-builder/keys/token-signing.key}
      TOKEN_SIGNING_KEY_PREVIOUS_FILE: ${TOKEN_SIGNING_KEY_PREVIOUS_FILE:-}
      TOKEN_SIGNING_KMS_KEY_ID: ${TOKEN_SIGNING_KMS_KEY_ID:-}
      TOKEN_SIGNING_KMS_KEY_PREVIOUS_ID: ${TOKEN_SIGNING_KMS_KEY_PREVIOUS_ID:-}
      # bcrypt password-hash cost. Empty :- default so compose doesn't warn when
      # unset — the app owns the default (BCRYPT_SALT_ROUNDS || 12).
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN}
      # Platform
      PLATFORM_FRONTEND_URL: ${PLATFORM_FRONTEND_URL:-https://localhost:8443}
      # MongoDB
      MONGODB_URI: ${MONGODB_URI}
      # Email
      EMAIL_ENABLED: ${EMAIL_ENABLED}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SES_REGION: ${SES_REGION:-us-east-1}
      SES_ACCESS_KEY_ID: ${SES_ACCESS_KEY_ID}
      SES_SECRET_ACCESS_KEY: ${SES_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # Invitations
      INVITATION_EXPIRATION_DAYS: ${INVITATION_EXPIRATION_DAYS}
      INVITATION_MAX_PENDING_PER_ORG: ${INVITATION_MAX_PENDING_PER_ORG}
      # Per-tier rate-limit multipliers (effective budget = LIMITER_MAX x mult)
      LIMITER_MULT_DEVELOPER: ${LIMITER_MULT_DEVELOPER:-}
      LIMITER_MULT_PRO: ${LIMITER_MULT_PRO:-}
      LIMITER_MULT_TEAM: ${LIMITER_MULT_TEAM:-}
      LIMITER_MULT_ENTERPRISE: ${LIMITER_MULT_ENTERPRISE:-}
      # Per-tier access-token TTLs (platform reads these; DEFAULT_QUOTA_TIER and
      # the developer-tier limits arrive via x-quota-tier-developer-env above).
      JWT_EXPIRES_IN_DEVELOPER: ${JWT_EXPIRES_IN_DEVELOPER:-}
      JWT_EXPIRES_IN_PRO: ${JWT_EXPIRES_IN_PRO:-}
      JWT_EXPIRES_IN_TEAM: ${JWT_EXPIRES_IN_TEAM:-}
      JWT_EXPIRES_IN_ENTERPRISE: ${JWT_EXPIRES_IN_ENTERPRISE:-}
      # OAuth — each provider stays hidden until its CLIENT_ID is set.
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      OAUTH_FACEBOOK_CLIENT_ID: ${OAUTH_FACEBOOK_CLIENT_ID:-}
      OAUTH_FACEBOOK_CLIENT_SECRET: ${OAUTH_FACEBOOK_CLIENT_SECRET:-}
      OAUTH_MICROSOFT_CLIENT_ID: ${OAUTH_MICROSOFT_CLIENT_ID:-}
      OAUTH_MICROSOFT_CLIENT_SECRET: ${OAUTH_MICROSOFT_CLIENT_SECRET:-}
      OAUTH_MICROSOFT_TENANT: ${OAUTH_MICROSOFT_TENANT:-common}
      OAUTH_GITLAB_CLIENT_ID: ${OAUTH_GITLAB_CLIENT_ID:-}
      OAUTH_GITLAB_CLIENT_SECRET: ${OAUTH_GITLAB_CLIENT_SECRET:-}
      OAUTH_GITLAB_BASE_URL: ${OAUTH_GITLAB_BASE_URL:-https://gitlab.com}
      OAUTH_LINKEDIN_CLIENT_ID: ${OAUTH_LINKEDIN_CLIENT_ID:-}
      OAUTH_LINKEDIN_CLIENT_SECRET: ${OAUTH_LINKEDIN_CLIENT_SECRET:-}
      OAUTH_CALLBACK_BASE_URL: ${OAUTH_CALLBACK_BASE_URL:-https://localhost:8443}
      # Native observability: queries go to the Thanos querier (recent + archived
      # blocks), alerts to Alertmanager.
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://thanos-query:9090}
      ALERTMANAGER_URL: ${ALERTMANAGER_URL:-http://alertmanager:9093}
      # Logs (Deliver → Logs). Loki runs auth_enabled: true, so platform sends
      # X-Scope-OrgID per request, derived from the caller's verified token —
      # each org is its own Loki tenant. See docs/observability-logs.md.
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
      # Per-org alert relay: the single Alertmanager instance (id `alertmanager`,
      # sent as X-Alertmanager-Instance) and its bearer token, which Alertmanager
      # reads from the `alert_webhook_token` compose secret below.
      # `previousToken` is the rotation overlap (empty = not rotating): platform
      # accepts either bearer while it is set. docs/runbooks/secret-rotation.md
      ALERT_WEBHOOK_INSTANCES: '[{"id":"alertmanager","token":"${ALERT_WEBHOOK_INSTANCE_TOKEN:?ALERT_WEBHOOK_INSTANCE_TOKEN must be set (run gen-env-secrets)}","previousToken":"${ALERT_WEBHOOK_INSTANCE_TOKEN_PREVIOUS:-}"}]'
    volumes:
      # The ES256 user-token signing key (TOKEN_SIGNING_MODE=local). Read-only,
      # and mounted into PLATFORM ONLY — it is the one credential that can mint
      # a token for a person. Generated by deploy/bin/token-signing-keys.sh
      # before `compose up`; a missing file makes platform refuse to start
      # (rather than quietly signing with something else).
      - ./certs/token-signing:/etc/pipeline-builder/keys:ro
      - *service-key-bundle
      - *dev-ca
      - ./certs/service-keys/platform.key:/etc/pipeline-builder/service-keys/service.key:ro
    networks:
      - backend-network
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck: *api-healthcheck
    deploy: *api-deploy

  plugin:
    image: 'ghcr.io/mwashburn160/plugin:4.2.2@sha256:b2dc9111c1b7cec95f0e38df22e58b31fe498cbd1258bc6abfe5e4866981c8c3'
    container_name: plugin
    restart: always
    stop_grace_period: 10s
    environment:
      <<: [*common-env, *postgres-env, *server-env, *redis-env, *quota-client-env, *ai-env, *tunables-env]
      SERVICE_NAME: plugin
      # Service tunables (blank = code default; see .env.example).
      PLUGIN_BUILD_CONCURRENCY_DEVELOPER: ${PLUGIN_BUILD_CONCURRENCY_DEVELOPER:-}
      PLUGIN_BUILD_CONCURRENCY_PRO: ${PLUGIN_BUILD_CONCURRENCY_PRO:-}
      PLUGIN_BUILD_CONCURRENCY_TEAM: ${PLUGIN_BUILD_CONCURRENCY_TEAM:-}
      PLUGIN_BUILD_CONCURRENCY_ENTERPRISE: ${PLUGIN_BUILD_CONCURRENCY_ENTERPRISE:-}
      PLUGIN_BUILD_CONCURRENCY_UNLIMITED: ${PLUGIN_BUILD_CONCURRENCY_UNLIMITED:-}
      PLUGIN_MAX_BUILDS_PER_ORG: ${PLUGIN_MAX_BUILDS_PER_ORG:-}
      PLUGIN_ORG_SLOT_DELAY_MS: ${PLUGIN_ORG_SLOT_DELAY_MS:-}
      PLUGIN_ORG_SLOT_TTL_SEC: ${PLUGIN_ORG_SLOT_TTL_SEC:-}
      PLUGIN_QUEUE_METRICS_INTERVAL_MS: ${PLUGIN_QUEUE_METRICS_INTERVAL_MS:-}
      PLUGIN_TIER_CACHE_TTL_MS: ${PLUGIN_TIER_CACHE_TTL_MS:-}
      PLUGIN_UPLOAD_TIMEOUT_MS: ${PLUGIN_UPLOAD_TIMEOUT_MS:-}
      COMPLIANCE_SERVICE_HOST: ${COMPLIANCE_SERVICE_HOST:-compliance}
      COMPLIANCE_SERVICE_PORT: ${COMPLIANCE_SERVICE_PORT:-3000}
      COMPLIANCE_BYPASS: ${COMPLIANCE_BYPASS:-false}
      IMAGE_REGISTRY_HOST: ${IMAGE_REGISTRY_HOST:-registry}
      IMAGE_REGISTRY_PORT: ${IMAGE_REGISTRY_PORT:-5000}
      IMAGE_REGISTRY_USER: ${IMAGE_REGISTRY_USER:-admin}
      IMAGE_REGISTRY_TOKEN: ${IMAGE_REGISTRY_TOKEN}
      IMAGE_REGISTRY_HTTP: ${IMAGE_REGISTRY_HTTP:-true}
      # Must match the registry's REGISTRY_AUTH_TOKEN_REALM so the plugin's
      # writeAuthConfig writes credentials keyed by the same host the
      # docker client will be redirected to during a push/pull challenge.
      # In-cluster clients hit image-registry directly on plain HTTP.
      # Override in .env when external docker clients need to pull.
      IMAGE_REGISTRY_TOKEN_REALM: ${IMAGE_REGISTRY_TOKEN_REALM:-http://image-registry:3000/token}
      # Talk to buildkitd over TCP on the backend-network. Unix-socket sharing
      # via a named volume fails under the rootless image because the volume
      # mounts at `/run/buildkit/` owned by root inside the container and the
      # rootless daemon (UID 1000) can't bind a socket there.
      BUILDKIT_HOST: tcp://buildkitd:1234
      # Platform buildkit publishes plugin images for. Default linux/amd64 (the
      # CodeBuild runtime). Set PUBLISH_PLATFORM=linux/arm64 to build native on an
      # Apple-Silicon dev box (faster — local plugin images aren't run on AWS).
      PUBLISH_PLATFORM: ${PUBLISH_PLATFORM:-linux/amd64}
      DOCKER_BUILD_TIMEOUT_MS: ${DOCKER_BUILD_TIMEOUT_MS:-900000}
      DOCKER_PUSH_TIMEOUT_MS: ${DOCKER_PUSH_TIMEOUT_MS:-300000}
      PLUGIN_BUILD_CONCURRENCY: ${PLUGIN_BUILD_CONCURRENCY:-1}
      # Plugin code (read-only rootfs) writes the transient incoming ZIP + the
      # extracted build context here. MUST match the container-side bind target
      # in `volumes:` below. Local uses a laptop-style /data/* container path
      # that mirrors the host ./data/ checkout layout; the ec2 deploy uses the
      # canonical /opt/pipeline/pipeline-data/* path instead. One dir for both:
      # the durable cross-replica artifact lives in object storage (S3_* below),
      # so this is per-node build scratch only.
      DOCKER_BUILD_TEMP_ROOT: ${DOCKER_BUILD_TEMP_ROOT:-/data/plugins-data}
      PLUGIN_UPLOAD_DIR: ${PLUGIN_UPLOAD_DIR:-/data/plugins-data}
      # Object storage for the uploaded build context — a worker on any replica
      # can rehydrate a build from here (see plugin-artifact-storage). Own bucket
      # + bucket-scoped creds (provisioned by minio-init).
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${PLUGIN_S3_BUCKET:-plugins}
      S3_ACCESS_KEY_ID: ${PLUGIN_S3_ACCESS_KEY}
      S3_SECRET_ACCESS_KEY: ${PLUGIN_S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: 'true'
      TMPDIR: /tmp
      # Public key pushed plugin images are verified against (`cosign verify`).
      # Signing itself is image-registry's job (IMAGE_REGISTRY_SERVICE_HOST/PORT
      # default to image-registry:3000, this stack's service name).
      PLUGIN_SIGNING_PUBLIC_KEY_FILE: ${PLUGIN_SIGNING_PUBLIC_KEY_FILE:-/etc/pipeline-builder/plugin-signing/plugin-signing.pub}
      # Vulnerability DB for grype (build-time scan + nightly rescan). The
      # `grype-db` named volume keeps it across restarts (a fresh DB download is
      # hundreds of MB) and inherits the image dir's node ownership.
      GRYPE_DB_CACHE_DIR: /var/cache/grype
      # Anonymous public plugin directory: served by this service, read through
      # pgbouncer (DB_HOST/DB_PORT above) from the `pipeline_builder_public` pool
      # as the view-only ecosystem_public_reader — never as DB_USER.
      ECOSYSTEM_PUBLIC_READER_PASSWORD: ${ECOSYSTEM_PUBLIC_READER_PASSWORD:-}
      PUBLIC_DIRECTORY_DB_NAME: ${PUBLIC_DIRECTORY_DB_NAME:-pipeline_builder_public}
      # Plugin ecosystem flags (docs/runbooks/ecosystem-moderation.md#kill-switches).
      PUBLIC_DIRECTORY_ENABLED: ${PUBLIC_DIRECTORY_ENABLED:-true}
      PLUGIN_PUBLISHING_ENABLED: ${PLUGIN_PUBLISHING_ENABLED:-false}
      PLUGIN_REVIEWS_ENABLED: ${PLUGIN_REVIEWS_ENABLED:-true}
      ANONYMOUS_SUBMISSIONS_ENABLED: ${ANONYMOUS_SUBMISSIONS_ENABLED:-false}
      OFFICIAL_AUTO_APPROVAL_ENABLED: ${OFFICIAL_AUTO_APPROVAL_ENABLED:-true}
      # Plugin image scan gates (docs/plugin-publishing.md#scan-gates).
      PLUGIN_VULN_MAX_CRITICAL: ${PLUGIN_VULN_MAX_CRITICAL:-0}
      PLUGIN_ALLOW_UNSCANNED: ${PLUGIN_ALLOW_UNSCANNED:-false}
      PLUGIN_BLOCK_ON_NEW_CRITICAL: ${PLUGIN_BLOCK_ON_NEW_CRITICAL:-false}
      # Anonymous submissions. Quarantine builds run ONLY on the
      # isolated buildkitd-quarantine below — never on BUILDKIT_HOST (no fallback:
      # the plugin service fails closed without it). The zip waits in its own
      # bucket (30-day expiry), same bucket-scoped MinIO credentials as S3_BUCKET.
      PLUGIN_QUARANTINE_BUILDKIT_ADDR: ${PLUGIN_QUARANTINE_BUILDKIT_ADDR:-tcp://buildkitd-quarantine:1234}
      PLUGIN_QUARANTINE_BUCKET: ${PLUGIN_QUARANTINE_BUCKET:-plugin-quarantine}
      SUBMISSION_POW_SECRET: ${SUBMISSION_POW_SECRET:-}
      SUBMISSION_POW_DIFFICULTY: ${SUBMISSION_POW_DIFFICULTY:-20}
      SUBMISSION_EMAIL_HASH_SECRET: ${SUBMISSION_EMAIL_HASH_SECRET:-}
      SUBMISSION_BUILD_TIMEOUT_SECONDS: ${SUBMISSION_BUILD_TIMEOUT_SECONDS:-900}
      SUBMISSION_MAX_ZIP_BYTES: ${SUBMISSION_MAX_ZIP_BYTES:-52428800}
    volumes:
      - grype-db:/var/cache/grype
      # Host ./data/plugins-data → container /data/plugins-data (per-node build
      # scratch: transient ZIP + extract dir). Symmetric naming makes "what's in
      # the laptop dir" obvious from inside the container too.
      - './data/plugins-data:/data/plugins-data:rw'
      # Plugin-image signing PUBLIC key only — the FILE, never the
      # certs/plugin-signing/ directory, which also holds the private key. This
      # container talks to the buildkitd that runs tenant Dockerfile RUN steps.
      - ./certs/plugin-signing/plugin-signing.pub:/etc/pipeline-builder/plugin-signing/plugin-signing.pub:ro
      - *service-key-bundle
      - *dev-ca
      - ./certs/service-keys/plugin.key:/etc/pipeline-builder/service-keys/service.key:ro
    networks:
      - backend-network
      # Reaches buildkitd-quarantine (and nothing else lives there but the
      # registry pair the quarantine builder pushes to).
      - quarantine-network
    depends_on:
      <<: *needs-minio
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      buildkitd:
        condition: service_healthy
      buildkitd-quarantine:
        condition: service_healthy
    healthcheck: *api-healthcheck
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2048M
        reservations:
          cpus: '0.75'
          memory: 1024M

  # ---------------------------------------------------------------------------
  # Rootless BuildKit daemon — replaces dind, no privileged mode, no
  # CA-trust workaround (buildkitd carries the system CA bundle). Single
  # shared instance for all plugin builds — tier partitioning lives at
  # the BullMQ queue level inside the plugin service, not at the
  # buildkitd layer.
  # ---------------------------------------------------------------------------
  buildkitd:
    # Hold at >= v0.32: its runc reaper avoids the hot "container not running"
    # retry loop on killed build containers.
    image: 'moby/buildkit@sha256:66e5fe5b25509626c0e628c6e57badbcc2e8a62218ba3e1358f1427e90de6a88'  # moby/buildkit:v0.32.1-rootless
    container_name: buildkitd
    restart: always
    stop_grace_period: 5s
    user: "1000:1000"
    # Required for rootless newuidmap/newgidmap and `unshare` setup.
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    command:
      - --addr
      - tcp://0.0.0.0:1234
      - --oci-worker-no-process-sandbox
      # buildkitd.toml mirrors docker.io → registry:5000 so plugin
      # Dockerfiles can use bare `FROM pipeline-plugin-base:24.04` and
      # buildkit transparently resolves to the in-cluster registry.
      - --config
      - /home/user/.config/buildkit/buildkitd.toml
    expose:
      - "1234"
    volumes:
      # Named volume (not a host bind mount) on purpose: buildkit's
      # overlay snapshotter relies on filesystem features (xattrs,
      # workdir cleanup semantics, idmapped chown) that macOS Docker
      # Desktop's virtiofs-backed bind mounts don't fully support. A
      # named volume lives on the Linux VM's native ext4 and behaves
      # correctly. Cost: cache survives `rm -rf ./data` and needs an
      # explicit `docker volume rm pipeline-builder_buildkit-cache`
      # to wipe.
      - 'buildkit-cache:/home/user/.local/share/buildkit:rw'
      - './config/buildkitd/buildkitd.toml:/home/user/.config/buildkit/buildkitd.toml:ro'
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "buildctl", "--addr", "tcp://127.0.0.1:1234", "debug", "workers"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          # Rootless buildkit runs the plugin's RUN steps in this container; too
          # low OOM-kills heavy builds → "buildkit-runc … container not running".
          # Tunable via BUILDKIT_MEMORY_LIMIT in .env (compose expands it; default
          # 3072M — same 3Gi tier as minikube). Use M/G, NOT Mi (so the value is
          # also valid if minikube falls back to this .env).
          memory: ${BUILDKIT_MEMORY_LIMIT:-3072M}
        reservations:
          cpus: '0.5'
          memory: 512M

  # ---------------------------------------------------------------------------
  # QUARANTINE BuildKit daemon — anonymous plugin submissions ONLY
  # (docs/plugin-publishing.md#submitting-without-an-account).
  #
  # Runs the Dockerfile RUN steps of zips uploaded by people who are not logged
  # in, so it is the least-trusted workload in the stack and is kept apart from
  # the tenant `buildkitd` above on every axis compose can express:
  #   - its OWN network (quarantine-network): the only other members are the
  #     plugin service (the one client), the registry (push quarantine/<id>, pull
  #     base images through the mirror) and image-registry (the registry token
  #     realm). Postgres, Redis, MinIO, platform and every other service are on
  #     backend-network only, which this container is NOT attached to.
  #   - no environment at all (no credentials, no service keys), no volumes but
  #     its own cache and read-only config, and a smaller CPU/memory cap. Registry
  #     push credentials never live here: buildctl in the plugin service hands a
  #     short-lived, quarantine/-scoped token over the build session.
  #   - its own buildkitd.toml (package-mirror/registry settings only).
  # Compose has no FQDN egress filter, so outbound internet (package mirrors) is
  # NOT narrowed here as it is on the k8s targets' NetworkPolicies/Cilium set —
  # this target is a local dev stack, and the flag stays off by default.
  # test/deploy-contracts/test/quarantine-builder-contract.test.ts pins all of this.
  # ---------------------------------------------------------------------------
  buildkitd-quarantine:
    image: 'moby/buildkit@sha256:66e5fe5b25509626c0e628c6e57badbcc2e8a62218ba3e1358f1427e90de6a88'  # moby/buildkit:v0.32.1-rootless
    container_name: buildkitd-quarantine
    restart: always
    stop_grace_period: 5s
    user: "1000:1000"
    # Same rootless requirements as the tenant buildkitd (newuidmap + unshare).
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    command:
      - --addr
      - tcp://0.0.0.0:1234
      - --oci-worker-no-process-sandbox
      - --config
      - /home/user/.config/buildkit/buildkitd.toml
    expose:
      - "1234"
    volumes:
      - 'buildkit-quarantine-cache:/home/user/.local/share/buildkit:rw'
      - './config/buildkitd-quarantine/buildkitd.toml:/home/user/.config/buildkit/buildkitd.toml:ro'
    networks:
      - quarantine-network
    healthcheck:
      test: ["CMD", "buildctl", "--addr", "tcp://127.0.0.1:1234", "debug", "workers"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2048M
          pids: 1024
        reservations:
          cpus: '0.1'
          memory: 256M

  pipeline:
    image: 'ghcr.io/mwashburn160/pipeline:4.1.21@sha256:9df4d61648c5e9173085de79f6a758f9b1a1d5a10db71652f3d981f7bec0ba31'
    container_name: pipeline
    restart: always
    stop_grace_period: 10s
    environment:
      <<: [*common-env, *postgres-env, *server-env, *redis-env, *quota-client-env, *ai-env, *tunables-env]
      SERVICE_NAME: pipeline
      # Service tunables (blank = code default; see .env.example).
      PIPELINE_EXEC_IDEMPOTENCY_WINDOW_SECONDS: ${PIPELINE_EXEC_IDEMPOTENCY_WINDOW_SECONDS:-}
      PIPELINE_PLUGIN_SERVICE_TIMEOUT_MS: ${PIPELINE_PLUGIN_SERVICE_TIMEOUT_MS:-}
      ORG_SCORECARD_MAX_PIPELINES: ${ORG_SCORECARD_MAX_PIPELINES:-}
      ORG_SCORECARD_CONCURRENCY: ${ORG_SCORECARD_CONCURRENCY:-}
      COMPLIANCE_SERVICE_HOST: ${COMPLIANCE_SERVICE_HOST:-compliance}
      COMPLIANCE_SERVICE_PORT: ${COMPLIANCE_SERVICE_PORT:-3000}
      COMPLIANCE_BYPASS: ${COMPLIANCE_BYPASS:-false}
      PLUGIN_SERVICE_HOST: ${PLUGIN_SERVICE_HOST:-plugin}
      PLUGIN_SERVICE_PORT: ${PLUGIN_SERVICE_PORT:-3000}
      HANDLER_TIMEOUT_MS: ${HANDLER_TIMEOUT_MS:-30000}
      # The create-time plugin contract check resolves installed listings with the
      # same scan-gate rule as the plugin service's lookup.
      PLUGIN_BLOCK_ON_NEW_CRITICAL: ${PLUGIN_BLOCK_ON_NEW_CRITICAL:-false}
    volumes:
      - *service-key-bundle
      - *dev-ca
      - ./certs/service-keys/pipeline.key:/etc/pipeline-builder/service-keys/service.key:ro
    networks:
      - backend-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *api-healthcheck
    deploy: *api-deploy

  message:
    image: 'ghcr.io/mwashburn160/message:4.1.22@sha256:74b3a216231ed72840b528c7b01e3ecdd5e48e4024dd264a6fbf1d9ef890b9b2'
    container_name: message
    restart: always
    stop_grace_period: 10s
    environment:
      <<: [*common-env, *postgres-env, *server-env, *redis-env, *quota-client-env, *tunables-env]
      SERVICE_NAME: message
      SUPPORT_ALIASES: ${SUPPORT_ALIASES:-support@pipeline-builder,help@pipeline-builder}
      # Message attachments — S3-compatible object storage (MinIO). Path-style +
      # custom endpoint. Uses a per-service, bucket-scoped MinIO key (created by
      # minio-init), NOT the root credentials.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-message-attachments}
      S3_ACCESS_KEY_ID: ${MESSAGE_S3_ACCESS_KEY}
      S3_SECRET_ACCESS_KEY: ${MESSAGE_S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: 'true'
      MESSAGE_ATTACHMENT_MAX_MB: ${MESSAGE_ATTACHMENT_MAX_MB:-10}
    volumes:
      - *service-key-bundle
      - *dev-ca
      - ./certs/service-keys/message.key:/etc/pipeline-builder/service-keys/service.key:ro
    networks:
      - backend-network
    depends_on:
      <<: *needs-minio
      postgres:
        condition: service_healthy
    healthcheck: *api-healthcheck
    deploy: *api-deploy-small

  reporting:
    image: 'ghcr.io/mwashburn160/reporting:4.1.21@sha256:381c27535cb74c4794777f528b662eda2d3845402057907317357313a5d8cef6'
    container_name: reporting
    restart: always
    stop_grace_period: 10s
    environment:
      <<: [*common-env, *postgres-env, *server-env, *redis-env, *tunables-env]
      SERVICE_NAME: reporting
      # Service tunables (blank = code default; see .env.example).
      REPORTING_RETENTION_ENABLED: ${REPORTING_RETENTION_ENABLED:-}
      REPORTING_RETENTION_INTERVAL_HOURS: ${REPORTING_RETENTION_INTERVAL_HOURS:-}
    volumes:
      - *service-key-bundle
      - *dev-ca
      - ./certs/service-keys/reporting.key:/etc/pipeline-builder/service-keys/service.key:ro
    networks:
      - backend-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *api-healthcheck
    deploy: *api-deploy-small

  compliance:
    image: 'ghcr.io/mwashburn160/compliance:4.1.22@sha256:e33228bce1db4a54fe02ff22ec5ce5baeb5924f9a4936ac75ef42ed16d06a6c1'
    container_name: compliance
    restart: always
    stop_grace_period: 10s
    environment:
      <<: [*common-env, *postgres-env, *server-env, *redis-env, *quota-client-env, *tunables-env]
      SERVICE_NAME: compliance
      # Service tunables (blank = code default; see .env.example).
      COMPLIANCE_MAX_ATTRIBUTE_DEPTH: ${COMPLIANCE_MAX_ATTRIBUTE_DEPTH:-}
      COMPLIANCE_MAX_ATTRIBUTE_KEYS: ${COMPLIANCE_MAX_ATTRIBUTE_KEYS:-}
      COMPLIANCE_MAX_REGEX_LENGTH: ${COMPLIANCE_MAX_REGEX_LENGTH:-}
      COMPLIANCE_SCAN_PROGRESS_BATCH_SIZE: ${COMPLIANCE_SCAN_PROGRESS_BATCH_SIZE:-}
      MESSAGE_SERVICE_HOST: message
      MESSAGE_SERVICE_PORT: '3000'
      PLUGIN_SERVICE_HOST: plugin
      PLUGIN_SERVICE_PORT: '3000'
      PIPELINE_SERVICE_HOST: pipeline
      PIPELINE_SERVICE_PORT: '3000'
    volumes:
      - *service-key-bundle
      - *dev-ca
      - ./certs/service-keys/compliance.key:/etc/pipeline-builder/service-keys/service.key:ro
    networks:
      - backend-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *api-healthcheck
    deploy: *deploy-medium

  quota:
    image: 'ghcr.io/mwashburn160/quota:4.1.21@sha256:5cb450a92fb09c0d541e4e9a81dceb8de7e689be928fa53af6f4263a5a46eae8'
    container_name: quota
    restart: always
    stop_grace_period: 10s
    environment:
      # server-env: NODE_ENV=production (security guards), CORS, rate limits, TRUST_PROXY.
      <<: [*common-env, *server-env, *redis-env, *tunables-env, *quota-tier-developer-env]
      SERVICE_NAME: quota
      # Service tunables (blank = code default; see .env.example).
      QUOTA_AT_RISK_CACHE_TTL_MS: ${QUOTA_AT_RISK_CACHE_TTL_MS:-}
      PORT: ${PORT:-3000}
      MONGODB_URI: ${MONGODB_URI}
      QUOTA_DEFAULT_PLUGINS: ${QUOTA_DEFAULT_PLUGINS:-100}
      QUOTA_DEFAULT_PIPELINES: ${QUOTA_DEFAULT_PIPELINES:-10}
      QUOTA_DEFAULT_API_CALLS: ${QUOTA_DEFAULT_API_CALLS:--1}
      QUOTA_RESET_DAYS: ${QUOTA_RESET_DAYS:-3}
      # Quota tier overrides (empty → code default in quota-tiers.ts; -1 =
      # unlimited). The developer tier + DEFAULT_QUOTA_TIER arrive via
      # x-quota-tier-developer-env, which platform shares.
      QUOTA_TIER_PRO_PLUGINS: ${QUOTA_TIER_PRO_PLUGINS:-}
      QUOTA_TIER_PRO_PIPELINES: ${QUOTA_TIER_PRO_PIPELINES:-}
      QUOTA_TIER_PRO_API_CALLS: ${QUOTA_TIER_PRO_API_CALLS:-}
      QUOTA_TIER_PRO_AI_CALLS: ${QUOTA_TIER_PRO_AI_CALLS:-}
      QUOTA_TIER_PRO_STORAGE_BYTES: ${QUOTA_TIER_PRO_STORAGE_BYTES:-}
      QUOTA_TIER_PRO_DASHBOARDS: ${QUOTA_TIER_PRO_DASHBOARDS:-}
      QUOTA_TIER_PRO_ALERT_RULES: ${QUOTA_TIER_PRO_ALERT_RULES:-}
      QUOTA_TIER_PRO_ALERT_DESTINATIONS: ${QUOTA_TIER_PRO_ALERT_DESTINATIONS:-}
      QUOTA_TIER_PRO_IDP_CONFIGS: ${QUOTA_TIER_PRO_IDP_CONFIGS:-}
      QUOTA_TIER_PRO_LISTINGS: ${QUOTA_TIER_PRO_LISTINGS:-}
      QUOTA_TIER_PRO_SEATS: ${QUOTA_TIER_PRO_SEATS:-}
      QUOTA_TIER_TEAM_PLUGINS: ${QUOTA_TIER_TEAM_PLUGINS:-}
      QUOTA_TIER_TEAM_PIPELINES: ${QUOTA_TIER_TEAM_PIPELINES:-}
      QUOTA_TIER_TEAM_API_CALLS: ${QUOTA_TIER_TEAM_API_CALLS:-}
      QUOTA_TIER_TEAM_AI_CALLS: ${QUOTA_TIER_TEAM_AI_CALLS:-}
      QUOTA_TIER_TEAM_STORAGE_BYTES: ${QUOTA_TIER_TEAM_STORAGE_BYTES:-}
      QUOTA_TIER_TEAM_DASHBOARDS: ${QUOTA_TIER_TEAM_DASHBOARDS:-}
      QUOTA_TIER_TEAM_ALERT_RULES: ${QUOTA_TIER_TEAM_ALERT_RULES:-}
      QUOTA_TIER_TEAM_ALERT_DESTINATIONS: ${QUOTA_TIER_TEAM_ALERT_DESTINATIONS:-}
      QUOTA_TIER_TEAM_IDP_CONFIGS: ${QUOTA_TIER_TEAM_IDP_CONFIGS:-}
      QUOTA_TIER_TEAM_LISTINGS: ${QUOTA_TIER_TEAM_LISTINGS:-}
      QUOTA_TIER_TEAM_SEATS: ${QUOTA_TIER_TEAM_SEATS:-}
      QUOTA_TIER_ENTERPRISE_PLUGINS: ${QUOTA_TIER_ENTERPRISE_PLUGINS:-}
      QUOTA_TIER_ENTERPRISE_PIPELINES: ${QUOTA_TIER_ENTERPRISE_PIPELINES:-}
      QUOTA_TIER_ENTERPRISE_API_CALLS: ${QUOTA_TIER_ENTERPRISE_API_CALLS:-}
      QUOTA_TIER_ENTERPRISE_AI_CALLS: ${QUOTA_TIER_ENTERPRISE_AI_CALLS:-}
      QUOTA_TIER_ENTERPRISE_STORAGE_BYTES: ${QUOTA_TIER_ENTERPRISE_STORAGE_BYTES:-}
      QUOTA_TIER_ENTERPRISE_DASHBOARDS: ${QUOTA_TIER_ENTERPRISE_DASHBOARDS:-}
      QUOTA_TIER_ENTERPRISE_ALERT_RULES: ${QUOTA_TIER_ENTERPRISE_ALERT_RULES:-}
      QUOTA_TIER_ENTERPRISE_ALERT_DESTINATIONS: ${QUOTA_TIER_ENTERPRISE_ALERT_DESTINATIONS:-}
      QUOTA_TIER_ENTERPRISE_IDP_CONFIGS: ${QUOTA_TIER_ENTERPRISE_IDP_CONFIGS:-}
      QUOTA_TIER_ENTERPRISE_LISTINGS: ${QUOTA_TIER_ENTERPRISE_LISTINGS:-}
      QUOTA_TIER_ENTERPRISE_SEATS: ${QUOTA_TIER_ENTERPRISE_SEATS:-}
      QUOTA_TIER_DEVELOPER_LABEL: ${QUOTA_TIER_DEVELOPER_LABEL:-}
      QUOTA_TIER_PRO_LABEL: ${QUOTA_TIER_PRO_LABEL:-}
      QUOTA_TIER_TEAM_LABEL: ${QUOTA_TIER_TEAM_LABEL:-}
      QUOTA_TIER_ENTERPRISE_LABEL: ${QUOTA_TIER_ENTERPRISE_LABEL:-}
    volumes:
      - *service-key-bundle
      - *dev-ca
      - ./certs/service-keys/quota.key:/etc/pipeline-builder/service-keys/service.key:ro
    networks:
      - backend-network
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck: *api-healthcheck
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
        reservations:
          cpus: '0.25'
          memory: 192M

  # pipeline-image-registry — Docker registry token-auth issuer +
  # /api/images/* management API. Customer CodeBuild pulls go through
  # the underlying registry (which delegates token issuance here);
  # api/plugin pushes mint a short-lived platform JWT and present it as
  # the Basic-auth password — image-registry verifies the JWT and issues
  # a registry-scoped Bearer token.
  image-registry:
    image: 'ghcr.io/mwashburn160/image-registry:4.1.21@sha256:a794474757f0ea54c7cf0444365d97c0a79370834608854ff86c4afb67fba2bb'
    container_name: image-registry
    restart: always
    stop_grace_period: 10s
    environment:
      # server-env: NODE_ENV=production (security guards), CORS, rate limits, TRUST_PROXY.
      <<: [*common-env, *server-env, *redis-env, *tunables-env]
      SERVICE_NAME: image-registry
      # Service tunables (blank = code default; see .env.example).
      REGISTRY_BLOB_STREAM_TIMEOUT_MS: ${REGISTRY_BLOB_STREAM_TIMEOUT_MS:-}
      REGISTRY_COPY_PARALLEL_BLOBS: ${REGISTRY_COPY_PARALLEL_BLOBS:-}
      REGISTRY_COPY_PARALLEL_CHILDREN: ${REGISTRY_COPY_PARALLEL_CHILDREN:-}
      REGISTRY_GC_ENABLED: ${REGISTRY_GC_ENABLED:-false}
      REGISTRY_GC_INTERVAL_HOURS: ${REGISTRY_GC_INTERVAL_HOURS:-}
      REGISTRY_GC_MAX_AGE_DAYS: ${REGISTRY_GC_MAX_AGE_DAYS:-}
      REGISTRY_GC_STARTUP_DELAY_MS: ${REGISTRY_GC_STARTUP_DELAY_MS:-}
      REGISTRY_GC_LOCK_TTL_MS: ${REGISTRY_GC_LOCK_TTL_MS:-}
      REGISTRY_MAX_BLOB_PROXY_BYTES: ${REGISTRY_MAX_BLOB_PROXY_BYTES:-}
      REGISTRY_STORAGE_CACHE_TTL_MS: ${REGISTRY_STORAGE_CACHE_TTL_MS:-}
      PORT: ${PORT:-3000}
      # Underlying registry the proxy + management API talks to.
      IMAGE_REGISTRY_HOST: ${IMAGE_REGISTRY_HOST:-registry}
      IMAGE_REGISTRY_PORT: ${IMAGE_REGISTRY_PORT:-5000}
      IMAGE_REGISTRY_HTTP: ${IMAGE_REGISTRY_HTTP:-true}
      IMAGE_REGISTRY_INSECURE: ${IMAGE_REGISTRY_INSECURE:-true}
      # Sourced from IMAGE_REGISTRY_USER/TOKEN — the same generated pair the
      # kubernetes targets feed into this service's Secret (bin/k8s-resources.sh).
      # One pair, everywhere: a docker-only IMAGE_REGISTRY_USERNAME/PASSWORD pair
      # would be inert on k8s and would miss gen-env-secrets' substitution here.
      IMAGE_REGISTRY_USERNAME: ${IMAGE_REGISTRY_USER}
      IMAGE_REGISTRY_PASSWORD: ${IMAGE_REGISTRY_TOKEN}
      # JWT signing keypair — generated by `deploy/bin/jwt-keys.sh`.
      # This service signs registry-auth JWTs with the private key; the cert
      # is also mounted into the registry container so it can verify those
      # JWTs (`REGISTRY_AUTH_TOKEN_ROOTCERTBUNDLE`).
      REGISTRY_TOKEN_PRIVATE_KEY_FILE: /etc/registry/jwt-private.pem
      REGISTRY_TOKEN_CERTIFICATE_FILE: /etc/registry/jwt-public.pem
      REGISTRY_TOKEN_ISSUER: ${REGISTRY_TOKEN_ISSUER:-platform}
      REGISTRY_TOKEN_SERVICE: ${REGISTRY_TOKEN_SERVICE:-pipeline-image-registry}
      REGISTRY_TOKEN_EXPIRES_IN: ${REGISTRY_TOKEN_EXPIRES_IN:-300}
      # Plugin-image signing (cosign sign + SBOM attest at POST
      # /internal/plugin-signatures, callable by `plugin` only). This service
      # is the signing key's ONLY holder — plugin gets just the public half.
      # local = the PEM bind-mounted below; kms = alias/<name> in AWS KMS (needs
      # AWS credentials this compose stack does not provide — an aws/* option).
      PLUGIN_SIGNING_MODE: ${PLUGIN_SIGNING_MODE:-local}
      PLUGIN_SIGNING_KEY_FILE: ${PLUGIN_SIGNING_KEY_FILE:-/etc/pipeline-builder/plugin-signing/plugin-signing.key}
      PLUGIN_SIGNING_KMS_KEY_ID: ${PLUGIN_SIGNING_KMS_KEY_ID:-}
    volumes:
      # The RS256 keypair this registry signs its OWN pull/push tokens with.
      - './certs/image-registry-jwt.key:/etc/registry/jwt-private.pem:ro'
      - './certs/image-registry-jwt.crt:/etc/registry/jwt-public.pem:ro'
      # The plugin-image signing PRIVATE key — mounted here and nowhere else.
      # Generated by deploy/bin/plugin-signing-keys.sh before `compose up`.
      - ./certs/plugin-signing/plugin-signing.key:/etc/pipeline-builder/plugin-signing/plugin-signing.key:ro
      - *service-key-bundle
      - *dev-ca
      - ./certs/service-keys/image-registry.key:/etc/pipeline-builder/service-keys/service.key:ro
    networks:
      - backend-network
      - proxy-network
      # The registry token realm for buildkitd-quarantine's pushes/pulls.
      - quarantine-network
    healthcheck: *api-healthcheck
    deploy: *api-deploy-small

  billing:
    image: 'ghcr.io/mwashburn160/billing:4.1.21@sha256:bbb438b71c8825f52ec19b5efd3f3051a1a1138e09a4691b4980c131e9f907be'
    container_name: billing
    restart: always
    stop_grace_period: 10s
    environment:
      # server-env: NODE_ENV=production (security guards), CORS, rate limits, TRUST_PROXY.
      <<: [*common-env, *postgres-env, *server-env, *redis-env, *quota-client-env, *tunables-env]
      SERVICE_NAME: billing
      # Service tunables (blank = code default; see .env.example).
      BILLING_USAGE_FALLBACK_DAYS: ${BILLING_USAGE_FALLBACK_DAYS:-}
      BILLING_WEBHOOK_INPROGRESS_TTL_SECONDS: ${BILLING_WEBHOOK_INPROGRESS_TTL_SECONDS:-}
      BILLING_ENABLED: ${BILLING_ENABLED:-true}
      PORT: ${PORT:-3000}
      MONGODB_URI: ${MONGODB_URI}
      # Platform service — billing pushes seat limits + entitlements and reads
      # pooled seat usage here (two-target entitlement fan-out + over-cap gate).
      PLATFORM_SERVICE_HOST: ${PLATFORM_SERVICE_HOST:-platform}
      PLATFORM_SERVICE_PORT: ${PLATFORM_SERVICE_PORT:-3000}
      # Fallback return URL for the Stripe billing portal (the request Origin is
      # preferred; this is used only when it's absent).
      PLATFORM_FRONTEND_URL: ${PLATFORM_FRONTEND_URL:-https://localhost:8443}
      # Billing provider (stub | aws-marketplace | stripe)
      BILLING_PROVIDER: ${BILLING_PROVIDER:-stub}
      # Stripe (only when BILLING_PROVIDER=stripe)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_MAP: ${STRIPE_PRICE_MAP:-}
      # AWS Marketplace (only when BILLING_PROVIDER=aws-marketplace)
      AWS_MARKETPLACE_PRODUCT_CODE: ${AWS_MARKETPLACE_PRODUCT_CODE:-}
      AWS_MARKETPLACE_REGION: ${AWS_MARKETPLACE_REGION:-us-east-1}
      AWS_MARKETPLACE_SNS_TOPIC_ARN: ${AWS_MARKETPLACE_SNS_TOPIC_ARN:-}
      AWS_MARKETPLACE_DIMENSION_MAP: ${AWS_MARKETPLACE_DIMENSION_MAP:-}
      AWS_MARKETPLACE_BUNDLE_DIMENSION_MAP: ${AWS_MARKETPLACE_BUNDLE_DIMENSION_MAP:-}
      # Marketplace add-on metering (BatchMeterUsage). Off by default; enable only
      # once the listing's metered dimensions match the bundle-dimension map.
      BILLING_METERING_ENABLED: ${BILLING_METERING_ENABLED:-false}
      BILLING_METERING_INTERVAL_MS: ${BILLING_METERING_INTERVAL_MS:-3600000}
      # Plan pricing
      BILLING_PLAN_DEVELOPER_MONTHLY: ${BILLING_PLAN_DEVELOPER_MONTHLY:-0}
      BILLING_PLAN_DEVELOPER_ANNUAL: ${BILLING_PLAN_DEVELOPER_ANNUAL:-0}
      BILLING_PLAN_PRO_MONTHLY: ${BILLING_PLAN_PRO_MONTHLY:-3900}
      BILLING_PLAN_PRO_ANNUAL: ${BILLING_PLAN_PRO_ANNUAL:-39000}
      BILLING_PLAN_TEAM_MONTHLY: ${BILLING_PLAN_TEAM_MONTHLY:-7900}
      BILLING_PLAN_TEAM_ANNUAL: ${BILLING_PLAN_TEAM_ANNUAL:-79000}
      BILLING_PLAN_ENTERPRISE_MONTHLY: ${BILLING_PLAN_ENTERPRISE_MONTHLY:-59900}
      BILLING_PLAN_ENTERPRISE_ANNUAL: ${BILLING_PLAN_ENTERPRISE_ANNUAL:-599000}
      # Plan display names (optional overrides)
      BILLING_PLAN_DEVELOPER_NAME: ${BILLING_PLAN_DEVELOPER_NAME:-}
      BILLING_PLAN_PRO_NAME: ${BILLING_PLAN_PRO_NAME:-}
      BILLING_PLAN_TEAM_NAME: ${BILLING_PLAN_TEAM_NAME:-}
      BILLING_PLAN_ENTERPRISE_NAME: ${BILLING_PLAN_ENTERPRISE_NAME:-}
      # Plan descriptions (optional overrides)
      BILLING_PLAN_DEVELOPER_DESCRIPTION: ${BILLING_PLAN_DEVELOPER_DESCRIPTION:-}
      BILLING_PLAN_PRO_DESCRIPTION: ${BILLING_PLAN_PRO_DESCRIPTION:-}
      BILLING_PLAN_TEAM_DESCRIPTION: ${BILLING_PLAN_TEAM_DESCRIPTION:-}
      BILLING_PLAN_ENTERPRISE_DESCRIPTION: ${BILLING_PLAN_ENTERPRISE_DESCRIPTION:-}
      # Plan features (optional JSON array overrides)
      BILLING_PLAN_DEVELOPER_FEATURES: ${BILLING_PLAN_DEVELOPER_FEATURES:-}
      BILLING_PLAN_PRO_FEATURES: ${BILLING_PLAN_PRO_FEATURES:-}
      BILLING_PLAN_TEAM_FEATURES: ${BILLING_PLAN_TEAM_FEATURES:-}
      BILLING_PLAN_ENTERPRISE_FEATURES: ${BILLING_PLAN_ENTERPRISE_FEATURES:-}
      # Discounts (docs/billing-discounts.md) — on by default. Keys are SECRET.
      BILLING_DISCOUNTS_ENABLED: ${BILLING_DISCOUNTS_ENABLED:-true}
      BILLING_DISCOUNT_KEYS: ${BILLING_DISCOUNT_KEYS:-}
      BILLING_DISCOUNT_MAX_PERCENT: ${BILLING_DISCOUNT_MAX_PERCENT:-100}
      BILLING_DISCOUNT_MAX_CENTS: ${BILLING_DISCOUNT_MAX_CENTS:-10000000}
      # Add-on bundles (docs/billing-bundles.md) — off by default
      BILLING_BUNDLES_ENABLED: ${BILLING_BUNDLES_ENABLED:-true}
      # Per-bundle price (cents) / grant / purchasable-tier overrides. The key
      # is BILLING_BUNDLE_<ID>_<MONTHLY|ANNUAL|GRANT|TIERS>, where <ID> is the
      # bundle id in api/billing src/config/billing-config.ts upper-cased — so
      # the per-seat bundle is SEAT, not SEAT_PACK. Unset = the shipped default.
      # Every bundle in that catalog is listed here: unlike the k8s targets
      # (which hand the whole .env to the pod via envFrom), compose gives each
      # service an explicit environment, so a key missing from this list is
      # silently ignored no matter what .env says.
      BILLING_BUNDLE_SEAT_MONTHLY: ${BILLING_BUNDLE_SEAT_MONTHLY:-}
      BILLING_BUNDLE_SEAT_ANNUAL: ${BILLING_BUNDLE_SEAT_ANNUAL:-}
      BILLING_BUNDLE_SEAT_GRANT: ${BILLING_BUNDLE_SEAT_GRANT:-}

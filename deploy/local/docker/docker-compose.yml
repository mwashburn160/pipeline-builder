      # Feature bundles — price + tier only (they grant no quota dimension).
      BILLING_BUNDLE_ADVANCED_REPORTING_MONTHLY: ${BILLING_BUNDLE_ADVANCED_REPORTING_MONTHLY:-}
      BILLING_BUNDLE_ADVANCED_REPORTING_ANNUAL: ${BILLING_BUNDLE_ADVANCED_REPORTING_ANNUAL:-}
      BILLING_BUNDLE_ADVANCED_REPORTING_TIERS: ${BILLING_BUNDLE_ADVANCED_REPORTING_TIERS:-}
      BILLING_BUNDLE_TEAM_USAGE_ANALYTICS_MONTHLY: ${BILLING_BUNDLE_TEAM_USAGE_ANALYTICS_MONTHLY:-}

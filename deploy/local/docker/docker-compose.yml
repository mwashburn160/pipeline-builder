# =============================================================================
# Shared YAML Anchors
# =============================================================================

# -- Healthcheck for API containers --
# Probes /ready (readiness), not /health (liveness): a container is only
# "healthy" once its datastore deps are connected, so `depends_on:
# condition: service_healthy` actually waits for a service that can serve —
# closing the startup races (e.g. a load hitting a still-connecting compliance).
# Safe under plain compose: an unhealthy container is NOT restarted (`restart:`
# fires only on exit); this just gates ordering. With the listen-first servers,
# the port opens immediately and the container reports "starting" until ready.
x-api-healthcheck: &api-healthcheck
  test: ["CMD", "curl", "-f", "http://localhost:3000/ready"]
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 180s

# -- Deploy defaults for API containers --
x-api-deploy: &api-deploy
  resources:
    limits:
      cpus: '0.75'
      memory: 768M
    reservations:
      cpus: '0.4'
      memory: 384M

# -- Deploy defaults for the smaller API containers (message, reporting,
# image-registry, billing): request/response services with no build, query or
# render workload behind them. --
x-api-deploy-small: &api-deploy-small
  resources:
    limits:
      cpus: '0.35'
      memory: 384M
    reservations:
      cpus: '0.15'
      memory: 192M

# -- Deploy defaults for database containers --
x-db-deploy: &db-deploy
  resources:
    limits:
      cpus: '1.5'
      memory: 1.5G
    reservations:
      cpus: '0.8'
      memory: 768M

# -- The mid tier: services that need half a core and 512M under load and
# reserve half of that at rest (frontend, compliance, prometheus, loki). --
x-deploy-medium: &deploy-medium
  resources:
    limits:
      cpus: '0.5'
      memory: 512M
    reservations:
      cpus: '0.25'
      memory: 256M

# -- Object-store / metric-query services (minio, thanos store-gateway +
# querier): memory-hungry when a query fans out, near-idle otherwise, so the
# same 512M ceiling as the mid tier over a much lower floor. --
x-deploy-storage: &deploy-storage
  resources:
    limits:
      cpus: '0.35'
      memory: 512M
    reservations:
      cpus: '0.10'
      memory: 128M

# -- Datastore exporters: one scrape endpoint each, no state. --
x-exporter-deploy: &exporter-deploy
  resources:
    limits:
      cpus: '0.10'
      memory: 128M
    reservations:
      cpus: '0.025'
      memory: 48M

# -- The PUBLIC per-service key bundle, mounted read-only into every API service.
# Each service ALSO mounts its own PRIVATE key at
# /etc/pipeline-builder/service-keys/service.key — the per-service
# `./certs/service-keys/<name>.key:…` line in its `volumes:`, mounted there and
# nowhere else, so a compromised service cannot sign as another. #14
x-service-key-bundle: &service-key-bundle
  ./certs/service-keys/bundle.json:/etc/pipeline-builder/service-key-bundle/bundle.json:ro

# -- Local dev CA (deploy/bin/nginx-tls.sh writes certs/dev-ca.crt: mkcert's
# root, or the self-signed gateway cert). The RELEASE images trust no dev CA —
# it is mounted here, into local containers only, and NODE_EXTRA_CA_CERTS
# points Node at it, so server-side HTTPS to the gateway verifies.
x-dev-ca: &dev-ca
  ./certs/dev-ca.crt:/etc/pipeline-builder/dev-ca.crt:ro

# -- Thanos object-store config + the credentials it references. objstore.yml
# contains $(THANOS_S3_*) refs, which Thanos expands from the environment, so
# the two always travel together — every Thanos component that touches the
# bucket takes both (the querier touches only its peers' StoreAPIs, so it takes
# neither).
x-thanos-objstore: &thanos-objstore
  ./config/thanos/objstore.yml:/etc/thanos/objstore.yml:ro

x-thanos-env: &thanos-env
  THANOS_S3_ACCESS_KEY: ${THANOS_S3_ACCESS_KEY}
  THANOS_S3_SECRET_KEY: ${THANOS_S3_SECRET_KEY}

# -- Gate on the one-shot bucket/user bootstrap. Anything that opens a MinIO
# connection at boot takes this, so it never races the bucket into existence.
x-needs-minio: &needs-minio
  minio-init:
    condition: service_completed_successfully

# -- Env shared by ALL API services --
x-common-env: &common-env
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  # INTERNAL service-to-service tokens: each service signs with its OWN
  # ES256 key, mounted read-only at the path below, and verifies its peers
  # against the shared PUBLIC bundle. There is no shared signing secret left —
  # tokens that speak for a person are ES256 signed by platform alone. Both
  # files come from deploy/bin/service-signing-keys.sh; a service refuses to
  # start without them.
  SERVICE_SIGNING_KEY_FILE: /etc/pipeline-builder/service-keys/service.key
  SERVICE_KEY_BUNDLE_FILE: /etc/pipeline-builder/service-key-bundle/bundle.json
  # AES-256-GCM master key for encrypted secret columns (AI provider keys, IdP
  # client secrets). Required under NODE_ENV=production — platform refuses to
  # boot without it. In common-env rather than a service-specific block so any
  # service that grows a decrypt path already has it.
  SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY}
  # Decrypt-only fallback during a master-key rotation (empty otherwise); clear
  # it after `docker compose exec platform node scripts/reencrypt-secrets.js`.
  SECRET_ENCRYPTION_KEY_PREVIOUS: ${SECRET_ENCRYPTION_KEY_PREVIOUS:-}
  PLATFORM_BASE_URL: ${PLATFORM_BASE_URL:-https://localhost:8443}
  NODE_EXTRA_CA_CERTS: /etc/pipeline-builder/dev-ca.crt
  # OpenTelemetry. On by default — exports to the bundled `jaeger` all-in-one
  # collector (OTLP/HTTP on 4318; UI on http://localhost:16686). Set
  # OTEL_TRACING_ENABLED=false to opt out. Lives in common-env (not server-env)
  # so EVERY service — including quota/billing/image-registry — emits traces.
  OTEL_TRACING_ENABLED: ${OTEL_TRACING_ENABLED:-true}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}

# -- Env shared by Postgres-backed services (platform, plugin, pipeline) --
x-postgres-env: &postgres-env
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT}
  DATABASE: ${DATABASE}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  DRIZZLE_MAX_POOL_SIZE: ${DRIZZLE_MAX_POOL_SIZE:-20}
  DRIZZLE_IDLE_TIMEOUT_MILLIS: ${DRIZZLE_IDLE_TIMEOUT_MILLIS:-30000}
  DRIZZLE_CONNECTION_TIMEOUT_MILLIS: ${DRIZZLE_CONNECTION_TIMEOUT_MILLIS:-30000}
  # DB_USER is the NOSUPERUSER NOBYPASSRLS application role postgres-init.sql
  # creates — never POSTGRES_USER (a superuser bypasses row-level security).
  # Multi-tenant context mode for withTenantTx (packages/pipeline-data
  # tenancy.ts): strict throws when a query runs without tenant context, which
  # under the non-bypass role would otherwise silently see zero rows. Every
  # Postgres-backed service inherits this via x-postgres-env.
  RLS_CONTEXT_MODE: ${RLS_CONTEXT_MODE:-strict}
  # Postgres serves no TLS in compose, so SSL must stay off explicitly:
  # getSslConfig turns it ON by default under NODE_ENV=production.
  DB_SSL: ${DB_SSL:-false}

# -- Env shared by Express server services --
x-server-env: &server-env
  # MUST be `production`. A long list of security guards keys off it and
  # silently degrades when unset (dev-only JWT secret, all-zeros secret
  # encryption key, non-secure cookies, relaxed CSP). The images set no
  # NODE_ENV of their own, so it has to come from here.
  NODE_ENV: ${NODE_ENV:-production}
  CORS_CREDENTIALS: ${CORS_CREDENTIALS:-true}
  CORS_ORIGIN: ${CORS_ORIGIN}
  LIMITER_MAX: ${LIMITER_MAX:-2000}
  LIMITER_WINDOWMS: ${LIMITER_WINDOWMS:-900000}
  # Reverse-proxy hops in front of every service (browser -> nginx -> service).
  # Express uses it to derive req.ip for rate-limit buckets and audit source IPs.
  TRUST_PROXY: ${TRUST_PROXY:-1}

# -- Redis (every service that uses it) --
# Standalone mode: REDIS_URL only. REDIS_HOST/REDIS_PORT are not supported (a
# service refuses to start with REDIS_HOST set); REDIS_SENTINELS is the HA
# alternative and must not be combined with REDIS_URL.
x-redis-env: &redis-env
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}

# -- Env for services that call the quota service --
x-quota-client-env: &quota-client-env
  QUOTA_SERVICE_HOST: ${QUOTA_SERVICE_HOST:-quota}
  QUOTA_SERVICE_PORT: ${QUOTA_SERVICE_PORT:-3000}

# -- Developer-tier limit overrides + the default tier for new orgs. Taken by
# BOTH quota (which owns the full tier matrix) and platform, which seeds a new
# org's quota defaults from QUOTA_TIERS.developer.limits and so must see the
# same operator overrides. Empty → the code default in quota-tiers.ts; -1 =
# unlimited. --
x-quota-tier-developer-env: &quota-tier-developer-env
  DEFAULT_QUOTA_TIER: ${DEFAULT_QUOTA_TIER:-}
  QUOTA_TIER_DEVELOPER_PLUGINS: ${QUOTA_TIER_DEVELOPER_PLUGINS:-}
  QUOTA_TIER_DEVELOPER_PIPELINES: ${QUOTA_TIER_DEVELOPER_PIPELINES:-}
  QUOTA_TIER_DEVELOPER_API_CALLS: ${QUOTA_TIER_DEVELOPER_API_CALLS:-}
  QUOTA_TIER_DEVELOPER_AI_CALLS: ${QUOTA_TIER_DEVELOPER_AI_CALLS:-}
  QUOTA_TIER_DEVELOPER_STORAGE_BYTES: ${QUOTA_TIER_DEVELOPER_STORAGE_BYTES:-}
  QUOTA_TIER_DEVELOPER_DASHBOARDS: ${QUOTA_TIER_DEVELOPER_DASHBOARDS:-}
  QUOTA_TIER_DEVELOPER_ALERT_RULES: ${QUOTA_TIER_DEVELOPER_ALERT_RULES:-}
  QUOTA_TIER_DEVELOPER_ALERT_DESTINATIONS: ${QUOTA_TIER_DEVELOPER_ALERT_DESTINATIONS:-}
  QUOTA_TIER_DEVELOPER_IDP_CONFIGS: ${QUOTA_TIER_DEVELOPER_IDP_CONFIGS:-}
  QUOTA_TIER_DEVELOPER_LISTINGS: ${QUOTA_TIER_DEVELOPER_LISTINGS:-}
  QUOTA_TIER_DEVELOPER_SEATS: ${QUOTA_TIER_DEVELOPER_SEATS:-}

# -- Env for services that use AI generation --
# Everything the shared AI provider registry (packages/ai-core) reads: the
# per-provider keys, the Bedrock opt-in and the self-hosted OpenAI-compatible
# endpoint. Used by ask, pipeline and plugin alike, so a provider configured
# once in .env is available to every AI surface.
x-ai-env: &ai-env
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
  XAI_API_KEY: ${XAI_API_KEY:-}
  BEDROCK_ENABLED: ${BEDROCK_ENABLED:-}
  OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
  OPENAI_COMPATIBLE_MODELS: ${OPENAI_COMPATIBLE_MODELS:-}
  OPENAI_COMPATIBLE_NAME: ${OPENAI_COMPATIBLE_NAME:-}
  OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}

# -- Tunables read by the shared packages (api-core, api-server, pipeline-core,
# pipeline-data, ai-core) and therefore by every API service. Each is optional:
# blank (the default when .env leaves it commented) means "use the code
# default" — the shared env readers treat blank as unset. Documented in
# .env.example / docs/environment-variables.md; a deploy contract test keeps
# every app-read .env.example key passed through somewhere in this file.
x-tunables-env: &tunables-env
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  BILLING_SERVICE_TIMEOUT: ${BILLING_SERVICE_TIMEOUT:-}
  BITBUCKET_API_BASE_URL: ${BITBUCKET_API_BASE_URL:-}
  CACHE_CLEANUP_INTERVAL_MS: ${CACHE_CLEANUP_INTERVAL_MS:-}
  CACHE_CONTROL_DETAIL: ${CACHE_CONTROL_DETAIL:-}
  CACHE_CONTROL_LIST: ${CACHE_CONTROL_LIST:-}
  CODEBUILD_COMPUTE_TYPE: ${CODEBUILD_COMPUTE_TYPE:-}
  CODEBUILD_DEFAULT_IMAGE: ${CODEBUILD_DEFAULT_IMAGE:-}
  COMPLIANCE_VALIDATE_TIMEOUT_MS: ${COMPLIANCE_VALIDATE_TIMEOUT_MS:-}
  COMPRESSION_THRESHOLD_BYTES: ${COMPRESSION_THRESHOLD_BYTES:-}
  DB_MAX_RETRIES: ${DB_MAX_RETRIES:-}
  DB_RETRY_DELAY_MS: ${DB_RETRY_DELAY_MS:-}
  DEFAULT_PAGE_LIMIT: ${DEFAULT_PAGE_LIMIT:-}
  DEFAULT_PLUGIN_VERSION: ${DEFAULT_PLUGIN_VERSION:-}
  DIGEST_LOCK_TTL_MS: ${DIGEST_LOCK_TTL_MS:-}
  DIGEST_SCHEDULER_INTERVAL_MS: ${DIGEST_SCHEDULER_INTERVAL_MS:-}
  DORA_INCIDENT_WINDOW_HOURS: ${DORA_INCIDENT_WINDOW_HOURS:-}
  GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-}
  HTTP_CLIENT_MAX_RETRIES: ${HTTP_CLIENT_MAX_RETRIES:-}
  HTTP_CLIENT_MAX_SOCKETS: ${HTTP_CLIENT_MAX_SOCKETS:-}
  HTTP_CLIENT_RETRY_DELAY_MS: ${HTTP_CLIENT_RETRY_DELAY_MS:-}
  HTTP_CLIENT_TIMEOUT: ${HTTP_CLIENT_TIMEOUT:-}
  HTTP_METRICS_ORG_SAMPLE_RATE: ${HTTP_METRICS_ORG_SAMPLE_RATE:-}
  IDEMPOTENCY_CLEANUP_INTERVAL_MS: ${IDEMPOTENCY_CLEANUP_INTERVAL_MS:-}
  IDEMPOTENCY_MAX_STORE_SIZE: ${IDEMPOTENCY_MAX_STORE_SIZE:-}
  IDEMPOTENCY_PENDING_TTL_MS: ${IDEMPOTENCY_PENDING_TTL_MS:-}
  IDEMPOTENCY_TTL_MS: ${IDEMPOTENCY_TTL_MS:-}
  LAMBDA_ARCHITECTURE: ${LAMBDA_ARCHITECTURE:-}
  LAMBDA_MEMORY_SIZE: ${LAMBDA_MEMORY_SIZE:-}
  LAMBDA_RUNTIME: ${LAMBDA_RUNTIME:-}
  LAMBDA_TIMEOUT: ${LAMBDA_TIMEOUT:-}
  LOG_GROUP_NAME: ${LOG_GROUP_NAME:-}
  MAX_PAGE_LIMIT: ${MAX_PAGE_LIMIT:-}
  MAX_PROMPT_LENGTH: ${MAX_PROMPT_LENGTH:-}
  PIPELINE_NAME_MAX_LENGTH: ${PIPELINE_NAME_MAX_LENGTH:-}
  PLUGIN_BUILD_BACKOFF_DELAY_MS: ${PLUGIN_BUILD_BACKOFF_DELAY_MS:-}
  PLUGIN_BUILD_COMPLETED_RETENTION_SECS: ${PLUGIN_BUILD_COMPLETED_RETENTION_SECS:-}
  PLUGIN_BUILD_FAILED_RETENTION_SECS: ${PLUGIN_BUILD_FAILED_RETENTION_SECS:-}
  PLUGIN_BUILD_MAX_ATTEMPTS: ${PLUGIN_BUILD_MAX_ATTEMPTS:-}
  PLUGIN_BUILD_QUEUE_NAME: ${PLUGIN_BUILD_QUEUE_NAME:-}
  PLUGIN_BUILD_WORKER_TIMEOUT_MS: ${PLUGIN_BUILD_WORKER_TIMEOUT_MS:-}
  PLUGIN_DLQ_BACKOFF_BASE_MS: ${PLUGIN_DLQ_BACKOFF_BASE_MS:-}

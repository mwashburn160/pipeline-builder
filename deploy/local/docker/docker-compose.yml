      PLATFORM_FRONTEND_URL: ${PLATFORM_FRONTEND_URL:-https://localhost:8443}
      # Billing provider (stub | aws-marketplace | stripe)
      BILLING_PROVIDER: ${BILLING_PROVIDER:-stub}
      # Stripe (only when BILLING_PROVIDER=stripe)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_MAP: ${STRIPE_PRICE_MAP:-}
      # AWS Marketplace (only when BILLING_PROVIDER=aws-marketplace)
      AWS_MARKETPLACE_PRODUCT_CODE: ${AWS_MARKETPLACE_PRODUCT_CODE:-}
      AWS_MARKETPLACE_REGION: ${AWS_MARKETPLACE_REGION:-us-east-1}
      AWS_MARKETPLACE_SNS_TOPIC_ARN: ${AWS_MARKETPLACE_SNS_TOPIC_ARN:-}
      AWS_MARKETPLACE_DIMENSION_MAP: ${AWS_MARKETPLACE_DIMENSION_MAP:-}
      AWS_MARKETPLACE_BUNDLE_DIMENSION_MAP: ${AWS_MARKETPLACE_BUNDLE_DIMENSION_MAP:-}
      # Marketplace add-on metering (BatchMeterUsage). Off by default; enable only
      # once the listing's metered dimensions match the bundle-dimension map.
      BILLING_METERING_ENABLED: ${BILLING_METERING_ENABLED:-false}
      BILLING_METERING_INTERVAL_MS: ${BILLING_METERING_INTERVAL_MS:-3600000}
      # Plan pricing
      BILLING_PLAN_DEVELOPER_MONTHLY: ${BILLING_PLAN_DEVELOPER_MONTHLY:-0}
      BILLING_PLAN_DEVELOPER_ANNUAL: ${BILLING_PLAN_DEVELOPER_ANNUAL:-0}
      BILLING_PLAN_PRO_MONTHLY: ${BILLING_PLAN_PRO_MONTHLY:-3900}
      BILLING_PLAN_PRO_ANNUAL: ${BILLING_PLAN_PRO_ANNUAL:-39000}
      BILLING_PLAN_TEAM_MONTHLY: ${BILLING_PLAN_TEAM_MONTHLY:-7900}
      BILLING_PLAN_TEAM_ANNUAL: ${BILLING_PLAN_TEAM_ANNUAL:-79000}
      BILLING_PLAN_ENTERPRISE_MONTHLY: ${BILLING_PLAN_ENTERPRISE_MONTHLY:-59900}
      BILLING_PLAN_ENTERPRISE_ANNUAL: ${BILLING_PLAN_ENTERPRISE_ANNUAL:-599000}
      # Plan display names (optional overrides)
      BILLING_PLAN_DEVELOPER_NAME: ${BILLING_PLAN_DEVELOPER_NAME:-}
      BILLING_PLAN_PRO_NAME: ${BILLING_PLAN_PRO_NAME:-}
      BILLING_PLAN_TEAM_NAME: ${BILLING_PLAN_TEAM_NAME:-}
      BILLING_PLAN_ENTERPRISE_NAME: ${BILLING_PLAN_ENTERPRISE_NAME:-}
      # Plan descriptions (optional overrides)
      BILLING_PLAN_DEVELOPER_DESCRIPTION: ${BILLING_PLAN_DEVELOPER_DESCRIPTION:-}
      BILLING_PLAN_PRO_DESCRIPTION: ${BILLING_PLAN_PRO_DESCRIPTION:-}
      BILLING_PLAN_TEAM_DESCRIPTION: ${BILLING_PLAN_TEAM_DESCRIPTION:-}
      BILLING_PLAN_ENTERPRISE_DESCRIPTION: ${BILLING_PLAN_ENTERPRISE_DESCRIPTION:-}
      # Plan features (optional JSON array overrides)
      BILLING_PLAN_DEVELOPER_FEATURES: ${BILLING_PLAN_DEVELOPER_FEATURES:-}
      BILLING_PLAN_PRO_FEATURES: ${BILLING_PLAN_PRO_FEATURES:-}
      BILLING_PLAN_TEAM_FEATURES: ${BILLING_PLAN_TEAM_FEATURES:-}
      BILLING_PLAN_ENTERPRISE_FEATURES: ${BILLING_PLAN_ENTERPRISE_FEATURES:-}
      # Discounts (docs/billing-discounts.md) — on by default. Keys are SECRET.
      BILLING_DISCOUNTS_ENABLED: ${BILLING_DISCOUNTS_ENABLED:-true}
      BILLING_DISCOUNT_KEYS: ${BILLING_DISCOUNT_KEYS:-}
      BILLING_DISCOUNT_MAX_PERCENT: ${BILLING_DISCOUNT_MAX_PERCENT:-100}
      BILLING_DISCOUNT_MAX_CENTS: ${BILLING_DISCOUNT_MAX_CENTS:-10000000}
      # Add-on bundles (docs/billing-bundles.md) — off by default
      BILLING_BUNDLES_ENABLED: ${BILLING_BUNDLES_ENABLED:-true}
      # Per-bundle price (cents) + single-dimension grant overrides. Defaults
      # live in packages/pipeline-core billing-config; unset = default.
      BILLING_BUNDLE_SEAT_PACK_MONTHLY: ${BILLING_BUNDLE_SEAT_PACK_MONTHLY:-}
      BILLING_BUNDLE_SEAT_PACK_ANNUAL: ${BILLING_BUNDLE_SEAT_PACK_ANNUAL:-}
      BILLING_BUNDLE_SEAT_PACK_GRANT: ${BILLING_BUNDLE_SEAT_PACK_GRANT:-}
      BILLING_BUNDLE_PIPELINE_PACK_MONTHLY: ${BILLING_BUNDLE_PIPELINE_PACK_MONTHLY:-}
      BILLING_BUNDLE_PIPELINE_PACK_ANNUAL: ${BILLING_BUNDLE_PIPELINE_PACK_ANNUAL:-}
      BILLING_BUNDLE_PIPELINE_PACK_GRANT: ${BILLING_BUNDLE_PIPELINE_PACK_GRANT:-}
      BILLING_BUNDLE_PLUGIN_PACK_MONTHLY: ${BILLING_BUNDLE_PLUGIN_PACK_MONTHLY:-}
      BILLING_BUNDLE_PLUGIN_PACK_ANNUAL: ${BILLING_BUNDLE_PLUGIN_PACK_ANNUAL:-}
      BILLING_BUNDLE_PLUGIN_PACK_GRANT: ${BILLING_BUNDLE_PLUGIN_PACK_GRANT:-}
      BILLING_BUNDLE_API_PACK_MONTHLY: ${BILLING_BUNDLE_API_PACK_MONTHLY:-}
      BILLING_BUNDLE_API_PACK_ANNUAL: ${BILLING_BUNDLE_API_PACK_ANNUAL:-}
      BILLING_BUNDLE_API_PACK_GRANT: ${BILLING_BUNDLE_API_PACK_GRANT:-}
      BILLING_BUNDLE_AI_PACK_MONTHLY: ${BILLING_BUNDLE_AI_PACK_MONTHLY:-}
      BILLING_BUNDLE_AI_PACK_ANNUAL: ${BILLING_BUNDLE_AI_PACK_ANNUAL:-}
      BILLING_BUNDLE_AI_PACK_GRANT: ${BILLING_BUNDLE_AI_PACK_GRANT:-}
      BILLING_BUNDLE_STORAGE_PACK_MONTHLY: ${BILLING_BUNDLE_STORAGE_PACK_MONTHLY:-}
      BILLING_BUNDLE_STORAGE_PACK_ANNUAL: ${BILLING_BUNDLE_STORAGE_PACK_ANNUAL:-}
      BILLING_BUNDLE_STORAGE_PACK_GRANT: ${BILLING_BUNDLE_STORAGE_PACK_GRANT:-}
      BILLING_BUNDLE_AUDIT_LOG_MONTHLY: ${BILLING_BUNDLE_AUDIT_LOG_MONTHLY:-}
      BILLING_BUNDLE_AUDIT_LOG_ANNUAL: ${BILLING_BUNDLE_AUDIT_LOG_ANNUAL:-}
      BILLING_BUNDLE_SSO_MONTHLY: ${BILLING_BUNDLE_SSO_MONTHLY:-}
      BILLING_BUNDLE_SSO_ANNUAL: ${BILLING_BUNDLE_SSO_ANNUAL:-}
      # Per-bundle purchasable-tier overrides (JSON arrays). Capacity packs
      # default to all tiers; feature/rate packs are tier-scoped.
      BILLING_BUNDLE_SEAT_PACK_TIERS: ${BILLING_BUNDLE_SEAT_PACK_TIERS:-}
      BILLING_BUNDLE_PIPELINE_PACK_TIERS: ${BILLING_BUNDLE_PIPELINE_PACK_TIERS:-}
      BILLING_BUNDLE_PLUGIN_PACK_TIERS: ${BILLING_BUNDLE_PLUGIN_PACK_TIERS:-}
      BILLING_BUNDLE_API_PACK_TIERS: ${BILLING_BUNDLE_API_PACK_TIERS:-}
      BILLING_BUNDLE_AI_PACK_TIERS: ${BILLING_BUNDLE_AI_PACK_TIERS:-}
      BILLING_BUNDLE_STORAGE_PACK_TIERS: ${BILLING_BUNDLE_STORAGE_PACK_TIERS:-}
      BILLING_BUNDLE_AUDIT_LOG_TIERS: ${BILLING_BUNDLE_AUDIT_LOG_TIERS:-}
      BILLING_BUNDLE_SSO_TIERS: ${BILLING_BUNDLE_SSO_TIERS:-}
      # Message service (for notifications)
      MESSAGE_SERVICE_HOST: ${MESSAGE_SERVICE_HOST:-message}
      MESSAGE_SERVICE_PORT: ${MESSAGE_SERVICE_PORT:-3000}
    networks:
      - backend-network
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck: *api-healthcheck
    deploy:
      resources:
        limits:
          cpus: '0.35'
          memory: 384M
        reservations:
          cpus: '0.15'
          memory: 192M

  # ---------------------------------------------------------------------------
  # Admin UIs
  # ---------------------------------------------------------------------------
  mongo-express:
    image: 'mongo-express:1.0.2'
    container_name: mongo-express
    restart: always
    ports:
      - '27081:8081'
    environment:
      ME_CONFIG_MONGODB_URL: ${ME_CONFIG_MONGODB_URL}
      ME_CONFIG_SITE_BASEURL: ${ME_CONFIG_SITE_BASEURL}
      ME_CONFIG_MONGODB_ENABLE_ADMIN: ${ME_CONFIG_MONGODB_ENABLE_ADMIN}
      # ME_CONFIG_MONGODB_ADMINUSERNAME/ADMINPASSWORD are the legacy (non-URL)
      # config path and are ignored when ME_CONFIG_MONGODB_URL is set, so dropped.
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_CONFIG_BASICAUTH_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_CONFIG_BASICAUTH_PASSWORD}
    networks:
      - backend-network
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/mongo-express/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: 384M
        reservations:
          cpus: '0.2'
          memory: 192M

  pgadmin:
    image: 'dpage/pgadmin4:9'
    container_name: pgadmin
    restart: always
    ports:
      - '5480:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - './data/pgadmin-data/:/var/lib/pgadmin/:rw'
    networks:
      - backend-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/misc/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M

  # ---------------------------------------------------------------------------
  # MinIO (object storage)
  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage for message attachments. Persists to the
  # shared ./data folder like the other stateful services. Pin the image tag for
  # reproducible deploys (latest tracks upstream releases).
  minio:
    image: 'quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z'
    container_name: minio
    restart: always
    # Run as 1000:1000 — the same UID/GID the k8s targets set via
    # runAsUser/fsGroup. bin/setup.sh pre-creates ./data/minio-data as the
    # invoking user, so on a Linux host a UID-1000 operator owns it; without
    # this MinIO runs as the image default (root) and writes root-owned files
    # into it. An existing root-owned dir from an earlier root-run MinIO needs a
    # one-time `sudo chown -R 1000:1000 ./data/minio-data`.
    user: "1000:1000"
    # Single-node, single-drive — this is a local dev target (no HA). The
    # erasure-coded HA setups live in the ec2 (SNMD) + eks (distributed) targets.
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - './data/minio-data/:/data:rw'
    networks:
      - backend-network
    deploy:
      resources:
        limits:
          cpus: '0.35'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M

  # ---------------------------------------------------------------------------
  # One-shot bootstrap: create the per-service buckets and per-service,
  # bucket-scoped MinIO users (so no service uses the root credentials). Exits 0;
  # `depends_on: minio-init: service_completed_successfully` gates the consumers.
  minio-init:
    image: 'quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z'
    container_name: minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MESSAGE_S3_ACCESS_KEY: ${MESSAGE_S3_ACCESS_KEY}
      MESSAGE_S3_SECRET_KEY: ${MESSAGE_S3_SECRET_KEY}
      REGISTRY_S3_ACCESS_KEY: ${REGISTRY_S3_ACCESS_KEY}
      REGISTRY_S3_SECRET_KEY: ${REGISTRY_S3_SECRET_KEY}
      LOKI_S3_ACCESS_KEY: ${LOKI_S3_ACCESS_KEY}
      LOKI_S3_SECRET_KEY: ${LOKI_S3_SECRET_KEY}
      THANOS_S3_ACCESS_KEY: ${THANOS_S3_ACCESS_KEY}
      THANOS_S3_SECRET_KEY: ${THANOS_S3_SECRET_KEY}
      PLUGIN_S3_ACCESS_KEY: ${PLUGIN_S3_ACCESS_KEY}
      PLUGIN_S3_SECRET_KEY: ${PLUGIN_S3_SECRET_KEY}
    networks:
      - backend-network
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        die() { echo "minio-init: $$1" >&2; exit 1; }
        run_ok() {  # $$1=what, rest=command; tolerate an "exists" outcome only
          # POSIX sh: `shift`, not a "$${@:2}" slice — minio/mc ships /bin/sh.
          what="$$1"; shift
          out=$$("$$@" 2>&1) && return 0
          case "$$out" in
            *already*exists*|*already*attached*|*already*enabled*|*XMinioAdminUserAlreadyExists*) return 0 ;;
            *) echo "$$out" >&2; die "$$what failed" ;;
          esac
        }
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do echo 'waiting for minio...'; sleep 2; done
        # One bucket + one bucket-scoped user per consumer (no shared root creds).
        for b in message-attachments registry loki thanos plugins; do mc mb --ignore-existing "local/$$b"; done
        # Versioning on user data (attachments) for accidental-delete protection +
        # a lifecycle rule to expire non-current versions so it stays bounded.
        # NOT enabled on loki/registry/thanos/plugins — they churn objects and
        # versioning would retain deleted versions unbounded.
        # These were `|| true`. A silently-absent lifecycle rule is not
        # cosmetic: the plugins bucket then grows without bound, because the
        # expiry below is the backstop for a build whose cleanup never ran.
        run_ok "version enable message-attachments" mc version enable local/message-attachments
        run_ok "ilm noncurrent-expire message-attachments" mc ilm rule add --noncurrent-expire-days 30 local/message-attachments
        # plugins holds transient build-context ZIPs — the plugin service deletes
        # each after its build, but expire after 7 days as a backstop so a missed
        # delete (crash between build + cleanup) can't grow the bucket unbounded.
        run_ok "ilm expire plugins" mc ilm rule add --expire-days 7 local/plugins
        make_user() {  # $1=bucket  $2=policy  $3=access  $4=secret
          echo "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:*\"],\"Resource\":[\"arn:aws:s3:::$$1\",\"arn:aws:s3:::$$1/*\"]}]}" > /tmp/p.json
          run_ok "policy create $$2" mc admin policy create local "$$2" /tmp/p.json
          # `user add` is an upsert — this is what rotates an existing user's
          # secret, so it must not be masked.
          mc admin user add local "$$3" "$$4" || die "user add $$3 failed"
          run_ok "policy attach $$2 -> $$3" mc admin policy attach local "$$2" --user "$$3"
          mc admin user info local "$$3" >/dev/null || die "user $$3 missing after add"
        }
        make_user message-attachments message-attachments-rw "$$MESSAGE_S3_ACCESS_KEY" "$$MESSAGE_S3_SECRET_KEY"
        make_user registry            registry-rw            "$$REGISTRY_S3_ACCESS_KEY" "$$REGISTRY_S3_SECRET_KEY"
        make_user loki                loki-rw                "$$LOKI_S3_ACCESS_KEY"     "$$LOKI_S3_SECRET_KEY"
        make_user thanos              thanos-rw              "$$THANOS_S3_ACCESS_KEY"   "$$THANOS_S3_SECRET_KEY"
        make_user plugins             plugins-rw             "$$PLUGIN_S3_ACCESS_KEY"   "$$PLUGIN_S3_SECRET_KEY"
        echo 'minio-init done'

  # ---------------------------------------------------------------------------
  # Docker Registry
  # ---------------------------------------------------------------------------
  registry:
    image: 'registry:3'
    container_name: registry
    restart: always
    ports:
      - '5000:5000'
    environment:
      # Token-based auth — registry delegates to pipeline-image-registry's
      # /token endpoint. Every pull/push requires a valid bearer JWT signed
      # with the keypair generated by `bin/gen-image-registry-jwt-keys.sh`.
      # Anonymous reads are NOT allowed; deletion of htpasswd is intentional.
      REGISTRY_AUTH: token
      # The bearer realm URL is sent verbatim to clients in the
      # WWW-Authenticate response, so it MUST be resolvable by every
      # Docker client that pulls from this registry. Defaults to the
      # in-cluster plain-HTTP endpoint on image-registry — bypasses
      # nginx so clients (buildkit, crane sidecars) avoid the self-
      # signed-cert TLS dance. Override via .env to a public HTTPS URL
      # when external Docker clients (developer machines, ec2)
      # need to pull from this registry.
      REGISTRY_AUTH_TOKEN_REALM: ${IMAGE_REGISTRY_TOKEN_REALM:-http://image-registry:3000/token}
      REGISTRY_AUTH_TOKEN_SERVICE: pipeline-image-registry
      REGISTRY_AUTH_TOKEN_ISSUER: platform
      REGISTRY_AUTH_TOKEN_ROOTCERTBUNDLE: /etc/registry/jwt-public.pem
      REGISTRY_HTTP_ADDR: '0.0.0.0:5000'
      # TLS deliberately disabled — registry serves plain HTTP on the
      # internal backend-network. External clients still hit it via nginx
      # (which terminates TLS at 8443). Plain HTTP here resolves a
      # scheme-mismatch deadlock between buildkit and crane: buildkit
      # can't bypass TLS verify on a self-signed token-realm host, and
      # crane refuses to follow an HTTP realm from an HTTPS registry.
      # Both clients are happy when realm + registry are both HTTP.
      REGISTRY_STORAGE_DELETE_ENABLED: 'true'
      REGISTRY_HTTP_DEBUG_ADDR: '0.0.0.0:5001'
      # S3 (MinIO) storage — driver + endpoint live in the mounted config.yml;
      # only the per-service, bucket-scoped credentials come from env.
      REGISTRY_STORAGE_S3_ACCESSKEY: ${REGISTRY_S3_ACCESS_KEY}
      REGISTRY_STORAGE_S3_SECRETKEY: ${REGISTRY_S3_SECRET_KEY}
    volumes:
      - './certs/image-registry-jwt.crt:/etc/registry/jwt-public.pem:ro'
      # Custom config.yml selects the S3 driver (replaces the image's filesystem
      # default). The old ./data/registry-data volume is no longer used.
      - './config/registry-config.yml:/etc/distribution/config.yml:ro'
    depends_on:
      minio-init:
        condition: service_completed_successfully
    networks:
      - proxy-network
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:5001/debug/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.6'
          memory: 512M
        reservations:
          cpus: '0.3'
          memory: 256M

  # ---------------------------------------------------------------------------
  # Observability (Prometheus + Loki + Promtail + Grafana).
  #
  # The native /dashboard/observability page remains the TENANT-facing surface —
  # org-scoped, served through the platform's PromQL proxy. Grafana is the
  # operator's console beside it: unscoped, admin-only, its own login. An
  # earlier iteration embedded Grafana as an iframe inside the dashboard and was
  # removed in favour of the native pages; this is not that — nothing links to
  # it from a tenant page.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Grafana — dashboards over prometheus/loki/jaeger.
  #
  # Mirrors the kubernetes targets, minus Kiali: this target has no service mesh
  # (no istio/ztunnel/envoy anywhere in this file), so Kiali would render an
  # empty graph and is deliberately NOT deployed here.
  #
  # Reached at https://localhost:8443/grafana/ through nginx, same as pgAdmin.
  # It has its own login because nginx applies no auth to that route, and it
  # queries Prometheus with no org scoping — anyone who gets in sees every
  # tenant's metrics.
  # ---------------------------------------------------------------------------
  grafana:
    image: 'grafana/grafana:12.3.0'
    container_name: grafana
    restart: always
    user: "472"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Served under /grafana/ by nginx; without both of these Grafana emits
      # absolute URLs rooted at / and the subpath mount 404s on every asset.
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Offline install — no outbound call to grafana.com on boot.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - backend-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 192M

  prometheus:
    image: 'prom/prometheus:v3.13.2'
    container_name: prometheus
    restart: always
    # 2h min/max block duration is required for the Thanos sidecar to upload
    # complete blocks; --web.enable-admin-api lets the sidecar snapshot the TSDB.
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.max-block-duration=2h'
      - '--storage.tsdb.min-block-duration=2h'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - './config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro'
      - './config/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro'
      - './data/db-data/prometheus/:/prometheus:rw'
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Thanos sidecar — ships Prometheus's 2h TSDB blocks to MinIO (S3) for durable
  # long-term storage. Shares Prometheus's TSDB volume (read) + talks to it over
  # HTTP. (Querying archived blocks needs a store-gateway + querier — follow-up.)
  thanos-sidecar:
    image: 'quay.io/thanos/thanos:v0.39.2'
    container_name: thanos-sidecar
    restart: always
    # objstore.yml reads $(THANOS_S3_*) — Thanos expands env refs in the config.
    environment:
      THANOS_S3_ACCESS_KEY: ${THANOS_S3_ACCESS_KEY}
      THANOS_S3_SECRET_KEY: ${THANOS_S3_SECRET_KEY}
    command:
      - 'sidecar'
      - '--tsdb.path=/prometheus'
      - '--prometheus.url=http://prometheus:9090'
      - '--objstore.config-file=/etc/thanos/objstore.yml'
      - '--http-address=0.0.0.0:10902'
      - '--grpc-address=0.0.0.0:10901'
    volumes:
      - './data/db-data/prometheus/:/prometheus:ro'
      - './config/thanos/objstore.yml:/etc/thanos/objstore.yml:ro'
    networks:
      - backend-network
    depends_on:
      minio-init:
        condition: service_completed_successfully
      prometheus:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.35'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M

  # Thanos store-gateway: exposes the MinIO-archived TSDB blocks over the Thanos
  # StoreAPI (gRPC 10901) so the querier can read long-term history. Its local
  # data-dir is a rebuildable index cache (container-local; no volume needed).
  thanos-store-gateway:
    image: 'quay.io/thanos/thanos:v0.39.2'
    container_name: thanos-store-gateway
    restart: always
    # objstore.yml reads $(THANOS_S3_*) — Thanos expands env refs in the config.
    environment:
      THANOS_S3_ACCESS_KEY: ${THANOS_S3_ACCESS_KEY}
      THANOS_S3_SECRET_KEY: ${THANOS_S3_SECRET_KEY}
    command:
      - 'store'
      - '--objstore.config-file=/etc/thanos/objstore.yml'
      - '--data-dir=/var/thanos/store'
      - '--http-address=0.0.0.0:10902'
      - '--grpc-address=0.0.0.0:10901'
    volumes:
      - './config/thanos/objstore.yml:/etc/thanos/objstore.yml:ro'
    networks:
      - backend-network
    depends_on:
      minio-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '0.35'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M

  # Thanos querier: Prometheus-compatible query API (9090) that fans out to the
  # sidecar (recent blocks) + store-gateway (archived blocks) and de-duplicates.
  # PROMETHEUS_URL points services here so PromQL spans recent + long-term.
  thanos-query:
    image: 'quay.io/thanos/thanos:v0.39.2'
    container_name: thanos-query
    restart: always
    command:
      - 'query'
      - '--http-address=0.0.0.0:9090'
      - '--grpc-address=0.0.0.0:10901'
      - '--endpoint=thanos-sidecar:10901'
      - '--endpoint=thanos-store-gateway:10901'
      - '--query.replica-label=replica'
    networks:
      - backend-network
    depends_on:
      thanos-sidecar:
        condition: service_started
      thanos-store-gateway:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.35'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M

  # Alertmanager: routes Prometheus alerts to Slack and to the platform relay.
  # Alertmanager does NOT expand environment variables in its config file, so
  # there is no `environment:` wiring. The per-org relay token reaches it as
  # the `alert_webhook_token` secret file (credentials_file in
  # config/alertmanager/alertmanager.yml); platform gets the same token via
  # ALERT_WEBHOOK_INSTANCES. Slack URLs are placeholders to edit in that file.
  alertmanager:
    image: 'prom/alertmanager:v0.33.1'
    container_name: alertmanager
    restart: always
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - './config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro'
      - './data/db-data/alertmanager/:/alertmanager:rw'
    secrets:
      - source: alert_webhook_token
        target: /etc/alertmanager-secrets/relay-token
        mode: 0444
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M

  loki:
    image: 'grafana/loki:3.6.11'
    container_name: loki
    restart: always
    # -config.expand-env expands LOKI_S3_ACCESS_KEY/SECRET_KEY in loki-config.yml (chunks/index
    # now live in MinIO; /loki is just ephemeral WAL + shipper cache).
    command: -config.file=/etc/loki/loki-config.yml -config.expand-env=true
    environment:
      LOKI_S3_ACCESS_KEY: ${LOKI_S3_ACCESS_KEY}
      LOKI_S3_SECRET_KEY: ${LOKI_S3_SECRET_KEY}
    volumes:
      - './data/db-data/loki/:/loki:rw'
      - './config/loki/loki-config.yml:/etc/loki/loki-config.yml:ro'
    networks:
      - backend-network
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      # loki 3.6+ images are distroless (no wget/curl/sh) — the loki binary's own
      # `-health` flag probes localhost:3100/ready and exits non-zero until ready.
      test: ["CMD", "/usr/bin/loki", "-health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  promtail:
    image: 'grafana/promtail:3.6.11'
    container_name: promtail
    restart: always
    # Wrap promtail to auto-clean corrupted positions file on startup.
    # The ./data/promtail-data bind mount preserves read positions across restarts
    # for log dedup, but unclean shutdowns can corrupt the YAML — purge it first.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -f /tmp/positions.yaml ] && ! grep -q '^positions:' /tmp/positions.yaml 2>/dev/null; then
          echo "Removing corrupted positions file"
          rm -f /tmp/positions.yaml
        fi
        exec /usr/bin/promtail -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - './config/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro'
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
      - './data/promtail-data/:/tmp'
    networks:
      - backend-network
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      # promtail 3.6.11 is distroless-ish: /bin/sh is dash (no /dev/tcp) and there's
      # no wget/curl and no `-health` flag — but `bash` and `grep` ARE present. Probe
      # /ready over a bash /dev/tcp socket and match the 200 status line. (k8s targets
      # use an httpGet probe instead, which needs no in-container tool.)
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/localhost/9080 && printf 'GET /ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -qa '200 OK' <&3"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  # OpenTelemetry trace collector + UI. all-in-one bundles the OTLP receiver,
  # in-memory storage, and the query UI in a single container — no separate
  # backend (Tempo/Cassandra) needed for dev. Services export OTLP/HTTP to
  # :4318 (see OTEL_EXPORTER_OTLP_ENDPOINT in x-common-env); browse traces at
  # http://localhost:16686. In-memory storage means traces are lost on restart,
  # which is the right trade-off for a local stack.
  jaeger:
    image: 'jaegertracing/all-in-one:1.76.0'
    container_name: jaeger
    restart: always
    environment:
      # OTLP receivers are opt-in on 1.x; enable both gRPC (4317) and HTTP (4318).
      COLLECTOR_OTLP_ENABLED: "true"
      # Cap the in-memory trace ring so a busy dev session can't OOM the box.
      MEMORY_MAX_TRACES: "50000"
    ports:
      # Query UI exposed to the host; OTLP ports stay on backend-network only
      # (services reach them via the `jaeger` hostname).
      - '16686:16686'
    networks:
      - backend-network
    # No container healthcheck: the all-in-one image is minimal and ships no
    # shell/wget, so a CMD healthcheck would false-fail. Nothing depends_on
    # jaeger, so its health doesn't gate startup ordering.
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

# =============================================================================
# Networks
# =============================================================================
# All persistent data lives under ./data/ (bind mounts) so `rm -rf data/`
# is the single command for a clean slate. Postgres/Mongo data dirs were
# previously named volumes for I/O perf — the trade-off is acceptable on
# dev laptops where reproducibility matters more than raw throughput.

# Per-org alert relay bearer, materialised as a file for alertmanager
# (credentials_file). Sourced from .env (generated by gen-env-secrets).
secrets:
  alert_webhook_token:
    environment: ALERT_WEBHOOK_INSTANCE_TOKEN

networks:
  proxy-network:
    name: proxy-network
  backend-network:
    name: backend-network
    driver: bridge

volumes:
  ask-model-models:
  # buildkit-cache is the *only* named volume in this compose — see the
  # rationale on the buildkitd service. Everything else uses bind mounts
  # under ./data/ for one-command wipeability.
  buildkit-cache:

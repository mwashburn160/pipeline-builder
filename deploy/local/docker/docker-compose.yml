  # ---------------------------------------------------------------------------
  # Admin UIs
  # ---------------------------------------------------------------------------
  mongo-express:
    image: 'mongo-express@sha256:1b23d7976f0210dbec74045c209e52fbb26d29b2e873d6c6fa3d3f0ae32c2a64'  # mongo-express:1.0.2
    container_name: mongo-express
    restart: always
    ports:
      - '27081:8081'
    environment:
      ME_CONFIG_MONGODB_URL: ${ME_CONFIG_MONGODB_URL}
      ME_CONFIG_SITE_BASEURL: ${ME_CONFIG_SITE_BASEURL}
      ME_CONFIG_MONGODB_ENABLE_ADMIN: ${ME_CONFIG_MONGODB_ENABLE_ADMIN}
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_CONFIG_BASICAUTH_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_CONFIG_BASICAUTH_PASSWORD}
    networks:
      - backend-network
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8081/mongo-express/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: 384M
        reservations:
          cpus: '0.2'
          memory: 192M

  pgadmin:
    image: 'dpage/pgadmin4@sha256:c332c5f6dfba995d9ebc4af261d93506d6876085d712eaaa3defc8dd1a3f26de'  # dpage/pgadmin4:9
    container_name: pgadmin
    restart: always
    ports:
      - '5480:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - './data/pgadmin-data/:/var/lib/pgadmin/:rw'
    networks:
      - backend-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/misc/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M

  # ---------------------------------------------------------------------------
  # MinIO (object storage)
  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage for message attachments. Persists to the
  # shared ./data folder like the other stateful services. Pin the image tag for
  # reproducible deploys (latest tracks upstream releases).
  minio:
    image: 'quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e'  # quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    restart: always
    # Run as 1000:1000 — the same UID/GID the k8s targets set via
    # runAsUser/fsGroup. bin/setup.sh pre-creates ./data/minio-data as the
    # invoking user, so on a Linux host a UID-1000 operator owns it; without
    # this MinIO runs as the image default (root) and writes root-owned files
    # into it. An existing root-owned dir from an earlier root-run MinIO needs a
    # one-time `sudo chown -R 1000:1000 ./data/minio-data`.
    user: "1000:1000"
    # Single-node, single-drive — this is a local dev target (no HA). The
    # erasure-coded HA setups live in the ec2 (SNMD) + eks (distributed) targets.
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - './data/minio-data/:/data:rw'
    networks:
      - backend-network
    deploy: *deploy-storage

  # ---------------------------------------------------------------------------
  # One-shot bootstrap: create the per-service buckets and per-service,
  # bucket-scoped MinIO users (so no service uses the root credentials). Exits 0;
  # `depends_on: minio-init: service_completed_successfully` gates the consumers.
  minio-init:
    image: 'quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727'  # quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MESSAGE_S3_ACCESS_KEY: ${MESSAGE_S3_ACCESS_KEY}
      MESSAGE_S3_SECRET_KEY: ${MESSAGE_S3_SECRET_KEY}
      REGISTRY_S3_ACCESS_KEY: ${REGISTRY_S3_ACCESS_KEY}
      REGISTRY_S3_SECRET_KEY: ${REGISTRY_S3_SECRET_KEY}
      LOKI_S3_ACCESS_KEY: ${LOKI_S3_ACCESS_KEY}
      LOKI_S3_SECRET_KEY: ${LOKI_S3_SECRET_KEY}
      THANOS_S3_ACCESS_KEY: ${THANOS_S3_ACCESS_KEY}
      THANOS_S3_SECRET_KEY: ${THANOS_S3_SECRET_KEY}
      PLUGIN_S3_ACCESS_KEY: ${PLUGIN_S3_ACCESS_KEY}
      PLUGIN_S3_SECRET_KEY: ${PLUGIN_S3_SECRET_KEY}
      AUDIT_HEADS_ACCESS_KEY: ${AUDIT_HEAD_EXPORT_S3_ACCESS_KEY_ID}
      AUDIT_HEADS_SECRET_KEY: ${AUDIT_HEAD_EXPORT_S3_SECRET_ACCESS_KEY}
    networks:
      - backend-network
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        die() { echo "minio-init: $$1" >&2; exit 1; }
        run_ok() {  # $$1=what, rest=command; tolerate an "exists" outcome only
          # POSIX sh: `shift`, not a "$${@:2}" slice — minio/mc ships /bin/sh.
          what="$$1"; shift
          out=$$("$$@" 2>&1) && return 0
          case "$$out" in
            *already*exists*|*already*attached*|*already*enabled*|*XMinioAdminUserAlreadyExists*) return 0 ;;
            *) echo "$$out" >&2; die "$$what failed" ;;
          esac
        }
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do echo 'waiting for minio...'; sleep 2; done
        # One bucket + one bucket-scoped user per consumer (no shared root creds).
        for b in message-attachments registry loki thanos plugins plugin-quarantine; do mc mb --ignore-existing "local/$$b"; done
        # audit-heads: Object Lock (write-once) — only settable at creation.
        mc mb --ignore-existing --with-lock local/audit-heads
        mc retention info local/audit-heads --default >/dev/null 2>&1 \
          || die "audit-heads exists WITHOUT Object Lock — delete and let minio-init recreate it"
        # Versioning on user data (attachments) for accidental-delete protection +
        # a lifecycle rule to expire non-current versions so it stays bounded.
        # NOT enabled on loki/registry/thanos/plugins — they churn objects and
        # versioning would retain deleted versions unbounded.
        # run_ok, not `|| true`: a silently-absent lifecycle rule is not
        # cosmetic — the expiry below is the backstop for a build whose cleanup
        # never ran, so without it the plugins bucket grows without bound.
        run_ok "version enable message-attachments" mc version enable local/message-attachments
        run_ok "ilm noncurrent-expire message-attachments" mc ilm rule add --noncurrent-expire-days 30 local/message-attachments
        # plugins holds transient build-context ZIPs — the plugin service deletes
        # each after its build, but expire after 7 days as a backstop so a missed
        # delete (crash between build + cleanup) can't grow the bucket unbounded.
        run_ok "ilm expire plugins" mc ilm rule add --expire-days 7 local/plugins
        # plugin-quarantine holds anonymous-submission zips —
        # 30 days is the quarantine retention promise, the same
        # window as a pending submission's expiry and the quarantine/* registry GC.
        run_ok "ilm expire plugin-quarantine" mc ilm rule add --expire-days 30 local/plugin-quarantine
        make_user() {  # $1=bucket  $2=policy  $3=access  $4=secret
          echo "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:*\"],\"Resource\":[\"arn:aws:s3:::$$1\",\"arn:aws:s3:::$$1/*\"]}]}" > /tmp/p.json
          run_ok "policy create $$2" mc admin policy create local "$$2" /tmp/p.json
          # `user add` is an upsert — this is what rotates an existing user's
          # secret, so it must not be masked.
          mc admin user add local "$$3" "$$4" || die "user add $$3 failed"
          run_ok "policy attach $$2 -> $$3" mc admin policy attach local "$$2" --user "$$3"
          mc admin user info local "$$3" >/dev/null || die "user $$3 missing after add"
        }
        make_user message-attachments message-attachments-rw "$$MESSAGE_S3_ACCESS_KEY" "$$MESSAGE_S3_SECRET_KEY"
        make_user registry            registry-rw            "$$REGISTRY_S3_ACCESS_KEY" "$$REGISTRY_S3_SECRET_KEY"
        make_user loki                loki-rw                "$$LOKI_S3_ACCESS_KEY"     "$$LOKI_S3_SECRET_KEY"
        make_user thanos              thanos-rw              "$$THANOS_S3_ACCESS_KEY"   "$$THANOS_S3_SECRET_KEY"
        make_user plugins             plugins-rw             "$$PLUGIN_S3_ACCESS_KEY"   "$$PLUGIN_S3_SECRET_KEY"
        # The plugin service's SAME bucket-scoped user also gets plugin-quarantine
        # (a second policy attached to it — no new credential to distribute).
        echo '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:*"],"Resource":["arn:aws:s3:::plugin-quarantine","arn:aws:s3:::plugin-quarantine/*"]}]}' > /tmp/q.json
        run_ok "policy create plugin-quarantine-rw" mc admin policy create local plugin-quarantine-rw /tmp/q.json
        run_ok "policy attach plugin-quarantine-rw -> plugins user" mc admin policy attach local plugin-quarantine-rw --user "$$PLUGIN_S3_ACCESS_KEY"
        # The platform's signed audit chain-head export: Put/Get/List only — no
        # delete; PutObjectRetention only so each PUT can carry its lock headers
        # (COMPLIANCE retention can be extended, never shortened).
        echo '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:PutObject","s3:PutObjectRetention","s3:GetObject","s3:GetObjectVersion"],"Resource":["arn:aws:s3:::audit-heads/*"]},{"Effect":"Allow","Action":["s3:ListBucket","s3:GetBucketObjectLockConfiguration"],"Resource":["arn:aws:s3:::audit-heads"]}]}' > /tmp/a.json
        run_ok "policy create audit-heads-put" mc admin policy create local audit-heads-put /tmp/a.json
        mc admin user add local "$$AUDIT_HEADS_ACCESS_KEY" "$$AUDIT_HEADS_SECRET_KEY" || die "user add audit-heads failed"
        run_ok "policy attach audit-heads-put" mc admin policy attach local audit-heads-put --user "$$AUDIT_HEADS_ACCESS_KEY"
        mc admin user info local "$$AUDIT_HEADS_ACCESS_KEY" >/dev/null || die "user audit-heads missing after add"
        echo 'minio-init done'

  # ---------------------------------------------------------------------------
  # Docker Registry
  # ---------------------------------------------------------------------------
  registry:
    image: 'registry@sha256:fd374bae807c225661adfe2c0c1f9970a0b8fab1761fd7dfb91e0fd9a8748f9b'  # registry:3
    container_name: registry
    restart: always
    ports:
      - '5000:5000'
    environment:
      # Token-based auth — registry delegates to pipeline-image-registry's
      # /token endpoint. Every pull/push requires a valid bearer JWT signed
      # with the keypair generated by `deploy/bin/jwt-keys.sh`.
      # Anonymous reads are NOT allowed, and there is no htpasswd fallback.
      REGISTRY_AUTH: token
      # The bearer realm URL is sent verbatim to clients in the
      # WWW-Authenticate response, so it MUST be resolvable by every
      # Docker client that pulls from this registry. Defaults to the
      # in-cluster plain-HTTP endpoint on image-registry — bypasses
      # nginx so clients (buildkit, crane sidecars) avoid the self-
      # signed-cert TLS dance. Override via .env to a public HTTPS URL
      # when external Docker clients (developer machines, ec2)
      # need to pull from this registry.
      REGISTRY_AUTH_TOKEN_REALM: ${IMAGE_REGISTRY_TOKEN_REALM:-http://image-registry:3000/token}
      REGISTRY_AUTH_TOKEN_SERVICE: pipeline-image-registry
      REGISTRY_AUTH_TOKEN_ISSUER: platform
      REGISTRY_AUTH_TOKEN_ROOTCERTBUNDLE: /etc/registry/jwt-public.pem
      REGISTRY_HTTP_ADDR: '0.0.0.0:5000'
      # TLS deliberately disabled — registry serves plain HTTP on the
      # internal backend-network. External clients still hit it via nginx
      # (which terminates TLS at 8443). Plain HTTP here resolves a
      # scheme-mismatch deadlock between buildkit and crane: buildkit
      # can't bypass TLS verify on a self-signed token-realm host, and
      # crane refuses to follow an HTTP realm from an HTTPS registry.
      # Both clients are happy when realm + registry are both HTTP.
      REGISTRY_STORAGE_DELETE_ENABLED: 'true'
      REGISTRY_HTTP_DEBUG_ADDR: '0.0.0.0:5001'
      # S3 (MinIO) storage — driver + endpoint live in the mounted config.yml;
      # only the per-service, bucket-scoped credentials come from env.
      REGISTRY_STORAGE_S3_ACCESSKEY: ${REGISTRY_S3_ACCESS_KEY}
      REGISTRY_STORAGE_S3_SECRETKEY: ${REGISTRY_S3_SECRET_KEY}
    volumes:
      - './certs/image-registry-jwt.crt:/etc/registry/jwt-public.pem:ro'
      # Custom config.yml selects the S3 driver (replaces the image's filesystem
      # default), so this registry keeps no local layer storage at all.
      - './config/registry-config.yml:/etc/distribution/config.yml:ro'
    depends_on:
      <<: *needs-minio
    networks:
      - proxy-network
      - backend-network
      # buildkitd-quarantine pushes quarantine/<id> and pulls base images here.
      - quarantine-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:5001/debug/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.6'
          memory: 512M
        reservations:
          cpus: '0.3'
          memory: 256M

  # ---------------------------------------------------------------------------
  # Observability (Prometheus + Thanos + Loki + Promtail + Jaeger + Grafana)
  # ---------------------------------------------------------------------------
  # Grafana — dashboards over prometheus/loki/jaeger, reached at
  # https://localhost:8443/grafana/ through nginx, same as pgAdmin.
  #
  # It is the OPERATOR's console, beside — not instead of — the native
  # /dashboard/observability page, which stays the tenant-facing surface
  # (org-scoped, served through the platform's PromQL proxy). Nothing links here
  # from a tenant page: Grafana has its own login because nginx applies no auth
  # to that route, and it queries Prometheus with no org scoping, so anyone who
  # gets in sees every tenant's metrics.
  #
  # Mirrors the kubernetes targets, minus Kiali: this target has no service mesh
  # (no istio/ztunnel/envoy anywhere in this file), so Kiali would render an
  # empty graph and is deliberately NOT deployed here.
  # ---------------------------------------------------------------------------
  grafana:
    image: 'grafana/grafana@sha256:70d9599b186ce287be0d2c5ba9a78acb2e86c1a68c9c41449454d0fc3eeb84e8'  # grafana/grafana:12.3.0
    container_name: grafana
    restart: always
    user: "472"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Served under /grafana/ by nginx; without both of these Grafana emits
      # absolute URLs rooted at / and the subpath mount 404s on every asset.
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Offline install — no outbound call to grafana.com on boot.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - backend-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 192M

  prometheus:
    image: 'prom/prometheus@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69'  # prom/prometheus:v3.13.2
    container_name: prometheus
    restart: always
    # 2h min/max block duration is required for the Thanos sidecar to upload
    # complete blocks; --web.enable-admin-api lets the sidecar snapshot the TSDB.
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.max-block-duration=2h'
      - '--storage.tsdb.min-block-duration=2h'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - './config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro'
      - './config/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro'
      - './data/db-data/prometheus/:/prometheus:rw'
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy: *deploy-medium

  # Thanos sidecar — ships Prometheus's 2h TSDB blocks to MinIO (S3) for durable
  # long-term storage, and serves the still-local ones over the StoreAPI. Shares
  # Prometheus's TSDB volume (read) + talks to it over HTTP. Archived blocks are
  # read back by thanos-store-gateway, and thanos-query fans out to both.
  thanos-sidecar:
    image: 'quay.io/thanos/thanos@sha256:1d022ef4b8eff056a0e3b7822f953d931c5704d068413f2d7ce5266aa96c9e80'  # quay.io/thanos/thanos:v0.39.2
    container_name: thanos-sidecar
    restart: always
    environment:
      <<: *thanos-env
    command:
      - 'sidecar'
      - '--tsdb.path=/prometheus'
      - '--prometheus.url=http://prometheus:9090'
      - '--objstore.config-file=/etc/thanos/objstore.yml'
      - '--http-address=0.0.0.0:10902'
      - '--grpc-address=0.0.0.0:10901'
    volumes:
      # :rw — the shipper writes thanos.shipper.json into the TSDB dir.
      - './data/db-data/prometheus/:/prometheus:rw'
      - *thanos-objstore
    networks:
      - backend-network
    depends_on:
      <<: *needs-minio
      prometheus:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.35'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M

  # Thanos store-gateway: exposes the MinIO-archived TSDB blocks over the Thanos
  # StoreAPI (gRPC 10901) so the querier can read long-term history. Its local
  # data-dir is a rebuildable index cache (container-local; no volume needed).
  thanos-store-gateway:
    image: 'quay.io/thanos/thanos@sha256:1d022ef4b8eff056a0e3b7822f953d931c5704d068413f2d7ce5266aa96c9e80'  # quay.io/thanos/thanos:v0.39.2
    container_name: thanos-store-gateway
    restart: always
    environment:
      <<: *thanos-env
    command:
      - 'store'
      - '--objstore.config-file=/etc/thanos/objstore.yml'
      - '--data-dir=/var/thanos/store'
      - '--http-address=0.0.0.0:10902'
      - '--grpc-address=0.0.0.0:10901'
    volumes:
      - *thanos-objstore
    # The image runs as uid 1001 and /var is root:root 755, so the data-dir can't
    # be created in the image fs. Rebuildable cache — tmpfs mirrors the k8s
    # emptyDir. Size-capped: tmpfs is RAM.
    tmpfs:
      - '/var/thanos/store:mode=1777,size=512m'
    networks:
      - backend-network
    depends_on:
      <<: *needs-minio
    deploy: *deploy-storage

  # Thanos compactor: the bucket's garbage collector, downsampler and block
  # merger — the ONLY component that deletes from or rewrites the object store.
  # Without it the `thanos` bucket accumulates 2h blocks forever, long-range
  # queries get slower every week, and no retention is enforced by anything.
  #
  # SINGLETON: two compactors against one bucket corrupt it (they race on the
  # same block deletions). Never scale this service, and do not run a second
  # stack against the same MinIO bucket.
  #
  # Retention per resolution — raw 30d, 5m 180d, 1h 365d. Lowering a value
  # DELETES data beyond it on the next pass and cannot be undone; `0d` means
  # keep forever. Mirrors the k8s targets' thanos-compact Deployment.
  thanos-compact:
    image: 'quay.io/thanos/thanos@sha256:1d022ef4b8eff056a0e3b7822f953d931c5704d068413f2d7ce5266aa96c9e80'  # quay.io/thanos/thanos:v0.39.2
    container_name: thanos-compact
    restart: always
    environment:
      <<: *thanos-env
    command:
      - 'compact'
      # Long-lived loop rather than one-shot-and-exit, so `restart: always`
      # doesn't turn a normal completion into a restart loop.
      - '--wait'
      - '--wait-interval=5m'
      - '--objstore.config-file=/etc/thanos/objstore.yml'
      - '--data-dir=/var/thanos/compact'
      - '--http-address=0.0.0.0:10902'
      - '--retention.resolution-raw=30d'
      - '--retention.resolution-5m=180d'
      - '--retention.resolution-1h=365d'
      - '--compact.concurrency=1'
      - '--downsample.concurrency=1'
    volumes:
      - *thanos-objstore
    # Scratch space for downloaded/compacted blocks (uid 1001 can't mkdir under
    # root-owned /var). tmpfs mirrors the k8s emptyDir; size-capped because it's
    # RAM — raise it if compaction of larger blocks fails with ENOSPC.
    tmpfs:
      - '/var/thanos/compact:mode=1777,size=2g'
    networks:
      - backend-network
    depends_on:
      <<: *needs-minio
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1024M
        reservations:
          cpus: '0.10'
          memory: 256M

  # Thanos querier: Prometheus-compatible query API (9090) that fans out to the
  # sidecar (recent blocks) + store-gateway (archived blocks) and de-duplicates.
  # PROMETHEUS_URL points services here so PromQL spans recent + long-term.
  thanos-query:
    image: 'quay.io/thanos/thanos@sha256:1d022ef4b8eff056a0e3b7822f953d931c5704d068413f2d7ce5266aa96c9e80'  # quay.io/thanos/thanos:v0.39.2
    container_name: thanos-query
    restart: always
    command:
      - 'query'
      - '--http-address=0.0.0.0:9090'
      - '--grpc-address=0.0.0.0:10901'
      - '--endpoint=thanos-sidecar:10901'
      - '--endpoint=thanos-store-gateway:10901'
      - '--query.replica-label=replica'
    networks:
      - backend-network
    depends_on:
      thanos-sidecar:
        condition: service_started
      thanos-store-gateway:
        condition: service_started
    deploy: *deploy-storage

  # Alertmanager: routes Prometheus alerts to Slack and to the platform relay.
  # Alertmanager does NOT expand environment variables in its config file, so
  # there is no `environment:` wiring — every credential arrives as a secret
  # FILE that it re-reads per notification. The per-org relay token is
  # `alert_webhook_token` (credentials_file), and the two ops-team Slack webhook
  # URLs are `slack_critical_url` / `slack_warning_url` (api_url_file), all read
  # from .env by the `secrets:` block at the bottom of this file. bin/setup.sh
  # refuses to start the stack while a Slack URL is still a placeholder.
  alertmanager:
    image: 'prom/alertmanager@sha256:9e082985f56f4c8c9f724e18f2288c6708f472e56a5286b8863d080434ea065d'  # prom/alertmanager:v0.33.1
    container_name: alertmanager
    restart: always
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - './config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro'
      - './data/db-data/alertmanager/:/alertmanager:rw'
    secrets:
      - source: alert_webhook_token
        target: /etc/alertmanager-secrets/relay-token
        mode: 0444
      - source: slack_critical_url
        target: /etc/alertmanager-slack/critical-url
        mode: 0444
      - source: slack_warning_url
        target: /etc/alertmanager-slack/warning-url
        mode: 0444
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9093/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M

  loki:
    image: 'grafana/loki@sha256:44148ad243c07957113baea950ee5ba9b0c8eff8d7e38ff3cc1c0af705790945'  # grafana/loki:3.6.11
    container_name: loki
    restart: always
    # -config.expand-env expands LOKI_S3_ACCESS_KEY/SECRET_KEY in loki-config.yml (chunks/index
    # now live in MinIO; /loki is just ephemeral WAL + shipper cache).
    command: -config.file=/etc/loki/loki-config.yml -config.expand-env=true
    environment:
      LOKI_S3_ACCESS_KEY: ${LOKI_S3_ACCESS_KEY}
      LOKI_S3_SECRET_KEY: ${LOKI_S3_SECRET_KEY}
    volumes:
      - './data/db-data/loki/:/loki:rw'
      - './config/loki/loki-config.yml:/etc/loki/loki-config.yml:ro'
    networks:
      - backend-network
    depends_on:
      <<: *needs-minio
    healthcheck:
      # loki 3.6+ images are distroless (no wget/curl/sh) — the loki binary's own
      # `-health` flag probes localhost:3100/ready and exits non-zero until ready.
      test: ["CMD", "/usr/bin/loki", "-health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy: *deploy-medium

  promtail:
    image: 'grafana/promtail@sha256:a761cb834cfaeee29745440d4884d6748f0a08d8f68928db1d707018c1dcfbe9'  # grafana/promtail:3.6.11
    container_name: promtail
    restart: always
    # Wrap promtail to auto-clean corrupted positions file on startup.
    # The ./data/promtail-data bind mount preserves read positions across restarts
    # for log dedup, but unclean shutdowns can corrupt the YAML — purge it first.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -f /tmp/positions.yaml ] && ! grep -q '^positions:' /tmp/positions.yaml 2>/dev/null; then
          echo "Removing corrupted positions file"
          rm -f /tmp/positions.yaml
        fi
        exec /usr/bin/promtail -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - './config/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro'
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
      - './data/promtail-data/:/tmp'
    networks:
      - backend-network
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      # promtail 3.6.11 is distroless-ish: /bin/sh is dash (no /dev/tcp) and there's
      # no wget/curl and no `-health` flag — but `bash` and `grep` ARE present. Probe
      # /ready over a bash /dev/tcp socket and match the 200 status line. (k8s targets
      # use an httpGet probe instead, which needs no in-container tool.)
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/localhost/9080 && printf 'GET /ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -qa '200 OK' <&3"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  # OpenTelemetry trace collector + UI. all-in-one bundles the OTLP receiver,
  # in-memory storage, and the query UI in a single container — no separate
  # backend (Tempo/Cassandra) needed for dev. Services export OTLP/HTTP to
  # :4318 (see OTEL_EXPORTER_OTLP_ENDPOINT in x-common-env); browse traces at
  # http://localhost:16686. In-memory storage means traces are lost on restart,
  # which is the right trade-off for a local stack.
  jaeger:
    image: 'jaegertracing/all-in-one@sha256:ab6f1a1f0fb49ea08bcd19f6b84f6081d0d44b364b6de148e1798eb5816bacac'  # jaegertracing/all-in-one:1.76.0
    container_name: jaeger
    restart: always
    environment:
      # OTLP receivers are opt-in on 1.x; enable both gRPC (4317) and HTTP (4318).
      COLLECTOR_OTLP_ENABLED: "true"
      # Cap the in-memory trace ring so a busy dev session can't OOM the box.
      MEMORY_MAX_TRACES: "50000"
    ports:
      # Query UI exposed to the host; OTLP ports stay on backend-network only
      # (services reach them via the `jaeger` hostname).
      - '16686:16686'
    networks:
      - backend-network
    # No container healthcheck: the all-in-one image is minimal and ships no
    # shell/wget, so a CMD healthcheck would false-fail. Nothing depends_on
    # jaeger, so its health doesn't gate startup ordering.
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

# =============================================================================
# Secrets / Networks / Volumes
# =============================================================================
# Persistent data lives under ./data/ (bind mounts) so `rm -rf data/` is the
# single command for a clean slate. Bind mounts cost some I/O throughput against
# a named volume, which is the right trade on a dev laptop. The few exceptions
# are the named volumes at the bottom of this file, each with its reason.

# Alertmanager's credentials, materialised as files (it reads none of them from
# the environment): the per-org relay bearer for `credentials_file`, and the two
# ops-team Slack incoming-webhook URLs for `api_url_file`. All three are sourced
# from .env — the relay token is generated by gen-env-secrets, the Slack URLs are
# operator-supplied and pre-flighted by bin/setup.sh.
secrets:
  alert_webhook_token:
    environment: ALERT_WEBHOOK_INSTANCE_TOKEN
  slack_critical_url:
    environment: SLACK_CRITICAL_WEBHOOK_URL
  slack_warning_url:
    environment: SLACK_WARNING_WEBHOOK_URL

networks:
  proxy-network:
    name: proxy-network
  backend-network:
    name: backend-network
    driver: bridge
  # The anonymous-submission build sandbox's network (see buildkitd-quarantine):
  # plugin (client), registry + image-registry (push target / token realm) and
  # the quarantine buildkitd — nothing that holds tenant data.
  quarantine-network:
    name: quarantine-network
    driver: bridge

# The only named volumes in this compose — everything else is a bind mount under
# ./data/ for one-command wipeability, so each of these needs its own reason.
volumes:
  # The pulled Ollama model (~1-5GB); re-downloading it on every recreate is the
  # slowest thing in this stack.
  ask-model-models:
  # The plugin service's grype vulnerability DB (see GRYPE_DB_CACHE_DIR on the
  # plugin service). A named volume rather than a ./data bind mount so it
  # inherits the image's node-owned /var/cache/grype.
  grype-db:
  # The tenant buildkitd's layer cache — see the rationale on that service:
  # overlay-snapshotter semantics a macOS bind mount does not provide.
  buildkit-cache:
  # The quarantine buildkitd's layer cache — kept apart from the tenant one so
  # an anonymous build can never read or poison a tenant build's cached layers.
  buildkit-quarantine-cache:

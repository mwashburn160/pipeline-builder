# =============================================================================
# Shared YAML Anchors
# =============================================================================

# -- Healthcheck for API containers --
# Probes /ready (readiness), not /health (liveness): a container is only
# "healthy" once its datastore deps are connected, so `depends_on:
# condition: service_healthy` actually waits for a service that can serve —
# closing the startup races (e.g. a load hitting a still-connecting compliance).
# Safe under plain compose: an unhealthy container is NOT restarted (`restart:`
# fires only on exit); this just gates ordering. With the listen-first servers,
# the port opens immediately and the container reports "starting" until ready.
x-api-healthcheck: &api-healthcheck
  test: ["CMD", "curl", "-f", "http://localhost:3000/ready"]
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 180s

# -- Deploy defaults for API containers --
x-api-deploy: &api-deploy
  resources:
    limits:
      cpus: '0.75'
      memory: 768M
    reservations:
      cpus: '0.4'
      memory: 384M

# -- Deploy defaults for database containers --
x-db-deploy: &db-deploy
  resources:
    limits:
      cpus: '1.5'
      memory: 1.5G
    reservations:
      cpus: '0.8'
      memory: 768M

# -- Env shared by ALL API services --
x-common-env: &common-env
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  JWT_SECRET: ${JWT_SECRET}
  REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
  # AES-256-GCM master key for encrypted secret columns (AI provider keys, IdP
  # client secrets). Required under NODE_ENV=production — platform refuses to
  # boot without it. Alongside JWT_SECRET rather than in a service-specific
  # block so any service that grows a decrypt path already has it.
  SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY}
  PLATFORM_BASE_URL: ${PLATFORM_BASE_URL:-https://localhost:8443}
  # OpenTelemetry. On by default — exports to the bundled `jaeger` all-in-one
  # collector (OTLP/HTTP on 4318; UI on http://localhost:16686). Set
  # OTEL_TRACING_ENABLED=false to opt out. Lives in common-env (not server-env)
  # so EVERY service — including quota/billing/image-registry — emits traces.
  OTEL_TRACING_ENABLED: ${OTEL_TRACING_ENABLED:-true}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}

# -- Env shared by Postgres-backed services (platform, plugin, pipeline) --
x-postgres-env: &postgres-env
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT}
  DATABASE: ${DATABASE}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  DRIZZLE_MAX_POOL_SIZE: ${DRIZZLE_MAX_POOL_SIZE:-20}
  DRIZZLE_IDLE_TIMEOUT_MILLIS: ${DRIZZLE_IDLE_TIMEOUT_MILLIS:-30000}
  DRIZZLE_CONNECTION_TIMEOUT_MILLIS: ${DRIZZLE_CONNECTION_TIMEOUT_MILLIS:-30000}
  # DB_USER is the NOSUPERUSER NOBYPASSRLS application role postgres-init.sql
  # creates — never POSTGRES_USER (a superuser bypasses row-level security).
  # Multi-tenant context mode for withTenantTx (packages/pipeline-data
  # tenancy.ts): strict throws when a query runs without tenant context, which
  # under the non-bypass role would otherwise silently see zero rows. Every
  # Postgres-backed service inherits this via x-postgres-env.
  RLS_CONTEXT_MODE: ${RLS_CONTEXT_MODE:-strict}
  # Postgres serves no TLS in compose, so SSL must stay off explicitly:
  # getSslConfig turns it ON by default under NODE_ENV=production.
  DB_SSL: ${DB_SSL:-false}

# -- Env shared by Express server services --
x-server-env: &server-env
  # MUST be `production`. A long list of security guards keys off it and
  # silently degrades when unset (dev-only JWT secret, all-zeros secret
  # encryption key, non-secure cookies, relaxed CSP). The images set no
  # NODE_ENV of their own, so it has to come from here.
  NODE_ENV: ${NODE_ENV:-production}
  CORS_CREDENTIALS: ${CORS_CREDENTIALS:-true}
  CORS_ORIGIN: ${CORS_ORIGIN}
  LIMITER_MAX: ${LIMITER_MAX:-2000}
  LIMITER_WINDOWMS: ${LIMITER_WINDOWMS:-900000}
  # Reverse-proxy hops in front of every service (browser -> nginx -> service).
  # Express uses it to derive req.ip for rate-limit buckets and audit source IPs.
  TRUST_PROXY: ${TRUST_PROXY:-1}

# -- Redis (every service that uses it) --
# Standalone mode: REDIS_URL only. REDIS_HOST/REDIS_PORT are not supported (a
# service refuses to start with REDIS_HOST set); REDIS_SENTINELS is the HA
# alternative and must not be combined with REDIS_URL.
x-redis-env: &redis-env
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}

# -- Env for services that call the quota service --
x-quota-client-env: &quota-client-env
  QUOTA_SERVICE_HOST: ${QUOTA_SERVICE_HOST:-quota}
  QUOTA_SERVICE_PORT: ${QUOTA_SERVICE_PORT:-3000}

# -- Env for services that use AI generation --
# Everything the shared AI provider registry (packages/ai-core) reads: the
# per-provider keys, the Bedrock opt-in and the self-hosted OpenAI-compatible
# endpoint. Used by ask, pipeline and plugin alike, so a provider configured
# once in .env is available to every AI surface.
x-ai-env: &ai-env
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
  XAI_API_KEY: ${XAI_API_KEY:-}
  BEDROCK_ENABLED: ${BEDROCK_ENABLED:-}
  OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
  OPENAI_COMPATIBLE_MODELS: ${OPENAI_COMPATIBLE_MODELS:-}
  OPENAI_COMPATIBLE_NAME: ${OPENAI_COMPATIBLE_NAME:-}
  OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}

# =============================================================================
# Services
# =============================================================================
services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  ask:
    image: 'ghcr.io/mwashburn160/ask:4.1.3'
    container_name: ask
    restart: always
    stop_grace_period: 10s
    environment:
      # Redis (x-redis-env) is how this service learns an impersonation session
      # was ended; without it impersonation tokens are rejected.
      <<: [*common-env, *server-env, *redis-env, *ai-env]
      SERVICE_NAME: ask
    networks:
      - backend-network
    healthcheck: *api-healthcheck
    deploy:
      resources:
        limits:
          cpus: '0.35'
          memory: 384M
        reservations:
          cpus: '0.10'
          memory: 160M

  # Opt-in self-hosted model (Ollama, OpenAI-compatible). Start with:
  #   docker compose --profile ask-model up -d
  # then set OPENAI_COMPATIBLE_BASE_URL=http://ask-model:11434/v1 and
  #   OPENAI_COMPATIBLE_MODELS=qwen2.5-coder:7b|Qwen 2.5 Coder in your .env.
  # (See the "Self-hosted Ask model" block in .env.example.) The 7B needs ~6-8Gi
  # of RAM to serve — on a smaller machine use OLLAMA_MODEL=qwen2.5-coder:1.5b
  # and match OPENAI_COMPATIBLE_MODELS to it, as the minikube target does.
  ask-model:
    image: 'ollama/ollama:0.6.5'
    container_name: ask-model
    profiles: [ask-model]
    restart: always
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
      OLLAMA_HOST: 0.0.0.0:11434
    entrypoint: ["/bin/sh", "-c"]
    # Retry the pull rather than `|| true`-ing it once. There is no supervisor
    # here that re-runs it: `restart: always` reacts to the container EXITING,
    # not to an unhealthy healthcheck, so a single transient registry blip used
    # to leave a permanently model-less container serving an empty catalogue.
    command:
      - |
        ollama serve &
        sleep 4
        for i in 1 2 3 4 5; do
          ollama pull "$$OLLAMA_MODEL" && break
          echo "ollama pull failed (attempt $$i); retrying in 30s" >&2
          sleep 30
        done
        wait
    volumes:
      - ask-model-models:/root/.ollama
    networks:
      - backend-network
    # GATE HEALTH ON THE MODEL, NOT THE SERVER.
    #
    # This used to be `ollama list >/dev/null || exit 1`, which passes the moment
    # the HTTP server binds — while the pull above is still downloading. The
    # container therefore reported healthy with an EMPTY model catalogue, `ask`
    # sent it a chat completion for a model that did not exist, and ollama closed
    # the connection: the user saw
    #   "AI_APICallError: Cannot connect to API: other side closed".
    # Grepping for the configured model is the honest check. Mirrors the
    # startupProbe on all three k8s targets.
    healthcheck:
      test: ["CMD", "sh", "-c", "ollama list | grep -qF \"$$OLLAMA_MODEL\""]
      interval: 30s
      timeout: 10s
      retries: 5
      # The first pull is ~4.7GB for the 7B. Failures during start_period do not
      # count toward `retries`, so this is the first-pull budget — matching the
      # k8s startupProbe's ~20 minutes. Too short a value (it was 90s) would mark
      # the container unhealthy while a perfectly normal download is in flight.
      start_period: 1200s
    deploy:
      resources:
        limits:
          # Mirrors the k8s copies (limits: cpu 4 / memory 10Gi).
          cpus: '4.0'
          memory: 10G

  nginx:
    # Unprivileged (UID 101) nginx, matching the k8s gateways. The njs module is
    # bundled in the official 1.30 image; nginx.conf sets `pid /tmp/nginx.pid` so
    # the non-root master can write its PID file.
    image: 'nginxinc/nginx-unprivileged:1.31'
    container_name: nginx
    restart: always
    stop_grace_period: 5s
    ports:
      - '8080:8080'
      - '8443:8443'
    environment:
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - './certs/nginx-tls.crt:/etc/nginx/certs/nginx.crt:ro'
      - './certs/nginx-tls.key:/etc/nginx/certs/nginx.key:ro'
      - './nginx/nginx.conf:/etc/nginx/nginx.conf:ro'
      - './nginx/jwt.js:/etc/nginx/njs/jwt.js:ro'
      - './nginx/metrics.js:/etc/nginx/njs/metrics.js:ro'
    networks:
      - proxy-network
      - backend-network
    depends_on:
      ask:            { condition: service_started }
      billing:        { condition: service_started }
      compliance:     { condition: service_started }
      frontend:       { condition: service_started }
      image-registry: { condition: service_started }
      message:        { condition: service_started }
      pipeline:       { condition: service_started }
      platform:       { condition: service_started }
      plugin:         { condition: service_started }
      quota:          { condition: service_started }
      reporting:      { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "curl -sfk https://localhost:8443/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.2'
          memory: 128M

  # ---------------------------------------------------------------------------
  # Databases
  # ---------------------------------------------------------------------------
  mongodb:
    image: 'mongo:8.3.7'
    container_name: mongodb
    restart: always
    stop_grace_period: 15s
    command: ['mongod', '--bind_ip_all', '--replSet', 'rs0', '--keyFile', '/etc/mongodb-keyfile']
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: platform
    volumes:
      - './data/db-data/mongodb/:/data/db/:rw'
      - './mongodb-keyfile:/etc/mongodb-keyfile:ro'
      - './mongodb-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro'
    networks:
      - backend-network
    healthcheck:
      # Single idempotent self-init probe — the one shared pattern across all targets:
      # initiate rs0 if not yet initialized, then report healthy only once this node is
      # the writable primary (so `healthy` ⇒ apps can connect via ?replicaSet=rs0). One
      # mongosh call, runs on localhost (no service chicken-and-egg). mongosh is a heavy
      # Node process, hence the generous 30s timeout.
      test:
        - CMD
        - mongosh
        - --quiet
        - --host
        - localhost:27017
        - --username
        - ${MONGO_INITDB_ROOT_USERNAME}
        - --password
        - ${MONGO_INITDB_ROOT_PASSWORD}
        - --authenticationDatabase
        - admin
        - --eval
        - 'try { rs.status() } catch (e) { if (e.codeName === "NotYetInitialized") { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongodb:27017" }] }) } else { throw e } } quit(db.hello().isWritablePrimary ? 0 : 1)'
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 90s
    deploy: *db-deploy

  postgres:
    image: 'postgres:18'
    container_name: postgres
    restart: always
    stop_grace_period: 15s
    command: postgres -c listen_addresses=*
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Read by postgres-init.sql (psql \getenv) on first init to create the
      # NOSUPERUSER NOBYPASSRLS application role every service logs in as.
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - './data/db-data/postgres/:/var/lib/postgresql:rw'
      - './postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro'
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy: *db-deploy

  # ---------------------------------------------------------------------------
  # pgBouncer connection pooler
  # ---------------------------------------------------------------------------
  # All app services connect through pgbouncer (DB_HOST=pgbouncer / DB_PORT=6432).
  # See `deploy/local/docker/config/pgbouncer/pgbouncer.ini` for per-tier pool layout.
  pgbouncer:
    image: 'edoburu/pgbouncer:v1.25.2-p0'
    container_name: pgbouncer
    restart: always
    environment:
      # edoburu uses DB_*; userlist.txt is generated from these at startup.
      # Our mounted pgbouncer.ini overrides the auto-generated config. This is
      # the APPLICATION role: pgbouncer passes the client login through, so only
      # DB_USER can connect via the pooler (the superuser is not in the userlist).
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      LISTEN_PORT: '6432'
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
    volumes:
      - './config/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: 'redis:8-alpine'
    container_name: redis
    restart: always
    stop_grace_period: 10s
    command: redis-server --maxmemory 128mb --maxmemory-policy noeviction
    volumes:
      - './data/db-data/redis/:/data:rw'
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ---------------------------------------------------------------------------
  # Application Services
  # ---------------------------------------------------------------------------
  frontend:
    image: 'ghcr.io/mwashburn160/frontend:4.1.6'
    container_name: frontend
    restart: always
    stop_grace_period: 10s
    environment:
      PLATFORM_BASE_URL: ${PLATFORM_BASE_URL}
      # Public (browser-facing) origin for social-card / Open Graph absolute URLs.
      # Resolved at RUNTIME by the frontend (see frontend/src/lib/site-url.ts), so
      # one image works across environments. Local docker serves on :8443.
      APP_SITE_URL: ${APP_SITE_URL:-https://localhost:8443}
      # Server-side relay target for client error reports; empty = reporting off.
      ERROR_REPORT_URL: ${ERROR_REPORT_URL:-}
    volumes:
      - './data/cache:/app/.next/cache:rw'
      - './data/tmp:/tmp:rw'
    networks:
      - proxy-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  platform:
    image: 'ghcr.io/mwashburn160/platform:4.1.6'
    container_name: platform
    restart: always
    stop_grace_period: 10s
    environment:
      # Redis (x-redis-env) is how this service PUBLISHES revocations and shares
      # login / step-up / leader state; without it revocations never propagate.
      <<: [*common-env, *postgres-env, *server-env, *redis-env, *quota-client-env]
      SERVICE_NAME: platform
      # Deployment target surfaced via /config so the frontend can gate the AWS-only
      # onboarding CLI-setup section (this compose stack is the `docker` target).
      DEPLOY_TARGET: ${DEPLOY_TARGET:-docker}
      # Billing
      BILLING_ENABLED: ${BILLING_ENABLED:-true}
      BILLING_SERVICE_HOST: ${BILLING_SERVICE_HOST:-billing}
      BILLING_SERVICE_PORT: ${BILLING_SERVICE_PORT:-3000}
      # Security
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-12}
      MAX_LOGIN_ATTEMPTS: ${MAX_LOGIN_ATTEMPTS:-5}
      # Platform-only multi-tenant knobs. RLS_CONTEXT_MODE is set via
      # x-postgres-env so every postgres-backed service inherits it.
      BOOTSTRAP_SUPERADMIN_EMAILS: ${BOOTSTRAP_SUPERADMIN_EMAILS:-}
      SECRET_ENCRYPTION_PER_ORG_KMS: ${SECRET_ENCRYPTION_PER_ORG_KMS:-false}
      # JWT
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      # bcrypt password-hash cost. Empty :- default so compose doesn't warn when
      # unset — the app owns the default (BCRYPT_SALT_ROUNDS || 12).
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN}
      # Platform
      PLATFORM_FRONTEND_URL: ${PLATFORM_FRONTEND_URL:-https://localhost:8443}
      # MongoDB
      MONGODB_URI: ${MONGODB_URI}
      # Email
      EMAIL_ENABLED: ${EMAIL_ENABLED}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SES_REGION: ${SES_REGION:-us-east-1}
      SES_ACCESS_KEY_ID: ${SES_ACCESS_KEY_ID}
      SES_SECRET_ACCESS_KEY: ${SES_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # Invitations
      INVITATION_EXPIRATION_DAYS: ${INVITATION_EXPIRATION_DAYS}
      INVITATION_MAX_PENDING_PER_ORG: ${INVITATION_MAX_PENDING_PER_ORG}
      # Per-tier rate-limit multipliers (effective budget = LIMITER_MAX x mult)
      LIMITER_MULT_DEVELOPER: ${LIMITER_MULT_DEVELOPER:-}
      LIMITER_MULT_PRO: ${LIMITER_MULT_PRO:-}
      LIMITER_MULT_TEAM: ${LIMITER_MULT_TEAM:-}
      LIMITER_MULT_ENTERPRISE: ${LIMITER_MULT_ENTERPRISE:-}
      # Per-tier quota reset period (seeds Organization model defaults)
      QUOTA_TIER_DEVELOPER_RESET_PERIOD: ${QUOTA_TIER_DEVELOPER_RESET_PERIOD:-}
      QUOTA_TIER_PRO_RESET_PERIOD: ${QUOTA_TIER_PRO_RESET_PERIOD:-}
      QUOTA_TIER_TEAM_RESET_PERIOD: ${QUOTA_TIER_TEAM_RESET_PERIOD:-}
      QUOTA_TIER_ENTERPRISE_RESET_PERIOD: ${QUOTA_TIER_ENTERPRISE_RESET_PERIOD:-}
      # Developer-tier limit overrides — platform seeds new-org quota defaults
      # from QUOTA_TIERS.developer.limits, so it must receive these to honor
      # operator overrides (the quota service receives the full tier matrix).
      QUOTA_TIER_DEVELOPER_PLUGINS: ${QUOTA_TIER_DEVELOPER_PLUGINS:-}
      QUOTA_TIER_DEVELOPER_PIPELINES: ${QUOTA_TIER_DEVELOPER_PIPELINES:-}
      QUOTA_TIER_DEVELOPER_API_CALLS: ${QUOTA_TIER_DEVELOPER_API_CALLS:-}
      QUOTA_TIER_DEVELOPER_AI_CALLS: ${QUOTA_TIER_DEVELOPER_AI_CALLS:-}
      QUOTA_TIER_DEVELOPER_STORAGE_BYTES: ${QUOTA_TIER_DEVELOPER_STORAGE_BYTES:-}
      QUOTA_TIER_DEVELOPER_DASHBOARDS: ${QUOTA_TIER_DEVELOPER_DASHBOARDS:-}
      QUOTA_TIER_DEVELOPER_ALERT_RULES: ${QUOTA_TIER_DEVELOPER_ALERT_RULES:-}
      QUOTA_TIER_DEVELOPER_ALERT_DESTINATIONS: ${QUOTA_TIER_DEVELOPER_ALERT_DESTINATIONS:-}
      QUOTA_TIER_DEVELOPER_IDP_CONFIGS: ${QUOTA_TIER_DEVELOPER_IDP_CONFIGS:-}
      QUOTA_TIER_DEVELOPER_SEATS: ${QUOTA_TIER_DEVELOPER_SEATS:-}
      # Default tier for new orgs + per-tier access-token TTLs (platform reads these)
      DEFAULT_QUOTA_TIER: ${DEFAULT_QUOTA_TIER:-}
      JWT_EXPIRES_IN_DEVELOPER: ${JWT_EXPIRES_IN_DEVELOPER:-}
      JWT_EXPIRES_IN_PRO: ${JWT_EXPIRES_IN_PRO:-}
      JWT_EXPIRES_IN_TEAM: ${JWT_EXPIRES_IN_TEAM:-}
      JWT_EXPIRES_IN_ENTERPRISE: ${JWT_EXPIRES_IN_ENTERPRISE:-}
      # OAuth
      # OAuth — each provider stays hidden until its CLIENT_ID is set.
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      OAUTH_FACEBOOK_CLIENT_ID: ${OAUTH_FACEBOOK_CLIENT_ID:-}
      OAUTH_FACEBOOK_CLIENT_SECRET: ${OAUTH_FACEBOOK_CLIENT_SECRET:-}
      OAUTH_MICROSOFT_CLIENT_ID: ${OAUTH_MICROSOFT_CLIENT_ID:-}
      OAUTH_MICROSOFT_CLIENT_SECRET: ${OAUTH_MICROSOFT_CLIENT_SECRET:-}
      OAUTH_MICROSOFT_TENANT: ${OAUTH_MICROSOFT_TENANT:-common}
      OAUTH_GITLAB_CLIENT_ID: ${OAUTH_GITLAB_CLIENT_ID:-}
      OAUTH_GITLAB_CLIENT_SECRET: ${OAUTH_GITLAB_CLIENT_SECRET:-}
      OAUTH_GITLAB_BASE_URL: ${OAUTH_GITLAB_BASE_URL:-https://gitlab.com}
      OAUTH_LINKEDIN_CLIENT_ID: ${OAUTH_LINKEDIN_CLIENT_ID:-}
      OAUTH_LINKEDIN_CLIENT_SECRET: ${OAUTH_LINKEDIN_CLIENT_SECRET:-}
      OAUTH_CALLBACK_BASE_URL: ${OAUTH_CALLBACK_BASE_URL:-https://localhost:8443}
      SERVICE_TIMEOUT: ${SERVICE_TIMEOUT:-30000}
      # Loki
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
      # Native observability: queries go to the Thanos querier (recent + archived
      # blocks), alerts to Alertmanager.
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://thanos-query:9090}
      ALERTMANAGER_URL: ${ALERTMANAGER_URL:-http://alertmanager:9093}
      # Per-org alert relay: the single Alertmanager instance (id `alertmanager`,
      # sent as X-Alertmanager-Instance) and its bearer token, which Alertmanager
      # reads from the `alert_webhook_token` compose secret below.
      ALERT_WEBHOOK_INSTANCES: '[{"id":"alertmanager","token":"${ALERT_WEBHOOK_INSTANCE_TOKEN:?ALERT_WEBHOOK_INSTANCE_TOKEN must be set (run gen-env-secrets)}"}]'
    networks:
      - backend-network
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck: *api-healthcheck
    deploy: *api-deploy

  plugin:
    image: 'ghcr.io/mwashburn160/plugin:4.1.3'
    container_name: plugin
    restart: always
    stop_grace_period: 10s
    environment:
      <<: [*common-env, *postgres-env, *server-env, *redis-env, *quota-client-env, *ai-env]
      SERVICE_NAME: plugin
      COMPLIANCE_SERVICE_HOST: ${COMPLIANCE_SERVICE_HOST:-compliance}
      COMPLIANCE_SERVICE_PORT: ${COMPLIANCE_SERVICE_PORT:-3000}
      COMPLIANCE_BYPASS: ${COMPLIANCE_BYPASS:-false}
      IMAGE_REGISTRY_HOST: ${IMAGE_REGISTRY_HOST:-registry}
      IMAGE_REGISTRY_PORT: ${IMAGE_REGISTRY_PORT:-5000}
      IMAGE_REGISTRY_USER: ${IMAGE_REGISTRY_USER:-admin}
      IMAGE_REGISTRY_TOKEN: ${IMAGE_REGISTRY_TOKEN}
      IMAGE_REGISTRY_HTTP: ${IMAGE_REGISTRY_HTTP:-true}
      # Must match the registry's REGISTRY_AUTH_TOKEN_REALM so the plugin's
      # writeAuthConfig writes credentials keyed by the same host the
      # docker client will be redirected to during a push/pull challenge.
      # In-cluster clients hit image-registry directly on plain HTTP.
      # Override in .env when external docker clients need to pull.
      IMAGE_REGISTRY_TOKEN_REALM: ${IMAGE_REGISTRY_TOKEN_REALM:-http://image-registry:3000/token}
      # Talk to buildkitd over TCP on the backend-network. Unix-socket sharing
      # via a named volume fails under the rootless image because the volume
      # mounts at `/run/buildkit/` owned by root inside the container and the
      # rootless daemon (UID 1000) can't bind a socket there.
      BUILDKIT_HOST: tcp://buildkitd:1234
      # Platform buildkit publishes plugin images for. Default linux/amd64 (the
      # CodeBuild runtime). Set PUBLISH_PLATFORM=linux/arm64 to build native on an
      # Apple-Silicon dev box (faster — local plugin images aren't run on AWS).
      PUBLISH_PLATFORM: ${PUBLISH_PLATFORM:-linux/amd64}
      DOCKER_BUILD_TIMEOUT_MS: ${DOCKER_BUILD_TIMEOUT_MS:-900000}
      DOCKER_PUSH_TIMEOUT_MS: ${DOCKER_PUSH_TIMEOUT_MS:-300000}
      PLUGIN_BUILD_CONCURRENCY: ${PLUGIN_BUILD_CONCURRENCY:-1}
      # Plugin code (read-only rootfs) writes the transient incoming ZIP + the
      # extracted build context here. MUST match the container-side bind target
      # in `volumes:` below. Local uses a laptop-style /data/* container path
      # that mirrors the host ./data/ checkout layout; the ec2 deploy uses the
      # canonical /opt/pipeline/pipeline-data/* path instead. Single dir now
      # (was builds/ + uploads/) — the durable cross-replica artifact lives in
      # object storage (S3_* below), so this is per-node build scratch only.
      DOCKER_BUILD_TEMP_ROOT: ${DOCKER_BUILD_TEMP_ROOT:-/data/plugins-data}
      PLUGIN_UPLOAD_DIR: ${PLUGIN_UPLOAD_DIR:-/data/plugins-data}
      # Object storage for the uploaded build context — a worker on any replica
      # can rehydrate a build from here (see plugin-artifact-storage). Own bucket
      # + bucket-scoped creds (provisioned by minio-init).
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${PLUGIN_S3_BUCKET:-plugins}
      S3_ACCESS_KEY_ID: ${PLUGIN_S3_ACCESS_KEY}
      S3_SECRET_ACCESS_KEY: ${PLUGIN_S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: 'true'
      TMPDIR: /tmp
    volumes:
      # Host ./data/plugins-data → container /data/plugins-data (per-node build
      # scratch: transient ZIP + extract dir). Symmetric naming makes "what's in
      # the laptop dir" obvious from inside the container too.
      - './data/plugins-data:/data/plugins-data:rw'
    networks:
      - backend-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      buildkitd:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck: *api-healthcheck
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2048M
        reservations:
          cpus: '0.75'
          memory: 1024M

  # ---------------------------------------------------------------------------
  # Rootless BuildKit daemon — replaces dind, no privileged mode, no
  # CA-trust workaround (buildkitd carries the system CA bundle). Single
  # shared instance for all plugin builds — tier partitioning lives at
  # the BullMQ queue level inside the plugin service, not at the
  # buildkitd layer.
  # ---------------------------------------------------------------------------
  buildkitd:
    # v0.32.1 (was v0.16.0): newer runc reaper avoids the hot
    # "container not running" retry loop on killed build containers.
    image: 'moby/buildkit:v0.32.1-rootless'
    container_name: buildkitd
    restart: always
    stop_grace_period: 5s
    user: "1000:1000"
    # Required for rootless newuidmap/newgidmap and `unshare` setup.
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    command:
      - --addr
      - tcp://0.0.0.0:1234
      - --oci-worker-no-process-sandbox
      # buildkitd.toml mirrors docker.io → registry:5000 so plugin
      # Dockerfiles can use bare `FROM pipeline-plugin-base:24.04` and
      # buildkit transparently resolves to the in-cluster registry.
      - --config
      - /home/user/.config/buildkit/buildkitd.toml
    expose:
      - "1234"
    volumes:
      # Named volume (not a host bind mount) on purpose: buildkit's
      # overlay snapshotter relies on filesystem features (xattrs,
      # workdir cleanup semantics, idmapped chown) that macOS Docker
      # Desktop's virtiofs-backed bind mounts don't fully support. A
      # named volume lives on the Linux VM's native ext4 and behaves
      # correctly. Cost: cache survives `rm -rf ./data` and needs an
      # explicit `docker volume rm pipeline-builder_buildkit-cache`
      # to wipe.
      - 'buildkit-cache:/home/user/.local/share/buildkit:rw'
      - './config/buildkitd/buildkitd.toml:/home/user/.config/buildkit/buildkitd.toml:ro'
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "buildctl", "--addr", "tcp://127.0.0.1:1234", "debug", "workers"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          # Rootless buildkit runs the plugin's RUN steps in this container; too
          # low OOM-kills heavy builds → "buildkit-runc … container not running".
          # Tunable via BUILDKIT_MEMORY_LIMIT in .env (compose expands it; default
          # 3072M — same 3Gi tier as minikube). Use M/G, NOT Mi (so the value is
          # also valid if minikube falls back to this .env).
          memory: ${BUILDKIT_MEMORY_LIMIT:-3072M}
        reservations:
          cpus: '0.5'
          memory: 512M


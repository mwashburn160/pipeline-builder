      PLATFORM_SERVICE_HOST: ${PLATFORM_SERVICE_HOST:-platform}
      PLATFORM_SERVICE_PORT: ${PLATFORM_SERVICE_PORT:-3000}
      # Fallback return URL for the Stripe billing portal (the request Origin is

; ---------------------------------------------------------------------------
; pgBouncer pool partitioning for Pipeline Builder
; ---------------------------------------------------------------------------
;
; Why a connection pooler: when the platform fleet scales beyond ~10
; replicas, the raw connection ceiling on Postgres (default max_connections
; = 100) becomes the throttle. pgBouncer lets every service pin a
; "pool"-class connection (cheap, ephemeral) while pgBouncer fans out to a
; bounded pool of real Postgres connections.
;
; Why per-tier pools: a noisy Developer-tier org running long-running
; queries can chew through the shared pool and starve Pro/Team/Enterprise
; customers. The logical databases below all point at the SAME underlying
; physical database (pipeline_builder) but pgBouncer maintains SEPARATE pool
; budgets per logical DB. Services that route by tier (e.g. plugin build
; worker) connect with DB_NAME=pipeline_builder_<tier>; the default service
; connection (`pipeline_builder`) is for tier-agnostic traffic (login, admin
; endpoints, observability scrapers).
;
; This pooler is ALWAYS in the path for this deploy: docker-compose.yml starts
; the pgbouncer service unconditionally and .env.example defaults
; DB_HOST=pgbouncer / DB_PORT=6432, so every service connects through it. There
; is no PGBOUNCER_ENABLED toggle — to bypass, point DB_HOST at postgres:5432.

[databases]
; Default pool — used by services without a tier-specific routing decision.
pipeline_builder = host=postgres port=5432 dbname=pipeline_builder

; Per-tier pools. Same physical DB; pgBouncer enforces separate pool
; budgets so cross-tier saturation can't happen at the pool level.
; Tiers: developer/pro/team/enterprise (current tier set); `unlimited` is
; retained for the billing-off (BILLING_ENABLED=false) case.
pipeline_builder_developer  = host=postgres port=5432 dbname=pipeline_builder pool_size=20
pipeline_builder_pro        = host=postgres port=5432 dbname=pipeline_builder pool_size=40
pipeline_builder_team       = host=postgres port=5432 dbname=pipeline_builder pool_size=60
pipeline_builder_enterprise = host=postgres port=5432 dbname=pipeline_builder pool_size=80
pipeline_builder_unlimited  = host=postgres port=5432 dbname=pipeline_builder pool_size=80
; The anonymous public plugin directory. Only the
; view-only ecosystem_public_reader logs in here; a small, separate pool so
; unauthenticated traffic can never exhaust the tenant pools above.
pipeline_builder_public     = host=postgres port=5432 dbname=pipeline_builder pool_size=5 max_db_connections=5

[users]
; Cap the anonymous directory's login across EVERY pool, not just its own:
; a client could name a tenant database alias, so the per-database pool_size
; above alone wouldn't keep unauthenticated traffic off the tenant pools.
ecosystem_public_reader = max_user_connections=5

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; Transaction-mode pooling: pgBouncer hands a backend connection to a
; client for the duration of a transaction, then returns it to the pool.
; Compatible with every drizzle / pg driver call this app makes — no
; cursor / prepared-statement state crosses transaction boundaries.
pool_mode = transaction

; Auth file is generated by the edoburu/pgbouncer entrypoint from the DB_*
; env vars in docker-compose.yml (NOT by the postgres init scripts); format
; is `"<user>" "<md5-or-scram-encoded-password>"` per line. The example
; deploy uses scram-sha-256 (Postgres 14+ default).
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Sane defaults for a fleet of ~10 platform replicas.
max_client_conn = 1000
default_pool_size = 25
reserve_pool_size = 5
reserve_pool_timeout = 5

; Drop idle backends after 10 minutes — keeps pgBouncer's footprint small
; during quiet periods (test envs, off-hours).
server_idle_timeout = 600

; The userlist holds ONLY the application role (DB_USER, generated by the
; edoburu entrypoint from docker-compose.yml): the superuser deliberately cannot
; log in through the pooler. No admin_users — the app role must not be able to
; PAUSE/KILL/SHUTDOWN pgbouncer; it is a stats user so operators can run
; `psql -h localhost -p 6432 -U pipeline_app pgbouncer -c 'SHOW POOLS'`.
; Keep the name in sync with DB_USER in .env.
stats_users = pipeline_app
# Clients that send `extra_float_digits` in their startup packet (Go's lib/pq)
# are otherwise REJECTED at login — pgbouncer refuses unknown startup
# parameters. node-postgres doesn't send it; keep this in sync with the k8s
# pgbouncer ConfigMaps so a lib/pq-based tool can always connect.
ignore_startup_parameters = extra_float_digits

logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid

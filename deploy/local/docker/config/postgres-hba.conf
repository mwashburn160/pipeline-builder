# TYPE  DATABASE        USER            ADDRESS                 METHOD
# The postgres image's own defaults, kept as-is: trust for in-pod connections
# (the entrypoint and pg_isready use these), scram for everything else.
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust
# Streaming replication from the read replica (pg_basebackup + walreceiver).
# The image default has no remote `replication` line, and `all` in the
# DATABASE column does NOT match replication connections, so without this the
# standby can never seed. Only roles with REPLICATION can use it: that is
# DB_REPLICATION_USER (and the superuser); DB_USER is NOREPLICATION on purpose.
host    replication     all             all                     scram-sha-256
host    all             all             all                     scram-sha-256

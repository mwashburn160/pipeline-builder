# Grafana datasource provisioning for the docker target.
#
# Kept in sync with the kubernetes targets' grafana-datasources ConfigMap, with
# ONE deliberate difference: Prometheus is the default here because this target
# runs no Thanos (the k8s targets default to Thanos, which fans out to the
# object-store blocks and so answers long ranges that Prometheus alone drops).
apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    # Loki now runs with auth_enabled: true (each org is a tenant), so every
    # client must send X-Scope-OrgID. Grafana is the OPERATOR console, so it
    # points at the `_infra` tenant — unattributed platform/infra lines.
    # Per-org log browsing lives in the product UI (/dashboard/logs), which
    # scopes the header from the caller's verified token. To inspect a
    # specific org from here, append its id: `_infra|<orgId>`.
    jsonData:
      httpHeaderName1: X-Scope-OrgID
    secureJsonData:
      httpHeaderValue1: _infra
  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686

# promtool unit tests for the docker target's alert rules.
#
#   docker run --rm -v "$PWD:/t:ro" --entrypoint promtool prom/prometheus:v3.15.0 \
#     test rules /t/alert-rules.test.yml
#
#   (or `deploy/bin/validate-configs.sh`, which runs every target's suite against
#    the PINNED image.)
#
# The full suite lives in deploy/local/minikube/config/prometheus/alert-rules.test.yml
# and covers the three Kubernetes targets, whose rule files are byte-identical.
# Docker's file is that set minus the Kubernetes-only rules
# (test/deploy-contracts/test/prometheus-contract.test.ts), so only cases for
# rules docker evaluates differently, or that are new and must be proven HERE
# too, belong in this file.

rule_files:
  - alert-rules.yml
evaluation_interval: 1m
tests:
  # BillingDuplicateRefundFailing: a canceled duplicate checkout whose first
  # invoice could not be refunded fires at once ...
  - interval: 1m
    input_series:
      - series: 'billing_duplicate_stripe_refund_failed_total{service="billing",pod="billing-aaa"}'
        values: '0x10 1x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: BillingDuplicateRefundFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              component: billing
              tenancy: platform
            exp_annotations:
              summary: "A duplicate Stripe subscription was canceled but not refunded"
              description: "A duplicate checkout was canceled but its first invoice could not be refunded 1 time(s) in the last hour, so a customer has paid twice. The refund is not retried: find the billing event (reason duplicate_checkout, refundFailed) for the org and the canceled subscription id, then refund that subscription's first paid invoice in the Stripe Dashboard. The billing log line 'Failed to refund duplicate Stripe sub' carries the Stripe error."

  # ... and a quiet counter does not.
  - interval: 1m
    input_series:
      - series: 'billing_duplicate_stripe_refund_failed_total{service="billing",pod="billing-aaa"}'
        values: '0+0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: BillingDuplicateRefundFailing
        exp_alerts: []

  # --- Nightly plugin CVE remediation -----------------------------------------
  # PluginRemediationErrors: one remediation that ended in an error fires (no
  # for:, a job error is rare and each one is worth a look) ...
  - interval: 1m
    input_series:
      - series: 'plugin_remediations_total{stage="failed",outcome="error",service="plugin",pod="plugin-aaa"}'
        values: '0x10 1x30'
      - series: 'plugin_remediations_total{stage="done",outcome="cleared",service="plugin",pod="plugin-aaa"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: PluginRemediationErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              component: plugin
              tenancy: platform
            exp_annotations:
              summary: "1 plugin remediations failed with an error in 6h"
              description: "Plugins → Remediations, filter Failed: each row's error is a short code. SOURCE_CHECKSUM_MISMATCH means a kept build source in the plugin-sources bucket changed under its pointer — treat it as tampering until the object's history says otherwise, and never retry it blind. Anything else is usually the build queue or buildkit; the next rescan does not retry a failed findings set until the findings change, so retry it from the card once fixed."

  # ... while cleared, needs-owner and rejected outcomes never do: "could not
  # fix" goes to the owner (N39), it is not an operator problem.
  - interval: 1m
    input_series:
      - series: 'plugin_remediations_total{stage="failed",outcome="error",service="plugin",pod="plugin-aaa"}'
        values: '0+0x40'
      - series: 'plugin_remediations_total{stage="done",outcome="cleared",service="plugin",pod="plugin-aaa"}'
        values: '0+1x40'
      - series: 'plugin_remediations_total{stage="needs_owner",outcome="owner_request",service="plugin",pod="plugin-aaa"}'
        values: '0+1x40'
      - series: 'plugin_remediations_total{stage="failed",outcome="rejected",service="plugin",pod="plugin-aaa"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: PluginRemediationErrors
        exp_alerts: []

  # PluginRemediationRolloutStartFailing: one given-up rollout start fires,
  # per reason ...
  - interval: 1m
    input_series:
      - series: 'plugin_remediation_rollout_start_failures_total{reason="exhausted",service="plugin",pod="plugin-aaa"}'
        values: '0x10 1x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: PluginRemediationRolloutStartFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              component: plugin
              tenancy: platform
              reason: exhausted
            exp_annotations:
              summary: "1 plugin remediation rollouts did not start (exhausted) in 6h"
              description: "Plugins → Remediations: the Published rows reading \"Rollout didn't start\". permanent = the pipeline service refused the start request (check the plugin log 'Remediation rollout not started' for the status, and pipeline's internal route and service-auth config); exhausted = the pipeline service stayed unavailable or overloaded across 5 attempts (at publish, then 4 nightly passes). Once fixed, Retry on each card restarts its rollout."

  # ... and a quiet counter does not.
  - interval: 1m
    input_series:
      - series: 'plugin_remediation_rollout_start_failures_total{reason="permanent",service="plugin",pod="plugin-aaa"}'
        values: '0+0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: PluginRemediationRolloutStartFailing
        exp_alerts: []

  # PluginSourceDeleteFailing: per kind, so an image-delete failure is told
  # apart from a RustFS prefix failure.
  - interval: 1m
    input_series:
      - series: 'plugin_source_delete_failures_total{kind="prefix",service="plugin",pod="plugin-aaa"}'
        values: '0x10 2x30'
      - series: 'plugin_source_delete_failures_total{kind="image",service="plugin",pod="plugin-aaa"}'
        values: '0+0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: PluginSourceDeleteFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              component: plugin
              tenancy: platform
              kind: prefix
            exp_annotations:
              summary: "Plugin prefix deletes are failing after a purge"
              description: "2 prefix deletes failed in 6h. Purged tenant sources or images are still stored until the orphan retry succeeds. kind=object|prefix: check the plugin service's RustFS key still reaches plugin-sources (rustfs-init policy plugin-sources-rw); kind=image: check image-registry's discardPluginImage."

  # A failure older than the 6h window (since retried by the sweep) is quiet.
  - interval: 10m
    input_series:
      - series: 'plugin_source_delete_failures_total{kind="object",service="plugin",pod="plugin-aaa"}'
        values: '0 1x60'
    alert_rule_test:
      - eval_time: 9h
        alertname: PluginSourceDeleteFailing
        exp_alerts: []

  # PluginSourcesMissing: a version found its kept source gone (after a restore).
  - interval: 1m
    input_series:
      - series: 'plugin_source_missing_total{service="plugin",pod="plugin-aaa"}'
        values: '0x10 3x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: PluginSourcesMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              component: plugin
              tenancy: platform
            exp_annotations:
              summary: "3 plugin versions lost their kept build source"
              description: "Their sources are gone from the plugin-sources bucket, so they can now only be fixed with an overlay layer (no library source patches, nothing for compiled Go/Rust/.NET/Java). Restore plugin-sources from the object-store mirror (restore.sh --object-store) if it was left out; a version marked source-less stays that way until its owner uploads a new version."
      - eval_time: 5m
        alertname: PluginSourcesMissing
        exp_alerts: []

  # ToolchainFixFailing: an approved toolchain release candidate did not fully publish.
  - interval: 1m
    input_series:
      - series: 'toolchain_fix_failures_total{stage="publish",service="plugin",pod="plugin-aaa"}'
        values: '0x10 1x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: ToolchainFixFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              component: plugin
              tenancy: platform
              stage: publish
            exp_annotations:
              summary: "Toolchain fixes: publish failed"
              description: "1 toolchain-fix publish failures in 6h. publish: an approved candidate stopped part-way; it keeps its progress and resumes under the same version — use Resume publish on the Toolchain console's Toolchain fixes card (the plugin service also resumes it within ~2 minutes) and check the plugin log for the error. keep_inputs: check the plugin service's RustFS key still writes plugin-sources (<systemOrgId>/toolchain-inputs/), then re-upload the release with load-plugins.sh so its Dockerfiles are kept."
      - eval_time: 5m
        alertname: ToolchainFixFailing
        exp_alerts: []

  # PluginSourceChecksumMismatch: a kept source no longer matches its SHA-256 (tampering).
  - interval: 1m
    input_series:
      - series: 'plugin_source_checksum_mismatch_total{service="plugin",pod="plugin-aaa"}'
        values: '0x10 1x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: PluginSourceChecksumMismatch
        exp_alerts:
          - exp_labels:
              severity: critical
              component: plugin
              tenancy: platform
            exp_annotations:
              summary: "1 kept plugin sources failed their checksum"
              description: "A kept build source in the plugin-sources bucket changed under its recorded SHA-256: treat it as tampering. Nothing was built from it (the remediation failed closed with SOURCE_CHECKSUM_MISMATCH). Check the bucket's access log for writes outside the plugin service's scoped key, rotate PLUGIN_S3_ACCESS_KEY_ID if in doubt, and never retry the remediation until the object's history is understood."
      - eval_time: 5m
        alertname: PluginSourceChecksumMismatch
        exp_alerts: []

  # PluginRemediationCanaryStale: the last clean canary pass was 49h ago ...
  - interval: 5m
    input_series:
      - series: 'plugin_remediation_canary_last_success_timestamp_seconds{service="plugin",pod="plugin-aaa"}'
        values: '0x600'
    alert_rule_test:
      - eval_time: 47h
        alertname: PluginRemediationCanaryStale
        exp_alerts: []
      - eval_time: 49h
        alertname: PluginRemediationCanaryStale
        exp_alerts:
          - exp_labels:
              severity: warning
              component: plugin
              tenancy: platform
            exp_annotations:
              summary: "The plugin remediation fixture canary has not passed in 48h"
              description: "Last clean canary pass 2d 1h 0m 0s ago. Open the system org's Remediations list (fixture plugins) or the Ecosystem console fleet view: the failing package type is the patcher or scanner to look at. PluginVulnRescanStale firing too means the rescan, not remediation, stopped."

  # ... while a canary that passes every night stays quiet, even when a
  # former leader's pod still exports an old timestamp (max() reads the newest).
  - interval: 5m
    input_series:
      - series: 'plugin_remediation_canary_last_success_timestamp_seconds{service="plugin",pod="plugin-new"}'
        values: '0x288 86400x288 172800x30'
      - series: 'plugin_remediation_canary_last_success_timestamp_seconds{service="plugin",pod="plugin-old"}'
        values: '0x600'
    alert_rule_test:
      - eval_time: 49h
        alertname: PluginRemediationCanaryStale
        exp_alerts: []

  # --- Per-org KMS post-change verification ---------------------------------
  # KmsSecretVerifyFailed: a secret that did not decrypt under its org's new
  # KMS config fires at once, one alert per field ...
  - interval: 1m
    input_series:
      - series: 'platform_kms_secret_verify_failed_total{field="aiProviderKeys.openai",service="platform",pod="platform-aaa"}'
        values: '0x10 1x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: KmsSecretVerifyFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              component: platform
              tenancy: platform
              field: aiProviderKeys.openai
            exp_annotations:
              summary: "aiProviderKeys.openai unreadable after a per-org KMS config change"
              description: "1 org secret(s) (aiProviderKeys.openai) did not decrypt under their org's current KMS config in the post-change verification: a platform replica wrote them under the previous key before the cache eviction reached it. The org is named in the platform logs ('KMS verify: org secrets do not decrypt') and the admin.org.kms-config.verify failure audit row; its admins were asked to re-enter the secret. If they cannot, follow docs/runbooks/secret-rotation.md (Per-org KMS -> Post-change verification)."

  # ... and a quiet counter does not.
  - interval: 1m
    input_series:
      - series: 'platform_kms_secret_verify_failed_total{field="idpClientSecret",service="platform",pod="platform-aaa"}'
        values: '0+0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: KmsSecretVerifyFailed
        exp_alerts: []

  # BillingStripeWebhookEventsMissing: the reconcile could not add 2 handled
  # events to the Stripe webhook endpoint (e.g. a restricted key) — fires after 15m ...
  - interval: 1m
    input_series:
      - series: 'billing_stripe_webhook_events_missing{service="billing",pod="billing-aaa"}'
        values: '2x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: BillingStripeWebhookEventsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              component: billing
              tenancy: platform
            exp_annotations:
              summary: "2 handled Stripe event type(s) are not confirmed on the webhook endpoint"
              description: "Billing could not make the Stripe webhook endpoint subscribe to every event it handles, so Stripe may never deliver those events (subscription changes, payments, refunds or disputes would silently stop reconciling). The stripe-webhook-reconcile log line on the billing leader names the missing events and the reason. Grant STRIPE_SECRET_KEY Webhook Endpoints write access, set STRIPE_WEBHOOK_ENDPOINT_ID when the endpoint is not at PLATFORM_BASE_URL/api/billing/stripe/webhook, add the events in the Stripe Dashboard, or, when the reason is endpoint_disabled, fix the failing deliveries and re-enable the endpoint there. See docs/billing-providers.md (Step 4)."

  # ... and a complete endpoint (gauge 0) does not.
  - interval: 1m
    input_series:
      - series: 'billing_stripe_webhook_events_missing{service="billing",pod="billing-aaa"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: BillingStripeWebhookEventsMissing
        exp_alerts: []

  # --- Deploys through a runner -------------------------------------------------

  # A reused deploy grant pages at once (the series is primed at zero on boot).
  - interval: 1m
    input_series:
      - series: 'pipeline_runner_deploy_grant_rejections_total{reason="reused",service="pipeline",pod="pipeline-a"}'
        values: '0x10 1x20'
    alert_rule_test:
      - eval_time: 9m
        alertname: RunnerDeployGrantReuse
        exp_alerts: []
      - eval_time: 15m
        alertname: RunnerDeployGrantReuse
        exp_alerts:
          - exp_labels: { severity: critical, component: pipeline, tenancy: platform }
            exp_annotations:
              summary: "A runner deploy grant was presented again after its exchange"
              description: "A deploy job grant was exchanged a second time in the last 15 minutes (pipeline_runner_deploy_grant_rejections_total{reason=\"reused\"}). Grants are single use and only ever travel inside a signed run request, so a reuse means a grant leaked from a runner's account or the platform. Find the deploy in the audit log (pipeline.deploy.grant_reuse: requestId, runnerId), check that runner's CodeBuild project and KMS key policy in the customer account, and cancel the deploy if it is still running. See docs/aws-deployment.md (Deploying a pipeline through a runner)."

  # Expired, unknown and wrong-state grant refusals never page as a reuse.
  - interval: 1m
    input_series:
      - series: 'pipeline_runner_deploy_grant_rejections_total{reason="reused",service="pipeline",pod="pipeline-a"}'
        values: '0x40'
      - series: 'pipeline_runner_deploy_grant_rejections_total{reason="expired",service="pipeline",pod="pipeline-a"}'
        values: '0+1x40'
      - series: 'pipeline_runner_deploy_grant_rejections_total{reason="unknown",service="pipeline",pod="pipeline-a"}'
        values: '0+2x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: RunnerDeployGrantReuse
        exp_alerts: []

  # Platform-class deploy failures warn; customer-side classes (account setup,
  # CloudFormation) never do.
  - interval: 1m
    input_series:
      - series: 'pipeline_runner_deploy_failures_total{class="platform",service="pipeline",pod="pipeline-a"}'
        values: '0x30 1 2 3 4x30'
      - series: 'pipeline_runner_deploy_failures_total{class="account_setup",service="pipeline",pod="pipeline-a"}'
        values: '0+5x60'
    alert_rule_test:
      - eval_time: 32m
        alertname: RunnerDeployPlatformFailures
        exp_alerts: []
      - eval_time: 40m
        alertname: RunnerDeployPlatformFailures
        exp_alerts:
          - exp_labels: { severity: warning, component: pipeline, tenancy: platform }
            exp_annotations:
              summary: "4 runner deploys failed for a platform reason in 30 minutes"
              description: "Deploys through pipeline runners are failing with platform-class codes (DEPLOY_GRANT_REJECTED, DEPLOY_GRANT_EXPIRED, PIPELINE_FETCH_FAILED, or a delivery that never reached the runner). Check the pipeline service logs for 'runner-deploys', the runner-dispatch queue, the deploy facade (/api/pipelines/runner/deploys/...) reachability from runner accounts, and the build queue time behind DEPLOY_GRANT_EXPIRED."

  # A deploy running past its deadline for 10 minutes warns (max across a
  # leader handover); a blip the sweep clears does not.
  - interval: 1m
    input_series:
      - series: 'pipeline_runner_deploys_overdue{service="pipeline",pod="pipeline-a"}'
        values: '0x5 1x30'
      - series: 'pipeline_runner_deploys_overdue{service="pipeline",pod="pipeline-b"}'
        values: '_x10 1x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: RunnerDeployStuck
        exp_alerts: []
      - eval_time: 20m
        alertname: RunnerDeployStuck
        exp_alerts:
          - exp_labels: { severity: warning, component: pipeline, tenancy: platform }
            exp_annotations:
              summary: "1 runner deploy(s) are running past their deadline"
              description: "At least one deploy or undeploy through a runner has been running past its deadline for 10 minutes, so the runner sweep is not finishing it (deploy_cancel + DEPLOY_TIMED_OUT). Check that the runner sweep is running (its leader lock, the pipeline service logs for 'Runner deploy poll'), and the database the sweep writes to."
  - interval: 1m
    input_series:
      - series: 'pipeline_runner_deploys_overdue{service="pipeline",pod="pipeline-a"}'
        values: '0x5 1x3 0x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: RunnerDeployStuck
        exp_alerts: []

  # FrontendWebVitalsPoor: real users' p75 LCP on a page above 4s (the web.dev
  # "poor" line, a bucket boundary) for 30m, over at least 20 loads in the
  # window. Case 1: every load ~5s, one a minute -> fires, labelled by route.
  - interval: 1m
    input_series:
      - series: 'frontend_web_vitals_bucket{metric="LCP",route="/dashboard",rating="poor",le="2.5",service="ops-center"}'
        values: '0x120'
      - series: 'frontend_web_vitals_bucket{metric="LCP",route="/dashboard",rating="poor",le="4",service="ops-center"}'
        values: '0x120'
      - series: 'frontend_web_vitals_bucket{metric="LCP",route="/dashboard",rating="poor",le="6",service="ops-center"}'
        values: '0+1x120'
      - series: 'frontend_web_vitals_bucket{metric="LCP",route="/dashboard",rating="poor",le="+Inf",service="ops-center"}'
        values: '0+1x120'
      - series: 'frontend_web_vitals_count{metric="LCP",route="/dashboard",rating="poor",service="ops-center"}'
        values: '0+1x120'
    alert_rule_test:
      - eval_time: 45m
        alertname: FrontendWebVitalsPoor
        exp_alerts: []
      - eval_time: 90m
        alertname: FrontendWebVitalsPoor
        exp_alerts:
          - exp_labels: { severity: info, component: frontend, tenancy: platform, route: /dashboard }
            exp_annotations:
              summary: "Real users wait over 4s for the largest paint on /dashboard"
              description: "The 75th-percentile Largest Contentful Paint reported by browsers for /dashboard has been above 4s (web.dev's \"poor\" line) for 30 minutes, over at least 20 page loads. Compare frontend_web_vitals TTFB for the same route: a slow TTFB points at the server/API, a fast one at the page's own JS and rendering (check the bundle budget in frontend/bundle-budgets.json)."
  # Case 2: the same traffic at ~1.5s is healthy -> quiet.
  - interval: 1m
    input_series:
      - series: 'frontend_web_vitals_bucket{metric="LCP",route="/dashboard",rating="good",le="1.8",service="ops-center"}'
        values: '0+1x120'
      - series: 'frontend_web_vitals_bucket{metric="LCP",route="/dashboard",rating="good",le="4",service="ops-center"}'
        values: '0+1x120'
      - series: 'frontend_web_vitals_bucket{metric="LCP",route="/dashboard",rating="good",le="+Inf",service="ops-center"}'
        values: '0+1x120'
      - series: 'frontend_web_vitals_count{metric="LCP",route="/dashboard",rating="good",service="ops-center"}'
        values: '0+1x120'
    alert_rule_test:
      - eval_time: 90m
        alertname: FrontendWebVitalsPoor
        exp_alerts: []
  # Case 3: slow, but one load every two minutes (15 in 30m) is too thin to page on -> quiet.
  - interval: 1m
    input_series:
      - series: 'frontend_web_vitals_bucket{metric="LCP",route="/login",rating="poor",le="4",service="ops-center"}'
        values: '0x120'
      - series: 'frontend_web_vitals_bucket{metric="LCP",route="/login",rating="poor",le="6",service="ops-center"}'
        values: '0+0.5x120'
      - series: 'frontend_web_vitals_bucket{metric="LCP",route="/login",rating="poor",le="+Inf",service="ops-center"}'
        values: '0+0.5x120'
      - series: 'frontend_web_vitals_count{metric="LCP",route="/login",rating="poor",service="ops-center"}'
        values: '0+0.5x120'
    alert_rule_test:
      - eval_time: 90m
        alertname: FrontendWebVitalsPoor
        exp_alerts: []

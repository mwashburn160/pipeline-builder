# promtool unit tests for the docker target's alert rules.
#
#   docker run --rm -v "$PWD:/t:ro" --entrypoint promtool prom/prometheus:v3.15.0 \
#     test rules /t/alert-rules.test.yml
#
#   (or `deploy/bin/validate-configs.sh`, which runs every target's suite against
#    the PINNED image.)
#
# The full suite lives in deploy/local/minikube/config/prometheus/alert-rules.test.yml
# and covers the three Kubernetes targets, whose rule files are byte-identical.
# Docker's file is that set minus the Kubernetes-only rules
# (test/deploy-contracts/test/prometheus-contract.test.ts), so only cases for
# rules docker evaluates differently, or that are new and must be proven HERE
# too, belong in this file.

rule_files:
  - alert-rules.yml
evaluation_interval: 1m
tests:
  # --- Nightly plugin CVE remediation -----------------------------------------
  # PluginRemediationErrors: one remediation that ended in an error fires (no
  # for:, a job error is rare and each one is worth a look) ...
  - interval: 1m
    input_series:
      - series: 'plugin_remediations_total{stage="failed",outcome="error",service="plugin",pod="plugin-aaa"}'
        values: '0x10 1x30'
      - series: 'plugin_remediations_total{stage="done",outcome="cleared",service="plugin",pod="plugin-aaa"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: PluginRemediationErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              component: plugin
              tenancy: platform
            exp_annotations:
              summary: "1 plugin remediations failed with an error in 6h"
              description: "Plugins → Remediations, filter Failed: each row's error is a short code. SOURCE_CHECKSUM_MISMATCH means a kept build source in the plugin-sources bucket changed under its pointer — treat it as tampering until the object's history says otherwise, and never retry it blind. Anything else is usually the build queue or buildkit; the next rescan does not retry a failed findings set until the findings change, so retry it from the card once fixed."

  # ... while cleared, needs-owner and rejected outcomes never do: "could not
  # fix" goes to the owner (N39), it is not an operator problem.
  - interval: 1m
    input_series:
      - series: 'plugin_remediations_total{stage="failed",outcome="error",service="plugin",pod="plugin-aaa"}'
        values: '0+0x40'
      - series: 'plugin_remediations_total{stage="done",outcome="cleared",service="plugin",pod="plugin-aaa"}'
        values: '0+1x40'
      - series: 'plugin_remediations_total{stage="needs_owner",outcome="owner_request",service="plugin",pod="plugin-aaa"}'
        values: '0+1x40'
      - series: 'plugin_remediations_total{stage="failed",outcome="rejected",service="plugin",pod="plugin-aaa"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: PluginRemediationErrors
        exp_alerts: []

  # PluginRemediationRolloutStartFailing: one given-up rollout start fires,
  # per reason ...
  - interval: 1m
    input_series:
      - series: 'plugin_remediation_rollout_start_failures_total{reason="exhausted",service="plugin",pod="plugin-aaa"}'
        values: '0x10 1x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: PluginRemediationRolloutStartFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              component: plugin
              tenancy: platform
              reason: exhausted
            exp_annotations:
              summary: "1 plugin remediation rollouts did not start (exhausted) in 6h"
              description: "Plugins → Remediations: the Published rows reading \"Rollout didn't start\". permanent = the pipeline service refused the start request (check the plugin log 'Remediation rollout not started' for the status, and pipeline's internal route and service-auth config); exhausted = the pipeline service stayed unavailable or overloaded across 5 nightly passes. Once fixed, Retry on each card restarts its rollout."

  # ... and a quiet counter does not.
  - interval: 1m
    input_series:
      - series: 'plugin_remediation_rollout_start_failures_total{reason="permanent",service="plugin",pod="plugin-aaa"}'
        values: '0+0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: PluginRemediationRolloutStartFailing
        exp_alerts: []

  # PluginSourceDeleteFailing: per kind, so an image-delete failure is told
  # apart from a RustFS prefix failure.
  - interval: 1m
    input_series:
      - series: 'plugin_source_delete_failures_total{kind="prefix",service="plugin",pod="plugin-aaa"}'
        values: '0x10 2x30'
      - series: 'plugin_source_delete_failures_total{kind="image",service="plugin",pod="plugin-aaa"}'
        values: '0+0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: PluginSourceDeleteFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              component: plugin
              tenancy: platform
              kind: prefix
            exp_annotations:
              summary: "Plugin prefix deletes are failing after a purge"
              description: "2 prefix deletes failed in 6h. Purged tenant sources or images are still stored until the orphan retry succeeds. kind=object|prefix: check the plugin service's RustFS key still reaches plugin-sources (rustfs-init policy plugin-sources-rw); kind=image: check image-registry's discardPluginImage."

  # A failure older than the 6h window (since retried by the sweep) is quiet.
  - interval: 10m
    input_series:
      - series: 'plugin_source_delete_failures_total{kind="object",service="plugin",pod="plugin-aaa"}'
        values: '0 1x60'
    alert_rule_test:
      - eval_time: 9h
        alertname: PluginSourceDeleteFailing
        exp_alerts: []

  # PluginSourcesMissing: a version found its kept source gone (after a restore).
  - interval: 1m
    input_series:
      - series: 'plugin_source_missing_total{service="plugin",pod="plugin-aaa"}'
        values: '0x10 3x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: PluginSourcesMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              component: plugin
              tenancy: platform
            exp_annotations:
              summary: "3 plugin versions lost their kept build source"
              description: "Their sources are gone from the plugin-sources bucket, so they can now only be fixed with an overlay layer (no library source patches, nothing for compiled Go/Rust/.NET/Java). Restore plugin-sources from the object-store mirror (restore.sh --object-store) if it was left out; a version marked source-less stays that way until its owner uploads a new version."
      - eval_time: 5m
        alertname: PluginSourcesMissing
        exp_alerts: []

  # ToolchainFixFailing: an approved toolchain release candidate did not fully publish.
  - interval: 1m
    input_series:
      - series: 'toolchain_fix_failures_total{stage="publish",service="plugin",pod="plugin-aaa"}'
        values: '0x10 1x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: ToolchainFixFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              component: plugin
              tenancy: platform
              stage: publish
            exp_annotations:
              summary: "Toolchain fixes: publish failed"
              description: "1 toolchain-fix publish failures in 6h. publish: an approved candidate stopped part-way; it keeps its progress and resumes under the same version — use Resume publish on the Toolchain console's Toolchain fixes card (the plugin service also resumes it within ~2 minutes) and check the plugin log for the error. keep_inputs: check the plugin service's RustFS key still writes plugin-sources (<systemOrgId>/toolchain-inputs/), then re-upload the release with load-plugins.sh so its Dockerfiles are kept."
      - eval_time: 5m
        alertname: ToolchainFixFailing
        exp_alerts: []

  # PluginSourceChecksumMismatch: a kept source no longer matches its SHA-256 (tampering).
  - interval: 1m
    input_series:
      - series: 'plugin_source_checksum_mismatch_total{service="plugin",pod="plugin-aaa"}'
        values: '0x10 1x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: PluginSourceChecksumMismatch
        exp_alerts:
          - exp_labels:
              severity: critical
              component: plugin
              tenancy: platform
            exp_annotations:
              summary: "1 kept plugin sources failed their checksum"
              description: "A kept build source in the plugin-sources bucket changed under its recorded SHA-256: treat it as tampering. Nothing was built from it (the remediation failed closed with SOURCE_CHECKSUM_MISMATCH). Check the bucket's access log for writes outside the plugin service's scoped key, rotate PLUGIN_S3_ACCESS_KEY_ID if in doubt, and never retry the remediation until the object's history is understood."
      - eval_time: 5m
        alertname: PluginSourceChecksumMismatch
        exp_alerts: []

  # PluginRemediationCanaryStale: the last clean canary pass was 49h ago ...
  - interval: 5m
    input_series:
      - series: 'plugin_remediation_canary_last_success_timestamp_seconds{service="plugin",pod="plugin-aaa"}'
        values: '0x600'
    alert_rule_test:
      - eval_time: 47h
        alertname: PluginRemediationCanaryStale
        exp_alerts: []
      - eval_time: 49h
        alertname: PluginRemediationCanaryStale
        exp_alerts:
          - exp_labels:
              severity: warning
              component: plugin
              tenancy: platform
            exp_annotations:
              summary: "The plugin remediation fixture canary has not passed in 48h"
              description: "Last clean canary pass 2d 1h 0m 0s ago. Open the system org's Remediations list (fixture plugins) or the Ecosystem console fleet view: the failing package type is the patcher or scanner to look at. PluginVulnRescanStale firing too means the rescan, not remediation, stopped."

  # ... while a canary that passes every night stays quiet, even when a
  # former leader's pod still exports an old timestamp (max() reads the newest).
  - interval: 5m
    input_series:
      - series: 'plugin_remediation_canary_last_success_timestamp_seconds{service="plugin",pod="plugin-new"}'
        values: '0x288 86400x288 172800x30'
      - series: 'plugin_remediation_canary_last_success_timestamp_seconds{service="plugin",pod="plugin-old"}'
        values: '0x600'
    alert_rule_test:
      - eval_time: 49h
        alertname: PluginRemediationCanaryStale
        exp_alerts: []

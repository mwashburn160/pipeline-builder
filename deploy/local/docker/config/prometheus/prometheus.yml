# Prometheus scrape configuration for Pipeline Builder services
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules — Prometheus evaluates these every `evaluation_interval` and
# forwards firing alerts to Alertmanager (configured below). See
# alert-rules.yml for the actual rule definitions.
rule_files:
  - /etc/prometheus/alert-rules.yml

# Wire Prometheus to the Alertmanager sidecar. The static target name is
# overridden per-environment (docker-compose service name in local, the
# Service DNS in k8s).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'platform'
    static_configs:
      - targets: ['platform:3000']

  - job_name: 'plugin'
    static_configs:
      - targets: ['plugin:3000']

  - job_name: 'pipeline'
    static_configs:
      - targets: ['pipeline:3000']

  - job_name: 'quota'
    static_configs:
      - targets: ['quota:3000']

  - job_name: 'billing'
    static_configs:
      - targets: ['billing:3000']

  - job_name: 'message'
    static_configs:
      - targets: ['message:3000']

  - job_name: 'reporting'
    static_configs:
      - targets: ['reporting:3000']

  - job_name: 'compliance'
    static_configs:
      - targets: ['compliance:3000']

  # `ask` exposes the same api-server /metrics on :3000 as the other services.
  # It was the one application service with no job here, so every ask-specific
  # rule (and every rule that matches on service= across the fleet) simply had
  # no series for it on this target.
  - job_name: 'ask'
    static_configs:
      - targets: ['ask:3000']

  # image-registry exposes the same api-server /metrics on :3000 as the other
  # services. Without this job, alert-rules.yml's RegistryErrorBurst (which
  # matches http_requests_total{service="image-registry"}) has no series to
  # evaluate and can never fire.
  - job_name: 'image-registry'
    static_configs:
      - targets: ['image-registry:3000']

  # Datastore exporters. On the k8s targets these are sidecars of the database
  # pod, discovered by the pod-annotation job; compose has no sidecars, so they
  # are standalone containers scraped explicitly. They are what gives
  # PostgresUnreachable / MongoDBUnreachable / RedisUnreachable (pg_up,
  # mongodb_up, redis_up) something to evaluate on this target.
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'mongodb-exporter'
    static_configs:
      - targets: ['mongodb-exporter:9216']

  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'nginx'
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ['nginx:8443']

# Alert rules for Pipeline Builder.
#
# Loaded by Prometheus via `rule_files` in prometheus.yml; firing alerts
# are forwarded to Alertmanager which routes by `severity` AND `tenancy`.
#
# Conventions:
# - `severity: critical` — pages on-call (Slack #ops-pager + future PD)
# - `severity: warning`  — non-paging Slack notification
# - `tenancy: org`       — alert carries an `org_id` label; relayed to that
#                          org's configured destinations (Slack webhook,
#                          in-app message, …) via the platform's webhook
#                          relay (POST /api/observability/alert-webhook).
# - `tenancy: platform`  — alert is platform-wide (no org_id, or the
#                          underlying metric isn't org-labeled); routed
#                          to the ops-team Slack channels.
# - `summary` is what shows in Slack; `description` adds detail.

groups:
  # Per-org rules — every firing alert carries an `org_id` label and is routed
  # to that org's notification destination(s) by the platform's alert-relay.
  # These rules `by (org_id)` the underlying counters; the receiver-side
  # alertmanager.yml uses `tenancy=org` to differentiate from platform alerts.
  - name: per-org
    rules:
      # operational follow-on: per-tenant Loki rate-cap breach.
      # Fires when Loki's distributor rejects log lines for a tenant
      # because they exceed the tenant's `ingestion_rate_mb` cap (set
      # via the `limits_config` block in loki-config.yml). Operators
      # should bump the limit before users notice missing logs. The
      # `tenant` label maps to the org's
      # uuid (set via promtail's `tenant` stage / fluent-bit's
      # `Tenant_ID_Key`); `org_id` is set equal to it via `label_replace`
      # so the per-org routing in alertmanager picks it up the same way
      # as the build-failure alert.
      - alert: LokiRateCapBreach
        expr: |
          label_replace(
            sum by (tenant) (rate(loki_discarded_samples_total{reason="rate_limited", tenant!="system"}[5m])) > 0,
            "org_id", "$1", "tenant", "(.+)"
          )
        for: 5m
        labels:
          severity: warning
          component: loki
          tenancy: org
        annotations:
          summary: "Loki dropping logs for org {{ $labels.org_id }} (rate cap breached)"
          description: "Loki rejected {{ $value | humanize }} lines/sec for the last 5 minutes. Bump the org's `ingestion_rate_mb` in loki-config.yml `limits_config`."

      - alert: PluginBuildFailureRateHigh
        # Per-org success-rate aggregation. `by (org_id)` produces one
        # series per org; alerts fire per org and carry that org_id label
        # which the relay routes on.
        #
        # The ratio is (successes / total) with the DENOMINATOR filtered to
        # non-zero (`> 0`) — never clamped to a floor of 1: a per-second rate is
        # almost always < 1, so clamping it turned a healthy low-volume org (one
        # successful build every few minutes) into a ~0% "success rate" that
        # paged. Successes are `or`-ed with 0 so an org whose builds ALL fail
        # still produces a series. The activity floor (>= 3 builds in the
        # window) keeps a single failure from reading as a 0% success rate.
        # Proven by the promtool cases in alert-rules.test.yml.
        expr: |
          (
            (
              sum by (org_id) (rate(plugin_builds_total{status="success",org_id=~".+"}[5m]))
              or
              sum by (org_id) (rate(plugin_builds_total{org_id=~".+"}[5m])) * 0
            )
            /
            (sum by (org_id) (rate(plugin_builds_total{org_id=~".+"}[5m])) > 0)
          ) < 0.9
          and
          sum by (org_id) (increase(plugin_builds_total{org_id=~".+"}[5m])) >= 3
        for: 10m
        labels:
          severity: warning
          component: plugin
          tenancy: org
        annotations:
          summary: "Plugin build success rate below 90% for org {{ $labels.org_id }}"
          description: "5-min success rate is {{ $value | humanizePercentage }} over the last 10 minutes."

      # ---- Pipeline deploy / stage failures (DORA events, Phase 3b) ----
      # Fed by the reporting service's ingest metrics (scraped from the
      # reporting pod). `pipeline_deploy_result_total` is incremented per
      # deploy-stage execution the forwarder marks with an `environment`
      # (derived from the pipeline's `pb.deploys` tag); `result` is
      # succeeded|failed. `pipeline_stage_result_total` is the same, one
      # series per (pipeline, stage, environment).
      - alert: PipelineDeployFailed
        # A `production` deploy stage failed. This is the DORA headline signal
        # (deploy-time change failure), so it pages rather than warns. `increase`
        # over 5m fires on any new failure; `by (org_id)` routes to the org and
        # keeps one series per tenant.
        expr: |
          sum by (org_id) (increase(pipeline_deploy_result_total{environment="production",result="failed",org_id=~".+"}[5m])) > 0
        for: 0m
        labels:
          severity: critical
          component: pipeline
          tenancy: org
        annotations:
          summary: "Production deploy failed for org {{ $labels.org_id }}"
          description: "{{ $value | humanize }} production deploy-stage failure(s) in the last 5 minutes. Check the pipeline's deploy stage in CodePipeline."

      - alert: PipelineStageFailureRateHigh
        # Per-org stage success-rate aggregation across ALL stages (not just
        # deploys), mirroring PluginBuildFailureRateHigh. `by (org_id)` produces
        # one series per org; alerts fire per org and carry that org_id for
        # relay routing. Warns rather than pages — a broad-but-not-outage signal.
        # Same ratio shape as PluginBuildFailureRateHigh (non-zero denominator,
        # successes `or` 0, >= 3 stage results as the activity floor).
        expr: |
          (
            (
              sum by (org_id) (rate(pipeline_stage_result_total{result="succeeded",org_id=~".+"}[5m]))
              or
              sum by (org_id) (rate(pipeline_stage_result_total{org_id=~".+"}[5m])) * 0
            )
            /
            (sum by (org_id) (rate(pipeline_stage_result_total{org_id=~".+"}[5m])) > 0)
          ) < 0.9
          and
          sum by (org_id) (increase(pipeline_stage_result_total{org_id=~".+"}[5m])) >= 3
        for: 10m
        labels:
          severity: warning
          component: pipeline
          tenancy: org
        annotations:
          summary: "Pipeline stage success rate below 90% for org {{ $labels.org_id }}"
          description: "5-min stage success rate is {{ $value | humanizePercentage }} over the last 10 minutes — inspect recent pipeline executions."

  # Platform-wide rules — metrics that aren't org-labeled (shared queue,
  # shared registry). Routed to the ops-team Slack channels.
  - name: platform-wide
    rules:
      # ---- Liveness ----
      # The blind spot every other rule shares: they all need the service to be
      # UP ENOUGH to emit the metric they alert on. ServiceError5xxBurst needs it
      # serving 5xx; QuotaServiceFailOpenSustained needs it reporting fail-opens.
      # A container that is restart-looping, OOM-killed, hung, or unreachable
      # emits nothing at all — and so tripped nothing at all until this rule
      # existed.
      #
      # SCOPE, stated honestly: `up == 0` means "the scrape of a CONFIGURED
      # target failed". On this target the targets are static (prometheus.yml),
      # so unlike the k8s targets a removed container still has its series and
      # still alerts — but a service never listed there is still invisible.
      #
      # Prometheus cannot alert on its own death either. If that matters, pair
      # this with an always-firing watchdog alert and an external check on
      # Alertmanager, so silence itself becomes a signal.
      - alert: ServiceDown
        expr: up == 0
        for: 5m
        labels:
          severity: critical
          component: platform
          tenancy: platform
        annotations:
          summary: "{{ $labels.job }} is not responding to scrapes"
          description: "Prometheus has failed to scrape {{ $labels.job }} ({{ $labels.instance }}) for 5m. The target is configured but unreachable — restart loop, OOM, or a hung process. Check: docker compose ps && docker compose logs {{ $labels.job }}"

      # ---- Gateway (nginx) ----
      # From nginx/metrics.js: real per-route counters recorded at log time
      # (nginx_http_requests_total{service,status_class} and the
      # nginx_http_request_duration_seconds histogram). These see what CLIENTS
      # see — including 502/504s the upstream never logged because it was down.
      # Same ratio discipline as the per-org rules: non-zero denominator plus an
      # activity floor, so a quiet gateway with one bad request stays quiet.
      - alert: GatewayError5xxRatioHigh
        expr: |
          (
            sum(rate(nginx_http_requests_total{status_class="5xx"}[5m]))
            /
            (sum(rate(nginx_http_requests_total[5m])) > 0)
          ) > 0.05
          and
          sum(increase(nginx_http_requests_total[5m])) >= 20
        for: 5m
        labels:
          severity: critical
          component: nginx
          tenancy: platform
        annotations:
          summary: "Gateway 5xx ratio above 5%"
          description: "{{ $value | humanizePercentage }} of requests through nginx returned 5xx over the last 5 minutes. Break it down by route: sum by (service) (rate(nginx_http_requests_total{status_class=\"5xx\"}[5m]))."

      - alert: GatewayLatencyHigh
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(nginx_http_request_duration_seconds_bucket{service!~"ws|plugin-logs|registry-v2|metrics"}[5m]))) > 2
          and
          sum(increase(nginx_http_request_duration_seconds_count{service!~"ws|plugin-logs|registry-v2|metrics"}[5m])) >= 20
        for: 10m
        labels:
          severity: warning
          component: nginx
          tenancy: platform
        annotations:
          summary: "Gateway p95 latency above 2s"
          description: "p95 request latency through nginx is {{ $value | humanizeDuration }} (excluding websocket, build-log stream and registry blob routes)."

      # ---- Datastores ----
      # These complement ServiceDown rather than duplicating it. ServiceDown
      # fires when the scrape itself fails (container gone/hung). These fire when
      # the exporter is HEALTHY AND REPORTING but cannot reach the datastore
      # behind it — a hung or wedged database in a running container, a rejected
      # credential, or a filled disk. From the outside those look identical to
      # healthy; `up` is 1 the whole time.
      #
      # Metric names verified against the exporter binaries themselves rather
      # than assumed from docs: pg_up, mongodb_up and redis_up are what
      # postgres-exporter v0.17.1, mongodb_exporter 0.44.0 and redis_exporter
      # v1.69.0 actually emit when their target is unreachable. The exporters are
      # standalone containers here (the k8s targets run them as sidecars) — see
      # docker-compose.yml and the scrape jobs in prometheus.yml.
      - alert: PostgresUnreachable
        expr: pg_up == 0
        for: 3m
        labels:
          severity: critical
          component: postgres
          tenancy: platform
        annotations:
          summary: "Postgres is not answering its exporter"
          description: "postgres-exporter has been unable to query Postgres for 3m while its own container is healthy. Postgres is the single-primary data tier — every service loses writes. Check: docker compose logs postgres"

      - alert: MongoDBUnreachable
        expr: mongodb_up == 0
        for: 3m
        labels:
          severity: critical
          component: mongodb
          tenancy: platform
        annotations:
          summary: "MongoDB is not answering its exporter"
          description: "mongodb-exporter has been unable to query MongoDB for 3m. Audit, billing and quota records are unavailable. Check: docker compose logs mongodb"

      - alert: RedisUnreachable
        expr: redis_up == 0
        for: 3m
        labels:
          severity: critical
          component: redis
          tenancy: platform
        annotations:
          summary: "Redis is not answering its exporter"
          description: "redis-exporter cannot reach Redis for 3m. This target runs a SINGLE Redis with no Sentinel, so there is no failover — BullMQ plugin builds and the audit spool both stop. Check: docker compose logs redis"

      # ---- Queue ----
      - alert: PluginQueueStalled
        expr: sum(plugin_queue_jobs{state="waiting"}) > 50
        for: 15m
        labels:
          severity: warning
          component: plugin
          tenancy: platform
        annotations:
          summary: "Plugin build queue depth above 50"
          description: "{{ $value }} jobs waiting for 15+ minutes — check worker health."

      - alert: PluginVulnRescanStale
        # The nightly vulnerability rescan exports the epoch of its last
        # COMPLETED pass from every plugin pod. Stale for 36h ⇒ passes are failing
        # (usually the grype DB refresh) or the leader-locked scheduler stopped,
        # and scan facts compliance evaluates are going out of date. Absent when
        # PLUGIN_RESCAN_ENABLED=false, so nothing fires then.
        expr: (time() - max(plugin_vuln_rescan_last_completed_timestamp_seconds)) > 129600
        for: 30m
        labels:
          severity: warning
          component: plugin
          tenancy: platform
        annotations:
          summary: "Plugin vulnerability rescan has not completed in 36h"
          description: "Last completed pass {{ $value | humanizeDuration }} ago — check the plugin service's vuln-rescan logs and grype DB updates."

      - alert: PluginQueueProcessingSlow
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(plugin_job_wait_seconds_bucket[5m]))
          ) > 300
        for: 10m
        labels:
          severity: warning
          component: plugin
          tenancy: platform
        annotations:
          summary: "Plugin queue p95 wait > 5 minutes"
          description: "p95 job wait is {{ $value | humanizeDuration }}; consider scaling workers."

      - alert: DLQFilling
        expr: sum(plugin_queue_jobs{queue="plugin-build-dlq"}) > 10
        for: 5m
        labels:
          severity: critical
          component: plugin
          tenancy: platform
        annotations:
          summary: "Dead-letter queue has more than 10 jobs"
          description: "{{ $value }} jobs in the DLQ — these failed all retries and need triage."

      # ---- Plugin ecosystem ----
      # The gauges are sampled by EVERY plugin replica (a plain scheduler, no
      # leader lock), so `max()` reads the current value whichever pod was
      # scraped. N22 emails the Ecosystem Managers once per breached request;
      # these rules are the paging half. Runbook: docs/runbooks/ecosystem-moderation.md.
      - alert: EcosystemSecurityLaneSLABreach
        # Security-fix lane (a version or yank linked to an advisory): 4-hour SLA.
        expr: max(ecosystem_requests_sla_breached{lane="security"}) > 0
        for: 5m
        labels:
          severity: critical
          component: plugin-ecosystem
          tenancy: platform
        annotations:
          summary: "Security-fix publish request past its 4h moderation SLA"
          description: "{{ $value }} security-lane request(s) have waited more than 4 hours for an Ecosystem Manager. Installers stay on the vulnerable version until one is decided — open the Ecosystem console's queue (security lane first)."

      - alert: EcosystemStandardLaneSLABreach
        # Standard lane: 2 business days (48h).
        expr: max(ecosystem_requests_sla_breached{lane="standard"}) > 0
        for: 30m
        labels:
          severity: warning
          component: plugin-ecosystem
          tenancy: platform
        annotations:
          summary: "Publish requests past the 48h moderation SLA"
          description: "{{ $value }} standard-lane request(s) are older than 48 hours. Check the queue and the approver headcount (two-person requests need two different managers)."

      - alert: EcosystemResignFailures
        # A failed re-sign leaves an image with a stale trust annotation; the job
        # resumes on the next 15-minute pass, so a single blip self-heals.
        expr: sum(increase(ecosystem_resign_failures_total[1h])) > 3
        for: 15m
        labels:
          severity: warning
          component: plugin-ecosystem
          tenancy: platform
        annotations:
          summary: "Plugin image re-signs are failing"
          description: "{{ $value | humanize }} re-sign failures in the last hour. The plugin service's ecosystem-resign logs name the image; usually image-registry or its signing key is unhealthy."

      - alert: EcosystemResignStalled
        # Jobs queued but no image re-signed for 2h: the leader-locked
        # maintenance scheduler stopped, or every attempt fails.
        expr: max(ecosystem_resign_jobs_pending) > 0 and on() (sum(increase(ecosystem_resign_images_total[2h])) or on() vector(0)) == 0
        for: 30m
        labels:
          severity: warning
          component: plugin-ecosystem
          tenancy: platform
        annotations:
          summary: "Plugin re-sign job stalled"
          description: "Re-sign jobs are queued but nothing was re-signed in 2h, so tier or suspension changes are not yet reflected in image annotations. Check the ecosystem-maintenance scheduler and image-registry."

      - alert: EcosystemApproverShortage
        # Two-person approval needs two different approvers; below that a
        # superadmin must act as the second one on every such request.
        expr: max(ecosystem_approvers{permission="plugins:moderate",kind="holders"}) < 2
        for: 1h
        labels:
          severity: warning
          component: plugin-ecosystem
          tenancy: platform
        annotations:
          summary: "Fewer than 2 Ecosystem Managers"
          description: "Only {{ $value }} system-org member(s) hold plugins:moderate. Plan for at least 3 (two-person approval plus holiday cover); a superadmin assigns the Ecosystem Manager role on the console's Ecosystem Managers tab."

      - alert: EcosystemNotificationsDropped
        # A queued ecosystem notice was given up on after its retries (the
        # in-app copy may still have been delivered).
        expr: sum(increase(ecosystem_notification_dropped_total[1h])) > 0
        for: 5m
        labels:
          severity: warning
          component: plugin-ecosystem
          tenancy: platform
        annotations:
          summary: "Plugin-ecosystem notices are being dropped"
          description: "{{ $value | humanize }} queued ecosystem notice(s) dropped in the last hour after repeated relay failures. Check platform's /internal/notify-email and SMTP."

      # ---- A token or notification from the wrong tenant/world ----
      # Both providers verify authenticity (Stripe signs its webhooks, SNS messages
      # come from an allow-listed topic) — authenticity is not the same as "meant for
      # this install". These two fire when a verified message belongs somewhere else,
      # which in practice means a configuration mix-up: a seller account listing more
      # than one product, or a deploy half-swapped onto test credentials. Both refuse
      # the message, so firing means something was rejected, not accepted.
      - alert: BillingMarketplaceProductCodeMismatch
        expr: sum by (source) (increase(billing_marketplace_product_code_mismatch_total[1h])) > 0
        for: 0m
        labels:
          severity: warning
          component: billing
          tenancy: platform
        annotations:
          summary: "Marketplace message for a different product was refused ({{ $labels.source }})"
          description: "{{ $value | humanize }} registration token(s) or SNS notification(s) in the last hour carried a product code other than AWS_MARKETPLACE_PRODUCT_CODE and were refused. source=resolve is a customer landing on the fulfillment URL with a sibling product's token; source=sns means an ARN in AWS_MARKETPLACE_SNS_TOPIC_ARN belongs to another product. Check the listing and the configured product code."

      # The fulfillment URL is an EXTERNAL contract: it lives in the AWS listing,
      # not in this repo, so a wrong path or a wrong product code cannot be caught
      # by any test here — only by a buyer failing to sign up. Every exit of the
      # resolve route is counted, success included, because the failure mode is
      # silence and a failure-only counter cannot tell "nobody bought" apart from
      # "everybody was turned away".
      # The vulnerability floor is the platform's hard gate on plugin images, and
      # PLUGIN_VULN_WAIVERS is the only thing that can make it pass anyway. An
      # exemption is meant to be temporary and narrow, so both of its failure
      # modes are worth waking up for: one that is silently doing nothing, and
      # one that is about to lapse under a deploy nobody has planned.
      - alert: PluginVulnWaiverInvalid
        expr: plugin_vuln_waivers_invalid > 0
        for: 10m
        labels:
          severity: warning
          component: plugin
          tenancy: platform
        annotations:
          summary: "{{ $value }} PLUGIN_VULN_WAIVERS entr(ies) are malformed and being ignored"
          description: "The parser drops an entry it cannot read rather than treating it as a wildcard, so the gate is still blocking for those plugins — but nothing in the build output says why, which is how this is usually discovered hours later. The plugin service logged each one at boot with the reason; grammar is <plugin>[@<version>]:<YYYY-MM-DD>:<package>[,<package>…]."

      - alert: PluginVulnWaiverExpiringSoon
        expr: plugin_vuln_waiver_days_remaining < 14
        for: 1h
        labels:
          severity: warning
          component: plugin
          tenancy: platform
        annotations:
          summary: "Vulnerability waiver for {{ $labels.plugin }} expires in {{ $value }} day(s)"
          description: "Expiry is deliberate — a waiver nobody revisits would otherwise be permanent — but the first sign is a build that used to pass starting to fail PLUGIN_VULN_GATE. Check whether upstream has shipped a fix: if it has, DELETE the entry and rebuild the plugin rather than extending it. A negative value means the entry has already lapsed and is doing nothing."

      - alert: BillingMarketplaceResolveFailing
        expr: sum by (result) (increase(billing_marketplace_resolve_total{result=~"no-token|not-configured|unknown-plan|error"}[1h])) > 0
        for: 0m
        labels:
          severity: warning
          component: billing
          tenancy: platform
        annotations:
          summary: "AWS Marketplace registration is failing (result={{ $labels.result }})"
          description: "{{ $value | humanize }} registration attempt(s) in the last hour ended in `{{ $labels.result }}` — a customer who has ALREADY PAID could not finish signing up, and the registration token is single-use and short-lived, so they must restart from AWS. no-token = something reached the resolve route without a token, which usually means the listing's fulfillment URL is not https://<domain>/marketplace/register. not-configured = BILLING_PROVIDER / AWS_MARKETPLACE_PRODUCT_CODE are unset on this deploy. unknown-plan = AWS_MARKETPLACE_DIMENSION_MAP points at a plan id that does not exist or is inactive. error = the AWS call or the database failed; see the billing logs."

      - alert: BillingStripeLivemodeMismatch
        expr: sum by (event_mode) (increase(billing_stripe_livemode_mismatch_total[1h])) > 0
        for: 0m
        labels:
          severity: warning
          component: billing
          tenancy: platform
        annotations:
          summary: "Stripe {{ $labels.event_mode }}-mode events are arriving at a key of the other mode"
          description: "{{ $value | humanize }} Stripe event(s) in the last hour passed signature verification but came from the other Stripe world and were refused. The deployment is half-configured: STRIPE_SECRET_KEY and the webhook endpoint belong to different modes. Until it is fixed no lifecycle event reconciles — subscriptions, payments and cancellations all stop updating."

      # ---- A provider that was never fully configured ----
      # validate-provider-config.ts checks these at boot and used to only warn. Several
      # of them leave the provider NON-FUNCTIONAL — no Stripe webhook secret means no
      # lifecycle event ever reconciles; no SNS topics mean no entitlement change ever
      # arrives — and a single startup log line in a container is not something anyone
      # reads. The gauge is written as 0 AND 1, so `> 0` is unambiguous and a missing
      # series means the check never ran rather than "all clear".
      - alert: BillingProviderConfigIncomplete
        expr: max by (provider, reason) (billing_provider_config_incomplete) > 0
        for: 15m
        labels:
          severity: warning
          component: billing
          tenancy: platform
        annotations:
          summary: "Billing provider {{ $labels.provider }} is misconfigured ({{ $labels.reason }})"
          description: "The billing service booted with an incomplete {{ $labels.provider }} configuration: {{ $labels.reason }}. Depending on the reason this means lifecycle webhooks are rejected, entitlement changes never arrive, or a plan/add-on cannot be charged. See docs/billing-providers.md and the startup log of the billing pod."

      # ---- Notifications that never reached the organization ----
      # The dropped-after-retries case above is watched; these three are the paths
      # that fail OUTRIGHT, and none of them was. They are invisible by nature: the
      # org simply never hears anything, which is indistinguishable from "nothing
      # happened". AlertRelayDeliveryFailing is the worst of the three — it is the
      # relay every other org-facing alert goes through, so when it breaks the
      # failure mode is silence everywhere.
      - alert: AlertRelayDeliveryFailing
        expr: sum by (channel) (increase(alert_notification_delivery{result="failed"}[1h])) > 0
        for: 0m
        labels:
          severity: warning
          component: platform
          tenancy: platform
        annotations:
          summary: "Alert delivery to organizations is failing (channel={{ $labels.channel }})"
          description: "{{ $value | humanize }} alert notification(s) failed to deliver over {{ $labels.channel }} in the last hour — an unknown destination channel, or the channel's transport returning not-ok. Every org-facing alert routes through this relay, so while it fails the orgs are simply not being told anything. Check the destination's configuration and platform/src/services/alert-relay.ts logs."

      - alert: EcosystemNotificationFailing
        expr: sum by (event) (increase(ecosystem_notification_failed_total{event!~"N21|N22"}[1h])) > 0
        for: 0m
        labels:
          severity: warning
          component: plugin-ecosystem
          tenancy: platform
        annotations:
          summary: "Plugin-ecosystem notice failed to send (event={{ $labels.event }})"
          description: "{{ $value | humanize }} ecosystem notice(s) of type {{ $labels.event }} failed to ENQUEUE in the last hour, so they never entered the retry queue and EcosystemNotificationsDropped can never see them — the org is told nothing, ever. N21 (advisories) and N22 (SLA breach) are excluded on purpose: both are recomputed and re-enqueued by a later pass, and their terminal case IS covered by EcosystemNotificationsDropped."

      - alert: PluginSecurityWebhookFailing
        expr: sum by (event) (increase(plugin_security_webhooks_total{outcome="failed"}[1h])) > 0
        for: 0m
        labels:
          severity: warning
          component: plugin
          tenancy: platform
        annotations:
          summary: "Plugin security webhook delivery failing (event={{ $labels.event }})"
          description: "{{ $value | humanize }} plugin security webhook(s) failed in the last hour. These carry vulnerability notices (N30/N31) to an org's own endpoint, so a subscriber is not learning that a plugin they run is flagged. The email/in-app path is alerted separately by plugin_security_notification_failed_total; this is the webhook leg."

      # ---- Seat cap pushed below the members already using it ----
      # organization-internal.ts deliberately does NOT block this write — billing is
      # authoritative and gates the downgrade caller-side — but a cap below current
      # pooled usage means that caller-side gate regressed and members are stranded.
      # The code logs and counts it "instead of silent"; this is the half that pages.
      - alert: PlatformSeatLimitBelowUsage
        expr: sum(increase(platform_seat_limit_below_usage_total[1h])) > 0
        for: 0m
        labels:
          severity: warning
          component: platform
          tenancy: platform
        annotations:
          summary: "A seat limit was set below the seats already in use"
          description: "{{ $value | humanize }} org(s) in the last hour had a seat cap pushed below their current pooled usage, so existing members are over the limit and may be stranded. Billing gates this caller-side, so it firing means that gate regressed — reconcile the org's seat entitlement against its membership."

      # ---- Work that stopped happening, rather than failed ----
      # A counter only moves when something goes wrong; a scheduler that has simply
      # STOPPED emits nothing at all, so no `_failed_total` rule can ever fire for
      # it. The repo has exactly two heartbeat metrics for this and only one was
      # watched — PluginVulnRescanStale above. This is its twin.
      - alert: EcosystemStatsSweepStale
        # api/plugin ecosystem/stats.ts stamps this at the END of each sweep, every
        # STATS_INTERVAL_MS (15m), leader-locked across the plugin pods. Stale for 2h
        # is eight missed sweeps: the leader-locked scheduler stopped, or every sweep
        # is throwing. Ecosystem catalog counts then quietly serve stale numbers.
        # Unlike the vuln rescan there is no enable flag, so this should always tick.
        expr: (time() - max(ecosystem_stats_last_sweep_timestamp_seconds)) > 7200
        for: 30m
        labels:
          severity: warning
          component: plugin-ecosystem
          tenancy: platform
        annotations:
          summary: "Plugin-ecosystem stats sweep has not completed in 2h"
          description: "Last completed sweep {{ $value | humanizeDuration }} ago against a 15m interval — check the plugin service's ecosystem-stats scheduler and its leader lock."

      # ---- Dead-man's switch ----
      # ServiceDown's comment states the limit honestly: every other rule needs the
      # service up enough to emit the metric it alerts on, and "Prometheus cannot
      # alert on its own death either... pair this with an always-firing watchdog
      # alert and an external check on Alertmanager, so silence itself becomes a
      # signal." This is that watchdog.
      #
      # It fires permanently and ON PURPOSE. `severity: none` matches none of the
      # severity routes and `tenancy: platform` keeps it away from the org relay, so
      # it lands in the `default` receiver — logged, paging nobody.
      #
      # IT IS INERT UNTIL YOU WIRE THE OTHER HALF: point an external dead-man's-switch
      # (healthchecks.io, Better Stack, a Lambda — anything that alarms when a ping
      # STOPS) at a receiver matched to this alert. Until then it only proves the
      # rule evaluator is alive when you look at it, which is not the same as being
      # told when it isn't.
      - alert: Watchdog
        expr: vector(1)
        for: 0m
        labels:
          severity: none
          component: platform
          tenancy: platform
        annotations:
          summary: "Alerting pipeline is alive (always firing, by design)"
          description: "This alert always fires. Its absence means Prometheus rule evaluation or Alertmanager delivery has stopped, and that no other alert can be trusted to arrive. Wire an external dead-man's-switch to a receiver matched on alertname=Watchdog; if it is not wired, this alert does nothing."

      # ---- Anonymous plugin submissions ----
      # Metrics from api/plugin: plugin_submission_backlog (gauge: submissions in
      # pending_review), plugin_submission_gate_failures_total{gate}. The 2-business-
      # day moderation SLA for the `submission` request kind is already paged by
      # EcosystemStandardLaneSLABreach; these catch VOLUME and ABUSE.
      - alert: SubmissionBacklogHigh
        expr: max(plugin_submission_backlog) > 25
        for: 1h
        labels:
          severity: warning
          component: plugin-ecosystem
          tenancy: platform
        annotations:
          summary: "Anonymous submission backlog is high"
          description: "{{ $value }} anonymous plugin submissions are awaiting gates or moderation. Check the Ecosystem console queue (submission kind) and the quarantine builder; if this is a flood, set ANONYMOUS_SUBMISSIONS_ENABLED=false (runbook: docs/runbooks/ecosystem-moderation.md, Anonymous submissions)."

      - alert: SubmissionGateFailureSpike
        # One gate failing a lot in an hour is either an attack probing a gate
        # (heuristics, secrets, license) or a broken gate (vuln scan, smoke test
        # infrastructure) failing every honest submission.
        expr: sum by (gate) (increase(plugin_submission_gate_failures_total[1h])) > 10
        for: 10m
        labels:
          severity: warning
          component: plugin-ecosystem
          tenancy: platform
        annotations:
          summary: "Anonymous submissions failing the {{ $labels.gate }} gate"
          description: "{{ $value | humanize }} submissions failed the {{ $labels.gate }} gate in the last hour. Heuristics/secrets spikes suggest abuse (consider disabling the flag); vuln-scan or smoke-test spikes suggest a broken gate (grype DB, quarantine builder)."

      - alert: PluginLookupRefusalSpike
        # synth lookups refused because a signature (or its tier
        # annotation) doesn't verify, or a listing's tier is outside an org's
        # policy. A burst is a tampered/re-pushed image or a stale re-sign job.
        expr: sum by (reason) (increase(plugin_lookup_refusals_total{reason=~"signature|tier"}[1h])) > 5
        for: 10m
        labels:
          severity: warning
          component: plugin-ecosystem
          tenancy: platform
        annotations:
          summary: "Plugin lookups refused ({{ $labels.reason }})"
          description: "{{ $value | humanize }} plugin lookups were refused for {{ $labels.reason }} in the last hour. signature: an image no longer matches its platform signature (tampered, re-pushed, or a failed re-sign); tier: signed tier annotations out of step with listings (runbook: docs/runbooks/ecosystem-moderation.md)."

      - alert: OfficialAutoApprovalAnomaly
        # the seeded "Official catalog" rule (label = the rule's
        # NAME — keep in step if it is renamed) hitting its 50/day cap, or
        # approving at >4x its 7-day hourly average. Either is possible rule abuse
        # (a compromised catalog-loader credential) or a runaway loader.
        expr: |
          sum(increase(ecosystem_auto_approvals_total{rule="Official catalog"}[24h])) >= 45
          or
          (
            sum(increase(ecosystem_auto_approvals_total{rule="Official catalog"}[1h])) > 10
            and
            sum(increase(ecosystem_auto_approvals_total{rule="Official catalog"}[1h]))
              > 4 * (sum(increase(ecosystem_auto_approvals_total{rule="Official catalog"}[7d])) / 168)
          )
        for: 5m
        labels:
          severity: warning
          component: plugin-ecosystem
          tenancy: platform
        annotations:
          summary: "Official catalog auto-approvals are anomalous"
          description: "{{ $value | humanize }} Official catalog auto-approvals (near the 50/day cap or far above the usual rate). Review recent plugin.request.auto-approve audit events; OFFICIAL_AUTO_APPROVAL_ENABLED=false stops the rule immediately."

      # ---- Registry ----
      # Uses the platform-wide `http_requests_total` counter (emitted by
      # api-server's metricsMiddleware), filtered to the image-registry
      # service via the `service` default label. No new metric needed.
      - alert: RegistryErrorBurst
        expr: sum(rate(http_requests_total{service="image-registry", status_code=~"5.."}[5m])) > 0
        for: 5m
        labels:
          severity: critical
          component: registry
          tenancy: platform
        annotations:
          summary: "Registry returning 5xx errors"
          description: "{{ $value | humanize }} 5xx/s over the last 5 minutes. Check image-registry logs."

      # ---- Quota ----
      # `quota_fail_open_total` is incremented by api-core's quota client
      # every time the quota service is unreachable or returns non-ok and
      # the caller proceeds with a "fail-open allowed" result. A small
      # number of these is normal (transient network blips). A SUSTAINED
      # rate means quota is effectively disabled across the fleet — every
      # org is unlimited and noisy-neighbor protection is off — until
      # the quota service is restored. Critical because the financial /
      # abuse-prevention impact compounds with time.
      - alert: QuotaServiceFailOpenSustained
        expr: sum(rate(quota_fail_open_total[5m])) > 0.1
        for: 10m
        labels:
          severity: critical
          component: quota
          tenancy: platform
        annotations:
          summary: "Quota service has been failing open for 10+ minutes"
          description: "{{ $value | humanize }} fail-open events/sec averaged over 5m. The quota service is unreachable or unhealthy — every quota check is returning 'allowed' regardless of actual usage. Investigate the quota service before noisy orgs exhaust shared resources."

      # The mirror image of the rule above, and the more urgent of the two.
      # `quota_fail_closed_total` is incremented by the SAME api-core quota
      # client when a reservation could not be confirmed and the configured
      # policy (the default — QUOTA_RESERVE_FAIL_OPEN unset) is to DENY. Where
      # fail-open silently removes a limit, fail-closed silently removes the
      # FEATURE: every affected call is rejected as over quota even though the
      # org is nowhere near its limit, and the user sees a quota error that the
      # usage page contradicts. `reason` says which failure it was —
      # `unreachable` (quota service down / NetworkPolicy), `transient-429`
      # (quota service shedding load), `non-ok` (it answered, badly).
      # Critical: this is user-visible breakage of a healthy org's work.
      - alert: QuotaFailClosedSustained
        expr: sum by (reason) (rate(quota_fail_closed_total[5m])) > 0.1
        for: 10m
        labels:
          severity: critical
          component: quota
          tenancy: platform
        annotations:
          summary: "Quota reservations failing closed ({{ $labels.reason }})"
          description: "{{ $value | humanize }} denied-by-default reservations/sec over 5m sustained for 10m, reason={{ $labels.reason }}. The quota service is not confirming reservations and the fail-mode policy is DENY, so orgs are being refused work they are entitled to. Restore the quota service; QUOTA_RESERVE_FAIL_OPEN=true is the deliberate (and riskier) alternative."

      # ---- Audit durability (security log) ----
      # The audit trail is compliance-relevant, so losing it must PAGE. Two loss
      # points, both instrumented:
      #   * audit_dropped_total — the remote-audit client exhausted all retries
      #     for an event and dropped it.
      #   * audit_spool_dropped_total — the durable Redis spool overflowed and
      #     trimmed its OLDEST entries to stay bounded (platform down long enough
      #     that buffered audit events aged out before they could flush).
      # Any sustained drop is a security-log gap.
      - alert: AuditEventsDropped
        expr: sum(rate(audit_dropped_total[5m])) > 0
        for: 5m
        labels:
          severity: critical
          component: audit
          tenancy: platform
        annotations:
          summary: "Audit events are being dropped (security log gap)"
          description: "{{ $value | humanize }} audit events/sec dropped by the remote-audit client over 5m — the tamper-evident audit trail is losing records. Investigate platform audit ingest before the gap widens."

      - alert: AuditSpoolDropped
        expr: sum(rate(audit_spool_dropped_total[5m])) > 0
        for: 5m
        labels:
          severity: critical
          component: audit
          tenancy: platform
        annotations:
          summary: "Durable audit spool is overflowing (oldest events dropped)"
          description: "{{ $value | humanize }} spooled audit events/sec trimmed over 5m — the platform has been unreachable long enough that buffered audit events are aging out. Restore audit ingest; the spool is shedding the oldest security records."

      # ---- Storage & event delivery leftovers ----
      # message_attachment_blob_orphans_total: a purge deleted message rows but
      # could not delete some attachment blobs (orphans in object storage).
      # event_bus_dead_lettered_total: a durable event exhausted its deliveries
      # and moved to the `evt:<topic>:dlq` stream (e.g. an entitlement sync that
      # kept failing). Neither loses user data; both need an operator.
      - alert: MessageAttachmentBlobOrphans
        expr: sum(increase(message_attachment_blob_orphans_total[1h])) > 0
        for: 0m
        labels:
          severity: warning
          component: message
          tenancy: platform
        annotations:
          summary: "Message attachment blobs were orphaned by a purge"
          description: "{{ $value | humanize }} attachment blobs could not be deleted in the last hour — they remain in object storage with no row pointing at them. Check the message service logs for the failed keys and object-storage errors."

      - alert: EventBusDeadLettered
        expr: sum by (topic) (increase(event_bus_dead_lettered_total[1h])) > 0
        for: 0m
        labels:
          severity: warning
          component: event-bus
          tenancy: platform
        annotations:
          summary: "Durable events moved to the dead-letter stream"
          description: "{{ $value | humanize }} events on topic {{ $labels.topic }} exhausted their deliveries in the last hour and were dead-lettered to evt:{{ $labels.topic }}:dlq. The consumer kept failing — investigate, then replay or discard them."

      # ---- Billing → entitlement/quota sync ----
      # billing_quota_sync_failed_total: a subscription/entitlement change failed
      # to propagate to the quota service (the org's effective limits now lag its
      # plan). billing_entitlement_drift_total: the periodic reconciler found the
      # stored entitlement disagreeing with the source of truth. Both are money /
      # capability-correctness signals — warn (not page): they self-heal on the
      # next sync/reconcile, but a SUSTAINED rate means the leg is stuck.
      - alert: BillingQuotaSyncFailing
        expr: sum(rate(billing_quota_sync_failed_total[5m])) > 0
        for: 15m
        labels:
          severity: warning
          component: billing
          tenancy: platform
        annotations:
          summary: "Billing → quota sync failing"
          description: "{{ $value | humanize }} sync failures/sec over 5m sustained for 15m — plan changes are not reaching the quota service, so orgs' effective limits lag their subscriptions. Check the billing→quota sync leg."

      - alert: BillingEntitlementDriftSustained
        expr: sum(rate(billing_entitlement_drift_total[15m])) > 0
        for: 30m
        labels:
          severity: warning
          component: billing
          tenancy: platform
        annotations:
          summary: "Billing entitlement drift persisting"
          description: "The entitlement reconciler keeps finding stored entitlements out of sync with the source of truth ({{ $value | humanize }}/sec over 15m, sustained 30m). Usually self-heals; a persistent signal means a sync leg is stuck — inspect the reconciler logs."

      # ---- Billing: the rest of the *_failed_total family ----
      # Each of these is a write the billing service could not complete. They are
      # separated from the sync rule above because they fail for different
      # reasons and are fixed in different places — a single "billing is sad"
      # alert would tell an operator nothing about where to look.
      - alert: BillingEventWriteFailing
        expr: sum by (type) (rate(billing_event_write_failed_total[5m])) > 0
        for: 15m
        labels:
          severity: warning
          component: billing
          tenancy: platform
        annotations:
          summary: "Billing event writes failing (type={{ $labels.type }})"
          description: "{{ $value | humanize }} failed billing-event writes/sec over 5m sustained for 15m. The billing event log is the audit trail for money movement, so a sustained gap means charges and plan changes are happening with no durable record. Usually the Mongo write path — check the billing service logs and MongoDB health."

      - alert: BillingAddonSyncFailing
        expr: sum by (source) (rate(billing_provider_addon_sync_failed_total[5m])) > 0
        for: 15m
        labels:
          severity: warning
          component: billing
          tenancy: platform
        annotations:
          summary: "Add-on entitlements not syncing from the provider (source={{ $labels.source }})"
          description: "{{ $value | humanize }} failures/sec over 5m sustained for 15m reconciling add-on subscriptions from the payment provider. Orgs that bought (or cancelled) an add-on keep their OLD entitlements — a paid pack may be inactive, or a cancelled one still active. Check the provider webhook/poll leg named by source={{ $labels.source }}."

      - alert: BillingDisputeRetrieveFailing
        expr: sum by (reason) (rate(billing_dispute_retrieve_failed_total[15m])) > 0
        for: 30m
        labels:
          severity: warning
          component: billing
          tenancy: platform
        annotations:
          summary: "Cannot retrieve disputed charges from the payment provider"
          description: "{{ $value | humanize }} failures/sec over 15m sustained for 30m looking up the charge behind a dispute (reason={{ $labels.reason }}). A dispute that cannot be resolved to a charge is not reversed automatically, so the org keeps service it has charged back. Reconcile those disputes by hand in the provider dashboard."

      # ---- Auth: SAML assertions being rejected ----
      # `platform_saml_signins_total{result}` counts every SAML sign-in outcome.
      # Rejections are NOT all equal, so this fires on the ones that mean something
      # is wrong rather than on a person mistyping: an expired or rotated-away
      # signing certificate (`invalid_assertion`), unsolicited assertions
      # (`idp_initiated` — someone using their IdP's app launcher, or a login-CSRF
      # attempt), and replays. A steady rate here is a BROKEN CONNECTION: every
      # affected user is locked out, so it warns quickly.
      - alert: SamlAssertionRejections
        expr: sum by (result) (rate(platform_saml_signins_total{result=~"invalid_assertion|replay|idp_initiated"}[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
          component: auth
          tenancy: platform
        annotations:
          summary: "SAML assertions being rejected ({{ $labels.result }})"
          description: "{{ $value | humanize }} SAML rejections/sec of type {{ $labels.result }} over 5m, sustained 10m. `invalid_assertion` usually means the identity provider rotated its signing certificate without the new one being added here (see runbooks/secret-rotation.md#idp-saml-signing-certificates-per-org); `idp_initiated` means people are starting sign-in at the identity provider, which is refused by design; `replay` means an assertion was presented twice. Filter the audit log on `sso.saml.refused` for the affected org."

      # ---- Auth: SAML Single Logout ----
      # `platform_saml_slo_total{direction,result}` counts both legs of SLO.
      # The two results that matter are `refused` (an SLO message arrived that we
      # would not act on — unsigned, unknown issuer, or a malformed request) and
      # `capped` (an IdP-initiated logout matched more sessions than the per-
      # request cap, so some sessions were LEFT ALIVE). Both mean a sign-out the
      # user believes happened did not: `refused` is a broken or hostile IdP
      # connection, `capped` is a real, silent gap in session revocation.
      - alert: SamlSingleLogoutFailing
        expr: sum by (direction, result) (rate(platform_saml_slo_total{result=~"refused|capped"}[10m])) > 0
        for: 15m
        labels:
          severity: warning
          component: auth
          tenancy: platform
        annotations:
          summary: "SAML single logout not completing ({{ $labels.direction }}/{{ $labels.result }})"
          description: "{{ $value | humanize }} SLO events/sec of result={{ $labels.result }} over 10m, sustained 15m. `refused` means the logout message was rejected — usually the IdP's signing certificate rotated (runbooks/secret-rotation.md#idp-saml-signing-certificates-per-org) or the issuer does not match the configured connection. `capped` means an IdP-initiated logout hit the per-request session cap and some sessions stayed signed in; revoke them explicitly from the org's session list."

      # ---- Auth: bootstrap-admin MFA exception used long after install (#8) ----
      # The bootstrap admin (BOOTSTRAP_SUPERADMIN_EMAILS, system org) may hold a
      # single-factor session ONLY until they enrol a passkey or an authenticator
      # app; the exception then closes permanently. A fresh install finishes in
      # minutes, so `late="true"` means either a setup that stalled without ever
      # enrolling a factor, or someone using the exception as a way in. Both need
      # a person to look: enrol a factor (which closes it) or investigate.
      - alert: MfaBootstrapSessionLate
        expr: sum(increase(platform_mfa_bootstrap_session_total{late="true"}[15m])) > 0
        for: 0m
        labels:
          severity: warning
          component: auth
          tenancy: platform
        annotations:
          summary: "Bootstrap-admin MFA exception used more than 24h after install"
          description: "The install's bootstrap administrator signed in on the pre-enrolment exception more than 24 hours after the platform was installed, so they still have NO second factor. Filter the audit log on `auth.mfa.bootstrap_session`. Enrol a passkey or an authenticator app on that account — the exception closes permanently at the first enrolment."

      # ---- Auth: MFA enforcement refusals (#8) ----
      # Every refusal by an assurance gate: a weak session on a route that needs a
      # second factor, a stale one past `maxAge`, a machine credential on a
      # human-only route, or a bootstrap enrolment session reaching outside its
      # allowlist. A steady trickle is people meeting the policy for the first
      # time; a sustained burst usually means a route was gated before its users
      # could enrol, or that automation is pointed at a human-only endpoint.
      - alert: MfaEnforcementRefusalBurst
        expr: sum by (reason) (rate(platform_mfa_enforcement_refused_total[5m]) + rate(mfa_enforcement_refused_total[5m])) > 0.2
        for: 15m
        labels:
          severity: warning
          component: auth
          tenancy: platform
        annotations:
          summary: "Sustained MFA enforcement refusals ({{ $labels.reason }})"
          description: "{{ $value | humanize }} refusals/sec of type {{ $labels.reason }} over 5m, sustained 15m. `machine_principal` means a service account or API key is calling a human-only route — point it at the machine equivalent. `weak_session` means people have not enrolled a factor yet; check the org's grace deadline before tightening further. `bootstrap_session` means the install's admin is still un-enrolled."

      # ---- Auth: administrative MFA resets ----
      # `platform_mfa_resets_total{stage}` traces the whole approval flow:
      # requested -> approved | denied | withdrawn, plus `direct` for a reset
      # applied without the two-person flow. Resets are legitimate (people lose
      # phones) but each one strips a second factor from an account, so this
      # alerts on VOLUME rather than on any single reset: a burst of `approved`
      # or any use of `direct` is what a social-engineering campaign looks like
      # from the inside. Deliberately low thresholds — a handful a day is normal.
      - alert: MfaResetsElevated
        expr: sum by (stage) (increase(platform_mfa_resets_total{stage=~"approved|direct"}[1h])) > 3
        for: 0m
        labels:
          severity: warning
          component: auth
          tenancy: platform
        annotations:
          summary: "Unusual number of MFA resets ({{ $labels.stage }})"
          description: "{{ $value | humanize }} MFA resets of stage={{ $labels.stage }} in the last hour. `direct` bypassed the two-person approval entirely. Each reset removes a second factor, so a cluster of them is the shape of a social-engineering campaign — cross-check `auth.mfa.reset.*` in the audit log against the accounts and the people who approved them."

      # ---- Auth: breached-password check unavailable ----
      # The HIBP range check is FAIL-OPEN by design (see PASSWORD_BREACH_CHECK in
      # .env.example): an unreachable range API lets the password through rather
      # than blocking every registration and password change on a third party's
      # uptime. The cost of that choice is that the control disappears SILENTLY —
      # which is precisely what this rule exists to prevent. `outcome` is
      # ok | breached | unavailable; only `unavailable` is a fault.
      #
      # Sustained `unavailable` on an air-gapped install means PASSWORD_BREACH_CHECK
      # was left at `hibp` instead of being set to `off` — fix the setting rather
      # than opening egress.
      - alert: PasswordBreachCheckUnavailable
        expr: sum(rate(platform_password_breach_checks_total{outcome="unavailable"}[10m])) > 0
        for: 15m
        labels:
          severity: warning
          component: auth
          tenancy: platform
        annotations:
          summary: "Breached-password checks are failing open"
          description: "{{ $value | humanize }} unavailable breach checks/sec over 10m, sustained 15m. Every password set or changed in that window was accepted WITHOUT being checked against known-breached credentials — the check fails open on purpose. Either restore egress to PASSWORD_BREACH_CHECK_URL, or set PASSWORD_BREACH_CHECK=off if this install is deliberately air-gapped (which stops the alert and makes the choice explicit)."

      # ---- Auth: SSO just-in-time provisioning refused ----
      # A refusal here is a person who authenticated successfully at their IdP
      # and was then NOT let in, because JIT would not create their account:
      # `not_entitled` (the org's plan does not include SSO/JIT), `platform_admin`
      # (JIT may never mint a platform administrator — by design), a seat cap, or
      # a domain that does not match the connection. From the user's side this is
      # indistinguishable from a broken login, and it is invisible in the IdP's
      # own logs, so it needs to surface here.
      - alert: SsoJitRefusalBurst
        expr: sum by (reason) (rate(platform_sso_jit_refused_total[10m])) > 0.02
        for: 15m
        labels:
          severity: warning
          component: auth
          tenancy: platform
        annotations:
          summary: "SSO just-in-time provisioning being refused ({{ $labels.reason }})"
          description: "{{ $value | humanize }} JIT refusals/sec of reason={{ $labels.reason }} over 10m, sustained 15m — people are authenticating at their identity provider and still cannot get in. `not_entitled` means the org's plan does not include this; `platform_admin` is refused by design and never auto-provisioned. Filter the audit log on `sso.jit.refused` for the affected org."

      # ---- Directory sync (SCIM) ----
      # `platform_scim_errors_total{resource,operation,reason}` counts refused or
      # failed directory operations. SCIM is how an organisation DEPROVISIONS
      # people, so a stuck sync is a security problem and not just an
      # inconvenience: a leaver removed in the IdP keeps their access here until
      # the sync succeeds. `reason=internal` is our fault; the rest are the
      # caller's (bad filter, unknown attribute, revoked scope) and still need
      # someone to fix the connection.
      - alert: ScimErrorBurst
        expr: sum by (resource, operation, reason) (rate(platform_scim_errors_total[10m])) > 0.05
        for: 15m
        labels:
          severity: warning
          component: auth
          tenancy: platform
        annotations:
          summary: "SCIM directory sync failing ({{ $labels.resource }}/{{ $labels.operation }}, {{ $labels.reason }})"
          description: "{{ $value | humanize }} SCIM errors/sec over 10m, sustained 15m, on {{ $labels.operation }} {{ $labels.resource }} (reason={{ $labels.reason }}). While this persists the directory and this platform disagree about who has access — a deprovisioned user may still be able to sign in. `internal` is a platform fault; anything else means the connection needs fixing at the IdP. Filter the audit log on `org.scim.refused`."

      # ---- Passkeys: FIDO metadata blob not loading ----
      # `platform_fido_mds_loads_total{outcome,source}` records every attempt to
      # load the FIDO Alliance metadata blob. It is only consulted by orgs that
      # set an approved-authenticator (AAGUID) allowlist — but for those orgs a
      # failed load is a HARD STOP: registration requests direct attestation and
      # is REFUSED when no metadata is loaded, so nobody in that org can enrol a
      # new passkey. `source=url` failures are egress or an expired blob;
      # `source=file` failures are a missing or stale FIDO_MDS_BLOB_PATH mount.
      - alert: FidoMdsLoadFailing
        expr: sum by (source) (increase(platform_fido_mds_loads_total{outcome="failure"}[1h])) > 0
        for: 0m
        labels:
          severity: warning
          component: auth
          tenancy: platform
        annotations:
          summary: "FIDO metadata blob failed to load (source={{ $labels.source }})"
          description: "{{ $value | humanize }} failed MDS loads in the last hour. Orgs with an approved-authenticator allowlist cannot enrol new passkeys until a blob loads — the refusal is deliberate (the policy asked for provenance we could not verify). source=url: check egress to FIDO_MDS_URL. source=file: the FIDO_MDS_BLOB_PATH file is missing, unreadable or expired — refresh it per docs/runbooks/secret-rotation.md. Orgs with no allowlist are unaffected."

      # ---- Auth: failed-login burst (credential stuffing / brute force) ----
      # platform_logins_failed_total is a platform-wide counter (no per-IP/org
      # label), so this is a coarse "someone is hammering login" signal. Warn on a
      # sustained elevated rate; investigate source IPs at the ALB/WAF.
      - alert: LoginFailureBurst
        expr: sum(rate(platform_logins_failed_total[5m])) > 1
        for: 10m
        labels:
          severity: warning
          component: auth
          tenancy: platform
        annotations:
          summary: "Elevated failed-login rate (possible brute force)"
          description: "{{ $value | humanize }} failed logins/sec over 5m sustained for 10m — possible credential stuffing/brute force. Check source IPs at the ALB/WAF and consider rate-limiting or lockout."

      # ---- Generic app 5xx burst ----
      # image-registry has its own faster RegistryErrorBurst above; this covers
      # every OTHER app service via the shared http_requests_total counter
      # (emitted by api-server's metricsMiddleware, `service` default label).
      # One series per service so the page names the culprit.
      - alert: ServiceError5xxBurst
        expr: sum by (service) (rate(http_requests_total{service!="image-registry", status_code=~"5.."}[5m])) > 0.1
        for: 10m
        labels:
          severity: critical
          component: api
          tenancy: platform
        annotations:
          summary: "Service {{ $labels.service }} returning 5xx errors"
          description: "{{ $value | humanize }} 5xx/s from {{ $labels.service }} over 5m sustained for 10m — check that service's logs and dependencies."

      # ---- S2S circuit breaker ----
      # s2s_circuit_opened_total increments when the shared InternalHttpClient trips
      # a target's breaker open (≥ threshold consecutive failures) and starts fast-
      # failing to shed load. Firing means a downstream dependency is in a sustained
      # brownout — callers are load-shedding instead of piling on retries.
      - alert: ServiceCircuitOpen
        expr: sum by (target) (increase(s2s_circuit_opened_total[5m])) > 0
        for: 0m
        labels:
          severity: warning
          component: api
          tenancy: platform
        annotations:
          summary: "S2S circuit opened for {{ $labels.target }}"
          description: "The circuit breaker to {{ $labels.target }} opened {{ $value | humanize }} time(s) in 5m — that downstream is in a sustained brownout and callers are shedding load. Check {{ $labels.target }}'s health."

      # ---- Token revocation degradation ----
      # token_revocation_fail_open_total increments when a Redis-backed revocation
      # read errors and the check fails OPEN. While sustained, forced logouts and
      # privilege revocations silently stop taking effect until natural token expiry.
      - alert: TokenRevocationFailingOpen
        expr: sum(rate(token_revocation_fail_open_total[5m])) > 0.1
        for: 10m
        labels:
          severity: critical
          component: auth
          tenancy: platform
        annotations:
          summary: "Token revocation is failing open"
          description: "{{ $value | humanize }} revocation read failures/sec over 5m sustained for 10m — forced logouts / privilege revocations are NOT taking effect until token expiry. Restore the revocation Redis."

      # The fail-CLOSED half of the same store, and the one with no alert until now.
      # `getSessionRevocation` treats an unreadable Redis as `unavailable`, which REJECTS
      # the token — so where the counter above means "revocations stop working", this one
      # means support impersonation stops working, fleet-wide, for everyone. Its own code
      # comment says it is counted to be "visible and alertable"; this is that alert.
      - alert: SessionRevocationUnavailable
        expr: sum(rate(session_revocation_unavailable_total[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
          component: auth
          tenancy: platform
        annotations:
          summary: "Session-revocation reads are unavailable"
          description: "{{ $value | humanize }} unavailable session-revocation reads/sec over 5m sustained for 10m. This check fails CLOSED, so consent-gated impersonation is being refused everywhere — support cannot act on any tenant. Restore the revocation Redis. Not critical: the refusal is the safe direction."

      # ---- A producer sending another org's events ----
      # The ingest resolves the org from the pipeline registry and DROPS an event whose
      # token names a different org. Zero is the only correct value: a non-zero count is a
      # misrouted producer or an attempt to write into another tenant's delivery history,
      # and the code says as much where it counts it. Warning rather than critical because
      # the guard HELD — the event was dropped, not accepted — but it wants a human.
      - alert: ReportingIngestForeignOrgDropped
        expr: sum(increase(reporting_ingest_foreign_org_dropped_total[30m])) > 0
        for: 0m
        labels:
          severity: warning
          component: reporting
          tenancy: platform
        annotations:
          summary: "Reporting ingest dropped events naming another org"
          description: "{{ $value | humanize }} ingest events in 30m carried a token for one org and a pipeline belonging to another; all were dropped. Either a producer is misconfigured (check the event-forwarder Lambda's stored key) or something is probing cross-tenant writes. The reporting logs name the offending org."

      # ---- The audit path's LAST RESORT failing ----
      # Distinct from `AuditEventsDropped` above, and the pair is worth knowing apart:
      # that one watches `audit_dropped_total`, the REMOTE client giving up on shipping to
      # platform; this one watches `audit_local_dropped_total`, the local fallback that
      # exists to catch exactly that. When this fires the event is in neither place, so it
      # is gone. The hash chain stays VALID across the gap — it chains what was written —
      # so /audit/verify will not reveal it, and a later "why is there no row for this?"
      # is indistinguishable from tampering.
      - alert: AuditLocalWriteDropped
        expr: sum(increase(audit_local_dropped_total[1h])) > 0
        for: 0m
        labels:
          severity: critical
          component: audit
          tenancy: platform
        annotations:
          summary: "Audit events dropped by the local fallback"
          description: "{{ $value | humanize }} audit events were dropped in the last hour by the LOCAL fallback, after the remote client had already failed — they are in neither store and cannot be recovered. /audit/verify will NOT show the gap. Check the audit spool's Redis and platform's audit sink."

      # ---- A customer's entitlements left permanently wrong ----
      # The retry gave up because the subscription row it would have replayed is gone, so
      # nothing will re-push. The org keeps whatever features it had — which after a plan
      # change or a lapse is the WRONG set, in the direction of either over- or
      # under-granting, until someone touches the subscription again.
      - alert: BillingEntitlementSyncDropped
        expr: sum by (reason) (increase(billing_entitlement_sync_retry_dropped_total[1h])) > 0
        for: 0m
        labels:
          severity: warning
          component: billing
          tenancy: platform
        annotations:
          summary: "Entitlement sync gave up ({{ $labels.reason }})"
          description: "{{ $value | humanize }} entitlement pushes were abandoned in the last hour, so those orgs' enforced features no longer match what they pay for. The drift reconciler will catch it on its next pass; if this repeats, that pass is not running."

      # ---- Add-on sold but never charged / never honoured ----
      # Both are CONFIG DRIFT between the bundle catalog and a provider's price or
      # dimension list, and both fail quietly: the customer keeps working, nothing
      # errors, and the only trace is one log line per subscription sync. They fire on
      # any occurrence in the last hour (`for: 0m`) because a single unbilled or
      # under-entitled customer already matters and these syncs are infrequent — a
      # `rate() > 0 for 15m` window would simply never trigger.
      - alert: BillingStripeBundleUnpriced
        expr: sum by (bundle_id) (increase(billing_stripe_unmapped_bundle_total[1h])) > 0
        for: 0m
        labels:
          severity: warning
          component: billing
          tenancy: platform
        annotations:
          summary: "Add-on granted but not charged on Stripe (bundle={{ $labels.bundle_id }})"
          description: "STRIPE_PRICE_MAP has no `{{ $labels.bundle_id }}_<interval>` Price, so that add-on's line item was dropped {{ $value | humanize }} time(s) in the last hour while the entitlement was still granted — the customer is using it for free. Add the Stripe Price id for both intervals; see docs/billing-providers.md."

      - alert: BillingMarketplaceDimensionUnmapped
        expr: sum by (dimension) (increase(billing_marketplace_unmapped_dimension_total[1h])) > 0
        for: 0m
        labels:
          severity: warning
          component: billing
          tenancy: platform
        annotations:
          summary: "Marketplace entitlement resolved to the free tier (dimension={{ $labels.dimension }})"
          description: "AWS entitled a customer to `{{ $labels.dimension }}`, which is absent from AWS_MARKETPLACE_DIMENSION_MAP, so they silently resolved to the developer tier {{ $value | humanize }} time(s) in the last hour — a PAYING customer is under-entitled. Map the dimension to its plan id; see docs/billing-providers.md."

      # ---- Money that moved wrongly, or did not move at all ----
      # These five counters were emitted and nothing watched them. Each one means a
      # specific customer was charged twice, not charged, or lost a credit — none of
      # which surfaces as an error, a failed request or a dashboard anomaly. Same
      # `increase(...[1h]) > 0` / `for: 0m` shape as the pair above: the events are
      # rare, and one affected customer is already worth a look.
      - alert: BillingDuplicateStripeSubscription
        expr: sum by (reason) (increase(billing_duplicate_stripe_subscription_total[1h])) > 0
        for: 0m
        labels:
          severity: warning
          component: billing
          tenancy: platform
        annotations:
          summary: "Duplicate Stripe subscription created ({{ $labels.reason }})"
          description: "{{ $value | humanize }} duplicate Stripe subscription(s) appeared in the last hour. The handler cancels the extra one immediately, so this is normally self-healing — but a sustained rate means two checkouts are racing and a customer may see two charges before the cancel lands."

      - alert: BillingUnboundStripeSubscription
        expr: sum by (reason) (increase(billing_unbound_stripe_subscription_total[1h])) > 0
        for: 0m
        labels:
          severity: warning
          component: billing
          tenancy: platform
        annotations:
          summary: "Stripe subscription with no local binding ({{ $labels.reason }})"
          description: "{{ $value | humanize }} Stripe subscription(s) in the last hour could not be bound to an org — `out_of_band` means it was created outside the app, `unknown_plan` means its price maps to no local plan. Stripe is billing someone the platform grants nothing to. Reconcile in the Stripe dashboard and check STRIPE_PRICE_MAP."

      - alert: BillingChargeReversalAmbiguous
        expr: sum by (reason) (increase(billing_charge_reversal_ambiguous_sub_total[1h])) > 0
        for: 0m
        labels:
          severity: warning
          component: billing
          tenancy: platform
        annotations:
          summary: "Charge reversal could not be attributed to one subscription ({{ $labels.reason }})"
          description: "{{ $value | humanize }} refund/dispute(s) in the last hour could not be tied to a single subscription, so the ledger was reversed but the subscription-scoped promotion clawback was SKIPPED rather than risk clawing the wrong one. Needs an operator to settle the promotions by hand."

      - alert: BillingMarketplaceCreditUnrealizable
        expr: sum(increase(billing_marketplace_credit_unrealizable_total[1h])) > 0
        for: 0m
        labels:
          severity: warning
          component: billing
          tenancy: platform
        annotations:
          summary: "Marketplace usage credit could not be realized"
          description: "{{ $value | humanize }} credit(s) in the last hour had no metered dimension to draw against, so the customer keeps a credit the platform can never apply. Usually a dimension missing from AWS_MARKETPLACE_DIMENSION_PRICE_MAP — an unpriced dimension cannot be valued, so it is reported in full."

      # Not a per-customer error: a high rate means the LISTING should expose an
      # authoritative billing-term dimension instead of the app inferring cadence
      # from the entitlement's expiration horizon. Thresholded, not >0.
      - alert: BillingMarketplaceIntervalInferred
        expr: sum(increase(billing_marketplace_interval_inference_low_confidence_total[1h])) > 5
        for: 15m
        labels:
          severity: warning
          component: billing
          tenancy: platform
        annotations:
          summary: "Marketplace billing interval is being guessed"
          description: "{{ $value | humanize }} entitlements in the last hour carried no expiration to infer monthly-vs-annual from, so the cadence was defaulted. Sustained means subscriptions may be renewing on the wrong term — add a billing-term dimension to the Marketplace listing."

      # ---- Events that never reached the bus ----
      # A publish failure means the event is not in the stream at all, so no consumer and
      # no redelivery will ever see it. Distinct from `event_bus_handler_failed_total`,
      # which is a CONSUMER failing and is retried by XAUTOCLAIM until it dead-letters —
      # that terminal case has its own alert.
      - alert: EventBusPublishFailing
        expr: sum by (topic) (increase(event_bus_publish_failed_total[15m])) > 0
        for: 5m
        labels:
          severity: warning
          component: api
          tenancy: platform
        annotations:
          summary: "Durable event bus is dropping publishes on {{ $labels.topic }}"
          description: "{{ $value | humanize }} events failed to publish to {{ $labels.topic }} in 15m — they never entered the stream, so nothing will redeliver them. Check the event-bus Redis."

      # ---- Async compliance / entity evaluation being lost ----
      # Both counters exist because their own code says a sustained rate is an operational
      # signal an operator cannot act on from a warn line. Live validation still enforces
      # compliance on the mutation itself, so this is about the ASYNC follow-up going
      # missing — the org's posture quietly drifts from what was actually evaluated.
      - alert: AsyncEvaluationDropped
        expr: sum(increase(compliance_event_drop_total[1h])) > 0 or sum(increase(entity_event_subscriber_failed_total[1h])) > 0
        for: 10m
        labels:
          severity: warning
          component: compliance
          tenancy: platform
        annotations:
          summary: "Async compliance / entity evaluation is being dropped"
          description: "{{ $value | humanize }} async evaluations were lost in the last hour. The originating mutations were still validated live, so nothing is wrong in the data — but posture and entity-event history are now incomplete. Check the subscriber's Redis and the compliance service."

      # ---- Cross-replica cache invalidation broken ----
      # Invalidation rides a Redis pub/sub channel. When publish or subscribe fails, each
      # replica keeps serving its OWN cached copy: a permission change, a feature flip or a
      # policy edit applies on the pod that handled the write and nowhere else. The symptom
      # is "it worked when I refreshed twice", which nobody reports as a bug.
      - alert: CacheInvalidationBroken
        expr: sum(increase(cache_invalidation_publish_failed_total[15m])) > 0 or sum(increase(cache_invalidation_subscribe_failed_total[15m])) > 0
        for: 5m
        labels:
          severity: warning
          component: api
          tenancy: platform
        annotations:
          summary: "Cross-replica cache invalidation is failing"
          description: "Cache-invalidation publish/subscribe failed {{ $value | humanize }} time(s) in 15m — replicas are serving stale permissions, features and policy until their TTLs expire. Check the shared Redis."

      # ---- A build host with a bad clock ----
      # The ingest drops events whose timestamps are impossible. Silently, that skews
      # deployment frequency, change-failure rate and lead time for the whole org — the
      # numbers a manager is about to read in a stakeholder report — and the cause is one
      # misconfigured build host, which nobody looks for without being told.
      - alert: ReportingIngestInvalidTimeDropped
        expr: sum by (org_id) (increase(reporting_ingest_invalid_time_dropped_total[1h])) > 0
        for: 0m
        labels:
          severity: warning
          component: reporting
          tenancy: platform
        annotations:
          summary: "Ingest dropped events with impossible timestamps (org {{ $labels.org_id }})"
          description: "{{ $value | humanize }} events in the last hour carried timestamps the ingest refused. DORA figures for this org are computed without them. Usually a build host with a wrong clock; the reporting logs name the pipeline."

      # ---- Key exchange failing for OUR reasons, not the caller's ----
      # `reason=rejected` is a bad or revoked key and belongs to the caller — it is the
      # control working, and it is counted, not alerted. `throttled` and `server_error`
      # are platform saying "ask again later", and while they persist every service
      # account and CLI in the fleet is locked out.
      - alert: ApiKeyExchangeUnavailable
        expr: sum by (reason) (rate(api_key_exchange_failures_total{reason=~"throttled|server_error"}[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
          component: auth
          tenancy: platform
        annotations:
          summary: "Access-key exchange is unavailable ({{ $labels.reason }})"
          description: "{{ $value | humanize }} key exchanges/sec are failing with {{ $labels.reason }} over 5m — not rejected keys, but platform unable to answer. Service accounts, CI credentials and the CLI cannot obtain tokens while this lasts."

      # ---- A security notice that never went out ----
      # These three tell an org something it needs to act on: a new vulnerability in a
      # plugin it installed, a rescan finding, a deprecation. None of them retries. A
      # failure here is the one case where our silence looks to the customer exactly like
      # "there was nothing to tell you".
      - alert: SecurityNoticeDeliveryFailing
        expr: sum(increase(plugin_security_notification_failed_total[1h])) > 0 or sum(increase(ecosystem_advisory_rescan_draft_failed_total[1h])) > 0 or sum(increase(plugin_deprecation_notice_failures_total[1h])) > 0
        for: 0m
        labels:
          severity: warning
          component: plugin
          tenancy: platform
        annotations:
          summary: "A plugin security / deprecation notice failed to send"
          description: "{{ $value | humanize }} notices failed in the last hour and are NOT retried — affected orgs were not told about a vulnerability, a rescan finding or a deprecation. Check the notification queue and the email relay, then re-send by hand."

      # ---- Secret rotation left half-finished ----
      # `secret_rotation_previous_set{secret}` is 1 while a rotation's outgoing
      # credential is still accepted by that service — an env `*_PREVIOUS` value
      # (SECRET_ENCRYPTION_KEY_PREVIOUS, ALERT_WEBHOOK_INSTANCE_TOKEN_PREVIOUS), a
      # retiring `kid` still published in the JWKS (TOKEN_SIGNING_KEY) or in the
      # per-service key bundle (SERVICE_SIGNING_KEY), or a two-cert registry
      # token bundle.
      # That is the overlap window: the OLD credential is still accepted, so a
      # rotation that is never finished has simply added a second valid
      # credential — including one that may be the compromised one the rotation
      # was meant to retire.
      # Aggregated by (service, secret) on purpose: dropping pod/instance means a
      # rolling restart mid-rotation does not reset the `for` timer.
      - alert: SecretRotationPreviousLingering
        expr: max by (service, secret) (secret_rotation_previous_set) == 1
        for: 24h
        labels:
          severity: warning
          component: auth
          tenancy: platform
        annotations:
          summary: "{{ $labels.secret }} rotation overlap still open on {{ $labels.service }}"
          description: "The previous {{ $labels.secret }} has been accepted by {{ $labels.service }} for over 24h — the rotation was never finished, so the old credential is still valid. Finish it per docs/runbooks/secret-rotation.md (clear the *_PREVIOUS value or drop the retiring key, re-create the secret, restart)."

      # ---- Internal routes refused ----
      # `internal_route_refused_total{service,route,reason,caller}` increments in
      # api-core's `requireInternalService` when a call to an INTERNAL route
      # (/internal/*, the quota usage counters, the entity-event and audit
      # ingests, the entitlement sync legs) is turned away.
      #
      # Two very different meanings, split by `reason`:
      #   user_token  — something holding a PERSON's credential tried a
      #                 peer-service API. A handful is a misrouted client; a
      #                 sustained rate is someone probing the internal surface.
      #   wrong_caller — a real service token, but not one this route admits.
      #                 Almost always a mis-wired caller after a deploy, and the
      #                 feature behind it is silently failing.
      # Either way it is a security-relevant refusal, so it pages nobody at a
      # trickle but must not go unseen.
      - alert: InternalRouteRefused
        expr: sum by (service, reason) (rate(internal_route_refused_total[5m])) > 0.05
        for: 15m
        labels:
          severity: warning
          component: auth
          tenancy: platform
        annotations:
          summary: "{{ $labels.service }} is refusing internal-route calls ({{ $labels.reason }})"
          description: "{{ $value | humanize }} refusals/s on {{ $labels.service }}'s internal routes over 5m sustained for 15m, reason={{ $labels.reason }}. `wrong_caller` usually means a caller was re-pointed or renamed and its feature is now failing; `user_token` means a user credential is reaching a peer-service API. See docs/authentication.md#internal-routes."

      # ---- Service tokens failing to verify ----
      # `service_token_verify_total{result,service}` counts every internal token
      # verification. `unknown_kid` means a signer's public key is not in
      # this pod's bundle — the classic half-finished key rotation, where the
      # private key was rolled out before the bundle. `subject_mismatch` is the
      # one that matters most: a VALID signature from a service claiming to be a
      # different one, i.e. an actual cross-service forgery attempt.
      - alert: ServiceTokenVerifyFailing
        expr: sum by (service, result) (rate(service_token_verify_total{result!="ok"}[5m])) > 0
        for: 10m
        labels:
          severity: critical
          component: auth
          tenancy: platform
        annotations:
          summary: "Internal service tokens are failing to verify ({{ $labels.result }})"
          description: "{{ $value | humanize }}/s of internal token verifications on {{ $labels.service }} are failing with result={{ $labels.result }} over 5m sustained for 10m. `unknown_kid` → the key bundle is behind a rotation: roll it out everywhere before the private key (docs/runbooks/secret-rotation.md). `subject_mismatch` → a service signed a token naming a DIFFERENT service; treat as a compromise until proven otherwise."

      # ---- Token signing keys unreachable ----
      # `jwks_fetch_total{source,result}` counts every fetch of platform's
      # published ES256 key set. Since #5, user tokens are verified against
      # those keys, and a verifier that cannot obtain them FAILS CLOSED (503) —
      # so sustained fetch errors are a fleet-wide auth outage in the making,
      # not a background nuisance. Keys are cached for 10 minutes, which is the
      # grace period this `for` mirrors.
      - alert: JwksFetchFailing
        expr: sum by (service) (rate(jwks_fetch_total{result!="success"}[5m])) > 0
        for: 10m
        labels:
          severity: critical
          component: auth
          tenancy: platform
        annotations:
          summary: "{{ $labels.service }} cannot fetch the token signing keys"
          description: "JWKS fetches from platform have been failing for 10m on {{ $labels.service }}. Once its cached key set goes stale every token verification there answers 503. Check platform's /.well-known/jwks.json and the gateway route to it."

      # ---- AI provider errors ----
      # ai_requests_total{outcome="error"} increments on a failed AI turn (provider
      # brownout, bad key, timeout). A burst usually means a provider-side outage.
      - alert: AIProviderErrorBurst
        expr: sum by (provider) (rate(ai_requests_total{outcome="error"}[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
          component: ai
          tenancy: platform
        annotations:
          summary: "AI provider {{ $labels.provider }} erroring"
          description: "{{ $value | humanize }} failed AI turns/sec for provider {{ $labels.provider }} over 5m sustained for 10m — likely a provider brownout or credential issue. Check the ask/generation logs."

      # ---- Stakeholder reports (scheduled delivery) ----
      # A scheduled report has no user watching it fail. Everything here is about a
      # failure NOBODY WOULD NOTICE until a manager asks where their report went,
      # which is the worst possible way to find out.

      # Runs that could not be composed. One is a bad period or a query timeout and
      # the lead is told; a sustained rate means the analytics tables or the database
      # are the problem, and every org's reports are missing.
      - alert: ReportRunsFailing
        expr: sum(increase(report_run_error_total[1h])) + sum(increase(report_run_refused_total[1h])) > 3
        for: 15m
        labels:
          severity: warning
          component: reporting
          tenancy: platform
        annotations:
          summary: "Scheduled stakeholder reports are failing to compose"
          description: "{{ $value | humanize }} report runs failed or were refused in the last hour. The leads are notified per run, but a sustained rate is a platform problem — check the reporting service logs and whether the daily rollup is current."

      # Delivery failed after the report was composed and PUBLISHED. Worse than a
      # compose failure: the run looks complete in the product, so nothing in the UI
      # suggests the recipients never got it.
      - alert: ReportDeliveryFailing
        expr: sum by (channel) (increase(report_delivery_failed_total[1h])) > 5
        for: 15m
        labels:
          severity: warning
          component: reporting
          tenancy: platform
        annotations:
          summary: "Stakeholder report delivery failing on {{ $labels.channel }}"
          description: "{{ $value | humanize }} report deliveries failed over {{ $labels.channel }} in the last hour. The report is published and readable in the product; its recipients did not get it. For email, check platform's relay and the SES/SMTP credentials; for slack/webhook, the org's alert destinations may hold a dead URL."

      # The owner-authority read is unavailable, so runs are being SKIPPED. Fail-closed
      # by design (see report-scheduler.ts), which means reports quietly stop rather
      # than going out on a lapsed entitlement — and nothing else says so.
      - alert: ReportAuthorityUnavailable
        expr: sum(increase(report_authority_unavailable_total[30m])) > 0
        for: 30m
        labels:
          severity: warning
          component: reporting
          tenancy: platform
        annotations:
          summary: "Report runs are being skipped — platform cannot answer the authority check"
          description: "The reporting service could not read report authority from platform, so scheduled runs are being skipped rather than composed. This fails closed on purpose (a run must not go out on a lapsed entitlement), so reports stop SILENTLY. Check platform reachability from reporting and the /internal/reporting/report-authority route."

      # Report PDF rendering failing. A person clicked "download" and got nothing, so
      # unlike a compose failure this is always somebody waiting on a screen. Split by
      # REASON because they need different responses: `timeout` and `render_failed` point
      # at the renderer or a pathological document, while a sustained `busy` means the
      # concurrency cap is simply too low for the demand and the fix is capacity, not a bug.
      - alert: ReportPdfRenderFailing
        expr: sum by (reason) (increase(report_pdf_failed_total[30m])) > 5
        for: 15m
        labels:
          severity: warning
          component: reporting
          tenancy: platform
        annotations:
          summary: "Report PDF rendering failing ({{ $labels.reason }})"
          description: "{{ $value | humanize }} report PDF renders failed with reason {{ $labels.reason }} in the last 30 minutes, each one a person who asked for a file and did not get it. `render_failed`/`timeout`: check that Chromium is present and executable in the reporting image (REPORT_PDF_CHROMIUM_PATH) and that the pod is not being OOM-killed — a render needs ~400MB on top of the service. `busy`: REPORT_PDF_CONCURRENCY is too low for demand; raise it AND the pod memory limit together. The report itself is unaffected and readable in the product."

      # Definitions pausing themselves. A trickle is normal — people leave, add-ons
      # lapse. A burst usually means an entitlement sync went wrong and paused reports
      # the customers are still paying for.
      - alert: ReportDefinitionsPausingEnMasse
        expr: sum by (reason) (increase(report_definition_paused_total[1h])) > 5
        for: 10m
        labels:
          severity: warning
          component: reporting
          tenancy: platform
        annotations:
          summary: "Stakeholder report definitions pausing en masse ({{ $labels.reason }})"
          description: "{{ $value | humanize }} report definitions paused with reason {{ $labels.reason }} in the last hour. A trickle is normal; a burst of `entitlement` usually means a billing sync regression paused reports for paying customers. Each lead was notified, so this is also inbound support volume."

      # ---- Background jobs (leader lock) ----
      # Every periodic sweep — org purge, retention, registry GC, billing
      # lifecycle — runs under a cross-pod leader lock: exactly one replica per
      # window wins `SET NX PX` and runs the body. The failure modes are quiet by
      # nature, which is why they need alerts rather than logs.
      #
      # `leader_lock_unavailable_total` means Redis was unreachable, so NO pod
      # could prove it was the leader and NOBODY ran that window. This fails
      # closed on purpose (running everywhere could duplicate destructive work),
      # but it means a Redis blip silently stops every sweep fleet-wide.
      - alert: LeaderLockUnavailable
        expr: sum by (key) (increase(leader_lock_unavailable_total[15m])) > 0
        for: 15m
        labels:
          severity: warning
          component: background-jobs
          tenancy: platform
        annotations:
          summary: "Background job {{ $labels.key }} cannot reach Redis — nobody is running it"
          description: "The leader lock for {{ $labels.key }} could not be taken because Redis was unreachable, so no replica ran the job. Sweeps fail closed rather than risk running on every pod, so this is a silent stop, not a duplicate-work risk. Check Redis reachability from the owning service."

      # A job whose lock is never ACQUIRED is not running anywhere. This is the
      # condition that matters most and the one with no previous signal at all:
      # contention is healthy (exactly one acquire per window fleet-wide), but
      # zero acquires over an hour means the job is dead — a crashed holder whose
      # key has not expired, a scheduler that never started, or a service down.
      # Scoped to keys Prometheus has already seen, so a job that has never run
      # cannot fire it (nothing to compare against).
      - alert: LeaderLockNeverAcquired
        expr: |
          sum by (key) (increase(leader_lock_acquired_total[1h])) == 0
          and
          sum by (key) (leader_lock_acquired_total) > 0
        for: 1h
        labels:
          severity: warning
          component: background-jobs
          tenancy: platform
        annotations:
          summary: "Background job {{ $labels.key }} has not run for an hour"
          description: "No replica has acquired the {{ $labels.key }} leader lock in 1h, so the job is not running anywhere. Usual causes: the pod holding it died without releasing and the key has not expired yet (TTL is a crash-recovery window), the owning service is down, or its scheduler never started. Check: redis-cli TTL {{ $labels.key }}"

      # Losing a lock MID-RUN means a heartbeat found another holder or the key
      # gone — the run is now racing a second pod. The run's abort signal stops it
      # between units of work, so the alert is about why it happened: an
      # event-loop stall long enough to miss three heartbeats, or a Redis failover.
      - alert: LeaderLockLostMidRun
        expr: sum by (key) (increase(leader_lock_lost_total[30m])) > 0
        for: 5m
        labels:
          severity: warning
          component: background-jobs
          tenancy: platform
        annotations:
          summary: "Background job {{ $labels.key }} lost its lock while running"
          description: "A heartbeat for {{ $labels.key }} found the lock held by someone else or expired, so the run was told to stop between units of work. Means the holder missed several heartbeats (event-loop stall, GC pause) or Redis failed over. Repeated occurrences suggest the job blocks the event loop."

      # A platform sweep that throws every cycle used to be indistinguishable
      # from one that works: the wrapper caught, logged and reported success.
      - alert: BackgroundSweepFailing
        expr: sum by (key) (increase(background_sweep_failed_total[30m])) > 0
        for: 10m
        labels:
          severity: warning
          component: background-jobs
          tenancy: platform
        annotations:
          summary: "Platform sweep {{ $labels.key }} is failing"
          description: "{{ $labels.key }} threw during its run. The sweep is error-isolated so the loop continues, which means a permanently-broken sweep stays broken quietly. Check the platform logs for the job name."

      # Fail-closed skip for a sweep that is NOT safe to run on every pod
      # (org-purge cascades with no atomic claim across replicas). Only possible
      # when Redis is unconfigured, which is a misconfiguration in any multi-pod
      # deployment.
      - alert: BackgroundSweepSkippedNoLock
        expr: sum by (key) (increase(background_sweep_skipped_no_lock_total[30m])) > 0
        for: 5m
        labels:
          severity: critical
          component: background-jobs
          tenancy: platform
        annotations:
          summary: "Sweep {{ $labels.key }} is skipped entirely — no Redis configured"
          description: "{{ $labels.key }} is not safe to run concurrently and no Redis is configured, so it is being skipped on every replica rather than risking two pods doing the same destructive work. It will NOT run until Redis is configured (REDIS_URL / REDIS_SENTINELS)."

      # ---- PVC auto-expansion (platform acting on the rules above) ----------
      # These watch the ACTUATOR, not the volume. Expansion that silently stops
      # working is worse than no expansion: the storage alerts keep firing, a
      # human assumes automation is handling it, and nobody looks.
      - alert: PvcAutoExpandAtCeiling
        # A gauge, so this holds while the condition holds rather than firing
        # once as the event scrolls past.
        expr: max by (namespace, claim) (pvc_autoexpand_at_ceiling) == 1
        for: 10m
        labels:
          severity: critical
          component: storage
          tenancy: platform
        annotations:
          summary: "{{ $labels.claim }} has hit its auto-expand ceiling and will NOT grow further"
          description: "Auto-expansion has stopped for {{ $labels.claim }} (namespace {{ $labels.namespace }}): it reached PVC_AUTOEXPAND_CEILING_MULTIPLE x its original size, or PVC_AUTOEXPAND_MAX_GI. Nothing will grow it now. Find what is writing — a volume that keeps growing past its ceiling is usually an unarchived WAL or a log loop, not genuine demand — then expand deliberately if the growth is real."

      - alert: PvcAutoExpandTemplateDrift
        # StatefulSet claims come from volumeClaimTemplates, which is immutable
        # on a live StatefulSet: the live PVC grew, the manifest did not.
        expr: max by (namespace, claim) (pvc_autoexpand_template_drift) == 1
        for: 1h
        labels:
          severity: warning
          component: storage
          tenancy: platform
        annotations:
          summary: "{{ $labels.claim }} was expanded but its StatefulSet template still says the old size"
          description: "{{ $labels.claim }} belongs to a StatefulSet whose volumeClaimTemplates is immutable, so the manifest in deploy/ still requests the ORIGINAL size. A replica created later — a scale-up, or a recreated pod — provisions at that old size. Update the manifest and re-apply with `kubectl delete sts <name> --cascade=orphan` so the running pods survive."

      - alert: PvcAutoExpandFailing
        expr: sum by (namespace, claim) (increase(pvc_autoexpand_total{result="error"}[1h])) > 0
        for: 5m
        labels:
          severity: warning
          component: storage
          tenancy: platform
        annotations:
          summary: "PVC auto-expansion is erroring for {{ $labels.claim }}"
          description: "Expansion of {{ $labels.claim }} (namespace {{ $labels.namespace }}) failed in the last hour — RBAC, API reachability, or Redis being unavailable (expansion fails CLOSED without Redis, because there would be no cooldown and no cross-replica lock). The storage alerts will keep firing meanwhile; treat the volume as un-automated until this clears."

      # The ec2 counterpart of PvcAutoExpandAtCeiling. Louder by nature: this is
      # the one disk every hostPath mount on that target shares, so reaching the
      # ceiling means the databases, RustFS and the registry all stop together
      # when it fills, and nothing will grow it automatically any more.
      - alert: NodeDiskAutoExpandAtCeiling
        expr: max by (volume_id) (node_disk_autoexpand_at_ceiling) == 1
        for: 10m
        labels:
          severity: critical
          component: storage
          tenancy: platform
        annotations:
          summary: "Data volume {{ $labels.volume_id }} has hit its auto-expand ceiling"
          description: "Automatic expansion has stopped for {{ $labels.volume_id }}: it reached NODE_DISK_AUTOEXPAND_CEILING_MULTIPLE x the size first seen, or NODE_DISK_AUTOEXPAND_MAX_GI. Every hostPath mount on this instance shares this disk. Find what is writing before raising the ceiling — growth past 4x is usually an unarchived WAL or unrotated logs."

      # The volume grew and the filesystem did NOT. Separate from the failing
      # alert below because the remediation is different and manual: the extra
      # space is already paid for and unusable until someone resizes the
      # filesystem on the instance. It is also NOT covered by that alert, which
      # matches result="error" only — this outcome has its own label precisely
      # so a half-finished expansion cannot be read as a transient error.
      - alert: NodeDiskAutoExpandFilesystemPending
        expr: max by (volume_id) (node_disk_autoexpand_fs_pending) == 1
        for: 5m
        labels:
          severity: critical
          component: platform
          tenancy: platform
        annotations:
          summary: "Data volume {{ $labels.volume_id }} grew but its filesystem did not"
          description: "ModifyVolume succeeded and the SSM filesystem resize was never requested, so the disk is still full while the larger volume is being billed. Retrying cannot fix it: EBS refuses another modification for ~6h and the filesystem would still be the old size. Run PIPELINE_BUILDER_RESIZE_DOCUMENT against the instance, or resize2fs on it by hand, then confirm with `df -h /opt/pipeline`. Usual causes: the instance role lost ssm:SendCommand on that document, the SSM agent is not running, or the document is missing."

      # The backup that stopped running.
      #
      # The job posts to Alertmanager when it RUNS AND FAILS; this is the other
      # half — a CronJob that is suspended, deleted, or never scheduled reports
      # nothing at all, because nothing is left alive to report. The metric's
      # VALUE is the unix time of the last success, so this expression keeps
      # growing on its own with no participation from the job.
      #
      # 36h, not 24h: the schedule is daily at 03:00, so a one-night miss plus
      # a slow run must not page. Two consecutive misses will.
      #
      # INERT where nothing pushes it (minikube, docker, and eks/ec2 until the
      # backup image exists): no series, no data, no alert. That is the
      # deliberate cost of alert-rules.yml being one copy-set across targets —
      # and it means this rule cannot tell you the backup was never set up, only
      # that one which WAS running has stopped.
      - alert: DatabaseBackupStale
        expr: |
          time() - max(backup_last_success_timestamp_seconds) > 129600
        for: 30m
        labels:
          severity: critical
          component: storage
          tenancy: platform
        annotations:
          summary: "No successful database backup for {{ $value | humanizeDuration }}"
          description: "backup_last_success_timestamp_seconds has not advanced in over 36h, so the nightly Postgres + Mongo dump is not completing. Check: kubectl -n pipeline-builder get cronjob db-backup; kubectl -n pipeline-builder get jobs -l job-name --sort-by=.metadata.creationTimestamp | tail."

      - alert: NodeDiskAutoExpandFailing
        expr: sum (increase(node_disk_autoexpand_total{result="error"}[1h])) > 0
        for: 5m
        labels:
          severity: warning
          component: storage
          tenancy: platform
        annotations:
          summary: "Data-volume auto-expansion is erroring"
          description: "Growing the instance data volume failed in the last hour — IAM, IMDS reachability, the SSM document name, or Redis being unavailable (it fails CLOSED without Redis, because there would be no cooldown and no cross-replica lock). Treat the disk as un-automated until this clears."

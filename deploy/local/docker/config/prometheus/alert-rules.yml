# Alert rules for Pipeline Builder.
#
# Loaded by Prometheus via `rule_files` in prometheus.yml; firing alerts
# are forwarded to Alertmanager which routes by `severity` AND `tenancy`.
#
# Conventions:
# - `severity: critical` — pages on-call (Slack #ops-pager + future PD)
# - `severity: warning`  — non-paging Slack notification
# - `tenancy: org`       — alert carries an `org_id` label; relayed to that
#                          org's configured destinations (Slack webhook,
#                          in-app message, …) via the platform's webhook
#                          relay (POST /api/observability/alert-webhook).
# - `tenancy: platform`  — alert is platform-wide (no org_id, or the
#                          underlying metric isn't org-labeled); routed
#                          to the ops-team Slack channels.
# - `summary` is what shows in Slack; `description` adds detail.

groups:
  # Per-org rules — every firing alert carries an `org_id` label and is routed
  # to that org's notification destination(s) by the platform's alert-relay.
  # These rules `by (org_id)` the underlying counters; the receiver-side
  # alertmanager.yml uses `tenancy=org` to differentiate from platform alerts.
  - name: per-org
    rules:
      # operational follow-on: per-tenant Loki rate-cap breach.
      # Fires when Loki's distributor rejects log lines for a tenant
      # because they exceed the tenant's `ingestion_rate_mb` cap (set
      # via the `limits_config` block in loki-config.yml). Operators
      # should bump the limit before users notice missing logs. The
      # `tenant` label maps to the org's
      # uuid (set via promtail's `tenant` stage / fluent-bit's
      # `Tenant_ID_Key`); `org_id` is set equal to it via `label_replace`
      # so the per-org routing in alertmanager picks it up the same way
      # as the build-failure alert.
      - alert: LokiRateCapBreach
        expr: |
          label_replace(
            sum by (tenant) (rate(loki_discarded_samples_total{reason="rate_limited", tenant!="system"}[5m])) > 0,
            "org_id", "$1", "tenant", "(.+)"
          )
        for: 5m
        labels:
          severity: warning
          component: loki
          tenancy: org
        annotations:
          summary: "Loki dropping logs for org {{ $labels.org_id }} (rate cap breached)"
          description: "Loki rejected {{ $value | humanize }} lines/sec for the last 5 minutes. Bump the org's `ingestion_rate_mb` in loki-config.yml `limits_config`."

      - alert: PluginBuildFailureRateHigh
        # Per-org success-rate aggregation. `by (org_id)` produces one
        # series per org; alerts fire per org and carry that org_id label
        # which the relay routes on.
        expr: |
          (
            sum by (org_id) (rate(plugin_builds_total{status="success",org_id=~".+"}[5m]))
            /
            clamp_min(sum by (org_id) (rate(plugin_builds_total{org_id=~".+"}[5m])), 1)
          ) < 0.9
        for: 10m
        labels:
          severity: warning
          component: plugin
          tenancy: org
        annotations:
          summary: "Plugin build success rate below 90% for org {{ $labels.org_id }}"
          description: "5-min success rate is {{ $value | humanizePercentage }} over the last 10 minutes."

      # ---- Pipeline deploy / stage failures (DORA events, Phase 3b) ----
      # Fed by the reporting service's ingest metrics (scraped from the
      # reporting pod). `pipeline_deploy_result_total` is incremented per
      # deploy-stage execution the forwarder marks with an `environment`
      # (derived from the pipeline's `pb.deploys` tag); `result` is
      # succeeded|failed. `pipeline_stage_result_total` is the same, one
      # series per (pipeline, stage, environment).
      - alert: PipelineDeployFailed
        # A `production` deploy stage failed. This is the DORA headline signal
        # (deploy-time change failure), so it pages rather than warns. `increase`
        # over 5m fires on any new failure; `by (org_id)` routes to the org and
        # keeps one series per tenant.
        expr: |
          sum by (org_id) (increase(pipeline_deploy_result_total{environment="production",result="failed",org_id=~".+"}[5m])) > 0
        for: 0m
        labels:
          severity: critical
          component: pipeline
          tenancy: org
        annotations:
          summary: "Production deploy failed for org {{ $labels.org_id }}"
          description: "{{ $value | humanize }} production deploy-stage failure(s) in the last 5 minutes. Check the pipeline's deploy stage in CodePipeline."

      - alert: PipelineStageFailureRateHigh
        # Per-org stage success-rate aggregation across ALL stages (not just
        # deploys), mirroring PluginBuildFailureRateHigh. `by (org_id)` produces
        # one series per org; alerts fire per org and carry that org_id for
        # relay routing. Warns rather than pages — a broad-but-not-outage signal.
        expr: |
          (
            sum by (org_id) (rate(pipeline_stage_result_total{result="succeeded",org_id=~".+"}[5m]))
            /
            clamp_min(sum by (org_id) (rate(pipeline_stage_result_total{org_id=~".+"}[5m])), 1)
          ) < 0.9
        for: 10m
        labels:
          severity: warning
          component: pipeline
          tenancy: org
        annotations:
          summary: "Pipeline stage success rate below 90% for org {{ $labels.org_id }}"
          description: "5-min stage success rate is {{ $value | humanizePercentage }} over the last 10 minutes — inspect recent pipeline executions."

      # per-plugin variants of the org-wide alert above. The
      # `plugin_builds_total` counter carries `plugin_name` so groupings
      # `by (org_id, plugin_name)` produce one series per (org, plugin)
      # pair without a metric change. Thresholds are stricter than the
      # org-wide rules (80% vs 90% success, 25% timeout share) — a single
      # plugin going bad shouldn't have to drag the org's overall rate
      # under 90% before paging. Floor of `rate > 0.01` (≥3 builds per
      # 5min) prevents firing on plugins with only one or two builds
      # where a single failure trivially crosses the percentage gate.
      - alert: PluginBuildFailureRateHighPerPlugin
        expr: |
          (
            sum by (org_id, plugin_name) (rate(plugin_builds_total{status="success",org_id=~".+",plugin_name=~".+"}[5m]))
            /
            clamp_min(sum by (org_id, plugin_name) (rate(plugin_builds_total{org_id=~".+",plugin_name=~".+"}[5m])), 1)
          ) < 0.8
          and
          sum by (org_id, plugin_name) (rate(plugin_builds_total{org_id=~".+",plugin_name=~".+"}[5m])) > 0.01
        for: 15m
        labels:
          severity: warning
          component: plugin
          tenancy: org
        annotations:
          summary: "Plugin {{ $labels.plugin_name }} success rate below 80% for org {{ $labels.org_id }}"
          description: "Per-plugin 5-min success rate is {{ $value | humanizePercentage }} over the last 15 minutes — check plugin source or build environment."

      - alert: PluginBuildTimeoutRateHighPerPlugin
        # Most often a regression in the plugin's build script or a
        # dependency that's now resolving slowly. Same activity floor as
        # the failure-rate variant.
        expr: |
          (
            sum by (org_id, plugin_name) (rate(plugin_builds_total{status="timeout",org_id=~".+",plugin_name=~".+"}[5m]))
            /
            clamp_min(sum by (org_id, plugin_name) (rate(plugin_builds_total{org_id=~".+",plugin_name=~".+"}[5m])), 1)
          ) > 0.25
          and
          sum by (org_id, plugin_name) (rate(plugin_builds_total{org_id=~".+",plugin_name=~".+"}[5m])) > 0.01
        for: 15m
        labels:
          severity: warning
          component: plugin
          tenancy: org
        annotations:
          summary: "Plugin {{ $labels.plugin_name }} timing out for org {{ $labels.org_id }}"
          description: "{{ $value | humanizePercentage }} of recent builds timed out — check build complexity or dependency resolution times."

  # Platform-wide rules — metrics that aren't org-labeled (shared queue,
  # shared registry). Routed to the ops-team Slack channels.
  - name: platform-wide
    rules:
      # ---- Queue ----
      - alert: PluginQueueStalled
        expr: sum(plugin_queue_jobs{state="waiting"}) > 50
        for: 15m
        labels:
          severity: warning
          component: plugin
          tenancy: platform
        annotations:
          summary: "Plugin build queue depth above 50"
          description: "{{ $value }} jobs waiting for 15+ minutes — check worker health."

      - alert: PluginQueueProcessingSlow
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(plugin_job_wait_seconds_bucket[5m]))
          ) > 300
        for: 10m
        labels:
          severity: warning
          component: plugin
          tenancy: platform
        annotations:
          summary: "Plugin queue p95 wait > 5 minutes"
          description: "p95 job wait is {{ $value | humanizeDuration }}; consider scaling workers."

      - alert: DLQFilling
        expr: sum(plugin_queue_jobs{queue="plugin-build-dlq"}) > 10
        for: 5m
        labels:
          severity: critical
          component: plugin
          tenancy: platform
        annotations:
          summary: "Dead-letter queue has more than 10 jobs"
          description: "{{ $value }} jobs in the DLQ — these failed all retries and need triage."

      # ---- Registry ----
      # Uses the platform-wide `http_requests_total` counter (emitted by
      # api-server's metricsMiddleware), filtered to the image-registry
      # service via the `service` default label. No new metric needed.
      - alert: RegistryErrorBurst
        expr: sum(rate(http_requests_total{service="image-registry", status_code=~"5.."}[5m])) > 0
        for: 5m
        labels:
          severity: critical
          component: registry
          tenancy: platform
        annotations:
          summary: "Registry returning 5xx errors"
          description: "{{ $value | humanize }} 5xx/s over the last 5 minutes. Check image-registry logs."

      # ---- Quota ----
      # `quota_fail_open_total` is incremented by api-core's quota client
      # every time the quota service is unreachable or returns non-ok and
      # the caller proceeds with a "fail-open allowed" result. A small
      # number of these is normal (transient network blips). A SUSTAINED
      # rate means quota is effectively disabled across the fleet — every
      # org is unlimited and noisy-neighbor protection is off — until
      # the quota service is restored. Critical because the financial /
      # abuse-prevention impact compounds with time.
      - alert: QuotaServiceFailOpenSustained
        expr: sum(rate(quota_fail_open_total[5m])) > 0.1
        for: 10m
        labels:
          severity: critical
          component: quota
          tenancy: platform
        annotations:
          summary: "Quota service has been failing open for 10+ minutes"
          description: "{{ $value | humanize }} fail-open events/sec averaged over 5m. The quota service is unreachable or unhealthy — every quota check is returning 'allowed' regardless of actual usage. Investigate the quota service before noisy orgs exhaust shared resources."

      # ---- Audit durability (security log) ----
      # The audit trail is compliance-relevant, so losing it must PAGE. Two loss
      # points, both already instrumented but previously unalerted:
      #   * audit_dropped_total — the remote-audit client exhausted all retries
      #     for an event and dropped it.
      #   * audit_spool_dropped_total — the durable Redis spool overflowed and
      #     trimmed its OLDEST entries to stay bounded (platform down long enough
      #     that buffered audit events aged out before they could flush).
      # Any sustained drop is a security-log gap.
      - alert: AuditEventsDropped
        expr: sum(rate(audit_dropped_total[5m])) > 0
        for: 5m
        labels:
          severity: critical
          component: audit
          tenancy: platform
        annotations:
          summary: "Audit events are being dropped (security log gap)"
          description: "{{ $value | humanize }} audit events/sec dropped by the remote-audit client over 5m — the tamper-evident audit trail is losing records. Investigate platform audit ingest before the gap widens."

      - alert: AuditSpoolDropped
        expr: sum(rate(audit_spool_dropped_total[5m])) > 0
        for: 5m
        labels:
          severity: critical
          component: audit
          tenancy: platform
        annotations:
          summary: "Durable audit spool is overflowing (oldest events dropped)"
          description: "{{ $value | humanize }} spooled audit events/sec trimmed over 5m — the platform has been unreachable long enough that buffered audit events are aging out. Restore audit ingest; the spool is shedding the oldest security records."

      # ---- Storage & event delivery leftovers ----
      # message_attachment_blob_orphans_total: a purge deleted message rows but
      # could not delete some attachment blobs (orphans in object storage).
      # event_bus_dead_lettered_total: a durable event exhausted its deliveries
      # and moved to the `evt:<topic>:dlq` stream (e.g. an entitlement sync that
      # kept failing). Neither loses user data; both need an operator.
      - alert: MessageAttachmentBlobOrphans
        expr: sum(increase(message_attachment_blob_orphans_total[1h])) > 0
        for: 0m
        labels:
          severity: warning
          component: message
          tenancy: platform
        annotations:
          summary: "Message attachment blobs were orphaned by a purge"
          description: "{{ $value | humanize }} attachment blobs could not be deleted in the last hour — they remain in object storage with no row pointing at them. Check the message service logs for the failed keys and object-storage errors."

      - alert: EventBusDeadLettered
        expr: sum by (topic) (increase(event_bus_dead_lettered_total[1h])) > 0
        for: 0m
        labels:
          severity: warning
          component: event-bus
          tenancy: platform
        annotations:
          summary: "Durable events moved to the dead-letter stream"
          description: "{{ $value | humanize }} events on topic {{ $labels.topic }} exhausted their deliveries in the last hour and were dead-lettered to evt:{{ $labels.topic }}:dlq. The consumer kept failing — investigate, then replay or discard them."

      # ---- Billing → entitlement/quota sync ----
      # billing_quota_sync_failed_total: a subscription/entitlement change failed
      # to propagate to the quota service (the org's effective limits now lag its
      # plan). billing_entitlement_drift_total: the periodic reconciler found the
      # stored entitlement disagreeing with the source of truth. Both are money /
      # capability-correctness signals — warn (not page): they self-heal on the
      # next sync/reconcile, but a SUSTAINED rate means the leg is stuck.
      - alert: BillingQuotaSyncFailing
        expr: sum(rate(billing_quota_sync_failed_total[5m])) > 0
        for: 15m
        labels:
          severity: warning
          component: billing
          tenancy: platform
        annotations:
          summary: "Billing → quota sync failing"
          description: "{{ $value | humanize }} sync failures/sec over 5m sustained for 15m — plan changes are not reaching the quota service, so orgs' effective limits lag their subscriptions. Check the billing→quota sync leg."

      - alert: BillingEntitlementDriftSustained
        expr: sum(rate(billing_entitlement_drift_total[15m])) > 0
        for: 30m
        labels:
          severity: warning
          component: billing
          tenancy: platform
        annotations:
          summary: "Billing entitlement drift persisting"
          description: "The entitlement reconciler keeps finding stored entitlements out of sync with the source of truth ({{ $value | humanize }}/sec over 15m, sustained 30m). Usually self-heals; a persistent signal means a sync leg is stuck — inspect the reconciler logs."

      # ---- Auth: failed-login burst (credential stuffing / brute force) ----
      # platform_logins_failed_total is a platform-wide counter (no per-IP/org
      # label), so this is a coarse "someone is hammering login" signal. Warn on a
      # sustained elevated rate; investigate source IPs at the ALB/WAF.
      - alert: LoginFailureBurst
        expr: sum(rate(platform_logins_failed_total[5m])) > 1
        for: 10m
        labels:
          severity: warning
          component: auth
          tenancy: platform
        annotations:
          summary: "Elevated failed-login rate (possible brute force)"
          description: "{{ $value | humanize }} failed logins/sec over 5m sustained for 10m — possible credential stuffing/brute force. Check source IPs at the ALB/WAF and consider rate-limiting or lockout."

      # ---- Generic app 5xx burst ----
      # image-registry has its own faster RegistryErrorBurst above; this covers
      # every OTHER app service via the shared http_requests_total counter
      # (emitted by api-server's metricsMiddleware, `service` default label).
      # One series per service so the page names the culprit.
      - alert: ServiceError5xxBurst
        expr: sum by (service) (rate(http_requests_total{service!="image-registry", status_code=~"5.."}[5m])) > 0.1
        for: 10m
        labels:
          severity: critical
          component: api
          tenancy: platform
        annotations:
          summary: "Service {{ $labels.service }} returning 5xx errors"
          description: "{{ $value | humanize }} 5xx/s from {{ $labels.service }} over 5m sustained for 10m — check that service's logs and dependencies."

      # ---- S2S circuit breaker ----
      # s2s_circuit_opened_total increments when the shared InternalHttpClient trips
      # a target's breaker open (≥ threshold consecutive failures) and starts fast-
      # failing to shed load. Firing means a downstream dependency is in a sustained
      # brownout — callers are load-shedding instead of piling on retries.
      - alert: ServiceCircuitOpen
        expr: sum by (target) (increase(s2s_circuit_opened_total[5m])) > 0
        for: 0m
        labels:
          severity: warning
          component: api
          tenancy: platform
        annotations:
          summary: "S2S circuit opened for {{ $labels.target }}"
          description: "The circuit breaker to {{ $labels.target }} opened {{ $value | humanize }} time(s) in 5m — that downstream is in a sustained brownout and callers are shedding load. Check {{ $labels.target }}'s health."

      # ---- Token revocation degradation ----
      # token_revocation_fail_open_total increments when a Redis-backed revocation
      # read errors and the check fails OPEN. While sustained, forced logouts and
      # privilege revocations silently stop taking effect until natural token expiry.
      - alert: TokenRevocationFailingOpen
        expr: sum(rate(token_revocation_fail_open_total[5m])) > 0.1
        for: 10m
        labels:
          severity: critical
          component: auth
          tenancy: platform
        annotations:
          summary: "Token revocation is failing open"
          description: "{{ $value | humanize }} revocation read failures/sec over 5m sustained for 10m — forced logouts / privilege revocations are NOT taking effect until token expiry. Restore the revocation Redis."

      # ---- AI provider errors ----
      # ai_requests_total{outcome="error"} increments on a failed AI turn (provider
      # brownout, bad key, timeout). A burst usually means a provider-side outage.
      - alert: AIProviderErrorBurst
        expr: sum by (provider) (rate(ai_requests_total{outcome="error"}[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
          component: ai
          tenancy: platform
        annotations:
          summary: "AI provider {{ $labels.provider }} erroring"
          description: "{{ $value | humanize }} failed AI turns/sec for provider {{ $labels.provider }} over 5m sustained for 10m — likely a provider brownout or credential issue. Check the ask/generation logs."

# =============================================================================
# Promtail Configuration — Docker Container Log Collection
# =============================================================================
# Discovers containers via Docker socket and ships logs to Loki.
# Docs: https://grafana.com/docs/loki/latest/send-data/promtail/configuration/

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    # Fallback tenant for anything the pipeline did not route (see the
    # `tenant` stage). Sysadmin-only; tenants never read it.
    tenant_id: _infra

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ['com.docker.compose.project']
    relabel_configs:
      # Extract container name (strip leading /)
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      # Compose service name
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
      # Compose project name
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: compose_project
      # Image name
      - source_labels: ['__meta_docker_container_image']
        target_label: image
      # Drop Promtail's own logs to avoid recursion
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: promtail
        action: drop
    pipeline_stages:
      # Unwrap Docker JSON log wrapper
      - docker: {}
      # Parse structured JSON logs from API services
      - json:
          expressions:
            level: level
            service_name: service
            msg: message
            ts: timestamp
            # Audit-event fields — extracted so they survive the
            # `output.source: msg` rewrite below and become queryable
            # in the native Observability dashboards via stream selectors.
            eventCategory: eventCategory
            event: event
            actor: actor
            # Plugin-build drill-down: pluginName is promoted only on lines
            # that have it (most logs don't), keeping cardinality bounded to
            # the count of distinct plugin names that have built recently.
            pluginName: pluginName
            # orgId drives log tenancy (promtail `tenant` stage below).
            orgId: orgId
      # Promote parsed fields to Loki labels. `eventCategory` is low-cardinality
      # ('audit' or 'plugin-build' or absent); `event` is bounded (~tens of
      # distinct names like `registry.tag.copy`, `completed`, `failed`); `actor`
      # is O(100s) per org (users + service principals). `pluginName` is bounded
      # by # of plugins that have logged a build event. All stay below Loki's
      # recommended label-cardinality ceiling. Digest fields are intentionally
      # NOT promoted (per-event unique = unbounded cardinality).
      - labels:
          level:
          service_name:
          eventCategory:
          event:
          actor:
          pluginName:
      # Promote orgId as structured metadata: indexed and filterable, but NOT a
      # stream label — org count is unbounded and a label would multiply streams.
      - structured_metadata:
          orgId:
      # Route each line to its org's Loki tenant. Tenancy is PHYSICAL (see
      # docs/observability-logs.md): a query-construction bug cannot leak
      # across orgs, and per-tenant retention/deletion become possible.
      #
      # The template is not optional. promtail's `tenant` stage leaves the tenant
      # EMPTY when its source field is missing — it does not fall back — so lines
      # written outside a request scope (startup, workers, nginx/postgres) would
      # ship with no tenant. Default them to the sysadmin-only `_infra` tenant.
      - template:
          source: tenant_id
          template: '{{ if .orgId }}{{ .orgId }}{{ else }}_infra{{ end }}'
      - tenant:
          source: tenant_id
      # Use the parsed message as the log line (falls back to raw if parsing fails)
      - output:
          source: msg
      # Ingest-time masking (L3) — the AUTHORITATIVE layer. Masking only at
      # read time would leave the secret in Loki and still matchable, so a
      # user could confirm a guess from whether a search hit. Generated from
      # api-core's SENSITIVE_VALUE_PATTERNS; run scripts/gen-promtail-masking.mjs.
      # BEGIN generated-masking (scripts/gen-promtail-masking.mjs) — do not edit by hand
      # pem_private_key: Node-side only (needs lookaround / spans lines; RE2 cannot express it)
      # pem_private_key_header
      - replace:
          expression: '-----BEGIN[A-Z ]*PRIVATE KEY-----'
          replace: '[REDACTED]'
      # jwt
      - replace:
          expression: 'eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]*'
          replace: '[REDACTED]'
      # bearer_token
      - replace:
          expression: '(?i)bearer\s+[A-Za-z0-9._~+/-]+=*'
          replace: 'Bearer [REDACTED]'
      # aws_access_key_id
      - replace:
          expression: '\b(A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA)[A-Z0-9]{16}\b'
          replace: '[REDACTED]'
      # stripe_key
      - replace:
          expression: '\b(sk|rk)_(live|test)_[A-Za-z0-9]{10,}\b'
          replace: '[REDACTED]'
      # github_token
      - replace:
          expression: '\bgh[pousr]_[A-Za-z0-9]{20,}\b'
          replace: '[REDACTED]'
      # github_fine_grained_pat
      - replace:
          expression: '\bgithub_pat_[A-Za-z0-9_]{20,}\b'
          replace: '[REDACTED]'
      # gitlab_token
      - replace:
          expression: '\bglpat-[A-Za-z0-9_-]{20,}\b'
          replace: '[REDACTED]'
      # slack_token
      - replace:
          expression: '\bxox[abprs]-[A-Za-z0-9-]{10,}\b'
          replace: '[REDACTED]'
      # url_credentials
      - replace:
          expression: '([a-zA-Z][a-zA-Z0-9+.-]*://)[^:@/\s]+:[^@/\s]+@'
          replace: '$1[REDACTED]@'
      # url_secret_param
      - replace:
          expression: '(?i)([?&](access[_-]?token|api[_-]?key|apikey|auth|password|secret|sig|signature|token)=)[^&\s"''<>]+'
          replace: '$1[REDACTED]'
      # inline_secret_assignment
      - replace:
          expression: '(?i)(((aws_)?(secret_access_key|client_secret|api[_-]?key|apikey|password|passwd|secret|token))"?\s*[=:]\s*"?)[^\s"'',;}&]+'
          replace: '$1[REDACTED]'
      # END generated-masking

# Docker Registry (distribution v3) — S3 storage driver pointed at RustFS.
#
# The base registry:3 image ships a config.yml that uses the FILESYSTEM driver;
# mounting this file replaces it so the single active storage driver is `s3`
# (you can't have both — the registry errors on multiple drivers). Auth (token)
# and the delete flag stay ENV-driven (REGISTRY_AUTH_TOKEN_* / REGISTRY_STORAGE_
# DELETE_ENABLED) so the realm can vary per environment; the S3 credentials come
# from env too (REGISTRY_STORAGE_S3_ACCESSKEY / _SECRETKEY) to keep them out of
# this file.
version: 0.1
log:
  level: info
  fields:
    service: registry
storage:
  cache:
    blobdescriptor: inmemory
  s3:
    region: us-east-1
    regionendpoint: http://rustfs:9000
    bucket: registry
    # Path-style + plain HTTP: RustFS has no per-bucket virtual-host DNS and
    # serves HTTP on the internal network.
    forcepathstyle: true
    secure: false
    rootdirectory: /
  # Stream blobs THROUGH the registry rather than 302-redirecting to the S3
  # (RustFS) endpoint — matching ec2/eks. A container runtime follows that
  # redirect fine, which is why it looked unnecessary locally, but the Registry
  # browser is not a pull: image-registry fetches the CONFIG blob itself to
  # render a tag, and the redirected read resets ("Config blob unavailable").
  redirect:
    disable: true
http:
  addr: 0.0.0.0:5000
  debug:
    addr: 0.0.0.0:5001

---
# =============================================================================
# Redis — ingress from every service that embeds a Redis client. (Refreshed:
# the old policy allowed only `plugin`, but the shared api-server layer uses
# Redis for health/idempotency/SSE and each service runs its own BullMQ/queue
# client — so pipeline/reporting/message/compliance/image-registry/quota/billing
# and platform all connect. Matches the Istio AuthorizationPolicy in istio.yaml.)
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-ingress
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [platform, pipeline, plugin, message, quota, billing, compliance, reporting, image-registry, ask]
      ports:
        - port: 6379

---
# =============================================================================
# Registry — ingress from plugin, image-registry, nginx
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-registry-ingress
spec:
  podSelector:
    matchLabels:
      app: registry
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [plugin, plugin-quarantine-builder, image-registry, nginx]
      ports:
        - port: 5000

---
# =============================================================================
# Loki — ingress from promtail (push), platform (Logs / Audit Activity reads),
# grafana (the Loki datasource) and prometheus (Loki's own /metrics). NEVER from
# plugin / plugin-quarantine-builder: tenant log streams are readable by anyone
# who can reach Loki with a guessed X-Scope-OrgID.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-loki-ingress
spec:
  podSelector:
    matchLabels:
      app: loki
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [promtail, platform, grafana, prometheus]
      ports:
        - port: 3100

---
# =============================================================================
# Prometheus — ingress from platform (native Observability dashboards), grafana
# (datasource), prometheus itself (self-scrape) and KEDA (plugin ScaledObject)
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-ingress
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [platform, grafana, prometheus]
        # KEDA's metrics-adapter scrapes Prometheus on every polling
        # cycle for the plugin ScaledObject's `type: prometheus` trigger.
        # `kubernetes.io/metadata.name` is the auto-injected label on
        # every Namespace (k8s 1.21+) so we don't depend on KEDA's own
        # pod labels staying stable across upstream releases.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keda
      ports:
        - port: 9090
    # Thanos querier reaches the sidecar StoreAPI (gRPC) to serve recent blocks.
    - from:
        - podSelector:
            matchLabels:
              app: thanos-query
      ports:
        - port: 10901

---
# =============================================================================
# Thanos querier — ingress from platform (native Observability query path via
# PROMETHEUS_URL=http://thanos-query:9090). Egress (to prometheus sidecar +
# store-gateway StoreAPIs) is unrestricted by the Ingress-only default-deny.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-thanos-query-ingress
spec:
  podSelector:
    matchLabels:
      app: thanos-query
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [platform, grafana, prometheus]
      ports:
        - port: 9090

---
# =============================================================================
# Thanos store-gateway — ingress from the querier (StoreAPI gRPC) for archived
# blocks. It reads the blocks themselves from MinIO (allowed via the minio
# ingress policy above).
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-thanos-store-gateway-ingress
spec:
  podSelector:
    matchLabels:
      app: thanos-store-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: thanos-query
      ports:
        - port: 10901
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - port: 10902

---
# =============================================================================
# Alertmanager — ingress from prometheus (alert forwarding) and platform
# (proxied /api/observability/alerts read API)
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alertmanager-ingress
spec:
  podSelector:
    matchLabels:
      app: alertmanager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
        - podSelector:
            matchLabels:
              app: platform
      ports:
        - port: 9093

---
# =============================================================================
# Admin UIs — ingress from nginx
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-admin-uis-ingress
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [pgadmin, mongo-express]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: nginx
      # Real POD ports (NetworkPolicy gates the destination pod port, not the
      # Service port): pgadmin listens on 8080, mongo-express on 8081.
      ports:
        - port: 8080
        - port: 8081

---
# =============================================================================
# Prometheus Scraping — prometheus may reach EVERY pod in the namespace on the
# metrics ports the pods declare (prometheus.io/port). One policy for all of them:
# the old per-app list missed every exporter (postgres 9187, pgbouncer 9127,
# mongodb 9216, redis 9121, minio 9000, thanos 10902, jaeger 14269, promtail
# 9080), so default-deny-ingress dropped those scrapes on any enforcing CNI and
# ServiceDown fired for healthy datastores. test/deploy-contracts/test/network-
# contract.test.ts asserts every scrape-annotated pod is covered here AND by
# its mesh AuthorizationPolicy.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scraping
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - port: 3000
        - port: 3100
        - port: 8443
        - port: 9000
        - port: 9080
        - port: 9090
        - port: 9093
        - port: 9121
        - port: 9127
        - port: 9187
        - port: 9216
        - port: 10902
        - port: 14269

---
# =============================================================================
# DNS Egress — all pods need DNS resolution
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

---
# =============================================================================
# Internal Egress — allow pods to communicate within the namespace
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-egress
spec:
  # Every pod EXCEPT the anonymous-submission quarantine builder (see
  # allow-plugin-quarantine-builder-egress at the end of this file). NotIn also
  # matches pods with no `app` label, so this is `{}` minus exactly that pod.
  podSelector:
    matchExpressions:
      - key: app
        operator: NotIn
        values: [plugin-quarantine-builder]
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector: {}

---
# =============================================================================
# Plugin External Egress — plugin pulls base images + dependency packages
#
# Public-internet 443/80 is allowed (builds legitimately fetch from pypi.org,
# npmjs.org, ghcr.io, quay.io, public.ecr.aws, and arbitrary git hosts) but
# explicitly block known exfil targets via `except` blocks (the shared shape —
# see EGRESS SHAPE near the end of this file):
# - 169.254.169.254/32 + 169.254.170.0/24: cloud metadata + container-credential
#   agents. A compromised build cannot exfil IAM credentials this way.
# - RFC1918 + 100.64.0.0/10: the VPC / node network, LANs, CGNAT.
#
# Cluster-internal traffic (registry, redis, postgres) is allowed by the
# `allow-internal-egress` policy above (matches every pod in the namespace).
#
# True per-org allow-lists require either Cilium NetworkPolicy (CIDR + DNS-
# aware) or kernel-level isolation via per-org buildkitd workers.
# This rule is defense-in-depth on top of those (cilium-network-policies.yaml
# carries the per-org FQDN layer where Cilium is the CNI).
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-plugin-external-egress
spec:
  podSelector:
    matchLabels:
      app: plugin
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8 # RFC1918 — the VPC / node network itself
              - 172.16.0.0/12 # RFC1918
              - 192.168.0.0/16 # RFC1918 — private LAN
              - 100.64.0.0/10 # CGNAT (some cloud / VPN deployments)
              - 169.254.169.254/32 # IMDS (instance-role credentials)
              - 169.254.170.0/24 # container-credential endpoints (ECS .2, EKS Pod Identity .23)
      ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP

---
# =============================================================================
# Billing External Egress — billing calls the external payment provider
# (api.stripe.com; AWS Marketplace metering for the marketplace provider).
#
# A rule with no `to:` means "every destination" in NetworkPolicy — billing
# could then open 443 to the VPC's internal services and the Kubernetes API
# server. So it names 0.0.0.0/0 explicitly and carves out every private range,
# leaving only the public internet — where Stripe actually is.
#
# The carve-out does NOT cut billing off from the rest of the stack: in-namespace
# traffic (postgres, redis, quota, platform) is allowed by `allow-internal-egress`
# above and DNS by `allow-dns-egress`, and NetworkPolicies are additive — an
# `except` in THIS rule cannot subtract from what another rule allows.
#
# The ipBlock is the shared public-egress shape (see EGRESS SHAPE below).
# FQDN-scoping (stripe-only) needs Cilium — see cilium-network-policies.yaml.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-billing-external-egress
spec:
  podSelector:
    matchLabels:
      app: billing
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8 # RFC1918 — the VPC / node network itself
              - 172.16.0.0/12 # RFC1918
              - 192.168.0.0/16 # RFC1918 — private LAN
              - 100.64.0.0/10 # CGNAT (some cloud / VPN deployments)
              - 169.254.169.254/32 # IMDS (instance-role credentials)
              - 169.254.170.0/24 # container-credential endpoints (ECS .2, EKS Pod Identity .23)
      ports:
        - port: 443
          protocol: TCP

---
# =============================================================================
# Platform External Egress — platform performs server-side OAuth token
# exchanges (oauth2.googleapis.com, GitHub, …) for social sign-in / onboarding.
# The namespace is ambient-enrolled, so this egress is subject to NetworkPolicy;
# with no allow rule the CNI SILENTLY DROPS the SYN and the OAuth client hangs
# until its connect timeout, then fails (looks like a ztunnel stall — it isn't).
# Platform also fetches USER-SUPPLIED URLs — per-org alert webhook destinations,
# OIDC discovery documents, SAML IdP metadata — so an attacker who can set one of
# those controls the destination. That makes this rule the SSRF backstop, and it
# therefore carves out EVERY private range (all of RFC1918, not just 192.168/16)
# plus link-local/IMDS and CGNAT: a crafted URL cannot pivot to an
# in-VPC service or to 169.254.169.254, and platform holds the JWT-signing
# secrets that would make such a pivot expensive.
#
# What is left is the public internet, which is where everything platform
# legitimately calls lives: OAuth/OIDC IdPs (accounts.google.com,
# login.microsoftonline.com, graph.facebook.com, api.linkedin.com, gitlab.com,
# Cognito), SES, HIBP (api.pwnedpasswords.com) and the FIDO MDS blob
# (mds.fidoalliance.org) on 443; SMTP submission (587/465/25) for
# EMAIL_PROVIDER=smtp; and IMDS (169.254.169.254:80), where the AWS SDK picks up the instance role
#   (this target has no per-pod identity) for SES / KMS token signing.
# In-namespace traffic is unaffected — it is allowed by
# `allow-internal-egress`, and NetworkPolicies are additive.
# FQDN-scoping (per-IdP) needs Cilium — see cilium-network-policies.yaml.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-platform-external-egress
spec:
  podSelector:
    matchLabels:
      app: platform
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32 # EC2 instance metadata (instance-role creds)
      ports:
        - port: 80
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8 # RFC1918 — the VPC / node network itself
              - 172.16.0.0/12 # RFC1918
              - 192.168.0.0/16 # RFC1918 — private LAN
              - 100.64.0.0/10 # CGNAT (some cloud / VPN deployments)
              - 169.254.169.254/32 # IMDS (instance-role credentials)
              - 169.254.170.0/24 # container-credential endpoints (ECS .2, EKS Pod Identity .23)
      ports:
        - port: 443
          protocol: TCP
        - port: 587
          protocol: TCP
        - port: 465
          protocol: TCP
        - port: 25
          protocol: TCP

---
# =============================================================================
# Promtail & Prometheus Kube API Egress — service discovery needs API access
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kube-api-egress
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [promtail, prometheus]
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 6443
          protocol: TCP
        - port: 443
          protocol: TCP
        - port: 10250
          protocol: TCP

# =============================================================================
# Plugin egress — governed by the policies ABOVE (VPC CNI = standard NetworkPolicy)
# =============================================================================
# A former `plugin-build-isolation` policy was removed here. It tried to NARROW
# plugin egress, but k8s NetworkPolicies are purely ADDITIVE — its `- to: []`
# rule on 443/80 re-opened egress to ALL destinations (including 169.254.169.254
# / IMDS on port 80), DEFEATING the link-local exception in
# `allow-plugin-external-egress`. Plugin egress is now governed by:
#   - allow-dns-egress           (DNS, all pods)
#   - allow-internal-egress      (in-namespace pods: registry, postgres, redis, …)
#   - allow-plugin-external-egress (public 443/80, EXCEPT link-local/LAN/CGNAT —
#                                  so a compromised build can't reach cloud metadata)
# True FQDN-level egress allow-listing (per-registry/per-package) is NOT
# expressible in standard NetworkPolicy / the VPC CNI — it needs Cilium; see
# cilium-network-policies.yaml (opt-in, not in this kustomization).

---
# =============================================================================
# MinIO — ingress on the S3 API from the services that use it + the bootstrap
# Job. Without this, default-deny-ingress blocks message/registry from reaching
# minio:9000 and attachments + the registry backend fail.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-minio-from-services
spec:
  podSelector:
    matchLabels:
      app: minio
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [message, platform, registry, minio-init, loki, prometheus, minio, thanos-store-gateway, thanos-compact]
      ports:
        - port: 9000
---
# =============================================================================
# Ask agent -> pipeline (token-forwarded propose/list). Without this, default-deny
# drops ask->pipeline and the agent's create-pipeline drafts fail.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pipeline-from-ask
spec:
  podSelector:
    matchLabels:
      app: pipeline
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ask
      ports:
        - port: 3000
---
# =============================================================================
# Ask agent -> plugin (token-forwarded propose). Without this, default-deny drops
# ask->plugin and the agent's create-plugin drafts fail.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-plugin-from-ask
spec:
  podSelector:
    matchLabels:
      app: plugin
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ask
      ports:
        - port: 3000
---
# =============================================================================
# image-registry -> plugin (GET /internal/plugins/public-names): the parent
# org's public plugin set a team's registry token may pull (E22). Without this,
# default-deny drops the read and every team parent-pull fails closed.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-plugin-from-image-registry
spec:
  podSelector:
    matchLabels:
      app: plugin
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: image-registry
      ports:
        - port: 3000
---
# prometheus -> the Istio mesh components in istio-system (scrape only).
#
# REQUIRED for the `istio-mesh` scrape job in config/prometheus/prometheus.yml.
# Every pod in this namespace is egress-restricted the moment `allow-dns-egress`
# / `allow-internal-egress` exist (both use an EMPTY podSelector), and neither
# covers this: `allow-internal-egress` is `to: [{podSelector: {}}]`, which is
# SAME-NAMESPACE only, and the mesh components live in istio-system.
#
# PORTS-ONLY, deliberately: no `to:` selector. The destinations are pod IPs in
# istio-system — RFC1918 on a VPC CNI — so the public-egress ipBlock (see EGRESS
# SHAPE below) would exclude exactly them; the ports are what bound this rule. 15020 = ztunnel, 15014 = istiod + istio-cni-node.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-mesh-scrape
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 15020
          protocol: TCP
        - port: 15014
          protocol: TCP

---
# waypoint -> istiod xDS (istio-system).
#
# WITHOUT THIS THE WHOLE STACK IS UNREACHABLE. `allow-dns-egress` and
# `allow-internal-egress` both use an EMPTY podSelector, so every pod in this
# namespace is egress-restricted, and `allow-internal-egress` is
# `to: [{podSelector: {}}]` — SAME-NAMESPACE only. istiod lives in istio-system,
# so the waypoint's xDS stream is denied: it comes up with NO configuration and
# answers every routed request with Envoy's `no healthy upstream` (HTTP 503),
# while the backing pods are perfectly healthy and Ready. ztunnel is unaffected
# (it runs in istio-system on the host network), which makes the failure look
# like an app problem rather than a mesh one.
#
# PORTS-ONLY, deliberately — same rationale as allow-prometheus-mesh-scrape
# above: istiod's pod IPs are cluster-internal (RFC1918), so a public-egress
# ipBlock would exclude them.
# 15012 = istiod xDS/CA (the one that matters); 15014 = istiod metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-waypoint-xds
spec:
  podSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-class-name: istio-waypoint
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 15012
          protocol: TCP
        - port: 15014
          protocol: TCP

---
# =============================================================================
# Quarantine builder (anonymous plugin submissions)
# =============================================================================
# plugin-quarantine-builder runs Dockerfile RUN steps from ANONYMOUS uploads.
# It may reach only: DNS (allow-dns-egress), the in-cluster registry (push
# quarantine/<id>, pull base images through the mirror), image-registry's /token
# realm (via the pb-waypoint, which fronts that Service — the waypoint then
# refuses it every other path and every other Service, istio-internal-routes.yaml)
# and public package mirrors. `allow-internal-egress` above EXCLUDES it: policies
# are additive, so leaving it matched there would re-open postgres, redis, minio,
# platform … to anonymous code no matter what this rule says.
#
# 15008 is the ambient HBONE port every in-mesh hop actually lands on; 5000/3000
# are the real ports for a CNI that sees un-tunnelled traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-plugin-quarantine-builder-egress
spec:
  podSelector:
    matchLabels:
      app: plugin-quarantine-builder
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [registry, image-registry]
        - podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-class-name: istio-waypoint
      ports:
        - port: 5000
          protocol: TCP
        - port: 3000
          protocol: TCP
        - port: 15008
          protocol: TCP
    # Package mirrors: public 443/80 only, with the same carve-outs as
    # allow-plugin-external-egress (no IMDS / Pod Identity agent, no VPC, no LAN).
    # The FQDN allow-list is the Cilium layer (cilium-network-policies.yaml).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8 # RFC1918 — the VPC / node network itself
              - 172.16.0.0/12 # RFC1918
              - 192.168.0.0/16 # RFC1918 — private LAN
              - 100.64.0.0/10 # CGNAT (some cloud / VPN deployments)
              - 169.254.169.254/32 # IMDS (instance-role credentials)
              - 169.254.170.0/24 # container-credential endpoints (ECS .2, EKS Pod Identity .23)
      ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP

---
# Ingress: the plugin pod (buildctl → tcp://plugin-quarantine-builder:1234) and
# nothing else. Under ambient the hop arrives on 15008 (allow-ambient-hbone) and
# the plugin-quarantine-builder-allow AuthorizationPolicy (istio.yaml) is what
# restricts it to sa/plugin.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-plugin-quarantine-builder-ingress
spec:
  podSelector:
    matchLabels:
      app: plugin-quarantine-builder
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: plugin
      ports:
        - port: 1234
          protocol: TCP

---
# =============================================================================
# Thanos compactor — ingress from prometheus only (its /metrics on 10902). It
# serves nothing else; its work is outbound to MinIO.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-thanos-compact-ingress
spec:
  podSelector:
    matchLabels:
      app: thanos-compact
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - port: 10902

---
# =============================================================================
# EGRESS SHAPE — one form for every public-internet egress rule in this file
# =============================================================================
# Every "to the public internet" rule below uses the SAME ipBlock:
#
#   cidr: 0.0.0.0/0
#   except: RFC1918 (10/8, 172.16/12, 192.168/16), CGNAT (100.64/10),
#           169.254.169.254/32 (IMDS), 169.254.170.0/24 (ECS/EKS credential agents)
#
# It excepts the METADATA / CREDENTIAL addresses exactly, NOT the whole
# 169.254.0.0/16 link-local range. That distinction is the resolution of an old
# contradiction in these manifests: ask-model.yaml recorded that excepting
# 169.254.0.0/16 severed its TLS under Istio ambient (ztunnel/istio-cni use
# link-local addresses such as 169.254.7.127 on the node side), while the
# platform/billing rules carried that very carve-out and reached the internet.
# The narrow carve-out is correct under either reading: nothing ambient uses
# sits in 169.254.169.254/32 or 169.254.170.0/24, and those are the only
# link-local addresses that hand out credentials. A workload that legitimately
# needs its credential endpoint gets a separate /32 rule on :80 — additive, so
# it re-opens exactly that address for exactly that pod.
#
# NetworkPolicies are purely ADDITIVE: an `except` narrows ITS OWN rule and can
# never subtract from what another policy allows. In-namespace hops are allowed
# by allow-internal-egress; mesh hops to istio-system are ports-only (their
# destinations are cluster pod IPs, which ARE RFC1918 on a VPC CNI).
# FQDN-scoping needs Cilium — see cilium-network-policies.yaml.
# =============================================================================
# Alertmanager External Egress — Slack incoming webhooks (hooks.slack.com:443).
# WITHOUT THIS EVERY OPS ALERT IS DROPPED: allow-dns-egress/allow-internal-egress
# make every pod here egress-restricted, so the Slack POST's SYN is silently
# dropped by the CNI, Alertmanager logs one "context deadline exceeded" line per
# notification, and the monitoring looks healthy precisely while it pages no one.
# (The per-org relay to platform:3000 is in-namespace — allow-internal-egress.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alertmanager-external-egress
spec:
  podSelector:
    matchLabels:
      app: alertmanager
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8 # RFC1918 — the VPC / node network itself
              - 172.16.0.0/12 # RFC1918
              - 192.168.0.0/16 # RFC1918 — private LAN
              - 100.64.0.0/10 # CGNAT (some cloud / VPN deployments)
              - 169.254.169.254/32 # IMDS (instance-role credentials)
              - 169.254.170.0/24 # container-credential endpoints (ECS .2, EKS Pod Identity .23)
      ports:
        - port: 443
          protocol: TCP

---
# =============================================================================
# Pipeline External Egress — CodePipeline API (Start/Stop/GetPipelineState) and
# the git-provider APIs pipeline registration calls, over 443; plus
# IMDS (169.254.169.254:80), where the AWS SDK picks up the instance role
#   (this target has no per-pod identity) for the codepipeline:* grant.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pipeline-external-egress
spec:
  podSelector:
    matchLabels:
      app: pipeline
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32 # EC2 instance metadata (instance-role creds)
      ports:
        - port: 80
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8 # RFC1918 — the VPC / node network itself
              - 172.16.0.0/12 # RFC1918
              - 192.168.0.0/16 # RFC1918 — private LAN
              - 100.64.0.0/10 # CGNAT (some cloud / VPN deployments)
              - 169.254.169.254/32 # IMDS (instance-role credentials)
              - 169.254.170.0/24 # container-credential endpoints (ECS .2, EKS Pod Identity .23)
      ports:
        - port: 443
          protocol: TCP

---
# =============================================================================
# Ask External Egress — hosted AI providers (Anthropic, OpenAI, Google, xAI,
# Bedrock) over 443. The self-hosted ask-model is in-namespace.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ask-external-egress
spec:
  podSelector:
    matchLabels:
      app: ask
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8 # RFC1918 — the VPC / node network itself
              - 172.16.0.0/12 # RFC1918
              - 192.168.0.0/16 # RFC1918 — private LAN
              - 100.64.0.0/10 # CGNAT (some cloud / VPN deployments)
              - 169.254.169.254/32 # IMDS (instance-role credentials)
              - 169.254.170.0/24 # container-credential endpoints (ECS .2, EKS Pod Identity .23)
      ports:
        - port: 443
          protocol: TCP

---
# =============================================================================
# Compliance External Egress — org notification channels: HTTPS webhooks (Slack,
# Teams, generic) on 443 and SMTP submission (587 STARTTLS, 465 TLS, 25).
# Webhook URLs are org-supplied, so the private-range carve-out is also the
# SSRF backstop here, exactly as on platform.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-compliance-external-egress
spec:
  podSelector:
    matchLabels:
      app: compliance
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8 # RFC1918 — the VPC / node network itself
              - 172.16.0.0/12 # RFC1918
              - 192.168.0.0/16 # RFC1918 — private LAN
              - 100.64.0.0/10 # CGNAT (some cloud / VPN deployments)
              - 169.254.169.254/32 # IMDS (instance-role credentials)
              - 169.254.170.0/24 # container-credential endpoints (ECS .2, EKS Pod Identity .23)
      ports:
        - port: 443
          protocol: TCP
        - port: 587
          protocol: TCP
        - port: 465
          protocol: TCP
        - port: 25
          protocol: TCP

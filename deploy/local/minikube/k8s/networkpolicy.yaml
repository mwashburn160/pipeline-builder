---
# =============================================================================
# Default Deny All Ingress
# =============================================================================
# NOTE: Requires a CNI that supports NetworkPolicy (e.g., Calico).
# Without one, these policies are silently ignored (safe to apply).
# Enable with: minikube start --cni=calico
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
# =============================================================================
# Istio ambient HBONE tunnel port — every ztunnel-to-ztunnel connection tunnels
# through port 15008 on the DESTINATION pod, regardless of the app's real port
# (e.g. a client reaching mongodb:27017 actually opens dst port 15008 at the L3/
# NetworkPolicy layer; ztunnel unwraps HBONE and forwards to 27017 internally).
# Every allow-*-ingress policy below only lists the app's REAL port, so on a CNI
# that enforces NetworkPolicy (this file is a no-op otherwise — see the note
# above), default-deny-ingress silently blocks ALL ambient mesh traffic
# cluster-wide. ztunnel's own access log names this exact failure mode:
# "connection timed out, maybe a NetworkPolicy is blocking HBONE port 15008".
# WHO can talk to WHOM is already enforced by the Istio AuthorizationPolicies in
# istio.yaml — this only needs to stop blocking the tunnel transport itself, so
# it's scoped to same-namespace pods, not opened to the world.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ambient-hbone
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 15008

---
# =============================================================================
# Nginx Gateway — ingress from anywhere (NodePort entry point)
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nginx-ingress
spec:
  podSelector:
    matchLabels:
      app: nginx
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8443
        - port: 8080

---
# =============================================================================
# API Services — ingress from nginx only
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-from-nginx
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [platform, pipeline, plugin, message, quota, billing, frontend, compliance, reporting, image-registry, ask]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: nginx
      ports:
        - port: 3000

---
# =============================================================================
# Compliance — ingress from pipeline + plugin (validate calls). Without this,
# default-deny silently dropped pipeline→compliance, so the bulk pipeline
# upload's compliance check returned non-2xx with no `data` field and the
# caller crashed on `.blocked`.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-compliance-from-services
spec:
  podSelector:
    matchLabels:
      app: compliance
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [pipeline, plugin, platform]
      ports:
        - port: 3000

---
# =============================================================================
# Image-registry API — ingress from plugin (token issuance for buildkit push).
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-image-registry-from-services
spec:
  podSelector:
    matchLabels:
      app: image-registry
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [plugin, platform]
      ports:
        - port: 3000

---
# =============================================================================
# Message — ingress from platform + billing (notification fan-out).
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-message-from-services
spec:
  podSelector:
    matchLabels:
      app: message
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [platform, billing, compliance, pipeline, plugin]
      ports:
        - port: 3000

---
# =============================================================================
# Reporting — ingress from platform (analytics rollups).
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-reporting-from-services
spec:
  podSelector:
    matchLabels:
      app: reporting
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [platform, pipeline, plugin]
      ports:
        - port: 3000

---
# =============================================================================
# Quota — ingress from platform, pipeline, plugin, billing
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-quota-from-services
spec:
  podSelector:
    matchLabels:
      app: quota

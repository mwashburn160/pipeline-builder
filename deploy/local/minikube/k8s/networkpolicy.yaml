    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [platform, pipeline, plugin, message, billing]
      ports:
        - port: 3000

---
# =============================================================================
# Postgres — ingress from platform, pipeline, plugin, message, compliance,
# reporting, pgbouncer, pgadmin. (Refreshed to match real DB-cred mounts and
# the Istio AuthorizationPolicy in istio.yaml — the old list omitted
# compliance/reporting/pgbouncer, which mount postgres-secret.)
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-ingress
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [platform, pipeline, plugin, message, compliance, reporting, pgbouncer, pgadmin]
      ports:
        - port: 5432

---
# =============================================================================
# MongoDB — ingress from platform, quota, billing, mongo-express
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mongodb-ingress
spec:
  podSelector:
    matchLabels:
      app: mongodb
  policyTypes:

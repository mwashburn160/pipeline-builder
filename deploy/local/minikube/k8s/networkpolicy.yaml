---
# =============================================================================
# Redis — ingress from every service that embeds a Redis client. (Refreshed:
# the old policy allowed only `plugin`, but the shared api-server layer uses
# Redis for health/idempotency/SSE and each service runs its own BullMQ/queue
# client — so pipeline/reporting/message/compliance/image-registry/quota/billing
# and platform all connect. Matches the Istio AuthorizationPolicy in istio.yaml.)
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-ingress
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [platform, pipeline, plugin, message, quota, billing, compliance, reporting, image-registry, ask]
      ports:
        - port: 6379

---
# =============================================================================
# Registry — ingress from plugin, image-registry, nginx
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-registry-ingress
spec:
  podSelector:
    matchLabels:
      app: registry
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [plugin, image-registry, nginx]
      ports:
        - port: 5000

---
# =============================================================================
# Loki — ingress from promtail (push) + platform (Audit Activity dashboard reads)
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-loki-ingress
spec:
  podSelector:
    matchLabels:
      app: loki
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                # `platform` reads Loki via /api/observability/logs for the
                # native Audit Activity dashboard. Grafana is now a separate admin console (k8s/grafana.yaml), no longer embedded in the
                # value list — the iframe is deleted in this PR.
                operator: In
                values: [promtail, platform]
      ports:
        - port: 3100

---
# =============================================================================
# Prometheus — ingress from platform (for native Observability dashboards)
#                       and from KEDA (for the plugin ScaledObject trigger)
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-ingress
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: platform
        # KEDA's metrics-adapter scrapes Prometheus on every polling
        # cycle for the plugin ScaledObject's `type: prometheus` trigger.
        # `kubernetes.io/metadata.name` is the auto-injected label on
        # every Namespace (k8s 1.21+) so we don't depend on KEDA's own
        # pod labels staying stable across upstream releases.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keda
      ports:
        - port: 9090
    # Thanos querier reaches the sidecar StoreAPI (gRPC) to serve recent blocks.
    - from:
        - podSelector:
            matchLabels:
              app: thanos-query
      ports:
        - port: 10901

---
# =============================================================================
# Thanos querier — ingress from platform (native Observability query path via
# PROMETHEUS_URL=http://thanos-query:9090). Egress (to prometheus sidecar +
# store-gateway StoreAPIs) is unrestricted by the Ingress-only default-deny.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-thanos-query-ingress
spec:
  podSelector:
    matchLabels:
      app: thanos-query
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: platform
      ports:
        - port: 9090

---
# =============================================================================
# Thanos store-gateway — ingress from the querier (StoreAPI gRPC) for archived
# blocks. It reads the blocks themselves from MinIO (allowed via the minio
# ingress policy above).
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-thanos-store-gateway-ingress
spec:
  podSelector:
    matchLabels:
      app: thanos-store-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: thanos-query
      ports:
        - port: 10901

---
# =============================================================================
# Alertmanager — ingress from prometheus (alert forwarding) and platform
# (proxied /api/observability/alerts read API)
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alertmanager-ingress
spec:
  podSelector:
    matchLabels:
      app: alertmanager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
        - podSelector:
            matchLabels:
              app: platform
      ports:
        - port: 9093

---
# =============================================================================
# Admin UIs — ingress from nginx
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-admin-uis-ingress
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [pgadmin, mongo-express]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: nginx
      # Real POD ports (NetworkPolicy gates the destination pod port, not the
      # Service port): pgadmin listens on 8080, mongo-express on 8081.
      ports:
        - port: 8080
        - port: 8081

---
# =============================================================================
# Prometheus Scraping — allow from prometheus to all pods on metrics ports
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scraping
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [platform, pipeline, plugin, message, quota, billing, frontend, nginx, loki]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - port: 3000
        - port: 3100
        - port: 8443
        - port: 9090

---
# =============================================================================
# DNS Egress — all pods need DNS resolution
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

---
# =============================================================================
# Internal Egress — allow pods to communicate within the namespace
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-egress
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector: {}

---
# =============================================================================
# Plugin External Egress — plugin pulls base images + dependency packages
#
# Hardening: this used to allow 443/80 to ANY destination. We still
# allow public-internet 443/80 (builds legitimately fetch from pypi.org,
# npmjs.org, ghcr.io, quay.io, public.ecr.aws, and arbitrary git hosts) but
# explicitly block known exfil targets via `except` blocks:
# - 169.254.0.0/16: link-local incl. cloud metadata (169.254.169.254 on
#   AWS / GCP / Azure). A compromised build cannot exfil IAM credentials
#   this way.
# - 192.168.0.0/16: typical home / lab LAN ranges.
# - 100.64.0.0/10: CGNAT range used by some cloud / VPN deployments.
#
# Cluster-internal traffic (registry, redis, postgres) is allowed by the
# `allow-internal-egress` policy above (matches every pod in the namespace).
#
# True per-org allow-lists require either Cilium NetworkPolicy (CIDR + DNS-
# aware) or kernel-level isolation via per-org buildkitd workers.
# This rule is defense-in-depth on top of those — see docs/plans/follow-ups.md.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-plugin-external-egress
spec:
  podSelector:
    matchLabels:
      app: plugin
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.0.0/16 # link-local incl. cloud metadata (IMDS)
              - 10.0.0.0/8 # RFC1918 — the VPC / node network itself
              - 172.16.0.0/12 # RFC1918
              - 192.168.0.0/16 # RFC1918 — private LAN
              - 100.64.0.0/10 # CGNAT (some cloud / VPN deployments)
      ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP

---
# =============================================================================
# Billing External Egress — billing calls the external payment provider
# (api.stripe.com; AWS Marketplace metering for the marketplace provider).
#
# This rule USED TO HAVE NO `to:` AT ALL, which in NetworkPolicy means "every
# destination": billing could open 443 to anything reachable from the pod,
# including the VPC's internal services and the Kubernetes API server. It now
# names 0.0.0.0/0 explicitly and carves out every private range, so the only
# thing left is the public internet — where Stripe actually is.
#
# The carve-out does NOT cut billing off from the rest of the stack: in-namespace
# traffic (postgres, redis, quota, platform) is allowed by `allow-internal-egress`
# above and DNS by `allow-dns-egress`, and NetworkPolicies are additive — an
# `except` in THIS rule cannot subtract from what another rule allows.
#
# Ambient note: constraining `to:` on an egress rule is the thing that breaks a
# MESH-INTERNAL hop, because ambient redirects that traffic via a link-local
# address — which is why the prometheus mesh-scrape rule further down is
# deliberately ports-only. It is safe HERE for the same reason it is safe on the
# platform rule below, which has carried the identical link-local carve-out since
# the OAuth fix and demonstrably reaches the public internet: this rule governs a
# PUBLIC-internet leg, not a mesh hop.
# FQDN-scoping (stripe-only) needs Cilium — see cilium-network-policies.yaml.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-billing-external-egress
spec:
  podSelector:
    matchLabels:
      app: billing
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.0.0/16 # link-local incl. cloud metadata (IMDS)
              - 10.0.0.0/8 # RFC1918 — the VPC / node network itself
              - 172.16.0.0/12 # RFC1918
              - 192.168.0.0/16 # RFC1918 — private LAN
              - 100.64.0.0/10 # CGNAT (some cloud / VPN deployments)
      ports:
        - port: 443
          protocol: TCP

---
# =============================================================================
# Platform External Egress — platform performs server-side OAuth token
# exchanges (oauth2.googleapis.com, GitHub, …) for social sign-in / onboarding.
# The namespace is ambient-enrolled, so this egress is subject to NetworkPolicy;
# with no allow rule the CNI SILENTLY DROPS the SYN and the OAuth client hangs
# until its connect timeout, then fails (looks like a ztunnel stall — it isn't).
# Platform also fetches USER-SUPPLIED URLs — per-org alert webhook destinations,
# OIDC discovery documents, SAML IdP metadata — so an attacker who can set one of
# those controls the destination. That makes this rule the SSRF backstop, and it
# therefore carves out EVERY private range (all of RFC1918, not just 192.168/16)
# plus link-local/IMDS and CGNAT: a crafted URL can no longer pivot to an
# in-VPC service or to 169.254.169.254, and platform holds the JWT-signing
# secrets that would make such a pivot expensive.
#
# What is left is the public internet, which is where everything platform
# legitimately calls lives: OAuth/OIDC IdPs (accounts.google.com,
# login.microsoftonline.com, graph.facebook.com, api.linkedin.com, gitlab.com,
# Cognito), SES, HIBP (api.pwnedpasswords.com) and the FIDO MDS blob
# (mds.fidoalliance.org). In-namespace traffic is unaffected — it is allowed by
# `allow-internal-egress`, and NetworkPolicies are additive.
# FQDN-scoping (per-IdP) needs Cilium — see cilium-network-policies.yaml.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-platform-external-egress
spec:
  podSelector:
    matchLabels:
      app: platform
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.0.0/16 # link-local incl. cloud metadata (IMDS)
              - 10.0.0.0/8 # RFC1918 — the VPC / node network itself
              - 172.16.0.0/12 # RFC1918
              - 192.168.0.0/16 # RFC1918 — private LAN
              - 100.64.0.0/10 # CGNAT (some cloud / VPN deployments)
      ports:
        - port: 443
          protocol: TCP

---
# =============================================================================
# Promtail & Prometheus Kube API Egress — service discovery needs API access
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kube-api-egress
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [promtail, prometheus]
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 6443
          protocol: TCP
        - port: 443
          protocol: TCP
        - port: 10250
          protocol: TCP

# =============================================================================
# Plugin egress — governed by the policies ABOVE (VPC CNI = standard NetworkPolicy)
# =============================================================================
# A former `plugin-build-isolation` policy was removed here. It tried to NARROW
# plugin egress, but k8s NetworkPolicies are purely ADDITIVE — its `- to: []`
# rule on 443/80 re-opened egress to ALL destinations (including 169.254.169.254
# / IMDS on port 80), DEFEATING the link-local exception in
# `allow-plugin-external-egress`. Plugin egress is now governed by:
#   - allow-dns-egress           (DNS, all pods)
#   - allow-internal-egress      (in-namespace pods: registry, postgres, redis, …)
#   - allow-plugin-external-egress (public 443/80, EXCEPT link-local/LAN/CGNAT —
#                                  so a compromised build can't reach cloud metadata)
# True FQDN-level egress allow-listing (per-registry/per-package) is NOT
# expressible in standard NetworkPolicy / the VPC CNI — it needs Cilium; see
# cilium-network-policies.yaml (opt-in, not in this kustomization).

---
# =============================================================================
# MinIO — ingress on the S3 API from the services that use it + the bootstrap
# Job. Without this, default-deny-ingress blocks message/registry from reaching
# minio:9000 and attachments + the registry backend fail.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-minio-from-services
spec:
  podSelector:
    matchLabels:
      app: minio
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [message, registry, minio-init, loki, prometheus, minio, thanos-store-gateway, thanos-compact]
      ports:
        - port: 9000
---
# =============================================================================
# Ask agent -> pipeline (token-forwarded propose/list). Without this, default-deny
# drops ask->pipeline and the agent's create-pipeline drafts fail.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pipeline-from-ask
spec:
  podSelector:
    matchLabels:
      app: pipeline
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ask
      ports:
        - port: 3000
---
# =============================================================================
# Ask agent -> plugin (token-forwarded propose). Without this, default-deny drops
# ask->plugin and the agent's create-plugin drafts fail.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-plugin-from-ask
spec:
  podSelector:
    matchLabels:
      app: plugin
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ask
      ports:
        - port: 3000
---
# prometheus -> the Istio mesh components in istio-system (scrape only).
#
# REQUIRED for the `istio-mesh` scrape job in config/prometheus/prometheus.yml.
# Every pod in this namespace is egress-restricted the moment `allow-dns-egress`
# / `allow-internal-egress` exist (both use an EMPTY podSelector), and neither
# covers this: `allow-internal-egress` is `to: [{podSelector: {}}]`, which is
# SAME-NAMESPACE only, and the mesh components live in istio-system.
#
# PORTS-ONLY, deliberately: no `to:` selector. Under Istio ambient a pod's
# outbound traffic is redirected to the node-local ztunnel over a LINK-LOCAL
# address (169.254.x), so a rule that constrains `to:` — an ipBlock excepting
# 169.254.0.0/16, or arguably a namespaceSelector — severs the data path while
# still completing the TCP handshake, producing scrapes that hang rather than
# fail. The ports-only shape is the one verified to work here (see
# allow-ask-model-external-egress in ask-model.yaml for the incident this
# encodes). 15020 = ztunnel, 15014 = istiod + istio-cni-node.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-mesh-scrape
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 15020
          protocol: TCP
        - port: 15014
          protocol: TCP

---
# waypoint -> istiod xDS (istio-system).
#
# WITHOUT THIS THE WHOLE STACK IS UNREACHABLE. `allow-dns-egress` and
# `allow-internal-egress` both use an EMPTY podSelector, so every pod in this
# namespace is egress-restricted, and `allow-internal-egress` is
# `to: [{podSelector: {}}]` — SAME-NAMESPACE only. istiod lives in istio-system,
# so the waypoint's xDS stream is denied: it comes up with NO configuration and
# answers every routed request with Envoy's `no healthy upstream` (HTTP 503),
# while the backing pods are perfectly healthy and Ready. ztunnel is unaffected
# (it runs in istio-system on the host network), which makes the failure look
# like an app problem rather than a mesh one.
#
# PORTS-ONLY, deliberately — same rationale as allow-prometheus-mesh-scrape
# above: under ambient, outbound traffic is redirected to the node-local ztunnel
# over a LINK-LOCAL address, so constraining `to:` severs the data path while
# still completing the handshake (hangs rather than clean failures).
# 15012 = istiod xDS/CA (the one that matters); 15014 = istiod metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-waypoint-xds
spec:
  podSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-class-name: istio-waypoint
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 15012
          protocol: TCP
        - port: 15014
          protocol: TCP

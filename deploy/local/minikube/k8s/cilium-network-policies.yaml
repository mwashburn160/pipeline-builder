---
# =============================================================================
#  CiliumNetworkPolicy: true per-org egress allow-lists.
# =============================================================================
# NOTE: this file is NOT in the kustomization (opt-in). It is inert unless
# Cilium is installed as the cluster CNI; applying it without Cilium's CRDs
# errors, so it ships as a template only. See docs / eks copy for context.
# =============================================================================
#
# These manifests REQUIRE Cilium installed as the cluster CNI. Standard
# k8s NetworkPolicy can't express per-org rules because it has no notion
# of pod identity tied to runtime metadata (an org_id label on the build
# pod, for example) and no DNS-aware egress.
#
# What ships in this file:
# 1. A DEFAULT-DENY egress policy for plugin pods that allows ONLY DNS
#    + cluster-internal traffic. Public-internet 443/80 is denied.
# 2. A SHARED ALLOW-LIST policy that re-enables egress to a curated set
#    of registry / package hosts every legitimate build needs
#    (docker.io, ghcr.io, quay.io, pypi.org, npmjs.org, etc.) — DNS-aware
#    via Cilium's `toFQDNs` selector. The anonymous-submission quarantine
#    builder shares it (plus its own, narrower in-cluster rule).
# 3. A TEMPLATE for a per-org override: operators copy this block, set
#    the org's k8s label selector, and add the org's specific external
#    hosts. When applied, plugin pods labeled with that org_id pick up
#    the override IN ADDITION to the shared allow-list.
#
# Activation:
# 1. Install Cilium (see https://docs.cilium.io/en/stable/installation/).
# 2. Confirm CiliumNetworkPolicy CRD is present:
#      kubectl get crd ciliumnetworkpolicies.cilium.io
# 3. Add this file to your kustomization resources, OR apply directly:
#      kubectl apply -f cilium-network-policies.yaml
# 4. Leave `allow-plugin-external-egress` in networkpolicy.yaml in place. It
#    is NOT superseded and NOT legacy: it is the live CIDR-level baseline
#    (public 443/80 minus link-local/RFC1918/CGNAT) that the standard CNI
#    enforces today. The Cilium policy adds the FQDN layer standard
#    NetworkPolicy cannot express; it does not replace the CIDR layer, and
#    NetworkPolicies are additive, so keeping both is the intended shape.
#
# Per-org override flow:
# Operator creates `cilium-network-policy-org-acme.yaml` with the org's
# specific FQDN allow-list, labels matching plugin pods spawned for
# org-acme builds (today: every plugin replica handles every org, so
# per-org pod labels need the per-tier buildkitd path from to be
# active first — that gives one pod label per tier; full per-org pod
# labeling waits for per-org workers, from the doc).
#
# Without Cilium installed, all of this is inert YAML — apply-able with no
# effect, no error.

# Default deny comes from the allow policies below: Cilium puts an endpoint in
# egress default-deny as soon as any policy with egress rules selects it. There
# is deliberately NO `egressDeny: [{toEntities: [all]}]` policy — deny rules take
# precedence over allows in Cilium, so it would block every hole opened below.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: plugin-shared-egress-allow
  namespace: pipeline-builder
spec:
  # ONE package-mirror allow-list for both build paths: the quarantine builder
  # gets exactly the FQDNs a tenant build gets, and nothing more. The in-cluster
  # rule that used to live here is split out (plugin-internal-egress-allow), so
  # sharing this list never opens the namespace to anonymous code.
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [plugin, plugin-quarantine-builder]
  egress:
    # --- Cluster DNS --------------------------------------------------------
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

    # --- Public registries (image base + package fetches) -------------------
    # DNS-aware: Cilium resolves these at runtime and pins to the resolved
    # IPs for the policy's lifetime. A compromised build that tries to
    # connect to a hard-coded IP not in this resolved set is dropped.
    - toFQDNs:
        # Docker Hub
        - matchName: "registry-1.docker.io"
        - matchName: "auth.docker.io"
        - matchName: "production.cloudflare.docker.com"
        # GitHub Container Registry
        - matchName: "ghcr.io"
        - matchPattern: "*.ghcr.io"
        # Red Hat Quay
        - matchName: "quay.io"
        - matchName: "cdn.quay.io"
        # AWS ECR public + private (resolved at build-time per region)
        - matchPattern: "*.amazonaws.com"
        - matchName: "public.ecr.aws"
        # Google Container Registry / Artifact Registry
        - matchName: "gcr.io"
        - matchPattern: "*-docker.pkg.dev"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

    # --- Public package indexes --------------------------------------------
    - toFQDNs:
        # Python
        - matchName: "pypi.org"
        - matchName: "files.pythonhosted.org"
        # Node.js
        - matchName: "registry.npmjs.org"
        - matchPattern: "*.npmjs.org"
        # Rust
        - matchName: "crates.io"
        - matchName: "static.crates.io"
        # Go (proxy + checksum DB)
        - matchName: "proxy.golang.org"
        - matchName: "sum.golang.org"
        # Maven Central
        - matchName: "repo1.maven.org"
        - matchName: "repo.maven.apache.org"
        # GitHub (source clones for Go modules, etc.)
        - matchName: "github.com"
        - matchName: "api.github.com"
        - matchName: "codeload.github.com"
        # Debian / Ubuntu / Alpine package repos (for `apk add` / `apt install`
        # inside `Dockerfile RUN` lines)
        - matchPattern: "*.debian.org"
        - matchPattern: "*.ubuntu.com"
        - matchName: "dl-cdn.alpinelinux.org"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP

---
# In-cluster pods (registry, redis, postgres, mongo, etc.) — the TENANT plugin
# pod only (it is the service itself, not just a build sandbox).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: plugin-internal-egress-allow
  namespace: pipeline-builder
spec:
  endpointSelector:
    matchLabels:
      app: plugin
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": pipeline-builder

---
# The quarantine builder's in-cluster reach: the registry (push
# quarantine/<id>, pull bases through the mirror), image-registry (the /token
# realm) and the pb-waypoint that fronts it (15008 = ambient HBONE). Nothing
# else in the namespace — no postgres, redis, minio or platform.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: plugin-quarantine-builder-internal-egress-allow
  namespace: pipeline-builder
spec:
  endpointSelector:
    matchLabels:
      app: plugin-quarantine-builder
  egress:
    - toEndpoints:
        - matchExpressions:
            - key: app
              operator: In
              values: [registry, image-registry]
        - matchLabels:
            gateway.networking.k8s.io/gateway-class-name: istio-waypoint
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
            - port: "3000"
              protocol: TCP
            - port: "15008"
              protocol: TCP

---
# Ingress to the quarantine builder: the plugin pod only.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: plugin-quarantine-builder-ingress
  namespace: pipeline-builder
spec:
  endpointSelector:
    matchLabels:
      app: plugin-quarantine-builder
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: plugin
      toPorts:
        - ports:
            - port: "1234"
              protocol: TCP
            - port: "15008"
              protocol: TCP

---

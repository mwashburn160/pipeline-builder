---
# =============================================================================
# Ask model — OPT-IN self-hosted, OpenAI-compatible model (Ollama).
#
# Enable with ONE knob:
#
#     ASK_MODEL=1 ./bin/setup.sh
#
# which applies this file AND adds OPENAI_COMPATIBLE_BASE_URL / _MODELS to the
# app-env ConfigMap the `ask` Deployment already reads. Without it (and with no
# cloud provider key in .env) the Ask assistant has NO provider and every turn
# fails with "AI is not configured".
#
# Deliberately NOT in kustomization.yaml, and NOT folded into LEAN: LEAN
# SUBTRACTS optional workloads to fit a small laptop, so adding a workload under
# the same flag would invert its meaning.
#
# Sizing: LAPTOP-sized here — the 1.5B coder model at a 2Gi request. A minikube
# VM is ~75% of the host (≈7Gi on a 9.7Gi laptop) and the core stack already
# fills most of it, so the 7B/6Gi shape the AWS targets use would sit Pending
# forever. For a bigger machine, raise the request and set OLLAMA_MODEL +
# OPENAI_COMPATIBLE_MODELS to `qwen2.5-coder:7b`. For a GPU, uncomment the
# nodeSelector/tolerations + resources.limits `nvidia.com/gpu` below.
# Self-contained: bundles its ServiceAccount + istio authz + NetworkPolicy so
# `kubectl apply -f ask-model.yaml` brings everything ask needs to reach it.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata: { name: ask-model, namespace: pipeline-builder, labels: { app.kubernetes.io/part-of: pipeline-builder } }
---
# Model weights. This target binds a MANUAL hostPath PV — `storageClassName: ""`
# opts out of dynamic provisioning, so a claim with no matching PV never binds
# ("no persistent volumes available for this claim and no storage class is set")
# and the Deployment sits at 0/1 forever. Every other minikube PVC here declares
# its PV the same way (see postgres.yaml); ask-model was missing one.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ask-model-pv
  labels:
    app: ask-model
spec:
  storageClassName: ""
  capacity:
    storage: 8Gi
  accessModes: ["ReadWriteOnce"]
  # Retain, so a `kubectl delete -f` of this file does not throw away a model
  # that took minutes to download; re-applying rebinds the same directory.
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/db-data/ask-model
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ask-model-models
  labels:
    app: ask-model
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ""
  resources:
    requests:
      storage: 8Gi
  # Bind to THIS file's PV, not whichever unbound 8Gi volume sorts first.
  selector:
    matchLabels:
      app: ask-model
---
apiVersion: v1
kind: Service
metadata:
  name: ask-model
  labels:
    app: ask-model
spec:
  type: ClusterIP
  ports:
    - port: 11434
      targetPort: 11434
      protocol: TCP
      name: http
  selector:
    app: ask-model
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ask-model
  labels:
    app: ask-model
    app.kubernetes.io/component: model
spec:
  replicas: 1
  # Single writer on an RWO volume — recreate (don't run two pods on one PVC).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ask-model
  template:
    metadata:
      labels:
        app: ask-model
        app.kubernetes.io/component: model
    spec:
      serviceAccountName: ask-model
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: false   # ollama writes model blobs under /root/.ollama
        fsGroup: 0
      # GPU (uncomment to schedule on a GPU node):
      # nodeSelector: { nvidia.com/gpu.present: "true" }
      # tolerations: [{ key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }]
      containers:
        - name: ollama
          image: ollama/ollama:0.6.5
          ports:
            - containerPort: 11434
              name: http
          env:
            - name: OLLAMA_MODEL
              value: "qwen2.5-coder:1.5b"
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            # Keep the model resident. The default is 5m, after which ollama
            # evicts it and the NEXT question pays a full reload from disk before
            # a single token — which reads to the user as "Ask just hangs".
            - name: OLLAMA_KEEP_ALIVE
              value: "24h"
            # One request at a time. The default (4) splits the context budget
            # into parallel slots, costing memory and slowing the single
            # interactive request this deployment actually serves.
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
          # Run the server AND the pull as the container's main process.
          #
          # This was a lifecycle.postStart hook, which was a mistake: a blocking
          # postStart keeps the container out of Running for its whole duration,
          # so during the (minutes-long) first pull the pod sat in
          # ContainerCreating with NO readable logs and no `kubectl exec` — the
          # download looked indistinguishable from a hang. Running it as PID 1's
          # script instead means the pod is Running immediately, `kubectl logs`
          # streams the pull's progress, and the startupProbe below is what
          # actually gates traffic. Mirrors the docker target's compose command.
          command: ["/bin/sh", "-c"]
          args:
            # Retry rather than `|| true` once: a transient registry blip would
            # otherwise leave the server up with no model until the startupProbe
            # finally restarts the container.
            - |
              ollama serve &
              sleep 4
              for i in 1 2 3 4 5; do
                ollama pull "$OLLAMA_MODEL" && break
                echo "ollama pull failed (attempt $i); retrying in 30s" >&2
                sleep 30
              done
              wait
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          resources:
            # Laptop-sized. The AWS targets run the 7B at 6Gi/10Gi; a minikube
            # VM is ~75% of the host (≈7Gi on a 9.7Gi laptop) and the core stack
            # already fills most of it, so a 6Gi REQUEST here would simply sit
            # Pending forever. The 1.5B coder model answers the docs-grounded
            # Ask path acceptably in ~2Gi.
            requests:
              cpu: "500m"
              # 1.5Gi, not 2Gi. The REQUEST only has to get the pod scheduled —
              # the limit below is what caps actual use, and a 1.5B Q4 model sits
              # around 1.3-1.5Gi resident. Measured on a real laptop cluster the
              # rest of the namespace had already RESERVED 8020Mi of ~9943Mi
              # allocatable (though it was only USING 5860Mi), so a 2Gi request
              # missed by ~125Mi and the pod sat Pending — which defeats the
              # whole point of an "enable it locally" flag.
              memory: 1536Mi
            limits:
              # BOTH values are pinned to the namespace LimitRange's per-CONTAINER
              # maximum in resource-limits.yaml (cpu "2", memory
              # ${BUILDKIT_MEMORY_LIMIT}, which defaults to 3072Mi on this target).
              # Exceeding it is not a scheduling delay — the ReplicaSet cannot
              # create the pod AT ALL and the Deployment sits at 0/1 with no pod
              # and only an event to explain it:
              #   pods "ask-model-..." is forbidden: maximum memory usage per
              #   Container is 3Gi, but limit is 4Gi
              # This file is applied directly (not through the kustomize sed that
              # substitutes BUILDKIT_MEMORY_LIMIT), so the value must be literal:
              # keep it <= the smallest BUILDKIT_MEMORY_LIMIT you provision with.
              #
              # cpu 4 (was 2) to cut CFS throttling. ollama sizes its inference
              # thread pool from the HOST core count (`nproc` = 8 here), NOT the
              # cgroup quota, and 0.6.5 has no env var to override it — so a
              # 2-core quota meant 8 threads hard-stopped for the rest of every
              # 100ms period once the budget ran out. Measured on this cluster:
              # 1909 of 3903 periods throttled (49%), 923s of stall, and one
              # completion taking 59s. The REQUEST stays at 500m, so this is a
              # ceiling on idle capacity, not a reservation.
              cpu: "4"
              memory: 3Gi
              # GPU: nvidia.com/gpu: "1"
          # GATE READINESS ON THE MODEL, NOT THE SERVER.
          #
          # `/api/version` answers as soon as ollama's HTTP server binds — which
          # is almost immediately, while the `ollama pull` in the command above is
          # still downloading (~1GB here, ~4.7GB for the 7B on the AWS targets).
          # With only that probe the pod went Ready, the Service routed chat
          # completions to a model that did not exist yet, and ollama closed the
          # connection: the caller saw
          #   "AI_APICallError: Cannot connect to API: other side closed".
          #
          # A startupProbe suspends the readiness/liveness probes until it
          # passes, so the pod stays out of the Service until `ollama list`
          # actually shows the model. failureThreshold x periodSeconds is the
          # first-pull budget (~20 min); a pull that never lands restarts the
          # container, which retries it — better than serving nothing forever.
          startupProbe:
            exec:
              command: ["/bin/sh", "-c", "ollama list | grep -qF \"$OLLAMA_MODEL\""]
            periodSeconds: 10
            failureThreshold: 120
          readinessProbe:
            httpGet: { path: /api/version, port: 11434 }
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet: { path: /api/version, port: 11434 }
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ask-model-models
---
# ask -> ask-model (OpenAI-compatible inference). Additive istio authz.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: ask-model-allow
  namespace: pipeline-builder
spec:
  selector:
    matchLabels:
      app: ask-model
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/pipeline-builder/sa/ask
      to:
        - operation:
            ports: ["11434"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ask-model-from-ask
spec:
  podSelector:
    matchLabels:
      app: ask-model
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ask
      ports:
        - port: 11434
---
# ask-model -> the model registry (registry.ollama.ai).
#
# REQUIRED, not optional. `allow-dns-egress` and `allow-internal-egress` in
# networkpolicy.yaml both use an EMPTY podSelector, so every pod in this
# namespace is egress-restricted the moment they exist: DNS and in-namespace
# traffic only, unless some other policy widens it. Without this rule
# `ollama pull` resolves the registry, opens a TCP connection that never
# completes, and hangs forever — the pod stays in ContainerCreating (a blocking
# postStart keeps it there), the Service keeps ZERO endpoints, and every Ask
# turn fails with "AI_APICallError: Cannot connect to API: other side closed".
# Nothing in the pod's own logs explains it, because a container stuck in
# postStart has no readable logs.
#
# PORTS-ONLY, deliberately: no `to:` ipBlock. The obvious spelling —
# ipBlock 0.0.0.0/0 with `except: 169.254.0.0/16, 192.168.0.0/16,
# 100.64.0.0/10`, copied from allow-plugin-external-egress — BREAKS this pod
# under Istio ambient. Ambient redirects a pod's outbound traffic to the
# node-local ztunnel over a LINK-LOCAL address (169.254.x), so excepting
# 169.254.0.0/16 severs the data path: the TCP connect still succeeds (the
# kernel completes the handshake) but no application bytes ever flow, and a
# TLS ClientHello just times out —
#   openssl: CONNECTED ... no peer certificate available, Cipher is (NONE)
#   ollama:  net/http: TLS handshake timeout
# which looks like a firewall on the far end rather than a local policy.
# Verified empirically on a live cluster by swapping one form for the other:
# with the ipBlock/except spelling the handshake never completes; with this
# ports-only rule the same pod negotiates TLSv1.3 immediately. Note the carve-out
# wins even though allow-kube-api-egress separately grants every pod an
# unrestricted :443 rule — so treat an `except:` here as a DENY that overrides
# other policies' allows, not merely as a narrowing of this one.
# allow-billing-external-egress and plugin-build-isolation use this same
# ports-only form.
#
# FQDN-scoping this to registry.ollama.ai needs Cilium (see
# cilium-network-policies.yaml); plain NetworkPolicy cannot express it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ask-model-external-egress
spec:
  podSelector:
    matchLabels:
      app: ask-model
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP

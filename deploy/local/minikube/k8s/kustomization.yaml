apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Minikube — standalone manifests with local development overrides.
# Higher CPU allocations, smaller storage volumes.

# NetworkPolicy: networkpolicy.yaml (standard k8s NetworkPolicy) is the active set.
# cilium-network-policies.yaml is intentionally NOT included: its FQDN/per-org egress
# allow-listing needs Cilium as the CNI, and it is inert YAML under any other CNI.
# See that file's header to opt in. The standard policies stay either way — the
# Cilium set adds an FQDN layer on top of them, it does not replace them.

namespace: pipeline-builder

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - istio.yaml
  # Per-internal-route mesh policies + the waypoint that enforces them.
  - istio-internal-routes.yaml
  - resource-limits.yaml
  - mongodb.yaml
  - postgres.yaml
  - pgbouncer.yaml
  - redis.yaml
  - nginx.yaml
  - platform.yaml
  - pipeline.yaml
  - plugin.yaml
  # Isolated buildkitd for anonymous plugin submissions.
  - plugin-quarantine-builder.yaml
  - message.yaml
  - reporting.yaml
  - ask.yaml
  # - ask-model.yaml  # opt-in self-hosted model (Ollama); see file header
  - quota.yaml
  - billing.yaml
  - compliance.yaml
  - frontend.yaml
  - mongo-express.yaml
  - pgadmin.yaml
  - grafana.yaml   # dashboards over prometheus/thanos/loki/jaeger (LEAN drops it)
  - kiali.yaml     # istio mesh console — L4-only under ambient (LEAN drops it)
  - minio.yaml
  - registry.yaml
  - image-registry.yaml
  - prometheus.yaml
  - thanos-query.yaml
  - thanos-compact.yaml
  - alertmanager.yaml
  - loki.yaml
  - promtail.yaml
  - jaeger.yaml

patches:
  # Resource (CPU) overrides for all deployments
  - path: patches/resources.yaml
  # Plugin autoscale cap override for the local box
  - path: patches/scaling.yaml

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Minikube — standalone manifests with local development overrides.
# Higher CPU allocations, smaller storage volumes.

namespace: pipeline-builder

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - istio.yaml
  # Per-internal-route mesh policies + the waypoint that enforces them (#14).
  - istio-internal-routes.yaml
  - resource-limits.yaml
  - mongodb.yaml
  - postgres.yaml
  - pgbouncer.yaml
  - redis.yaml
  - nginx.yaml
  - platform.yaml
  - pipeline.yaml
  - plugin.yaml
  - message.yaml
  - reporting.yaml
  - ask.yaml
  # - ask-model.yaml  # opt-in self-hosted model (Ollama); see file header
  - quota.yaml
  - billing.yaml
  - compliance.yaml
  - frontend.yaml
  - mongo-express.yaml
  - pgadmin.yaml
  - grafana.yaml   # dashboards over prometheus/thanos/loki/jaeger (LEAN drops it)
  - kiali.yaml     # istio mesh console — L4-only under ambient (LEAN drops it)
  - minio.yaml
  - registry.yaml
  - image-registry.yaml
  - prometheus.yaml
  - thanos-query.yaml
  - alertmanager.yaml
  - loki.yaml
  - promtail.yaml
  - jaeger.yaml

patches:
  # Resource (CPU) overrides for all deployments
  - path: patches/resources.yaml
  # Plugin autoscale cap override for the local box
  # (was silently disabled — the path was glued onto the end of this comment line)
  - path: patches/scaling.yaml

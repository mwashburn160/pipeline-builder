# =============================================================================
# Minikube resource overrides — sized for a single ~8-CPU / ~10 GiB node
# =============================================================================
# REQUESTS are scheduling reservations, sized from measured idle usage plus
# headroom (Node services idle at ~10-20m CPU, Postgres ~6m, Mongo <100m): on a
# single node, over-reserving leaves real capacity unused while pods sit Pending
# ("Insufficient cpu"). LIMITS stay generous so startup/build bursts aren't
# throttled. Keep app-service requests well above idle usage: the CPU HPAs
# (40-70% targets) measure utilization against the REQUEST, so too small a
# request turns normal load into scale-out churn. The full stack's requests
# (plus kube-system, Istio, KEDA) fit in 8 CPU with room for HPA/KEDA scale-ups;
# istiod's own request is trimmed in bin/setup.sh.

# --- Databases ---
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
spec:
  template:
    spec:
      containers:
        - name: mongodb
          resources:
            limits:
              cpu: "1.5"
            requests:
              cpu: "300m"
              memory: "384Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  template:
    spec:
      containers:
        - name: postgres
          resources:
            limits:
              cpu: "1.5"
            requests:
              cpu: "300m"
              memory: "256Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  template:
    spec:
      containers:
        - name: redis
          resources:
            limits:
              cpu: "250m"
            requests:
              cpu: "100m"


# =============================================================================
# Minikube scaling overrides
# =============================================================================
# Applied via kustomization.yaml `patches:`. Kept minimal on purpose: the base
# ResourceQuota/LimitRange in resource-limits.yaml are already tuned for the
# laptop (requests.cpu is 12, for crane-push bootstrap headroom), so this patch
# deliberately does NOT override them — a lower requests.cpu here would silently
# take that headroom back.

# --- Plugin KEDA ScaledObject: allow more build replicas on the local box ---
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: plugin
spec:
  maxReplicaCount: 4

# -- AuthorizationPolicy: datastores (AUTHORITATIVE — derived from secret
#    mounts / real clients, NOT the stale NetworkPolicy allow-lists) ---------
# postgres + pgbouncer share the same caller set (apps reach PG via pgbouncer:6432).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: postgres-allow
  namespace: pipeline-builder
spec:
  selector:
    matchLabels:
      app: postgres
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/pipeline-builder/sa/platform
              - cluster.local/ns/pipeline-builder/sa/pipeline
              - cluster.local/ns/pipeline-builder/sa/plugin
              - cluster.local/ns/pipeline-builder/sa/message
              - cluster.local/ns/pipeline-builder/sa/compliance
              - cluster.local/ns/pipeline-builder/sa/reporting
              - cluster.local/ns/pipeline-builder/sa/pgbouncer
              - cluster.local/ns/pipeline-builder/sa/pgadmin
      to:
        - operation:
            ports: ["5432"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: pgbouncer-allow
  namespace: pipeline-builder
spec:
  selector:
    matchLabels:
      app: pgbouncer
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/pipeline-builder/sa/platform
              - cluster.local/ns/pipeline-builder/sa/pipeline
              - cluster.local/ns/pipeline-builder/sa/plugin
              - cluster.local/ns/pipeline-builder/sa/message
              - cluster.local/ns/pipeline-builder/sa/compliance
              - cluster.local/ns/pipeline-builder/sa/reporting
      to:
        - operation:
            ports: ["6432"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: mongodb-allow
  namespace: pipeline-builder
spec:
  selector:
    matchLabels:
      app: mongodb
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/pipeline-builder/sa/platform
              - cluster.local/ns/pipeline-builder/sa/quota
              - cluster.local/ns/pipeline-builder/sa/billing
              - cluster.local/ns/pipeline-builder/sa/mongo-express
              # mongod connects to ITSELF for replica-set (rs0) primary election;
              # without this the RS never elects a primary → ReplicaSetNoPrimary.
              - cluster.local/ns/pipeline-builder/sa/mongodb
      to:
        - operation:
            ports: ["27017"]
---
# Redis: NP allowed only `plugin`, but every api-server embeds a Redis
# health/idempotency/queue client — allow all consuming services.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: redis-allow
  namespace: pipeline-builder
spec:
  selector:
    matchLabels:
      app: redis
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/pipeline-builder/sa/platform
              - cluster.local/ns/pipeline-builder/sa/pipeline
              - cluster.local/ns/pipeline-builder/sa/plugin
              - cluster.local/ns/pipeline-builder/sa/message
              - cluster.local/ns/pipeline-builder/sa/quota
              - cluster.local/ns/pipeline-builder/sa/billing
              - cluster.local/ns/pipeline-builder/sa/compliance
              - cluster.local/ns/pipeline-builder/sa/reporting
              - cluster.local/ns/pipeline-builder/sa/image-registry
      to:
        - operation:
            ports: ["6379"]
---
# Registry: `default` = crane `kubectl run` push pods from init-platform.sh.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: registry-allow
  namespace: pipeline-builder
spec:
  selector:
    matchLabels:
      app: registry
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/pipeline-builder/sa/image-registry
              - cluster.local/ns/pipeline-builder/sa/pipeline
              - cluster.local/ns/pipeline-builder/sa/plugin
              - cluster.local/ns/pipeline-builder/sa/nginx
              - cluster.local/ns/pipeline-builder/sa/default
      to:
        - operation:
            ports: ["5000"]
---
# MinIO (S3): `default` = the minio-init bootstrap Job.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: minio-allow
  namespace: pipeline-builder
spec:
  selector:
    matchLabels:
      app: minio
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/pipeline-builder/sa/message
              - cluster.local/ns/pipeline-builder/sa/registry
              - cluster.local/ns/pipeline-builder/sa/loki
              - cluster.local/ns/pipeline-builder/sa/prometheus
              - cluster.local/ns/pipeline-builder/sa/thanos-store-gateway
              - cluster.local/ns/pipeline-builder/sa/default
      to:
        - operation:
            ports: ["9000"]
---
# -- AuthorizationPolicy: app APIs (each lists nginx + prometheus + the

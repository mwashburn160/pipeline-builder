---
# =============================================================================
# Istio ambient service mesh — mTLS + identity-based L4 authorization
# =============================================================================
# The namespace is enrolled in the ambient data plane via the
# `istio.io/dataplane-mode: ambient` label on namespace.yaml. This file adds:
#   1. PeerAuthentication  — STRICT mTLS namespace-wide, with PERMISSIVE
#      carve-outs for the nginx external listener and the prometheus:9090
#      port that KEDA (cross-namespace, non-mesh) scrapes.
#   2. ServiceAccounts     — one per workload, so every service has a distinct
#      SPIFFE identity (cluster.local/ns/pipeline-builder/sa/<name>). Without
#      this every pod ran as `default` and was indistinguishable by identity.
#   3. AuthorizationPolicy — per sensitive workload (datastores + app APIs),
#      allow-listing exactly the caller identities that real traffic needs.
#      Observability infra (loki/alertmanager/thanos/jaeger) is left at
#      STRICT-mTLS-only (no AuthZ) to bound the enumeration surface.
#
# ALLOW semantics: the moment an ALLOW policy selects a workload, that workload
# is default-deny for every principal NOT listed — so each policy enumerates all
# legitimate callers, including cross-cutting ones (prometheus for /metrics on
# :3000, nginx as the single ingress principal, `default` for bootstrap Jobs).
# =============================================================================

# -- PeerAuthentication -------------------------------------------------------
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: pipeline-builder
spec:
  mtls:
    mode: STRICT
---
# nginx is the ingress gateway: external browsers/CLIs are NOT mesh members, so
# STRICT would reject them at the TLS/HTTP listener. Carve out the external
# ports (local terminates TLS in nginx on 8443; 8080 is the HTTP redirect).
# nginx->upstream stays STRICT (governed by the destination workloads).
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: nginx-ingress
  namespace: pipeline-builder
spec:
  selector:
    matchLabels:
      app: nginx
  mtls:
    mode: STRICT
  portLevelMtls:
    "8443":
      mode: PERMISSIVE
    "8080":
      mode: PERMISSIVE
---
# KEDA's metrics-adapter (in the `keda` namespace, outside the mesh) scrapes
# prometheus:9090 every polling cycle for the plugin ScaledObject. Port-level
# PERMISSIVE keeps that working while in-mesh reads stay mTLS.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: prometheus-keda
  namespace: pipeline-builder
spec:
  selector:
    matchLabels:
      app: prometheus
  mtls:
    mode: STRICT
  portLevelMtls:
    "9090":
      mode: PERMISSIVE
---

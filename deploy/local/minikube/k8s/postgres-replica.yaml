---
# =============================================================================
# PostgreSQL read replica (streaming standby)
# =============================================================================
# A SEPARATE workload from the primary, not extra ordinals of one StatefulSet.
# See docs/plans/postgres-read-write-split.md, decision D1: a single pod
# template cannot give the standby its own NetworkPolicy rules, its own mesh
# identity, or a replica count that differs from the primary's — and leaving the
# primary as the Deployment it already is removes the volume-adoption migration
# entirely (a StatefulSet's volumeClaimTemplates would NOT adopt the existing
# `postgres-data` PVC, so the primary would come up on a blank volume looking
# like total data loss).
#
# The sizing parity the single-StatefulSet idea was reaching for is enforced
# instead by test/deploy-contracts/test/postgres-replica-parity.test.ts, which
# asserts this container's resources and server args match the primary's
# exactly. That is this repo's standing convention: duplicate the manifest,
# guard the copy with a drift test, never share a base.
#
# NOTHING READS FROM THIS UNTIL `DB_READ_HOST` IS SET. The application falls
# back to the primary whenever the variable is empty, which is how it ships.
---
---
# =============================================================================
# PersistentVolume (hostPath)
# =============================================================================
# Exactly ONE, because this target's replica count is fixed at 1 — minimum and
# maximum. There is nothing to scale into, so there is no second PV.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-replica-pv-0
  labels:
    app: postgres-replica
spec:
  storageClassName: ""
  capacity:
    storage: 1Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/db-data/postgres-replica-0
    type: DirectoryOrCreate
---
# =============================================================================
# Read Service — what pgbouncer and DB_READ_HOST point at
# =============================================================================
# A real ClusterIP Service, deliberately NOT the StatefulSet's headless one: a
# pgbouncer `[databases]` entry names exactly one host and pgbouncer cannot
# load-balance, so reaching more than one standby depends on kube-proxy
# round-robining new connections across this Service's endpoints. A headless
# Service resolves to individual pod addresses and would pin every connection
# to whichever one DNS returned first.
#
# It selects ONLY `app: postgres-replica`. Adding the primary here would put a
# read-write endpoint behind the read pool, and the reason to keep them apart is
# the inverse failure: a Service carrying both would round-robin WRITES onto a
# read-only standby and fail roughly half of them with "cannot execute INSERT in
# a read-only transaction".
apiVersion: v1
kind: Service
metadata:
  name: postgres-read
  namespace: pipeline-builder
  labels:
    app: postgres-replica
    version: "18.6"
    track: stable
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: postgres-replica

---
# =============================================================================
# Headless Service — the StatefulSet's governing service (stable pod DNS)
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: postgres-replica-headless
  namespace: pipeline-builder
  labels:
    app: postgres-replica
    version: "18.6"
    track: stable
spec:
  clusterIP: None
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: postgres-replica

---
# =============================================================================
# PostgreSQL read-replica StatefulSet
# =============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-replica
  namespace: pipeline-builder
  labels:
    app: postgres-replica
    app.kubernetes.io/component: database
spec:
  serviceName: postgres-replica-headless
  # FIXED AT 1 ON THIS TARGET — minimum and maximum. The AWS targets may scale
  # to 2; a laptop cannot usefully host a second full copy of the database, and
  # the point of a standby here is to exercise the read path and the seeding
  # logic, not to add capacity. The alert rules are byte-identical with the AWS
  # targets and simply never trigger an action here, which is correct.
  #
  # (The AWS text, for reference: minimum 1, maximum 2. The ceiling of 2 is only reachable
  # once the WAL-retention guards are in place (max_slot_wal_keep_size on the
  # primary, plus the slot retained-bytes alert): each standby holds a
  # replication slot, and a slot retains WAL on the PRIMARY until the standby
  # consumes it. A stopped or stuck standby therefore does not degrade reads —
  # it fills the primary's 20Gi volume, and a full volume stops writes. A
  # read-replica feature that takes the write path down is strictly worse than
  # having no replica.)
  #
  # Scaling is alert-driven and operator-approved, NOT automatic: a new standby
  # must be seeded with pg_basebackup, which takes minutes and loads the primary
  # while it is already under pressure. See docs/runbooks/postgres-scaling.md.
  replicas: 1
  revisionHistoryLimit: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: postgres-replica
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
        prometheus.io/path: /metrics
      labels:
        app: postgres-replica
        app.kubernetes.io/component: database
        version: "18.6"
        track: stable
    spec:
      serviceAccountName: postgres-replica
      securityContext:
        runAsNonRoot: false  # PostgreSQL image requires root to drop privileges itself
      # Spread standbys across nodes and AZs: two standbys on one node survive
      # nothing a node failure does, and the whole point of the ceiling of 2 is
      # independent read capacity. ScheduleAnyway so a small cluster still
      # schedules them rather than leaving one Pending.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: postgres-replica
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: postgres-replica
      initContainers:
        # ---------------------------------------------------------------------
        # Seed this standby from the primary, or FAIL.
        # ---------------------------------------------------------------------
        # THE FIRST-INIT TRAP, and why this container exits non-zero rather than
        # letting the database start:
        #
        # The official entrypoint runs `initdb` when PGDATA is empty. On a
        # standby that produces a second, INDEPENDENT Postgres cluster which
        # passes every probe in this repo, reports healthy, serves queries, and
        # shares no data with the primary. Reads against it return an empty
        # database rather than an error. So an un-seeded standby must never
        # reach the postgres container at all: if pg_basebackup cannot run, this
        # exits non-zero and the pod stays in Init:Error, which is loud.
        #
        # Already-seeded standbys skip straight through — PG_VERSION exists, so
        # a restart or a rung change does not re-clone from the primary.
        - name: basebackup
          image: postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336  # postgres:18.6
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              # PG18's image puts PGDATA at /var/lib/postgresql/18/docker and
              # declares the VOLUME one level up, which is why the volume mounts
              # at /var/lib/postgresql here and on the primary.
              PGDATA=/var/lib/postgresql/18/docker

              if [ -s "$PGDATA/PG_VERSION" ]; then
                echo "standby already seeded (PG_VERSION present); skipping pg_basebackup"
                exit 0
              fi

              if [ -z "${DB_REPLICATION_PASSWORD:-}" ]; then
                echo "FATAL: DB_REPLICATION_PASSWORD is empty; refusing to start an UNSEEDED standby." >&2
                echo "       Starting Postgres now would initdb a second, independent cluster that" >&2
                echo "       looks healthy and shares no data with the primary." >&2
                exit 1
              fi

              echo "seeding standby from primary at ${DB_PRIMARY_HOST}:5432"
              mkdir -p "$PGDATA"
              chown -R postgres:postgres /var/lib/postgresql
              chmod 0700 "$PGDATA"

              # -R writes standby.signal and primary_conninfo into
              # postgresql.auto.conf, which is what makes the server come up as
              # a hot standby instead of a primary.
              # -X stream opens a second connection to fetch WAL during the
              # backup, so the clone cannot fail at the end for want of a
              # segment the primary has already recycled.
              # --slot + -C create a PERMANENT slot named for this pod, so the
              # primary retains WAL for it across restarts. That is also the
              # thing that can fill the primary's volume, hence
              # max_slot_wal_keep_size on the primary and the retained-bytes
              # alert. The slot name must be a valid identifier: lowercase,
              # digits and underscores only.
              SLOT="replica_$(echo "${POD_NAME}" | tr '.-' '__')"
              export PGPASSWORD="$DB_REPLICATION_PASSWORD"

              if ! gosu postgres pg_basebackup \
                    --host="$DB_PRIMARY_HOST" --port=5432 \
                    --username="$DB_REPLICATION_USER" \
                    --pgdata="$PGDATA" \
                    --wal-method=stream \
                    --write-recovery-conf \
                    --create-slot --slot="$SLOT" \
                    --checkpoint=fast --progress --verbose; then
                echo "FATAL: pg_basebackup failed; refusing to start an unseeded standby." >&2
                # Leave nothing half-written: a partial PGDATA with no
                # PG_VERSION would be retried, but a partial one WITH
                # PG_VERSION would be started as a corrupt cluster.
                rm -rf "${PGDATA:?}/"* || true
                exit 1
              fi
              echo "standby seeded; slot=$SLOT"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # The primary's Service, NOT pgbouncer: replication is a protocol
            # pgbouncer does not proxy (it needs a replication-mode startup
            # packet), so a standby seeded through the pooler fails at connect.
            - name: DB_PRIMARY_HOST
              value: "postgres"
            - name: DB_REPLICATION_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_REPLICATION_USER
            - name: DB_REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_REPLICATION_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
          resources:
            requests: { cpu: "100m", memory: 128Mi }
            limits:   { cpu: "1000m", memory: 512Mi }
          volumeMounts:
            - name: postgres-replica-data
              mountPath: /var/lib/postgresql
      containers:
        - name: postgres-replica
          image: postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336  # postgres:18.6
          # IDENTICAL to the primary's args, and that is a hard requirement
          # twice over:
          #
          # 1. Postgres REFUSES to start a hot standby whose max_connections,
          #    max_worker_processes, max_wal_senders, max_prepared_transactions
          #    or max_locks_per_transaction is LOWER than the primary's
          #    ("hot standby is not possible because max_connections = N is a
          #    lower setting than on the primary server"). So the standby cannot
          #    be given a smaller connection budget even if that were wanted.
          # 2. A standby is a promotion candidate. One sized below the primary
          #    is a standby that cannot take over.
          #
          # postgres-replica-parity.test.ts asserts this list equals the
          # primary's, so the two cannot drift.
          args:
            - "-c"
            - "max_connections=200"
            - "-c"
            - "shared_buffers=512MB"
            - "-c"
            - "effective_cache_size=1200MB"
            - "-c"
            - "work_mem=4MB"
            - "-c"
            - "max_wal_senders=10"
            - "-c"
            - "max_slot_wal_keep_size=256MB"
            # Lets read queries run longer before replay conflicts cancel them.
            # Only meaningful on a standby, which is why it is not in the
            # primary's list and is excluded from the parity assertion.
            - "-c"
            - "max_standby_streaming_delay=30s"
            - "-c"
            - "hot_standby_feedback=on"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: app-env
                  key: POSTGRES_DB
          # NO init-script mount, deliberately. postgres-init.sql only runs on
          # an empty data directory, and a seeded standby is not empty — but not
          # mounting it at all removes the possibility that a standby which
          # somehow reached an empty PGDATA could build its own schema and look
          # healthy. The init container is the primary guard; this is the second.
          resources:
            limits:
              cpu: "1000m"
              memory: 2Gi
            requests:
              cpu: "1000m"
              memory: 2Gi
          resizePolicy:
            - resourceName: cpu
              restartPolicy: NotRequired
            - resourceName: memory
              restartPolicy: RestartContainer
          # EXEC ON LOOPBACK, never httpGet/tcpSocket. Under Istio ambient the
          # kubelet -> podIP probe path does not work on this cluster, and every
          # network-probed workload here CrashLooped until it was changed to an
          # exec probe on 127.0.0.1 (54bca985d). 127.0.0.1 never leaves the pod
          # netns, so it bypasses ztunnel entirely.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: postgres-replica-data
              mountPath: /var/lib/postgresql
        # Same exporter as the primary, same reasoning: a sidecar shares the
        # database's lifecycle and network namespace, so it reaches Postgres on
        # localhost with no Service and no extra NetworkPolicy, and dies with
        # the database — which is the signal ServiceDown keys off.
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter@sha256:38606faa38c54787525fb0ff2fd6b41b4cfb75d455c1df294927c5f611699b17  # quay.io/prometheuscommunity/postgres-exporter:v0.17.1
          ports:
            - containerPort: 9187
              name: metrics
          env:
            - name: DATA_SOURCE_URI
              value: "localhost:5432/postgres?sslmode=disable"
            - name: DATA_SOURCE_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests: { cpu: "25m", memory: 48Mi }
            limits:   { cpu: "100m", memory: 128Mi }
  volumeClaimTemplates:
    - metadata:
        name: postgres-replica-data
        labels:
          app: postgres-replica
      spec:
        storageClassName: ""
        accessModes: ["ReadWriteOnce"]
        selector:
          matchLabels:
            app: postgres-replica
        resources:
          requests:
            # Same figure as the primary's claim, because a standby holds a full
            # copy of the database — not a subset. storage-size-contract.test.ts
            # enforces 1Gi on both local targets and 20Gi on both AWS ones.
            storage: 1Gi

---
# =============================================================================
# PodDisruptionBudget
# =============================================================================
# maxUnavailable rather than minAvailable: at the floor there is exactly ONE
# standby, and a minAvailable:1 PDB on a single-replica workload blocks every
# node drain forever. Reads fall back to the primary while it is away, so a
# standby being evicted costs throughput, never correctness.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgres-replica
  namespace: pipeline-builder
  labels:
    app: postgres-replica
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: postgres-replica

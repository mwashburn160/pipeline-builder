---
# =============================================================================
# Docker Registry Service
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: registry
  labels:
    app: registry
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
      name: registry
  selector:
    app: registry

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  labels:
    app: registry
    app.kubernetes.io/component: registry
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # Stateless — blobs live in RustFS (S3 driver), not a local volume. Recreate is
  # retained conservatively (single replica); RollingUpdate is now safe too.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
        app.kubernetes.io/component: registry
    spec:
      serviceAccountName: registry
      # Stateless API server — no need for the default ServiceAccount token
      # mounted at /var/run/secrets/kubernetes.io/serviceaccount/. Reduces blast
      # radius if the container is compromised (no kubelet API access).
      automountServiceAccountToken: false
      containers:
        - name: registry
          image: registry@sha256:fd374bae807c225661adfe2c0c1f9970a0b8fab1761fd7dfb91e0fd9a8748f9b  # registry:3
          ports:
            - containerPort: 5000
              name: registry
          # Stateless: blobs live in RustFS (S3 driver, see registry-config).
          # The only writable path is a small /tmp emptyDir scratch; TLS/JWT
          # come from mounted Secrets — all compatible with a read-only root FS.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          env:
            # Token-based auth — registry delegates to pipeline-image-registry's
            # /token endpoint. Every pull/push requires a bearer JWT signed
            # with the keypair in registry-token-secret. Anonymous reads are
            # disabled; htpasswd has been removed.
            - name: REGISTRY_AUTH
              value: "token"
            # Token realm advertised to clients in WWW-Authenticate.
            # In-cluster clients hit image-registry directly over plain
            # HTTP at the service-discovery endpoint. For external Docker
            # clients pulling via the public hostname, fronted by nginx,
            # the realm needs to be reachable from outside the cluster —
            # in that case override this env to a publicly-resolvable URL
            # via the deploy's app-env ConfigMap (and re-add a public
            # ingress for /image-registry/token).
            - name: REGISTRY_AUTH_TOKEN_REALM
              value: "http://image-registry:3000/token"
            - name: REGISTRY_AUTH_TOKEN_SERVICE
              value: "pipeline-image-registry"
            - name: REGISTRY_AUTH_TOKEN_ISSUER
              value: "platform"
            - name: REGISTRY_AUTH_TOKEN_ROOTCERTBUNDLE
              value: "/etc/registry/jwt-public.pem"
            - name: REGISTRY_HTTP_ADDR
              value: "0.0.0.0:5000"
            # One upload-session signing secret for every replica (and every
            # restart): without it each pod invents its own, and a chunked push
            # whose PATCH lands on another replica — or outlives a rollout — fails.
            - name: REGISTRY_HTTP_SECRET
              valueFrom:
                secretKeyRef:
                  name: registry-token-secret
                  key: http-secret
            # TLS deliberately disabled — registry serves plain HTTP on the
            # in-cluster ClusterIP service. nginx still fronts it on HTTPS
            # for external clients.
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
            # S3 (RustFS) credentials — per-service, bucket-scoped key. Driver +
            # endpoint + bucket come from the mounted config.yml.
            - name: REGISTRY_STORAGE_S3_ACCESSKEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-secret
                  key: registry-access-key
            - name: REGISTRY_STORAGE_S3_SECRETKEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-secret
                  key: registry-secret-key
          resources:
            limits:
              cpu: "400m"
              memory: 512Mi
            requests:
              cpu: "75m"
              memory: 256Mi
          # tcpSocket probes — /v2/ returns 401 (auth required) on a
          # token-auth registry, and kubelet treats 4xx as unhealthy, so
          # httpGet won't work here.
          readinessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: registry-token-cert
              mountPath: /etc/registry/jwt-public.pem
              subPath: jwt-public.pem
              readOnly: true
            # Custom config.yml selects the S3 (RustFS) storage driver.
            - name: registry-config
              mountPath: /etc/distribution/config.yml
              subPath: config.yml
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: registry-config
          configMap:
            name: registry-config
        - name: registry-token-cert
          secret:
            # Same keypair pipeline-image-registry uses for signing.
            # Operator creates this secret from openssl-generated cert via:
            #   kubectl create secret generic registry-token-secret \
            #     --from-file=jwt-public.pem=image-registry-jwt.crt \
            #     --from-file=jwt-private.pem=image-registry-jwt.key \
            #     -n pipeline-builder
            secretName: registry-token-secret
            items:
              - key: jwt-public.pem
                path: jwt-public.pem
---
# =============================================================================
# Registry storage config — S3 driver pointed at RustFS (replaces the image's
# filesystem default). Auth (token) + delete flag stay ENV-driven; only the S3
# credentials come from the rustfs-secret.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-config
  labels:
    app: registry
data:
  config.yml: |
    version: 0.1
    log:
      level: info
      fields:
        service: registry
    storage:
      cache:
        blobdescriptor: inmemory
      s3:
        region: us-east-1
        regionendpoint: http://rustfs:9000
        bucket: registry
        forcepathstyle: true
        secure: false
        rootdirectory: /
      # Stream blobs THROUGH the registry instead of redirecting clients to the
      # S3 (RustFS) endpoint — the same setting ec2/eks carry, for a reason that
      # applies here too. The S3 driver's default 302-redirects blob and CONFIG
      # GETs to `regionendpoint`; a container runtime pulling in-cluster follows
      # that fine, which is why this was thought unnecessary locally. But the
      # Registry browser is not a pull: image-registry fetches the config blob
      # itself to render a tag, follows the 302, and the read resets — the page
      # shows "Config blob unavailable: Internal server error. Showing raw JSON."
      # while the manifest (not blob-stored) renders normally.
      redirect:
        disable: true
    http:
      addr: 0.0.0.0:5000
      debug:
        addr: 0.0.0.0:5001

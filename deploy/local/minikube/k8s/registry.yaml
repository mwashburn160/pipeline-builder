---
# =============================================================================
# Docker Registry Service
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: registry
  labels:
    app: registry
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
      name: registry
  selector:
    app: registry

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  labels:
    app: registry
    app.kubernetes.io/component: registry
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # Stateless — blobs live in RustFS (S3 driver), not a local volume. Recreate is
  # retained conservatively (single replica); RollingUpdate is now safe too.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
        app.kubernetes.io/component: registry
        version: "3.1.2"
        track: stable
    spec:
      serviceAccountName: registry
      # Stateless API server — no need for the default ServiceAccount token
      # mounted at /var/run/secrets/kubernetes.io/serviceaccount/. Reduces blast
      # radius if the container is compromised (no kubelet API access).
      automountServiceAccountToken: false
      containers:
        - name: registry
          image: registry@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8  # registry:3.1.2
          ports:
            - containerPort: 5000
              name: registry
          # Stateless: blobs live in RustFS (S3 driver, see registry-config).
          # The only writable path is a small /tmp emptyDir scratch; TLS/JWT
          # come from mounted Secrets — all compatible with a read-only root FS.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          env:
            # Token-based auth — registry delegates to pipeline-image-registry's
            # /token endpoint. Every pull/push requires a bearer JWT signed
            # with the keypair in registry-token-secret. Anonymous reads are
            # disabled; htpasswd has been removed.
            - name: REGISTRY_AUTH
              value: "token"
            # Token realm advertised to clients in WWW-Authenticate.
            # In-cluster clients hit image-registry directly over plain
            # HTTP at the service-discovery endpoint. For external Docker
            # clients pulling via the public hostname, fronted by nginx,
            # the realm needs to be reachable from outside the cluster —
            # in that case override this env to a publicly-resolvable URL
            # via the deploy's app-env ConfigMap (and re-add a public
            # ingress for /image-registry/token).
            - name: REGISTRY_AUTH_TOKEN_REALM
              value: "http://image-registry:3000/token"
            - name: REGISTRY_AUTH_TOKEN_SERVICE
              value: "pipeline-image-registry"
            - name: REGISTRY_AUTH_TOKEN_ISSUER
              value: "platform"
            - name: REGISTRY_AUTH_TOKEN_ROOTCERTBUNDLE
              value: "/etc/registry/jwt-public.pem"
            - name: REGISTRY_HTTP_ADDR
              value: "0.0.0.0:5000"
            # One upload-session signing secret for every replica (and every
            # restart): without it each pod invents its own, and a chunked push
            # whose PATCH lands on another replica — or outlives a rollout — fails.
            - name: REGISTRY_HTTP_SECRET
              valueFrom:
                secretKeyRef:
                  name: registry-token-secret
                  key: http-secret
            # TLS deliberately disabled — registry serves plain HTTP on the
            # in-cluster ClusterIP service. nginx still fronts it on HTTPS
            # for external clients.
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
            # S3 (RustFS) credentials — per-service, bucket-scoped key. Driver +
            # endpoint + bucket come from the mounted config.yml.
            - name: REGISTRY_STORAGE_S3_ACCESSKEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-secret
                  key: registry-access-key
            - name: REGISTRY_STORAGE_S3_SECRETKEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-secret
                  key: registry-secret-key
          resources:
            limits:
              cpu: "400m"
              memory: 512Mi
            requests:
              cpu: "75m"
              memory: 256Mi
          # tcpSocket probes — /v2/ returns 401 (auth required) on a
          # token-auth registry, and kubelet treats 4xx as unhealthy, so
          # httpGet won't work here.
          # EXEC ON LOOPBACK — see k8s/pgbouncer.yaml for the full rationale.
          # The kubelet -> podIP probe path does not work under Istio ambient on
          # EKS Auto Mode; 127.0.0.1 bypasses ztunnel. `wget`/`nc` are present in
          # this image (audited on a live pod before converting — an exec probe
          # with a missing binary fails forever, which is worse than the bug).
          readinessProbe:
            exec:
              command: ["nc", "-z", "127.0.0.1", "5000"]
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["nc", "-z", "127.0.0.1", "5000"]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: registry-token-cert
              mountPath: /etc/registry/jwt-public.pem
              subPath: jwt-public.pem
              readOnly: true
            # Custom config.yml selects the S3 (RustFS) storage driver.
            - name: registry-config
              mountPath: /etc/distribution/config.yml
              subPath: config.yml
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: registry-config
          configMap:
            name: registry-config
        - name: registry-token-cert
          secret:
            # Same keypair pipeline-image-registry uses for signing.
            # Operator creates this secret from openssl-generated cert via:
            #   kubectl create secret generic registry-token-secret \
            #     --from-file=jwt-public.pem=image-registry-jwt.crt \
            #     --from-file=jwt-private.pem=image-registry-jwt.key \
            #     -n pipeline-builder
            secretName: registry-token-secret
            items:
              - key: jwt-public.pem
                path: jwt-public.pem
---
# =============================================================================
# Registry storage config — S3 driver pointed at RustFS (replaces the image's
# filesystem default). Auth (token) + delete flag stay ENV-driven; only the S3
# credentials come from the rustfs-secret.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-config
  labels:
    app: registry
data:
  config.yml: |
    version: 0.1
    log:
      level: info
      fields:
        service: registry
    storage:
      cache:
        blobdescriptor: inmemory
      s3:
        region: us-east-1
        regionendpoint: http://rustfs:9000
        bucket: registry
        forcepathstyle: true
        secure: false
        rootdirectory: /
      # Stream blobs THROUGH the registry instead of redirecting clients to the
      # S3 (RustFS) endpoint — the same setting ec2/eks carry, for a reason that
      # applies here too. The S3 driver's default 302-redirects blob and CONFIG
      # GETs to `regionendpoint`; a container runtime pulling in-cluster follows
      # that fine, which is why this was thought unnecessary locally. But the
      # Registry browser is not a pull: image-registry fetches the config blob
      # itself to render a tag, follows the 302, and the read resets — the page
      # shows "Config blob unavailable: Internal server error. Showing raw JSON."
      # while the manifest (not blob-stored) renders normally.
      redirect:
        disable: true
    http:
      addr: 0.0.0.0:5000
      debug:
        addr: 0.0.0.0:5001
---
# =============================================================================
# Registry BLOB garbage collection — weekly, Sunday 03:10 UTC
# =============================================================================
# Every manifest delete image-registry makes (age GC, storage prune, quarantine,
# org teardown) removes a REFERENCE; Distribution never frees the bytes by
# itself. This runs `registry garbage-collect` against the same RustFS bucket
# the registry serves from, so the bucket stops growing without bound.
#
# SAFE WHILE THE REGISTRY IS UP because image-registry — the registry's only
# token issuer — withholds `push` from every token from (03:10 − token TTL −
# 60s) until 03:40 UTC (api/image-registry/src/services/blob-gc-window.ts). No
# push token is alive at 03:10, so nothing can upload a layer the mark phase
# misses. Pulls carry on. The script refuses to run outside 03:10–03:35, so a
# late start is a FAILED job (CronJobRunFailed) rather than an unprotected run.
#
# NO --delete-untagged: pipelines pin images BY DIGEST, and the storage prune
# and the public yank deliberately leave the manifest pullable after removing
# its tag. That flag would delete exactly those.
#
# Pinned to the code's window by
# test/deploy-contracts/test/registry-blob-gc-contract.test.ts.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: registry-blob-gc
  labels:
    app: registry-blob-gc
spec:
  schedule: "10 3 * * 0"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  # Past 03:15 the run is skipped (and the next one is a week away) rather
  # than started late; CronJobNotScheduled sees a schedule that stops advancing.
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      # 03:10 + 25 min = 03:35, five minutes inside the push freeze.
      activeDeadlineSeconds: 1500
      template:
        metadata:
          labels:
            # NOT `app: registry` — the registry Service selects that label,
            # and this pod serves nothing.
            app: registry-blob-gc
            version: "3.1.2"
            track: stable
        spec:
          # The registry's ServiceAccount: the mesh principal RustFS admits.
          serviceAccountName: registry
          automountServiceAccountToken: false
          restartPolicy: Never
          containers:
            - name: registry-blob-gc
              image: registry@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8  # registry:3.1.2
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  dow=$(date -u +%w)
                  hm=$((1$(date -u +%H%M) - 10000))  # HHMM as a decimal (no octal 08/09)
                  if [ "$dow" != "0" ] || [ "$hm" -lt 310 ] || [ "$hm" -ge 335 ]; then
                    echo "registry-blob-gc: refusing to run outside the Sunday 03:10-03:35 UTC push freeze (now: day $dow, $hm UTC)" >&2
                    exit 1
                  fi
                  echo "registry-blob-gc: starting (push freeze in effect)"
                  registry garbage-collect /etc/distribution/config.yml
                  echo "registry-blob-gc: done"
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                seccompProfile:
                  type: RuntimeDefault
                capabilities:
                  drop: ["ALL"]
              env:
                - name: REGISTRY_STORAGE_DELETE_ENABLED
                  value: "true"
                - name: REGISTRY_STORAGE_S3_ACCESSKEY
                  valueFrom:
                    secretKeyRef:
                      name: rustfs-secret
                      key: registry-access-key
                - name: REGISTRY_STORAGE_S3_SECRETKEY
                  valueFrom:
                    secretKeyRef:
                      name: rustfs-secret
                      key: registry-secret-key
              resources:
                limits:
                  cpu: "500m"
                  memory: 512Mi
                requests:
                  cpu: "50m"
                  memory: 128Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: registry-config
                  mountPath: /etc/distribution/config.yml
                  subPath: config.yml
                  readOnly: true
          volumes:
            - name: tmp
              emptyDir: {}
            - name: registry-config
              configMap:
                name: registry-config

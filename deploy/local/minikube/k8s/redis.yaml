---
# =============================================================================
# Redis (Job Queue)
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app: redis

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: redis
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9121"
        prometheus.io/path: /metrics
      labels:
        app: redis
        app.kubernetes.io/component: cache
        version: "8.10.2-alpine"
        track: stable
    spec:
      serviceAccountName: redis
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: redis
          image: redis@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0  # redis:8.10.2-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            limits:
              cpu: "200m"
              memory: 256Mi
            requests:
              cpu: "50m"
              memory: 128Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
        # Prometheus exporter sidecar. Per-POD on purpose: with Sentinel the
        # interesting metrics (role, replication offset/lag, connected replicas)
        # differ per member, so one exporter per pod is what makes a failover
        # visible. Redis here requires no auth, so no credentials are wired.
        - name: redis-exporter
          image: oliver006/redis_exporter@sha256:0842ef7110e62b40bbde2d5c11f38c6fbd99f7100c75e3866637c1b335a1eff7  # oliver006/redis_exporter:v1.94.0
          args:
            - "--redis.addr=redis://localhost:6379"
          ports:
            - containerPort: 9121
              name: metrics
          resources:
            requests: { cpu: "20m", memory: 32Mi }
            limits:   { cpu: "100m", memory: 96Mi }
      volumes:
        - name: redis-data
          emptyDir: {}

---
# =============================================================================
# Redis PodDisruptionBudget
# =============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis
  labels:
    app: redis
spec:
  # Single-replica stateful pod: maxUnavailable so a node drain/upgrade can
  # evict it (minAvailable: 1 would block the drain forever — the one pod can
  # never stay "available" while being moved).
  maxUnavailable: 1
  selector:
    matchLabels:
      app: redis

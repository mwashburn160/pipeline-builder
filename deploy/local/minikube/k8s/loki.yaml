---
# =============================================================================
# Loki Service
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: loki
  labels:
    app: loki
spec:
  type: ClusterIP
  ports:
    - port: 3100
      targetPort: 3100
      protocol: TCP
      name: http
  selector:
    app: loki

---
# =============================================================================
# Loki Deployment
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  labels:
    app: loki
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # Single-writer RWO hostPath PVC: Recreate avoids the RollingUpdate two-pod
  # attach deadlock (the new pod can't bind the volume the old one still holds).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
        app.kubernetes.io/component: observability
    spec:
      serviceAccountName: loki
      securityContext:
        fsGroup: 10001
        runAsUser: 10001
        runAsNonRoot: true
      containers:
        - name: loki
          image: grafana/loki:3.6.11
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          args:
            - "-config.file=/etc/loki/loki-config.yml"
            - "-config.expand-env=true"
          env:
            - name: LOKI_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: minio-secret, key: loki-access-key } }
            - name: LOKI_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: minio-secret, key: loki-secret-key } }
          ports:
            - containerPort: 3100
              name: http
          resources:
            limits:
              cpu: "300m"
              memory: 512Mi
            requests:
              cpu: "50m"
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          # Loki's /ready stays red until it can reach its S3 (MinIO) backend,
          # which the minio-init Job provisions AFTER Loki starts. Gate liveness
          # behind a generous startup window so a cold MinIO doesn't trigger a
          # liveness-kill loop on a fresh provision (previously ~6 restarts
          # before the bucket/user existed). While startupProbe runs, liveness
          # and readiness are suspended; up to 10*30 = 300s for MinIO.
          startupProbe:
            httpGet:
              path: /ready
              port: 3100
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: loki-config
              mountPath: /etc/loki
              readOnly: true
            - name: loki-data
              mountPath: /loki
      volumes:
        - name: loki-config
          configMap:
            name: loki-config
        - name: loki-data
          emptyDir: {}

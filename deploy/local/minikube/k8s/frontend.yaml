---
# =============================================================================
# Frontend Service (Next.js)
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: frontend

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: frontend
      # Stateless API server — no need for the default ServiceAccount token
      # mounted at /var/run/secrets/kubernetes.io/serviceaccount/. Reduces blast
      # radius if the container is compromised (no kubelet API access).
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: frontend
                topologyKey: kubernetes.io/hostname
      containers:
        - name: frontend
          image: ghcr.io/mwashburn160/frontend:4.1.49@sha256:80a93d2c2c5cc09766712c5df5077425aaaa92034e53413151994eaf5cdc2b78
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: app-env
          env:
            # Server-side relay target for client error reports (runtime, from .env
            # via app-env); unset/empty = reporting off.
            - name: ERROR_REPORT_URL
              valueFrom:
                configMapKeyRef:
                  name: app-env
                  key: ERROR_REPORT_URL
                  optional: true
            - name: PLATFORM_BASE_URL
              value: "https://nginx:8443"
            # The billing service, addressed DIRECTLY rather than through the
            # gateway. The fulfillment page exchanges the AWS Marketplace token
            # here in getServerSideProps, so the token never reaches the browser
            # and /api/billing/marketplace/resolve can stay closed at the edge
            # (nginx answers 404). This is the ONLY call that bypasses
            # PLATFORM_BASE_URL, and deliberately so: routed through nginx the
            # route would have to be publicly reachable again.
            - name: BILLING_INTERNAL_URL
              value: "http://billing:3000"
            # Verify the gateway's dev cert against the local dev CA (bin/setup.sh
            # creates the dev-ca ConfigMap from deploy/bin/nginx-tls.sh's
            # certs/dev-ca.crt; the cert carries the `nginx` SAN). The image
            # itself trusts no dev CA, and TLS verification is never switched off.
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/pipeline-builder/dev-ca/dev-ca.crt
            # Public (browser-facing) origin for social-card / Open Graph absolute
            # URLs, resolved at RUNTIME (frontend/src/lib/site-url.ts). minikube is
            # reached on localhost via tunnel/port-forward.
            - name: APP_SITE_URL
              value: "https://localhost:8443"
            # Search Console ownership proof, rendered into every page's <head>.
            # Public by nature — it is served to anyone who loads a page — so it
            # belongs in app-env, never app-secrets.
            #
            # This is the same token as _includes/head-custom.html, which serves
            # docs.pipeline-builder.com. Google issues an HTML-tag token per
            # URL-prefix property, so it proves ownership of THAT property; a
            # different app hostname needs the token Search Console issued for
            # it, or a DNS-verified Domain property covering both. Set here at
            # the user's direction — override per deployment if the app domain
            # is verified separately.
            - name: GOOGLE_SITE_VERIFICATION
              value: "KrmtNnp50XoRl8njes83Ngf5iWNwwyVdfL6jYX460GA"
          volumeMounts:
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
            - name: dev-ca
              mountPath: /etc/pipeline-builder/dev-ca
              readOnly: true
          resources:
            limits:
              cpu: "500m"
              memory: 512Mi
            requests:
              cpu: "250m"
              memory: 256Mi
          # EXEC ON LOOPBACK — see k8s/pgbouncer.yaml for the full rationale.
          # Under Istio ambient the kubelet -> podIP probe path does not work on
          # EKS Auto Mode (verified: in-mesh pod -> this podIP:PORT succeeds, the
          # kubelet probe to the same address times out). 127.0.0.1 never leaves
          # the pod netns so it bypasses ztunnel. `node` ships in every service
          # image; this mirrors frontend/Dockerfile's own HEALTHCHECK.
          readinessProbe:
            exec:
              command: ["node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          startupProbe:
            exec:
              command: ["node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
      volumes:
        - name: dev-ca
          configMap:
            name: dev-ca
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
# =============================================================================
# Frontend HorizontalPodAutoscaler
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
    scaleDown:
      stabilizationWindowSeconds: 300

---
# =============================================================================
# Frontend PodDisruptionBudget
# =============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: frontend

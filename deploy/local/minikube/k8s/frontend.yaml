---
# =============================================================================
# Frontend Service (Next.js)
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: frontend

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: frontend
      # Stateless API server — no need for the default ServiceAccount token
      # mounted at /var/run/secrets/kubernetes.io/serviceaccount/. Reduces blast
      # radius if the container is compromised (no kubelet API access).
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: frontend
                topologyKey: kubernetes.io/hostname
      containers:
        - name: frontend
          image: ghcr.io/mwashburn160/frontend:4.1.30@sha256:b2c2b449c21256c6795a9b5d8878007f80106255d535f8dc273f1bdbc9ffb198
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: app-env
          env:
            # Server-side relay target for client error reports (runtime, from .env
            # via app-env); unset/empty = reporting off.
            - name: ERROR_REPORT_URL
              valueFrom:
                configMapKeyRef:
                  name: app-env
                  key: ERROR_REPORT_URL
                  optional: true
            - name: PLATFORM_BASE_URL
              value: "https://nginx:8443"
            # Verify the gateway's dev cert against the local dev CA (bin/setup.sh
            # creates the dev-ca ConfigMap from deploy/bin/nginx-tls.sh's
            # certs/dev-ca.crt; the cert carries the `nginx` SAN). The image
            # itself trusts no dev CA, and TLS verification is never switched off.
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/pipeline-builder/dev-ca/dev-ca.crt
            # Public (browser-facing) origin for social-card / Open Graph absolute
            # URLs, resolved at RUNTIME (frontend/src/lib/site-url.ts). minikube is
            # reached on localhost via tunnel/port-forward.
            - name: APP_SITE_URL
              value: "https://localhost:8443"
          volumeMounts:
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
            - name: dev-ca
              mountPath: /etc/pipeline-builder/dev-ca
              readOnly: true
          resources:
            limits:
              cpu: "500m"
              memory: 512Mi
            requests:
              cpu: "250m"
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
      volumes:
        - name: dev-ca
          configMap:
            name: dev-ca
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
# =============================================================================
# Frontend HorizontalPodAutoscaler
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
    scaleDown:
      stabilizationWindowSeconds: 300

---
# =============================================================================
# Frontend PodDisruptionBudget
# =============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: frontend

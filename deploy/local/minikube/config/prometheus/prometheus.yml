# Prometheus scrape configuration for Pipeline Builder services
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # REQUIRED by the Thanos sidecar (see prometheus.yaml / thanos-query.yaml).
  # The sidecar exits 1 with "no external labels configured ..." unless
  # Prometheus advertises uniquely-identifying external labels. `cluster`
  # identifies this deployment; `replica` enables Thanos de-duplication.
  external_labels:
    cluster: pipeline-builder-local
    replica: A

# Alert rules — Prometheus evaluates these every `evaluation_interval` and
# forwards firing alerts to Alertmanager (configured below). See
# alert-rules.yml for the actual rule definitions.
rule_files:
  - /etc/prometheus/alert-rules.yml

# Wire Prometheus to the Alertmanager Service. Resolved by kube-dns within
# the namespace.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # The kubelet, for PersistentVolume capacity (kubelet_volume_stats_*). Nothing
  # else collected these, so a volume filling up had no signal at all: the first
  # symptom was Postgres refusing writes.
  #
  # ONLY yields series where the volume's CSI driver implements the metrics
  # provider. Verified live on minikube: the collector runs
  # (kubelet_volume_metric_collection_duration_seconds_count{metric_source="du"}
  # was 20832) yet ZERO kubelet_volume_stats_* series existed, because ec2 and
  # minikube bind MANUAL hostPath PVs (storageClassName: "") and the kubelet
  # emits no volume stats for those. So these rules have data on eks (pb-ebs,
  # ebs.csi.eks.amazonaws.com) and are inert on the hostPath targets, where the
  # thing that actually fills is the single node disk shared by every hostPath
  # mount — that needs a node-level exporter, which this repo does not run.
  #
  # Egress is already permitted: allow-kube-api-egress selects `prometheus` and
  # opens 10250. RBAC needs nodes/metrics (added in k8s/prometheus.yaml) on top
  # of the nodes/proxy the discovery already used.
  - job_name: 'kubelet'
    scheme: https
    tls_config:
      # The kubelet serves a cert for the node's name/IP that the cluster CA does
      # not necessarily chain to on every distribution; the bearer token is what
      # authenticates us, and the hop is inside the cluster.
      insecure_skip_verify: true
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node
    metric_relabel_configs:
      # Keep ONLY the volume series. The kubelet exposes thousands of series per
      # node; this job exists for storage capacity and nothing else, so the rest
      # is dropped at ingest rather than paid for in Thanos.
      #
      # The inode gauges are kept alongside the byte gauges because they are a
      # SEPARATE way to run out of room: a volume holding many small files (a
      # RustFS bucket, a plugin build tree) can sit at 60% of its bytes and 100%
      # of its inodes, where every write fails ENOSPC while every byte-based rule
      # stays green. Dropping them at ingest made that failure unalertable.
      #
      # `used_bytes` is load-bearing despite looking redundant next to
      # capacity-minus-available: it is the only series the pb-efs claims can be
      # alerted on, because EFS reports an unbounded capacity and so has no
      # meaningful free percentage (see PersistentVolumeEfsOversized). Do not
      # prune it as unread.
      - source_labels: [__name__]
        action: keep
        regex: 'kubelet_volume_stats_(available|capacity|used)_bytes|kubelet_volume_stats_inodes(_free)?'

  # Auto-discover pods with prometheus.io/scrape annotation
  # cAdvisor on the same kubelet, for the NODE's root filesystem. This is the
  # signal that matters on the hostPath targets: ec2 and minikube bind manual
  # hostPath PVs and put every RustFS bucket, every database directory and every
  # other hostPath mount on ONE disk, so "the node disk is full" is the real
  # failure, and kubelet_volume_stats_* (the `kubelet` job above) reports nothing
  # for them at all.
  #
  # No node-exporter needed — verified live against this endpoint:
  #   container_fs_limit_bytes{device="/dev/vda1",id="/"}  1.0811e12
  #   container_fs_usage_bytes{device="/dev/vda1",id="/"}  1.157e11
  # Same :10250, same nodes/metrics RBAC, same allow-kube-api-egress rule.
  - job_name: 'kubelet-cadvisor'
    scheme: https
    metrics_path: /metrics/cadvisor
    tls_config:
      insecure_skip_verify: true
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node
    metric_relabel_configs:
      # cAdvisor is ~3MB of series per node. Keep the filesystem gauges only —
      # bytes and inodes, for the same reason the kubelet job keeps both: on the
      # hostPath targets every database directory, RustFS bucket and the registry
      # share ONE filesystem, so that is also one inode table to exhaust.
      - source_labels: [__name__]
        action: keep
        regex: 'container_fs_(limit|usage)_bytes|container_fs_inodes_(free|total)'
      # id="/" is the node-level (not per-container) view.
      - source_labels: [id]
        action: keep
        regex: '/'
      # Real block devices only. The same id="/" carries tmpfs entries (/dev,
      # /dev/shm) whose "capacity" is RAM, not disk — alerting on those would fire
      # on a busy shm and say nothing about the volume that is actually filling.
      - source_labels: [device]
        action: keep
        regex: '/dev/(nvme\d+n\d+p?\d*|[sxv]d[a-z]\d*)'
      # These are always empty on the node-level series; dropping them keeps the
      # series identical across scrapes rather than carrying six blank labels.
      - action: labeldrop
        regex: '(container|image|name|namespace|pod)'

  # Second cAdvisor job, deliberately NARROW: the CPU and memory series for the
  # DATABASE pods only, with the `pod` and `container` labels preserved.
  #
  # This is a SEPARATE job rather than a widened `keep` on kubelet-cadvisor
  # above, because that job's filter chain cannot accommodate these series at
  # all: it keeps only `id="/"` — the node-level view, which EXCLUDES every
  # per-container series — and then labeldrops `container`, `pod` and
  # `namespace`, the exact labels needed to select one workload. Widening its
  # regex would either drop the filesystem gauges it exists for or reintroduce
  # the ~3MB-per-node cardinality its filter exists to prevent.
  #
  # Without these series the Postgres saturation alerts are UNWRITABLE: a rule
  # referencing a metric nobody collects matches nothing, and a rule that
  # matches nothing is indistinguishable from a healthy system. That is why this
  # job comes before the alerts, not after.
  #
  # Scoping to the postgres pods is what keeps the cost near zero; without the
  # pod filter this is the whole cAdvisor firehose.
  #
  # NOTE: unlike alert-rules.yml, prometheus.yml is NOT byte-identical across
  # targets (three legitimate checksums — the scrape topologies genuinely
  # differ), so this job is added to eks, ec2 and minikube by hand. A target
  # that is missed simply has no data: its alerts never fire, which looks
  # exactly like a healthy database. prometheus-contract.test.ts asserts the job
  # exists on all three for that reason.
  - job_name: 'kubelet-cadvisor-db'
    scheme: https
    metrics_path: /metrics/cadvisor
    tls_config:
      insecure_skip_verify: true
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node
    metric_relabel_configs:
      # Usage AND the spec series: every threshold is expressed as a RATIO of
      # usage to limit, so the limit has to be queryable too. A ratio rule holds
      # at 1 CPU and at 4 and survives a rung change with no edit —
      # kube_pod_container_resource_limits is not a substitute here because
      # kube-state-metrics is absent on minikube.
      - source_labels: [__name__]
        action: keep
        regex: 'container_(cpu_usage_seconds_total|cpu_cfs_periods_total|cpu_cfs_throttled_periods_total|memory_working_set_bytes|spec_cpu_quota|spec_cpu_period|spec_memory_limit_bytes)'
      - source_labels: [namespace]
        action: keep
        regex: 'pipeline-builder'
      # The primary and (once Phase 1 lands) the standbys. Matches both the
      # Deployment's `postgres-<rs>-<hash>` and a StatefulSet's `postgres-0`.
      - source_labels: [pod]
        action: keep
        regex: 'postgres(-replica)?-.*'
      # The database container only. cAdvisor emits these same metric names for
      # the pod sandbox (container="") and for the cgroup hierarchy, so without
      # this the ratios would be computed against the wrong denominator — and it
      # also drops the metrics sidecar, whose saturation is not the signal.
      # `container` is also what the alerts use to tell primary from replica:
      # the primary's container is `postgres`, a standby's `postgres-replica`.
      - source_labels: [container]
        action: keep
        regex: 'postgres(-replica)?'


  # Third cAdvisor job: the NODE's CPU, and only that.
  #
  # It cannot live in `kubelet-cadvisor` above for the same reason the DB job
  # cannot: that job's chain keeps `device=~'/dev/...'`, and neither
  # container_cpu_usage_seconds_total nor machine_cpu_cores carries a `device`
  # label at all, so both would be dropped by a filter written for filesystem
  # gauges. Two series per node, so the cost is nil.
  #
  # Node CPU matters most on the target that cannot escape it: ec2 is ONE fixed
  # instance, so a saturated node is unfixable by scaling — every HPA replica
  # shares the box. On eks Auto Mode adds nodes, which makes this a cost and
  # latency signal rather than an outage one.
  - job_name: 'kubelet-cadvisor-node'
    scheme: https
    metrics_path: /metrics/cadvisor
    tls_config:
      insecure_skip_verify: true
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node
    metric_relabel_configs:
      - source_labels: [__name__]
        action: keep
        regex: 'container_cpu_usage_seconds_total|machine_cpu_cores'
      # Root cgroup only — the whole-node view. `machine_cpu_cores` carries no
      # `id` label at all, so the alternation has to admit the EMPTY value too:
      # a bare `/` would drop the denominator and leave NodeCpuSaturated matching
      # nothing, which is indistinguishable from an idle node.
      - source_labels: [id]
        action: keep
        regex: '/|'
      - action: labeldrop
        regex: '(container|image|name|namespace|pod)'

  # Fourth cAdvisor job: CPU THROTTLING for the application pods.
  #
  # Throttling is a different failure from usage, and the one this deployment is
  # actually exposed to: nearly every workload here sets `limits.cpu`, so the
  # kernel enforces a CFS quota per 100ms period. A bursty service — an API pod
  # serving a request spike — can average 40% CPU over five minutes while being
  # throttled in most individual periods, which shows up as p99 latency and
  # looks like a network or database problem. Every usage-ratio rule in
  # alert-rules.yml is blind to it by construction, because the average is fine.
  #
  # Scoped the same way as kubelet-cadvisor-db — namespace, pod, container — so
  # this is a few hundred series rather than the cAdvisor firehose. The pod list
  # is the app tier; postgres has its own job above and its own alerts.
  - job_name: 'kubelet-cadvisor-apps'
    scheme: https
    metrics_path: /metrics/cadvisor
    tls_config:
      insecure_skip_verify: true
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node
    metric_relabel_configs:
      # periods_total is the denominator: "throttled 400 times" means nothing
      # without "out of how many", and a mostly-idle pod legitimately throttles
      # a handful of periods.
      - source_labels: [__name__]
        action: keep
        regex: 'container_cpu_cfs_(periods|throttled_periods)_total'
      - source_labels: [namespace]
        action: keep
        regex: 'pipeline-builder'
      - source_labels: [pod]
        action: keep
        regex: '(ask|billing|compliance|frontend|image-registry|message|nginx|pipeline|platform|plugin|quota|reporting)-.*'
      # The service container only. cAdvisor emits these names for the pod
      # sandbox (container="") and the cgroup hierarchy too, which would make the
      # ratio wrong; container name equals service name on every one of these.
      - source_labels: [container]
        action: keep
        regex: 'ask|billing|compliance|frontend|image-registry|message|nginx|pipeline|platform|plugin|quota|reporting'

  - job_name: 'kubernetes-pods'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - pipeline-builder
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scheme]
        action: replace
        target_label: __scheme__
        regex: (.+)
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: service
      # `pod` distinguishes replicas (ServiceDown names the pod that stopped
      # answering; per-pod datastore alerts need it to tell members apart).
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      # The workload's image version, from the `version` pod label every
      # Deployment and StatefulSet carries. Without this relabel the label
      # exists on the pod but reaches no series, so nothing can be asked
      # per-version — which is the whole reason it is set. It is also what
      # Istio reads for canonical revision, so the two agree.
      - source_labels: [__meta_kubernetes_pod_label_version]
        target_label: version
      # The rollout track, from the `track` pod label. Unlike `version` this
      # never changes per release, which is what makes it usable in an alert
      # expression: scoping a page to track="stable" is what stops a canary's
      # own error budget paging the on-call under the stable service's name.
      - source_labels: [__meta_kubernetes_pod_label_track]
        target_label: track
    tls_config:
      insecure_skip_verify: true

  # Istio ambient mesh (istio-system). A SEPARATE job from `kubernetes-pods`
  # rather than widening that job's namespace list, because the two need
  # different relabeling: `kubernetes-pods` rewrites `service` from the pod's
  # `app` label, which would file every mesh component under a bogus service
  # name and collide with real workloads.
  #
  # Nothing needs enabling on the Istio side — the ambient profile already sets
  # `defaultProviders.metrics: [prometheus]` and every mesh pod ships the
  # prometheus.io/* annotations (ztunnel :15020, istiod + istio-cni :15014).
  # These metrics were simply never collected because discovery was scoped to
  # the pipeline-builder namespace.
  #
  # What this yields: ztunnel reports istio_tcp_* per workload PAIR
  # (source_workload -> destination_service) with `connection_security_policy`,
  # which is the mesh topology plus live mTLS coverage; istiod reports pilot_*
  # (xDS push latency, config errors, cert issuance).
  #
  # L4 ONLY, by design of ambient: there is no istio_requests_total here because
  # ztunnel is a TCP proxy. HTTP rates/latency/response codes require waypoint
  # proxies, which this deployment does not run.
  - job_name: 'istio-mesh'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - istio-system
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      # Identify the mesh component (ztunnel / istiod / istio-cni-node) rather
      # than reusing the app-workload `service` label.
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: mesh_component
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  # Static targets not auto-discovered by kubernetes-pods
  - job_name: 'nginx'
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ['nginx:8443']

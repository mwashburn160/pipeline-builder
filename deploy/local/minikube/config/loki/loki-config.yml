# =============================================================================
# Loki Configuration — Local Development
# =============================================================================
# RustFS (S3)-backed chunks + index, 7-day retention (compactor + retention_period).
# Docs: https://grafana.com/docs/loki/latest/configure/

# Multi-tenant. Each ORGANIZATION is a Loki tenant: promtail routes every line
# to its org's tenant (see the promtail `tenant` stage), and platform sends
# X-Scope-OrgID derived from the VERIFIED token on each read. Tenancy is
# therefore physical — a query-construction bug cannot read another org's logs,
# and per-tenant retention/deletion become possible.
#
# Unattributed lines (startup, workers, nginx/postgres) go to the `_infra`
# tenant, which only system admins can read.
#
# NOTE: flipping this to true means EVERY Loki client must send X-Scope-OrgID,
# Grafana's datasource included.
auth_enabled: true

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  path_prefix: /loki
  # Chunks + index live in RustFS (S3). `-config.expand-env=true` expands the
  # LOKI_S3_ACCESS_KEY / LOKI_S3_SECRET_KEY creds from the environment. /loki is
  # now just local scratch (WAL + shipper cache), so it can be ephemeral.
  # NOTE: never write a dollar-brace glob with a star (LOKI_S3 wildcard) in these
  # comments — expand-env parses the whole file (comments included) and a star
  # inside dollar-brace makes it fail to start with "missing closing brace".
  storage:
    s3:
      endpoint: rustfs:9000
      bucketnames: loki
      access_key_id: ${LOKI_S3_ACCESS_KEY}
      secret_access_key: ${LOKI_S3_SECRET_KEY}
      s3forcepathstyle: true
      insecure: true
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: '2024-01-01'
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

querier:
  # Lets a system admin read across orgs in one request via a pipe-separated
  # header (X-Scope-OrgID: orgA|orgB). Loki has no "all tenants" wildcard, so
  # platform enumerates the tenants it wants — see docs/observability-logs.md.
  multi_tenant_queries_enabled: true

limits_config:
  # 7-day retention — REQUIRED for the compactor's retention_enabled to actually
  # delete; without it deletion never fires and the loki bucket grows unbounded.
  retention_period: 168h
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
  # REQUIRED for promtail's `structured_metadata` stage (orgId) to be accepted —
  # Loki rejects structured metadata outright when this is off. Needs chunk
  # format v4, i.e. schema >= v13 (set above).
  allow_structured_metadata: true
  # Pinned rather than left to the default because the log-export pager walks a
  # window in query_range pages and its correctness depends on this ceiling.
  max_entries_limit_per_query: 5000
  # Enables the per-tenant delete API, which is how an org's logs are purged when
  # the org is deleted (log data must follow the same erasure path as the rest).
  # A per-tenant limit — it belongs HERE, not under compactor: (Loki 3.x rejects
  # it there at startup and crash-loops).
  deletion_mode: filter-and-delete

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: s3

chunk_store_config:
  chunk_cache_config:
    embedded_cache:
      enabled: true
      max_size_mb: 100

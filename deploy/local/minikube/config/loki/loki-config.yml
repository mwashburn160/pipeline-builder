# =============================================================================
# Loki Configuration — Local Development
# =============================================================================
# MinIO (S3)-backed chunks + index, 7-day retention (compactor + retention_period).
# Docs: https://grafana.com/docs/loki/latest/configure/

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  path_prefix: /loki
  # Chunks + index live in MinIO (S3). `-config.expand-env=true` expands the
  # LOKI_S3_ACCESS_KEY / LOKI_S3_SECRET_KEY creds from the environment. /loki is
  # now just local scratch (WAL + shipper cache), so it can be ephemeral.
  # NOTE: never write a dollar-brace glob with a star (LOKI_S3 wildcard) in these
  # comments — expand-env parses the whole file (comments included) and a star
  # inside dollar-brace makes it fail to start with "missing closing brace".
  storage:
    s3:
      endpoint: minio:9000
      bucketnames: loki
      access_key_id: ${LOKI_S3_ACCESS_KEY}
      secret_access_key: ${LOKI_S3_SECRET_KEY}
      s3forcepathstyle: true
      insecure: true
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: '2024-01-01'
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # 7-day retention — REQUIRED for the compactor's retention_enabled to actually
  # delete; without it deletion never fires and the loki bucket grows unbounded.
  retention_period: 168h
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: s3

chunk_store_config:
  chunk_cache_config:
    embedded_cache:
      enabled: true
      max_size_mb: 100

# Thanos object-storage config — ships Prometheus TSDB blocks to MinIO (S3).
# Bucket-scoped key (created by minio-init). Creds are env-var refs that Thanos
# expands at startup — injected from the THANOS_S3_* values (.env / minio-secret),
# which are random per provision, so they must never be literals here. Thanos
# expands those refs ANYWHERE in this file, comments included — never write the
# dollar-paren syntax in a comment, or startup fails on an unset variable.
# NOTE: the sidecar only UPLOADS blocks for durable long-term storage; querying
# the archived blocks is served by the Thanos store-gateway + querier
# (see thanos-query.yaml / docker-compose).
type: S3
config:
  bucket: thanos
  endpoint: minio:9000
  access_key: $(THANOS_S3_ACCESS_KEY)
  secret_key: $(THANOS_S3_SECRET_KEY)
  insecure: true

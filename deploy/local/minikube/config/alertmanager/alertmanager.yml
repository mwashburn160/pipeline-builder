# Alertmanager configuration for Pipeline Builder.
#
# Routes alerts from Prometheus by `severity` label:
#   - critical → critical-slack receiver (paging channel)
#   - warning  → warning-slack receiver (non-paging channel)
#
# NOTHING IN THIS FILE IS A SECRET, and nothing in it is templated. Alertmanager
# does not expand environment variables in its config, and the deploy runs no
# envsubst over it — every credential arrives as a MOUNTED FILE that Alertmanager
# re-reads per notification:
#   /etc/alertmanager-secrets/relay-token       the per-org platform relay bearer
#                                               (.env ALERT_WEBHOOK_INSTANCE_TOKEN)
#   /etc/alertmanager-slack/critical-url        .env SLACK_CRITICAL_WEBHOOK_URL
#   /etc/alertmanager-slack/warning-url         .env SLACK_WARNING_WEBHOOK_URL
# So the Slack webhook URLs stay in a Secret (k8s) / compose secret (docker) and
# never land in a ConfigMap. Set them in the target's .env; every target's setup
# REFUSES TO DEPLOY while they are still placeholders (deploy/bin/gen-env-secrets.sh
# -> pb_check_alert_delivery), and prints a loud banner if they are deliberately
# left empty. That same pre-flight also rejects THIS FILE if a webhook URL is
# ever pasted back into it inline — a ConfigMap is readable by anyone with
# namespace read access, so an inline `api_url` would be a leaked credential.
#
# Tunables:
#   group_wait      — batch alerts that fire within this window into one
#                     notification (avoid one-Slack-message-per-alert storms).
#   group_interval  — minimum time between batches for the same group.
#   repeat_interval — how often to re-fire a persistent alert. 4h matches the
#                     Alertmanager default; bump if the team is muting them.

global:
  resolve_timeout: 5m

route:
  receiver: 'default'
  group_by: ['alertname', 'severity', 'org_id']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # tenancy=org → relay to platform, which fans out to each org's configured
    # destinations (Slack webhook, generic HTTPS webhook, in-app message). The
    # `org_id` label on the alert drives the per-org lookup inside the relay.
    # `continue: false` because the relay is the terminal hop for org alerts —
    # we don't also send them to the ops-team Slack.
    - matchers:
        - tenancy = "org"
      receiver: 'platform-relay'
      group_by: ['org_id', 'alertname']
      continue: false

    # Storage alerts ALSO drive automatic expansion. `continue: true` is the
    # whole point: this is ADDITIVE, so the severity routes below still notify
    # the ops-team Slack. Automation must never be the only thing that knows a
    # volume is filling — it has a ceiling, and reaching that ceiling needs a
    # human to look at what is writing.
    #
    # Two routes because the two targets expand different things, and this file
    # is one copy on every target (the bringup contract compares them byte for
    # byte, because routing is substrate-independent). What each route can
    # actually DO is decided downstream, by platform and by its env:
    #
    #   PersistentVolume*  patches a PVC. Only eks can act — ec2 and minikube
    #                      bind manual hostPath PVs with no CSI driver to
    #                      resize, and the handler REFUSES a claim with no
    #                      storageClassName rather than issue a patch the API
    #                      server would accept and silently ignore. The alerts
    #                      have no data there either.
    #   NodeDisk*          grows the instance's EBS volume and resizes the
    #                      filesystem. Only ec2 can act; it is the target whose
    #                      every hostPath mount shares one disk.
    #
    # Both are OFF unless their env flag is set, so on a target that cannot act
    # the webhook is a no-op that answers "disabled".
    - matchers:
        - component = "storage"
        - alertname =~ "PersistentVolume(FillingUp|CriticallyFull)"
      receiver: 'pvc-autoexpand'
      continue: true
    - matchers:
        - component = "storage"
        - alertname =~ "NodeDisk(FillingUp|CriticallyFull)"
      receiver: 'node-disk-autoexpand'
      continue: true

    # Postgres vertical scaling (services/postgres-rung.ts). `continue: true`
    # so the saturation alerts ALSO reach the Slack receivers below — a human
    # should know the primary was resized, and the two underutilisation rules
    # are severity:info and fall through to no Slack receiver, which is the
    # intent: a cost signal, not a page.
    - matchers:
        - component = "postgres"
        - alertname =~ "Postgres(Primary(CpuSaturated|MemoryPressure|Underutilised)|ReadReplica(Saturated|Underutilised))"
      receiver: 'postgres-rung'
      continue: true

    # ─────────────────────────────────────────────────────────────────────
    # META-ALERTS FIRST, and the ordering is the whole point.
    #
    # These are the alerts ABOUT alert delivery — notifications failing, no
    # destination enabled, paging enabled with no key. Routing them through the
    # destinations whose failure they report is circular: with the Slack
    # receivers unconfigured, AlertmanagerNotificationsFailing fires, is sent to
    # the Slack receiver, fails, and increments the counter it is watching. It
    # retries forever and nobody ever reads it.
    #
    # `meta-alerts` is platform's webhook, which answers 200 whatever
    # SLACK_ALERTS_ENABLED and ONCALL_ENABLED say. So the one class of alert
    # whose delivery cannot be assumed goes somewhere that cannot fail to accept
    # it. `continue: true` so it ALSO takes the normal severity path — when Slack
    # does work, the channel should still carry it.
    - matchers:
        - delivery_meta = "true"
      receiver: 'meta-alerts'
      continue: true

    # ─────────────────────────────────────────────────────────────────────
    # Support criticals ALSO page a human, because they are the only alert
    # here backing a contractual out-of-hours promise.
    #
    # `critical-slack` below is named the paging channel and is the right
    # destination for everything else critical: an availability problem found
    # at 02:00 on a Sunday is still worked on Monday. Premium support is not
    # like that — it sells a first response "within 8 hours, ANY day", the one
    # target with no business-hours exemption, so its clock runs through
    # nights and weekends. SupportPremiumFirstResponseAtRisk fires at p90 > 6h
    # precisely to leave two hours to act, and a Slack message nobody is awake
    # to read spends both of them.
    #
    # ORDER IS LOAD-BEARING: this must precede the severity routes below,
    # because those end `continue: false`. If `severity = "critical"` matched
    # first, evaluation would stop and the pager would never be reached.
    #
    # `continue: true` so the alert ALSO reaches `critical-slack`. Both, on
    # purpose: the pager wakes somebody, the channel carries the full
    # annotation, the thread and the handover. A phone notification is a few
    # lines and must not be the only record.
    #
    # NARROW BY DESIGN — `component = support` only. Widening to all criticals
    # would page on cluster problems a channel already handles well enough,
    # and the fastest way to make a pager ignored is to let it fire for things
    # nobody is contractually on the hook for.
    - matchers:
        - severity = "critical"
        - component = "support"
      receiver: 'support-pager'
      continue: true

    # ─────────────────────────────────────────────────────────────────────
    # `info` and `none` severities, which previously went NOWHERE.
    #
    # The severity routes below cover `critical` and `warning` only, so the five
    # alerts carrying `info` or `none` fell through to the `default` receiver —
    # whose comment says "logged-only by default so an unrouted alert doesn't get
    # silently dropped" while carrying no configuration at all. Alertmanager has
    # no concept of logging a notification, so they WERE silently dropped.
    #
    # Sending them to the product makes them exist: the handler counts them on
    # `oncall_alerts_ignored_total{severity}` and logs them, and pages for
    # none of them (it pages only support criticals and delivery meta-alerts).
    # That is deliberately a sink rather than a notification — these are
    # dashboard-grade signals, and the point is that they are observable rather
    # than that somebody is told.
    - matchers:
        - severity =~ "info|none"
      receiver: 'meta-alerts'
      continue: false

    # Platform-wide alerts (tenancy=platform or unlabeled) keep going to the
    # ops-team Slack receivers, routed by severity.
    - matchers:
        - severity = "critical"
      receiver: 'critical-slack'
      continue: false
    - matchers:
        - severity = "warning"
      receiver: 'warning-slack'
      continue: false

receivers:
  - name: 'default'
    # Catch-all for un-routed alerts. Logged-only by default so an
    # unrouted alert doesn't get silently dropped.

  # Multi-tenant relay: posts the Alertmanager v2 webhook payload to the
  # platform service, which looks up the alert's `org_id` label in the
  # `org_alert_destinations` table and fans out to each enabled destination.
  #
  # Auth (both required by the platform relay, which is configured with
  # ALERT_WEBHOOK_INSTANCES=[{"id":"alertmanager","token":…}]):
  #   - `X-Alertmanager-Instance: alertmanager` selects the instance entry;
  #   - the Bearer token is read per request from credentials_file, a mounted
  #     secret holding ALERT_WEBHOOK_INSTANCE_TOKEN (generated into .env by
  #     gen-env-secrets; k8s: the `alertmanager-relay` Secret, docker: a compose
  #     secret). Nothing secret lives in this file.
  # The URL targets platform directly: platform serves the relay at
  # /observability/alert-webhook (nginx strips `/api` for browser traffic, so
  # the `/api/...` form only exists at the gateway).
  - name: 'platform-relay'
    webhook_configs:
      - url: 'http://platform:3000/observability/alert-webhook'
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager-secrets/relay-token
          http_headers:
            X-Alertmanager-Instance:
              values: ['alertmanager']
        send_resolved: true
        max_alerts: 64

  # Automatic expansion. Same instance + bearer auth as the relay above (the same
  # mounted token), DIFFERENT endpoints: the relay fans out notifications, these
  # mutate storage, and they should not share a blast radius. Two endpoints
  # rather than one because the actuators are unrelated — a PVC patch through
  # the Kubernetes API, versus an EBS modify plus a filesystem resize on an
  # instance — so each is enabled, permissioned and failed independently.
  #
  # send_resolved: false on both — a resolved alert means the volume stopped
  # filling, and there is nothing to act on. Sending it would only burn the
  # cooldown that exists because EBS refuses a second modify for ~6h.
  # Vertical scaling for Postgres. Same shape and same shared secret as
  # pvc-autoexpand: a MUTATION endpoint, deliberately not the notification
  # relay.
  #
  # send_resolved: false. A resolved saturation alert means the pressure passed —
  # often BECAUSE the rung went up — and re-POSTing it would ask for another
  # change. Scale-down has its own slow alert rather than being inferred from a
  # resolve.
  - name: 'postgres-rung'
    webhook_configs:
      - url: 'http://platform:3000/observability/postgres-rung'
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager-secrets/relay-token
          http_headers:
            X-Alertmanager-Instance:
              values: ['alertmanager']
        send_resolved: false
        max_alerts: 64

  - name: 'pvc-autoexpand'
    webhook_configs:
      - url: 'http://platform:3000/observability/pvc-autoexpand'
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager-secrets/relay-token
          http_headers:
            X-Alertmanager-Instance:
              values: ['alertmanager']
        send_resolved: false
        max_alerts: 64

  - name: 'node-disk-autoexpand'
    webhook_configs:
      - url: 'http://platform:3000/observability/node-disk-autoexpand'
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager-secrets/relay-token
          http_headers:
            X-Alertmanager-Instance:
              values: ['alertmanager']
        send_resolved: false
        max_alerts: 64

  # Slack receivers. `api_url_file` (not `api_url`) so the webhook URL — which
  # is itself a bearer credential: anyone holding it can post to the channel —
  # lives in a Secret mounted at /etc/alertmanager-slack, not in this ConfigMap.
  # Alertmanager reads the file per notification, so rotating the URL is a
  # Secret update + pod restart, with no config change.
  - name: 'critical-slack'
    slack_configs:
      - api_url_file: /etc/alertmanager-slack/critical-url
        channel: '#ops-pager'
        send_resolved: true
        title: '[CRITICAL] {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Summary:* {{ .Annotations.summary }}
          *Detail:*  {{ .Annotations.description }}
          *Labels:*  {{ range .Labels.SortedPairs }}{{ .Name }}={{ .Value }}, {{ end }}
          {{ end }}

  # Meta-alerts: the alerts about alert delivery itself.
  #
  # Same endpoint as `support-pager` — platform's webhook, which accepts
  # unconditionally — for one reason: it cannot fail for the reason the alert is
  # reporting. A Slack receiver with no URL cannot deliver "Slack has no URL",
  # and a pager with no routing key cannot page "the pager has no routing key".
  #
  # Platform decides what to do with them: with paging configured these DO page,
  # because alerting being broken is the one thing that makes every other alert
  # meaningless, and that is a narrow widening rather than a slippery slope — it
  # is not "all criticals", it is specifically the alerts whose own delivery
  # cannot be trusted. With paging off they are logged and counted, which is
  # still strictly more than vanishing into a failing webhook.
  - name: 'meta-alerts'
    webhook_configs:
      - url: 'http://platform:3000/observability/oncall-webhook'
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager-secrets/relay-token
          http_headers:
            X-Alertmanager-Instance:
              values: ['alertmanager']
        send_resolved: true
        max_alerts: 64

  # On-call paging, via PLATFORM rather than straight at PagerDuty.
  #
  # The obvious wiring is `pagerduty_configs` here, and it cannot be built:
  # this file is in the deploy contract's REQUIRED_IDENTICAL set and asserted
  # byte-identical across targets, and Alertmanager has no templating — so a
  # route that exists only when paging is enabled would need a second copy of
  # this whole config, in the shape of admin-consoles-disabled.conf. Pointing at
  # the product means the route is ALWAYS present and ONCALL_ENABLED is honoured
  # on the other side, where a disabled client accepts and drops. Alertmanager
  # sees a 200 either way, so a deployment that does not page accumulates no
  # notification failures.
  #
  # It costs nothing to reach: same service, port and relay-token the relay
  # above already uses, so there is no new Secret, no NetworkPolicy rule and no
  # istio-internal-routes.yaml entry. The receiver is DISTINCT from
  # `platform-relay` only in its path — that one fans out to a TENANT's
  # destinations and its route matches `tenancy = "org"`, which support alerts
  # (tenancy: platform) never match.
  #
  # `send_resolved: true` is what closes the incident: platform turns a resolved
  # alert into an Events v2 `resolve` on the same dedup key.
  - name: 'support-pager'
    webhook_configs:
      - url: 'http://platform:3000/observability/oncall-webhook'
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager-secrets/relay-token
          http_headers:
            X-Alertmanager-Instance:
              values: ['alertmanager']
        send_resolved: true
        max_alerts: 64

  - name: 'warning-slack'
    slack_configs:
      - api_url_file: /etc/alertmanager-slack/warning-url
        channel: '#ops-warnings'
        send_resolved: true
        title: '[WARN] {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Summary:* {{ .Annotations.summary }}
          *Detail:*  {{ .Annotations.description }}
          {{ end }}

  # ─────────────────────────────────────────────────────────────────────────
  # OPTIONAL: DORA incident feed (self-hosted single-tenant).
  #
  # Distinct from `platform-relay` above — that NOTIFIES an org's Slack/webhook
  # destinations; THIS records firing alerts as DORA INCIDENTS (automated
  # post-deploy Change Failure Rate + real MTTR) via the reporting service's
  # Alertmanager adapter. Uncomment the receiver AND add the matching route
  # under `route.routes:` above to enable it.
  #
  # Requirements:
  #   • An org-scoped `reporting:ingest` token — generate it in the app under
  #     Incident Reporting → Webhooks → "Generate webhook token", then mount it
  #     as a Secret at the credentials_file path below. The token binds to ONE
  #     org, so a shared Alertmanager attributes every incident to that org
  #     (fine for a single-tenant self-host; multi-tenant customers point their
  #     OWN cluster's Alertmanager here with their own token instead).
  #   • Alerting rules must set an `environment` label matching your deploy
  #     stage's environment (e.g. `production`, not `prod`) and a `severity`
  #     label. Alerts without a stable fingerprint or an `environment` label are
  #     skipped. If your label isn't literally `environment`, append
  #     `?environmentLabel=<label>` to the url.
  #
  # - name: 'pb-incidents'
  #   webhook_configs:
  #     - url: 'http://nginx/api/reports/incidents/alertmanager'   # in-cluster gateway (or your public https ingress)
  #       http_config:
  #         authorization:
  #           type: Bearer
  #           credentials_file: /etc/alertmanager/secrets/pb-ingest-token
  #       send_resolved: true   # endsAt → resolvedAt — this is what MTTR measures
  #       max_alerts: 1000      # the adapter rejects (doesn't truncate) larger batches
  #
  # Route deploy-environment alerts to it (keep `continue: true` if they should
  # ALSO relay/notify). Add under `route.routes:` above:
  #
  #   - matchers:
  #       - environment =~ ".+"
  #     receiver: 'pb-incidents'
  #     continue: true

# Inhibition rules: a higher-severity alert silences related lower-severity ones
# (e.g. when something is `critical`, the matching `warning` is noise).
# =============================================================================
# Inhibition — suppress the CONSEQUENCES of a known root cause
# =============================================================================
# At 158 rules one root cause is a pager flood unless the dependent alerts are
# suppressed, and a flood is functionally the same as no alert: nobody reads
# forty pages to find the one that matters.
#
# THE CONSTRAINT THAT SHAPES ALL OF THIS: `equal` matches label names that must
# exist on BOTH sides. A rule listing a label only one side carries silently
# matches nothing and inhibits nothing — it looks correct in review and does
# nothing in production. So each rule below says which labels it relies on, and
# the tempting ones that CANNOT be expressed are recorded at the bottom rather
# than written as rules that quietly no-op.
#
# `equal: []` means "suppress globally", which is only honest for a genuinely
# cluster-wide dependency — DNS, the waypoint, Redis. A node-scoped cause gets
# `equal: ['node']` instead, so a saturated node never silences a healthy one.
inhibit_rules:
  # Same alert at two severities: the critical one is the whole story.
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ['alertname', 'component']

  # DNS is the one dependency EVERY network call shares, so when it is gone the
  # S2S errors, circuit trips, 5xx bursts and refused streams are all the same
  # incident restated. Global by necessity: the DNS alerts carry no label in
  # common with their consequences, and that is correct — the blast radius is
  # the whole cluster.
  - source_matchers:
      - alertname =~ "CoreDnsUnreachable|DnsQueriesAbsent"
    target_matchers:
      - alertname =~ "S2sErrorRateHigh|S2sRetryAmplification|S2sCircuitProbeExpiring|ServiceCircuitOpen|ServiceError5xxBurst|SseStreamsRefused|GatewayError5xxRatioHigh"
    equal: []

  # A dead waypoint cannot report 403s, and the six services behind it fail
  # rather than bypassing it — so its denial and error alerts are downstream of
  # this one, not independent findings.
  - source_matchers:
      - alertname = "WaypointUnavailable"
    target_matchers:
      - alertname =~ "MeshAuthzDenialsSpike|S2sErrorRateHigh|ServiceError5xxBurst"
    equal: []

  # Redis at its noeviction cap fails every WRITE, and three mechanisms are
  # documented to fail closed on exactly that: the sweep leader lock, PVC
  # auto-expansion and node-disk auto-expansion. Those alerts are the symptom.
  - source_matchers:
      - alertname =~ "RedisMemoryNearLimit|RedisUnreachable"
    target_matchers:
      - alertname =~ "BackgroundSweepSkippedNoLock|BackgroundSweepFailing|PvcAutoExpandFailing|NodeDiskAutoExpandFailing"
    equal: []

  # A saturated node throttles and squeezes every container ON THAT NODE, so
  # scope it to the node rather than globally — otherwise one busy node silences
  # a genuine problem on another. Both sides come from cAdvisor jobs whose
  # relabel_configs set `node`, which is what makes this expressible at all.
  - source_matchers:
      - alertname =~ "NodeCpuSaturated|NodeMemorySaturated"
    target_matchers:
      - alertname =~ "ContainerCpuThrottling|ContainerMemoryNearLimit"
    equal: ['node']

  # A service that is DOWN will also be returning 5xx to its callers. Both
  # carry `service` — ServiceDown from the kubernetes-pods relabel that maps the
  # `app` pod label, ServiceError5xxBurst from `sum by (service)` — so this one
  # can be scoped properly instead of globally.
  - source_matchers:
      - alertname = "ServiceDown"
    target_matchers:
      - alertname = "ServiceError5xxBurst"
    equal: ['service']

  # DELIBERATELY NOT WRITTEN, because they cannot be expressed correctly:
  #
  #   ServiceDown -> S2sErrorRateHigh. Semantically right: calls to a dead
  #   service fail. But ServiceDown labels the dead service `service` while the
  #   S2S alerts label the callee `target`, and inhibition cannot rename a
  #   label. `equal: []` would be wrong — it would silence S2S errors to a
  #   HEALTHY target whenever any unrelated service was down.
  #
  #   Node saturation -> ContainerOOMKilled / PodNotScheduled. Also right, but
  #   those two come from kube-state-metrics, which carries no `node` label at
  #   all, and suppressing them globally would hide a pod that cannot schedule
  #   for an unrelated reason.
  #
  # Both would need a label added at the source to express; neither is worth a
  # rule that silently does nothing.

name: cdk-synth
description: AWS CDK synthesis plugin for compiling CDK applications into CloudFormation templates with Docker-enabled self-mutation and parallel asset publishing using AWS CDK CodeBuildStep
keywords:
  - aws
  - cdk
  - cloudformation
  - synthesize
category: infrastructure
# version is the toolchain RELEASE version, shared with pipeline-bootstrap and
# GENERATED by deploy/bin/sync-image-tags.sh (patch bumped on any sourceDigest
# change). Bump minor/major by hand in BOTH specs together.
version: 1.1.0
pluginType: CodeBuildStep
computeType: MEDIUM
timeout: 45
failureBehavior: fail
secrets: []
primaryOutputDirectory: cdk.out
metadata:
  aws:cdk:pipelines:codepipeline:selfmutation: true
  aws:cdk:pipelines:codepipeline:dockerenabledforselfmutation: true
  aws:cdk:pipelines:codepipeline:publishassetsinparallel: true
  aws:cdk:codebuild:buildenvironment:privileged: true
dockerfile: Dockerfile
installCommands:
  - test -d cdk.out || mkdir -p cdk.out
  # No `npm install -g pipeline-manager` self-heal: this image is FROM
  # pipeline-bootstrap, which bakes in the version-pinned CLI, and a step
  # resolved to this plugin always runs on this digest-pinned image. The old
  # unpinned install could only ever fire on a misconfigured registry — and
  # then it fetched whatever npm called `latest` into the step that resolves
  # every other step's image digest. Missing CLI now fails loudly (exit 127).
  - command -v pipeline-manager
commands:
  # A private-CA platform: curl verifies against PLATFORM_CA_BUNDLE (the CLI
  # reads it from the env itself). TLS is never disabled here.
  - 'if [ -n "${PLATFORM_CA_BUNDLE:-}" ]; then printf "%s\n" "$PLATFORM_CA_BUNDLE" > /tmp/pb-platform-ca.pem; set -- --cacert /tmp/pb-platform-ca.pem; fi; curl -sf "$@" ${PLATFORM_BASE_URL}/health > /dev/null || { echo "ERROR: Platform unreachable at ${PLATFORM_BASE_URL}"; exit 1; }'
  - pipeline-manager pipeline synth --id ${PIPELINE_ID} --store-tokens --quiet --no-notices --output cdk.out
env:
  CDK_DEFAULT_REGION: ${AWS_REGION}
  CDK_DEFAULT_ACCOUNT: ${AWS_ACCOUNT_ID}
  RESOLVED_SYNTH_PLUGIN: 'true'

# ─── Catalog metadata (plugin-ecosystem W0.2) ───
license: Apache-2.0
homepageUrl: https://docs.aws.amazon.com/cdk/
sourceUrl: https://github.com/mwashburn160/pipeline-builder/tree/main/deploy/toolchain/cdk-synth
# icon: none — AWS marks were removed from Simple Icons at AWS's request; no confirmed press-kit permission (monogram; see _icons/SOURCES.md)
network:
  egress:
    - "*.amazonaws.com"
    - "registry.npmjs.org"
    - "registry.yarnpkg.com"
    - "pypi.org"
    - "files.pythonhosted.org"
changelog: |
  1.1.0: Built FROM the versioned pipeline-bootstrap release, pinned by digest (ARG BOOTSTRAP_IMAGE). The version is now the managed toolchain release version, shared with pipeline-bootstrap; the bootstrap image adds cdk-assets.
  1.0.3: Rebuilt on the pipeline-bootstrap image carrying pipeline-manager 4.4.19 (pipeline-core 4.4.7, which ships the prebuilt PluginLookup bundle). 1.0.2's CLI failed every synth with `Lock file ... pipeline-core/lib/handlers/pnpm-lock.yaml doesn't exist`.
  1.0.2: Dropped the unpinned `npm install -g pipeline-manager` self-heal (the image always carries the pinned CLI); the platform health check verifies TLS against PLATFORM_CA_BUNDLE when set.
  1.0.0: Initial Official catalog release. Runs as the non-root `plugin` user (uid 1000); every download pinned and digest-verified.

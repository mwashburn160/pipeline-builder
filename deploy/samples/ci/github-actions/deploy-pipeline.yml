# Sample GitHub Actions workflow: instantiate a Pipeline Builder template, then
# create + deploy the resulting pipeline in one step with
# `pipeline-manager pipeline create --deploy`.
#
# Copy this file to `.github/workflows/deploy-pipeline.yml` in your repo and
# adjust the template name, region, and secrets. It renders a golden-path
# template into concrete pipeline props, creates the pipeline record on the
# platform, and then runs `cdk deploy` for it (registering the deployed ARN), so
# a green run means the pipeline exists AND is deployed to AWS.
#
# ── Prerequisites ────────────────────────────────────────────────────────────
# Secrets (Settings → Secrets and variables → Actions):
#   PLATFORM_BASE_URL     Base URL of your Pipeline Builder platform
#                         (e.g. https://pipeline.example.com)
#   PLATFORM_TOKEN        A Personal Access Token — create with
#                         `pipeline-manager auth pat` or the dashboard.
#   PB_ORG_ID             Your organization's ID (UUID). Supplied as the
#                         template's `orgId` input; selects the GitHub token
#                         secret at pipeline-builder/<orgId>/github-token.
#   AWS_DEPLOY_ROLE_ARN   IAM role to assume via GitHub OIDC. The role trusts
#                         GitHub's OIDC provider and carries CDK/CloudFormation
#                         deploy permissions. (Kept in secrets, never committed —
#                         the ARN embeds an account id.)
# Variables (or hardcode below):
#   AWS_REGION            e.g. us-east-1
#
# AWS auth uses OIDC (no long-lived keys). To use static keys instead, drop the
# `permissions:` + `configure-aws-credentials` role-to-assume and export
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY from secrets in the deploy step.

name: Deploy Pipeline

on:
  # Manual trigger from the Actions tab.
  workflow_dispatch:
    inputs:
      template_name:
        description: Name of the pipeline template to instantiate
        required: true
        default: react-javascript
      project:
        description: Project name for the new pipeline
        required: true
        default: react
      organization:
        description: Organization name for the new pipeline
        required: true
        default: AcmeCorp
  # Optional: deploy on every push to main.
  # push:
  #   branches: [main]

permissions:
  contents: read
  id-token: write # required for AWS OIDC role assumption

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      TEMPLATE_NAME: ${{ github.event.inputs.template_name || 'react-javascript' }}
      PB_PROJECT: ${{ github.event.inputs.project || 'react' }}
      PB_ORGANIZATION: ${{ github.event.inputs.organization || 'AcmeCorp' }}
    steps:
      - uses: actions/checkout@v4

      # pipeline-manager needs Node 24+.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # `pipeline create --deploy` shells out to `cdk deploy`, whose synth uses
      # esbuild + pnpm. Install all four on PATH.
      - name: Install pipeline-manager and CDK toolchain
        run: npm install -g @pipeline-builder/pipeline-manager aws-cdk esbuild pnpm

      # Render the golden-path template into concrete pipeline props. This
      # creates nothing on the platform — it only resolves the template's
      # declared inputs into a props file for the next step.
      - name: Instantiate pipeline template
        env:
          PLATFORM_BASE_URL: ${{ secrets.PLATFORM_BASE_URL }}
          PLATFORM_TOKEN: ${{ secrets.PLATFORM_TOKEN }}
        run: |
          pipeline-manager template instantiate \
            --name "$TEMPLATE_NAME" \
            --project "$PB_PROJECT" \
            --organization "$PB_ORGANIZATION" \
            --input "orgId=${{ secrets.PB_ORG_ID }}" \
            --output pipeline-props.json

      - name: Create and deploy pipeline
        env:
          PLATFORM_BASE_URL: ${{ secrets.PLATFORM_BASE_URL }}
          PLATFORM_TOKEN: ${{ secrets.PLATFORM_TOKEN }}
        run: |
          pipeline-manager pipeline create \
            --file pipeline-props.json \
            --deploy \
            --region "$AWS_REGION" \
            --require-approval never

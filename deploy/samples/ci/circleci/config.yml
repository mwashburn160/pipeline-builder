# Sample CircleCI config: instantiate a Pipeline Builder template, then create +
# deploy the resulting pipeline in one step with
# `pipeline-manager pipeline create --deploy`.
#
# Copy this file to `.circleci/config.yml` in your repo and adjust the template
# name, region, and context. The job renders a golden-path template into concrete
# pipeline props, creates the pipeline record on the platform, and then runs
# `cdk deploy` for it (registering the deployed ARN), so a green job means the
# pipeline exists AND is deployed to AWS.
#
# ── Prerequisites ────────────────────────────────────────────────────────────
# Create a CircleCI context (Organization Settings → Contexts), e.g.
# "pipeline-builder-deploy", holding these environment variables:
#   PLATFORM_BASE_URL     Base URL of your Pipeline Builder platform
#                         (e.g. https://pipeline.example.com)
#   PLATFORM_TOKEN        An access key (pb_pat_…) — create with
#                         `pipeline-manager auth pat` or the dashboard.
#   PB_ORG_ID             Your organization's ID (UUID). Supplied as the
#                         template's `orgId` input; selects the GitHub token
#                         secret at pipeline-builder/<orgId>/github-token.
#   AWS_REGION            e.g. us-east-1
#   AWS_DEPLOY_ROLE_ARN   IAM role to assume via CircleCI OIDC. The role trusts
#                         CircleCI's OIDC provider (aud = your org id) and
#                         carries CDK deploy permissions. (Kept in the context,
#                         never committed — the ARN embeds an account id.)
#
# AWS auth uses CircleCI OIDC tokens ($CIRCLE_OIDC_TOKEN) exchanged for
# temporary credentials via STS (no long-lived keys). To use static keys
# instead, put AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY in the context and drop
# the assume-role step.

version: 2.1

jobs:
  create-and-deploy:
    docker:
      - image: cimg/node:24.14 # pipeline-manager requires Node 24+
    environment:
      # Any template in the catalog — see deploy/samples/templates/ for the ones
      # seeded by `load-templates.sh`.
      TEMPLATE_NAME: react-javascript
      PB_PROJECT: react
      PB_ORGANIZATION: AcmeCorp
    steps:
      - checkout
      - run:
          name: Install pipeline-manager and CDK toolchain
          # `pipeline create --deploy` shells out to `cdk deploy`, whose synth
          # uses esbuild + pnpm. Install all four on PATH.
          command: sudo npm install -g @pipeline-builder/pipeline-manager aws-cdk esbuild pnpm
      - run:
          name: Assume AWS role via OIDC
          command: |
            CREDS=$(aws sts assume-role-with-web-identity \
              --role-arn "$AWS_DEPLOY_ROLE_ARN" \
              --role-session-name "circleci-${CIRCLE_WORKFLOW_ID}" \
              --web-identity-token "$CIRCLE_OIDC_TOKEN" \
              --duration-seconds 3600 \
              --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
              --output text)
            echo "export AWS_ACCESS_KEY_ID=$(echo "$CREDS" | cut -f1)"     >> "$BASH_ENV"
            echo "export AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | cut -f2)" >> "$BASH_ENV"
            echo "export AWS_SESSION_TOKEN=$(echo "$CREDS" | cut -f3)"     >> "$BASH_ENV"
      - run:
          name: Instantiate pipeline template
          # Creates nothing on the platform — this only resolves the template's
          # declared inputs into a props file for the create step below.
          command: |
            pipeline-manager template instantiate \
              --name "$TEMPLATE_NAME" \
              --project "$PB_PROJECT" \
              --organization "$PB_ORGANIZATION" \
              --input "orgId=$PB_ORG_ID" \
              --output pipeline-props.json
      - run:
          name: Create and deploy pipeline
          command: |
            pipeline-manager pipeline create \
              --file pipeline-props.json \
              --deploy \
              --region "$AWS_REGION" \
              --require-approval never

workflows:
  deploy:
    jobs:
      - create-and-deploy:
          context: pipeline-builder-deploy
          # Run only when triggered manually / on the default branch as you prefer:
          # filters:
          #   branches:
          #     only: main

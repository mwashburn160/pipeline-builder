# CLI Configuration File
# Save this as config.yml in your project root or specify with CLI_CONFIG_PATH

# ============================================================================
# API Configuration
# ============================================================================
api:
  # Base URL for the API
  # Can be overridden with the PLATFORM_BASE_URL environment variable
  baseUrl: https://localhost:8443
  
  # Request timeout in milliseconds
  timeout: 30000
  
  # SSL/TLS Certificate Validation
  # Set to false to disable certificate validation (DEVELOPMENT ONLY)
  # Default: true (secure)
  # 
  # WARNING: Setting this to false disables certificate validation and makes
  # your application vulnerable to man-in-the-middle attacks. Only use this
  # in development environments with self-signed certificates.
  rejectUnauthorized: true
  
  # API Endpoints
  #
  #   pipelineUrl     - The pipelines API. Lists and queries at the root
  #                     (/api/pipelines?project=...), one pipeline at
  #                     /api/pipelines/{id}, create by POST to the root.
  #
  #   pipelineTemplateUrl - The golden-path template catalog.
  #
  #   pluginUrl       - The plugins API. Lists and queries at the root
  #                     (/api/plugins?name=...), one plugin at /api/plugins/{id},
  #                     lifecycle actions at /api/plugins/{id}/deprecate|yank.
  #
  #   pluginUploadUrl - Plugin zip upload (multipart POST, long timeout).
  pipelineUrl: /api/pipelines
  pipelineTemplateUrl: /api/pipeline-templates
  pluginUrl: /api/plugins
  pluginUploadUrl: /api/plugins/upload

# ============================================================================
# AUTHENTICATION
# ============================================================================
# Authentication never comes from this file (an `auth:` section is ignored).
# Sign in with `pipeline-manager auth login` (the session is stored per
# platform), or set an access key for unattended use:
#   export PLATFORM_TOKEN='your-access-key'
#
# The token should NEVER be committed to version control.
# ============================================================================

# ============================================================================
# ENVIRONMENT VARIABLES
# ============================================================================
# The following environment variables are used by the CLI:
#
# OPTIONAL:
#   PLATFORM_TOKEN              - Access key for API access; wins over the
#                                 stored `auth login` session
#
#   PLATFORM_BASE_URL           - Override api.baseUrl
#                                 Example: export PLATFORM_BASE_URL='https://api.example.com'
#
#   CLI_CONFIG_PATH             - Path to this config file
#                                 Example: export CLI_CONFIG_PATH='/path/to/config.yml'
#
#   PLATFORM_TLS_VERIFY         - Set to 'false' to disable cert validation (refused in production)
#                                 Example: export PLATFORM_TLS_VERIFY='false'
#
#   PLATFORM_CA_BUNDLE          - PEM text of a private CA to trust (keeps verification on)
#
#   UPLOAD_TIMEOUT_MS           - Plugin upload timeout in milliseconds
#
# ============================================================================

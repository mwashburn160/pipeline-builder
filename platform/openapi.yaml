openapi: 3.0.3
info:
  title: Platform Service API
  description: |
    Identity, organizations, RBAC and invitations. This document describes the
    core sign-in, profile, organization, invitation and user-administration
    routes only; platform mounts about 270. The generated, complete route list
    (with each route's permission, step-up and assurance gates) is
    frontend/src/generated/route-table/platform.json.

    Every success body is the shared envelope
    `{ success: true, statusCode, data?, message? }`; the payloads below are
    what `data` holds.
  version: 0.1.0
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://platform:3000
    description: Internal Docker network
  - url: http://localhost:3000
    description: Local development

# =============================================================================
# Paths
# =============================================================================
paths:
  # ---------------------------------------------------------------------------
  # Health & Metrics
  # ---------------------------------------------------------------------------
  /health:
    get:
      summary: Liveness probe
      description: 200 while the process answers. Dependency status is informational only; readiness is GET /ready.
      operationId: healthCheck
      tags: [Health]
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'

  /ready:
    get:
      summary: Readiness probe
      operationId: readinessCheck
      tags: [Health]
      security: []
      responses:
        '200':
          description: Ready to serve
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
        '503':
          description: A dependency (MongoDB) is disconnected

  /metrics:
    get:
      summary: Prometheus metrics
      operationId: getMetrics
      tags: [Health]
      security: []
      responses:
        '200':
          description: Prometheus text exposition format
          content:
            text/plain:
              schema:
                type: string

  # ---------------------------------------------------------------------------
  # Authentication
  # ---------------------------------------------------------------------------
  /auth/register:
    post:
      summary: Register a new user account
      operationId: register
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: '#/components/schemas/RegisterResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/login:
    post:
      summary: Authenticate and receive tokens
      operationId: login
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: >-
            Login successful — or, for an account with an authenticator app, `{ mfaRequired: true,
            challengeId }` to finish at POST /auth/mfa/verify, or `{ passwordChangeRequired: true, ... }`
            when the password no longer meets the org's policy.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenPair'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/refresh:
    post:
      summary: Exchange refresh token for new token pair
      description: >-
        Rotates the refresh token's session slot (one per signed-in device). Presenting a
        refresh token that was already rotated revokes that device's session; other
        devices stay signed in. `activity: user` (real input since the client's last
        refresh) restarts an interactive session's idle clock; `passive` or no value
        (a background poll) renews the token without moving it. A refresh past the idle
        deadline or maximum age answers 401 SESSION_EXPIRED with
        `details.reason` (`idle` | `max-age` | `credential-end`) and, for `idle`,
        `details.idleTimeoutMinutes`.
      operationId: refresh
      tags: [Authentication]
      security:
        - refreshToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string, description: Non-browser callers; a browser presents the pb_refresh cookie }
                activity: { type: string, enum: [user, passive], default: passive }
      responses:
        '200':
          description: Tokens refreshed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenPair'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /auth/logout:
    post:
      summary: Sign this device out
      description: >-
        Revokes the refresh session the access token belongs to. Other devices stay signed
        in; POST /user/tokens/revoke-all signs out everywhere.
      operationId: logout
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------------------
  # OAuth
  # ---------------------------------------------------------------------------
  /auth/oauth/providers:
    get:
      summary: List enabled OAuth providers
      operationId: getOAuthProviders
      tags: [OAuth]
      security: []
      responses:
        '200':
          description: Providers listed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          providers:
                            type: array
                            items: { $ref: '#/components/schemas/OAuthProvider' }

  /auth/oauth/{provider}/url:
    get:
      summary: Get OAuth authorization URL
      operationId: getOAuthUrl
      tags: [OAuth]
      security: []
      parameters:
        - $ref: '#/components/parameters/provider'
      responses:
        '200':
          description: Authorization URL
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          url: { type: string, format: uri }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/oauth/{provider}/callback:
    post:
      summary: Exchange OAuth code for platform tokens
      operationId: handleOAuthCallback
      tags: [OAuth]
      security: []
      parameters:
        - $ref: '#/components/parameters/provider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, state]
              properties:
                code: { type: string, description: Authorization code from OAuth provider }
                state:
                  type: string
                  description: One-time CSRF state minted by GET /auth/oauth/{provider}/url
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenPair'
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------------------
  # User (current user profile)
  # ---------------------------------------------------------------------------
  /user/profile:
    get:
      summary: Get current user profile
      operationId: getProfile
      tags: [User]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: '#/components/schemas/UserProfile'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

    patch:
      summary: Update current user profile
      description: >-
        CHANGING the email requires a step-up token (`X-Step-Up-Token`), clears
        email verification, and emails a notice to the previous address. A
        username edit, or re-sending the current address, needs no step-up.
      operationId: updateProfile
      tags: [User]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                email: { type: string, format: email }
              minProperties: 1
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: '#/components/schemas/UserProfile'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /user/account:
    delete:
      summary: Delete current user account
      description: Requires a step-up token (`X-Step-Up-Token`). Orgs the user solely owns are soft-deleted with it.
      operationId: deleteAccount
      tags: [User]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MessageResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          orgsDeleted:
                            type: array
                            items:
                              type: object
                              properties:
                                orgId: { type: string }
                                name: { type: string }
                                purgeAfter: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /user/change-password:
    post:
      summary: Change password
      description: Requires a step-up token (`X-Step-Up-Token`). Revokes the user's access keys.
      operationId: changePassword
      tags: [User]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password }
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MessageResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessKeysRevoked: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /user/generate-token:
    post:
      summary: Generate new API token pair
      operationId: generateToken
      tags: [User]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tokens generated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenPair'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------------
  # Organization
  # ---------------------------------------------------------------------------
  /organization:
    get:
      summary: Get current user's organization
      operationId: getMyOrganization
      tags: [Organization]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Organization retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          organization:
                            $ref: '#/components/schemas/Organization'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /organization/{id}:
    get:
      summary: Get organization by ID
      operationId: getOrganizationById
      tags: [Organization]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/orgId'
      responses:
        '200':
          description: Organization retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OrganizationDetail'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

    put:
      summary: Update organization (platform `orgs:manage`, step-up, MFA-grade session)
      operationId: updateOrganization
      tags: [Organization]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/orgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 100 }
                slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
                description: { type: string, maxLength: 500 }
              minProperties: 1
      responses:
        '200':
          description: Organization updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MessageResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          organization:
                            $ref: '#/components/schemas/Organization'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

    delete:
      summary: Delete organization (platform `orgs:manage`, step-up, MFA-grade session)
      operationId: deleteOrganization
      tags: [Organization]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/orgId'
      responses:
        '200':
          description: Organization deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /organization/{id}/members:
    get:
      summary: List organization members
      operationId: getOrganizationMembers
      tags: [Organization]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/orgId'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
        - name: search
          in: query
          schema: { type: string }
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/OrgRole' }
        - name: status
          in: query
          schema: { type: string, enum: [active, inactive] }
      responses:
        '200':
          description: Members listed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          organizationId: { type: string }
                          organizationName: { type: string }
                          ownerId: { type: string }
                          members:
                            type: array
                            items: { $ref: '#/components/schemas/Member' }
                          pagination:
                            $ref: '#/components/schemas/OffsetPagination'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

    post:
      summary: Add member to organization (`members:manage`)
      operationId: addMemberToOrganization
      tags: [Organization]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/orgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId: { type: string }
                email: { type: string, format: email }
              description: Provide userId or email (at least one required)
      responses:
        '200':
          description: Member added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /organization/{id}/members/{userId}:
    delete:
      summary: Remove member from organization (`members:manage`)
      description: Membership roles change through the org's Roles (`/organization/{id}/roles/...`), not here.
      operationId: removeMember
      tags: [Organization]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/orgId'
        - $ref: '#/components/parameters/memberUserId'
      responses:
        '200':
          description: Member removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }


  /organization/{id}/transfer-owner:
    patch:
      summary: Transfer organization ownership (`org_settings:write`, step-up, MFA-grade session)
      operationId: transferOrganizationOwnership
      tags: [Organization]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/orgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newOwnerId]
              properties:
                newOwnerId: { type: string }
      responses:
        '200':
          description: Ownership transferred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------------
  # Invitations
  # ---------------------------------------------------------------------------
  /invitation:
    get:
      summary: List organization invitations (`invitations:manage`)
      operationId: listInvitations
      tags: [Invitation]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, accepted, expired, revoked] }
        - name: invitationType
          in: query
          schema: { type: string, enum: [email, oauth, any] }
        - name: role
          in: query
          schema: { type: string, enum: [admin, member] }
        - name: search
          in: query
          schema: { type: string }
          description: Case-insensitive email substring
        - name: targetOrgId
          in: query
          schema: { type: string }
          description: List a TEAM of the caller's organization instead of the organization itself (the same reach as `targetOrgId` on POST /invitation/send).
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Invitations listed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          invitations:
                            type: array
                            items: { $ref: '#/components/schemas/InvitationSummary' }
                          pagination:
                            $ref: '#/components/schemas/OffsetPagination'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /invitation/send:
    post:
      summary: Invite one or many addresses (`invitations:manage`)
      operationId: sendInvitation
      tags: [Invitation]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendInvitationRequest'
      responses:
        '200':
          description: >-
            Per-address outcome. `acceptUrl` is returned only when the email was not delivered —
            the one response that may carry the invitation token.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          sent:
                            type: array
                            items:
                              type: object
                              properties:
                                email: { type: string }
                                delivery: { type: string }
                                acceptUrl: { type: string, format: uri }
                          failed:
                            type: array
                            items:
                              type: object
                              properties:
                                email: { type: string }
                                reason: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /invitation/accept:
    post:
      summary: Accept invitation (authenticated user)
      operationId: acceptInvitation
      tags: [Invitation]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: Invitation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /invitation/accept-oauth:
    post:
      summary: Accept invitation via OAuth (creates user if needed)
      operationId: acceptInvitationViaOAuth
      tags: [Invitation]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, oauthProvider, code, state]
              properties:
                token: { type: string }
                oauthProvider:
                  type: string
                  enum: [google, github, facebook, microsoft, gitlab, linkedin]
                  description: The provider the code came from; it must be enabled and allowed by the invitation.
                code:
                  type: string
                  description: OAuth authorization code from the provider redirect (server-side exchanged; the caller never supplies the profile).
                state:
                  type: string
                  description: One-time CSRF state minted by GET /auth/oauth/{provider}/url and returned on the provider redirect.
      responses:
        '200':
          description: Invitation accepted via OAuth
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /invitation/{token}:
    get:
      summary: Get invitation details by token (public)
      operationId: getInvitation
      tags: [Invitation]
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Invitation details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          invitation:
                            $ref: '#/components/schemas/InvitationDetail'
        '404': { $ref: '#/components/responses/NotFound' }

  /invitation/{invitationId}:
    delete:
      summary: Revoke pending invitation (`invitations:manage`)
      operationId: revokeInvitation
      tags: [Invitation]
      security:
        - bearerAuth: []
      parameters:
        - name: invitationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Invitation revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /invitation/{invitationId}/resend:
    post:
      summary: Resend invitation email (`invitations:manage`)
      operationId: resendInvitation
      tags: [Invitation]
      security:
        - bearerAuth: []
      parameters:
        - name: invitationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Invitation resent
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MessageResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          expiresAt: { type: string, format: date-time }
                          delivery: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------------------------------------------------------------------------
  # Admin
  # ---------------------------------------------------------------------------
  /users:
    get:
      summary: List users (`members:manage`; scoped to the caller's org unless platform admin)
      operationId: listAllUsers
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - name: organizationId
          in: query
          schema: { type: string }
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/OrgRole' }
        - name: search
          in: query
          schema: { type: string }
          description: Search by username or email
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Users listed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          users:
                            type: array
                            items: { $ref: '#/components/schemas/UserProfile' }
                          pagination:
                            $ref: '#/components/schemas/OffsetPagination'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users/{id}:
    get:
      summary: Get user by ID (`members:manage`; a member of the caller's org unless platform admin)
      operationId: getUserById
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '200':
          description: User retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: '#/components/schemas/UserProfile'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

    put:
      summary: Update user by ID (`members:manage`, step-up, MFA-grade session)
      operationId: updateUserById
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/userId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                email: { type: string, format: email }
                role:
                  type: string
                  enum: [admin, member]
                  description: '`owner` is refused — ownership moves only by transfer'
                organizationId: { type: string, nullable: true }
                password: { type: string, format: password, minLength: 8 }
              minProperties: 1
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MessageResponse'
                  - type: object
                    properties:
                      user: { $ref: '#/components/schemas/UserProfile' }
                      changes:
                        type: array
                        items: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

    delete:
      summary: Delete user by ID (`members:manage`, step-up, MFA-grade session)
      operationId: deleteUserById
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '200':
          description: User deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /organizations:
    get:
      summary: List all organizations (system-org `orgs:read`, MFA-grade session)
      operationId: listAllOrganizations
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: tier
          in: query
          schema: { type: string }
        - name: ids
          in: query
          schema: { type: string }
          description: Comma-separated org ids to resolve (at most 100)
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Organizations listed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          organizations:
                            type: array
                            items: { $ref: '#/components/schemas/OrganizationDetail' }
                          pagination:
                            $ref: '#/components/schemas/OffsetPagination'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

# =============================================================================
# Components
# =============================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token
    refreshToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT refresh token from login response

  parameters:
    orgId:
      name: id
      in: path
      required: true
      description: Organization ID
      schema: { type: string }
    userId:
      name: id
      in: path
      required: true
      description: User ID
      schema: { type: string }
    memberUserId:
      name: userId
      in: path
      required: true
      description: User ID of the member
      schema: { type: string }
    offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1 }
    provider:
      name: provider
      in: path
      required: true
      description: OAuth provider
      schema: { $ref: '#/components/schemas/OAuthProvider' }

  schemas:
    SuccessResponse:
      type: object
      required: [success, statusCode]
      properties:
        success: { type: boolean, enum: [true] }
        statusCode: { type: integer }

    MessageResponse:
      type: object
      required: [success, statusCode, message]
      properties:
        success: { type: boolean, enum: [true] }
        statusCode: { type: integer }
        message: { type: string }

    ErrorResponse:
      type: object
      required: [success, statusCode, message]
      properties:
        success: { type: boolean, enum: [false] }
        statusCode: { type: integer }
        message: { type: string }
        code: { type: string }

    TokenPair:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string, description: Non-browser callers only — a browser's rides in the pb_refresh cookie }
        expiresIn: { type: integer, description: Access-token lifetime in seconds }
        session:
          type: object
          description: INTERACTIVE sessions only — the idle state the server enforces.
          properties:
            idleTimeoutMinutes:
              type: integer
              description: Effective idle timeout — the strictest of SESSION_IDLE_TIMEOUT_MINUTES and the org's session policy
            idleExpiresAt:
              type: string
              format: date-time
              description: The session's last real activity plus the idle timeout; a refresh after it is 401 SESSION_EXPIRED

    OAuthProvider:
      type: string
      enum: [google, github, facebook, microsoft, gitlab, linkedin]

    OrgRole:
      type: string
      description: Coarse per-org label, derived from the member's Roles
      enum: [owner, admin, member]

    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string, minLength: 2, maxLength: 30 }
        email: { type: string, format: email }
        password: { type: string, format: password }
        organizationName:
          type: string
          minLength: 2
          maxLength: 100
        planId: { type: string }
        invitationToken:
          type: string
          description: Registering to accept an invitation — the inviting org's password policy applies

    RegisterResult:
      type: object
      properties:
        sub: { type: string, description: User ID }
        email: { type: string }
        role: { $ref: '#/components/schemas/OrgRole' }
        organizationId: { type: string, nullable: true }
        organizationName: { type: string, nullable: true }

    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier: { type: string, description: Username or email }
        password: { type: string, format: password }

    UserProfile:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        email: { type: string, format: email }
        role:
          allOf: [{ $ref: '#/components/schemas/OrgRole' }]
          nullable: true
          description: Role in the active org
        isSuperAdmin: { type: boolean }
        isEmailVerified: { type: boolean }
        organizationId: { type: string, nullable: true }
        organizationName: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Organization:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        owner: { $ref: '#/components/schemas/UserSummary' }
        members:
          type: array
          items: { $ref: '#/components/schemas/UserSummary' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    OrganizationDetail:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        memberCount: { type: integer }
        ownerId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    UserSummary:
      type: object
      properties:
        _id: { type: string }
        username: { type: string }
        email: { type: string }
        role: { type: string }

    Member:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        email: { type: string }
        role: { $ref: '#/components/schemas/OrgRole' }
        isEmailVerified: { type: boolean }
        isOwner: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SendInvitationRequest:
      type: object
      required: [emails]
      properties:
        emails:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, format: email }
        role: { type: string, enum: [admin, member], default: member }
        roleIds:
          type: array
          maxItems: 50
          items: { type: string }
          description: Roles assigned on acceptance, bounded by the inviter's own ceiling
        invitationType: { type: string, enum: [email, oauth, any], default: any }
        allowedOAuthProviders:
          type: array
          items: { $ref: '#/components/schemas/OAuthProvider' }
        targetOrgId:
          type: string
          description: Invite into a team beneath the caller's org

    InvitationSummary:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        role: { type: string }
        status: { type: string, enum: [pending, accepted, expired, revoked] }
        expiresAt: { type: string, format: date-time }
        invitationType: { type: string, enum: [email, oauth, any] }
        allowedOAuthProviders:
          type: array
          items: { type: string }

    InvitationDetail:
      type: object
      properties:
        email: { type: string }
        role: { type: string }
        status: { type: string, enum: [pending, accepted, expired, revoked] }
        expiresAt: { type: string, format: date-time }
        organization: { type: object }
        invitedBy: { type: object }
        isValid: { type: boolean }
        invitationType: { type: string, enum: [email, oauth, any] }
        allowedOAuthProviders:
          type: array
          items: { type: string }
        canAcceptViaEmail: { type: boolean }
        acceptProviders:
          type: array
          description: OAuth providers this invitation can be accepted with — enabled in this deployment and allowed by the invitation (empty when email-only or no longer valid).
          items: { type: string, enum: [google, github, facebook, microsoft, gitlab, linkedin] }

    HealthCheckResponse:
      type: object
      properties:
        status: { type: string, enum: [healthy, unhealthy] }
        service: { type: string }
        timestamp: { type: string, format: date-time }
        dependencies:
          type: object
          additionalProperties: { type: string, enum: [connected, disconnected] }

    OffsetPagination:
      type: object
      properties:
        total: { type: integer }
        offset: { type: integer }
        limit: { type: integer }
        hasMore: { type: boolean }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Resource conflict (duplicate)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

security:
  - bearerAuth: []

tags:
  - name: Health
    description: Service health and monitoring
  - name: Authentication
    description: Registration, login, logout, token refresh
  - name: OAuth
    description: Social sign-in (Google, GitHub, GitLab, Microsoft, LinkedIn, Facebook)
  - name: User
    description: Current user profile management
  - name: Organization
    description: Organization CRUD, members, quotas, ownership
  - name: Invitation
    description: Organization invitation management
  - name: Admin
    description: System admin user and organization management
